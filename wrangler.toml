# wrangler.toml 은 저장소 루트에 둔다 (Cloudflare 빌드가 루트에서 실행되므로)
name = "sonhaesajeongsa"
main = "worker/worker.js"
compatibility_date = "2026-01-01"
account_id = "c464bbbbdc93f28f182efd222fb1b10e"
workers_dev = true   # 커스텀 도메인을 붙이기 전까지는 workers.dev 주소로 연다

# 커스텀 도메인은 준비되면 아래를 켠다
# routes = [
#   { pattern = "example.com", custom_domain = true },
# ]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "sonhaesajeongsa-db"
database_id = "b0a295e4-b14b-43ea-b114-d8baafd5fcd4"

[[kv_namespaces]]
binding = "KV"
id = "14122c15b6a5494a8153b8046eca615f"
