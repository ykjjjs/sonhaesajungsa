<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>손해사정사 2차 기출</title>
<meta name="theme-color" content="#0A0A0C">
<meta name="description" content="손해사정사 2차 기출 — 신체 · 재물 · 차량 3종별 9과목, 답안 작성과 모범답안">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#0A0A0C; --surf:#141417; --surf2:#101013;
  --edge:#232328; --lift:#2E2E35;
  --tx:#F5F5F7; --tx2:#D6DBE3; --tx3:#9AA3B0; --tx4:#646C7A; --tx5:#3A404B;
  --sap:#1552D6; --sap2:#3E9BFF; --sap3:#8FD0FF;
  --grad:linear-gradient(135deg,#06153F 0%,#0A2A6E 26%,#1552D6 62%,#3E9BFF 100%);
  --glass:linear-gradient(160deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 42%,rgba(255,255,255,0) 100%);
  --ok:#4CC38A; --warn:#C9903A; --bad:#E0574F; --violet:#9B8CFF; --teal:#4BC0C8;
  --r:14px; --rp:999px;
  --f:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'SF Pro Display','Apple SD Gothic Neo',system-ui,sans-serif;
  --m:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.28,.11,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx2);font-family:var(--f);font-size:16.5px;
  line-height:1.72;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sap2);outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}

/* ── 머리 ── */
header{border-bottom:1px solid var(--edge);background:var(--surf2)}
.htop{display:flex;align-items:flex-end;gap:14px;padding:26px 0 18px;flex-wrap:wrap}
.kick{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--sap2);
  text-transform:uppercase;margin-bottom:4px}
h1{font-size:clamp(21px,3.4vw,28px);font-weight:800;letter-spacing:-.03em;color:var(--tx);line-height:1.25}
.hsp{flex:1}
.tlink{color:var(--tx3);font-size:13.5px;font-weight:700;text-decoration:none;
  padding:8px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--surf);
  white-space:nowrap;transition:border-color .18s var(--ease),color .18s var(--ease)}
.tlink:hover{border-color:var(--lift);color:var(--tx)}
.tlink.pay{color:#fff;background:var(--grad);border-color:transparent}

/* ── 고르는 줄 ── */
.picks{display:flex;flex-direction:column;gap:9px;padding:0 0 20px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.row>.lab{font-size:11.5px;font-weight:800;color:var(--tx4);letter-spacing:.08em;
  min-width:38px}
.chip{border:1px solid var(--edge);background:var(--surf);color:var(--tx3);
  font-size:13px;font-weight:700;padding:6px 12px;border-radius:var(--rp);cursor:pointer;
  transition:all .16s var(--ease);white-space:nowrap}
.chip:hover{border-color:var(--lift);color:var(--tx2)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;
  box-shadow:0 2px 12px -4px rgba(21,82,214,.7)}
.chip.lock{opacity:.5}
.chip .lk{font-size:10px;margin-left:4px}
.q.qlock .locked{margin-top:10px}

/* ── 과목지 ── */
.paper{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.paper h2{font-size:19px;font-weight:800;color:var(--tx);letter-spacing:-.02em}
.paper .meta{font-size:12.5px;color:var(--tx4);font-weight:600}
.timer{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--m);
  font-size:13px;color:var(--tx3)}
.timer b{color:var(--tx);font-size:15px;font-variant-numeric:tabular-nums}
.tbtn{border:1px solid var(--edge);background:var(--surf);color:var(--tx3);border-radius:8px;
  padding:4px 9px;font-size:12px;font-weight:700;cursor:pointer}
.tbtn:hover{color:var(--tx)}

/* ── 문항 ── */
.q{background:var(--surf);border:1px solid var(--edge);border-radius:var(--r);
  padding:18px 18px 14px;margin:12px 0;position:relative;overflow:hidden}
.q::before{content:'';position:absolute;inset:0 0 auto;height:1px;background:var(--glass)}
.qh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.qno{width:26px;height:26px;border-radius:8px;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.pts{font-size:11.5px;font-weight:800;color:var(--sap3);border:1px solid rgba(62,155,255,.32);
  border-radius:var(--rp);padding:2px 9px;background:rgba(62,155,255,.08)}
.qsp{flex:1}
.body{white-space:pre-wrap;color:var(--tx2);font-size:16px;line-height:1.78;
  word-break:keep-all;overflow-wrap:anywhere}
.body .tb,.model .ans .tb{display:block;font-family:var(--m);font-size:13.5px;background:var(--surf2);
  border:1px solid var(--edge);border-radius:10px;padding:10px 12px;margin:8px 0;
  white-space:pre;overflow-x:auto;color:var(--tx3)}

/* ── 답안 ── */
.tools{display:flex;gap:7px;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--edge);background:var(--surf2);color:var(--tx3);
  border-radius:10px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;
  transition:all .16s var(--ease)}
.btn:hover{border-color:var(--lift);color:var(--tx)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.cnt{font-size:12px;color:var(--tx4);font-family:var(--m);margin-left:auto}
textarea{width:100%;min-height:150px;margin-top:10px;background:var(--surf2);
  border:1px solid var(--edge);border-radius:12px;padding:12px 14px;color:var(--tx2);
  font-size:15px;line-height:1.75;resize:vertical;outline:none;
  transition:border-color .18s var(--ease)}
textarea:focus{border-color:var(--sap2);box-shadow:0 0 0 3px rgba(62,155,255,.13)}
textarea::placeholder{color:var(--tx5)}

/* ── 모범답안 ── */
.model{margin-top:12px;border-top:1px dashed var(--edge);padding-top:12px;display:none}
.model.open{display:block}
.mtag{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--tx4);
  text-transform:uppercase;margin-bottom:8px}
.model .plan{background:rgba(155,140,255,.08);border-left:2px solid var(--violet);
  border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:12px;font-size:14.5px;color:var(--tx2)}
.model .ans{font-size:15.5px;color:var(--tx2)}
.model .ans p{margin:0 0 9px}
.model .ans ul,.model .ans ol{margin:0 0 9px 20px}
.model .ans li{margin:2px 0}
.model .ans b{color:var(--tx)}
.model .ans h4{font-size:15px;color:var(--tx);margin:12px 0 5px;font-weight:800}
.model .ans h3{font-size:16px;color:var(--teal);margin:22px 0 8px;font-weight:800;
  border-top:1px solid var(--edge);padding-top:15px}
.model .ans h3:first-child{margin-top:0;border-top:0;padding-top:0}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.key{font-size:12px;font-weight:700;color:var(--teal);border:1px solid rgba(75,192,200,.3);
  background:rgba(75,192,200,.08);border-radius:var(--rp);padding:3px 10px}
.key.hit{background:var(--ok);border-color:transparent;color:#04150C}
.laws{margin-top:8px;font-size:12.5px;color:var(--tx4);font-family:var(--m)}
.none{margin-top:12px;border-top:1px dashed var(--edge);padding-top:11px;
  font-size:13.5px;color:var(--tx4)}

/* ── 자동 채점 ── */
.gsc{margin-left:8px;font-family:var(--m);font-size:12px;font-weight:800;padding:2px 9px;border-radius:var(--rp);
  background:var(--surf2);border:1px solid var(--edge);color:var(--tx3)}
.gsc.ok{color:var(--ok);border-color:rgba(76,195,138,.45)}
.gsc.mid{color:var(--warn);border-color:rgba(201,144,58,.45)}
.gsc.low{color:var(--bad);border-color:rgba(224,87,79,.45)}
.grade{display:none}
.grade.open{display:block;margin-top:12px;border-top:1px dashed var(--edge);padding-top:12px}
.gtop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gtop b{font-family:var(--m);font-size:26px;font-weight:800;color:var(--tx);letter-spacing:-.02em}
.gm{font-size:13px;color:var(--tx4)}
.gr{font-size:12px;font-weight:800;padding:2px 10px;border-radius:var(--rp)}
.gr.ok{background:rgba(76,195,138,.16);color:var(--ok)}
.gr.mid{background:rgba(201,144,58,.16);color:var(--warn)}
.gr.low{background:rgba(224,87,79,.16);color:var(--bad)}
.gsp{flex:1}
.gwhen{font-size:11.5px;color:var(--tx5);font-family:var(--m)}
.gbars{display:grid;gap:7px;margin:12px 0 2px}
.gb{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;font-size:12.5px;color:var(--tx4)}
.gb .gl{color:var(--tx3);font-weight:700}
.gb .tr{height:7px;border-radius:99px;background:var(--edge);overflow:hidden}
.gb .tr i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.gb .gv{font-family:var(--m);font-size:11.5px;white-space:nowrap}
.gmiss{margin-top:12px;font-size:12.5px;color:var(--tx4)}
.gmiss b{display:block;color:var(--tx3);margin-bottom:6px;font-size:12px}
.gmiss .keys{margin-top:0}
.key.part{background:rgba(201,144,58,.18);border-color:rgba(201,144,58,.42);color:var(--warn)}
.key.miss{background:rgba(224,87,79,.10);border-color:rgba(224,87,79,.38);color:var(--bad)}
.gnote{margin-top:12px;font-size:12px;color:var(--tx5);line-height:1.75}
@media(max-width:640px){.gb{grid-template-columns:60px 1fr}.gb .gv{grid-column:2;text-align:right}}

/* ── 힌트 ── */
.hint2{display:none}
.hint2.open{display:block;margin-top:12px;border-top:1px dashed var(--edge);padding-top:12px}
.htag{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--warn);margin-bottom:10px}
.hi{margin-bottom:13px}
.hi h5{margin:0 0 6px;font-size:12.5px;font-weight:800;color:var(--tx2)}
.hi > div{font-size:14px;color:var(--tx3);line-height:1.72}
.hcho{display:flex;flex-wrap:wrap;gap:6px}
.hcho span{font-family:var(--m);font-size:13px;letter-spacing:.18em;color:var(--warn);
  background:rgba(201,144,58,.10);border:1px solid rgba(201,144,58,.32);border-radius:var(--rp);padding:3px 11px}
.keys.bank{margin-top:2px}
.hnote{margin:8px 0 0;font-size:12.5px;color:var(--tx4);line-height:1.65}
.hnote b{color:var(--ok);font-family:var(--m);font-weight:800}

/* ── 단계 · 지도 · 재작성 ── */
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px}
.steps .st{font-size:11.5px;font-weight:700;color:var(--tx5);background:var(--surf2);
  border:1px solid var(--edge);border-radius:var(--rp);padding:3px 10px}
.steps .st.on{color:#fff;background:var(--grad);border-color:transparent}
.steps .st.done{color:var(--ok);border-color:rgba(76,195,138,.42)}
.gdiff{font-family:var(--m);font-size:11.5px;color:var(--sap3);background:rgba(62,155,255,.12);
  border-radius:var(--rp);padding:2px 9px}
.pass{margin-top:14px;border:1px solid var(--edge);border-radius:12px;padding:12px 14px;background:var(--surf2)}
.pass.ok{border-color:rgba(76,195,138,.5);background:rgba(76,195,138,.08)}
.ptag{font-size:12px;font-weight:800;color:var(--tx3);margin-bottom:8px}
.pass.ok .ptag{color:var(--ok)}
.pass ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.pass li{font-size:13px;color:var(--tx4);display:flex;gap:8px;align-items:baseline}
.pass li b{color:var(--tx5);font-family:var(--m);width:12px}
.pass li.y{color:var(--tx2)}
.pass li.y b{color:var(--ok)}
.pass li span{margin-left:auto;font-family:var(--m);font-size:11.5px;color:var(--tx5)}
.pmsg{margin-top:9px;font-size:12.5px;color:var(--tx4);line-height:1.65}
.coach{display:none}
.coach.open{display:block;margin-top:12px;border-top:1px dashed var(--edge);padding-top:12px}
.ctag{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--sap2);margin-bottom:10px}
.ci{margin-bottom:13px}
.ci h5{margin:0 0 4px;font-size:13px;font-weight:800;color:var(--tx2)}
.ci > div{font-size:14px;color:var(--tx3);line-height:1.72}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.clist li{background:var(--surf2);border:1px solid var(--edge);border-radius:10px;padding:9px 11px}
.clist li b{display:block;color:var(--bad);font-size:13px;margin-bottom:3px}
.clist li span{display:block;font-size:13.5px;color:var(--tx3);line-height:1.65}
.rwbtn{margin-top:2px}
.rw{display:none}
.rw.open{display:block;margin-top:14px;border-top:1px dashed var(--edge);padding-top:12px}
.rwtag{font-size:12.5px;color:var(--tx4)}

/* ── 잠김 ── */
.locked{background:var(--surf2);border:1px dashed var(--lift);border-radius:var(--r);
  padding:28px 20px;text-align:center;color:var(--tx4);font-size:14.5px;margin:14px 0}
.locked b{display:block;color:var(--tx2);font-size:16px;font-weight:800;margin-bottom:6px}
.locked a{color:var(--sap2);font-weight:700;text-decoration:none}

.foot{padding:34px 0 20px;font-size:12.5px;color:var(--tx5);line-height:1.8;
  border-top:1px solid var(--edge);margin-top:34px}
@media(max-width:640px){
  body{font-size:16px}
  .q{padding:15px 14px 12px}
  .row>.lab{min-width:auto;width:100%}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="htop">
      <div>
        <div class="kick">SONHAE · 2nd ROUND</div>
        <h1>손해사정사 2차 기출</h1>
      </div>
      <div class="hsp"></div>
      <a class="tlink" href="./index.html">1차 기출</a>
      <a class="tlink" href="./book.html">전자교재</a>
      <a class="tlink pay" id="payLink" href="./index.html?pay=1">💳 이용권 결제</a>
    </div>
    <div class="picks">
      <div class="row"><span class="lab">종별</span><span id="trackRow"></span></div>
      <div class="row"><span class="lab">회차</span><span id="roundRow"></span></div>
      <div class="row"><span class="lab">과목</span><span id="subjRow"></span></div>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer class="wrap foot">
  손해사정사 제2차 시험문제는 보험개발원이 공개한 원본을 옮긴 것이다.
  모범답안은 이 서비스가 직접 작성한 것으로, 시행처의 공식 정답이 아니다.
  2차는 논술형이어서 공식 정답이 공개되지 않는다.
</footer>

<script>
const EXAM2 = __EXAM2__;
const FREE_ROUND2 = __FREE_ROUND2__;
const FREE_N2 = __FREE_N2__;   // 결제 전 예시 문항 수
const TRACKS = ['신체', '재물', '차량'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 밤모드 고정 — 낮모드는 없앴다 ── */
document.documentElement.dataset.theme = 'dark';

/* ── 답안 보관 ── */
const KEY = 'sonsa2.draft';
function drafts() {
  try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; }
}
function saveDraft(id, text) {
  const d = drafts();
  if (text.trim()) d[id] = text; else delete d[id];
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
}

/* ══ 자동 채점 ══════════════════════════════════════════════
   2차는 논술형이라 시행처가 정답을 공개하지 않는다. 이 채점기는 '모범답안이 갖춘 것을
   내 답안이 얼마나 담았는가'를 낱말 단위로 대조해 배점 대비 점수를 낸다. 축은 셋이다.
     ① 핵심 논점(a.keys)  ② 근거 법령(a.law)  ③ 숫자·수치(모범답안 속 금액·기간·비율)
   가중치는 있는 축끼리 나눈다 — 법령이 없는 문항은 논점과 숫자로만 잰다.
   논점 하나는 그 안의 낱말이 모두 나오면 적중, 60% 이상이면 부분 적중으로 절반만 준다.
   낱말이 겹치는지만 보므로 논리 전개·구성·문장력은 재지 못한다. 참고용 점수다. */
const SKEY2 = 'sonsa2.score';
function scores() {
  try { return JSON.parse(localStorage.getItem(SKEY2) || '{}'); } catch (e) { return {}; }
}
function saveScore(id, rec) {
  const d = scores();
  if (rec) d[id] = rec; else delete d[id];
  try { localStorage.setItem(SKEY2, JSON.stringify(d)); } catch (e) {}
}
const compact2 = s => String(s == null ? '' : s).toLowerCase().replace(/[^0-9a-z가-힣%]/g, '');
const JOSA2 = /(으로써|으로서|에서는|이라는|이라고|으로|에서|에게|까지|부터|보다|처럼|하여|하고|하는|한다|된다|되는|이다|은|는|이|가|을|를|의|에|와|과|도|만|로)$/;
const STOP2 = new Set(('그리고 또는 다만 경우 해당 관한 대한 따른 따라 있다 없다 한다 된다 여부 사항 내용 설명 기술 서술 '
  + '각각 모두 이상 이하 미만 초과 기준 방법 대하여 관하여 것을 것이 때문 그러나 또한 이때 아니 하지').split(' '));
/* 논점 한 줄에서 뜻을 지고 있는 낱말만 뽑는다 — 조사를 떼고, 흔한 말은 버린다 */
function coreToks(s) {
  const out = [];
  for (const w of String(s).match(/[가-힣]{2,}|[A-Za-z]{2,}|\d[\d,.]*%?/g) || []) {
    let t = w.replace(/,/g, '');
    if (/^[가-힣]/.test(t) && t.length > 2) t = t.replace(JOSA2, '');
    t = t.toLowerCase();
    if (t.length < 2 || STOP2.has(t)) continue;
    out.push(t);
  }
  return [...new Set(out)];
}
function keyHit(key, hay) {
  const ts = coreToks(key);
  if (!ts.length) { const c = compact2(key); return { r: c && hay.includes(c) ? 1 : 0, got: 0, tot: 1 }; }
  const got = ts.filter(t => hay.includes(t)).length;
  const cov = got / ts.length;
  return { r: cov > .999 ? 1 : cov >= .6 ? .5 : 0, got, tot: ts.length, cov };
}
function modelText(a) {
  const d = document.createElement('div');
  d.innerHTML = (a.ans || '') + ' ' + (a.plan || '');
  return d.textContent || '';
}

  const tr = $('#trackRow'), rr = $('#roundRow'), sr = $('#subjRow');
  tr.textContent = rr.textContent = sr.textContent = '';

  el.innerHTML = '<div class="qh"><span class="qno">' + q.no + '</span>' +
    '<span class="pts">' + (q.points || 0) + '점</span><span class="qsp"></span></div>' +
    '<div class="locked"><b>🔒 이용권이 있어야 열립니다</b>문제와 모범답안은 이용권을 켜면 모두 열립니다. ' +
    '<a href="./index.html?pay=1">💳 이용권 결제하러 가기 →</a></div>';
  return el;
}

function qCard(p, q) {
  const id = p.round + '|' + p.subject + '|' + q.no;
  const el = document.createElement('article');
  el.className = 'q';

  const h = document.createElement('div');
  h.className = 'qh';
  h.innerHTML = '<span class="qno">' + q.no + '</span>' +
    '<span class="pts">' + (q.points || 0) + '점</span><span class="qsp"></span>';
  const badge = document.createElement('span');
  badge.className = 'gsc';
  badge.hidden = true;
  h.appendChild(badge);
  el.appendChild(h);

  const b = document.createElement('div');
  b.className = 'body';
  b.innerHTML = bodyHTML(q.body || '');
  el.appendChild(b);

  const steps = document.createElement('div');
  steps.className = 'steps';
  el.appendChild(steps);

  const ta = document.createElement('textarea');
  ta.placeholder = '여기에 답안을 적어 보세요. 적은 내용은 이 기기에만 남습니다.';
  ta.value = drafts()[id] || '';
  el.appendChild(ta);

  const tools = document.createElement('div');
  tools.className = 'tools';
  const bh = document.createElement('button');
  bh.className = 'btn';
  bh.textContent = '힌트 1단계 보기';
  bh.disabled = !q.a;
  const bs = document.createElement('button');
  bs.className = 'btn pri';
  bs.textContent = '자동 채점';
  bs.disabled = !(q.a && q.a.keys && q.a.keys.length);
  const bm = document.createElement('button');
  bm.className = 'btn';
  bm.textContent = q.a ? '모범답안 보기' : '모범답안 준비 중';
  bm.disabled = !q.a;
  const bc = document.createElement('button');
  bc.className = 'btn';
  bc.textContent = '지우기';
  const cnt = document.createElement('span');
  cnt.className = 'cnt';
  tools.append(bh, bs, bm, bc, cnt);
  el.appendChild(tools);

  const hint = document.createElement('div');
  hint.className = 'hint2';
  el.appendChild(hint);

  const model = document.createElement('div');
  model.className = q.a ? 'model' : 'none';
  if (q.a) {
    let html = '<div class="mtag">모범답안</div>';
    if (q.a.plan) html += '<div class="plan">' + esc(q.a.plan) + '</div>';
    html += '<div class="ans">' + (q.a.ans || '') + '</div>';
    if (q.a.law && q.a.law.length)
      html += '<div class="laws">근거 · ' + q.a.law.map(esc).join(' / ') + '</div>';
    if (q.a.keys && q.a.keys.length)
      html += '<div class="keys">' + q.a.keys.map(
        k => '<span class="key" data-k="' + esc(k) + '">' + esc(k) + '</span>').join('') + '</div>';
    model.innerHTML = html;
  } else {
    model.textContent = '이 문항의 모범답안은 아직 쓰는 중입니다. 배점과 물음의 구성을 보고 뼈대부터 잡아 두세요.';
  }
  el.appendChild(model);

  const grade = document.createElement('div');
  grade.className = 'grade';
  el.appendChild(grade);

  const coach = document.createElement('div');
  coach.className = 'coach';
  el.appendChild(coach);

  const rw = document.createElement('div');
  rw.className = 'rw';
  const rwtag = document.createElement('div');
  rwtag.className = 'rwtag';
  rwtag.textContent = '재작성 — 지도를 반영해 다시 씁니다. 처음 답안은 위에 그대로 둡니다.';
  const ta2 = document.createElement('textarea');
  ta2.placeholder = '지도를 보고 다시 써 보세요. 다 쓰면 「재작성 채점」을 누릅니다.';
  ta2.value = drafts()[id + '#2'] || '';
  const rwt = document.createElement('div');
  rwt.className = 'tools';
  const bg2 = document.createElement('button');
  bg2.className = 'btn pri';
  bg2.textContent = '재작성 채점';
  const bcp = document.createElement('button');
  bcp.className = 'btn';
  bcp.textContent = '처음 답안 불러오기';
  const cnt2 = document.createElement('span');
  cnt2.className = 'cnt';
  rwt.append(bg2, bcp, cnt2);
  rw.append(rwtag, ta2, rwt);
  el.appendChild(rw);

  function refresh() {
    const t = ta.value;
    const n = t.replace(/\s/g, '').length;
    cnt.textContent = n + '자 · 원고지 약 ' + Math.ceil(n / 200) + '장';
    const hay = compact2(rw.classList.contains('open') && ta2.value.trim() ? ta2.value : t);
    if (q.a && q.a.keys) {
      model.querySelectorAll('.key').forEach(k => {
        const r = keyHit(k.dataset.k, hay).r;
        k.classList.toggle('hit', r === 1);
        k.classList.toggle('part', r === 0.5);
      });
    }
    const bw = hint.querySelectorAll('.bw');
    if (bw.length) {
      let used = 0;
      bw.forEach(w => {
        const on = hay.includes(w.dataset.w);
        w.classList.toggle('hit', on);
        if (on) used++;
      });
      const c = hint.querySelector('.bwn');
      if (c) c.textContent = used;
    }
  }
  function refresh2() {
    const n = ta2.value.replace(/\s/g, '').length;
    cnt2.textContent = n + '자 · 원고지 약 ' + Math.ceil(n / 200) + '장';
  }
  const graded = () => (rw.classList.contains('open') && ta2.value.trim()) ? ta2.value : ta.value;
  const STEPS = ['작성', '채점', '지도', '재작성', '통과'];
  function paintSteps(cur) {
    steps.innerHTML = STEPS.map((n, i) =>
      '<span class="st' + (i < cur ? ' done' : i === cur ? ' on' : '') + '">' + (i + 1) + ' ' + n + '</span>').join('');
  }
  function paint(rec) {
    grade.className = rec ? 'grade open' : 'grade';
    grade.innerHTML = rec ? gradeHtml(rec) + passHtml(rec) : '';
    const teach = !!rec && !rec.p;
    coach.className = teach ? 'coach open' : 'coach';
    coach.innerHTML = teach
      ? coachHtml(q, rec, graded()) +
        (rw.classList.contains('open') ? '' : '<button class="btn pri rwbtn" type="button">지도를 보고 다시 쓰기 →</button>')
      : '';
    badge.hidden = !rec;
    if (rec) {
      badge.textContent = (rec.p ? '통과 ' : '') + fmt2(rec.s) + ' / ' + rec.m;
      badge.className = 'gsc ' + (rec.p ? 'ok' : gradeOf(rec.r).k);
    }
    paintSteps(!rec ? 0 : rec.p ? 4 : rw.classList.contains('open') ? 3 : 2);
  }
  function openRw() {
    rw.classList.add('open');
    if (!ta2.value.trim()) { ta2.value = ta.value; saveDraft(id + '#2', ta2.value); }
    refresh2();
    paint(scores()[id]);
    ta2.focus();
  }
  let hl = hints2()[id] || 0;
  function paintHint() {
    hint.className = hl ? 'hint2 open' : 'hint2';
    hint.innerHTML = hl ? hintHtml(q, hl) : '';
    bh.textContent = hl >= 3 ? '힌트 3단계까지 봄' : '힌트 ' + (hl + 1) + '단계 보기';
    bh.disabled = !q.a || hl >= 3;
    refresh();
  }
  bh.onclick = () => { hl = Math.min(3, hl + 1); saveHint(id, hl); paintHint(); hint.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
  ta.oninput = () => { saveDraft(id, ta.value); refresh(); };
  bs.onclick = () => {
    const rec = applyGrade(id, q, ta.value, p.track, false, hl);
    if (!rec) {
      bs.textContent = '답안을 먼저 적어 주세요';
      setTimeout(() => { bs.textContent = '자동 채점'; }, 1600);
      return;
    }
    paint(rec); refresh();
    grade.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
  coach.onclick = e => { if (e.target.closest('.rwbtn')) openRw(); };
  ta2.oninput = () => { saveDraft(id + '#2', ta2.value); refresh2(); };
  bcp.onclick = () => { ta2.value = ta.value; saveDraft(id + '#2', ta2.value); refresh2(); };
  bg2.onclick = () => {
    const rec = applyGrade(id, q, ta2.value, p.track, true, hl);
    if (!rec) {
      bg2.textContent = '다시 쓴 답안을 적어 주세요';
      setTimeout(() => { bg2.textContent = '재작성 채점'; }, 1600);
      return;
    }
    paint(rec); refresh();
    grade.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
  bm.onclick = () => {
    model.classList.toggle('open');
    bm.textContent = model.classList.contains('open') ? '모범답안 닫기' : '모범답안 보기';
    refresh();
  };
  bc.onclick = () => {
    ta.value = ''; ta2.value = '';
    saveDraft(id, ''); saveDraft(id + '#2', '');
    saveScore(id, null);
    rw.classList.remove('open');
    paint(null); refresh(); refresh2();
  };
  if (ta2.value.trim()) rw.classList.add('open');
  paintHint();
  paint(scores()[id]);
  refresh(); refresh2();
  return el;
}

/* ── 이용권이 있으면 전체 회차를 받아 온다 ──
   배포본에는 무료 회차만 박혀 있어 소스를 열어도 나머지가 나오지 않는다.
   로그인·결제는 1차 화면(index.html)에서 하고 토큰을 함께 쓴다. */
const BASE = location.pathname.replace(/\/[^/]*$/, '');   // 현재 폴더 — smart-yourtest.com/sonsa/ 아래에서도 그대로 동작한다
const API = BASE + '/api';
let EXAM2ALL = EXAM2;
function auth() {
  try { return JSON.parse(localStorage.getItem('sonsa:auth') || 'null'); } catch (e) { return null; }
}
async function loadFull() {
  const a = auth();
  if (!a || !a.token || location.protocol === 'file:') return;
  try {
    const r = await fetch(API + '/content', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: a.token, doc: 'exam2' }),
    }).then(x => x.json());
    if (r.ok && Array.isArray(r.data) && r.data.length) {
      EXAM2ALL = r.data;
      const pl = document.getElementById('payLink'); if (pl) pl.remove();   // 이용권이 있다
      EXAM2.length = 0;
      r.data.forEach(x => EXAM2.push(x));
      draw();
    }
  } catch (e) { /* 네트워크 실패 — 내장된 무료 회차로 이어 간다 */ }
}

/* ── 시작 ── */
(function () {
  const u = new URLSearchParams(location.search);
  state.track = TRACKS.includes(u.get('t')) ? u.get('t') : '신체';
  const rs = rounds(state.track);
  state.round = rs.includes(+u.get('r')) ? +u.get('r') : rs[0];
  const ss = subjects(state.track, state.round);
  state.subject = ss.includes(u.get('s')) ? u.get('s') : ss[0];
  draw();
  loadFull();
})();
</script>
