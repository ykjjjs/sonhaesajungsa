<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>손해사정사 2차 기출</title>
<meta name="theme-color" content="#0A0A0C">
<meta name="description" content="손해사정사 2차 기출 — 신체 · 재물 · 차량 3종별 9과목, 답안 작성과 모범답안">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#0A0A0C; --surf:#141417; --surf2:#101013;
  --edge:#232328; --lift:#2E2E35;
  --tx:#F5F5F7; --tx2:#D6DBE3; --tx3:#9AA3B0; --tx4:#646C7A; --tx5:#3A404B;
  --sap:#1552D6; --sap2:#3E9BFF; --sap3:#8FD0FF;
  --grad:linear-gradient(135deg,#06153F 0%,#0A2A6E 26%,#1552D6 62%,#3E9BFF 100%);
  --glass:linear-gradient(160deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 42%,rgba(255,255,255,0) 100%);
  --ok:#4CC38A; --warn:#C9903A; --bad:#E0574F; --violet:#9B8CFF; --teal:#4BC0C8;
  --r:14px; --rp:999px;
  --f:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'SF Pro Display','Apple SD Gothic Neo',system-ui,sans-serif;
  --m:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.28,.11,.32,1);
}
:root[data-theme="light"]{
  --bg:#F2F3F6; --surf:#FFFFFF; --surf2:#FAFAFB;
  --edge:#E1E4EA; --lift:#C7CCD6;
  --tx:#0A0A0C; --tx2:#2C313A; --tx3:#5B636F; --tx4:#858C99; --tx5:#AEB4BF;
  --glass:linear-gradient(160deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.35) 42%,rgba(255,255,255,0) 100%);
  --ok:#1D7D46; --warn:#9A6A18; --bad:#C8332C; --violet:#5B4BD6; --teal:#0E7D86;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx2);font-family:var(--f);font-size:16.5px;
  line-height:1.72;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sap2);outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}

/* ── 머리 ── */
header{border-bottom:1px solid var(--edge);background:var(--surf2)}
.htop{display:flex;align-items:flex-end;gap:14px;padding:26px 0 18px;flex-wrap:wrap}
.kick{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--sap2);
  text-transform:uppercase;margin-bottom:4px}
h1{font-size:clamp(21px,3.4vw,28px);font-weight:800;letter-spacing:-.03em;color:var(--tx);line-height:1.25}
.hsp{flex:1}
.tlink{color:var(--tx3);font-size:13.5px;font-weight:700;text-decoration:none;
  padding:8px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--surf);
  white-space:nowrap;transition:border-color .18s var(--ease),color .18s var(--ease)}
.tlink:hover{border-color:var(--lift);color:var(--tx)}
.themeBtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--edge);
  background:var(--surf);display:grid;place-items:center;cursor:pointer}
.themeBtn svg{width:17px;height:17px;fill:none;stroke:var(--tx3);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
:root:not([data-theme="light"]) .themeBtn .sun{display:none}
:root[data-theme="light"] .themeBtn .moon{display:none}

/* ── 고르는 줄 ── */
.picks{display:flex;flex-direction:column;gap:9px;padding:0 0 20px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.row>.lab{font-size:11.5px;font-weight:800;color:var(--tx4);letter-spacing:.08em;
  min-width:38px}
.chip{border:1px solid var(--edge);background:var(--surf);color:var(--tx3);
  font-size:13px;font-weight:700;padding:6px 12px;border-radius:var(--rp);cursor:pointer;
  transition:all .16s var(--ease);white-space:nowrap}
.chip:hover{border-color:var(--lift);color:var(--tx2)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;
  box-shadow:0 2px 12px -4px rgba(21,82,214,.7)}
.chip.lock{opacity:.5}
.chip .lk{font-size:10px;margin-left:4px}

/* ── 과목지 ── */
.paper{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.paper h2{font-size:19px;font-weight:800;color:var(--tx);letter-spacing:-.02em}
.paper .meta{font-size:12.5px;color:var(--tx4);font-weight:600}
.timer{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--m);
  font-size:13px;color:var(--tx3)}
.timer b{color:var(--tx);font-size:15px;font-variant-numeric:tabular-nums}
.tbtn{border:1px solid var(--edge);background:var(--surf);color:var(--tx3);border-radius:8px;
  padding:4px 9px;font-size:12px;font-weight:700;cursor:pointer}
.tbtn:hover{color:var(--tx)}

/* ── 문항 ── */
.q{background:var(--surf);border:1px solid var(--edge);border-radius:var(--r);
  padding:18px 18px 14px;margin:12px 0;position:relative;overflow:hidden}
.q::before{content:'';position:absolute;inset:0 0 auto;height:1px;background:var(--glass)}
.qh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.qno{width:26px;height:26px;border-radius:8px;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.pts{font-size:11.5px;font-weight:800;color:var(--sap3);border:1px solid rgba(62,155,255,.32);
  border-radius:var(--rp);padding:2px 9px;background:rgba(62,155,255,.08)}
.qsp{flex:1}
.body{white-space:pre-wrap;color:var(--tx2);font-size:16px;line-height:1.78;
  word-break:keep-all;overflow-wrap:anywhere}
.body .tb,.model .ans .tb{display:block;font-family:var(--m);font-size:13.5px;background:var(--surf2);
  border:1px solid var(--edge);border-radius:10px;padding:10px 12px;margin:8px 0;
  white-space:pre;overflow-x:auto;color:var(--tx3)}

/* ── 답안 ── */
.tools{display:flex;gap:7px;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--edge);background:var(--surf2);color:var(--tx3);
  border-radius:10px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;
  transition:all .16s var(--ease)}
.btn:hover{border-color:var(--lift);color:var(--tx)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.cnt{font-size:12px;color:var(--tx4);font-family:var(--m);margin-left:auto}
textarea{width:100%;min-height:150px;margin-top:10px;background:var(--surf2);
  border:1px solid var(--edge);border-radius:12px;padding:12px 14px;color:var(--tx2);
  font-size:15px;line-height:1.75;resize:vertical;outline:none;
  transition:border-color .18s var(--ease)}
textarea:focus{border-color:var(--sap2);box-shadow:0 0 0 3px rgba(62,155,255,.13)}
textarea::placeholder{color:var(--tx5)}

/* ── 모범답안 ── */
.model{margin-top:12px;border-top:1px dashed var(--edge);padding-top:12px;display:none}
.model.open{display:block}
.mtag{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--tx4);
  text-transform:uppercase;margin-bottom:8px}
.model .plan{background:rgba(155,140,255,.08);border-left:2px solid var(--violet);
  border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:12px;font-size:14.5px;color:var(--tx2)}
.model .ans{font-size:15.5px;color:var(--tx2)}
.model .ans p{margin:0 0 9px}
.model .ans ul,.model .ans ol{margin:0 0 9px 20px}
.model .ans li{margin:2px 0}
.model .ans b{color:var(--tx)}
.model .ans h4{font-size:15px;color:var(--tx);margin:12px 0 5px;font-weight:800}
.model .ans h3{font-size:16px;color:var(--teal);margin:22px 0 8px;font-weight:800;
  border-top:1px solid var(--edge);padding-top:15px}
.model .ans h3:first-child{margin-top:0;border-top:0;padding-top:0}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.key{font-size:12px;font-weight:700;color:var(--teal);border:1px solid rgba(75,192,200,.3);
  background:rgba(75,192,200,.08);border-radius:var(--rp);padding:3px 10px}
.key.hit{background:var(--ok);border-color:transparent;color:#04150C}
.laws{margin-top:8px;font-size:12.5px;color:var(--tx4);font-family:var(--m)}
.none{margin-top:12px;border-top:1px dashed var(--edge);padding-top:11px;
  font-size:13.5px;color:var(--tx4)}

/* ── 잠김 ── */
.locked{background:var(--surf2);border:1px dashed var(--lift);border-radius:var(--r);
  padding:28px 20px;text-align:center;color:var(--tx4);font-size:14.5px;margin:14px 0}
.locked b{display:block;color:var(--tx2);font-size:16px;font-weight:800;margin-bottom:6px}
.locked a{color:var(--sap2);font-weight:700;text-decoration:none}

.foot{padding:34px 0 20px;font-size:12.5px;color:var(--tx5);line-height:1.8;
  border-top:1px solid var(--edge);margin-top:34px}
@media(max-width:640px){
  body{font-size:16px}
  .q{padding:15px 14px 12px}
  .row>.lab{min-width:auto;width:100%}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="htop">
      <div>
        <div class="kick">SONHAE · 2nd ROUND</div>
        <h1>손해사정사 2차 기출</h1>
      </div>
      <div class="hsp"></div>
      <a class="tlink" href="./index.html">1차 기출</a>
      <a class="tlink" href="./book.html">전자교재</a>
      <button class="themeBtn" id="themeBtn" type="button" aria-label="밤낮 모드 전환" title="밤낮 모드 전환">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="picks">
      <div class="row"><span class="lab">종별</span><span id="trackRow"></span></div>
      <div class="row"><span class="lab">회차</span><span id="roundRow"></span></div>
      <div class="row"><span class="lab">과목</span><span id="subjRow"></span></div>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer class="wrap foot">
  손해사정사 제2차 시험문제는 보험개발원이 공개한 원본을 옮긴 것이다.
  모범답안은 이 서비스가 직접 작성한 것으로, 시행처의 공식 정답이 아니다.
  2차는 논술형이어서 공식 정답이 공개되지 않는다.
</footer>

<script>
const EXAM2 = [{"round": 49, "subject": "의학이론", "track": "신체", "src": "49회_2차 의학이론.pdf", "chars": 1556, "digits": 75, "pts_ok": true, "q": [{"no": 1, "body": "3일 전 교통사고로 양측 대퇴골 골절로 입원한 60세 남자 환자가 갑자기\n호흡곤란을 보이며 의식 저하 및 흉부 점상 출혈이 발생하였다. 가장 의심되는\n질환을 기술하고, 이 질환의 초기 치료를 한 가지 기술하시오.(10점)\n(1) 질환명(5점)\n(2) 이 질환의 초기 치료(5점)", "sub": [10, 5, 5], "points": 10, "a": {"plan": "질환명을 먼저 단정하고, 초기 치료는 ‘호흡 보조’를 첫머리에 둔다. 배점이 5점씩 나뉘어 있으므로 (1)과 (2)를 나누어 적는다.", "ans": "\n<h4>(1) 질환명 (5점)</h4>\n<p><b>지방색전증후군(Fat Embolism Syndrome)</b>이다.</p>\n<p>장관골 골절 후 <b>24~72시간</b> 사이에 나타나고, <b>호흡곤란·의식 저하·점상 출혈</b>의 세 징후가 함께 오는 것이 전형이다.\n양측 대퇴골 골절은 골수강에서 지방구가 정맥으로 들어갈 통로가 넓어 발생 위험이 가장 큰 손상이다.\n점상 출혈은 상흉부·액와부·결막에 잘 나타나며 다른 원인으로는 설명하기 어려운 소견이어서 진단의 결정적 단서가 된다.</p>\n\n<h4>(2) 초기 치료 (5점)</h4>\n<p><b>산소 공급을 통한 호흡 보조</b>가 첫 조치이다. 마스크로 고농도 산소를 주고, 저산소증이 교정되지 않으면\n기관내삽관과 기계환기(필요시 호기말양압, PEEP)로 넘어간다.</p>\n<p>그 밖에 수액 공급과 순환 유지, 골절부의 <b>조기 고정</b>으로 지방구의 추가 유입을 막는 처치를 함께 한다.\n지방색전증후군에는 원인을 없애는 약이 없으므로 치료의 축은 <b>보존적 지지요법</b>이라는 점을 밝혀 두면 좋다.</p>\n", "keys": ["지방색전증후군", "점상 출혈", "산소", "기계환기", "조기 고정"]}}, {"no": 2, "body": "높은 곳에서 뛰어 착지하는 과정에서 무릎이 안쪽으로 꺾이며 ‘뚝’ 하는\n소리가 난 후 심한 통증과 무릎의 불안정감을 호소하는 환자가 내원하였다.\n다음 물음에 답하시오.(10점)\n(1) 손상되었을 가능성이 가장 높은 구조물을 기술하시오.(4점)\n(2) 이 손상을 진단하기 위한 대표적인 신체검사 1가지의 명칭과 검사 방법을\n기술하시오.(6점)", "sub": [10, 4, 6], "points": 10, "a": {"plan": "손상 구조물 하나를 단정하고, 검사는 이름과 방법을 모두 적어야 6점이 채워진다.", "ans": "\n<h4>(1) 손상 구조물 (4점)</h4>\n<p><b>전방십자인대(ACL, anterior cruciate ligament)</b>이다.</p>\n<p>점프 착지처럼 발이 바닥에 고정된 상태에서 무릎이 안쪽으로 꺾이는 <b>외반·외회전</b> 힘이 걸리면 전방십자인대가 끊어진다.\n파열 순간의 <b>‘뚝’ 하는 파열음(popping sound)</b>, 곧 이어지는 <b>관절혈종</b>, 그리고 <b>무릎이 빠지는 느낌(giving way)</b>이 전형적인 세 소견이다.</p>\n\n<h4>(2) 대표적 신체검사 (6점)</h4>\n<p><b>라크만 검사(Lachman test)</b>이다.</p>\n<p>환자를 눕히고 무릎을 <b>20~30도</b> 굽힌 상태에서 한 손으로 대퇴 원위부를 고정하고 다른 손으로 경골 근위부를 잡아\n<b>앞쪽으로 당긴다</b>. 반대쪽에 비해 경골의 전방 전위가 크고 <b>단단한 종말점(firm end point)</b>이 느껴지지 않으면 양성이다.</p>\n<p>같은 목적의 검사로 전방전위 검사(anterior drawer test, 굴곡 90도)와 축이동 검사(pivot shift test)가 있으나,\n급성기에도 통증과 근육 방어의 영향을 덜 받아 <b>민감도가 가장 높은 것은 라크만 검사</b>이다.</p>\n", "keys": ["전방십자인대", "라크만", "Lachman", "관절혈종", "종말점"]}}, {"no": 3, "body": "소아 골절 중 가장 흔한 골절 중 하나인 상완골 과상부 골절(supracondylar\nfracture of the humerus)에 대한 설명이다. 다음 물음에 답하시오.(10점)\n(1) X-선 촬영에서 뼈의 전위가 없는 경우 시행할 수 있는 치료를 1가지\n기술하시오.(5점)\n(2) 이 골절에서 혈관 손상으로 인해 발생할 수 있는 대표적인 후기 합병증을\n1가지 기술하시오.(5점)", "sub": [10, 5, 5], "points": 10, "a": {"plan": "치료와 합병증을 각각 ‘한 가지’만 물었다. 고른 것 하나를 정확히 쓰고 이유를 덧붙인다.", "ans": "\n<h4>(1) 전위가 없는 경우의 치료 (5점)</h4>\n<p><b>장상지 석고 고정(long arm cast)</b>이다.</p>\n<p>주관절을 <b>90도 정도로 굽히고</b> 전완을 중립 또는 회내위에 두어 3~4주간 고정한 뒤 방사선 추시로 전위 여부를 확인한다.\n전위가 없는 1형(Gartland type I)은 도수정복이나 수술 없이 고정만으로 치유된다.</p>\n\n<h4>(2) 혈관 손상으로 인한 대표적 후기 합병증 (5점)</h4>\n<p><b>볼크만 허혈성 구축(Volkmann's ischemic contracture)</b>이다.</p>\n<p>상완동맥의 손상이나 압박으로 전완 굴곡근 구획의 혈류가 끊기면 구획증후군이 생기고,\n근육이 괴사한 뒤 섬유화되면서 손목과 손가락이 굽은 채 굳는 영구 변형이 남는다.</p>\n<p>내반주(cubitus varus)는 골절의 부정유합에서 오는 변형이므로 <b>혈관 손상의 합병증과는 구별</b>하여야 한다.</p>\n", "keys": ["장상지 석고", "볼크만", "Volkmann", "구획증후군", "상완동맥"]}}, {"no": 4, "body": "낙상 후 어깨를 바닥에 부딪힌 환자에서 견봉쇄골관절 탈구가 의심된다. 견봉\n쇄골관절의 안정성을 평가하기 위해 손상 여부를 확인해야 하는 주요 인대를\n2가지 기술하시오.(10점)", "sub": [10], "points": 10, "a": {"plan": "인대 두 가지를 묻는다. 이름만 나열하지 말고 각 인대가 어느 방향의 안정성을 맡는지 한 줄씩 덧붙이면 배점이 채워진다.", "ans": "\n<p>견봉쇄골관절의 안정성은 <b>수평 방향</b>과 <b>수직 방향</b>을 각각 다른 인대가 맡는다. 두 인대를 모두 확인하여야 한다.</p>\n<h4>① 견봉쇄골인대(acromioclavicular ligament)</h4>\n<p>관절을 직접 감싸는 인대로 <b>수평 방향(전후) 안정성</b>을 담당한다. 경도의 탈구에서 먼저 파열된다.</p>\n<h4>② 오구쇄골인대(coracoclavicular ligament)</h4>\n<p>오구돌기와 쇄골을 잇는 인대로 <b>원추인대(conoid)</b>와 <b>능형인대(trapezoid)</b>로 이루어지며\n<b>수직 방향 안정성</b>을 담당한다. 이 인대까지 끊어지면 쇄골 원위부가 위로 솟아오르는 변형이 나타난다.</p>\n<p>따라서 두 인대의 손상 여부에 따라 탈구의 정도(Rockwood 분류)가 갈리고 수술 여부의 판단도 달라진다.</p>\n", "keys": ["견봉쇄골인대", "오구쇄골인대", "원추인대", "능형인대"]}}, {"no": 5, "body": "드퀘르뱅 병에서 침범되는 대표적인 건 2가지를 기술하고(4점), 특징적인\n임상 증상 1가지와(3점) 진단에 이용되는 가장 대표적인 신체검사의\n명칭을(3점) 기술하시오.(10점)", "sub": [4, 3, 3, 10], "points": 10, "a": {"plan": "건 2가지(4점) · 증상 1가지(3점) · 검사명(3점)으로 배점이 쪼개져 있다. 세 덩어리를 눈에 보이게 나누어 쓴다.", "ans": "\n<h4>① 침범되는 건 2가지 (4점)</h4>\n<p>손목 <b>제1신전구획</b>을 지나는 <b>장무지외전건(abductor pollicis longus, APL)</b>과\n<b>단무지신전건(extensor pollicis brevis, EPB)</b>이다. 이 두 건과 이를 싸는 건초에 협착성 건초염이 생긴 것이 드퀘르뱅 병이다.</p>\n\n<h4>② 특징적인 임상 증상 (3점)</h4>\n<p><b>손목 요골측(요골 경상돌기 부위)의 통증과 압통</b>이다. 엄지를 펴거나 벌릴 때, 물건을 쥐거나 비틀 때 심해지고\n통증이 엄지와 전완으로 뻗친다.</p>\n\n<h4>③ 대표적인 신체검사 (3점)</h4>\n<p><b>핀켈스타인 검사(Finkelstein test)</b>이다. 엄지를 손바닥 안으로 접어 주먹을 쥐게 한 뒤\n손목을 <b>척측으로 꺾을 때</b> 요골 경상돌기 부위에 통증이 유발되면 양성이다.</p>\n", "keys": ["장무지외전건", "단무지신전건", "요골 경상돌기", "핀켈스타인", "Finkelstein"]}}, {"no": 6, "body": "60세 폐경 후 여성이 골다공증이 의심되어 골밀도 검사를 시행하였다. 골다공증\n진단에 가장 널리 사용되는 골밀도 검사의 명칭과(5점) 골다공증으로 진단할 수\n있는 골밀도 검사 결과의 기준을(5점) 각각 기술하시오.(10점)", "sub": [5, 5, 10], "points": 10, "a": {"plan": "검사 명칭(5점)과 진단 기준(5점)을 나눈다. 기준은 T-값과 측정 부위를 함께 적어야 한다.", "ans": "\n<h4>① 골밀도 검사의 명칭 (5점)</h4>\n<p><b>이중에너지 X선 흡수계측법(DXA, dual-energy X-ray absorptiometry)</b>이다.</p>\n<p>에너지가 다른 두 종류의 X선이 조직을 지나며 감쇠되는 정도의 차이로 골밀도를 계산한다.\n방사선 노출이 적고 재현성이 높아 진단과 치료 경과 관찰의 표준으로 쓰인다.</p>\n\n<h4>② 골다공증으로 진단하는 기준 (5점)</h4>\n<p>폐경 후 여성에서는 <b>T-값(T-score)이 −2.5 이하</b>일 때 골다공증으로 진단한다.</p>\n<p>T-값은 젊은 성인의 최대 골량과 견주어 표준편차로 나타낸 값이며, 측정 부위는\n<b>요추(L1-L4)·대퇴골 경부·대퇴골 전체</b>이고 <b>그중 가장 낮은 값</b>으로 판정한다.\n−1.0 이상은 정상, −1.0에서 −2.5 사이는 골감소증이다.\n다만 골밀도와 무관하게 <b>대퇴골 또는 척추의 골다공증성 골절</b>이 있으면 골다공증으로 진단한다.</p>\n", "keys": ["DXA", "이중에너지", "T-값", "-2.5", "요추", "대퇴골 경부"]}}, {"no": 7, "body": "간세포암종 감시검사는 고위험군에서 종양을 조기 발견하여 근치적 치료 기회를\n확보하고 사망률을 낮추는 것을 목적으로 한다. 다음을 답하시오.(10점)\n(1) 간세포암종 감시검사의 대상 환자군 3가지를 기술하시오.(3점)\n(2) 간세포암종 감시검사에 사용하는 검사 방법과 권장 감시 간격을 기술하시오.(7점)", "sub": [10, 3, 7], "points": 10, "a": {"plan": "(1)은 3점이라 대상군 3가지를 정확히 나열하는 것으로 끝내고, (2)는 7점이므로 검사 방법과 간격을 모두 적는다.", "ans": "\n<h4>(1) 감시검사 대상 환자군 3가지 (3점)</h4>\n<ul>\n<li><b>만성 B형간염 바이러스 감염자</b></li>\n<li><b>만성 C형간염 바이러스 감염자</b></li>\n<li><b>원인을 불문한 간경변증 환자</b></li>\n</ul>\n<p>세 집단은 간세포암종 발생률이 뚜렷하게 높아 감시의 이득이 비용을 넘어서는 <b>고위험군</b>으로 분류된다.</p>\n\n<h4>(2) 검사 방법과 권장 간격 (7점)</h4>\n<p>검사 방법은 <b>간 초음파검사</b>이며, <b>혈청 알파태아단백(AFP)</b> 측정을 함께 한다.\n초음파는 방사선 노출과 조영제가 없고 비용이 낮아 반복하기에 적합하지만 작은 종양이나 거친 간에서는 민감도가 떨어지므로\n혈청표지자를 더해 놓치는 병변을 줄인다.</p>\n<p>권장 간격은 <b>6개월</b>이다. 간세포암종의 배가시간을 고려할 때 6개월 간격이면 근치적 치료가 가능한 크기에서\n발견할 수 있고, 간격을 3개월로 줄여도 사망률 감소의 이득은 뚜렷하지 않다.</p>\n<p>초음파에서 결절이 보이거나 알파태아단백이 오르면 <b>역동적 조영증강 CT 또는 MRI</b>로 진단 검사를 이어 간다.</p>\n", "keys": ["B형간염", "C형간염", "간경변", "초음파", "알파태아단백", "6개월"]}}, {"no": 8, "body": "심부전 환자의 기능적 상태를 평가할 때 뉴욕심장학회(New York Heart\nAssociation, NYHA) 기능분류를 이용한다. 다음을 답하시오.(10점)\n(1) NYHA 기능분류의 정의를 기술하시오.(2점)\n(2) NYHA 기능분류의 등급과 기준을 기술하시오.(8점)", "sub": [10, 2, 8], "points": 10, "a": {"plan": "(2)에 8점이 걸려 있다. 네 등급을 하나도 빠뜨리지 말고 기준까지 함께 적는다.", "ans": "\n<h4>(1) NYHA 기능분류의 정의 (2점)</h4>\n<p>심부전 환자가 <b>신체활동을 할 때 느끼는 증상의 정도</b>에 따라 기능적 상태를 <b>Ⅰ~Ⅳ의 네 등급</b>으로 나눈 분류이다.\n객관적 검사치가 아니라 <b>환자의 자각 증상과 활동 제한</b>을 기준으로 하며, 치료 방침의 결정과 예후 판정에 쓰인다.</p>\n\n<h4>(2) 등급과 기준 (8점)</h4>\n<ul>\n<li><b>Ⅰ도</b> — 신체활동에 제한이 없다. 일상적인 활동으로는 피로·심계항진·호흡곤란이 생기지 않는다.</li>\n<li><b>Ⅱ도</b> — 신체활동이 <b>가볍게</b> 제한된다. 안정 시에는 편안하나 <b>일상적인 활동</b>에서 피로·심계항진·호흡곤란이 생긴다.</li>\n<li><b>Ⅲ도</b> — 신체활동이 <b>뚜렷하게</b> 제한된다. 안정 시에는 편안하나 <b>일상보다 가벼운 활동</b>에서도 증상이 생긴다.</li>\n<li><b>Ⅳ도</b> — 어떤 신체활동도 증상 없이 하지 못한다. <b>안정 시에도</b> 증상이 있고 활동하면 심해진다.</li>\n</ul>\n<p>등급이 올라갈수록 예후가 나쁘고, 손해사정에서는 노동능력상실률과 개호 필요성을 판단하는 자료로 쓰인다.</p>\n", "keys": ["NYHA", "자각 증상", "일상적인 활동", "안정 시"]}}, {"no": 9, "body": "임신성 당뇨병은 임신 전에 당뇨병이 없던 여성에서 임신 중기 이후에 당뇨병이\n처음 진단되는 경우를 말한다. 다음을 답하시오.(10점)\n(1) 고위험 임산부에서 임신성 당뇨병 선별검사의 시행 시기를 기술하시오.(2점)\n(2) 2단계 접근법에 따른 임신성 당뇨병의 진단 기준을 기술하시오.(8점)", "sub": [10, 2, 8], "points": 10, "a": {"plan": "(2)가 8점이다. 2단계 접근법이라는 이름대로 1단계와 2단계를 나누고 수치를 정확히 적는다.", "ans": "\n<h4>(1) 고위험 임산부의 선별검사 시행 시기 (2점)</h4>\n<p>비만·과거 임신성 당뇨병 병력·당뇨병 가족력 등 위험이 큰 임산부는\n<b>첫 산전 진찰 때(임신 초기)</b> 선별검사를 시행한다. 그 결과가 정상이면 <b>임신 24~28주</b>에 다시 검사한다.</p>\n\n<h4>(2) 2단계 접근법에 따른 진단 기준 (8점)</h4>\n<p><b>1단계 — 선별검사.</b> 공복과 무관하게 <b>50g 경구당부하검사</b>를 시행하고 <b>1시간</b> 뒤 혈당을 잰다.\n<b>140mg/dL 이상</b>이면 2단계로 넘어간다.</p>\n<p><b>2단계 — 진단검사.</b> 8시간 이상 금식 후 <b>100g 경구당부하검사</b>를 시행하고 공복·1시간·2시간·3시간 혈당을 잰다.\n아래 기준 가운데 <b>2개 이상</b>을 충족하면 임신성 당뇨병으로 진단한다(Carpenter-Coustan 기준).</p>\n<ul>\n<li>공복 <b>95</b>mg/dL 이상</li>\n<li>1시간 <b>180</b>mg/dL 이상</li>\n<li>2시간 <b>155</b>mg/dL 이상</li>\n<li>3시간 <b>140</b>mg/dL 이상</li>\n</ul>\n<p>한 번의 75g 경구당부하검사로 끝내는 1단계 접근법과 달리, 2단계 접근법은 선별과 진단을 나누어\n불필요한 진단검사를 줄이는 것이 특징이다.</p>\n", "keys": ["50g", "140", "100g", "95", "180", "155", "140", "2개 이상"]}}, {"no": 10, "body": "최근 국제 연구에 따르면 조절할 수 있는 위험인자를 관리함으로써 치매\n발생을 예방하거나 지연시킬 수 있다. 개인 또는 사회가 치매 발생 위험을\n낮추기 위해 실천할 수 있는 보호 행동을 절주, 금연, 혈당 관리, 규칙적인\n운동 이외 추가로 10가지 기술하시오.(10점)", "sub": [10], "points": 10, "a": {"plan": "‘10가지’를 요구했으므로 번호를 붙여 10개를 채우는 것이 곧 배점이다. 문제에서 제외한 절주·금연·혈당·운동은 다시 쓰지 않는다.", "ans": "\n<p>치매 위험인자 가운데 <b>조절 가능한 것</b>을 관리하면 발생을 늦추거나 막을 수 있다.\n문제에서 제외한 절주·금연·혈당 관리·규칙적인 운동 외에 다음 열 가지를 들 수 있다.</p>\n<ul>\n<li>① <b>난청의 교정</b> — 청력 검사를 받고 필요하면 보청기를 쓴다.</li>\n<li>② <b>시력 저하의 교정</b> — 백내장 수술 등 치료 가능한 시력 장애를 방치하지 않는다.</li>\n<li>③ <b>고혈압 관리</b> — 중년기부터 수축기 혈압을 130mmHg 이하로 유지한다.</li>\n<li>④ <b>고LDL콜레스테롤 관리</b> — 이상지질혈증을 치료한다.</li>\n<li>⑤ <b>비만 관리</b> — 적정 체중을 유지한다.</li>\n<li>⑥ <b>우울증의 조기 발견과 치료</b></li>\n<li>⑦ <b>두부 외상의 예방</b> — 안전벨트·헬멧 착용, 낙상 예방.</li>\n<li>⑧ <b>사회적 고립의 해소</b> — 사회활동과 사람 사이의 교류를 이어 간다.</li>\n<li>⑨ <b>교육 기회의 확대</b> — 청소년기 교육 수준을 높이고 성인기에도 인지 활동을 지속한다.</li>\n<li>⑩ <b>대기오염 노출의 감소</b> — 미세먼지 등 유해 대기 노출을 줄인다.</li>\n</ul>\n<p>이들 인자는 개인의 노력만으로 되지 않는 것이 섞여 있어, 교육·대기질처럼 <b>사회가 함께 개입해야 하는 항목</b>이라는 점을\n덧붙이면 문제가 말한 ‘개인 또는 사회’라는 표현에 맞는 답이 된다.</p>\n", "keys": ["난청", "시력", "고혈압", "LDL", "비만", "우울", "두부 외상", "사회적 고립", "교육", "대기오염"]}}]}, {"round": 49, "subject": "책임·근로자재해보상보험의 이론과 실무", "track": "신체", "src": "49회_2차 책임·근로자재해보상보험의 이론과 실무.pdf", "chars": 3605, "digits": 381, "pts_ok": true, "q": [{"no": 1, "body": "근로자‘A’는 △△건설회사 베트남 공장에서 현장관리자로 근무하던 중 2026년\n2월 15일 현장에서 작업중인 크레인에 부딪혀 넘어지는 사고로 뇌출혈과\n발목이 골절되는 부상을 당한 후 국내로 이송하여 300일간 요양치료를\n받았으나 후유장해가 발생하였다.\n아래의 <별표> 내용을 참고하여 각 질문에 답하시오. (20점)\n<별표>\n[보험가입사항]\n- 보험회사 : ‘갑’보험회사\n- 피보험자 : △△건설회사\n- 보험종목 : 해외근로자재해보장책임보험\n＊ 재해보상책임 특별약관\n＊ 재해보상확장 추가특별약관\n＊ 간병보상 추가특별약관\n- 보험기간 : 2025.07.01. ~ 2026.07.01.\n- 보상한도액 : 3억원 / 1인당, 5억원 / 1사고당\n[근로자 A의 전제조건]\n- 평균임금 : 100,000원 / 1일\n- 기대여명일 : 100일\n- 손해내역\n＊ 요양치료비 : 36,000,000원\n＊ 간병비용 : 9,000,000원\n＊ 이송비 : 5,000,000원 (호송인 1인비용 1,000,000원 포함)\n\n- 고용노동부 고시 간병급여\n간병등급 1등급(상시간병) 2등급(수시간병)\n간병비용 40,000원 30,000원\n- 후유장해 등급\n＊ 신경계통의 뚜렷한 장해가 남아 수시간호가 필요한 상태 (2급)\n＊ 족관절의 기능을 제대로 쓰지 못하는 상태 (8급)\n- 전제조건에 제시된 숫자는 계산상 편의를 위한 임의 계수임.\n(1)‘갑’보험회사가 보상하는 손해의 보상항목별 지급기준과 지급해야 할\n보험금을 그 산출 과정과 함께 기재하시오. (10점)\n(2) 간병보상 추가특별약관의 간병보상 지급대상 및 지급기준에 대하여 기재\n하시오. (10점)", "sub": [20, 10, 10], "points": 20, "a": {"plan": "재해보상책임 특별약관은 근로기준법의 재해보상을 그대로 담보한다. 요양·휴업·장해 세 항목을 차례로 계산하고, 장해등급의 조정을 빠뜨리지 않는 것이 이 문항의 고비이다.", "ans": "\n<h4>(1) 보상항목별 지급기준과 지급보험금 (10점)</h4>\n\n<h4>가. 담보의 구조</h4>\n<p>해외근로자재해보장책임보험의 <b>재해보상책임 특별약관</b>은 피보험자인 사용자가\n<b>근로기준법에 따라 부담하는 재해보상책임</b>을 담보한다.\n따라서 보상항목과 금액은 근로기준법 제78조 이하의 기준을 그대로 따른다.</p>\n\n<h4>나. 요양보상</h4>\n<p>근로기준법 제78조는 요양에 필요한 비용 전액을 부담하게 한다.\n요양의 범위에는 진찰·치료·입원뿐 아니라 <b>간병과 이송</b>이 포함되고,\n이송에 필요한 <b>호송인의 비용</b>도 이에 든다.</p>\n<span class=\"tb\">요양치료비        36,000,000원\n간병비용           9,000,000원\n이송비(호송인 포함) 5,000,000원\n─────────────────────────\n요양보상          50,000,000원</span>\n\n<h4>다. 휴업보상</h4>\n<p>근로기준법 제79조는 요양 중 <b>평균임금의 100분의 60</b>을 지급하도록 한다.</p>\n<span class=\"tb\">100,000원 × 60% × 300일 = 18,000,000원</span>\n\n<h4>라. 장해보상</h4>\n<p>근로기준법 제80조와 시행령 별표의 장해보상표에 따라 <b>등급별 일수 × 평균임금</b>으로 계산한다.\n이때 <b>장해가 둘 이상</b>이면 등급을 조정한다.\n<b>제8급 이상의 장해가 둘 이상</b>이면 중한 등급을 <b>2개 등급</b> 올린다.</p>\n<p>이 사안은 <b>제2급</b>(신경계통의 뚜렷한 장해로 수시간호가 필요한 상태)과\n<b>제8급</b>(족관절 기능장해)이 함께 있으므로 모두 제8급 이상이다.\n제2급을 2개 등급 올리면 최상급인 <b>제1급</b>이 된다.</p>\n<span class=\"tb\">제1급 1,340일 × 100,000원 = 134,000,000원</span>\n\n<h4>마. 간병보상 (간병보상 추가특별약관)</h4>\n<p>후유장해가 <b>수시간호가 필요한 상태</b>이므로 고용노동부 고시의\n<b>2등급(수시간병) 1일 30,000원</b>을 적용하고, 인정기간은 <b>기대여명일 100일</b>이다.</p>\n<span class=\"tb\">30,000원 × 100일 = 3,000,000원</span>\n\n<h4>바. 지급보험금</h4>\n<span class=\"tb\">요양보상    50,000,000원\n휴업보상    18,000,000원\n장해보상   134,000,000원\n간병보상     3,000,000원\n────────────────────────\n합계       205,000,000원   (1인당 보상한도액 3억원 이내)</span>\n<p>1사고당 한도 5억원에도 미치지 아니하므로 <b>205,000,000원</b>을 지급한다.</p>\n\n<h4>(2) 간병보상 추가특별약관의 지급대상과 지급기준 (10점)</h4>\n\n<h4>가. 지급대상</h4>\n<p>업무상 재해로 <b>요양이 끝난 뒤에도</b> 의학적으로 상시 또는 수시로\n<b>다른 사람의 간병이 필요한 상태</b>가 남은 근로자이다.\n요양 중의 간병은 요양보상에 포함되므로, 이 특별약관이 겨냥하는 것은\n<b>치유 후 남는 간병 필요</b>이다.</p>\n<p>간병이 필요한지는 <b>후유장해의 정도</b>로 판단하며,\n신경계통·정신의 장해나 흉복부 장기의 장해로\n<b>일상생활에 상시 또는 수시로 타인의 도움</b>이 있어야 하는 상태가 이에 해당한다.</p>\n\n<h4>나. 지급기준</h4>\n<ul>\n<li><b>상시간병(1등급)</b> — 스스로 일상생활을 할 수 없어 <b>항상</b> 간병이 필요한 상태.\n고용노동부 고시 금액 <b>1일 40,000원</b>.</li>\n<li><b>수시간병(2등급)</b> — 일상생활의 일부를 스스로 할 수 있으나\n<b>때때로</b> 간병이 필요한 상태. 고시 금액 <b>1일 30,000원</b>.</li>\n</ul>\n<p>지급액은 <b>고시 금액 × 실제 간병을 받은 일수</b>로 계산하되,\n<b>기대여명 기간</b>을 한도로 한다.\n실제로 간병을 받은 날에 대하여 지급하는 것이므로,\n간병을 받지 아니한 기간은 지급 대상이 아니다.</p>\n<p>지급 방식은 <b>보상한도액의 범위 안</b>에서 다른 보상항목과 합산하여 정하며,\n같은 사유로 <b>산업재해보상보험법의 간병급여</b>를 받은 경우에는 그 금액을 공제한다.</p>\n", "keys": ["근로기준법", "요양보상", "휴업보상", "60%", "장해보상", "2개 등급", "1,340일", "간병급여", "기대여명"], "law": ["근로기준법 제78조", "근로기준법 제79조", "근로기준법 제80조", "근로기준법 시행령 별표(장해보상표)"]}}, {"no": 2, "body": "2026년 6월 25일‘김○○’이 운영하는 바닥면적 120㎡ 건물 1층에 위치한\n‘△△뼈해장국’음식점 주방에서 화재가 발생하였다. 이 화재사고로 종업원‘A’와\n고객‘C’는 부상을 입었고, 고객‘B’는 병원으로 이송되어 치료 도중에\n사망하였다.\n아래의 <별표> 내용을 참고하여 각 질문에 답하시오. (20점)\n<별표>\n[보험계약사항]\n보험회사 ‘갑’보험회사 ‘을’보험회사\n재난배상책임보험\n영업배상책임보험\n보험종목 종업원 배상책임 부보장\n시설소유관리자 특별약관\n특별약관\n피보험자 김○○ 김○○\n보험기간 2026.01.01. ~ 2027.01.01 2026.01.01. ~ 2027.01.01\n2억원 / 1인당\n보상한도액 의무보상한도액\n5억원 / 1사고당\n자기부담금 - 1,000,000원 / 1사고당\n[피해자별 손해내역]\n- 종업원 A 기초자료\n＊ 부상 손해액 : 40,000,000원 (치료비, 휴업손해 합산 / 부상등급 1급)\n＊ 피해자 과실 및 기왕증 없음.\n- 고객 B 기초자료\n＊ 부상 손해액 : 40,000,000원\n＊ 사망 손해액 : 1억 6,000만원 (부상등급 1급으로 치료 중 사망)\n＊ 특이사항 : 의료자문결과, 사고 전 기저질환으로 기왕증 기여도 50% 확정\n＊ 피해자 과실 없음.\n＊ 부상 및 사망 손해액은 기왕증 기여도 적용 전 손해액임.\n\n- 고객 C 기초자료\n＊ 부상 손해액 : 42,000,000원 (부상등급 3급)\n＊ 피해자 과실 및 기왕증 없음.\n[재난배상책임보험 부상등급별 보험금액 한도]\n부상등급 1급 2급 3급 4급 5급\n보험금액 3,000만원 1,500만원 1,200만원 1,000만원 900만원\n- 전제조건에 제시된 숫자는 계산상 편의를 위한 임의 계수임.\n(1)‘갑’보험회사의 피해자별 보상책임 여부를 설명하고 지급해야 할 보험금을\n그 산출과정과 함께 기재하시오. (10점)\n(2)‘을’보험회사의 피해자별 보상책임 여부를 설명하고 지급해야 할 보험금을\n그 산출과정과 함께 기재하시오. (10점)", "sub": [20, 10, 10], "points": 20, "a": {"plan": "피해자 셋을 가로로, 보험 둘을 세로로 놓은 표부터 그린다. 종업원이 두 보험 모두에서 빠진다는 점과, 의무보험이 먼저 지급하고 영업배상은 초과분을 낸다는 점이 두 축이다.", "ans": "\n<h4>0. 먼저 정리할 것</h4>\n<p><b>가. 종업원은 어느 쪽에서도 보상되지 않는다.</b>\n국문영업배상책임보험 보통약관은 <b>피보험자의 근로자가 업무에 종사 중 입은 신체장해</b>에 대한\n배상책임을 보상하지 아니하고, 재난배상책임보험도 같은 취지의 규정을 둔다.\n근로자의 재해는 산재보험과 근로자재해보장책임보험이 맡는 영역이기 때문이다.</p>\n<p><b>나. 의무보험이 먼저이다.</b>\n국문영업배상책임보험은 <b>「의무보험과의 관계」</b> 조항에서\n같은 손해에 대하여 의무보험이 있는 경우 <b>그 의무보험에서 보상하는 금액을 초과하는 손해</b>만\n보상한다고 정한다. 재난배상책임보험은 재난 및 안전관리 기본법에 따른 <b>의무보험</b>이다.</p>\n<p><b>다. 기왕증 기여도는 손해액 자체를 줄인다.</b> 과실상계나 공제보다 앞서는 단계이다.</p>\n\n<h4>손해액의 확정</h4>\n<span class=\"tb\">종업원 A  부상 40,000,000원 (1급)         → 두 보험 모두 부보장\n고객 B    부상 40,000,000 + 사망 160,000,000 = 200,000,000원\n          기왕증 기여도 50% 적용 → 100,000,000원\n          (부상분 20,000,000 / 사망분 80,000,000)\n고객 C    부상 42,000,000원 (3급)</span>\n\n<h4>(2) ‘을’보험회사(재난배상책임보험)의 보상책임과 보험금 (10점)</h4>\n<p>의무보험이므로 먼저 계산한다. 보상은 <b>피해자 1인당 의무보상한도액</b>의 범위에서\n실제 손해액을 지급하며, 부상은 <b>부상등급별 한도</b>, 사망은 <b>사망 한도</b>가 각각 적용된다.</p>\n<span class=\"tb\">A  종업원         → 부보장                              0원\nB  부상 1급 한도 30,000,000 ≥ 손해 20,000,000    20,000,000원\n   사망 한도 150,000,000 ≥ 손해 80,000,000       80,000,000원\nC  부상 3급 한도 12,000,000 < 손해 42,000,000    12,000,000원\n───────────────────────────────────────────────\n소계                                            112,000,000원\n자기부담금 1,000,000원(1사고당) 공제\n───────────────────────────────────────────────\n‘을’ 지급보험금                                 111,000,000원</span>\n<p>C는 손해액이 부상등급 한도를 크게 넘어 <b>3,000만원</b>이 남는데,\n이 부분이 다음의 영업배상책임보험으로 넘어간다.</p>\n\n<h4>(1) ‘갑’보험회사(영업배상책임보험)의 보상책임과 보험금 (10점)</h4>\n<p>시설소유관리자 특별약관은 <b>음식점 시설의 소유·사용·관리에 따른 배상책임</b>을 담보한다.\n주방에서 난 화재로 고객이 다치거나 사망한 것은 이 담보의 대상이다.\n다만 앞서 본 대로 <b>의무보험에서 보상하는 금액을 초과하는 부분</b>만 보상한다.</p>\n<span class=\"tb\">A  종업원 배상책임 부보장                            0원\nB  손해 100,000,000 − 의무보험 100,000,000            0원\nC  손해  42,000,000 − 의무보험  12,000,000   30,000,000원\n───────────────────────────────────────────────\n‘갑’ 지급보험금                              30,000,000원\n(1인당 2억원 · 1사고당 5억원 한도 이내, 자기부담금 없음)</span>\n\n<h4>정리</h4>\n<p>두 보험을 합하여 피해자에게 돌아가는 금액은 <b>1억 4,100만원</b>이고,\n자기부담금 100만원은 피보험자 김○○이 부담한다.\n종업원 A의 손해 4,000만원은 <b>산업재해보상보험</b>과,\n사용자의 초과책임을 담보하는 <b>근로자재해보장책임보험</b>에서 처리하여야 한다.</p>\n", "keys": ["근로자가 업무에 종사 중", "의무보험과의 관계", "초과하는 손해", "기왕증 기여도", "부상등급별 한도", "자기부담금"], "law": ["국문영업배상책임보험 보통약관", "시설소유관리자 특별약관", "재난 및 안전관리 기본법 제76조의2"]}}, {"no": 3, "body": "김○○은 △△리조트(주)의 직원으로 스키캠프에 참가한 학생들의 인솔, 관리와\n스키 활동의 기초지도 및 안전관리를 담당하고 있다. 2026년 1월 5일 김○○은\n학생들이 있는 장소로 이동하기 위하여 스키를 타고 내려오다가 사고장소에서\n정설 되지 않은 눈덩이와 부딪치면서 슬로프를 이탈하여 슬로프 가장자리에\n설치된 안전 펜스의 강도와 높이가 충분치 않은 관계로 그 안전펜스를 뚫고\n지나가 급경사지로 추락하는 사고가 발생하여 김○○은 우측 슬관절 탈구,\n후방 십자인대가 파열되는 상해를 입게 되었다.\n아래의 <별표> 내용을 참고하여 각 질문에 답하시오. (15점)\n<별표>\n[보험가입사항]\n- 보험회사 : ‘갑’보험회사\n- 피보험자 : △△리조트(주)\n- 보험종목 : 국내근로자재해보장책임보험 / 사용자배상책임보험 특별약관\n- 보상한도액 : 2억원 / 1인당, 5억원 / 1사고당\n- 자기부담금 : 200,000원 / 1사고당\n[전제조건]\n- 근 로 자 : 김○○\n- 생년월일 : 1980년 3월 5일\n- 사 고 일 : 2026년 1월 5일\n- 직 업 : △△리조트(주) 소속 직원 (정년 만 60세)\n- 월 소 득 : 3,000,000원\n- 도시 보통인부 일용노임(일) : 100,000원\n- 피해자 과실 : 40%\n- 진 단 명 : 우측 슬관절 탈구, 후방십자인대파열\n- 기발생치료비 : 10,000,000원\n- 비급여치료비 : 3,000,000원\n- 향후치료비 : 2,000,000원 (현가계산 후 금액)\n- 치료기간 : 2026.01.05. ~ 2026.07.04. (6개월)\n\n- 노동능력상실률 : 영구장해 20% (맥브라이드 기준)\n- 위자료 : 사망 또는 100% 후유장해 시 1억원 기준으로 산정할 것.\n- 일실퇴직금은 고려하지 아니함.\n- 호프만(H) 계수\n＊ 사고일 ~ 입원기간까지 (6개월) : 5 (H계수)\n＊ 사고일 ~ 정년까지 (170개월) : 155 (H계수)\n＊ 사고일 ~ 가동기간까지 (230개월) : 205 (H계수)\n- 산재보험금 지급내역\n요양급여 휴업급여 장해급여\n10,000,000원 15,000,000원 40,000,000원\n- 전제조건에 제시된 숫자는 계산상 편의를 위한 임의 계수임.\n(1) 사용자의 근로자에 대한‘안전배려의무’의 개념과 위반 시 효과에 대하여\n약술하시오. (5점)\n(2)‘갑’보험회사가 근로자‘김○○’에게 지급해야 할 보험금을 그 산출과정과\n함께 기재하시오. (10점)", "sub": [15, 5, 10], "points": 15, "a": {"plan": "(2)는 ‘법률상 손해배상액 − 산재보험급여’라는 근재보험의 뼈대를 먼저 세운다. 산재급여는 같은 성질의 항목에서만 빼고 위자료에서는 빼지 않는다는 점이 결론을 가른다.", "ans": "\n<h4>(1) 안전배려의무의 개념과 위반의 효과 (5점)</h4>\n\n<h4>가. 개념</h4>\n<p>안전배려의무란 사용자가 근로계약에 부수하여 <b>신의칙상</b> 부담하는 의무로,\n근로자가 노무를 제공하는 과정에서 <b>생명·신체·건강을 해치지 아니하도록</b>\n물적 환경을 정비하고 필요한 조치를 할 의무를 말한다.\n근로계약에 명문으로 적혀 있지 않아도 인정된다.</p>\n\n<h4>나. 위반의 효과</h4>\n<ul>\n<li><b>채무불이행책임</b> — 근로계약상 의무를 다하지 못한 것이므로 민법 제390조에 따라\n손해를 배상하여야 한다.</li>\n<li><b>불법행위책임과의 경합</b> — 같은 사실이 민법 제750조의 불법행위도 되므로\n근로자는 두 청구권 가운데 어느 것이든 골라 행사할 수 있다.</li>\n<li><b>실익</b> — 채무불이행으로 구성하면 소멸시효가 <b>10년</b>이어서\n불법행위의 <b>3년</b>보다 길고, 사용자가 의무를 다하였음을 스스로 증명하여야 하는 부담을 진다.</li>\n</ul>\n<p>이 사안에서 △△리조트는 <b>슬로프의 정설을 게을리하고 안전펜스의 강도와 높이를 갖추지 못하였으므로</b>\n안전배려의무를 위반하였다.</p>\n\n<h4>(2) ‘갑’보험회사가 지급할 보험금 (10점)</h4>\n<p>사용자배상책임 특별약관은 <b>산업재해보상보험으로 전보되지 않는 초과손해</b>를 담보한다.\n따라서 ① 법률상 손해배상액을 구하고 ② 과실상계한 뒤 ③ 산재보험급여를 같은 항목에서 공제하고\n④ 자기부담금을 뺀다.</p>\n\n<h4>가. 손해액</h4>\n<span class=\"tb\">① 치료비\n   기발생 10,000,000 + 비급여 3,000,000 + 향후 2,000,000 = 15,000,000원\n\n② 휴업손해(치료기간 6개월, 100% 상실)\n   3,000,000원 × 5(H) = 15,000,000원\n\n③ 후유장해 일실수입 (노동능력상실률 20%)\n   정년까지    3,000,000 × (155 − 5) × 20% =  9,000,000원\n   정년 후 가동기간까지\n   일용노임 100,000 × 22일 = 2,200,000원/월\n   2,200,000 × (205 − 155) × 20%          = 22,000,000원\n   소계                                     31,000,000원\n\n④ 위자료  100,000,000 × 20% = 20,000,000원\n─────────────────────────────────────────\n총 손해액                                   81,000,000원</span>\n\n<h4>나. 과실상계 (피해자 과실 40%)</h4>\n<span class=\"tb\">치료비      15,000,000 × 60% =  9,000,000원\n휴업손해    15,000,000 × 60% =  9,000,000원\n후유장해    31,000,000 × 60% = 18,600,000원\n위자료      20,000,000 × 60% = 12,000,000원\n─────────────────────────────────────\n배상책임액                     48,600,000원</span>\n\n<h4>다. 산재보험급여의 공제</h4>\n<p>공제는 <b>같은 성질의 항목 안에서만</b> 하고, <b>위자료에서는 공제하지 아니한다</b>.\n공제하고 남은 급여가 있어도 다른 항목으로 넘겨 빼지 않는다.</p>\n<span class=\"tb\">치료비    9,000,000 − 요양급여 10,000,000 →        0원\n휴업손해  9,000,000 − 휴업급여 15,000,000 →        0원\n후유장해 18,600,000 − 장해급여 40,000,000 →        0원\n위자료   12,000,000 (공제하지 않음)      → 12,000,000원\n─────────────────────────────────────────\n초과손해                                  12,000,000원</span>\n\n<h4>라. 지급보험금</h4>\n<span class=\"tb\">12,000,000원 − 자기부담금 200,000원 = 11,800,000원</span>\n<p>1인당 보상한도액 2억원 이내이므로 <b>11,800,000원</b>을 지급한다.</p>\n", "keys": ["신의칙", "제390조", "10년", "초과손해", "과실상계", "위자료에서는 공제", "11,800,000"], "law": ["민법 제2조", "민법 제390조", "민법 제750조", "산업재해보상보험법 제80조"]}}, {"no": 4, "body": "배상책임보험에서 제3자의 불법행위로 인한 손해배상금을 산정할 때 공평한\n손해분담을 위해 다음과 같은 책임제한을 하고 있다. (10점)\n(1) 대법원 판례에 의거하여 과실상계, 손익상계 및 기왕증 공제를 모두 적용하여야\n하는 경우에 그 각각의 의의와 적용 순서를 약술하시오. (7점)\n(2) 아래의 전제조건에서 피해자‘A’가 최종적으로 청구할 수 있는 손해배상금을\n산출하시오. (3점)\n[전제조건]\n- 피해자‘A’의 총 손해액 : 1억원\n- 기왕증 기여도 : 20%\n- 피해자‘A’의 과실비율 : 30%\n- 피해자가 수령한 타 보험금(손익상계 대상) : 2,000만원", "sub": [10, 7, 3], "points": 10, "a": {"plan": "(1)은 세 제도의 성격이 서로 다르다는 점을 먼저 말하고 순서를 세운다. 기왕증은 손해액을 정하는 단계, 과실상계는 배상액을 정하는 단계, 손익상계는 마지막 정산이라는 틀이면 순서가 저절로 나온다.", "ans": "\n<h4>(1) 세 제도의 의의와 적용 순서 (7점)</h4>\n\n<h4>가. 기왕증 공제(기여도 감액)</h4>\n<p>피해자에게 사고 전부터 있던 질병이나 신체 상태가 현재의 손해에 기여한 경우,\n그 기여도만큼을 손해액에서 빼는 것이다.\n가해행위와 <b>상당인과관계가 있는 손해의 범위</b>를 정하는 문제이므로,\n책임을 나누는 문제가 아니라 <b>손해액 자체를 확정하는 단계</b>에 속한다.</p>\n\n<h4>나. 과실상계</h4>\n<p>손해의 발생이나 확대에 피해자의 과실이 있는 경우 이를 참작하여 배상액을 감경하는 것이다\n(민법 제396조, 제763조). 손해의 <b>공평한 분담</b>을 위한 제도이다.</p>\n\n<h4>다. 손익상계</h4>\n<p>손해를 입은 것과 같은 원인으로 피해자가 이익을 얻은 경우 그 이익을 빼는 것이다.\n손해배상이 <b>손해의 전보</b>를 넘어 이득이 되지 않게 하는 데 목적이 있다.</p>\n\n<h4>라. 적용 순서</h4>\n<p>판례가 정한 순서는 <b>기왕증 공제 → 과실상계 → 손익상계</b>이다.</p>\n<span class=\"tb\">총 손해액\n  → (기왕증 기여도 공제)  가해행위로 인한 손해액 확정\n  → (과실상계)            배상책임액 확정\n  → (손익상계)            최종 지급액</span>\n<p>기왕증 공제를 뒤로 미루면 피해자의 과실이 기왕증 부분까지 미치는 결과가 되고,\n손익상계를 앞으로 당기면 피해자가 받은 급여에까지 과실비율이 적용되어\n피해자에게 부당하게 불리해진다. 순서가 곧 금액을 가른다.</p>\n\n<h4>(2) 피해자 A가 청구할 수 있는 손해배상금 (3점)</h4>\n<span class=\"tb\">총 손해액                        100,000,000원\n① 기왕증 20% 공제  × 80%   →     80,000,000원\n② 과실상계   30%   × 70%   →     56,000,000원\n③ 손익상계   − 20,000,000원 →    36,000,000원\n─────────────────────────────────────────\n최종 청구할 수 있는 금액          36,000,000원</span>\n", "keys": ["기왕증", "상당인과관계", "과실상계", "손익상계", "기왕증 → 과실상계 → 손익상계", "36,000,000"], "law": ["민법 제396조", "민법 제763조"]}}, {"no": 5, "body": "법률상 손해배상금 산정 시 적용되는‘중간이자 공제’에 대하여 약술하시오. (10점)", "sub": [10], "points": 10, "a": {"plan": "의의 → 대상 → 두 가지 계산법의 비교 → 실무의 이율과 한계 순서로 쓴다. 호프만과 라이프니츠의 차이를 한 줄로 설명할 수 있어야 한다.", "ans": "\n<h4>1. 의의</h4>\n<p>중간이자 공제란 <b>장래에 발생할 손해</b>를 사고 시점에 <b>일시금</b>으로 미리 받게 되므로,\n받은 때부터 실제로 손해가 발생할 때까지의 <b>이자 상당액을 미리 빼는 것</b>을 말한다.\n공제하지 않으면 피해자가 그 기간의 이자만큼 이득을 보게 되어\n손해의 전보라는 손해배상의 목적을 넘어선다.</p>\n\n<h4>2. 적용 대상</h4>\n<p>장래의 <b>일실수입, 향후치료비, 개호비, 일실퇴직금</b> 등 앞으로 발생할 손해에만 적용한다.\n이미 발생한 <b>기왕치료비와 기왕휴업손해</b>에는 적용하지 않는다.</p>\n\n<h4>3. 계산 방법</h4>\n<ul>\n<li><b>가. 호프만식(단리)</b> — 단리로 중간이자를 공제한다.\n계산이 간단하고 공제액이 작아 <b>피해자에게 유리</b>하다.\n<b>법원의 실무</b>는 단리 호프만식을 쓴다.</li>\n<li><b>나. 라이프니츠식(복리)</b> — 복리로 공제한다.\n공제액이 커서 <b>피해자에게 불리</b>하지만 경제적 실질에 가깝다.\n<b>자동차보험 약관의 대인배상 지급기준</b>은 이 방식을 쓴다.</li>\n</ul>\n<p>같은 기간이라도 어느 방식을 쓰느냐에 따라 금액이 달라지므로,\n근재보험처럼 <b>법률상 손해배상액</b>을 다투는 담보에서는 법원 기준인 호프만식을 따르고,\n약관에 지급기준이 정하여진 담보에서는 그 기준을 따른다.</p>\n\n<h4>4. 이율과 단리 방식의 한계</h4>\n<p>공제에 쓰는 이율은 <b>민사법정이율 연 5%</b>가 실무의 기준이다.</p>\n<p>단리 호프만식은 기간이 길어질수록 공제액이 지나치게 작아져\n<b>현가가 원금을 넘어서는</b> 불합리가 생긴다.\n그래서 판례는 월별 호프만계수의 합계가 <b>240을 넘는 경우 240으로 제한</b>한다.\n가동기간이 20년을 넘는 젊은 피해자의 일실수입 산정에서 반드시 확인하여야 하는 대목이다.</p>\n", "keys": ["일시금", "장래", "호프만", "단리", "라이프니츠", "복리", "연 5%", "240"], "law": ["민법 제379조", "민법 제393조"]}}, {"no": 6, "body": "근로기준법 및 동법 시행령에서 정한‘통상임금’의 개념과 판단기준 및\n통상임금에 포함되는 임금과 제외되는 임금의 적용범위를 약술하시오. (10점)", "sub": [10], "points": 10, "a": {"plan": "개념(시행령 제6조) → 판단기준 → 포함되는 것 → 제외되는 것 → 평균임금과의 관계 순서로 쓴다. 고정성 요건이 폐기된 최근 판례를 반영해야 최신 답안이 된다.", "ans": "\n<h4>1. 개념</h4>\n<p>근로기준법 시행령 제6조 제1항은 통상임금을\n<b>“근로자에게 정기적이고 일률적으로 소정근로 또는 총 근로에 대하여 지급하기로 정한\n시간급·일급·주급·월급 금액 또는 도급 금액”</b>이라고 정한다.</p>\n<p>핵심은 <b>‘소정근로의 대가’</b>라는 점이다. 실제로 일한 결과에 따라 사후에 정해지는 금품이 아니라,\n정하여진 근로를 제공하면 <b>당연히 받기로 되어 있는</b> 임금이다.</p>\n\n<h4>2. 판단기준</h4>\n<ul>\n<li><b>정기성</b> — 일정한 간격을 두고 <b>계속적</b>으로 지급될 것.\n지급 주기가 1개월을 넘어도(분기·반기 상여금) 정기성은 인정된다.</li>\n<li><b>일률성</b> — 모든 근로자에게, 또는 <b>일정한 조건이나 기준에 해당하는 모든 근로자</b>에게\n지급될 것. 여기서 조건이란 근로와 관련된 일정한 자격이나 기술 같은 것을 말한다.</li>\n</ul>\n<p>과거에는 <b>고정성</b>도 요건으로 들었으나, 대법원 전원합의체는\n근로기준법이나 시행령에 근거가 없는 요건이라는 이유로 <b>고정성 요건을 더 이상 요구하지 않는다</b>고 하였다.\n그 결과 <b>재직 조건이나 일정 근무일수 조건이 붙은 정기상여금</b>도 통상임금에 포함된다.</p>\n\n<h4>3. 통상임금에 포함되는 임금</h4>\n<ul>\n<li>기본급</li>\n<li>직무수당·직책수당·기술수당·면허수당·위험수당 등 <b>근로의 가치를 반영한 수당</b></li>\n<li>정기적·일률적으로 지급되는 <b>정기상여금</b>(지급주기가 1개월을 넘는 경우를 포함한다)</li>\n<li>모든 근로자에게 지급되는 <b>식대·교통비</b> 등 복리후생적 금품 가운데 정기성과 일률성을 갖춘 것</li>\n</ul>\n\n<h4>4. 통상임금에서 제외되는 임금</h4>\n<ul>\n<li><b>실비변상적 금품</b> — 출장비, 차량유지비 등 실제 지출을 메워 주는 것</li>\n<li><b>연장·야간·휴일근로수당</b> — 소정근로의 대가가 아니라 초과근로의 대가이다</li>\n<li><b>지급 여부와 액수가 성과에 따라 달라지는 성과급</b></li>\n<li><b>일시적·우발적·은혜적으로 지급되는 금품</b> — 경조금, 격려금 등</li>\n<li>근로와 무관하게 특정인에게만 주어지는 금품</li>\n</ul>\n\n<h4>5. 평균임금과의 관계</h4>\n<p>평균임금은 <b>산정 사유가 발생한 날 이전 3개월간 지급된 임금총액을 그 기간의 총일수로 나눈</b> 금액이고,\n통상임금은 위와 같이 소정근로의 대가로 정하여진 금액이다.\n<b>평균임금이 통상임금보다 적으면 통상임금을 평균임금으로 본다</b>(근로기준법 제2조 제2항).\n재해보상은 평균임금을, 연장·야간·휴일근로수당과 해고예고수당은 통상임금을 기준으로 한다.</p>\n", "keys": ["시행령 제6조", "소정근로의 대가", "정기성", "일률성", "고정성", "정기상여금", "실비변상", "평균임금"], "law": ["근로기준법 제2조", "근로기준법 시행령 제6조"]}}, {"no": 7, "body": "영문영업배상책임보험(Commercial General Liability Policy)에서 보상하는\n추가 지급조항(Supplementary Payments)의 비용손해에 대하여 약술하시오. (10점)", "sub": [10], "points": 10, "a": {"plan": "‘보상한도액과 별도로 지급된다’는 성격을 먼저 못 박고 항목을 열거한다. 금액 한도가 붙는 두 항목을 정확히 적으면 변별이 된다.", "ans": "\n<h4>1. 성격</h4>\n<p>영문영업배상책임보험(CGL Policy)의 <b>추가 지급조항(Supplementary Payments)</b>은\n피보험자의 방어와 소송 수행에 드는 비용을 보험자가 부담하는 조항이다.\n이 비용은 원칙적으로 <b>보상한도액(Limits of Insurance)에 포함되지 아니하고 별도로</b> 지급된다는 점이\n가장 중요한 특징이다.</p>\n<p>다만 보험자가 <b>보상한도액 전액을 지급하거나 지급 제의</b>하면\n방어의무와 함께 추가 지급의무도 끝난다.</p>\n\n<h4>2. 항목</h4>\n<ul>\n<li><b>① 보험자가 지출한 방어비용</b> — 보험자가 소송을 방어하기 위하여 실제로 지출한 모든 비용</li>\n<li><b>② 보석보증보험료(Bail bonds)</b> — 담보되는 사고와 관련하여 요구되는 보석금 채권의 보험료.\n<b>1건당 250달러</b>를 한도로 한다. 보험자가 보석금을 마련해 줄 의무까지 지는 것은 아니다.</li>\n<li><b>③ 공탁보증보험료</b> — 가압류·가처분을 풀거나 상소를 제기하기 위한 공탁보증보험료.\n<b>보상한도액 이내의 금액</b>에 대한 것에 한한다.</li>\n<li><b>④ 피보험자의 협조비용</b> — 보험자의 요청으로 조사와 방어에 협조하는 데 든 합리적 비용.\n<b>실제 소득의 상실액을 1일 250달러</b>를 한도로 포함한다.</li>\n<li><b>⑤ 소송비용</b> — 피보험자에게 부과된 법원의 소송비용. <b>판결금에 대한 이자는 제외</b>한다.</li>\n<li><b>⑥ 판결 전 이자(Prejudgment interest)</b> — 보험자가 지급을 제의한 금액의 범위에서 부담한다.</li>\n<li><b>⑦ 판결 후 이자(Postjudgment interest)</b> — 판결이 선고된 뒤 보험자가 보상한도액을\n지급하거나 지급 제의할 때까지 발생한 이자.</li>\n</ul>\n\n<h4>3. 국문영업배상책임보험과의 비교</h4>\n<p>국문영업배상책임보험은 손해방지비용·대위권 보전비용·공탁보증보험료 등을\n<b>비용손해</b>로 정하고, 그중 일부는 보상한도액과 별도로,\n일부는 한도액 안에서 보상하도록 나누어 규정한다.\nCGL이 방어비용 전부를 한도와 별도로 부담하는 것과 견주면\n<b>보험자의 방어의무를 어디까지 인정하는가</b>에서 차이가 난다.</p>\n", "keys": ["보상한도액과 별도", "방어비용", "Bail bonds", "250달러", "공탁보증보험료", "판결 전 이자", "판결 후 이자"], "law": ["ISO CGL Coverage Form, SUPPLEMENTARY PAYMENTS"]}}, {"no": 8, "body": "가족일상생활중배상책임 특별약관에서 규정하고 있는 보상하지 아니하는 손해를\n5개 이상 약술하시오. (5점)", "sub": [5], "points": 5, "a": {"plan": "5개 이상을 요구했으므로 번호를 붙여 여덟 개쯤 적는다. ‘세대를 같이 하는 친족’과 ‘직무수행 중’ 두 개는 이 특약의 성격을 보여 주는 항목이므로 반드시 넣는다.", "ans": "\n<p>가족일상생활중배상책임 특별약관은 피보험자가 <b>일상생활</b> 중에\n우연한 사고로 남에게 입힌 손해를 담보한다.\n따라서 <b>일상생활의 범위를 벗어나는 것</b>과 <b>가족 안의 사고</b>가 면책의 두 축이 된다.</p>\n<ul>\n<li><b>① 피보험자의 고의</b>로 생긴 손해배상책임</li>\n<li><b>② 피보험자와 세대를 같이 하는 친족</b>에 대한 배상책임 —\n가족 사이의 분쟁을 담보하면 도덕적 위험이 커지기 때문이다.</li>\n<li><b>③ 피보험자의 직무수행에 직접 기인하는 배상책임</b> —\n일상생활을 담보하는 특약이므로 업무 중의 사고는 영업배상책임보험이 맡는다.</li>\n<li><b>④ 자동차·항공기·선박(일정 규모 이상)·총기</b>의 소유·사용·관리로 생긴 배상책임 —\n각각 별도의 보험이 마련되어 있다.</li>\n<li><b>⑤ 피보험자가 소유·사용·관리하는 재물</b>이 손해를 입음으로써 생긴 배상책임(수탁물 포함)</li>\n<li><b>⑥ 피보험자의 근로자가 업무에 종사 중</b> 입은 신체장해에 대한 배상책임</li>\n<li><b>⑦ 계약상의 가중책임</b> — 법률상 책임을 넘어 계약으로 떠안은 부분</li>\n<li><b>⑧ 지진·분화·홍수·해일 등 천재지변</b>과 <b>전쟁·혁명·내란·소요·노동쟁의</b>로 생긴 배상책임</li>\n<li><b>⑨ 벌금·과료·과태료·징벌적 손해배상금</b> — 제재의 성격이어서 손해의 전보가 아니다.</li>\n</ul>\n<p>주택의 소유·사용·관리에 따른 배상책임은 <b>증권에 기재된 주택</b>에 한하여 담보되므로,\n증권에 적히지 아니한 주택에서 생긴 사고 역시 보상되지 아니한다는 점도 함께 기억한다.</p>\n", "keys": ["고의", "세대를 같이 하는 친족", "직무수행", "자동차", "소유·사용·관리하는 재물", "근로자", "계약상 가중책임", "벌금"], "law": ["가족일상생활중배상책임 특별약관"]}}]}, {"round": 49, "subject": "제3보험의 이론과 실무", "track": "신체", "src": "49회_2차 제3보험.pdf", "chars": 3565, "digits": 365, "pts_ok": true, "q": [{"no": 1, "body": "「실손의료보험 표준약관」제19조(계약의 무효) 조항에 대하여 기술하시오. (10점)", "sub": [10], "points": 10, "a": {"plan": "무효 사유를 빠짐없이 들고, 무효의 효과(보험료 반환과 이자)까지 적어야 10점이 채워진다. 마지막에 무효·취소·해지의 구별을 한 줄로 정리한다.", "ans": "\n<h4>1. 조항의 취지</h4>\n<p>계약의 무효란 계약이 성립한 것처럼 보이더라도 <b>처음부터 효력이 생기지 않는</b> 것을 말한다.\n표준약관 제19조는 그 사유를 한정하여 열거하고, 무효인 경우 회사가 이미 받은 보험료를 돌려주도록 정한다.</p>\n\n<h4>2. 무효 사유</h4>\n<ul>\n<li><b>① 타인의 사망을 보험금 지급사유로 하는 계약</b>에서 계약을 체결할 때까지\n<b>피보험자의 서면 동의</b>(「전자서명법」에 따른 전자문서를 포함한다)를 얻지 아니한 경우</li>\n<li><b>② 만 15세 미만자·심신상실자·심신박약자</b>를 피보험자로 하여 사망을 보험금 지급사유로 한 경우.\n다만 심신박약자가 계약을 체결하거나 단체보험의 피보험자가 될 때에 <b>의사능력이 있는 경우</b>는 제외한다.</li>\n<li><b>③ 계약을 체결할 때 이미 보험금 지급사유가 발생</b>한 경우.\n다만 계약자·피보험자·보험수익자가 그 사실을 <b>알지 못하고</b> 계약을 체결한 경우는 제외한다.</li>\n</ul>\n\n<h4>3. 무효의 효과</h4>\n<p>회사는 계약을 무효로 하고 <b>이미 납입한 보험료를 돌려준다</b>.\n다만 <b>회사의 고의 또는 과실</b>로 계약이 무효가 된 경우, 그리고 회사가 승낙 전에 무효 사실을 알았거나\n알 수 있었음에도 보험료를 받은 경우에는, 보험료를 받은 날의 다음 날부터 반환일까지의 기간에 대하여\n<b>보험계약대출이율을 연단위 복리</b>로 계산한 금액을 더하여 돌려준다.</p>\n\n<h4>4. 구별할 것</h4>\n<p><b>무효</b>는 처음부터 효력이 없고, <b>취소</b>는 취소권을 행사하여야 비로소 효력이 없어지며,\n<b>해지</b>는 그때부터 장래를 향하여 효력을 잃는다.\n제3호가 정한 ‘이미 보험금 지급사유가 발생한 경우’는 <b>선의의 계약자를 보호</b>하기 위하여 예외를 두었다는 점에서\n고지의무 위반에 따른 해지와 구별된다.</p>\n", "keys": ["서면 동의", "15세 미만", "심신상실", "심신박약", "이미 보험금 지급사유", "보험료를 돌려", "보험계약대출이율"], "law": ["실손의료보험 표준약관 제19조", "상법 제731조", "상법 제732조"]}}, {"no": 2, "body": "아래 조건을 참고하여, 질문에 답하시오. (15점)\n< 계약 사항 >\n보험종목 피보험자 보험기간 담보내용 가입금액\n이소망 2025.03.10. 뇌졸중(I60~I66) 진단비 2,000만원\n종합장기보험\n(58세, 女) ~2035.03.10. 뇌혈관질환(I60~I69) 진단비 1,000만원\n※ 계약 전 알릴 위무 위반사항은 없음.\n※ 진단비는 각 1회에 한하여 지급하며, 1년 이내 진단시 가입금액의 50%를 지급함.\n< 손해사정 내용 >\n피보험자는 2026년 2월 중순부터 두통, 안면 마비 등의 증상이 발생하여 한국병원\n신경과에 입원하여 2026.02.20. 시행한 Brain MRI 검사에서‘Acute cerebral infarction in\nleft MCA(middle cerebral artery)’로 2026.02.23. 최종 판독 보고됨.\n이에 주치의는 2026.03.17. 진단서를 발행함.\n(1) 손해사정 내용에 대한 보험회사의 보상책임과 지급보험금을 산정하시오. (10점)\n(2) 상기 사례와 달리, 피보험자가 뇌졸중(추정)으로 사망한 경우에도 진단 확정으로 인정\n하여 진단비를 지급할 수 있는 경우를 기술하시오. (5점)", "sub": [15, 10, 5], "points": 15, "a": {"plan": "(1)은 ① 담보 해당 여부 ② 진단확정일 ③ 감액기간 적용 ④ 계산 순서로 쓴다. 진단서 발행일이 아니라 진단확정일이 기준이라는 점이 이 문항의 전부이다.", "ans": "\n<h4>(1) 보상책임과 지급보험금 (10점)</h4>\n\n<h4>가. 담보 해당 여부</h4>\n<p>피보험자의 상병은 ‘Acute cerebral infarction in left MCA’, 곧 <b>급성 뇌경색증</b>으로\n한국표준질병사인분류상 <b>I63</b>에 해당한다.</p>\n<p>I63은 <b>뇌졸중(I60~I66)</b>의 범위 안에 있고 동시에 <b>뇌혈관질환(I60~I69)</b>의 범위 안에도 있다.\n두 담보는 보장 범위가 겹치는 별개의 담보이므로 <b>두 담보 모두 지급사유가 발생</b>한다.</p>\n\n<h4>나. 진단확정일</h4>\n<p>약관은 뇌졸중의 진단확정을 <b>병력과 신경학적 검진에 더하여 CT·MRI·뇌혈관조영술 등 뇌영상검사를 기초로\n신경과 또는 신경외과 전문의가 내린 것</b>으로 정한다. 따라서 기준일은 <b>진단서를 발행한 날이 아니라\n검사 결과로 진단이 확정된 날</b>이다.</p>\n<p>이 사안에서 Brain MRI는 2026.02.20. 시행되었고 <b>최종 판독이 보고된 2026.02.23.</b>에 진단이 확정되었다고 보아야 한다.\n2026.03.17.자 진단서는 이미 확정된 진단을 문서로 옮긴 것에 지나지 않는다.</p>\n\n<h4>다. 감액기간</h4>\n<p>보험기간은 2025.03.10.에 시작되므로 <b>1년이 되는 날은 2026.03.09.</b>이다.\n진단확정일 2026.02.23.은 그 안에 들어가므로 <b>가입금액의 50%</b>를 지급한다.</p>\n<p>진단서 발행일(2026.03.17.)을 기준으로 삼으면 감액기간을 벗어나 전액이 지급되는 결과가 되는데,\n그렇게 되면 진단서를 언제 떼느냐에 따라 보험금이 달라져 부당하다. 진단확정일 기준이라는 원칙은 이 점에서도 뒷받침된다.</p>\n\n<h4>라. 지급보험금</h4>\n<span class=\"tb\">뇌졸중 진단비   2,000만원 × 50% = 1,000만원\n뇌혈관질환 진단비 1,000만원 × 50% =   500만원\n────────────────────────────────\n합계                            1,500만원</span>\n<p>두 담보 모두 <b>각 1회에 한하여</b> 지급하는 담보이므로 이 지급으로 해당 담보는 소멸한다.</p>\n\n<h4>(2) 사망한 경우에도 진단확정으로 인정할 수 있는 경우 (5점)</h4>\n<p>약관은 <b>피보험자가 사망하여 뇌영상검사 등을 진단의 기초로 삼을 수 없는 경우에 한하여</b>,\n피보험자가 <b>뇌졸중으로 진단 또는 치료를 받고 있었음을 증명하는 문서화된 기록이나 증거</b>를\n진단확정의 기초로 삼을 수 있다고 정한다.</p>\n<p>따라서 다음 두 요건을 함께 갖추어야 한다.</p>\n<ul>\n<li>① 피보험자가 <b>사망하여</b> 약관이 정한 검사방법으로 진단을 확정할 수 없을 것</li>\n<li>② 생전에 뇌졸중으로 <b>진단 또는 치료를 받고 있었음</b>을 증명하는 문서화된 기록 또는 증거가 있을 것</li>\n</ul>\n<p>여기서 말하는 자료로는 <b>119 구급활동일지, 응급실 초진기록, 경과기록지, 사망진단서(시체검안서)의 직접사인,\n부검감정서</b> 등을 들 수 있다. 단순한 유족의 진술이나 추정만으로는 부족하다.</p>\n", "keys": ["I63", "뇌경색", "진단확정일", "최종 판독", "50%", "1,500만원", "문서화된 기록"], "law": ["질병·상해보험 표준약관", "약관상 뇌졸중 진단확정 기준"]}}, {"no": 3, "body": "아래 조건을 참고하여, 2차 후유장해 진단에 대한 장해지급률을 산정하고 지급보험금을\n계산하시오. (20점)\n< 계약 사항 >\n계약자\n보험계약 보험기간 담보내용 가입금액\n피보험자\n2005.08.20. 상해후유장해(3~100%) 1억원\n장기상해 장보고\n~2025.08.20. 교통상해후유장해(50~100%) 1억원\n※ 보험계약은 유효한 것으로 가정하며, 계약 전·후 알릴 위무 위반사항은 없음.\n※ 질병·상해보험 표준약관을 사용하며, 정상 유지 계약임.\n< 사고 및 치료내용 >\n▪ 피보험자는 2024.07.15. 21시경 자택 계단에서 미끄러져 넘어지는 사고를 당한\n후 척추 골절, 경추 신경 손상(경추척수증) 등으로 수술 및 입원 치료함.\n▪ 사고 이후 재활치료 받아오던 중 치료의 효과를 기대할 수 없고 그 증상이\n고정된 2025.08.04. 1차 후유장해(①,②) 진단 받음.\n▪ 2025.08.11. 보험회사는 1차 후유장해 보험금을 지급함.\n▪ 같은 상해사고로 2026.07.10. 2차 후유장해 진단 받음.\n▪ 2차 후유장해(③, ④, ⑤)는 경추척수증으로 인한 관절 기능장해임.\n< 1차 후유장해 진단내용 >\n① 척추에 뚜렷한 기형을 남긴 때 (사고관여도 100% ) : 30%\n② 경추척수증으로 인한 일상생활 기본동작제한 장해지급률 : 23%\n< 2차 후유장해 진단내용 >\n③ 좌측 손의 제3수지, 제4수지 및 제5수지에 뚜렷한 장해를 남긴 때 : 15%\n④ 우측 손의 5개 손가락 모두에 뚜렷한 장해를 남긴 때 : 30%\n⑤ 우측 팔꿈치관절과 손목관절에 심한 장해를 남긴 때 : 40%", "sub": [20], "points": 20, "a": {"plan": "① 담보 확정 ② 신체부위별 장해지급률 ③ 신경계 장해와의 중복평가 정리 ④ 1차 지급분 공제 순서로 쓴다. 표를 그리며 계산 과정을 남기는 것이 배점의 절반이다.", "ans": "\n<h4>1. 담보의 확정</h4>\n<p>사고는 <b>2024.07.15. 자택 계단에서 미끄러진 것</b>으로 보험기간(2005.08.20.~2025.08.20.) 안에서 생긴 <b>상해</b>이다.\n교통사고가 아니므로 <b>교통상해후유장해(50~100%) 담보는 해당하지 않고</b>,\n<b>상해후유장해(3~100%) 담보 1억원</b>만 문제된다.</p>\n<p>2차 진단일(2026.07.10.)은 보험기간이 끝난 뒤이지만, 약관은 장해지급률이 결정된 뒤에도\n<b>그 상해와 상당인과관계가 있는 장해상태가 더 나빠진 때에는 악화된 상태를 기준으로 다시 결정</b>하도록 정한다.\n사고가 보험기간 안에서 생긴 이상 지급책임은 그대로 남는다.</p>\n\n<h4>2. 2차 후유장해의 신체부위별 평가</h4>\n<p>장해분류표에서 <b>팔과 손가락은 서로 다른 신체부위</b>이고\n<b>좌·우도 각각 다른 신체부위</b>이다.\n그러나 「8. 팔의 장해」의 <b>‘지급률의 결정’</b>이 따로 정하기를,\n<b>1상지(팔과 손가락)의 지급률은 각각 합산하되 60%를 한도</b>로 한다.\n한 팔의 손목 이상을 잃었을 때가 60%이므로 그보다 많이 줄 수 없다는 뜻이다.\n같은 취지의 규정이 다리에도 있다(1하지 60% 한도).</p>\n<span class=\"tb\">우측  ④ 5개 손가락 모두에 뚜렷한 장해   30%\n      ⑤ 팔꿈치·손목관절에 심한 장해     40%\n      더하면 70% → 한 팔의 한도 60% 적용 …… 60%\n좌측  ③ 제3·4·5수지에 뚜렷한 장해      15% …… 15%\n────────────────────────────────────────\n2차 후유장해 합계                        75%</span>\n\n<h4>3. 신경계 장해와의 중복평가</h4>\n<p>2차 장해 ③④⑤는 모두 <b>경추척수증이라는 중추신경계 손상에서 비롯된 관절 기능장해</b>이다.\n곧 신경계 장해에서 <b>통상 파생하는 장해</b>이다.</p>\n<p>장해분류표 총칙은 <b>“하나의 장해가 다른 장해와 통상 파생하는 관계에 있는 경우에는\n그중 높은 지급률만을 적용하며, 하나의 장해로 둘 이상의 파생장해가 발생하는 경우\n각 파생장해의 지급률을 합산한 지급률과 최초 장해의 지급률을 비교하여\n그중 높은 지급률을 적용한다”</b>고 정한다.</p>\n<p>최초 장해는 <b>일상생활 기본동작(ADL) 제한 23%</b>이고,\n파생장해를 합산한 지급률은 <b>75%</b>이다.\n75%가 높으므로 <b>75%를 적용</b>하고 23%를 따로 더하지 않는다.</p>\n\n<h4>4. 최종 장해지급률과 지급보험금</h4>\n<span class=\"tb\">① 척추에 뚜렷한 기형 (다른 신체부위)        30%\n②·③④⑤ 신경계 관련 장해 (높은 쪽 적용)     75%\n────────────────────────────────────────\n합계 105% → 장해지급률은 100%를 한도로 한다  100%\n\n지급할 총액   1억원 × 100%          = 100,000,000원\n1차 기지급분  1억원 × (30%+23%)     =  53,000,000원\n────────────────────────────────────────\n2차 추가 지급보험금                 =  47,000,000원</span>\n\n<h4>5. 덧붙일 점</h4>\n<p>신경계·정신행동 장해는 <b>상해 발생일부터 12개월이 지난 뒤</b> 판정하는 것이 원칙이므로,\n2025.08.04.자 1차 진단(사고 후 약 13개월)은 판정시기 요건을 갖추었다.\n또한 후유장해보험금 청구권의 소멸시효는 <b>3년</b>이므로 2026.07.10. 진단에 따른 청구는 시효 안에 있다.</p>\n", "keys": ["교통상해 해당 없음", "같은 신체부위", "60%", "75%", "파생하는 관계", "합산한 지급률", "100%", "47,000,000"], "law": ["장해분류표 총칙 3.-3)(파생장해)", "장해분류표 8. 팔의 장해 — 지급률의 결정", "장해분류표 6. 척추(등뼈)의 장해", "상법 제662조"]}}, {"no": 4, "body": "아래 조건을 참고하여 보험회사의 보상책임과 지급보험금을 산정하시오. (20점)\n(단, 관련 법률 규정을 기술하고, 다툼이 있는 경우 판례에 의함)\n< 계약 내용 >\n계약자 지정\n보험종목 보험기간 보장내용\n피보험자 보험수익자\n질병사망 1억원\n2023.06.04.\n종합보험 A C 상해사망 1억원\n~2043.06.04.\n교통상해사망 1억원\n< 확인 사항 >\n▪ 보험계약 체결 이후 사망 시 보험수익자의 변경이나 재지정 사실은 없음.\n▪ 보험계약 체결상의 하자 및 계약 취소 ․ 무효 사유는 없음.\n< 경과 내용 >\n▪ 2023.06.04. : A는 자신을 피보험자로 보험계약 체결하고 C를 보험수익자로 지정함.\n▪ 2024.05.31. : 피보험자 A와 배우자 B는 협의 이혼함.\n▪ 2025.05.30. : 자택내에서 발생한 A의 중대한 과실로 인한 상해사고로 A와 C는\n중상을 입고 한국병원으로 이송됨.\n▪ 2025.05.31. : 상기 사고로 자녀 C 사망함.\n▪ 2025.06.05. : 상기 사고로 피보험자 A 사망함.\n▪ 2026.03.02. : 보험회사에 보험금 청구함.\n< 가족 관계 >\n▪ A의 자녀는 B와 사이에 출생한 C만 있음.\n▪ 자녀 C는 성인이며, 미혼임.\n▪ 피보험자 A의 부친 D, 모친 E는 생존하여 있음.\n▪ A, B, C, D, E 모두 법적 결격사유 없음.", "sub": [20], "points": 20, "a": {"plan": "① 담보 확정 ② 중과실 면책 여부 ③ 보험수익자 확정(상법 제733조) ④ 상속 순위에 따른 분배 순서로 쓴다. 사망 시각의 앞뒤가 결론을 가르므로 날짜를 표로 정리하고 시작한다.", "ans": "\n<h4>1. 어느 담보인가</h4>\n<p>피보험자 A는 <b>자택 안에서 생긴 상해사고</b>로 사망하였다. 질병사망도 교통상해사망도 아니므로\n<b>상해사망 1억원</b> 담보만 문제된다.</p>\n\n<h4>2. 중대한 과실과 면책 여부</h4>\n<p>사고는 <b>A 자신의 중대한 과실</b>로 생겼다. 그러나 상법 제732조의2는\n사망을 보험사고로 한 계약에서 사고가 계약자·피보험자·보험수익자의 <b>중대한 과실</b>로 생긴 경우에도\n보험자가 책임을 면하지 못한다고 정한다. 면책되는 것은 <b>고의</b>뿐이다.</p>\n<p>따라서 보험회사는 <b>보상책임을 진다</b>. 계약 체결상의 하자나 취소·무효 사유도 없다.</p>\n\n<h4>3. 보험수익자의 확정</h4>\n<p>지정 보험수익자 C가 <b>피보험자 A보다 먼저</b> 사망하였다(C 2025.05.31. → A 2025.06.05.).</p>\n<p>상법 제733조 제3항은 보험수익자가 보험존속 중에 사망한 때에는 계약자가 다시 지정할 수 있고,\n<b>지정권을 행사하지 아니하고 사망한 때에는 보험수익자의 상속인을 보험수익자로 한다</b>고 정한다.\nA는 재지정 없이 사망하였으므로 <b>C의 상속인</b>이 보험수익자가 된다.</p>\n<p><b>C의 상속인</b> — C는 성인·미혼이고 직계비속이 없으므로 직계존속인 부모가 상속한다.\nA와 B는 이혼하였으나 <b>C의 부모라는 지위는 이혼으로 달라지지 않는다</b>.\nC가 사망한 2025.05.31.에는 A도 살아 있었으므로 <b>A 1/2, B 1/2</b>이다.</p>\n\n<h4>4. A의 몫이 다시 상속되는 부분</h4>\n<p>A가 취득한 1/2은 그 뒤 A가 사망하면서 <b>A의 상속재산</b>으로 A의 상속인에게 넘어간다.</p>\n<ul>\n<li>A의 <b>직계비속</b>은 C뿐인데 C가 먼저 사망하였고 C에게 직계비속이 없으므로 대습상속인도 없다.</li>\n<li>B는 <b>이혼하였으므로 배우자가 아니어서</b> A의 상속인이 아니다.</li>\n<li>따라서 제2순위인 <b>직계존속 D·E</b>가 각 1/2씩 상속한다.</li>\n</ul>\n\n<h4>5. 지급보험금과 분배</h4>\n<span class=\"tb\">상해사망보험금          100,000,000원\n\nB (C의 모)   1/2        50,000,000원\nD (A의 부)   1/2 × 1/2  25,000,000원\nE (A의 모)   1/2 × 1/2  25,000,000원\n──────────────────────────────────\n합계                   100,000,000원</span>\n\n<h4>6. 소멸시효</h4>\n<p>보험금청구권의 소멸시효는 <b>3년</b>이다(상법 제662조).\n사망일 2025.06.05.부터 청구일 2026.03.02.까지 3년이 지나지 아니하였으므로 시효로 소멸하지 않는다.</p>\n", "keys": ["상해사망", "중대한 과실", "제732조의2", "제733조", "보험수익자의 상속인", "이혼", "직계존속", "50,000,000"], "law": ["상법 제732조의2", "상법 제733조 제3항·제4항", "상법 제662조", "민법 제1000조", "민법 제1003조"]}}, {"no": 5, "body": "아래의 질문에 답하시오. (20점)\n< 확인 내용 >\n▪ 2023.03.02. 상해보험 가입함. (보험계약자 및 피보험자 : 홍길동)\n▪ 홍길동은 2026.03.03. 상해사고가 발생하여 보험금을 청구함.\n▪ 보험계약 체결시 중요한 약관 내용인‘계약 후 알릴의무와 알릴 의무 위반의 효과’에\n대해 명시 ․ 설명을 하지 않았음이 확인됨.\n▪ 보험회사는 보험금 청구건을 조사하는 과정에서 홍길동이 이륜자동차 운전이\n위험하다는 것을 알고 있었지만, 업무상 필요로 2025.03.01. 이륜자동차를\n구매하여 계속적 ․ 반복적으로 운행했다는 사실을 확인함.\n▪ 계약 후 알릴 의무 관련하여 홍길동에게 중대한 과실이 있었음이 확인됨.\n< 보험회사 처리 내용 >\n2026.03.30. 보험회사는 보험계약자 및 피보험자인 홍길동이 보험계약 체결 후 이륜\n자동차를 구매하여 계속적 ․ 반복적으로 운행했음에도 불구하고 보험회사에 이를\n알리지 않았으므로 약관 규정(계약 후 알릴 의무 위반의 효과) 및 상법 제652조\n(위험변경증가의 통지와 계약해지)에 따라 보험계약을 해지함.\n< 홍길동 주장 내용 >\n보험회사는 약관의 규제에 관한 법률에서 규정하고 있는 명시 ․ 설명 의무를 위반\n하였으므로 해당 약관을 보험계약의 내용으로 주장할 수 없음.\n따라서, 보험회사의 보험계약 해지는 부당함.\n(1) 약관 조항(계약 후 알릴의무와 알릴 의무 위반의 효과)과 상법 제652조(위험변경증가의\n통지와 계약해지)의 차이점을 3가지 이상 기술하시오. (10점)\n(2) 보험회사의 보험계약 해지 처리 적정성을 판단하고, 이에 대한 근거를 기술하시오. (10점)", "sub": [20, 10, 10], "points": 20, "a": {"plan": "(1)은 표를 세워 대비하면 세 가지가 저절로 나온다. (2)는 ‘설명의무 위반 → 약관 편입 배제’와 ‘법령에 근거한 해지는 별개’라는 두 축으로 쓰고, 마지막에 인과관계 문제를 덧붙인다.", "ans": "\n<h4>(1) 약관 조항과 상법 제652조의 차이점 (10점)</h4>\n\n<h4>① 통지 대상의 구체성</h4>\n<p>상법 제652조는 <b>‘사고발생의 위험이 현저하게 변경 또는 증가된 사실’</b>이라고만 정한 일반 규정이다.\n약관은 여기에 더하여 <b>직업 또는 직무의 변경, 이륜자동차의 계속적·반복적 사용, 위험한 취미의 시작,\n보험목적물의 양도</b> 등을 <b>구체적으로 열거</b>한다.</p>\n\n<h4>② 위반의 효과</h4>\n<p>상법 제652조는 <b>계약의 해지</b>만 정한다. 약관은 해지에 더하여\n<b>보험금을 지급하지 아니하고 이미 지급한 보험금의 반환을 청구</b>할 수 있다고 정하고,\n반대로 <b>변경된 위험과 보험사고 사이에 인과관계가 없음이 증명되면 보험금을 지급</b>한다는 점까지 명시한다.</p>\n\n<h4>③ 해지권의 행사기간</h4>\n<p>상법은 통지를 <b>받은 때로부터 1월</b> 내에 해지할 수 있다고만 정한다.\n약관은 이에 더하여 <b>위반 사실을 안 날부터 1개월, 계약을 체결한 날부터 3년</b> 등의 제척기간을 두어\n계약자에게 유리한 시간의 한계를 덧붙인다.</p>\n\n<h4>④ 보험료의 정산</h4>\n<p>약관은 위험이 증가한 경우 <b>보험료의 증액 또는 계약 내용의 변경</b>을 먼저 요구하고,\n계약자가 이에 응하지 아니할 때 해지할 수 있게 하는 <b>단계적 절차</b>를 둔다.\n상법 제652조 제2항·제653조에도 보험료 증액 청구가 있으나 약관만큼 절차가 짜여 있지 않다.</p>\n\n<h4>⑤ 통지의 방식</h4>\n<p>약관은 <b>서면 통지와 보험증권에의 배서</b> 등 확인 절차를 정하는 데 반하여, 상법은 방식을 정하지 않는다.</p>\n\n<h4>(2) 해지 처리의 적정성 (10점)</h4>\n\n<h4>가. 홍길동 주장의 근거</h4>\n<p>보험자가 약관의 중요한 내용을 명시·설명하지 아니하면 그 약관을 <b>계약의 내용으로 주장할 수 없다</b>\n(약관의 규제에 관한 법률 제3조 제4항, 상법 제638조의3).\n계약 후 알릴 의무와 그 위반의 효과는 계약자의 권리·의무에 직접 영향을 주는 <b>중요한 내용</b>이므로\n설명의무의 대상이 된다. 여기까지는 홍길동의 주장이 옳다.</p>\n\n<h4>나. 그러나 해지의 근거는 약관만이 아니다</h4>\n<p>판례는 <b>설명의무 위반으로 약관을 계약 내용으로 주장할 수 없더라도,\n보험자는 상법 규정 자체를 근거로 계약을 해지할 수 있다</b>고 본다.\n약관 조항이 법령에 정하여진 것을 되풀이하거나 부연하는 데 지나지 않는 부분은\n설명하지 아니하였다는 이유로 그 법령의 적용까지 배제되는 것은 아니기 때문이다.</p>\n<p>이 사안에서 <b>이륜자동차를 사서 계속적·반복적으로 운행한 것</b>은\n사고발생의 위험이 현저하게 증가한 사실에 해당한다. 홍길동은 그 위험성을 <b>알고 있었고</b>\n통지하지 아니한 데 <b>중대한 과실</b>이 인정된다. 상법 제652조의 요건이 모두 갖추어졌다.</p>\n\n<h4>다. 결론</h4>\n<p>보험회사의 <b>계약 해지는 적정</b>하다.\n다만 두 가지를 함께 확인하여야 한다.</p>\n<ul>\n<li><b>행사기간</b> — 상법 제652조 제1항의 해지권은 위험 증가 사실을 <b>안 날부터 1월</b> 내에 행사하여야 한다.\n2026.03.30.자 해지가 그 기간 안에 이루어졌는지 확인이 필요하다.</li>\n<li><b>인과관계</b> — 상법 제655조 단서에 따라 <b>위험의 증가와 보험사고 사이에 인과관계가 없음</b>이\n증명되면 해지와 별개로 <b>해당 사고의 보험금은 지급</b>하여야 한다.\n증명책임은 이를 주장하는 <b>보험계약자 측</b>에 있다.</li>\n</ul>\n<p>즉 해지 자체는 유효하되, 2026.03.03.자 상해사고가 이륜자동차 운행과 무관한 사고임이 밝혀지면\n보험금 지급을 거절할 수 없다.</p>\n", "keys": ["약관규제법 제3조", "제638조의3", "제652조", "되풀이하거나 부연", "1월", "제655조", "인과관계"], "law": ["상법 제652조", "상법 제653조", "상법 제655조", "상법 제638조의3", "약관의 규제에 관한 법률 제3조"]}}, {"no": 6, "body": "홍길동은 4세대 실손의료보험(계약1)을 5세대 실손의료보험(계약2)으로 전환했고,\n아래의 ①~② 통원의료비에 대한 A보험회사의 지급보험금을 산정하시오. (15점)\n(단, ①~②통원의료비를 급여, 비급여 순서대로 기술할 것)\n< 계약 사항 >\n[ 계약1 ]\n보험회사\n보험종류 기본형 특별약관\n(계약일자)\n상해비급여\n상해급여형\n기본형 질병비급여\nA 질병급여형\n실손의료보험 단, 통원1회당 20만원 한도\n(2025.03.04.) 단, 통원1회당\n(4세대) 3대비급여\n20만원 한도\n약관상 한도\n[ 계약2 ]\n특별약관2\n보험회사 보험종류 특별약관1\n기본형 (비중증\n(계약일자) (공제유형) (중증 비급여)\n비급여)\n상해급여형\n기본형 약관상 한도 약관상 한도\nA 질병급여형\n실손의료보험 단, 통원1회당 단, 통원1회당\n(2026.07.01.) 단, 통원1회당\n(5세대) 20만원 한도 20만원 한도\n20만원 한도\n< 통원의료비 내역 >\n급여\n통원일자 의료기관 병명 비급여\n(일부)본인부담금 공단부담금\n척추협착증 10만원 (증식치료\n①2026.05.04. K의원 8만원 12만원\n(M48) 1회 5만원 포함)\n척추협착증 10만원 (증식치료\n②2026.07.03. K의원 8만원 12만원\n(M48) 1회 5만원 포함)\n※ 과거 병(의)원 치료 내역 없음.\n※ 증식치료는 근골격계이학요법치료에 해당함.", "sub": [15], "points": 15, "a": {"plan": "계약1은 4세대, 계약2는 5세대이다. 두 계약의 공제 방식이 전혀 다르므로 표를 두 개 그려 놓고 급여 → 비급여 순서로 채운다. 증식치료를 어느 특약에 넣느냐가 두 계약 모두에서 갈림길이다.", "ans": "\n<h4>0. 두 계약의 공제 방식</h4>\n<p>계산에 들어가기 전에 세대별 기준을 세워 둔다. 진료기관은 <b>K의원</b>이므로 정액공제는 의원급 기준을 쓴다.</p>\n<span class=\"tb\">[계약1] 4세대 (2025.03.04.)\n  급여        공제 = Max(1만원, 보장대상의료비 × 20%)\n  기본형 비급여 공제 = Max(3만원, 보장대상의료비 × 30%)\n  3대비급여   공제 = Max(3만원, 보장대상의료비 × 30%)  1회당\n              (도수치료·체외충격파치료·증식치료 / 비급여 주사료 / 비급여 MRI)\n\n[계약2] 5세대 (2026.07.01.)\n  급여        공제 = Max(건강보험 본인부담률, 20%, 1만원)\n  중증 비급여  공제 = Max(30%, 3만원)\n  비중증 비급여 공제 = Max(50%, 5만원)\n              — 도수치료·체외충격파치료·증식치료 등 근골격계 이학요법과\n                비급여 주사제는 보장 대상에서 제외</span>\n<p>급여 본인부담금 8만원, 공단부담금 12만원이므로 이 진료의\n<b>건강보험 본인부담률은 8 ÷ 20 = 40%</b>이다. 계약2의 급여 공제율은 이 40%를 그대로 쓴다.</p>\n\n<h4>① 2026.05.04. 통원 — 계약1(4세대) 적용</h4>\n\n<h4>가. 급여</h4>\n<span class=\"tb\">보장대상의료비  본인부담금            80,000원\n                (공단부담금은 대상 아님)\n공제  Max(10,000, 80,000 × 20% = 16,000) = 16,000원\n─────────────────────────────────────────────\n급여 지급보험금                          64,000원\n(통원 1회당 20만원 한도 이내)</span>\n\n<h4>나. 비급여</h4>\n<p>비급여 10만원 가운데 <b>증식치료 5만원</b>은 3대비급여 특별약관의 대상이므로\n기본형 비급여에서 떼어 낸다.</p>\n<span class=\"tb\">기본형 비급여  100,000 − 50,000 =        50,000원\n공제  Max(30,000, 50,000 × 30% = 15,000) = 30,000원\n지급                                      20,000원\n\n3대비급여(증식치료 1회)                    50,000원\n공제  Max(30,000, 50,000 × 30% = 15,000) = 30,000원\n지급                                      20,000원\n─────────────────────────────────────────────\n비급여 지급보험금                          40,000원</span>\n\n<h4>다. ①의 지급보험금</h4>\n<span class=\"tb\">급여 64,000 + 비급여 40,000 = 104,000원</span>\n\n<h4>② 2026.07.03. 통원 — 계약2(5세대) 적용</h4>\n\n<h4>가. 급여</h4>\n<p>5세대는 급여 외래의 자기부담률을 <b>건강보험 본인부담률에 연동</b>한다.\n다만 최저 20%와 정액공제를 함께 적용하여 <b>셋 중 큰 금액</b>을 공제한다.</p>\n<span class=\"tb\">보장대상의료비                            80,000원\n공제  Max(80,000 × 40% = 32,000,\n          80,000 × 20% = 16,000,\n          10,000)                       = 32,000원\n─────────────────────────────────────────────\n급여 지급보험금                          48,000원\n(통원 1회당 20만원 한도 이내)</span>\n\n<h4>나. 비급여</h4>\n<p><b>증식치료 5만원</b>은 도수치료·체외충격파치료와 함께 <b>근골격계 이학요법</b>에 속한다.\n5세대는 과잉진료 우려가 큰 이 항목들과 비급여 주사제를\n<b>비중증 비급여의 보장 대상에서 아예 제외</b>하였으므로 <b>지급하지 않는다</b>.</p>\n<p>나머지 비급여 5만원은 산정특례 대상이 아니므로 <b>비중증 비급여(특별약관2)</b>로 본다.</p>\n<span class=\"tb\">증식치료                     보장 대상에서 제외        0원\n\n그 밖의 비급여  100,000 − 50,000 =        50,000원\n공제  Max(50,000 × 50% = 25,000, 50,000) = 50,000원\n지급                                           0원\n─────────────────────────────────────────────\n비급여 지급보험금                              0원</span>\n<p>비중증 비급여의 최소 자기부담금이 <b>5만원</b>이므로,\n보장대상의료비가 5만원을 넘지 아니하면 지급액이 남지 않는다.</p>\n\n<h4>다. ②의 지급보험금</h4>\n<span class=\"tb\">급여 48,000 + 비급여 0 = 48,000원</span>\n\n<h4>정리</h4>\n<span class=\"tb\">①  4세대  급여 64,000 + 비급여 40,000 = 104,000원\n②  5세대  급여 48,000 + 비급여      0 =  48,000원</span>\n<p>같은 병원에서 같은 진료를 받았는데도 지급액이 절반 이하로 줄었다.\n급여는 <b>건강보험 본인부담률에 연동</b>되어 공제가 커졌고,\n비급여는 <b>자기부담률 50%와 최소공제 5만원</b>에 더하여\n근골격계 이학요법이 <b>보장에서 빠졌기</b> 때문이다.\n전환을 권유할 때 이 점을 설명하지 아니하면 분쟁이 된다는 것이\n이 문항이 묻는 실무의 요점이다.</p>\n", "keys": ["Max(1만원", "20%", "3만원", "30%", "3대비급여", "104,000", "건강보험 본인부담률", "40%", "비중증 비급여", "50%", "5만원", "보장 대상에서 제외", "48,000"], "law": ["실손의료보험 표준약관(4세대)", "실손의료보험 표준약관(5세대)", "보험업감독규정"]}}]}, {"round": 49, "subject": "자동차보험의 이론과 실무(대인배상 및 자기신체손해)", "track": "신체", "src": "49회 2차 자동차대인.pdf", "chars": 1951, "digits": 137, "pts_ok": true, "q": [{"no": 1, "body": "다음과 같은 사례를 기초로 하여 각 물음에 답하시오. (30점)\n<사고 발생 경위>\n2026. 6. 5. 10시경 갑(甲)의 아들인 A(만18세)가 아버지 차를 몰래 가지고 나오라는\n고교동급생인 친구 B의 적극적인 요구에 못 이겨 아버지 바지 주머니에 있던 차\nKey를 몰래 가지고 나왔다. 그 후 무면허 운전자인 B가 A와 무단운전 사실을 인지\n하고 있는 다른 친구 C를 동승시키고 고속도로를 운전 중 과속으로 가드레일을\n충격하였고, 옆 차로에서 운행하던 D 차량의 후면을 충격하였다. 이 사고로 A, B가\n부상을 입고 C, D는 현장에서 사망하였다.\n<보험계약 사항>\n갑은 기명피보험자로서 한국보험회사에 개인용자동차보험을 ⌜가족운전자 한정운전\n특약⌟,⌜26세 이상 한정운전 특약⌟으로 아래와 같이 가입함.\n- 보험기간 : 2025.07.31.~2026.07.31.\n- 대인배상 ⅠˑⅡ(무한) / 대물배상 5,000만원.\n- 자기신체사고 사망 5,000만원 / 부상 3,000만원 / 후유장애 5,000만원.\n<자기신체사고 상해 및 장애구분 급별 보험가입금액표>\n- 자기신체사고 : 부상 2급 1,600만원/ 3급 1,500만원/ 4급 1,400만원/ 5급 1,000만원.\n- 자기신체사고 후유장애 10급 900만원/ 11급 700만원/ 12급 500만원.\n<손해발생 사항>\n- A의 부상 : 좌측 위팔뼈목 골절(부상 4급)과 좌측 상완신경총 상부 몸통 완전\n손상으로 수술미시행(부상 5급)으로 총치료비 2,000만원이 발생함.\n- A의 후유장애 : 좌측 주관절 관절의 기능에 뚜렷한 장애로 10급으로 최종 평가.\n- B의 부상 : 좌측 골반 비구 분쇄골절로 수술(부상 1급), 우측 골반 비구골절로 총\n치료비 3,000만원이 발생함.\n- B의 후유장애 : 좌측 고관절 관절기능에 뚜렷한 장애로 10급으로 최종 평가.\n- C의 사망 : 실제손해액 6억원(동승감액비율 적용전 금액) ※동승자 감액비율은 50%.\n- D의 사망 : 실제손해액 5억원(D는 무과실)\n\n(1) 갑, A, B의 C, D에 대한 법률상 손해배상책임에 대하여 설명하시오. (10점)\n(2) 한국보험회사의 A, B, C, D에 대한 담보별 보상책임과 지급보험금을 산출하시오. (10점)\n(3) 이 사건 사고와 관련한 B의 무면허운전 사고부담금 및 한국보험회사의 구상권에\n대하여 설명하시오. (10점)", "sub": [30, 10, 10, 10], "points": 30, "a": {"plan": "(1)은 갑·A·B를 한 사람씩 나누어 ‘운행자책임인지 불법행위책임인지’를 밝힌다. (2)는 담보를 세로로 놓고 피해자를 가로로 놓은 표를 먼저 그린다. (3)은 사고부담금과 구상권이 서로 다른 제도임을 구별하는 것이 출발점이다.", "ans": "\n<h4>(1) 갑·A·B의 C·D에 대한 손해배상책임 (10점)</h4>\n\n<h4>가. 갑 — 운행자책임</h4>\n<p>자배법 제3조는 <b>자기를 위하여 자동차를 운행하는 자</b>에게 책임을 지운다.\n무단운전이 있었다고 하여 보유자의 운행지배와 운행이익이 곧바로 없어지는 것은 아니고,\n판례는 <b>① 평소 자동차와 열쇠의 보관·관리 상태 ② 무단운전자와 보유자의 인적 관계\n③ 무단운전의 경위 ④ 사고 후 보유자의 승낙 가능성 ⑤ 동승자가 무단운전 사실을 알았는지</b>를\n종합하여 판단한다.</p>\n<p>이 사안에서 무단반출자는 <b>동거하는 아들 A</b>이고 열쇠도 집 안에서 가져갔다.\n가족의 무단운전은 보유자의 운행지배가 그대로 남아 있다고 보는 것이 판례의 태도이므로\n<b>갑은 여전히 운행자로서 자배법 제3조의 책임</b>을 진다.</p>\n<p>다만 <b>C에 대하여는</b> 무단운전 사실을 알면서 스스로 동승하였으므로,\n갑에 대한 관계에서 타인성이 다투어질 수 있고 적어도 <b>동승자 감액(50%)</b>이 적용된다.\n<b>D</b>는 아무 관련이 없는 무과실 피해자이므로 전액 배상 대상이다.</p>\n\n<h4>나. A — 공동운행자이자 공동불법행위자</h4>\n<p>A는 열쇠를 몰래 가지고 나와 <b>무면허인 B에게 운전하게 한 자</b>이다.\n차량을 지배하에 두고 자기 목적으로 운행하였으므로 <b>자배법 제3조의 운행자</b>에 해당하고,\n무면허자에게 운전을 맡긴 것 자체가 사고와 상당인과관계 있는 과실이므로\n민법 제750조·제760조에 따라 <b>B와 공동불법행위책임</b>을 진다.\n만 18세로 책임능력이 있으므로 민법 제755조의 감독자책임 문제는 생기지 않는다.</p>\n\n<h4>다. B — 운전자이자 운행자</h4>\n<p>B는 무면허 상태로 과속하여 사고를 낸 <b>직접 가해자</b>이다.\n민법 제750조의 불법행위책임을 지고, 동시에 자동차를 자기 목적으로 운행하였으므로\n<b>자배법 제3조의 운행자책임</b>도 진다.</p>\n\n<h4>라. 책임의 관계</h4>\n<p>갑·A·B는 C와 D에 대하여 <b>부진정연대채무</b>를 진다.\nC에 대하여는 무단운전 사실을 알고 동승한 사정을 <b>호의동승 감액과 과실상계</b>로 참작한다.</p>\n\n<h4>(2) 담보별 보상책임과 지급보험금 (10점)</h4>\n\n<h4>가. 특별약관의 적용</h4>\n<p>이 계약에는 <b>가족운전자 한정운전 특약</b>과 <b>26세 이상 한정운전 특약</b>이 붙어 있다.\n운전자 B는 <b>가족이 아니고 26세 미만</b>이므로 두 특약을 모두 벗어난다.</p>\n<p>한정운전 특약은 정해진 운전자 이외의 자가 운전하던 중 생긴 사고를\n<b>대인배상Ⅱ·대물배상(의무보험 초과분)·자기신체사고·자기차량손해에서 보상하지 않는다</b>고 정한다.\n다만 <b>대인배상Ⅰ과 자배법이 정한 한도의 대물배상은 보상</b>한다.</p>\n<p>무면허운전 면책은 별개로 따진다. 판례는 무면허운전 면책약관을\n<b>보험계약자나 피보험자의 명시적·묵시적 승인이 있는 경우에 한하여</b> 적용한다.\n이 사안의 무면허운전은 갑의 승인 없이 이루어졌으므로 무면허 면책조항 자체는 적용되지 않는다.\n결국 면책의 근거는 <b>한정운전 특약</b>이다.</p>\n\n<h4>나. 피해자별 검토</h4>\n<span class=\"tb\">피해자  타인성            담보          지급\nD      무과실 제3자       대인배상Ⅰ      1억 5,000만원(사망 한도)\n                        대인배상Ⅱ      면책(한정운전 특약)\nC      운행자 아님        대인배상Ⅰ      1억 5,000만원(사망 한도)\n       (동승 감액 50%)   대인배상Ⅱ      면책(한정운전 특약)\nA      공동운행자 → 타인 아님            대인Ⅰ 부지급\n       친족피보험자이나 한정특약 위반     자기신체사고 면책\nB      운전자 → 타인 아님                대인Ⅰ 부지급\n       피보험자 아님                     자기신체사고 대상 아님</span>\n\n<p><b>D</b> — 실제손해액 5억원이나 대인배상Ⅱ가 면책이므로 <b>대인배상Ⅰ의 사망 한도 1억 5,000만원</b>만 지급된다.\n나머지 3억 5,000만원은 갑·A·B가 직접 부담한다.</p>\n<p><b>C</b> — 6억원에 동승자 감액 50%를 적용하면 3억원이고, 역시 <b>대인배상Ⅰ 한도 1억 5,000만원</b>이 지급된다.</p>\n<p><b>A·B</b> — 두 사람 모두 <b>운행자 또는 운전자</b>여서 대인배상의 ‘다른 사람’이 아니다.\n자기신체사고는 A가 기명피보험자의 자녀로서 피보험자에 해당하나 <b>한정운전 특약 위반으로 면책</b>되고,\nB는 애초에 자기신체사고의 피보험자가 아니다.</p>\n<p><b>대물배상</b> — 가드레일과 D 차량의 물적 손해는 <b>자배법이 정한 의무보험 한도(1사고당 2,000만원)까지만</b> 보상되고\n그 초과분은 한정운전 특약으로 면책된다.</p>\n<p><b>지급보험금 합계 : 대인배상Ⅰ 3억원 + 대물배상 의무보험 한도 내 금액</b></p>\n<p>※ 자기신체사고를 면책으로 볼 것인지에 대하여는, 한정운전 특약의 문언을 그대로 적용하는 견해와\n자기신체사고는 상해보험의 성질을 가지므로 달리 보아야 한다는 견해가 갈린다.\n답안에서는 근거 조항을 밝히고 결론을 하나로 정하면 된다.</p>\n\n<h4>(3) 무면허운전 사고부담금과 보험회사의 구상권 (10점)</h4>\n\n<h4>가. 사고부담금</h4>\n<p>사고부담금은 음주·무면허·뺑소니 사고에서 보험회사가 피해자에게 먼저 보험금을 지급한 뒤\n<b>피보험자에게 되돌려 받는 금액</b>이다. 현행 제도는 이를 강화하여\n<b>의무보험(대인배상Ⅰ·대물 의무보험) 한도 내 지급보험금 전액</b>과\n임의보험 부분의 정해진 금액을 부담시킨다.</p>\n<p>그런데 사고부담금의 상대방은 <b>피보험자</b>이다.\nB는 기명피보험자 갑의 승낙을 받지 않았으므로 <b>승낙피보험자가 아니어서 피보험자가 아니다</b>.\n따라서 이 사안은 사고부담금을 물릴 자리가 아니라 <b>구상권의 문제</b>로 넘어간다.</p>\n\n<h4>나. 구상권</h4>\n<p>보험회사가 대인배상Ⅰ에서 C와 D에게 보험금을 지급하면\n상법 제682조의 <b>청구권대위</b>에 따라 손해를 일으킨 제3자에 대한 피해자의 권리를 취득한다.</p>\n<ul>\n<li><b>B</b> — 피보험자가 아닌 무단·무면허 운전자이므로 <b>지급한 보험금 전액에 대하여 구상</b>할 수 있다.</li>\n<li><b>A</b> — 공동불법행위자이므로 구상의 상대가 되지만, A는 기명피보험자 갑과\n<b>생계를 같이 하는 가족</b>이다. 상법 제682조 제2항은 이러한 가족에 대하여는\n<b>손해가 그 가족의 고의로 생긴 경우가 아니면 대위할 수 없다</b>고 정한다.\nA에게 고의가 있다고 보기 어려우므로 <b>A에 대한 구상은 제한</b>된다.</li>\n</ul>\n<p>결국 실질적인 구상의 상대는 <b>B</b>이며, 보험회사는 대인배상Ⅰ에서 지급한 3억원과\n대물 의무보험에서 지급한 금액을 B에게 청구할 수 있다.</p>\n", "keys": ["운행지배", "운행이익", "부진정연대", "한정운전 특약", "대인배상Ⅰ", "1억 5,000만원", "명시적·묵시적 승인", "제682조", "생계를 같이 하는 가족"], "law": ["자동차손해배상 보장법 제3조", "자동차손해배상 보장법 제29조의2", "상법 제682조", "민법 제750조", "민법 제760조"]}}, {"no": 2, "body": "다음과 같은 사례를 기초로 하여 각 물음에 답하시오. (20점)\n<사고 발생 경위>\nA는 재활용품 수거트럭을 이용하여 아파트 내 재활용품 수거업무를 수행하는\n사업자이다. B는 A와 재활용품 수거 및 판매업무를 수행하는 공동사업자로서\n사고 당일 재활용품 수거작업을 책임지고 있었다. 2026. 5. 3. B는 자신이 담당하는\n구역에 있는 재활용품을 수거하기 위하여 트럭에 장착되어 있는 집게장치를 이용\n하여 재활용 포대를 들어 올리던 중 집게장치의 노후화로 집게장치의 일부분이\n파손되어 떨어지는 바람에 그 충격으로 작업을 보조하던 C가 사망하였고, 이\n과정에서 현장작업을 책임지고 있는 B도 파편에 맞아 얼굴 부위에 중상을 입었다.\n<보험계약 사항>\n재활용품 수거트럭은 A와 B의 공동사업목적에 이용되는 차량이며, 등록증상의 소유자는\nA로 되어 있다. A는 보험회사와 위 트럭을 피보험자동차로 하여 대인배상ⅠˑⅡ에 가입\n하고 있다.\n(1) 이 사건 사고가 자동차손해배상보장법상 자동차의 운행에 해당하는지 여부에\n대하여 설명하시오. (10점)\n(2) B가 A에게 자동차손해배상보장법에 의한 손해배상책임을 청구한 경우, A의\n손해배상책임 여부를 설명하시오. (10점)", "sub": [20, 10, 10], "points": 20, "a": {"plan": "(1)은 자배법 제2조의 ‘운행’ 정의에서 출발해 고유장치 법리로 내려간다. (2)는 공동운행자 사이의 타인성 문제이므로, 원칙(타인 아님)과 예외(간접·추상적 운행지배)를 세우고 사실관계를 대입한다.", "ans": "\n<h4>(1) 자배법상 ‘운행’에 해당하는지 (10점)</h4>\n\n<h4>가. 운행의 뜻</h4>\n<p>자배법 제2조 제2호는 운행을 <b>“사람 또는 물건의 운송 여부와 관계없이 자동차를\n그 용법에 따라 사용하거나 관리하는 것”</b>이라고 정한다.\n‘운송 여부와 관계없이’라는 표현에서 보듯이 <b>달리고 있을 것을 요구하지 않는다</b>.</p>\n\n<h4>나. ‘용법에 따른 사용’의 범위</h4>\n<p>판례는 자동차의 <b>고유장치</b>를 그 목적에 따라 사용하는 경우도 용법에 따른 사용으로 본다.\n크레인·집게·덤프·사다리 등 당해 자동차에 <b>계속적으로 부착되어 그 자동차의 구조상 설비된 장치</b>를\n본래의 사용목적대로 쓰던 중 생긴 사고는 운행 중의 사고이다.\n반면 자동차와 무관한 별개의 기계를 옮겨 놓고 쓰다가 생긴 사고는 운행성이 부정된다.</p>\n\n<h4>다. 이 사안</h4>\n<p>사고는 <b>트럭에 장착되어 있는 집게장치</b>로 재활용 포대를 들어 올리던 중,\n그 장치의 노후로 일부가 파손되어 떨어지면서 일어났다.\n집게장치는 재활용품 수거트럭의 <b>고유장치</b>이고 그 <b>본래의 사용목적대로</b> 쓰이고 있었다.</p>\n<p>따라서 이 사고는 <b>자배법상 자동차의 운행으로 인한 사고에 해당</b>한다.</p>\n\n<h4>(2) B의 청구에 대한 A의 손해배상책임 (10점)</h4>\n\n<h4>가. 쟁점 — B가 ‘다른 사람’인가</h4>\n<p>자배법 제3조는 운행자가 <b>‘다른 사람’</b>을 죽거나 다치게 한 때에 책임을 지운다.\n여기서 다른 사람이란 <b>운행자와 운전자를 제외한 자</b>를 말하므로,\nB가 스스로 운행자라면 A에게 자배법상 책임을 물을 수 없다.</p>\n\n<h4>나. 공동운행자의 타인성</h4>\n<p>판례는 <b>공동운행자 가운데 한 사람이 사고로 다친 경우 원칙적으로 다른 운행자에 대하여\n타인임을 주장할 수 없다</b>고 본다.\n다만 사고를 당한 공동운행자의 운행지배와 운행이익이 상대방에 비하여\n<b>간접적·추상적인 데 그치고</b>, 상대방이 사고 방지를 위하여 요구되는 주의를 다하지 못한 경우에는\n예외적으로 타인성을 인정한다.</p>\n\n<h4>다. 이 사안</h4>\n<p>트럭은 <b>A와 B의 공동사업 목적에 이용되는 차량</b>이고, B는 A와 재활용품 수거·판매업을 함께 하는\n<b>공동사업자</b>이며, 사고 당일에는 <b>수거작업을 직접 책임지고</b> 집게장치를 조작하고 있었다.\n등록증상 소유자가 A라는 사정은 형식에 지나지 않는다.</p>\n<p>B의 운행지배는 <b>간접적·추상적인 것이 아니라 오히려 A보다 직접적이고 구체적</b>이다.\n따라서 B는 A에 대하여 타인임을 주장할 수 없고,\n<b>A는 자배법 제3조에 따른 손해배상책임을 지지 않는다</b>.</p>\n\n<h4>라. 다른 법률에 따른 책임</h4>\n<p>다만 집게장치의 노후를 방치한 데 대하여\n<b>민법 제750조의 일반불법행위책임</b>이나 <b>민법 제758조의 공작물 점유자·소유자 책임</b>이\n따로 문제될 수 있다. 이는 자배법상 책임과는 별개의 청구원인이다.</p>\n", "keys": ["제2조 제2호", "용법에 따라", "고유장치", "공동운행자", "타인", "간접적·추상적", "제758조"], "law": ["자동차손해배상 보장법 제2조 제2호", "자동차손해배상 보장법 제3조", "민법 제750조", "민법 제758조"]}}, {"no": 3, "body": "자동차보험 대인배상 담보에서 손익상계의 유형과 방법에 대하여 설명하시오. (15점)", "sub": [15], "points": 15, "a": {"plan": "① 뜻과 근거 ② 공제하는 것 ③ 공제하지 않는 것 ④ 공제의 방법(순서·항목 대응) 네 덩어리로 쓴다. ④에 배점이 몰려 있다.", "ans": "\n<h4>1. 뜻과 근거</h4>\n<p>손익상계란 피해자가 손해를 입은 것과 <b>같은 원인</b>으로 이익도 얻은 경우\n그 이익을 손해액에서 빼는 것을 말한다.\n손해배상은 <b>손해의 전보</b>를 목적으로 하므로 피해자가 사고로 오히려 이득을 보게 해서는 안 된다는 데 근거가 있다.</p>\n<p>요건은 두 가지이다. <b>① 배상책임의 원인이 된 사실과 이익 사이에 상당인과관계</b>가 있을 것,\n<b>② 그 이익이 손해의 전보를 목적</b>으로 하는 것일 것.</p>\n\n<h4>2. 공제하는 것</h4>\n<ul>\n<li><b>생계비</b> — 사망사고에서 피해자가 살아 있었다면 지출하였을 생활비. 실무상 상실수익액의 3분의 1을 공제한다.</li>\n<li><b>산업재해보상보험급여</b> — 요양급여·휴업급여·장해급여 등. 손해의 전보를 목적으로 하는 급여이다.</li>\n<li><b>정부보장사업 보상금</b> — 자배법에 따라 정부가 지급한 보상금.</li>\n<li><b>다른 자동차보험에서 이미 지급된 대인배상금</b></li>\n<li><b>형사합의금</b> — <b>손해배상금의 일부</b>로 지급된 것이면 공제한다.\n다만 <b>위로금 명목</b>임이 분명하면 공제하지 않는다.</li>\n<li><b>국민연금의 유족연금·장해연금</b> 가운데 손해의 전보 성질을 갖는 부분</li>\n</ul>\n\n<h4>3. 공제하지 않는 것</h4>\n<ul>\n<li><b>생명보험금·상해보험금 등 정액보험금</b> — 계약자가 스스로 보험료를 내고 마련한 것이어서\n가해자의 책임을 덜어 줄 이유가 없다.</li>\n<li><b>자기신체사고 보험금</b> — 위와 같은 이유이다(약관에 따로 공제 규정을 둔 경우는 별개이다).</li>\n<li><b>순수한 위로금·조위금</b></li>\n<li><b>손해의 전보를 목적으로 하지 않는 사회보장적 급여</b></li>\n</ul>\n\n<h4>4. 공제의 방법</h4>\n<p><b>가. 순서 — 과실상계를 먼저 하고 손익상계를 나중에 한다.</b>\n전체 손해액에서 피해자의 과실비율을 먼저 상계하여 배상액을 정한 뒤,\n그 금액에서 공제 대상 이익을 뺀다. 순서를 바꾸면 피해자에게 불리한 결과가 되므로 판례가 확립한 순서이다.</p>\n<span class=\"tb\">총 손해액 → (과실상계) → 배상책임액 → (손익상계) → 지급액</span>\n<p><b>나. 같은 성질의 항목끼리만 공제한다.</b>\n치료비 성격의 급여는 치료비에서, 휴업급여는 일실수입에서 공제한다.\n성질이 다른 항목을 넘나들며 빼지 않는다.</p>\n<p><b>다. 위자료에서는 공제하지 않는다.</b>\n위자료는 정신적 손해에 대한 배상이어서 재산적 손해를 전보하는 급여와 성질이 다르다.</p>\n<p><b>라. 국민건강보험의 공단부담금</b>은 피해자가 받은 이익이 아니라 공단이 가해자에게\n구상할 몫이므로, 배상액 산정과 구상 관계를 나누어 처리한다.</p>\n", "keys": ["손해의 전보", "상당인과관계", "생계비", "산재보험급여", "정액보험금", "과실상계를 먼저", "같은 성질", "위자료"], "law": ["민법 제393조", "민법 제763조", "산업재해보상보험법 제80조"]}}, {"no": 4, "body": "자동차보험 대인배상 담보 사고에서 합의의 효력과 그 효력이 부인되는 사유에\n대하여 설명하시오. (15점)", "sub": [15], "points": 15, "a": {"plan": "합의의 성질(화해계약)을 세우고 → 효력 세 가지 → 효력이 부인되는 사유를 나열한다. 후발손해 논점을 빠뜨리면 배점의 절반을 잃는다.", "ans": "\n<h4>1. 합의의 법적 성질</h4>\n<p>대인배상 사고에서의 합의는 당사자가 서로 양보하여 분쟁을 끝내기로 하는\n민법 제731조의 <b>화해계약</b>이다.</p>\n\n<h4>2. 합의의 효력</h4>\n<ul>\n<li><b>가. 창설적 효력</b> — 화해로 당사자 한쪽이 양보한 권리는 소멸하고 상대방은 화해 내용대로 권리를 취득한다\n(민법 제732조). 합의 전의 권리관계가 어떠하였는지는 더 이상 따지지 않는다.</li>\n<li><b>나. 확정적 효력</b> — 화해의 목적인 분쟁 사항에 관하여는\n<b>착오를 이유로 취소하지 못한다</b>(민법 제733조 본문).\n손해액을 잘못 계산하였다는 이유로는 합의를 뒤집을 수 없다.</li>\n<li><b>다. 부제소의 효력</b> — “이후 일체의 민·형사상 청구를 하지 않는다”는 조항을 둔 경우\n그 범위에서 다시 다투지 못한다.</li>\n</ul>\n\n<h4>3. 효력이 부인되는 사유</h4>\n<ul>\n<li><b>① 예견할 수 없었던 후발손해</b> — 합의 당시 예상할 수 없었던 후유증이나 손해가 그 뒤에 나타나고,\n그 손해가 합의금과 견주어 <b>현저히 균형을 잃은</b> 경우에는\n그 부분에 대하여 합의의 효력이 미치지 않는다는 것이 판례이다.\n치료가 끝나기 전에 서둘러 한 합의에서 특히 문제된다.</li>\n<li><b>② 화해의 목적인 분쟁 이외의 사항에 관한 착오</b> — 민법 제733조 단서.\n당사자의 자격이나 <b>사고와 상해 사이의 인과관계 자체</b>처럼\n합의의 전제가 된 사항에 착오가 있으면 취소할 수 있다.</li>\n<li><b>③ 사기·강박</b> — 민법 제110조에 따라 취소할 수 있다.\n보험회사가 지급기준을 잘못 알려 합의하게 한 경우가 이에 해당할 수 있다.</li>\n<li><b>④ 불공정한 법률행위</b> — 궁박·경솔·무경험을 이용하여 현저하게 공정을 잃은 합의는 무효이다(민법 제104조).</li>\n<li><b>⑤ 반사회질서의 법률행위</b> — 민법 제103조.</li>\n<li><b>⑥ 의사무능력자의 합의, 무권대리에 의한 합의</b> — 무효이거나 효력이 생기지 않는다.\n미성년자가 법정대리인의 동의 없이 한 합의는 취소할 수 있다.</li>\n<li><b>⑦ 강행법규 위반</b> — 자배법이 정한 의무보험의 보상한도를 밑도는 내용으로 피해자의 권리를 포기시키는 합의 등.</li>\n</ul>\n\n<h4>4. 실무에서 유의할 점</h4>\n<p>합의서에 부제소 조항이 있어도 <b>예견 불가능한 후발손해</b>에는 미치지 않는다.\n따라서 손해사정 단계에서는 <b>증상이 고정된 뒤</b>에 합의하고,\n후유장해가 남을 가능성이 있으면 그 범위를 합의서에 명시하여 다툼의 소지를 줄여야 한다.</p>\n", "keys": ["화해계약", "창설적 효력", "제733조", "후발손해", "현저히 균형", "제104조", "부제소"], "law": ["민법 제731조", "민법 제732조", "민법 제733조", "민법 제104조", "민법 제110조"]}}, {"no": 5, "body": "자동차보험 대인배상 담보에서 피해자측 과실에 대하여 약술하시오. (10점)", "sub": [10], "points": 10, "a": {"plan": "뜻 → 인정 근거 → 범위(인정례와 부정례) → 적용 방법의 네 줄기로 짧게 쓴다. 10점 문항이므로 사례 나열보다 기준을 분명히 하는 편이 낫다.", "ans": "\n<h4>1. 뜻</h4>\n<p>피해자측 과실이란 과실상계에서 참작되는 과실에\n피해자 <b>본인의 과실</b>뿐 아니라 피해자와 <b>신분상 또는 생활관계상 일체를 이루는 관계</b>에 있는 자의\n과실까지 포함시키는 법리를 말한다.</p>\n\n<h4>2. 인정하는 근거</h4>\n<p>손해의 <b>공평한 분담</b>에 있다.\n피해자와 한 몸이라고 볼 수 있는 사람의 과실로 커진 손해를 가해자에게 모두 지우는 것은 공평하지 않고,\n어차피 가해자가 배상한 뒤 그 사람에게 구상하게 되어 <b>같은 결과를 한 번에 정리</b>하는 것이 소송경제에도 맞다.</p>\n\n<h4>3. 범위</h4>\n<p><b>가. 인정한 예</b></p>\n<ul>\n<li>부부 사이 — 배우자가 운전하다 낸 사고에서 동승한 배우자가 피해자인 경우</li>\n<li>부모와 어린 자녀 — 감독의무자인 부모의 과실</li>\n<li>피해자가 운행자인 경우 그 <b>운전자</b>의 과실</li>\n<li>사용자가 피해자인 경우 그 <b>피용자</b>의 과실</li>\n</ul>\n<p><b>나. 부정한 예</b></p>\n<ul>\n<li>단순한 호의동승자와 운전자 사이 — 친구·직장동료처럼 신분상·생활관계상 일체라고 볼 수 없는 관계</li>\n<li>같은 차에 탔다는 사정만 있는 경우</li>\n</ul>\n<p>판단의 기준은 <b>‘한 몸으로 볼 만한 신분·생활관계가 있는가’</b>이지 단순한 친밀도가 아니다.</p>\n\n<h4>4. 적용 방법</h4>\n<p>피해자측의 과실비율을 <b>피해자 본인의 과실로 보아</b> 손해액에서 상계한다.\n다만 <b>대인배상Ⅰ</b>에서는 피해자 보호를 위하여\n자배법령이 정한 바에 따라 <b>중대한 과실이 있는 경우에만</b> 감액하며,\n그 감액 폭도 제한된다는 점에서 대인배상Ⅱ와 다르다.</p>\n", "keys": ["신분상", "생활관계상 일체", "공평한 분담", "감독의무자", "호의동승", "대인배상Ⅰ", "중대한 과실"], "law": ["민법 제396조", "민법 제763조", "자동차손해배상 보장법 시행령 별표"]}}, {"no": 6, "body": "자동차보험약관의 구속력에 대하여 약술하시오. (10점)", "sub": [10], "points": 10, "a": {"plan": "‘왜 약관이 사람을 구속하는가(계약설)’에서 시작해 요건 → 한계 → 자동차보험 특유의 문제(지급기준의 구속력)로 내려간다. 마지막 논점이 이 문항의 핵심이다.", "ans": "\n<h4>1. 구속력의 근거</h4>\n<p>보통보험약관은 <b>그 자체가 법규범이 아니다</b>.\n약관이 당사자를 구속하는 것은 당사자가 그 약관을 <b>계약의 내용으로 삼기로 합의</b>하였기 때문이라는 것이\n통설과 판례의 태도이다(의사설·계약설).\n법규범이라고 보는 견해(규범설)도 있으나, 감독당국의 인가를 받았다는 사정만으로\n당사자를 구속하는 힘이 생기지는 않는다.</p>\n\n<h4>2. 구속력이 생기기 위한 요건</h4>\n<ul>\n<li><b>① 명시·교부</b> — 보험자는 계약을 체결할 때 약관을 교부하여야 한다.</li>\n<li><b>② 중요한 내용의 설명</b> — 상법 제638조의3과 약관규제법 제3조.\n이를 위반하면 그 약관 조항을 <b>계약의 내용으로 주장할 수 없다</b>.</li>\n</ul>\n<p>다만 거래상 일반적이고 공통되어 계약자가 별도의 설명 없이도 예상할 수 있었던 사항,\n법령에 정하여진 것을 되풀이하거나 부연하는 데 지나지 않는 사항은 설명의무의 대상이 아니다.</p>\n\n<h4>3. 구속력의 한계</h4>\n<ul>\n<li><b>개별약정 우선</b> — 약관과 다른 개별약정이 있으면 그것이 앞선다(약관규제법 제4조).</li>\n<li><b>불이익변경금지</b> — 가계보험에서 약관이 상법의 규정보다 계약자·피보험자·보험수익자에게\n불리하면 그 부분은 무효이다(상법 제663조).</li>\n<li><b>불공정약관조항의 무효</b> — 신의성실에 반하여 공정을 잃은 조항은 무효이다(약관규제법 제6조 이하).</li>\n<li><b>작성자 불이익의 원칙</b> — 뜻이 분명하지 아니한 조항은 고객에게 유리하게 해석한다.</li>\n</ul>\n\n<h4>4. 자동차보험에서 특히 문제되는 것</h4>\n<p><b>가. 대인배상Ⅰ</b>은 자배법에 따른 <b>의무보험</b>이므로 법령이 약관보다 앞선다.\n약관으로 보상범위를 법령보다 좁힐 수 없고, 면책약관도 자배법의 취지에 반하는 범위에서는 효력이 없다.</p>\n<p><b>나. 약관상 대인배상 지급기준의 구속력.</b>\n판례는 약관에 붙은 <b>보험금 지급기준(별표)</b>이 보험자와 계약자 사이에서 보험금을 산정하는 기준일 뿐이고,\n<b>피해자가 직접청구권을 행사하는 소송에서 법원은 그 기준에 구속되지 않는다</b>고 본다.\n법원은 <b>법률상 손해배상액</b>을 따로 산정한다. 즉 지급기준은 재판규범이 아니다.</p>\n<p><b>다. 무면허·음주운전 면책약관</b>은\n보험계약자나 피보험자의 <b>명시적·묵시적 승인</b>이 있는 경우에 한하여 적용된다는 것이 판례이며,\n의무보험 부분에는 면책 대신 <b>사고부담금</b> 제도가 적용된다.</p>\n", "keys": ["법규범이 아니다", "합의", "제638조의3", "약관규제법", "제663조", "지급기준", "재판규범", "직접청구권"], "law": ["상법 제638조의3", "상법 제663조", "약관의 규제에 관한 법률 제3조·제4조·제5조·제6조", "자동차손해배상 보장법 제10조"]}}]}, {"round": 49, "subject": "회계원리", "track": "재물", "src": "49회_2차 회계원리.pdf", "chars": 5344, "digits": 813, "pts_ok": true, "q": [{"no": 1, "body": "(주)한국은 기초 설립자산 현금 ￦1,000으로 영업을 시작하였다. 기초에 상품\nA를 단위당 ￦100에 10개를 매입하고, 기중에 6개를 단위당 ￦150에 판매하였다.\n당기 말 자산은 현금 ￦900과 상품 A 4개이다. 당기 말 상품 A의 현행원가는\n￦200, 판매가는 ￦250이고, 당기 일반물가인상률은 10%일때, 실물자본유지개념\n관점에서 (주)한국의 당기손익은? (5점)", "sub": [5], "points": 5, "a": {"plan": "실물자본유지는 ‘같은 실물을 다시 살 수 있는가’를 묻는다. 기초 자본을 기말 현행원가로 환산해 놓고 기말 순자산과 견준다.", "ans": "\n<h4>0. 자료의 정리</h4>\n<span class=\"tb\">기초   현금 ￦1,000으로 설립\n       상품 A 10개 × ￦100 = ￦1,000 매입   →  현금 0, 상품 10개\n\n기중   6개 × ￦150 = ￦900 판매             →  현금 900, 상품 4개\n\n기말   현금 ￦900 + 상품 A 4개\n       상품 A 현행원가 ￦200 / 판매가 ￦250\n       일반물가인상률 10%</span>\n\n<h4>Ⅰ. 세 가지 자본유지개념</h4>\n<span class=\"tb\">① 재무자본유지 — 명목화폐단위\n   이익 = 기말 순자산 - 기초 순자산\n   물가변동을 고려하지 않는다\n\n② 재무자본유지 — 불변구매력단위\n   이익 = 기말 순자산 - (기초 순자산 × 일반물가지수 변동)\n   「같은 구매력」을 유지한 뒤의 몫이 이익이다\n\n③ 실물자본유지\n   이익 = 기말 순자산(현행원가) - 기초 실물생산능력을 유지하는 데 필요한 금액\n   「같은 실물(조업능력)」을 다시 갖출 수 있고 남는 몫이 이익이다\n   → 자산은 「현행원가」로 측정한다</span>\n<p>실물자본유지개념에서는\n<b>자산가격의 변동으로 생긴 몫</b>은 이익이 아니라\n<b>자본유지조정</b>으로 자본에 직접 반영한다.</p>\n\n<h4>Ⅱ. 계산</h4>\n\n<h4>1. 기말 순자산 (현행원가)</h4>\n<span class=\"tb\">현금                              900\n상품 A  4개 × 현행원가 200      =  800\n──────────────────────────────────────\n기말 순자산                      1,700\n\n※ 판매가 250은 쓰지 않는다.\n  실물자본유지는 「다시 사들이는 원가(현행원가)」로 측정한다.</span>\n\n<h4>2. 유지하여야 할 기초 실물자본</h4>\n<span class=\"tb\">기초 자본 ￦1,000은\n상품 A를 단위당 ￦100에 「10개」 살 수 있는 실물생산능력이었다.\n\n기말에 같은 실물생산능력을 갖추려면\n  10개 × 현행원가 200  =  2,000 이 필요하다.</span>\n\n<h4>3. 당기손익</h4>\n<span class=\"tb\">기말 순자산(현행원가)             1,700\n유지하여야 할 실물자본           2,000\n──────────────────────────────────────\n당기손익                          △300\n\n  →  「손실 ￦300」</span>\n\n<h4>Ⅲ. 다른 개념과 견주어 보면</h4>\n<span class=\"tb\">① 재무자본유지(명목화폐)\n   1,700 - 1,000                 =  이익  700\n\n② 재무자본유지(불변구매력)\n   1,700 - (1,000 × 1.1 = 1,100) =  이익  600\n\n③ 실물자본유지\n   1,700 - 2,000                 =  손실  300</span>\n<p>같은 사실을 놓고도 <b>무엇을 ‘자본’으로 보느냐</b>에 따라\n<b>700원의 이익이 300원의 손실로 뒤집힌다</b>.</p>\n\n<h4>왜 이렇게 갈리는가</h4>\n<p>상품의 <b>현행원가가 100에서 200으로 두 배</b>가 되었는데\n<b>일반물가는 10%</b>밖에 오르지 않았다.</p>\n<span class=\"tb\">명목화폐 기준   가격이 오른 몫(보유이익)을 모두 이익으로 본다\n불변구매력 기준 일반물가 상승분(10%)만 자본유지에 쓰고 나머지는 이익\n실물자본 기준   같은 물건을 다시 사는 데 드는 돈을 모두 자본유지에 쓴다\n                → 자본유지조정 1,000이 자본으로 직접 들어가고\n                  남는 것이 없어 오히려 손실이 된다</span>\n<p><b>물가가 크게 오르는 국면</b>에서\n<b>명목이익만 보고 배당하면 기업의 실물생산능력이 잠식된다</b>는 것이\n실물자본유지개념이 경고하는 바이다.</p>\n", "keys": ["실물자본유지", "현행원가", "기말 순자산 1,700", "10개 × 200 = 2,000", "손실 300", "자본유지조정", "재무자본유지 명목화폐 700", "불변구매력 600", "판매가는 쓰지 않는다"], "law": ["재무보고를 위한 개념체계 — 자본 및 자본유지개념"]}}, {"no": 2, "body": "다음은 20×1년도 (주)한국의 재무제표와 거래 자료 중 일부이다.\n- 기초상품재고 ￦6,000 - 기말상품재고 ￦5,500\n- 기초매입채무 ￦4,000 - 기말매입채무 ￦6,000\n- 당기매입 중 현금지급액 ￦17,500\n- 당기매입 중 현금할인 ￦2,000\n- 재고자산 평가손실 ￦500(매출원가로 처리)\n- 매출총이익 ￦5,000\n(주)한국의 20×1년도 손익계산서 상 매출액은? (5점)", "sub": [5], "points": 5, "a": {"plan": "매입채무 T계정으로 총매입을 뽑고 매입할인을 뺀다. 평가손실은 매출원가에 얹고, 마지막에 매출총이익을 더한다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">기초상품재고            ￦6,000\n기말상품재고            ￦5,500\n기초매입채무            ￦4,000\n기말매입채무            ￦6,000\n당기매입 중 현금지급액  ￦17,500\n당기매입 중 현금할인    ￦2,000\n재고자산 평가손실       ￦500 (매출원가로 처리)\n매출총이익              ￦5,000</span>\n\n<h4>Ⅰ. 1단계 — 매입채무 계정으로 총매입액을 구한다</h4>\n<span class=\"tb\">              매입채무\n──────────────────────────────────────\n현금지급   17,500 │ 기초        4,000\n매입할인    2,000 │ 당기매입        X\n기말        6,000 │\n──────────────────────────────────────\n합계       25,500 │ 합계      4,000 + X\n\n4,000 + X = 25,500\n        X = 21,500</span>\n<p><b>현금할인(매입할인)</b>도 매입채무를 줄이는 항목이므로\n차변에 함께 놓아야 한다. 이것을 빠뜨리면 총매입액이 2,000 작아진다.</p>\n\n<h4>Ⅱ. 2단계 — 순매입액</h4>\n<span class=\"tb\">총매입액                21,500\n매입할인               - 2,000\n──────────────────────────────\n순매입액                19,500</span>\n<p>매입할인은 <b>매입원가에서 차감</b>한다.\nK-IFRS는 재고자산의 취득원가에서\n<b>매입할인·리베이트 및 기타 유사한 항목</b>을 차감하도록 정하고 있다.</p>\n\n<h4>Ⅲ. 3단계 — 매출원가</h4>\n<span class=\"tb\">기초상품재고             6,000\n순매입액                19,500\n──────────────────────────────\n판매가능재고            25,500\n기말상품재고           - 5,500\n──────────────────────────────\n                        20,000\n재고자산 평가손실         + 500   (매출원가로 처리)\n──────────────────────────────\n매출원가                20,500</span>\n\n<h4>Ⅳ. 4단계 — 매출액</h4>\n<span class=\"tb\">매출원가                20,500\n매출총이익             + 5,000\n──────────────────────────────\n매출액                  25,500</span>\n\n<h4>답 : ￦25,500</h4>\n\n<h4>Ⅴ. 짚어 둘 점</h4>\n<ul>\n<li><b>재고자산 평가손실의 처리</b><br>\nK-IFRS는 <b>“재고자산을 순실현가능가치로 감액한 평가손실은\n감액이 발생한 기간에 <u>비용으로 인식</u>한다”</b>고 정한다.\n실무에서는 <b>매출원가에 가산</b>하는 것이 일반적이며,\n문제도 <b>“매출원가로 처리”</b>라고 지시하였다.</li>\n\n<li><b>기말재고 5,500의 성격</b><br>\n이 답안은 5,500을 <b>평가손실을 반영하기 전의 취득원가</b>로 보았다.\n따라서 재무상태표에 실리는 재고자산은 5,000이 된다.\n만약 5,500이 <b>이미 평가손실을 반영한 금액</b>이라면\n평가손실은 기말재고의 감소로 이미 매출원가에 들어간 것이므로\n다시 더하지 않고 매출원가 20,000, 매출액 25,000이 된다.\n문제가 평가손실을 <b>별도 항목으로 제시</b>하였으므로\n가산하는 쪽으로 풀었다.</li>\n\n<li><b>현금할인과 매출할인의 방향</b><br>\n매입 쪽의 할인은 <b>매입원가 차감</b>,\n매출 쪽의 할인은 <b>매출액 차감</b>이다. 방향을 헷갈리지 않아야 한다.</li>\n</ul>\n", "keys": ["매입채무 T계정", "현금할인도 매입채무 감소", "총매입 21,500", "순매입 19,500", "매출원가 20,000", "평가손실 500 가산", "매출원가 20,500", "매출총이익 5,000", "매출액 25,500"], "law": ["K-IFRS 제1002호 재고자산"]}}, {"no": 3, "body": "(주)한국의 20×1년 말 자산 항목이 다음과 같을 때, 재무상태표상의\n투자부동산으로 분류되는 항목들의 합계는? (5점)\n- 직접 소유하고 운용리스로 제공하고 있는 건물 ￦100\n- 금융리스로 제공한 토지 ￦130\n- 운용리스 제공목적으로 보유 중인 미사용 건물 ￦150\n- 처분예정인 자가 사용 건물 ￦170\n- 단기 매매차익을 위해 보유 중인 토지 ￦200\n- 장래 용도 미결정인 보유중 토지 ￦220", "sub": [5], "points": 5, "a": {"plan": "‘임대수익이나 시세차익’이라는 목적 하나로 가른다. 금융리스 제공분과 단기 매매목적 토지가 빠지는 것이 함정이다.", "ans": "\n<h4>0. 투자부동산의 정의</h4>\n<p>K-IFRS 제1040호는 투자부동산을\n<b>“<u>임대수익이나 시세차익 또는 둘 다</u>를 얻기 위하여\n<u>소유자가</u>(또는 사용권자산인 경우 리스이용자가) 보유하고 있는 부동산”</b>이라 한다.</p>\n<span class=\"tb\">투자부동산이 아닌 것\n\n  자가사용부동산    재화나 용역의 생산·제공 또는 관리목적에 사용\n                    → 유형자산(K-IFRS 제1016호)\n\n  판매목적 부동산    통상적인 영업과정에서 판매하기 위한 부동산\n                    → 재고자산(K-IFRS 제1002호)</span>\n<p><b>“무엇에 쓰려고 가지고 있는가”</b> 하나로 갈린다.</p>\n\n<h4>Ⅰ. 항목별 판단</h4>\n\n<h4>① 직접 소유하고 운용리스로 제공하고 있는 건물 ￦100 → 투자부동산 ○</h4>\n<p>기준서가 드는 <b>전형적인 예</b>이다.\n<b>“소유자가 직접 소유하고 운용리스로 제공하고 있는 건물”</b>은\n<b>임대수익</b>을 얻기 위한 것이므로 투자부동산이다.</p>\n\n<h4>② 금융리스로 제공한 토지 ￦130 → 투자부동산 ×</h4>\n<span class=\"tb\">금융리스는 「소유에 따른 위험과 보상의 대부분」이\n리스이용자에게 이전되는 리스이다.\n\n리스제공자는\n  · 해당 자산을 재무상태표에서 「제거」하고\n  · 대신 「리스채권(금융자산)」을 인식한다\n\n  → 애초에 부동산으로 남아 있지 않으므로\n    투자부동산이 될 수 없다.</span>\n\n<h4>③ 운용리스 제공목적으로 보유 중인 미사용 건물 ￦150 → 투자부동산 ○</h4>\n<p>기준서는 <b>“장래 운용리스로 제공하기 위하여 보유하고 있는\n미사용 건물”</b>을 투자부동산의 예로 든다.</p>\n<p><b>지금 비어 있다는 사실</b>은 문제되지 않는다.\n<b>보유 목적</b>이 임대이면 족하다.</p>\n\n<h4>④ 처분예정인 자가사용 건물 ￦170 → 투자부동산 ×</h4>\n<span class=\"tb\">「자가사용부동산」은 유형자산이다.\n\n처분을 앞두고 있더라도\n  · 계속 자가사용 중이면 → 유형자산\n  · 매각예정 요건을 갖추면 → 「매각예정비유동자산」\n    (K-IFRS 제1105호)\n\n  → 어느 쪽이든 투자부동산은 아니다.</span>\n<p>기준서는 <b>“처분예정인 자가사용부동산”</b>을\n투자부동산이 아닌 항목으로 명시하고 있다.</p>\n\n<h4>⑤ 단기 매매차익을 위해 보유 중인 토지 ￦200 → 투자부동산 ×</h4>\n<span class=\"tb\">「장기 시세차익」을 얻기 위한 토지  →  투자부동산  ○\n「단기 매매차익」을 얻기 위한 토지  →  재고자산    ×\n\n기준서는 「통상적인 영업과정에서 판매하기 위한 부동산이나\n이러한 목적으로 건설 또는 개발 중인 부동산\n(가까운 장래에 판매하거나 개발하여 판매하기 위한 목적으로만\n취득한 부동산 등)」을 투자부동산에서 제외한다.</span>\n<p><b>‘단기’</b>라는 한 단어가 답을 뒤집는다.</p>\n\n<h4>⑥ 장래 용도 미결정인 보유 중 토지 ￦220 → 투자부동산 ○</h4>\n<p>기준서는 이렇게 정한다.</p>\n<p><b>“장래 사용목적을 결정하지 못한 채로 보유하고 있는 토지.\n만약 토지를 <u>자가사용할지 또는 통상적인 영업과정에서 단기간에 판매할지를\n결정하지 못한 경우</u>, 그 토지는 <u>시세차익을 얻기 위하여 보유</u>한다고 본다.”</b></p>\n<p>결정하지 못한 상태는 <b>시세차익 목적으로 간주</b>한다는 것이다.</p>\n\n<h4>Ⅱ. 답</h4>\n<span class=\"tb\">① 운용리스로 제공하고 있는 건물               100\n③ 운용리스 제공목적 보유 중인 미사용 건물      150\n⑥ 장래 용도 미결정인 보유 중 토지              220\n──────────────────────────────────────────────\n투자부동산 합계                              ￦470</span>\n\n<h4>Ⅲ. 정리 — 한 줄로 기억하기</h4>\n<span class=\"tb\">빌려주려고 가지고 있으면        투자부동산\n값이 오르기를 기다리면(장기)   투자부동산\n아직 정하지 못했으면           투자부동산 (시세차익으로 본다)\n\n내가 쓰려고 가지고 있으면      유형자산\n팔려고 가지고 있으면(단기)     재고자산\n금융리스로 넘겼으면            리스채권 (부동산이 아니다)</span>\n", "keys": ["임대수익이나 시세차익", "K-IFRS 제1040호", "운용리스로 제공하고 있는 건물", "금융리스는 자산 제거", "리스채권", "미사용 건물", "처분예정인 자가사용부동산", "단기 매매차익은 재고자산", "장래 사용목적 미결정", "시세차익을 얻기 위하여 보유한다고 본다", "470"], "law": ["K-IFRS 제1040호 투자부동산", "K-IFRS 제1016호 유형자산", "K-IFRS 제1105호 매각예정비유동자산", "K-IFRS 제1116호 리스"]}}, {"no": 4, "body": "(주)한국은 영업활동에 사용할 목적으로 20×1년 1월 1일 건물(취득원가 600억 원,\n내용연수 6년, 추정잔존가치 0원)을 취득했으며, 감가상각방법으로 정액법을\n사용한다. (주)한국은 원가모형을 적용하던 유형자산의 후속측정방법을 20×3년\n부터 재평가모형으로 변경하였다. 아래의 시점별 건물가치 측정 자료를 보고\n다음 물음에 답하시오.\n<각 연도말 건물가치 측정 관련 자료>\n시점 공정가치 처분부대원가 사용가치\n20×1년 말 ￦450 ￦100 ￦400\n20×2년 말 ￦550 ￦100 ￦350\n20×3년 말 ￦500 ￦50 ￦400\n20×4년 말 ￦600 ￦50 ￦450\n(1) (주)한국이 20×2년 말 인식할 손상차손 또는 손상차손환입은? (5점)\n(2) (주)한국은 해당 건물을 20×4년 말 현금 600억 원을 받고 처분하였다.\n해당 건물의 재평가 여부를 제외하고 다른 상황이 모두 동일하다면,\n원가모형을 선택했을 때와 재평가모형을 선택했을 때 각각의 20×4년 말\n재무상태표 자본총액 차이는? (5점)", "sub": [5, 5], "points": 10, "a": {"plan": "(1)은 손상 후 상각을 다시 잡고 환입한도(손상 없었을 경우의 장부금액)를 씌운다. (2)는 계산보다 ‘총액은 같다’는 이치를 보이는 문제다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">20×1. 1. 1.  건물 취득  취득원가 600, 내용연수 6년, 잔존가치 0, 정액법\n             → 연 감가상각비 100\n\n20×3년부터 원가모형 → 「재평가모형」으로 변경\n\n시점         공정가치   처분부대원가   사용가치\n20×1년 말      450          100          400\n20×2년 말      550          100          350\n20×3년 말      500           50          400\n20×4년 말      600           50          450\n\n(단위: 억원. 이하 단위 표기를 생략한다)</span>\n<span class=\"tb\">회수가능액 = Max( 순공정가치 , 사용가치 )\n순공정가치 = 공정가치 - 처분부대원가</span>\n\n<h3>(1) 20×2년 말 손상차손 또는 손상차손환입 (5점)</h3>\n\n<h4>Ⅰ. 20×1년 말 — 손상차손 100</h4>\n<span class=\"tb\">감가상각 후 장부금액   600 - 100        = 500\n\n회수가능액\n  순공정가치  450 - 100 = 350\n  사용가치            400\n  Max[350, 400]                        = 400\n\n장부금액 500 > 회수가능액 400\n  →  손상차손  100  인식\n\n손상 후 장부금액                        = 400</span>\n\n<h4>Ⅱ. 20×2년 — 상각을 다시 잡는다</h4>\n<span class=\"tb\">손상 후에는 「손상 후 장부금액」을 「잔존내용연수」에 걸쳐 상각한다.\n\n잔존내용연수  6년 - 1년 = 5년\n20×2년 감가상각비  400 ÷ 5년           =  80\n\n20×2년 말 감가상각 후 장부금액  400 - 80 = 320</span>\n<p><b>연 100이 아니라 80</b>이다.\n손상 후 상각액을 다시 계산하지 않으면 이 문제는 처음부터 어긋난다.</p>\n\n<h4>Ⅲ. 20×2년 말 — 손상차손환입</h4>\n<span class=\"tb\">회수가능액\n  순공정가치  550 - 100 = 450\n  사용가치            350\n  Max[450, 350]                        = 450\n\n환입한도\n  「과거에 손상차손을 인식하지 않았더라면\n    기록되었을 장부금액(상각 후)」\n  600 - (100 × 2년)                    = 400\n\n환입 후 장부금액 = Min[회수가능액 450, 환입한도 400] = 400\n\n손상차손환입 = 400 - 320                =  80</span>\n\n<h4>답 (1) : 손상차손환입 ￦80(억원)</h4>\n<p><b>환입한도</b>를 씌우지 않으면 450 − 320
