취지 한 줄, 내용 세 가지, 중재 조항의 이유까지 적는다.", "ans": "\n<h3>Ⅰ. 제정 취지</h3>\n\n<h4>1. 혼동(混同)의 법리라는 벽</h4>\n<span class=\"tb\">민법의 「혼동」\n  채권과 채무가 같은 사람에게 돌아가면 채권은 소멸한다.\n\n같은 선주가 A선과 B선을 모두 소유하고 있는데\nA선과 B선이 충돌하였다면?\n\n  · A선의 손해에 대한 B선주의 배상책임 → 채권자 = 채무자\n  · 법률상 손해배상책임이 「성립하지 아니한다」\n  · 자기가 자기에게 구조료를 청구할 수도 없다</span>\n\n<h4>2. 그러면 보험은 어떻게 되는가</h4>\n<span class=\"tb\">선박보험의 충돌배상책임(Clause 8)은\n「피보험자가 법률상 손해배상책임을 짐으로써 입은 손해」를 보상한다.\n\n  → 법률상 책임이 성립하지 않으면 보험금도 나오지 않는다.\n  → 구조를 받아도 구조료 채권이 성립하지 않으므로\n    구조비를 보상받지 못한다.\n\n  보험료는 똑같이 냈는데\n  「상대가 하필 자기 배였다」는 우연한 사정 때문에\n  보상을 받지 못하게 된다.  불합리하다.</span>\n\n<h4>3. 그래서 만든 조항</h4>\n<p><b>자매선(sistership)을 남의 배인 것처럼 다루어\n피보험자가 보험금을 받을 수 있게 하는 것</b>이\n자매선 조항의 취지이다.</p>\n<p>곧 <b>혼동의 법리 때문에 생기는 담보의 빈틈을\n약관으로 메운 조항</b>이다.</p>\n\n<h3>Ⅱ. 조항의 내용</h3>\n<p>ITC-Hulls (1/10/83) Clause 9 (Sistership)</p>\n<p><b>“이 보험에 부보된 선박이\n<u>전부 또는 일부가 동일한 소유자에게 속하거나\n동일한 관리 아래에 있는 다른 선박</u>과\n<u>충돌</u>하거나 그 선박으로부터 <u>구조를 받은</u> 경우,\n피보험자는 그 다른 선박이\n<u>이 보험에 부보된 선박과 아무런 이해관계가 없는 소유자의 재산인 경우와\n동일한 권리</u>를 이 보험에 따라 가진다.\n다만 이 경우 <u>충돌에 대한 책임 또는 제공된 역무에 대하여 지급할 금액</u>은\n<u>보험자와 피보험자가 합의하여 선임한 단독 중재인</u>에게 회부한다.”</b></p>\n\n<h4>1. 적용 대상</h4>\n<span class=\"tb\">「전부 또는 일부가 동일한 소유자에게 속하는 선박」\n  → 지분의 일부만 같아도 적용된다\n\n「동일한 관리(management) 아래에 있는 선박」\n  → 소유자가 달라도 같은 선박관리회사가 관리하면 적용된다\n  → 오늘날 편의치적과 1선 1사(one ship company)가 일반화되어\n    「소유」보다 「관리」가 더 중요한 기준이 되었다</span>\n\n<h4>2. 적용되는 사고</h4>\n<span class=\"tb\">① 자매선과의 「충돌」\n     → Clause 8의 3/4 충돌배상책임을 그대로 적용한다\n\n② 자매선으로부터의 「구조(salvage services)」\n     → 구조비를 보험자가 보상한다</span>\n\n<h4>3. 효과</h4>\n<p>피보험자는 <b>상대선이 전혀 무관한 타인의 선박인 경우와\n똑같은 권리</b>를 갖는다.\n곧 <b>혼동이 없었던 것처럼</b> 다룬다.</p>\n\n<h4>4. 단독 중재인에의 회부 — 이 조항의 안전장치</h4>\n<span class=\"tb\">왜 중재에 회부하는가\n\n  자기 배끼리의 사고이므로\n  · 과실비율을 자기에게 유리하게 정할 수 있고\n  · 구조료를 부풀릴 수 있다\n  → 「도덕적 위험(moral hazard)」이 크다\n\n  그래서 「금액의 결정」만은 당사자에게 맡기지 않고\n  보험자와 피보험자가 「합의하여 선임한 단독 중재인」에게 맡긴다.</span>\n<p>중재의 대상은 <b>“충돌에 대한 책임 또는 제공된 역무에 대하여 지급할 금액”</b>,\n곧 <b>과실비율과 금액</b>이다.\n<b>보험자의 보상책임 유무 자체</b>를 중재에 맡기는 것이 아니다.</p>\n\n<h4>Ⅲ. 함께 알아 둘 것</h4>\n<ul>\n<li><b>적하보험에도 같은 취지의 조항</b>이 있다.\nICC 1982에는 명시되어 있지 않으나,\n운송인이 화주와 동일인인 경우의 처리가 실무상 문제된다.</li>\n\n<li><b>공동해손</b>에서도 같은 문제가 생긴다.\n자기 선박에 자기 화물을 실은 경우\n공동해손 분담관계가 성립하는지가 다투어진다.</li>\n\n<li><b>Clause 9는 「의제(擬制)」 조항</b>이다.\n법률관계를 바꾸는 것이 아니라\n<b>보험금 지급의 관계에서만</b> 타인의 선박으로 본다.\n따라서 <b>실제로 배상금이 오가지 않아도</b> 보험금은 지급된다.</li>\n</ul>\n", "keys": ["혼동", "채권자와 채무자가 같은 사람", "법률상 배상책임이 성립하지 않는다", "담보의 빈틈", "전부 또는 일부가 동일한 소유자", "동일한 관리", "충돌", "구조를 받은 경우", "아무런 이해관계가 없는 소유자의 재산인 경우와 동일한 권리", "단독 중재인", "도덕적 위험", "의제 조항"], "law": ["Institute Time Clauses – Hulls (1/10/83) Cl.8·9", "민법 제507조(혼동)"]}}, {"no": 9, "body": "런던해상보험자협회(ILU) 가입 보험사들과 로이즈해상보험자들은 1937년\n12월에 「War Risks Waterborne Agreement」를 맺었는 바, 「Institute\nWar Clauses (Cargo) 1982」에서 Waterborne Agreement와 관련된\n내용을 약술하시오. (5점)", "sub": [5], "points": 5, "a": {"plan": "‘창고에서 창고까지’가 아니라 ‘선측에서 선측까지’라는 한 줄이 핵심이다. 개시·종료·15일·부선 60일을 정확히 적는다.", "ans": "\n<h4>Ⅰ. Waterborne Agreement의 배경</h4>\n<span class=\"tb\">1937년 12월\n  런던해상보험자협회(ILU) 가입 보험사들과\n  로이즈 해상보험자들이 맺은 협정</span>\n<p>1930년대 후반, 유럽에서 전쟁의 기운이 짙어지면서\n<b>전쟁위험의 성격</b>이 근본적으로 달라졌다.</p>\n<span class=\"tb\">종전의 전쟁위험\n  포획·나포·해상에서의 포격 등 「바다 위」의 위험\n\n새로운 전쟁위험\n  항공기에 의한 「공습」\n  → 항구와 창고에 쌓인 화물이 한꺼번에 파괴된다\n  → 한 번의 공습으로 수백 건의 보험사고가 동시에 터진다\n  → 「누적위험(accumulation)」을 감당할 수 없다</span>\n<p>그래서 보험자들은\n<b>“화물이 배 위에 있는 동안에만 전쟁위험을 담보한다”</b>고\n스스로 합의하였다.\n이것이 <b>Waterborne Agreement(수면약정)</b>이다.</p>\n<span class=\"tb\">적하보험의 일반 담보기간은\n  「창고에서 창고까지(Warehouse to Warehouse)」\n\n전쟁위험의 담보기간은\n  「선측에서 선측까지(Waterborne to Waterborne)」</span>\n\n<h4>Ⅱ. Institute War Clauses (Cargo) 1/1/82에서의 구현</h4>\n<p>이 협정의 내용은 <b>제5조 운송조항(Transit Clause)</b>에 담겨 있다.</p>\n\n<h4>1. 담보의 개시 (5.1.1)</h4>\n<p><b>“이 보험은 보험목적물이,\n그리고 그 일부에 관하여는 그 일부가\n<u>본선(oversea vessel)에 적재되는 때에 비로소 개시</u>한다.”</b></p>\n<span class=\"tb\">일반 적하보험처럼 「창고를 떠날 때」가 아니다.\n「본선에 적재되는 때」이다.\n\n  → 창고에서 부두까지의 육상운송 구간,\n    부두에 쌓여 있는 동안은 전쟁위험이 담보되지 않는다.</span>\n\n<h4>2. 담보의 종료 (5.1.2)</h4>\n<p><b>“다음 가운데 <u>먼저 오는 때</u>에 종료한다.\n① 최종 양륙항 또는 양륙지에서 <u>본선으로부터 양하되는 때</u>\n② 본선이 최종 양륙항 또는 양륙지에 <u>도착한 날의 자정부터 15일이 경과한 때</u>”</b></p>\n<span class=\"tb\">개시   본선 적재\n종료   본선 양하  또는  도착일 자정부터 15일 경과\n       (둘 중 먼저 오는 때)\n\n  → 양하가 늦어지더라도 도착 후 15일이 지나면 끝난다.\n    항구에 쌓여 있는 화물의 누적위험을 끊기 위한 것이다.</span>\n\n<h4>3. 재개시 (5.1.3 ~ 5.1.4)</h4>\n<span class=\"tb\">최종 양륙항에서 화물을 양하하지 아니한 채\n본선이 그 항구를 「출항」하면 보험이 「다시 개시」된다.\n(보험자에 대한 지체 없는 통지와 추가보험료를 조건으로 한다)\n\n그 뒤 최종(또는 대체) 양륙항에서 양하되는 때 또는\n재도착일·대체항 도착일 자정부터 15일이 경과한 때 중\n먼저 오는 때에 종료한다.</span>\n\n<h4>4. 중간항에서의 양하와 계반 (5.2)</h4>\n<span class=\"tb\">항해 중 본선이 계반(on-carriage)을 위하여 중간항에서 양하하거나\n피난항에서 화물이 양하된 경우\n\n  · 그 항구 도착일 자정부터 「15일」이 경과할 때까지 담보가 계속되고\n    (지체 없는 통지와 추가보험료를 조건으로 한다)\n  · 그 15일 안에 계반선에 적재되면 보험이 「다시 개시」된다\n  · 15일 동안은 화물이 「그 항구 또는 장소에 있는 동안에만」 유효하다\n\n  · 계반이 「항공기」에 의한 경우에는\n    Institute War Clauses (Air Cargo)가 적용된다</span>\n\n<h4>5. 부선(craft) 구간의 예외 (5.3)</h4>\n<p><b>“<u>기뢰(mines)와 유기된 어뢰(derelict torpedoes)</u>,\n곧 떠 있거나 잠겨 있는 것에 관하여는,\n보험목적물이 본선에 오가는 부선(craft)에 실려 운송되는 동안에도\n이 보험이 연장된다.\n다만 보험자가 따로 합의하지 아니하는 한\n<u>본선으로부터 양하된 후 60일</u>을 넘지 아니한다.”</b></p>\n<span class=\"tb\">부선 구간은 원칙적으로 「waterborne」이 아니지만,\n「기뢰와 유기 어뢰」의 위험만은 예외적으로 담보한다.\n\n  · 부선도 바다 위에 있으므로 기뢰에 걸릴 수 있고\n  · 이 위험은 공습과 달리 누적되지 않기 때문이다\n\n  기간의 한계는 「본선 양하 후 60일」이다.</span>\n\n<h4>Ⅲ. 정리</h4>\n<span class=\"tb\">                    일반 적하보험        전쟁위험\n\n담보기간의 원칙    Warehouse to        Waterborne to\n                   Warehouse           Waterborne\n\n개시               창고를 떠날 때       본선에 적재될 때\n종료               최종 창고에 인도    본선에서 양하될 때\n                   (또는 60일/30일)     또는 도착 후 15일\n                                        중 먼저 오는 때\n\n부선 구간          담보                기뢰·유기 어뢰에 한하여\n                                        (본선 양하 후 60일 한도)</span>\n<p>전쟁위험은 <b>담보기간이 훨씬 짧다</b>.\n수출입 실무에서 <b>“배에서 내린 뒤 15일이 지나면 전쟁위험이 끊긴다”</b>는 점을\n반드시 확인하여야 하는 이유이다.</p>\n", "keys": ["1937년 12월", "ILU", "로이즈", "Waterborne Agreement", "공습", "누적위험", "Warehouse to Warehouse", "Waterborne to Waterborne", "제5조 Transit Clause", "본선에 적재되는 때 개시", "본선으로부터 양하되는 때", "도착일 자정부터 15일", "먼저 오는 때", "재개시", "중간항 계반 15일", "기뢰와 유기 어뢰", "부선", "본선 양하 후 60일"], "law": ["Institute War Clauses (Cargo) 1/1/82 Cl.5", "War Risks Waterborne Agreement 1937"]}}, {"no": 10, "body": "항공운송인의 국제운송화물에 대한 손해배상책임과 관련하여 현행 우리\n상법상 책임 한도액과 현행 몬트리올 협약(Montreal Conventions)상 kg당\n책임 한도액이 각각 얼마인지 및 kg당 책임제한을 적용하지 못하는 경우에\n대해서 약술하시오. (5점)", "sub": [5], "points": 5, "a": {"plan": "숫자 두 개(19·15 계산단위와 26 SDR)와 한도 배제 사유를 정확히 적는다. 화물은 고의가 있어도 한도가 깨지지 않는다는 점이 핵심이다.", "ans": "\n<h4>Ⅰ. 우리 상법상의 책임한도액</h4>\n<p>상법 제6편(항공운송) 제915조(운송물에 대한 책임한도액)</p>\n<p><b>“① 제913조와 제914조에 따른 운송인의 손해배상책임은\n손해가 발생한 해당 운송물의 <u>1킬로그램당 19 계산단위</u>의 금액을 한도로 하되,\n송하인과의 운송계약상 그 <u>출발지, 도착지 및 중간 착륙지가\n대한민국 영토 내에 있는 운송</u>의 경우에는\n손해가 발생한 해당 운송물의 <u>1킬로그램당 15 계산단위</u>의 금액을 한도로 한다.\n다만, 송하인이 운송물을 운송인에게 인도할 때에\n도착지에서 인도받을 때의 <u>예정가액을 미리 신고</u>한 경우에는\n운송인은 신고 가액이 도착지에서 인도할 때의 실제가액을 초과한다는 것을\n증명하지 아니하는 한 <u>신고 가액을 한도</u>로 책임을 진다.”</b></p>\n<span class=\"tb\">국제운송            1kg당 「19 계산단위」\n국내운송            1kg당 「15 계산단위」\n  (출발지·도착지·중간 착륙지가 모두 대한민국 영토 내)\n\n「계산단위」란 국제통화기금(IMF)의\n「특별인출권(SDR : Special Drawing Right)」을 말한다.</span>\n\n<h4>중량의 산정 (제915조 제2항)</h4>\n<p><b>“항공운송인의 책임한도를 결정할 때 고려하여야 할 중량은\n<u>해당 손해가 발생된 운송물의 중량</u>을 말한다.\n다만, 운송물의 일부 또는 운송물에 포함된 물건의 멸실·훼손 또는 연착이\n<u>동일한 항공화물운송장 또는 화물수령증에 적힌 다른 운송물의 가치에\n영향을 미칠 때</u>에는 운송인의 책임한도를 결정할 때\n그 <u>다른 운송물의 중량도 고려</u>하여야 한다.”</b></p>\n<p>곧 <b>손상된 부분의 중량</b>만 세는 것이 원칙이나,\n<b>한 세트의 일부가 망가져 나머지도 못 쓰게 되는 경우</b>에는\n전체의 중량을 센다.</p>\n\n<h4>Ⅱ. 몬트리올 협약상의 책임한도액</h4>\n<p>몬트리올 협약(1999) 제22조 제3항</p>\n<p><b>“화물 운송에서 파괴·멸실·손상 또는 연착의 경우\n운송인의 책임은 <u>1킬로그램당 [ ] 특별인출권</u>의 금액으로 제한된다.”</b></p>\n<span class=\"tb\">협약은 제24조에 따라 5년마다 물가를 반영하여 한도를 조정한다.\n\n  1999년 채택 당시               17 SDR / kg\n  2009. 12. 30. 시행 (1차 조정)  19 SDR / kg\n  2019. 12. 28. 시행 (2차 조정)  22 SDR / kg\n  2024. 12. 28. 시행 (3차 조정)  「26 SDR / kg」   ← 현행</span>\n<p><b>현행 몬트리올 협약상 화물의 책임한도는 1kg당 26 SDR</b>이다.</p>\n<span class=\"tb\">우리 상법과의 차이\n\n  상법 제915조는 「19 계산단위」로 고정되어 있어\n  협약의 자동조정(현재 26 SDR)을 따라가지 못하고 있다.\n\n  → 국제운송에서 몬트리올 협약이 직접 적용되는 경우에는\n    협약의 26 SDR이 적용되고,\n    협약이 적용되지 않는 경우에 상법의 19 계산단위가 적용된다.\n  → 두 한도가 벌어져 있다는 점이 입법상의 과제로 지적된다.</span>\n\n<h4>Ⅲ. kg당 책임제한을 적용하지 못하는 경우</h4>\n\n<h4>1. 종가신고(special declaration)를 한 경우</h4>\n<p>몬트리올 협약 제22조 제3항 단서</p>\n<p><b>“다만, 송하인이 <u>운송인에게 화물을 인도할 때에\n도착지에서의 인도에 관한 특별한 이익을 신고</u>하고\n필요한 경우 <u>추가 요금을 지급</u>한 경우에는 그러하지 아니하다.\n그 경우 운송인은 <u>신고된 금액을 초과하지 아니하는 금액</u>을 지급할 책임을 진다.\n다만, 운송인이 그 금액이 도착지에서의 인도에 관한\n송하인의 <u>실제 이익을 초과한다는 것을 증명</u>하는 경우에는 그러하지 아니하다.”</b></p>\n<span class=\"tb\">요건\n  ① 「화물을 인도할 때」 신고할 것 (사후 신고는 안 된다)\n  ② 「도착지에서의 인도에 관한 특별한 이익」을 신고할 것\n  ③ 필요한 경우 「추가 요금」을 지급할 것\n\n효과\n  신고 가액을 한도로 책임을 진다.\n  다만 운송인이 「신고 가액 > 실제 이익」임을 증명하면\n  실제 이익까지만 배상한다.\n\n상법 제915조 제1항 단서도 같은 취지로 규정한다.</span>\n\n<h4>2. 운송인이 협약이 정한 서류상의 의무를 위반한 경우</h4>\n<p>몬트리올 협약 제9조: 운송증권의 미발행이나 기재사항의 흠결은\n<b>협약의 적용(책임제한을 포함한다)에 영향을 미치지 아니한다.</b></p>\n<p>곧 <b>바르샤바 체제와 달리</b>\n<b>항공화물운송장의 흠결만으로는 책임제한이 깨지지 않는다</b>.\n이 점은 시험에서 자주 뒤집어 묻는다.</p>\n\n<h4>3. 고의·무모한 행위 — 화물에는 적용되지 않는다</h4>\n<span class=\"tb\">몬트리올 협약 제22조 제5항\n\n  「제1항과 제2항의 규정은\n   손해가 운송인·그 사용인 또는 대리인의\n   「손해를 발생시킬 의도를 가지고 한 작위·부작위」 또는\n   「무모하게, 그리고 손해가 발생할 것을 알면서 한 작위·부작위」로\n   인하여 발생하였음이 증명된 경우에는 적용하지 아니한다」\n\n  그런데 제5항이 배제하는 것은\n  「제1항(여객의 지연)과 제2항(수하물)」뿐이다.\n  「제3항(화물)」은 「들어 있지 않다」.</span>\n<p><b>따라서 화물의 경우에는\n운송인에게 고의나 무모한 행위가 있었더라도\n1kg당 26 SDR의 한도가 깨지지 않는다.</b></p>\n<span class=\"tb\">바르샤바 협약과의 결정적 차이\n\n  바르샤바 협약   고의·무모한 행위가 있으면 화물도 무한책임\n  몬트리올 협약   화물의 책임한도는 「절대적(unbreakable)」이다\n\n  → 화물의 한도를 깨는 길은 「종가신고」 하나뿐이다.\n  → 고가품을 보낼 때에는 반드시 종가신고를 하거나\n    적하보험(항공적하보험)에 가입하여야 하는 이유이다.</span>\n<p>다만 <b>우리 상법 제915조에는 협약 제22조 제5항과 같은\n배제규정이 없어</b>, 국내법 해석상 고의·무모한 행위의 효과를\n어떻게 볼 것인지 논의가 있다.</p>\n\n<h4>Ⅳ. 정리</h4>\n<span class=\"tb\">상법 제915조        국제운송 1kg당 19 계산단위\n                    국내운송 1kg당 15 계산단위\n\n몬트리올 협약       1kg당 26 SDR (2024. 12. 28. 시행)\n\n한도를 적용하지 못하는 경우\n  ① 「종가신고(특별한 이익의 신고)」를 하고 추가요금을 지급한 경우\n     → 신고 가액을 한도로 한다\n       (운송인이 실제 이익을 초과함을 증명하면 실제 이익까지)\n\n  ※ 「고의·무모한 행위」는 여객·수하물에만 적용되고\n    「화물에는 적용되지 않는다」</span>\n", "keys": ["상법 제915조", "1킬로그램당 19 계산단위", "국내운송 15 계산단위", "계산단위 = SDR", "손해가 발생된 운송물의 중량", "다른 운송물의 가치에 영향", "몬트리올 협약 제22조 제3항", "26 SDR", "2024. 12. 28.", "17 → 19 → 22 → 26", "종가신고", "특별한 이익의 신고", "추가 요금", "실제 이익 초과 증명", "제22조 제5항은 화물에 적용되지 않는다", "화물의 책임한도는 절대적", "바르샤바 협약과의 차이"], "law": ["상법 제913조·제914조·제915조", "몬트리올 협약(1999) 제9조·제22조·제24조"]}}, {"no": 11, "body": "해난 구조비용(Salvage Remuneration)의 공동해손 인정과 관련하여\n「York-Antwerp Rules 1994」의 Rule VI조와 「York-Antwerp Rules\n2016」의 Rule VI조 하에서 공동해손으로 인정 가능한 구조비용의\n차이점을 약술하시오. (5점)", "sub": [5], "points": 5, "a": {"plan": "1994년은 원칙 인정, 2016년은 원칙은 같되 다섯 가지 사유가 있어야만 인정하는 제한이 붙는다. 그 제한이 붙은 이유까지 적는다.", "ans": "\n<h4>Ⅰ. York-Antwerp Rules 1994 Rule Ⅵ</h4>\n<p><b>“(a) 해상사업의 당사자가 지출한 <u>구조의 성질을 가지는 비용</u>은,\n계약에 의한 것이든 아니든,\n그 <u>구조작업이 공동의 해상사업에 관련된 재산을\n위험으로부터 보존할 목적</u>으로 수행된 것인 한\n<u>공동해손으로 인정한다.</u>\n공동해손으로 인정되는 비용에는\n1989년 해난구조에 관한 국제협약 제13조 제1항 (b)에서 말하는\n<u>구조자가 환경손해를 방지하거나 최소화한 기량과 노력</u>이\n참작된 구조보수를 포함한다.\n(b) 같은 협약 <u>제14조</u>에 따라 선박소유자가 구조자에게 지급하는\n<u>특별보상(special compensation)</u>은\n<u>공동해손으로 인정하지 아니한다.</u>”</b></p>\n<span class=\"tb\">1994년 규칙의 태도\n\n  구조비 = 「공동의 재산을 함께 구한 비용」\n        → 원칙적으로 「언제나」 공동해손으로 인정한다\n        → 공동해손 분담가액의 비율로 다시 나눈다\n\n  다만 환경손해 방지에 대한 「특별보상(제14조)」은 제외한다\n    (그것은 선박소유자가 환경을 위하여 부담하는 것이고\n     화물을 구한 대가가 아니기 때문이다)</span>\n\n<h4>Ⅱ. York-Antwerp Rules 2016 Rule Ⅵ</h4>\n<p><b>“(a) 해상사업의 당사자가 지출한 구조의 성질을 가지는 비용은,\n계약에 의한 것이든 아니든,\n그 구조작업이 공동의 해상사업에 관련된 재산을\n위험으로부터 보존할 목적으로 수행된 것이고\n<u>(b), (c), (d)의 규정에 따를 것을 조건으로</u> 공동해손으로 인정한다.</b></p>\n<p><b>(b) 위 (a)에도 불구하고,\n<u>공동의 해상사업의 당사자들이 구조자에 대하여\n각각 별개의 계약상 또는 법률상 책임을 지는 경우</u>에는\n<u>다음 가운데 어느 하나가 있는 때에만</u> 구조비를 인정한다.</b></p>\n<span class=\"tb\">(i)   항해 중에 「후속 사고」나 그 밖의 사정으로\n      재산에 멸실·손상이 생겨\n      「구조가액과 분담가액 사이에 상당한 차이」가 생긴 경우\n\n(ii)  「상당한 규모의 공동해손 희생」이 있는 경우\n\n(iii) 「구조가액이 명백히 잘못」되어\n      구조비의 분담이 상당히 잘못 이루어진 경우\n\n(iv)  구조의 당사자 가운데 어느 하나가\n      「다른 당사자가 부담할 구조비의 상당 부분을 지급」한 경우\n\n(v)   당사자 가운데 상당수가\n      「실질적으로 다른 조건으로」 구조청구를 만족시킨 경우\n      (이자·통화조정·구조자나 분담이익의 법률비용은 고려하지 아니한다)</span>\n<p><b>(c)</b> (a)의 구조비에는 환경손해 방지·경감의 기량과 노력이 참작된\n구조보수를 포함한다. (1994년과 같다)</p>\n<p><b>(d)</b> 구조협약 제14조의 특별보상은 공동해손으로 인정하지 아니한다.\n(1994년과 같다)</p>\n\n<h4>Ⅲ. 차이점 — 무엇이 달라졌는가</h4>\n<span class=\"tb\">                        YAR 1994              YAR 2016\n\n원칙                    구조비는 「언제나」    원칙은 같으나\n                        공동해손으로 인정      (b)의 「제한」이 붙는다\n\n당사자들이 구조자에      제한 없이 인정         「다섯 가지 사유」 가운데\n대하여 각각 별개의                             하나가 있어야만 인정\n책임을 지는 경우\n\n환경손해 관련 구조보수  포함                   포함  (같다)\n구조협약 제14조 특별보상 불인정                 불인정 (같다)</span>\n\n<h4>Ⅳ. 왜 제한을 두었는가</h4>\n<span class=\"tb\">오늘날의 구조계약(LOF + SCOPIC 등)에서는\n\n  · 선주와 각 화주가 구조자에 대하여 「각자」 책임을 지고\n  · 구조료는 「구조가액(salved values)」의 비율로 이미 나뉘어\n    각자 지급을 마친다\n\n  그런데 이를 다시 공동해손으로 끌어와\n  「공동해손 분담가액(contributory values)」의 비율로 재배분하면\n\n  · 구조가액과 분담가액은 대개 비슷하므로\n    「결과가 거의 달라지지 않고」\n  · 정산인의 작업량과 비용, 그리고 시간만 크게 늘어난다</span>\n<p>그래서 2016년 규칙은\n<b>“다시 나누어 볼 실익이 있는 경우”에만</b>\n구조비를 공동해손 정산에 넣도록 하였다.</p>\n<p>다섯 가지 사유를 뜯어보면 모두\n<b>“구조가액 비율과 분담가액 비율이 크게 어긋나\n그대로 두면 불공평해지는 경우”</b>이다.</p>\n\n<h4>Ⅴ. 2004년 규칙과의 관계 — 함께 알아 둘 것</h4>\n<span class=\"tb\">YAR 2004 Rule Ⅵ(a)\n\n  「구조비는 그것이 떨어진 곳에 그대로 둔다\n   (shall lie where they fall)」\n  → 구조비를 「아예 공동해손으로 인정하지 아니한다」\n  → 다만 어느 당사자가 다른 당사자의 몫까지 지급한 경우에만\n    정산에서 대차 계상한다</span>\n<span class=\"tb\">1994  원칙적 인정\n2004  원칙적 불인정  (너무 나갔다는 비판을 받았다)\n2016  원칙적 인정 + 실익이 있는 경우에만 정산에 반영\n\n  → 2016년 규칙은 1994년과 2004년의 「절충」이다.\n    선주 측(1994년 선호)과 화주·적하보험자 측(2004년 선호)의\n    타협의 산물이며, 2004년 규칙이 널리 채택되지 못한 이유이기도 하다.</span>\n", "keys": ["YAR 1994 Rule Ⅵ", "구조의 성질을 가지는 비용", "공동의 해상사업에 관련된 재산을 위험으로부터 보존", "원칙적 인정", "구조협약 제13조 제1항 (b) 환경손해", "제14조 특별보상 불인정", "YAR 2016 Rule Ⅵ(b)", "각각 별개의 계약상 또는 법률상 책임", "다섯 가지 사유", "후속 사고", "상당한 공동해손 희생", "구조가액이 명백히 잘못", "다른 당사자의 몫을 지급", "실질적으로 다른 조건", "구조가액과 분담가액", "실익이 있는 경우에만", "YAR 2004 lie where they fall"], "law": ["York-Antwerp Rules 1994 Rule Ⅵ", "York-Antwerp Rules 2004 Rule Ⅵ", "York-Antwerp Rules 2016 Rule Ⅵ", "1989년 해난구조에 관한 국제협약 제13조·제14조"]}}, {"no": 12, "body": "현재 국내에서 사용되고 있는 적하보험약관 중 소위 신약관이라고 불리는\nInstitute Cargo Clauses (A), (B), (C) (1/1/82)의 제정 당시 구약관 Institute\nCargo Clauses (All Risks), (FPA), (WA) (1/1/63)의 약관 내용에는 규정이\n없었던 새롭게 규정된 약관조항 중 제11조 피보험이익(Insurable Interest)\n조항을 약관상에 규정한 배경 및 약관의 내용에 대해 약술하시오. (5점)", "sub": [5], "points": 5, "a": {"plan": "S.G. Policy가 사라지면서 그 안에 있던 ‘Lost or not lost’를 약관 본문으로 옮겨 놓은 조항이다. 두 항의 내용을 정확히 옮긴다.", "ans": "\n<h4>Ⅰ. 규정을 두게 된 배경</h4>\n\n<h4>1. 구약관 시절 — S.G. Policy와 MIA 1906</h4>\n<span class=\"tb\">구약관 ICC(All Risks)(FPA)(WA) 1/1/63은\n「Lloyd's S.G. Policy」라는 본문 증권에 첨부되어 쓰였다.\n\nS.G. Policy는 1779년에 확정된 서식으로,\n그 안에 다음과 같은 유서 깊은 문구가 들어 있었다.\n\n  「Lost or not lost」\n    — 이미 멸실되었든 아니든 —\n\n  곧 「보험계약을 맺을 때 이미 손해가 발생하였더라도\n      당사자가 그것을 몰랐다면 보상한다」는 원칙이다.</span>\n<p>또한 MIA 1906은</p>\n<span class=\"tb\">제6조 제1항\n  「피보험자는 「손해가 발생한 때」에 보험목적물에 대하여\n   피보험이익을 가져야 한다.\n   보험계약을 체결할 때에 이익을 가질 필요는 없다.\n   다만 「lost or not lost」 조건으로 부보된 경우에는,\n   피보험자가 손해를 알고 있었고 보험자는 몰랐던 때가 아니면\n   손해 발생 후에 이익을 취득하여도 보상받을 수 있다.」</span>\n<p>곧 <b>원칙은 법률(MIA)과 증권 본문(S.G. Policy)에 있었고,\n협회약관에는 따로 적을 필요가 없었다</b>.</p>\n\n<h4>2. 신약관에서 명문화가 필요해진 이유</h4>\n<span class=\"tb\">① S.G. Policy의 폐지\n   1982년 신약관은 200년을 써 온 S.G. Policy를 버리고\n   「MAR Form」이라는 백지 증권을 채택하였다.\n   증권 본문에는 아무 내용이 없고 약관이 전부를 정한다.\n\n   → S.G. Policy 안에 있던 「lost or not lost」가 사라졌다.\n   → 약관 본문에 옮겨 적어야 했다.\n\n② 알기 쉬운 약관(plain language)의 지향\n   신약관은 「고문투를 버리고 누구나 읽어 알 수 있게」 만드는 것을\n   목표로 하였다.\n   「Lost or not lost」 같은 관용구 대신\n   그 뜻을 풀어 쓴 조항이 필요하였다.\n\n③ 적하보험 거래의 실제\n   CIF 거래에서 화물은 「운송 중에 전매」되는 일이 잦다.\n   선하증권이 여러 손을 거치는 동안\n   「누가 언제 피보험이익을 갖는가」가 늘 문제가 되었다.\n\n   → 「손해 발생 시」를 기준으로 한다는 점을\n     약관에 분명히 적어 둘 실익이 컸다.\n\n④ 준거법이 영국법이 아닌 경우\n   MIA 1906에만 기대면 준거법이 다른 나라 법인 경우\n   같은 결론이 나오지 않을 수 있다.\n   약관에 적어 두면 계약의 내용이 되어 어디서나 적용된다.</span>\n\n<h4>Ⅱ. 약관의 내용 — ICC 1982 제11조 (Insurable Interest)</h4>\n\n<h4>제11조 제1항</h4>\n<p><b>“이 보험에 따라 보상을 받으려면\n피보험자는 <u>손해가 발생한 때</u>에\n보험목적물에 대한 <u>피보험이익</u>을 가지고 있어야 한다.”</b></p>\n<span class=\"tb\">읽는 요령\n\n  · 「계약을 체결할 때」가 아니라 「손해가 발생한 때」이다\n  · 계약 체결 시에 이익이 없어도 무방하다\n    (장차 취득할 화물에 대하여 미리 보험을 들 수 있다)\n  · 손해 발생 후에 이익을 잃어도 무방하다\n    (손해 발생 시에 있었으면 된다)\n\n  → 적하보험이 「운송 중 전매」를 전제로 하는 보험임을 보여 준다.</span>\n\n<h4>제11조 제2항</h4>\n<p><b>“위 11.1의 규정에 따를 것을 조건으로,\n피보험자는 <u>이 보험이 담보하는 기간 중에 발생한 손해</u>에 대하여\n그 <u>손해가 보험계약이 체결되기 전에 발생하였더라도</u>\n보상받을 권리를 가진다.\n다만 <u>피보험자는 그 손해를 알고 있었고\n보험자는 알지 못하였던 경우</u>에는 그러하지 아니하다.”</b></p>\n<span class=\"tb\">이것이 「Lost or not lost」의 명문화이다.\n\n  원칙   계약 체결 전에 이미 손해가 났더라도\n         담보기간 중의 손해라면 보상한다\n         (소급보험 · 「소급담보」)\n\n  예외   「피보험자는 알고 있었고 보험자는 몰랐던」 경우\n         → 보상하지 않는다\n\n  판단의 기준은 「양쪽이 다 몰랐는가」가 아니다.\n    · 둘 다 몰랐다        →  보상한다\n    · 둘 다 알았다        →  보상한다 (보험자가 알고 인수하였다)\n    · 보험자만 알았다      →  보상한다\n    · 「피보험자만 알았다」 →  보상하지 않는다  ← 유일한 예외</span>\n\n<h4>Ⅲ. 왜 이런 규정이 필요한가</h4>\n<span class=\"tb\">해상운송의 현실\n\n  화물은 이미 배에 실려 바다 위에 있는데\n  · 선하증권이 은행을 거쳐 매수인에게 도달하는 데 시간이 걸리고\n  · 매수인은 서류를 받은 뒤에야 보험에 들 수 있는 경우가 있으며\n  · 통신이 닿지 않는 곳에서 사고가 났는지 알 길이 없다\n\n  「계약 체결 시에 이미 손해가 났으면 무효」라고 하면\n  해상보험은 제 구실을 할 수 없다.\n\n  그래서 「몰랐다면 보상한다」는 원칙이\n  해상보험의 뿌리에서부터 인정되어 온 것이다.</span>\n<p>다만 <b>피보험자가 손해를 알고서 보험에 드는 것</b>은\n<b>보험이 아니라 사기</b>이다.\n그래서 그 경우만 예외로 뺀 것이다.\n<b>보험의 우연성 요건과 선의계약성</b>이 여기에서 만난다.</p>\n\n<h4>Ⅳ. 1982년 신약관에서 새로 규정된 조항들 — 참고</h4>\n<span class=\"tb\">제11조  피보험이익 (Insurable Interest)      ← 이 문제\n제12조  계반비용 (Forwarding Charges)\n제13조  추정전손 (Constructive Total Loss)\n제14조  증액 (Increased Value)\n제15조  보험이익 불공여 (Not to Inure)\n제16조  피보험자 의무 (Duty of Assured)\n제17조  포기 (Waiver)\n제18조  신속조치 (Reasonable Despatch)\n제19조  영국의 법률 및 관습 (English Law and Practice)\n\n  → S.G. Policy와 MIA에 흩어져 있던 원칙들을\n    「약관 본문에 모아 명문화」한 것이 신약관의 특징이다.</span>\n", "keys": ["Lloyd's S.G. Policy 폐지", "MAR Form", "Lost or not lost", "MIA 1906 제6조 제1항", "고문투 탈피", "CIF 운송 중 전매", "제11조 제1항", "손해가 발생한 때 피보험이익", "계약 체결 시에는 필요 없다", "제11조 제2항", "계약 체결 전에 발생한 손해도 보상", "피보험자는 알고 보험자는 몰랐던 경우 제외", "소급담보", "선의계약성"], "law": ["Institute Cargo Clauses (A)(B)(C) 1/1/82 Cl.11", "Marine Insurance Act 1906 s.6", "상법 제644조·제668조"]}}]}, {"round": 49, "subject": "책임·화재·기술보험 등의 이론과 실무", "track": "재물", "src": "49회_2차 책임·화재·기술보험 등의 이론과 실무.pdf", "chars": 5704, "digits": 496, "pts_ok": true, "q": [{"no": 1, "body": "가나건설(주)는 발주자인 ABC철도(주)와 기존 역사 옆에 건물 신축공사 계약을\n체결하고, 발파 및 굴착공사를 수행하던 중 진동과 토사유출로 인하여 <표2>와\n같은 손해가 발생하였다.\n아래의 조건에 따라 각 질문에 답하시오. (30점)\n<표1. 보험가입사항>\n1. 보험종목 : 독일식 건설공사보험(CAR Munich Re Form)\n2. 피보험자 : 가나건설(주), ABC철도(주) 및 기타 공사이해관계자\n3. 재물부문 보험가입금액 : 1,000억원\n4. 제3자 배상책임 보상한도액 : 100억원(1사고당)\n5. 보험조건 및 조항\n○ 자기부담금\n- 재물손해 : 자연재해 2억원(1사고당) / 기타원인 1억원(1사고당)\n- 제3자 배상책임 : 5,000만원(1사고당)\n○ 잔존물제거비용담보 특별약관\n- 보상한도 : 10억원(1사고당)\n○ 특별비용담보 특별약관\n- 보상한도 : 10억원(1사고당)\n○ 주위재산담보 특별약관\n- 보상한도 : 100억원(1사고당) / 자기부담금 : 손해액의 20%\n(단, 최소 자기부담금은 재물손해의 기타원인과 동일)\n○ 보험가입금액 자동증액조항(Escalation Clause) : 120%\n\n<표2. 보험가액 및 손해사항>\n1. 사고시점의 추정 완성가액 : 1,500억원\n2. 손해액\n① 신축건물\n· 공사목적물 복구공사비 : 24억원\n· 시간 외 근무수당 및 야간 근무수당 : 1억원\n· 복구자재 운반을 위한 항공운임 : 5,000만원\n· 사고로 유입된 토사제거비 : 2억원\n· 손해는 없지만, 복구를 위해 필요한 공사목적물의 철거비 : 5,000만원\n· 오염토양 정화비 : 1억원\n② 주위재산담보 특별약관의 담보대상인 기존 역사\n· 기존 역사의 기둥, 벽체의 균열 복구비 : 2억원\n· 진동으로 파손된 전기설비 복구비 : 4,000만원\n· 내진성능을 향상시키기 위한 추가 보강공사비 : 3,000만원\n· 기존 역사내 상업시설 영업중단으로 인한 영업손실금액 : 2,000만원\n③ 제3자 배상책임\n· 발파진동으로 인한 공사현장 인근 상가건물 균열 복구비 : 1억원\n· 굴착토사의 유출로 인한 주차된 승용차의 파손 손해 : 5,000만원\n(1) <표1. 보험가입사항>의 특별약관 3가지와 ‘보험가입금액 자동증액조항’의 담보\n내용을 약술하시오. (10점)\n(2) <표2. 손해사항>의 ① 신축건물(목적물), ② 기존역사(주위재산), ③ 제3자 배상책임에\n대하여 각 손해별로 면·부책을 구분하여 약술하고, 산출과정을 명시하여 보험금을\n계산하시오. (20점)", "sub": [30, 10, 20], "points": 30, "a": {"plan": "자동증액조항으로 부보비율 80%가 나오는 것이 이 문제의 축이다. 항공운임과 오염정화비를 걸러 내고, 주위재산은 최소 자기부담금 1억원에 걸린다.", "ans": "\n<h3>(1) 특별약관 3가지와 보험가입금액 자동증액조항 (10점)</h3>\n\n<h4>① 잔존물제거비용담보 특별약관 (Debris Removal)</h4>\n<span class=\"tb\">담보내용\n  보험목적물에 담보위험으로 손해가 생긴 경우,\n  그 「잔존물을 제거·처분하는 데 드는 비용」을 보상한다.\n\n포함되는 비용\n  · 잔해의 해체·철거비용\n  · 청소비용\n  · 상차·운반·하차비용\n  · 폐기물 처리비용\n\n제외되는 것\n  · 「오염물질의 제거·정화비용」  → 별도의 환경오염 특약이 필요하다\n  · 손해를 입지 아니한 부분의 제거비용\n  · 대체물의 취득비용\n\n보상한도액을 따로 정한다 (이 사안 10억원/1사고당).</span>\n<p>보통약관은 <b>공사목적물 자체의 복구비</b>만을 담보하므로,\n<b>잔해를 치우는 비용</b>은 이 특약으로 따로 확장하여야 한다.</p>\n\n<h4>② 특별비용담보 특별약관 (Extra Charges)</h4>\n<span class=\"tb\">담보내용\n  손해를 「신속하게 복구」하기 위하여 추가로 지출한 비용을 보상한다.\n\n포함되는 비용\n  · 시간외 근무수당(overtime)\n  · 야간 근무수당(night work)\n  · 휴일 근무수당(work on public holidays)\n  · 급행운임(express freight)\n\n「제외되는 것」\n  · 「항공운임(airfreight)」\n    → 별도의 「항공운임담보 특별약관」에 가입하여야 한다</span>\n<p><b>항공운임이 빠져 있다는 점</b>이 이 특약의 함정이다.\n비행기로 자재를 실어 나른 비용은\n<b>특별비용담보 특약만으로는 보상되지 않는다</b>.</p>\n\n<h4>③ 주위재산담보 특별약관 (Surrounding Property)</h4>\n<span class=\"tb\">담보내용\n  「공사목적물 이외의 재산」으로서\n  피보험자가 「소유·관리·보관·사용」하는 것이\n  공사현장 또는 그 주위에 있다가 공사로 인하여 입은 손해를 보상한다.\n\n왜 필요한가\n  · 제1부문(재물손해)  →  「공사목적물」만 담보한다\n  · 제2부문(배상책임)  →  「타인」의 재물에 대한 배상책임만 담보한다\n                          「피보험자 자신의 기존 재산」은 담보하지 않는다\n\n  → 이 사안처럼 발주자(ABC철도)도 피보험자인 경우\n    발주자 소유의 「기존 역사」는 어느 쪽에도 들어가지 않는다.\n    그 빈틈을 메우는 것이 주위재산담보 특약이다.\n\n보상한도액과 자기부담금을 따로 정한다\n  (이 사안 한도 100억원, 자기부담금 손해액의 20%,\n   최소 자기부담금은 재물손해 기타원인과 같은 1억원).</span>\n\n<h4>④ 보험가입금액 자동증액조항 (Escalation Clause)</h4>\n<span class=\"tb\">담보내용\n  공사기간 중 「물가상승·설계변경·공사비 증가」 등으로\n  실제 공사비가 최초 보험가입금액을 넘게 되는 경우,\n  약정한 비율까지 「보험가입금액이 자동으로 증액」된 것으로 본다.\n\n취지\n  건설공사는 수년에 걸치고 공사비가 늘어나는 일이 잦다.\n  그때마다 증액배서를 하지 않으면 「일부보험」이 되어\n  비례보상으로 큰 손실을 입게 된다.\n  → 그 위험을 막기 위한 자동확장 장치이다.\n\n정산\n  증액된 부분에 대하여는 보험기간이 끝난 뒤\n  실제 공사비를 기준으로 정산하여 추가보험료를 낸다.</span>\n<span class=\"tb\">이 사안에 적용하면\n\n  최초 보험가입금액                          1,000억원\n  자동증액조항 120%                        × 1.2\n  ─────────────────────────────────────────────────\n  증액된 보험가입금액                        1,200억원\n\n  사고시점의 추정 완성가액                   1,500억원\n\n  1,200억 < 1,500억   →  「여전히 일부보험이다」\n\n  부보비율 = 1,200억 ÷ 1,500억 = 「80%」</span>\n<p>자동증액조항이 있어도 <b>공사비가 그 이상으로 늘면 일부보험을 면하지 못한다</b>.\n이것이 (2)의 모든 계산을 지배한다.</p>\n\n<h3>(2) 손해별 면·부책과 보험금 계산 (20점)</h3>\n\n<h4>Ⅰ. ① 신축건물 (제1부문 재물손해)</h4>\n<span class=\"tb\">손해항목                              면·부책   금액(억원)\n\n공사목적물 복구공사비                   부책        24.0\n  담보위험(진동·토사유출)으로 인한\n  공사목적물 자체의 손해\n\n시간외 근무수당 및 야간 근무수당        부책         1.0\n  「특별비용담보 특별약관」 (한도 10억원 이내)\n\n복구자재 운반을 위한 항공운임           「면책」      0.5\n  특별비용담보 특약은 「항공운임을 제외」한다\n  → 별도의 항공운임담보 특약에 가입하였어야 한다\n\n사고로 유입된 토사제거비                부책         2.0\n  「잔존물제거비용담보 특별약관」 (한도 10억원 이내)\n\n손해는 없지만 복구를 위해 필요한\n공사목적물의 철거비                     부책         0.5\n  손해를 복구하기 위하여 불가피하게 뜯어내는 비용이므로\n  「복구비용의 일부」로 본다\n\n오염토양 정화비                        「면책」      1.0\n  오염·오탁으로 인한 손해와 그 정화비용은\n  보통약관의 면책사유이다\n  → 별도의 환경오염 특약이 필요하다\n───────────────────────────────────────────────────\n부책 손해액 합계                                    27.5</span>\n<span class=\"tb\">지급보험금\n\n  27.5억 × 부보비율 80%                    =  22.0억\n  자기부담금 (기타원인, 1사고당)            -  1.0억\n  ────────────────────────────────────────────────\n  ① 신축건물 보험금                        =  21.0억원</span>\n<p><b>자기부담금은 1사고당 한 번만</b> 뺀다.\n자연재해가 아니라 <b>굴착·발파라는 기타원인</b>이므로 <b>1억원</b>을 적용한다.</p>\n\n<h4>Ⅱ. ② 기존 역사 (주위재산담보 특별약관)</h4>\n<span class=\"tb\">손해항목                              면·부책   금액(억원)\n\n기둥·벽체 균열 복구비                   부책         2.0\n진동으로 파손된 전기설비 복구비          부책         0.4\n\n내진성능 향상 추가 보강공사비           「면책」      0.3\n  「원상복구」의 범위를 넘는 「개량·증설」 비용이다\n  보험은 사고 전 상태로 되돌리는 것까지만 보상한다\n\n기존 역사내 상업시설 영업손실           「면책」      0.2\n  「간접손해(기업휴지손해)」이다\n  재물보험은 직접손해만 담보하며\n  별도의 기업휴지보험(ALOP/DSU)이 필요하다\n───────────────────────────────────────────────────\n부책 손해액 합계                                     2.4</span>\n<span class=\"tb\">자기부담금\n  손해액의 20%   2.4억 × 20%              =  0.48억\n  최소 자기부담금 (재물손해 기타원인과 동일) =  1.00억\n  Max[0.48 , 1.00]                        =  1.00억\n\n지급보험금\n  2.4억 - 1.0억                           =  1.4억원\n\n  ※ 주위재산은 「별도의 보상한도액(100억원)」을 가진 특약이므로\n    공사목적물의 부보비율(80%)을 적용하지 아니한다.</span>\n\n<h4>Ⅲ. ③ 제3자 배상책임 (제2부문)</h4>\n<span class=\"tb\">손해항목                              면·부책   금액(억원)\n\n발파진동으로 인한 인근 상가건물\n균열 복구비                             부책         1.0\n굴착토사 유출로 인한\n주차 승용차 파손 손해                   부책         0.5\n───────────────────────────────────────────────────\n합계                                                 1.5\n\n자기부담금 (1사고당)                                -0.5\n───────────────────────────────────────────────────\n③ 제3자 배상책임 보험금                             1.0억원\n\n  (보상한도액 100억원/1사고당 이내)</span>\n<p>모두 <b>제3자(타인)의 재물</b>에 대한 손해이므로 제2부문에서 담보한다.\n발주자 ABC철도는 <b>피보험자</b>이므로 그 소유의 기존 역사는\n제2부문이 아니라 <b>주위재산담보 특약</b>으로 처리한 것과 대비된다.</p>\n\n<h4>Ⅳ. 총 지급보험금</h4>\n<span class=\"tb\">① 신축건물 (제1부문)                        21.0억원\n② 기존 역사 (주위재산담보 특약)               1.4억원\n③ 제3자 배상책임 (제2부문)                    1.0억원\n──────────────────────────────────────────────────\n합계                                        23.4억원</span>\n\n<h4>Ⅴ. 이 문제가 노린 것</h4>\n<span class=\"tb\">① 자동증액조항 120%로도 일부보험을 면하지 못한다  →  부보비율 80%\n② 항공운임은 특별비용담보 특약에서 「빠져 있다」\n③ 오염토양 정화비는 잔존물제거비용이 아니다\n④ 「손해 없는 부분의 철거비」는 복구비용에 포함된다\n⑤ 내진 보강은 「개량」이므로 원상복구를 넘는다\n⑥ 영업손실은 간접손해이다\n⑦ 주위재산의 자기부담금은 「20%와 1억원 중 큰 금액」\n⑧ 자기부담금은 담보별로 「1사고당 1회」</span>\n", "keys": ["CAR Munich Re Form", "잔존물제거비용담보 특별약관", "특별비용담보 특별약관", "항공운임 제외", "주위재산담보 특별약관", "피보험자 자신의 기존 재산", "Escalation Clause 120%", "1,200억 / 1,500억 = 80%", "부보비율", "오염토양 정화비 면책", "내진 보강은 개량", "영업손실은 간접손해", "최소 자기부담금 1억원", "21.0억", "1.4억", "1.0억", "23.4억원"], "law": ["독일식 건설공사보험(CAR) Munich Re Form 및 특별약관", "국문 건설공사보험 보통약관"]}}, {"no": 2, "body": "2026. 05. 01일 임차인 ‘을’이 운영하는 매장에서 발생한 화재로 건물과 재고자산에\n손해가 발생하였고 ‘병’ 소유의 인접건물로 확산되어 상당한 화재손해를 발생시켰다.\n관계당국에 의하면 ‘을’이 설치한 전기배선의 단락에 의한 화재로 확인되었다.\n아래의 조건에 따라 각 질문에 답하시오. (15점)\n<표1. 보험가입사항>\n보험사 A B C\n상품명 일반화재보험 장기화재보험 재난배상책임보험\n계약자/피보험자 갑(건물주) 을(임차인)\n보험기간 25.09.01 ~ 26.09.01 23.07.01 ~ 33.07.01 25.10.01 ~ 26.10.01\n목적물 건물 4억원\n건물 5억원 대물보상한도액 10억원\n(가입금액) 재고자산 1억원\n특별약관 화재대물배상책임담보 화재대물배상책임담보\n-\n(보상한도) 3억원(자기부담금 없음) 5억원(자기부담금 없음)\n<표2. 보험가액 및 손해사항>\n구분 보험가액 손해액\n건물 5억원 4억원\n을(임차인) 3억원 1.4억원\n재고자산\n(야외 전시상품 1억원 포함) (야외 전시상품 손해 없음)\n총손해 30억원\n병(인접건물) ·‘병’이 가입한 화재보험사로부터 수령한 보험금 16억원\n·‘병’이 보험금으로 보전받지 못한 손해 14억원\n* 실화책임에 관한 법률에 따른 경감율은 40%로 한다.\n* 병(인접건물)의 손해배상 청구에 대해서는 [대법원 2014다46211]판결을 준용한다.\n[피해자가 가입한 화재보험사로부터 수령한 보험금은 가해자의 손해배상책임과는 별개의\n것으로 가해자의 손해배상책임액에서 공제할 것은 아니다.]\n\n(1) A, B 보험사의 보험금 지급책임에 대하여 약관규정(지급보험금의 계산)을 언급하여\n약술하고, 건물과 재고자산의 보험금을 계산하시오. (5점)\n(2) 병(인접건물)은 보험사에서 보전받지 못한 손해액에 대하여 A, B, C 보험사에 보험금을\n청구하고 있다. 이 경우 A, B, C 보험사의 보상여부에 대하여 약술하고, 보험금에 대하여\n산출과정을 명시하여 계산하시오. (10점)", "sub": [15, 5, 10], "points": 15, "a": {"plan": "(1)은 일반화재의 순수 비례보상과 장기화재의 80% 코인슈어런스를 갈라 쓰고 야외 전시상품을 보험가액에서 뺀다. (2)는 실화책임법 경감과 판례를 적용해 배상책임액을 먼저 세운다.", "ans": "\n<h4>0. 계약과 손해의 정리</h4>\n<span class=\"tb\">          A (갑·건물주)      B (을·임차인)        C (을)\n상품      일반화재보험        장기화재보험         재난배상책임보험\n기간      25.9.1~26.9.1      23.7.1~33.7.1       25.10.1~26.10.1\n목적물    건물 5억원          건물 4억원           대물보상한도액\n                             재고자산 1억원        10억원\n특약      화재대물배상책임     화재대물배상책임        -\n          3억원(자부담 없음)   5억원(자부담 없음)\n\n손해\n  건물        보험가액 5억원          손해액 4억원\n  재고자산    보험가액 3억원          손해액 1.4억원\n              (야외 전시상품 1억원 포함)  (야외 전시상품 손해 없음)\n  병(인접건물) 총손해 30억원\n              병의 화재보험사로부터 수령    16억원\n              병이 보전받지 못한 손해       14억원\n\n실화책임법 경감율 40%\n대법원 2014다46211 준용 — 피해자가 받은 화재보험금은\n                          가해자의 배상책임액에서 공제하지 아니한다</span>\n\n<h3>(1) A·B 보험사의 보험금 지급책임 — 건물과 재고자산 (5점)</h3>\n\n<h4>Ⅰ. 지급보험금 계산방식의 차이</h4>\n<span class=\"tb\">A 「일반화재보험」 — 순수 비례보상\n\n  보험가입금액 ≥ 보험가액 : 보험가액을 한도로 손해액 전액\n  보험가입금액 < 보험가액 : 손해액 × (보험가입금액 ÷ 보험가액)\n\nB 「장기화재보험」 — 80% 부보비율 조건부 실손보상\n\n  보험가입금액 ≥ 보험가액 × 80% : 보험가입금액을 한도로 손해액 전액\n  보험가입금액 < 보험가액 × 80% :\n      손해액 × 보험가입금액 ÷ (보험가액 × 80%)</span>\n<p><b>장기화재보험이 유리한 이유</b>는\n<b>보험가액의 80%만 부보하여도 전액을 받는다</b>는 데 있다.</p>\n\n<h4>Ⅱ. 건물</h4>\n<span class=\"tb\">보험가액 5억원 · 손해액 4억원\n\nA (일반화재보험)\n  보험가입금액 5억 = 보험가액 5억  →  전부보험\n  독립책임액 = 손해액 4억원\n\nB (장기화재보험)\n  보험가액 × 80% = 5억 × 0.8 = 4억\n  보험가입금액 4억 ≥ 4억         →  부보비율 충족\n  독립책임액 = 손해액 4억원 (가입금액 4억 한도)</span>\n<span class=\"tb\">중복보험 — 「보험금의 분담」 (독립책임액 안분)\n\n  독립책임액 합계  4억 + 4억 = 8억 > 손해액 4억\n  → 각 계약의 독립책임액 비율로 분담한다\n\n  A = 4억 × (4억 ÷ 8억)  =  2억원\n  B = 4억 × (4억 ÷ 8억)  =  2억원</span>\n<p>갑은 <b>소유자로서의 이익</b>을, 을은 <b>임차인으로서의 이익</b>을\n각각 부보한 것이나, <b>같은 목적물의 같은 사고</b>를 담보하므로\n<b>중복보험으로 보아 분담</b>한다.</p>\n\n<h4>Ⅲ. 재고자산 — B만 부보</h4>\n<span class=\"tb\">「야외 전시상품」을 어떻게 볼 것인가\n\n  화재보험의 보험목적인 「동산」은\n  「건물 안에 수용되어 있는 것」을 말한다.\n  옥외에 놓인 물건은 명기하지 아니하는 한 보험목적이 아니다.\n\n  → 야외 전시상품 1억원은 「보험목적이 아니므로\n     보험가액 산정에서도 빼야 한다」\n\n  보험가액  3억원 - 1억원  =  2억원</span>\n<span class=\"tb\">장기화재보험의 부보비율 판정\n\n  보험가액 × 80% = 2억 × 0.8 = 1.6억\n  보험가입금액 1억 < 1.6억      →  「부보비율 미달」  →  비례보상\n\n지급보험금\n                     보험가입금액 1억\n  손해액 1.4억 × ──────────────────────\n                  보험가액 2억 × 80% = 1.6억\n\n  = 1.4억 × 0.625  =  0.875억원  =  8,750만원\n\n  (보험가입금액 1억원 한도 이내)</span>\n<p><b>야외 전시상품을 보험가액에 그대로 두면</b>\n2.4억(=3억×80%)이 되어 지급보험금이 5,833만원으로 줄어든다.\n<b>보험목적이 아닌 것은 보험가액에서도 빼야 한다</b>는 것이\n이 문제의 함정이다.</p>\n\n<h4>Ⅳ. (1)의 답</h4>\n<span class=\"tb\">건물     A  2억원      B  2억원\n재고자산 A  -          B  8,750만원</span>\n\n<h3>(2) 병(인접건물)에 대한 A·B·C의 보상 여부와 보험금 (10점)</h3>\n\n<h4>Ⅰ. 을의 법률상 배상책임액</h4>\n<span class=\"tb\">1) 배상책임의 근거\n   화재의 원인은 「을이 설치한 전기배선의 단락」이다.\n   · 민법 제750조 (불법행위)\n   · 민법 제758조 (공작물책임) — 을은 그 설비의 점유·관리자이다\n\n2) 실화책임에 관한 법률에 따른 경감\n   실화가 중대한 과실로 인한 것이 아닌 경우\n   법원은 손해배상액을 경감할 수 있다.\n   경감율 40%\n\n3) 대법원 2014다46211의 법리\n   「피해자가 가입한 화재보험사로부터 수령한 보험금은\n    가해자의 손해배상책임과는 별개의 것으로\n    가해자의 손해배상책임액에서 공제할 것이 아니다」\n\n   → 병이 받은 16억원을 빼고 계산하는 것이 아니라\n     「총손해 30억원」을 기준으로 경감한다</span>\n<span class=\"tb\">을의 배상책임액\n\n  총손해                                     30억원\n  실화책임법 경감 (× 60%)                  × 0.6\n  ─────────────────────────────────────────────\n  법률상 손해배상책임액                      18억원</span>\n\n<h4>Ⅱ. 병이 청구할 수 있는 금액</h4>\n<span class=\"tb\">병의 화재보험사는 16억원을 지급하고\n상법 제682조에 따라 을에 대한 손해배상청구권을 대위한다.\n\n그러나 「피보험자의 권리를 침해하지 아니하는 범위」에서만\n대위할 수 있다(차액설 · 피보험자 우선).\n\n  을의 배상책임액                            18억원\n  병이 보전받지 못한 손해                    14억원\n\n  → 병이 「먼저」 14억원을 회수하고\n    남는 4억원을 병의 화재보험사가 대위한다\n\n  이 문제가 묻는 것은 병이 청구하는 「14억원」이다.</span>\n\n<h4>Ⅲ. 보험사별 보상 여부</h4>\n\n<h4>A 보험사 (갑의 화재대물배상책임담보 3억원) — 보상책임 없음</h4>\n<span class=\"tb\">이 특약은 「피보험자가 소유·사용·관리하는 건물에서 발생한 화재로\n타인의 재물에 손해를 입혀 법률상 배상책임을 지는 경우」를 담보한다.\n\n그런데 화재의 원인은 「을이 설치한 전기배선의 단락」이다.\n\n  민법 제758조 제1항\n    공작물의 설치·보존의 하자로 인한 손해는\n    「1차적으로 점유자」가 배상하고,\n    점유자가 손해의 방지에 필요한 주의를 게을리하지 아니한 때에\n    비로소 「소유자」가 배상한다.\n\n  → 점유자인 을에게 명백한 과실이 있으므로\n    소유자 갑의 책임은 성립하지 아니한다.\n\n  → A 보험사는 보상책임이 없다.                     0원</span>\n\n<h4>C 보험사 (재난배상책임보험, 대물 10억원) — 보상한다</h4>\n<span class=\"tb\">「재난 및 안전관리 기본법」에 따른 「의무보험」이다.\n\n  · 담보위험 : 화재 · 폭발 · 붕괴\n  · 「무과실책임」 — 시설 소유자·점유자·관리자의 과실을 묻지 않는다\n  · 대물 보상한도액 1사고당 10억원\n\n이 사고는 화재로 타인의 재산에 손해를 입힌 것이므로 담보한다.</span>\n\n<h4>B 보험사 (을의 화재대물배상책임담보 5억원) — 보상한다</h4>\n<span class=\"tb\">을이 법률상 배상책임을 지므로 담보요건을 충족한다.\n보상한도 5억원, 자기부담금 없음.</span>\n\n<h4>Ⅳ. C와 B의 관계 — 의무보험 우선</h4>\n<span class=\"tb\">배상책임보험 약관의 「의무보험과의 관계」 조항\n\n  「회사는 이 약관에 의하여 보상하여야 하는 금액이\n   의무보험에서 보상하는 금액을 초과할 때에 한하여\n   그 초과액만을 보상합니다.」\n\n  C 재난배상책임보험  →  「의무보험」   →  먼저 보상\n  B 화재대물배상책임   →  「임의보험」   →  초과분만 보상</span>\n<span class=\"tb\">병이 청구하는 금액                          14억원\n\nC (의무보험) : Min[14억 , 한도 10억]     =  10억원\nB (임의보험) : 14억 - 10억                =   4억원\n               (한도 5억원 이내, 자기부담금 없음)\nA                                         =      0원\n────────────────────────────────────────────────\n합계                                         14억원</span>\n\n<h4>다르게 볼 여지</h4>\n<p>두 계약을 <b>대등한 중복보험</b>으로 보아\n<b>독립책임액 비율로 분담</b>한다면 다음과 같이 된다.</p>\n<span class=\"tb\">독립책임액   C  Min[14억, 10억] = 10억\n             B  Min[14억,  5억] =  5억\n             합계 15억 > 14억  →  비례분담\n\n  C = 14억 × 10/15 ≒  9.33억\n  B = 14억 ×  5/15 ≒  4.67억</span>\n<p>답안에서는 <b>어느 방식을 취하였는지 밝히는 것</b>이 중요하다.\n<b>재난배상책임보 였음」을\n    스스로 증명하여야 하는데, 그 증명은 쉽지 않다\n\n  →  「부책」</span>\n<p>병이 배상한 뒤에는 <b>민법 제758조 제3항</b>에 따라\n<b>소유자 갑에게 구상</b>할 수 있다.\n배관 노후는 <b>임대인의 수선의무(민법 제623조)</b>에 속하기 때문이다.</p>\n\n<h4>Ⅲ. C 보험사의 지급보험금</h4>\n\n<h4>1. 서울아파트(임대주택) 자체의 피해</h4>\n<span class=\"tb\">누수탐지비용 30만원                  부책 (손해방지비용)\n  아래층 손해의 확대를 막기 위하여\n  원인을 찾는 데 든 비용이다\n\n누수원인 제거비용 170만원            「면책」\n  배관을 고치는 비용이다.\n  서울아파트는 병이 「사용·관리하는 재물」이므로\n  배상책임보험의 대상이 아니다\n  (임대인의 수선의무에 속하는 비용이기도 하다)\n\n수리 중 비산먼지 피해방지 조치비용\n50만원                              부책 (손해방지비용)\n  수리 과정에서 추가 피해가 생기는 것을 막는 조치이다</span>\n\n<h4>2. 아래층 피해</h4>\n<span class=\"tb\">누수피해 수리비용 500만원            부책 (법률상 손해배상금)\n\n수리기간 중 이사 및 숙박비용\n200만원                             부책\n  집을 쓸 수 없게 되어 「추가로」 든 비용으로\n  통상손해의 범위에 든다\n\n수리기간 중 외식비용 30만원          「면책」\n  식비는 수리가 없었더라도 지출하였을 비용이다\n  사고로 「늘어난 손해」가 아니다</span>\n\n<h4>3. 계산</h4>\n<span class=\"tb\">법률상 손해배상금\n  아래층 누수피해 수리비용                     500만원\n  아래층 이사 및 숙박비용                      200만원\n  ─────────────────────────────────────────────────\n  소계                                         700만원\n  공제금액                                    - 50만원\n  ─────────────────────────────────────────────────\n                                               650만원\n\n손해방지비용 (공제금액을 적용하지 아니한다)\n  누수탐지비용                                  30만원\n  비산먼지 피해방지 조치비용                    50만원\n  ─────────────────────────────────────────────────\n  소계                                          80만원\n\n─────────────────────────────────────────────────\nC 보험사 지급보험금                            730만원\n  (보상한도 1억원 이내)</span>\n\n<h4>Ⅳ. 정리</h4>\n<span class=\"tb\">A (갑)   면책   —  2020. 4. 개정 전 가입,\n                    피보험자가 거주하지 않는 임대주택        0원\nB (을)   면책   —  증권기재 주택이 없다\n                    (담보 대상은 주소지인 부산아파트)        0원\nC (병)   부책   —  개정 후 가입, 증권기재 = 서울아파트,\n                    병이 거주하고 점유자로서 책임을 진다   730만원\n──────────────────────────────────────────────────────\n합계                                                     730만원</span>\n\n<h4>Ⅴ. 이 문제가 가르치는 것</h4>\n<span class=\"tb\">① 일상생활배상책임은 「증권에 기재된 하나의 주택」만 담보한다\n② 2020. 4. 개정 「전」 계약은 「거주」하는 주택이라야 한다\n   → 임대를 주었다면 담보되지 않는다\n③ 이사·임대를 하였으면 증권기재 주택을 반드시 바꾸어야 한다\n④ 「누수탐지비용」은 보상하고 「누수원인 제거비용」은 보상하지 않는다\n⑤ 이사·숙박비는 통상손해이나 「식비」는 손해가 아니다\n⑥ 아래층 사고는 민법 제758조에 따라 「점유자」가 1차 책임을 진다</span>\n", "keys": ["2020년 4월 약관 개정", "개정 전 피보험자가 거주하는 주택", "개정 후 임대 주택까지 확대", "보험증권에 기재된 하나의 주택", "소급 적용되지 않는다", "A 면책", "B 증권기재 주택 없음", "민법 제758조 점유자 1차 책임", "민법 제623조 수선의무", "누수탐지비용은 손해방지비용", "누수원인 제거비용 면책", "사용·관리하는 재물", "이사·숙박비 통상손해", "외식비는 손해가 아니다", "730만원"], "law": ["일상생활(가족)배상책임 특별약관(2020.4. 개정)", "민법 제623조·제750조·제758조"]}}, {"no": 4, "body": "2026. 06. 30일 △△마을의 한 주택에서 원인미상의 화재가 발생하여 다수의 주택이\n소손되고, 보험계약자의 주택도 건물과 가재도구가 화재로 전소되었다. 현장조사를\n실시한 결과 사고주택은 토지수용으로 인하여 2026. 12. 30일 철거가 결정되어 있었다.\n또한, 화재진화 과정에서의 심한 현장훼손으로 가재도구에 대한 개별조사가 불가능\n하여 보험계약자는 간이평가를 실시하는 것에 동의하였다.\n아래의 조건에 따라 각 질문에 답하시오. (15점)\n<표1. 계약사항>\n· 장기화재보험 2024. 01. 01 ~ 2026. 12. 31 (3년)\n목적물 용도 및 명세 가입금액(원)\n건물 주택(간이목조) / 180㎡ 50,000,000\n가재도구 주택 내부에 분산수용 25,000,000\n<표2. 조사사항>\n○ 건물 : 재조달가액 4,000만원, 경년감가율 8%, 총감가율 40%\n○ 가재도구 간이평가 관련 조사내용\n- 월평균소득 : 세대주 연평균소득 3,000만원, 가족의 추정연간소득 4,000만원\n- 조정계수 : 가재도구의 수가 적고, 저가품인 경우에 해당됨\n- 가족구성원 : 3인 가족\n(1) 건물 보험금의 산출과정을 명시하여 계산하시오. (5점)\n(2) 다음의 <표3. 가재도구 간이평가 기준표>를 이용하여 가재도구의 보험가액 및 보험금에\n대하여 산출과정을 명시하여 계산하시오. (5점)\n\n<표3. 가재도구 간이평가 기준표>\n(단위 : 만원)\n조정계수\n월평균소득 기준액 가족구성원수 기준액\n상 중 하\n72이상~143미만 1,500 1.3 1.0 0.7 1인 1,000\n143이상~215미만 2,500 1.3 1.0 0.7 2인 2,000\n215이상~287미만 3,000 1.4 1.0 0.7 3인 3,000\n287이상~358미만 3,500 1.4 1.0 0.7 4인 4,000\n358이상~430미만 4,000 1.2 1.0 0.8 5인 5,000\n* 위 수치는 계산상 편의를 위하여 단순화한 것으로 실제와 다름.\n* 항목별 가중치(월평균소득 60%, 가족구성원수 40%)\n(3) 다음 <표4. 복합건물>의 조건에 따라 감가율의 적용에 대하여 약술하고, 주택과 창고에\n적용되는 경년감가율을 산정하시오. (5점)\n<표4. 복합건물>\n구조 경과년수 총감가율 면적\n간이목조(주택) 4년 36% 150㎡\n컨테이너(창고) 5년 60% 30㎡\n합 계 - - 180㎡\n* 위 조건에 따른 풀이 결과는 계산상 편의를 위하여 단순화한 것으로 실제와 다름.", "sub": [15, 5, 5, 5], "points": 15, "a": {"plan": "건물은 시가로, 가재도구는 간이평가표로 보험가액을 세운 뒤 80% 부보비율을 대 본다. (3)은 총감가율을 경과년수로 나누면 끝난다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">장기화재보험  2024. 1. 1. ~ 2026. 12. 31. (3년)\n  건물     주택(간이목조) 180㎡          가입금액 50,000,000원\n  가재도구 주택 내부에 분산수용          가입금액 25,000,000원\n\n2026. 6. 30.  원인미상 화재로 건물·가재도구 「전소」\n              사고주택은 토지수용으로 2026. 12. 30. 철거 결정\n              가재도구는 개별조사가 불가능하여 간이평가에 동의</span>\n\n<h3>(1) 건물 보험금 (5점)</h3>\n\n<h4>Ⅰ. 보험가액(시가)의 산정</h4>\n<span class=\"tb\">재조달가액                              40,000,000원\n총감가율                                       40%\n(경년감가율 8% × 경과년수 5년)\n\n보험가액(시가) = 재조달가액 × (1 - 총감가율)\n               = 40,000,000 × (1 - 0.4)\n               = 24,000,000원</span>\n\n<h4>Ⅱ. 철거가 예정되어 있다는 사정</h4>\n<span class=\"tb\">보험가액은 「사고가 발생한 때와 곳」의 가액이다(상법 제671조).\n\n  · 화재가 난 2026. 6. 30. 당시 건물은 「현존」하고 있었고\n  · 임차인이 거주하며 사용하고 있었으며\n  · 철거는 6개월 뒤에 「예정」되어 있었을 뿐이다\n\n  → 사고 시점의 시가 24,000,000원으로 평가한다.\n\n  (실무에서는 철거가 확정된 건물의 잔존 사용기간을 고려하여\n   감액하는 예도 있으나, 사고 당시 현존하던 건물의 시가로\n   평가하는 것이 원칙이다.)</span>\n\n<h4>Ⅲ. 부보비율과 지급보험금</h4>\n<span class=\"tb\">장기화재보험(주택물건)의 지급보험금\n\n  보험가입금액 ≥ 보험가액 × 80% : 보험가입금액을 한도로 손해액 전액\n  보험가입금액 < 보험가액 × 80% :\n      손해액 × 보험가입금액 ÷ (보험가액 × 80%)\n\n부보비율의 판정\n  보험가액 × 80% = 24,000,000 × 0.8 = 19,200,000원\n  보험가입금액 50,000,000 ≥ 19,200,000   →  충족\n\n  오히려 보험가입금액(5,000만원)이\n  보험가액(2,400만원)을 크게 넘는 「초과보험」이다.\n\n손해액   전소이므로 보험가액 전액        24,000,000원\n지급보험금 = Min[손해액, 보험가액]      = 24,000,000원</span>\n<p><b>답 (1) : 24,000,000원</b></p>\n<span class=\"tb\">초과보험에 관하여 (상법 제669조)\n\n  · 보험금액이 보험가액을 현저하게 초과한 때에는\n    보험자 또는 계약자는 「보험료와 보험금액의 감액」을 청구할 수 있다\n    (보험료의 감액은 장래에 대하여만 효력이 있다)\n  · 사기로 인한 초과보험은 「무효」이며\n    보험자는 그 사실을 안 때까지의 보험료를 청구할 수 있다\n\n  이 사안은 건물이 낡아 시가가 떨어진 결과이므로\n  사기로 볼 사정은 없다. 계약은 유효하되\n  보험가액을 넘어 지급하지는 아니한다.</span>\n\n<h3>(2) 가재도구의 보험가액과 보험금 (5점)</h3>\n\n<h4>Ⅰ. 간이평가의 뜻</h4>\n<p>화재로 현장이 훼손되어 <b>가재도구를 하나하나 조사할 수 없는 경우</b>,\n<b>세대의 소득수준과 가족 수</b> 등으로 표준적인 가액을 추정하는 방법이다.\n<b>보험계약자의 동의</b>를 얻어 시행한다.</p>\n\n<h4>Ⅱ. 월평균소득의 산정</h4>\n<span class=\"tb\">가족의 추정연간소득                    40,000,000원\n월평균소득  40,000,000 ÷ 12개월    ≒  3,333,333원  =  약 333만원\n\n  (세대주 개인의 연평균소득 3,000만원은\n   세대 전체 소득에 포함되는 금액이므로 따로 더하지 아니한다.\n   간이평가는 「세대 전체의 소득수준」을 기준으로 한다.)\n\n기준표의 구간   「287 이상 ~ 358 미만」  →  기준액 3,500만원\n조정계수        「가재도구의 수가 적고 저가품」  →  「하」  =  0.7</span>\n\n<h4>Ⅲ. 가재도구 보험가액의 산정</h4>\n<span class=\"tb\">항목별 가중치   월평균소득 60% · 가족구성원수 40%\n\n① 월평균소득 항목\n   기준액 3,500만원 × 조정계수 0.7      =  2,450만원\n   × 가중치 60%                         =  1,470만원\n\n② 가족구성원수 항목\n   3인 가족 기준액                       =  3,000만원\n   × 가중치 40%                          =  1,200만원\n\n─────────────────────────────────────────────────\n가재도구 보험가액                          2,670만원</span>\n\n<h4>Ⅳ. 지급보험금</h4>\n<span class=\"tb\">부보비율의 판정\n  보험가액 × 80% = 26,700,000 × 0.8 = 21,360,000원\n  보험가입금액 25,000,000 ≥ 21,360,000   →  「충족」\n\n  → 손해액 전액을 보험가입금액 한도로 보상한다\n\n손해액   전소이므로 보험가액 전액        26,700,000원\n보험가입금액                             25,000,000원\n\n지급보험금 = Min[26,700,000 , 25,000,000]\n           = 25,000,000원</span>\n<p><b>답 (2) : 보험가액 26,700,000원 · 지급보험금 25,000,000원</b></p>\n<p>부보비율은 충족하였으나 <b>보험가입금액이 보험가액에 못 미치는\n일부보험</b>이므로, 실제로는 <b>167만원의 손해를 스스로 떠안게</b> 된다.\n<b>80% 부보비율을 채웠다고 하여 전액을 받는 것이 아니라\n보험가입금액이 상한</b>이라는 점을 놓치지 않아야 한다.</p>\n\n<h3>(3) 복합건물의 감가율 적용과 경년감가율 (5점)</h3>\n\n<h4>Ⅰ. 복합건물의 감가율 적용 원칙</h4>\n<span class=\"tb\">하나의 건물이 「서로 다른 구조·용도」의 부분으로 이루어진 경우\n\n① 구조·용도별로 「따로」 재조달가액과 경년감가율을 적용한다\n   — 간이목조와 컨테이너는 내용연수와 감가속도가 전혀 다르다\n\n② 각 부분의 감가율을 「면적(또는 가액)의 비율」로 가중평균하여\n   건물 전체의 총감가율을 구한다\n\n③ 다만 주된 구조·용도가 전체의 대부분을 차지하고\n   부수적인 부분이 미미한 때에는\n   주된 구조의 감가율을 일괄 적용할 수 있다\n\n④ 경과년수는 각 부분의 「신축 또는 증축 시점」을 기준으로 따로 센다\n   — 증축한 부분은 증축 시점부터 센다</span>\n\n<h4>Ⅱ. 경년감가율의 산정</h4>\n<span class=\"tb\">경년감가율 = 총감가율 ÷ 경과년수\n\n주택(간이목조)\n  36% ÷ 4년                            =  「연 9%」\n\n창고(컨테이너)\n  60% ÷ 5년                            =  「연 12%」</span>\n<p>컨테이너 창고의 감가가 빠른 것은\n<b>내용연수가 짧고 잔존가치가 낮기 때문</b>이다.</p>\n\n<h4>Ⅲ. 건물 전체의 총감가율 (면적 가중평균)</h4>\n<span class=\"tb\">구분              총감가율   면적      가중치\n\n간이목조(주택)      36%      150㎡    150/180\n컨테이너(창고)      60%       30㎡     30/180\n──────────────────────────────────────────\n합계                         180㎡\n\n가중평균 총감가율\n  = (36% × 150 + 60% × 30) ÷ 180\n  = (5,400 + 1,800) ÷ 180\n  = 7,200 ÷ 180\n  = 「40%」</span>\n<p>구조·용도가 섞인 건물을 <b>하나의 감가율로 뭉뚱그리면</b>\n<b>어느 한쪽이 반드시 과대·과소평가</b>된다.\n<b>나누어 계산한 뒤 합치는 것</b>이 원칙인 이유이다.</p>\n", "keys": ["재조달가액 × (1 - 총감가율)", "보험가액 24,000,000", "상법 제671조 사고 발생 시의 가액", "철거 예정은 사고 시점 가액에 영향 없다", "초과보험 상법 제669조", "80% 부보비율", "간이평가", "월평균소득 333만원", "287 이상 358 미만", "기준액 3,500만원", "조정계수 하 0.7", "가중치 60% / 40%", "보험가액 2,670만원", "지급보험금 25,000,000", "경년감가율 = 총감가율 ÷ 경과년수", "주택 9%", "창고 12%", "면적 가중평균 40%"], "law": ["상법 제669조·제671조·제674조", "장기화재보험 약관", "손해보험협회 보험가액 및 손해액의 평가기준"]}}, {"no": 5, "body": "서울건설(주)는 건물 신축공사 현장에서 공사 중 지하에 매설된 상수도관을 파손하여\n<표2. 손해사항>과 같은 손해가 발생하였다. 이 사고로 상수도관이 파손되었고, 다량의\n수돗물이 유실되어 인근 지하매장에 수침피해 및 영업손실이 발생하였다.\n아래의 조건에 따라 각 질문에 답하시오. (10점)\n<표1. 보험가입사항>\n○ 건설공사보험 보통약관 (국문약관)\n- 진동, 지지대 철거 및 약화에 관한 특별약관\n- 지하매설전선이나 배관에 관한 추가약관\n○ 영업배상책임보험 보통약관 (국문약관)\n- 도급업자 특별약관\n- 폭발, 붕괴 및 지하매설물 손해담보 추가특별약관\n* 단, 손해액은 모두 보상한도액을 초과하지 않으며 자기부담금은 없다.\n<표2. 손해사항>\n· 공사목적물 복구비용 : 500만원 · 상수도관 복구공사비 : 300만원\n· 누출된 용수비용 : 50만원 · 오염물질 제거비용 : 200만원\n· 지하매장 수침피해 : 150만원\n(1) 건설공사보험의 보험조건 중 ‘지하매설전선이나 배관에 관한 추가약관’의 내용을\n약술하고, 이 보험에서 지급할 총보험금을 산출하시오. (5점)\n(2) 영업배상책임보험의 보험조건 중 ‘폭발, 붕괴 및 지하매설물 손해담보 추가특별약관’의\n내용을 약술하고, 이 보험에서 지급할 총보험금을 산출하시오. (5점)", "sub": [10, 5, 5], "points": 10, "a": {"plan": "같은 손해를 두 보험이 다르게 자른다. 건설공사보험은 목적물과 매설물 자체만, 영업배상책임보험은 남의 손해만 가져간다.", "ans": "\n<h4>0. 사안</h4>\n<span class=\"tb\">서울건설(주)가 건물 신축공사 중 지하 매설 상수도관을 파손\n→ 다량의 수돗물이 유실되어 인근 지하매장에 수침피해 및 영업손실\n\n손해사항\n  공사목적물 복구비용        500만원\n  상수도관 복구공사비        300만원\n  누출된 용수비용             50만원\n  오염물질 제거비용          200만원\n  지하매장 수침피해          150만원\n\n  (손해액은 모두 보상한도액을 넘지 아니하며 자기부담금은 없다)</span>\n\n<h3>(1) 건설공사보험 — 지하매설전선이나 배관에 관한 추가약관 (5점)</h3>\n\n<h4>Ⅰ. 추가약관의 내용</h4>\n<span class=\"tb\">건설공사보험 보통약관은\n「기존의 지하매설 전선·배관 등에 생긴 손해」를 담보하지 아니한다.\n이를 확장하는 것이 이 추가약관이다.\n\n담보의 요건\n  피보험자가 「공사 착수 전에 관계기관에 조회하여\n  그 지하매설물의 정확한 위치를 확인」하였을 것\n\n담보의 범위\n  「지하매설물 자체를 원상으로 복구하는 데 드는 수리비용」에 한한다\n\n담보에서 제외되는 것\n  · 「그 손상으로 인하여 생긴 결과적 손해(consequential damage)」\n    — 누출·유실, 단전·단수, 제3자의 손해 등\n  · 위치가 정확히 확인되지 아니한 지하매설물의 손해\n    (전부 부담보로 하거나 손해액의 일정 비율만 보상한다)</span>\n<p><b>“매설물 자체의 수리비만, 그로 인한 뒷일은 빼고”</b>가\n이 추가약관의 요지이다.</p>\n<p>참고로 함께 가입한 <b>「진동, 지지대 철거 및 약화에 관한 특별약관」</b>은\n<b>진동이나 지지대의 철거·약화</b>로 제3자의 재물에 손해를 입힌 경우의\n<b>배상책임</b>을 담보하는 특약이다.\n이 사고는 진동이 아니라 <b>굴착 중의 직접 파손</b>이므로 적용되지 않는다.</p>\n\n<h4>Ⅱ. 항목별 판단과 총보험금</h4>\n<span class=\"tb\">공사목적물 복구비용 500만원              부책\n  건설공사보험 제1부문(재물손해)의 본래 담보대상이다\n\n상수도관 복구공사비 300만원              부책\n  「지하매설전선이나 배관에 관한 추가약관」으로 담보한다\n  (위치를 확인하였다는 전제)\n\n누출된 용수비용 50만원                   「면책」\n  매설물 손상으로 인한 「결과적 손해」이며\n  상수도사업자에 대한 배상책임의 영역이다\n\n오염물질 제거비용 200만원                「면책」\n  오염·오탁으로 인한 손해와 그 제거비용은\n  보통약관의 면책사유이다\n\n지하매장 수침피해 150만원                「면책」\n  제3자의 재물에 대한 손해로서 「결과적 손해」이다\n  제1부문의 담보대상이 아니다\n───────────────────────────────────────────────\n건설공사보험 총보험금                    800만원</span>\n\n<h3>(2) 영업배상책임보험 — 폭발·붕괴 및 지하매설물 손해담보 추가특별약관 (5점)</h3>\n\n<h4>Ⅰ. 추가특별약관의 내용</h4>\n<span class=\"tb\">국문영업배상책임보험 「도급업자 특별약관」은\n다음을 「보상하지 아니하는 손해」로 정한다.\n\n  「폭발·붕괴 및 지하매설물에 입힌 손해와\n   손해를 입은 지하매설물로 인하여\n   제3자에게 부담하는 손해에 대한 배상책임」\n\n  → 굴착·발파·항타 등 토목공사에서 가장 흔한 사고 유형을\n    통째로 빼 놓은 것이다.\n\n「폭발, 붕괴 및 지하매설물 손해담보 추가특별약관(XCU)」\n\n  「회사는 도급업자 특별약관의 위 면책규정에도 불구하고,\n   「폭발(Explosion)·붕괴(Collapse) 또는 지하매설물(Underground)」에\n   입힌 손해에 대한 배상책임을 보상합니다.」\n\n  → 면책되어 있던 세 가지 위험을 되살리는 특약이다.\n  → 「손해를 입은 지하매설물로 인하여 제3자에게 부담하는 손해」도\n    함께 되살아난다.</span>\n\n<h4>Ⅱ. 항목별 판단과 총보험금</h4>\n<span class=\"tb\">공사목적물 복구비용 500만원              「면책」\n  「피보험자가 소유·사용·관리하는 재물」에 생긴 손해이다\n  (보통약관 제4조의 면책사유)\n  배상책임보험은 「남의 것」에 생긴 손해만 담보한다\n  → 이것은 건설공사보험이 맡을 몫이다\n\n상수도관 복구공사비 300만원              부책\n  지하매설물에 입힌 손해에 대한 배상책임\n  → XCU 추가특별약관으로 담보한다\n\n누출된 용수비용 50만원                   부책\n  상수도사업자가 입은 손해에 대한 배상책임\n  「손해를 입은 지하매설물로 인하여 제3자에게 부담하는 손해」\n  → XCU 추가특별약관으로 담보한다\n\n오염물질 제거비용 200만원                「면책」\n  오염사고로 인한 배상책임은\n  도급업자 특별약관의 면책사유이다\n  → 별도의 「환경오염 배상책임 특약」이 필요하다\n\n지하매장 수침피해 150만원                부책\n  제3자의 재물에 대한 손해에 대한 배상책임\n  → XCU 추가특별약관으로 담보한다\n───────────────────────────────────────────────\n영업배상책임보험 총보험금                500만원</span>\n\n<h4>Ⅲ. 두 보험이 나누어 맡는 방식</h4>\n<span class=\"tb\">손해항목              건설공사보험     영업배상책임보험\n\n공사목적물 복구비용      500만원  ○         면책\n상수도관 복구공사비      300만원  ○     300만원  ○   ← 겹친다\n누출된 용수비용            면책          50만원  ○\n오염물질 제거비용          면책             면책\n지하매장 수침피해          면책         150만원  ○\n──────────────────────────────────────────────\n합계                     800만원         500만원</span>\n<p><b>상수도관 복구공사비 300만원이 두 보험에서 겹친다.</b></p>\n<span class=\"tb\">중복담보의 처리\n\n  · 두 계약이 같은 손해를 담보하므로 「중복보험」이다\n  · 상법 제672조와 약관의 「보험금의 분담」 조항에 따라\n    각자의 독립책임액 비율로 분담한다\n  · 피보험자가 이중으로 받을 수는 없다\n\n  다만 이 문제는 「각 보험에서 지급할 총보험금」을 물었으므로\n  각 보험별로 800만원과 500만원을 답한다.</span>\n\n<h4>Ⅳ. 정리 — 두 보험의 경계선</h4>\n<span class=\"tb\">건설공사보험 (재물보험)\n  「내 공사목적물」과 「추가약관으로 확장한 매설물 자체」\n  → 다만 그로 인한 결과적 손해는 빼 놓았다\n\n영업배상책임보험 (책임보험)\n  「남에게 입힌 손해」 전부\n  → 다만 내 공사목적물과 오염은 뺀다\n\n  두 보험을 함께 들어야 비로소 빈틈이 메워진다.\n  그래도 「오염물질 제거비용 200만원」은\n  어느 쪽에서도 보상되지 아니하고 남는다.\n  → 환경오염 배상책임보험이 따로 필요하다.</span>\n", "keys": ["지하매설전선이나 배관에 관한 추가약관", "공사 착수 전 관계기관 조회", "정확한 위치 확인", "매설물 자체의 수리비용에 한한다", "결과적 손해 제외", "진동·지지대 철거 및 약화 특약", "건설공사보험 800만원", "도급업자 특별약관 면책", "폭발·붕괴 및 지하매설물 손해담보 추가특별약관", "XCU", "소유·사용·관리하는 재물 면책", "오염사고 면책", "영업배상책임보험 500만원", "중복담보"], "law": ["국문 건설공사보험 보통약관 및 추가약관", "국문영업배상책임보험 보통약관 제4조", "도급업자 특별약관", "폭발·붕괴 및 지하매설물 손해담보 추가특별약관", "상법 제672조"]}}, {"no": 6, "body": "온라인쇼핑을 전문으로 하는 A사는 대규모 개인정보 유출사고를 일으켜 관계당국인\n개인정보보호위원회로부터 100억원의 과징금과 2천만원의 과태료를 부과받았다.\n또한, 피해고객 1,000명이 단체로 손해배상청구소송을 제기하여 5억원의 판결금과\n1억원의 변호사비용을 지출했다.\n상기 사고에 대비하기 위해 A사는 개인정보보호배상책임보험을 가입하고 있다.\n이 경우 A사가 입은 손해 중 ① 보통약관에서 보상하는 손해를 설명하고, ② 보통\n약관에서 보상하지 않는 손해를 보상받기 위한 특별약관을 기재하고, 해당 특약의\n보상하는 손해와 보상하지 않는 손해를 약술하시오. (10점)", "sub": [10], "points": 10, "a": {"plan": "보통약관은 배상금과 방어비용만 가져가고 과징금·과태료는 남는다. 그 남는 것을 담보하는 특약을 이름과 함께 정확히 적는다.", "ans": "\n<h4>0. 손해의 정리</h4>\n<span class=\"tb\">개인정보보호위원회 부과   과징금      100억원\n                         과태료      2,000만원\n피해고객 1,000명 단체소송  판결금        5억원\n                         변호사비용     1억원</span>\n\n<h3>① 보통약관에서 보상하는 손해</h3>\n\n<h4>Ⅰ. 개인정보보호배상책임보험의 구조</h4>\n<span class=\"tb\">「개인정보 보호법」 제39조의7 및 같은 법 시행령에 따라\n일정 규모 이상의 개인정보처리자는\n「손해배상책임의 이행을 위한 보험·공제 가입 또는 준비금 적립」이\n의무화되어 있다.\n\n  → 이 보험의 본체는 「정보주체에 대한 손해배상책임」을 담보한다.</span>\n\n<h4>Ⅱ. 보통약관이 보상하는 손해</h4>\n<span class=\"tb\">1. 법률상의 손해배상금\n\n   피보험자가 보유·관리하는 「개인정보의 유출·분실·도난·\n   위조·변조·훼손」으로 정보주체에게 손해를 입혀\n   법률상 배상책임을 짐으로써 입은 손해\n\n   → 「판결금 5억원」                    보상 ○\n\n2. 비용\n\n   가. 손해의 방지 또는 경감을 위하여 지출한\n       필요 또는 유익하였던 비용 (손해방지비용)\n   나. 제3자로부터 손해배상을 받을 수 있는 권리를\n       지키거나 행사하기 위한 비용 (권리보전비용)\n   다. 피보험자가 지급한 「소송비용·변호사비용·\n       중재·화해 또는 조정에 관한 비용」 (방어비용)\n   라. 공탁보증보험료\n   마. 회사의 요구에 따르기 위하여 지출한 비용 (협력비용)\n\n   → 「변호사비용 1억원」  방어비용으로 보상 ○\n     (보험자의 사전 동의를 얻은 경우,\n      손해배상금과 합하여 보상한도액 내에서)</span>\n<span class=\"tb\">보통약관에서 보상하는 손해 합계\n\n  판결금        5억원\n  변호사비용    1억원\n  ────────────────────\n  6억원  (보상한도액 및 자기부담금 적용 전)</span>\n\n<h4>Ⅲ. 보통약관이 보상하지 않는 손해</h4>\n<span class=\"tb\">· 「벌금·과료·과태료·과징금」 및 「징벌적 손해배상금」\n· 피보험자의 고의 또는 범죄행위로 인한 배상책임\n· 계약상 가중된 배상책임\n· 피보험자가 소유·사용·관리하는 재물에 생긴 손해\n· 신체장해에 대한 배상책임\n· 보험기간 개시 전에 이미 발생하였거나 알고 있었던 사고\n· 사고대응비용(통지비용·콜센터·포렌식 조사·신용조회 서비스 등)\n\n  → 이 사안에서는 「과징금 100억원」과 「과태료 2,000만원」이\n    보통약관의 담보 밖에 남는다.</span>\n\n<h3>② 보상받기 위한 특별약관</h3>\n\n<h4>「과징금·과태료 담보 특별약관」</h4>\n<p>(회사에 따라 <b>「행정벌 담보 특별약관」,\n「Regulatory Fines and Penalties 담보 특별약관」</b> 등으로 부른다.)</p>\n\n<h4>Ⅰ. 이 특약이 보상하는 손해</h4>\n<span class=\"tb\">1. 개인정보 유출사고와 관련하여\n   「관계 행정기관」이 피보험자에게 부과한\n   「과징금(課徵金)」과 「과태료(過怠料)」\n\n   관계 행정기관의 예\n     개인정보보호위원회, 방송통신위원회,\n     금융위원회·금융감독원, 그 밖의 감독기관\n\n2. 그 부과처분에 대응하기 위하여 지출한\n   「행정조사 대응비용·행정심판 및 행정소송비용」\n\n3. 보상한도액과 자기부담금을 따로 정한다.\n   (본체 담보와 별도의 한도를 두는 것이 보통이다)</span>\n\n<h4>Ⅱ. 이 특약이 보상하지 않는 손해</h4>\n<span class=\"tb\">1. 「법령상 보험으로 담보하는 것이 허용되지 아니하는 경우」\n   (where insurable by law 조건)\n   → 과징금·과태료는 행정제재이므로\n     이를 보험으로 전가하는 것이 제재의 실효성을 없앤다는 문제가 있다.\n     그래서 이 특약은 「법령상 담보가 허용되는 범위에서만」\n     보상하는 것을 조건으로 한다.\n\n2. 피보험자의 「고의」 또는 「중대한 과실」로 인한 부과\n   — 안전조치의무를 알면서도 이행하지 아니한 경우 등\n\n3. 「형사벌」에 해당하는 벌금·과료·몰수·추징\n\n4. 「징벌적 손해배상금(3배 배상 등)」\n\n5. 보험기간 개시 전에 이미 부과되었거나\n   그 원인이 되는 사고를 알고 있었던 경우\n\n6. 감독기관의 시정명령·개선명령을 이행하는 데 드는\n   설비투자·시스템 개선비용\n\n7. 이행강제금·가산금·지연이자</span>\n\n<h4>Ⅲ. 함께 가입할 만한 특별약관</h4>\n<span class=\"tb\">「개인정보 유출 사고대응비용 담보 특별약관」\n\n  보상하는 손해\n    · 정보주체에 대한 「통지·공고비용」\n    · 콜센터 운영비용\n    · 「포렌식 조사비용」(유출 경위와 규모의 조사)\n    · 신용조회·신용회복 서비스 제공비용\n    · 위기관리·홍보(PR) 비용\n    · 법률자문비용\n\n  보상하지 않는 손해\n    · 피보험자의 통상적인 운영비용\n    · 시스템 개선·보안 강화 비용\n    · 매출 감소 등 간접손해\n\n「네트워크 중단 담보 특별약관」(기업휴지)\n「사이버 갈취(Cyber Extortion) 담보 특별약관」</span>\n\n<h4>Ⅳ. 정리</h4>\n<span class=\"tb\">손해                    보통약관        특별약관\n\n판결금       5억원        보상 ○           -\n변호사비용   1억원        보상 ○           -\n                         (방어비용)\n과징금     100억원        보상 ×      과징금·과태료 담보 특약\n과태료   2,000만원        보상 ×      과징금·과태료 담보 특약</span>\n<p><b>과징금 100억원</b>은 판결금 5억원의 스무 배이다.\n<b>개인정보 유출사고에서 기업을 실제로 무너뜨리는 것은\n피해자에 대한 배상금이 아니라 행정제재</b>라는 점을\n이 문제가 보여 준다.</p>\n<p>다만 <b>과징금을 보험으로 담보하는 것이 법질서상 허용되는가</b>는\n여전히 논란이 있으므로,\n특약을 들었더라도 <b>“법령상 담보가 허용되는 범위”</b>라는\n조건이 붙어 있음을 유의하여야 한다.</p>\n", "keys": ["개인정보 보호법 제39조의7", "손해배상책임 이행을 위한 보험 가입 의무", "개인정보의 유출·분실·도난·위조·변조·훼손", "법률상 손해배상금", "판결금 5억원", "방어비용", "변호사비용 1억원", "과징금·과태료는 보통약관 면책", "과징금·과태료 담보 특별약관", "법령상 담보가 허용되는 범위", "고의·중대한 과실 제외", "형사벌 제외", "징벌적 손해배상금 제외", "사고대응비용 담보 특별약관", "포렌식 조사비용", "통지비용"], "law": ["개인정보 보호법 제39조·제39조의7·제64조의2", "개인정보보호배상책임보험 보통약관 및 특별약관", "국문영업배상책임보험 보통약관 제3조·제4조"]}}, {"no": 7, "body": "보험계약자(피보험자)가 재산종합보험(Package Insurance) Section Ⅰ(PAR)을 가입\n하고 <표1>의 사고가 발생하였다. 이 경우 피보험자가 보상을 받기 위해 가입해야 할\n확장담보(Special Extentions)를 기재하고, 주요 내용을 약술하시오. (10점)\n<표1. 사고내용>\n계약자(피보험자)는 현재 운영중인 공장동에 소규모의 신규 증축공사를 진행하던 중이었다.\n그러나 작업자의 부주의로 용접 불꽃이 판넬에 옮겨 붙으며 대형화재가 발생하였고 공사\n중이던 건물, 시설을 포함하여 공장동 대부분이 소실되었다.\n불길이 인접한 완제품 창고로 번지는 것을 막기 위해 급히 방화벽을 구축하고 자재들을\n안전한 곳으로 긴급하게 이동시켰다.\n화재가 진압된 후 무너진 건물 잔해를 치우고 주변 오염물질을 세척하는 작업을 진행\n하였으며, 일부 기계는 정밀점검 및 수리를 위해 인근 협력업체 작업장으로 일시 이동\n시켰으나, 협력업체 작업장에서 기계 하차 중 전도되어 물적손해가 발생하였다. 피보험자는\n해당 기계의 신속한 복구를 위해 독일 제조사로부터 부품을 긴급 조달하여 수리하였다.\n또한 건물을 원상태로 복구하려 하였으나 최근 개정되어 강화된 소방법규의 적용이\n필요하고, 복구기간이 길어지는 것을 피하기 위해 전 직원이 야간근무 및 휴일에도\n집중 투입되어 공장을 복구하였다.", "sub": [10], "points": 10, "a": {"plan": "사고 서술을 문장 단위로 끊으면 각 문장이 확장담보 하나씩을 가리킨다. 여섯 개를 뽑아 짝지어 준다.", "ans": "\n<h4>0. 재산종합보험 Section Ⅰ(PAR)과 확장담보</h4>\n<span class=\"tb\">재산종합보험(Package Insurance)의 구성\n\n  Section Ⅰ  재산손해 (PAR : Property All Risks)\n  Section Ⅱ  기계위험 (MB : Machinery Breakdown)\n  Section Ⅲ  기업휴지 (BI : Business Interruption)\n  Section Ⅳ  배상책임 (GL : General Liability)\n\nSection Ⅰ은 「전위험담보(all risks)」이지만\n보험목적물 자체의 「직접적인 물적 손해」만을 담보한다.\n\n  → 복구에 따라오는 여러 비용과\n    구내 밖에서 생긴 손해는 담보되지 아니한다.\n  → 그 빈틈을 메우는 것이 「확장담보(Special Extensions)」이다.\n  → 각 확장담보마다 「별도의 보상한도액(sub-limit)」을 둔다.</span>\n\n<h4>Ⅰ. 사고 서술과 확장담보의 대응</h4>\n<span class=\"tb\">사고 서술                                   필요한 확장담보\n\n「소규모의 신규 증축공사를 진행하던 중」\n「공사 중이던 건물, 시설을 포함하여」    →  ① 소규모 공사 확장담보\n\n「방화벽을 구축하고 자재들을\n 안전한 곳으로 긴급하게 이동」          →  ② 소방비용 · 손해경감비용\n\n「무너진 건물 잔해를 치우고\n 주변 오염물질을 세척」                 →  ③ 잔존물제거비용\n\n「인근 협력업체 작업장으로 일시 이동\n … 하차 중 전도되어 물적손해」          →  ④ 일시적 반출 확장담보\n\n「독일 제조사로부터 부품을 긴급 조달」  →  ⑤ 항공운임 확장담보\n「전 직원이 야간근무 및 휴일에도\n 집중 투입」                            →  ⑤ 특별비용(할증임금) 확장담보\n\n「최근 개정되어 강화된 소방법규의\n 적용이 필요」                          →  ⑥ 공공기관 조항</span>\n\n<h4>① 소규모 공사 확장담보 (Minor Works / Alterations and Additions Clause)</h4>\n<span class=\"tb\">주요 내용\n  · 운영 중인 사업장에서 이루어지는 「소규모의 신축·증축·개축·수리공사」와\n    그 공사목적물·자재·가설물에 생긴 손해를 담보한다\n  · 원래 건설공사보험(CAR/EAR)의 영역이지만,\n    작은 공사마다 따로 보험을 들기가 번거로우므로\n    「일정 금액 이하」의 공사를 자동으로 확장담보한다\n  · 공사금액의 한도(예: 1건당 ○○억원)와\n    보상한도액을 따로 정한다\n  · 그 한도를 넘는 공사는 별도로 건설공사보험에 가입하여야 한다\n\n이 사안\n  공사 중이던 건물과 시설의 손해를 담보하기 위하여 필요하다.</span>\n\n<h4>② 소방비용·손해경감비용 확장담보 (Fire Fighting Expenses / Sue and Labour)</h4>\n<span class=\"tb\">주요 내용\n  · 담보위험으로 손해가 생겼거나 생길 우려가 있을 때,\n    「손해를 방지하거나 줄이기 위하여」 지출한\n    필요·유익한 비용을 담보한다\n  · 소화약제·소방설비 사용비용, 소방대 출동비용,\n    임시 방화벽 등 「방재조치비용」\n  · 보험목적물을 안전한 곳으로 옮기는 「긴급 반출·보관비용」\n  · 그 이동 과정에서 생긴 손해도 담보하는 것이 보통이다\n\n이 사안\n  방화벽 구축비용과 자재의 긴급 이동비용을 담보하기 위하여 필요하다.</span>\n\n<h4>③ 잔존물제거비용 확장담보 (Debris Removal Clause)</h4>\n<span class=\"tb\">주요 내용\n  · 담보위험으로 손해를 입은 보험목적물의\n    「잔해를 해체·철거·청소·상차·운반·처분」하는 데 드는 비용\n  · 「오염물질의 세척·제염(decontamination)비용」을 포함하는지는\n    약관에 따라 다르며, 포함시키려면\n    「Removal of Debris including Decontamination」으로\n    확장하여야 한다\n  · 보통 보험가입금액의 일정 비율(예: 10%) 또는\n    별도의 한도액을 둔다\n\n이 사안\n  건물 잔해 제거비용과 주변 오염물질 세척비용을 담보하기 위하여 필요하다.</span>\n\n<h4>④ 일시적 반출 확장담보 (Temporary Removal Clause)</h4>\n<span class=\"tb\">주요 내용\n  · 보험목적물이 「청소·수리·개조·정밀점검」 등을 위하여\n    「일시적으로 구내 밖으로 반출」된 동안에 생긴 손해를 담보한다\n  · 「반출·반입에 따르는 운송 중의 손해」도 함께 담보한다\n  · 반출 장소와 기간(예: 국내, 60일 이내)에 제한을 둔다\n  · 재고자산은 대개 제외한다\n\n이 사안\n  기계를 협력업체 작업장으로 옮긴 것은\n  「정밀점검 및 수리를 위한 일시 반출」이고,\n  손해는 「하차 중」에 생겼다.\n  이 확장담보가 없으면 「구내 밖에서 생긴 손해」이므로\n  Section Ⅰ로는 보상되지 아니한다.</span>\n\n<h4>⑤ 특별비용·항공운임 확장담보 (Expediting Expenses / Airfreight)</h4>\n<span class=\"tb\">주요 내용\n  · 손해를 「신속하게 복구」하기 위하여 추가로 지출한 비용을 담보한다\n      - 시간외·야간·휴일 근무에 따른 「할증임금」\n      - 「급행운임(express freight)」\n      - 「항공운임(airfreight)」\n  · 「항공운임」은 대개 별도의 확장담보 항목으로 두거나\n    별도의 한도액을 정한다\n    (보통의 특별비용 담보에서는 제외되는 것이 원칙이다)\n  · 복구를 앞당김으로써 기업휴지손해를 줄이는 효과가 있으므로\n    보험자에게도 이익이 된다\n\n이 사안\n  독일 제조사로부터의 긴급 부품 조달비용(항공운임)과\n  전 직원의 야간·휴일 근무에 따른 할증임금을 담보하기 위하여 필요하다.</span>\n\n<h4>⑥ 공공기관 조항 (Public Authorities Clause / Increased Cost of Construction)</h4>\n<span class=\"tb\">주요 내용\n  · 손해를 입은 재물을 복구할 때\n    「법령·조례·규정의 요구」에 따라\n    원상복구를 넘어 추가로 드는 비용을 담보한다\n      - 강화된 소방법규·건축법규·내진기준의 적용\n      - 그에 따른 설계변경·설비 추가\n  · 「손해를 입지 아니한 부분」에 대하여 법령이 요구하는\n    개량비용까지 담보하는지는 약관에 따라 다르다\n  · 손해 발생 「전」에 이미 통지되었던 법령 위반사항의\n    시정비용은 담보하지 아니한다\n  · 복구기간·한도액을 따로 정한다\n\n이 사안\n  최근 개정되어 강화된 소방법규에 맞추어 복구하는 데\n  추가로 드는 비용을 담보하기 위하여 필요하다.\n  이 조항이 없으면 「사고 전 상태로 되돌리는 비용」까지만 보상되어\n  법령을 지킬 수 없게 된다.</span>\n\n<h4>Ⅱ. 정리</h4>\n<span class=\"tb\">① Minor Works (소규모 공사)           공사 중이던 건물·시설\n② Fire Fighting / Sue and Labour     방화벽 구축, 자재 긴급 이동\n③ Debris Removal (잔존물제거)         잔해 제거, 오염물질 세척\n④ Temporary Removal (일시적 반출)     협력업체 작업장에서의 손해\n⑤ Expediting Expenses / Airfreight   긴급 부품 조달, 야간·휴일 근무\n⑥ Public Authorities (공공기관 조항)  강화된 소방법규 적용</span>\n<p>확장담보는 <b>“본체는 물건값만 준다”</b>는 재물보험의 한계를\n<b>실제 복구에 드는 돈</b>에 맞추어 넓히는 장치이다.\n<b>각 확장담보마다 별도의 보상한도액</b>이 있으므로,\n<b>한도를 얼마로 잡아 두었는가</b>가 사고 때의 실질을 좌우한다.</p>\n", "keys": ["재산종합보험 Section Ⅰ PAR", "Special Extensions", "sub-limit", "Minor Works", "소규모 공사 확장담보", "Fire Fighting Expenses", "Sue and Labour", "Debris Removal", "decontamination", "Temporary Removal", "일시적 반출", "운송 중 손해", "Expediting Expenses", "Airfreight", "할증임금", "Public Authorities Clause", "강화된 법규", "Increased Cost of Construction"], "law": ["재산종합보험(Package Insurance) Section Ⅰ Property All Risks 및 Special Extensions"]}}]}, {"round": 49, "subject": "자동차보험의 이론과 실무(대물배상 및 차량손해)", "track": "차량", "src": "49회_2차 자동차보험의 이론과 실무 (대물배상 및 차량손해).pdf", "chars": 884, "digits": 28, "pts_ok": true, "q": [{"no": 1, "body": "보험회사의 대위권에 대하여 설명하고, 자차의 일방과실 사고로 자기\n차량과 피해차량에 대하여 전손보험금을 지급한 경우 잔존물대위에\n대한 법률 규정과 보험회사가 피보험자의 권리를 취득하지 않는 약관\n규정에 대하여 서술하시오.(20점)", "sub": [20], "points": 20, "a": {"plan": "대위를 「잔존물대위(제681조)」와 「청구권대위(제682조)」로 갈라 놓는 것이 첫째다. 그다음 「자기 차량은 잔존물대위가 되지만 피해차량은 배상책임이라 되지 않는다」는 대비를 세우고, 마지막에 제682조 제2항과 약관의 대위 금지를 붙인다.", "ans": "\n<h4>Ⅰ. 보험자대위 — 두 갈래</h4>\n\n<h4>1. 뜻과 근거</h4>\n<span class=\"tb\">「보험자대위」란 보험자가 보험금을 지급한 뒤\n「보험의 목적」이나 「제3자에 대한 권리」를\n법률상 당연히 취득하는 제도이다.\n\n 왜 두는가\n  ① 「이득금지의 원칙」\n     피보험자가 보험금도 받고 잔존물도 갖고\n     가해자에게서도 받으면 「손해보다 더」\n     받게 된다. 손해보험은 손해를 메우는\n     제도이지 이득을 주는 제도가 아니다.\n  ② 「가해자의 면책 방지」\n     피해자가 보험금을 받았다고 하여\n     잘못한 사람이 책임을 벗는 것은 옳지 않다.\n\n 두 종류\n  「잔존물대위」  상법 제681조\n  「청구권대위(제3자에 대한 대위)」\n                 상법 제682조</span>\n\n<h4>2. 청구권대위 (상법 제682조)</h4>\n<span class=\"tb\">「① 손해가 「제3자의 행위」로 인하여 생긴\n  경우에 보험금을 지급한 보험자는\n  「그 지급한 금액의 한도에서」\n  그 제3자에 대한 보험계약자 또는\n  피보험자의 권리를 취득한다.\n  다만, 보험자가 보상할 보험금의 일부를\n  지급한 경우에는 「피보험자의 권리를\n  침해하지 아니하는 범위에서」만\n  그 권리를 행사할 수 있다.\n\n ② 보험계약자나 피보험자의 제1항에 따른\n  권리가 그와 「생계를 같이 하는 가족」에\n  대한 것인 경우 보험자는 그 권리를\n  취득하지 못한다. 다만, 손해가 그 가족의\n  「고의」로 인하여 발생한 경우에는\n  그러하지 아니하다.」\n\n  · 대위의 범위는 「지급한 보험금」이 한도\n  · 「피보험자 우선의 원칙」\n    피보험자가 다 보전받지 못한 부분이\n    있으면 피보험자가 먼저이다.</span>\n\n<h4>Ⅱ. 잔존물대위 — 상법 제681조</h4>\n\n<h4>1. 조문</h4>\n<span class=\"tb\">「보험의 목적의 「전부가 멸실」한 경우에\n 「보험금액의 전부」를 지급한 보험자는\n 그 목적에 대한 피보험자의 권리를 취득한다.\n 그러나 「보험가액의 일부를 보험에 붙인\n 경우」에는 보험자가 취득할 권리는\n 「보험금액의 보험가액에 대한 비율」에 따라\n 이를 정한다.」</span>\n\n<h4>2. 요건</h4>\n<span class=\"tb\">「① 「보험의 목적의 전부가 멸실」하였을 것」\n  · 「현실전손」 — 차량이 완전히 부서져\n    수리가 불가능한 경우\n  · 「추정전손·경제적 전손」 — 수리비가\n    보험가액을 넘어 수리가 무의미한 경우\n  · 「도난」 후 회수되지 않은 경우\n  → 「분손」에는 잔존물대위가 없다.\n\n「② 보험자가 「보험금액의 전부」를\n   지급하였을 것」\n  · 일부만 지급한 상태에서는 권리가\n    이전되지 않는다.\n\n「③ 일부보험이면 그 비율만큼만 취득」\n  보험금액 ÷ 보험가액의 비율\n\n「④ 별도의 의사표시를 요하지 않는다」\n  · 「법률상 당연히」 권리가 이전된다.\n  · 다만 자동차는 「이전등록」을 하여야\n    제3자에게 대항할 수 있고, 폐차·이전에\n    피보험자의 협력이 필요하다.\n  · 보험자는 잔존물의 취득을 「포기」할 수도\n    있으며, 이때에는 「잔존물 가액을 공제」하고\n    보험금을 지급한다.</span>\n\n<h4>Ⅲ. 이 사안에의 적용</h4>\n\n<h4>1. 「자기 차량」의 전손보험금 — 잔존물대위 ○</h4>\n<span class=\"tb\">「자기차량손해」는 피보험자동차라는\n「보험의 목적」에 대한 「재물보험」이다.\n\n  · 전손이 되어 보험가액 전액을 지급하였으므로\n    상법 제681조의 요건을 갖춘다.\n  · 보험회사는 피보험자동차의 「잔존물\n    (폐차·고철·재활용 부품)」에 대한\n    권리를 취득한다.\n\n  실무\n   ① 보험회사가 잔존물을 「인수」하고\n      보험가액 전액을 지급하거나,\n   ② 잔존물을 인수하지 않고\n      「잔존물 가액을 공제」한 금액을\n      지급한다.\n   ③ 전손 시에는 「취득세·등록세 등\n      대체비용」을 보험가액과 별도로\n      지급한다(표준약관).</span>\n\n<h4>2. 「피해차량」의 전손보험금 — 잔존물대위 ×</h4>\n<span class=\"tb\">「대물배상」은 피보험자가 「타인의 재물」에\n입힌 손해에 대한 「배상책임보험」이다.\n\n  · 「보험의 목적」은 피해차량이 아니라\n    「피보험자의 배상책임(소극재산)」이다.\n  · 피해차량은 애초에 이 보험의 목적이\n    아니므로, 상법 제681조가 적용될 여지가\n    없다.\n  · 따라서 보험회사는 피해차량의 잔존물에\n    대한 권리를 「취득하지 못한다」.\n\n  그러면 잔존물은 어떻게 되는가\n   피해자가 잔존물을 그대로 가진 채\n   차량가액 전액을 배상받으면 「이득」을\n   보게 된다.\n   → 그래서 배상액을 산정할 때 「피해차량의\n     잔존물(고철) 가액을 「공제」」한다.\n     대위가 아니라 「손해액 산정 단계」에서\n     해결한다.\n\n  ※ 「자기 차량은 대위로, 피해차량은\n    손해액 공제로」 처리한다는 점이\n    이 문제의 핵심이다.</span>\n\n<h4>Ⅳ. 보험회사가 피보험자의 권리를 취득하지 않는 약관 규정</h4>\n\n<h4>1. 「생계를 같이 하는 친족」에 대한 권리</h4>\n<span class=\"tb\">자동차보험 표준약관\n\n 「회사는 보험금을 지급한 경우에도\n  다음의 어느 하나에 해당하는 자에 대하여는\n  그 권리를 「취득하지 못합니다」.\n  다만, 손해가 그들의 「고의」로 인하여\n  발생한 경우에는 그러하지 아니합니다.\n   · 「기명피보험자」\n   · 「기명피보험자와 생계를 같이 하는\n      친족」」\n\n (상법 제682조 제2항과 같은 취지)\n\n 왜 그런가\n  가족에게 구상하면 결국 「같은 주머니」에서\n  나가게 되어 보험에 든 뜻이 사라진다.\n  → 「보험의 실효성」을 지키기 위한 규정이다.\n  다만 「고의」로 낸 사고까지 보호할 이유는\n  없으므로 예외를 둔다.</span>\n\n<h4>2. 「피보험자」에 대하여는 대위할 수 없다</h4>\n<span class=\"tb\">상법 제682조의 대위는 「제3자」에 대한\n권리를 전제로 한다.\n\n  「기명피보험자·친족피보험자·승낙피보험자·\n   사용피보험자·운전피보험자」는\n  「이 보험이 보호하는 사람」이지\n  제3자가 아니다.\n\n  → 그들에 대하여는 대위할 수 없다.\n    이 사안은 「자차의 일방과실」이므로\n    잘못한 사람이 피보험자 자신이고,\n    「대위할 상대가 처음부터 없다」.</span>\n\n<h4>3. 「자기신체사고·자동차상해」의 경우</h4>\n<span class=\"tb\">「인보험」에는 보험자대위가 인정되지 않는다\n(상법 제729조 본문).\n\n  → 자기신체사고·자동차상해 보험금을\n    지급하여도 가해자에 대한 권리를\n    취득하지 못한다.\n\n  ※ 다만 「무보험자동차에 의한 상해」는\n    상법 제729조 단서와 약관에 따라\n    「대위를 인정」한다. 실질이 손해보험에\n    가깝기 때문이다.</span>\n\n<h4>4. 「일부 지급」의 경우 — 피보험자 우선</h4>\n<span class=\"tb\">「회사가 보상한 금액이 피보험자가 입은\n 손해의 「일부」인 경우에는, 「피보험자의\n 권리를 침해하지 아니하는 범위」에서만\n 그 권리를 취득합니다.」\n\n  · 자기차량손해에서 「자기부담금」을 공제하고\n    지급한 경우, 피보험자가 부담한\n    자기부담금 부분은 피보험자가 먼저\n    회수한다.\n  · 「대물배상의 보상한도액을 넘는 손해」가\n    있는 경우에도 피보험자(피해자)가\n    우선한다.</span>\n\n<h4>5. 정리</h4>\n<span class=\"tb\">              대위의 성부\n──────────────────────────────────────────\n 자기 차량 전손   「잔존물대위 ○」\n                  (상법 제681조)\n 피해차량 전손    「잔존물대위 ×」\n                  (배상책임보험 → 손해액에서\n                   잔존물 가액 공제)\n 일방과실 사고    「청구권대위 ×」\n                  (잘못한 자가 피보험자 자신)\n 생계 같이 하는   「취득 못함」\n 친족             (고의는 예외)\n 자기신체사고     「취득 못함」(인보험)\n 무보험차상해     「취득 가능」(약관 특칙)\n 일부 지급        「피보험자 우선」</span>\n", "keys": ["잔존물대위(제681조)와 청구권대위(제682조)의 구별", "잔존물대위 요건 — 전부 멸실 + 보험금액 전부 지급 + 일부보험은 비율", "법률상 당연 이전, 자동차는 이전등록 필요", "자기 차량 전손은 잔존물대위 ○", "피해차량은 대물배상(배상책임)이라 잔존물대위 × → 손해액에서 잔존물 가액 공제", "생계를 같이 하는 친족은 대위 금지(고의는 예외)", "피보험자는 제3자가 아니므로 대위 불가", "자기신체사고는 인보험이라 대위 불가, 무보험차상해는 특칙으로 가능"], "law": ["상법 제681조·제682조·제729조", "자동차보험 표준약관(보험회사의 대위)"]}}, {"no": 2, "body": "부가가치세(VAT)의 정의 및 인정기준에 대해 약술하고, 아래의 여객운송\n수단별 부가가치세 적용을 판단하시오.(15점)\n예) 시내버스 : (면세) / 고속철도 : (과세)\n① 특수자동차(장의차량) : ( ) ② 농어촌버스 : ( )\n③ 마을버스 : ( ) ④ 전세버스 : ( )\n⑤ 시외버스(고속형) : ( ) ⑥ 법인택시 : ( )", "sub": [15], "points": 15, "a": {"plan": "「매입세액을 공제받을 수 있으면 손해가 아니다」가 인정기준의 전부다. 여객운송은 「노선버스는 면세, 전세·택시·장의차는 과세」로 갈리는데, 시외우등고속버스만 예외로 과세라는 점을 함께 짚는다.", "ans": "\n<h4>Ⅰ. 부가가치세의 정의</h4>\n<span class=\"tb\">「부가가치세(Value Added Tax, VAT)」는\n「재화 또는 용역의 공급」과 「재화의 수입」에\n대하여, 각 거래단계에서 사업자가 창출한\n「부가가치」에 부과하는 「간접소비세」이다.\n\n · 세율  「10%」 (영세율 0% 적용대상 별도)\n · 「납세의무자」는 사업자이지만\n   「담세자(실제로 부담하는 자)」는 최종\n   소비자이다. 그래서 「간접세」이다.\n · 사업자는\n     「납부세액 = 매출세액 − 매입세액」\n   으로 계산하여, 자기가 만들어 낸\n   부가가치에 대하여만 세금을 낸다.\n\n［사업자의 구분］\n · 「일반과세자」  매입세액을 「공제·환급」받는다.\n · 「간이과세자」  일정 비율만 공제받는다.\n · 「면세사업자」  매입세액을 「공제받지\n                   못한다」.\n · 「비사업자(개인)」 공제 자체가 없다.</span>\n\n<h4>Ⅱ. 자동차보험에서의 인정기준</h4>\n\n<h4>1. 원칙 — 「환급받을 수 있으면 손해가 아니다」</h4>\n<span class=\"tb\">수리비 청구서에는 부가가치세가 붙는다.\n그런데 피해자가 그 부가가치세를 「매입세액\n으로 공제받을 수 있다면」, 그는 결국\n그 돈을 「부담하지 않는다」.\n\n → 손해배상은 「실제로 입은 손해」를\n   메우는 것이므로, 돌려받을 세금까지\n   물어 줄 이유가 없다.\n\n 「매입세액을 공제받을 수 있는 자」\n   → 「부가가치세를 손해로 인정하지 않는다」\n     (공급가액만 인정)\n\n 「매입세액을 공제받을 수 없는 자」\n   → 「부가가치세를 손해로 인정한다」\n     (공급가액 + 부가가치세)</span>\n\n<h4>2. 유형별 판단</h4>\n<span class=\"tb\">「부가가치세를 「인정하지 않는」 경우」\n · 「일반과세사업자」의 「영업용 차량」\n   (화물차·버스·택시 등 사업에 쓰는 차량)\n\n「부가가치세를 「인정하는」 경우」\n · 「비사업자(개인)」의 차량\n · 「면세사업자」의 차량\n   (병원·학원·농업·시내버스 사업자 등)\n · 「간이과세자」의 차량\n   (공제받지 못하는 부분에 한하여)\n · 「비영업용 소형승용차」\n   ← 특히 중요\n   부가가치세법 제39조 제1항 제5호는\n   「비영업용 소형승용자동차의 구입·임차·\n    유지에 관한 매입세액」을 「공제하지\n    아니한다」고 정한다.\n   → 일반과세사업자라도 「업무용 승용차」의\n     수리비 부가가치세는 공제받지 못하므로\n     「손해로 인정」한다.\n\n［실무］\n · 「사업자등록증」과 「과세유형(일반·간이·면세)」\n   을 확인한다.\n · 차량등록증의 「용도(영업용/비영업용)」와\n   「차종(소형승용 여부)」을 확인한다.\n · 세금계산서의 발행 여부와 수취인을 본다.</span>\n\n<h4>Ⅲ. 여객운송 용역의 과세·면세</h4>\n\n<h4>1. 근거</h4>\n<span class=\"tb\">부가가치세법 제26조 제1항 제7호\n 「「여객운송 용역」은 부가가치세를 면제한다.\n  다만, 「항공기·고속철도·전세버스·택시·\n  특수여객자동차·자동차대여사업·특수여객선박·\n  관광유람선」 등 「대통령령으로 정하는 것」은\n  그러하지 아니하다.」\n\n 같은 법 시행령 제37조가 그 「과세대상」을\n 열거한다.\n\n［가르는 기준］\n 「노선(路線) 여객자동차운송사업」\n   = 시내버스·농어촌버스·마을버스·시외버스\n   → 「면세」  (서민의 발이므로 면세)\n\n 「구역(區域) 여객자동차운송사업」 등\n   = 전세버스·택시·특수여객(장의)·렌터카\n   → 「과세」  (선택적·고급 운송이므로 과세)</span>\n\n<h4>2. 문제의 판단</h4>\n<span class=\"tb\">예) 시내버스 : (면세) / 고속철도 : (과세)\n\n ① 「특수자동차(장의차량)」  → 「(과세)」\n    여객자동차 운수사업법상\n    「특수여객자동차운송사업」으로,\n    시행령 제37조의 과세대상이다.\n\n ② 「농어촌버스」            → 「(면세)」\n    노선 여객자동차운송사업\n\n ③ 「마을버스」              → 「(면세)」\n    노선 여객자동차운송사업\n\n ④ 「전세버스」              → 「(과세)」\n    구역 여객자동차운송사업,\n    시행령 제37조의 과세대상\n\n ⑤ 「시외버스(고속형)」      → 「(면세)」\n    시외버스운송사업은 「노선」 여객자동차\n    운송사업이므로 면세이다.\n    ※ 다만 「시외우등고속버스」는 2015년부터\n      과세대상으로 전환되었으므로,\n      「우등」이면 「과세」가 된다.\n\n ⑥ 「법인택시」              → 「(과세)」\n    택시운송사업. 개인택시도 같다.</span>\n\n<h4>3. 정리</h4>\n<span class=\"tb\">  구       분              과세 / 면세\n──────────────────────────────────────────\n 시내버스                    면세\n 「농어촌버스」               「면세」\n 「마을버스」                 「면세」\n 「시외버스(고속형)」         「면세」\n   (시외우등고속버스)          (과세)\n 「전세버스」                 「과세」\n 「법인택시」·개인택시        「과세」\n 「특수자동차(장의차량)」     「과세」\n 자동차대여(렌터카)           과세\n 항공기                       과세\n 고속철도                     과세\n\n［손해사정에의 연결］\n · 「면세」 사업자의 차량 → 그 사업자는\n   매입세액을 공제받지 못하므로\n   「수리비의 부가가치세를 손해로 인정」한다.\n   (시내·농어촌·마을·시외버스)\n · 「과세」 사업자의 영업용 차량 → 매입세액을\n   공제받으므로 「부가가치세를 인정하지\n   않는다」.\n   (전세버스·택시·장의차량)\n\n → 여객운송의 과세·면세를 묻는 까닭이\n   바로 여기에 있다.</span>\n", "keys": ["VAT는 부가가치에 부과하는 간접세, 세율 10%", "납부세액 = 매출세액 − 매입세액", "매입세액을 공제받을 수 있으면 손해로 인정하지 않음", "비영업용 소형승용차 매입세액은 불공제 → 손해로 인정", "노선 여객자동차운송사업(시내·농어촌·마을·시외버스)은 면세", "전세버스·택시·특수여객(장의)·렌터카는 과세", "시외버스(고속형) 면세, 다만 시외우등고속버스는 과세", "면세사업자 차량은 부가세를 손해로 인정"], "law": ["부가가치세법 제26조 제1항 제7호·제37조·제39조 제1항 제5호", "같은 법 시행령 제37조", "여객자동차 운수사업법 제3조 및 같은 법 시행령 제3조", "자동차보험 표준약관 대물배상 지급기준"]}}, {"no": 3, "body": "과실비율 인정기준의 적용에서 “구체적인 과실비율 확정방법(수정요소\n적용)”을 설명하고, 아래 사고유형의 기본과실과 수정요소에 대해\n서술하시오.(15점)\n(과실도표 차 11-2) 신호있는 교차로 동일방향 총 4차선도로에서\nA차량이 직진좌회전차로 2차선에서 직진할 때\nB차량이 직진차로 3차선에서 좌회전하는 사고가 발생하였다.", "sub": [15], "points": 15, "a": {"plan": "「기본과실 → 수정요소 가감 → 0~100 조정 → 5% 단위 정리」의 절차를 먼저 세우고, 사안은 「B가 직진차로에서 좌회전한 지정차로 위반」임을 못박아 기본과실 30:70을 끌어낸 뒤 수정요소를 A쪽·B쪽으로 나누어 적는다.", "ans": "\n<h4>Ⅰ. 구체적인 과실비율 확정방법</h4>\n\n<h4>1. 과실비율 인정기준의 성격</h4>\n<span class=\"tb\">「자동차사고 과실비율 인정기준」\n (손해보험협회·자동차사고 과실비율 분쟁심의\n  위원회)\n\n · 법규가 아니라 「보험업계의 자율기준」이나,\n   법원도 실질적인 참고자료로 삼는다.\n · 「도표(圖表)」로 사고유형을 나누고\n   유형별 「기본과실비율」을 정한 뒤,\n   개별 사정을 「수정요소」로 가감한다.</span>\n\n<h4>2. 확정의 절차 — 다섯 단계</h4>\n<span class=\"tb\">「① 사고유형의 확정」\n   도로의 종류, 신호기 유무, 진행방향,\n   당사자의 지위(직진·좌회전·후진 등)로\n   해당 「도표」를 찾는다.\n\n「② 기본과실비율의 적용」\n   그 도표가 정한 A : B의 기본비율을\n   출발점으로 삼는다.\n\n「③ 수정요소의 가감」\n   도표 아래에 열거된 수정요소를\n   해당하는 만큼 「가산·감산」한다.\n   · 「여러 수정요소가 있으면 「중복 적용」」\n     할 수 있다.\n   · 다만 「같은 성질의 요소」는 겹쳐\n     적용하지 않는다.\n     (예: 「현저한 과실」과 「중대한 과실」은\n      더 무거운 하나만 적용)\n   · 「도표에 없는 사정」은 원칙적으로\n     수정요소로 삼지 않되, 명백히 불합리한\n     때에는 「기타 사정」으로 조정할 수 있다.\n\n「④ 상·하한의 조정」\n   가감한 결과가 「0% 미만」이거나\n   「100%를 초과」하면 0% 또는 100%로 한다.\n\n「⑤ 최종 정리」\n   결과를 「5% 또는 10% 단위」로 반올림하여\n   정리한다.\n   A와 B의 합은 반드시 「100%」가 되어야 한다.</span>\n\n<h4>3. 대표적 수정요소</h4>\n<span class=\"tb\">「현저한 과실」  (통상 「+10%」)\n · 「한눈팔기」 등 전방주시의무 위반이\n   현저한 경우\n · 「음주운전」 (혈중알코올농도 0.03% 이상\n   0.08% 미만)\n · 「제한속도 10km/h 이상 20km/h 미만 초과」\n · 핸들·브레이크 조작의 현저히 부적절한 경우\n · 시야장애 (차창에 짐을 쌓아 시야를 가린 경우)\n · 야간 「등화 미점등」\n · 지리 불숙지로 인한 급조작\n\n「중대한 과실」  (통상 「+20%」)\n · 「무면허운전」\n · 「음주운전」 (혈중알코올농도 0.08% 이상)\n · 「제한속도 20km/h 이상 초과」\n · 「졸음운전」\n · 「마약·약물」 복용 운전\n · 「신호위반」·「중앙선 침범」\n   (해당 도표에서 별도로 정한 경우)\n\n「그 밖의 수정요소」\n · 「어린이·노인·장애인 보호구역」  +10~15%\n · 「대형차」                        +5%\n · 「서행 여부」·「방향지시등 작동 여부」\n · 「이미 진로변경이 완료된 상태」였는지\n · 「급격한 진로변경(급좌회전)」\n · 「진로변경 금지장소(백색 실선)」인지</span>\n\n<h4>Ⅱ. 사안의 검토 — 도표 차 11-2</h4>\n\n<h4>1. 사고의 구조</h4>\n<span class=\"tb\">「신호 있는 교차로, 동일방향 총 4차로」\n\n  ← 1차로   좌회전 전용\n  ← 「2차로   직진·좌회전 겸용」  ← 「A 직진」\n  ← 「3차로   직진 전용」          ← 「B 좌회전」\n  ← 4차로   직진(우회전)\n\n［A차량］\n  「직진·좌회전 겸용차로」에서 「직진」\n  → 그 차로가 허용하는 통행방법이므로\n    「적법한 통행」이다.\n\n［B차량］\n  「직진 전용차로」에서 「좌회전」\n  → 도로교통법 제14조 제2항, 제25조\n    「지정차로 위반」이자 「좌회전 방법 위반」\n  → 게다가 「왼쪽에 있는 A차량의 진로를\n    가로질러」 나가는 결과가 된다.\n\n  → 「B의 과실이 뚜렷이 무겁다」.</span>\n\n<h4>2. 기본과실비율</h4>\n<span class=\"tb\">        「A(직진) 30 : B(좌회전) 70」\n\n 왜 A에게도 30이 있는가\n  · 좌회전 겸용차로에서 직진하는 차량은\n    「오른쪽 차로 차량이 좌회전할 수도 있는」\n    교차로의 상황을 살피며 「전방주시와\n    안전운전」을 하여야 한다.\n  · 앞서 가던 B차량이 좌회전 기미를\n    보였다면 감속·회피할 여지가 있었다.\n\n 왜 B가 70인가\n  · 「직진 전용차로에서의 좌회전」은\n    다른 운전자가 예상할 수 없는 통행이다.\n  · 지정차로 위반이라는 「명백한 법규 위반」이\n    사고의 직접적 원인이다.\n\n  ※ 반대로 「A가 좌회전차로에서 직진」한\n    경우(차 11-1 계열)라면 A의 과실이\n    크게 올라간다. 「어느 쪽이 자기 차로가\n    허용하지 않는 통행을 하였는가」가\n    이 도표군의 열쇠이다.</span>\n\n<h4>3. 수정요소</h4>\n<span class=\"tb\">「A(직진차)에게 가산되는 요소」\n · A의 「현저한 과실」            +10\n · A의 「중대한 과실」            +20\n · A의 「제한속도 위반」\n · A가 「B의 좌회전을 미리 인식할 수\n   있었음에도」 감속·회피조치를 하지\n   않은 경우                     +10\n · 「대형차」                     +5\n · 「어린이·노인·장애인 보호구역」 +10\n\n「B(좌회전차)에게 가산되는 요소」\n · B의 「현저한 과실」            +10\n · B의 「중대한 과실」            +20\n · 「방향지시등을 켜지 않은」 경우 +10\n · 「급좌회전(서행하지 않은)」     +10\n · 「진로변경 금지장소(백색 실선)」\n   에서의 좌회전                 +10\n · 「좌회전 신호가 아닌 상태」에서의\n   좌회전 (신호위반)             +10~20\n · 「대형차」                     +5\n\n「B에게 감산될 수 있는 요소(A 가산)」\n · B가 「이미 좌회전을 상당 부분 진행하여\n   A가 충분히 인식할 수 있었던」 경우\n · B가 「좌회전 신호에 따라」 회전하였고\n   A가 「직진신호 없이」 진행한 경우\n   → 이때에는 비율이 크게 뒤집힌다.</span>\n\n<h4>4. 적용의 예</h4>\n<span class=\"tb\">［사례 1］ B가 방향지시등을 켜지 않고\n          급하게 좌회전한 경우\n\n  기본        A 30 : B 70\n  B 방향지시등 미작동  −10 : +10\n  B 급좌회전           −10 : +10\n  ─────────────────────────────────\n  최종        「A 10 : B 90」\n\n［사례 2］ A가 제한속도를 25km/h 초과한 경우\n\n  기본        A 30 : B 70\n  A 중대한 과실       +20 : −20\n  ─────────────────────────────────\n  최종        「A 50 : B 50」\n\n［사례 3］ A가 한눈을 팔았고, B는\n          방향지시등을 켜지 않은 경우\n\n  기본        A 30 : B 70\n  A 현저한 과실       +10 : −10\n  B 방향지시등 미작동  −10 : +10\n  ─────────────────────────────────\n  최종        「A 30 : B 70」 (상쇄)</span>\n<p><i>* 기본과실비율과 수정요소의 구체적인 수치는\n「자동차사고 과실비율 인정기준」이 개정될 때마다 달라지므로,\n답안을 작성할 때에는 <b>시행 중인 인정기준의 해당 도표</b>를 확인하여야 한다.\n채점에서 중요한 것은 <b>「어느 쪽이 자기 차로가 허용하지 않는 통행을 하였는가」</b>를\n가려내고 <b>수정요소를 체계적으로 가감하는 절차</b>를 보여 주는 것이다.</i></p>\n", "keys": ["절차 — 사고유형 확정 → 기본과실 → 수정요소 가감 → 0~100 조정 → 5% 단위 정리", "수정요소는 중복 적용하되 같은 성질은 하나만", "현저한 과실 +10 (한눈팔기·음주 0.03~0.08·10~20km/h 초과 등)", "중대한 과실 +20 (무면허·음주 0.08 이상·20km/h 초과·졸음)", "A는 직진좌회전 겸용차로 직진으로 적법, B는 직진 전용차로에서 좌회전(지정차로 위반)", "기본과실 A 30 : B 70", "B 수정 — 방향지시등 미작동·급좌회전·백색실선 좌회전 각 +10"], "law": ["자동차사고 과실비율 인정기준(손해보험협회) 도표 차 11-2", "도로교통법 제13조·제14조·제19조·제25조·제38조"]}}, {"no": 4, "body": "개인사업용차량의 휴차료 산정 시 증명자료가 있는 경우 휴차료 산정 방식을\n설명하고, 영업수익 계산 시 징구하여야 할 증명자료와 1일 운행경비 계산에\n필요한 세부항목에 대하여 나열하시오.(15점)", "sub": [15], "points": 15, "a": {"plan": "「1일 영업수익 − 1일 운행경비」에 「휴차기간」을 곱하는 한 줄 산식을 세우고, 그 두 항을 각각 무엇으로 증명하고 무엇으로 구성하는지 나열한다. 고정비를 운행경비에서 빼지 않는다는 점이 실무의 관건이다.", "ans": "\n<h4>0. 휴차료란</h4>\n<span class=\"tb\">「휴차료」란 「사업용 자동차(건설기계 포함)」가\n파손·오손되어 사용하지 못하는 기간 동안\n「영업을 하지 못하여 입은 손해」를 말한다.\n\n · 「비사업용 자동차」의 경우에는 휴차료가\n   아니라 「대차료(렌터카 비용)」로 처리한다.\n · 휴차료와 대차료는 「중복하여」 인정하지\n   않는다.\n · 자동차보험 표준약관 「대물배상 지급기준」의\n   간접손해 항목이다.</span>\n\n<h4>Ⅰ. 증명자료가 있는 경우의 산정방식</h4>\n\n<h4>1. 기본 산식</h4>\n<span class=\"tb\">「휴차료 = (1일 영업수익 − 1일 운행경비)\n           × 「휴차기간(일)」」\n\n · 「1일 영업수익」\n     실제로 벌어들이는 총수입\n · 「1일 운행경비」\n     그 수입을 얻기 위하여 「차를 굴리는 데」\n     드는 비용\n · 그 차액이 「차를 세워 둠으로써 잃은\n   순이익 상당액」이다.\n\n 왜 운행경비를 빼는가\n  차를 세워 두는 동안에는 기름값·통행료가\n  나가지 않는다. 그만큼은 손해가 아니라\n  「절약된 비용」이기 때문이다.</span>\n\n<h4>2. 1일 영업수익의 산출</h4>\n<span class=\"tb\">              「해당 기간의 총 영업수익」\n 1일 영업수익 = ──────────────────────────\n                「해당 기간의 실제 운행일수」\n\n · 통상 「사고 직전 3개월 또는 1년」의\n   실적을 기준으로 한다.\n · 「휴일·정비일 등 실제로 운행하지 않은 날」은\n   분모에서 뺀다. 그러지 않으면 1일 수익이\n   과소하게 산정된다.\n · 계절적 변동이 큰 업종은 「전년 동기」와\n   비교하여 보정한다.</span>\n\n<h4>3. 휴차기간(인정기간)</h4>\n<span class=\"tb\">「① 수리가 가능한 경우」\n   「수리에 소요되는 기간」\n   → 통상 「30일」을 한도로 한다.\n     (부품 조달 지연 등 부득이한 사정이\n      증명되면 연장할 수 있다)\n\n「② 수리가 불가능한 경우(전손)」\n   「10일」\n   → 대체 차량을 구하는 데 드는\n     통상의 기간이다.\n\n · 피해자가 「수리를 부당하게 지연」한\n   기간은 인정하지 않는다.</span>\n\n<h4>Ⅱ. 영업수익 계산 시 징구하여야 할 증명자료</h4>\n<span class=\"tb\">「① 사업의 실체를 확인하는 서류」\n   · 「사업자등록증」 사본\n   · 「자동차등록증」(용도가 「영업용」인지)\n   · 「운송사업 허가증·등록증」\n   · 조합·협회 가입증명서\n\n「② 수입금액을 확인하는 서류」\n   · 「부가가치세 과세표준증명원」\n     또는 「부가가치세 신고서」\n   · 「소득금액증명원」\n     (종합소득세 과세표준확정신고서)\n   · 「매출장부·매출집계표」\n   · 「세금계산서·계산서·거래명세서」\n   · 「운송계약서·용역계약서」\n   · 「신용카드 매출전표·현금영수증 내역」\n   · 「금융거래내역서(입금통장 사본)」\n\n「③ 운행 실적을 확인하는 서류」\n   · 「운행일지·배차일지」\n   · 「운행기록계(타코그래프) 기록」\n   · 「하이패스 통행내역」\n   · 「유류 구매내역(주유카드 사용내역)」\n\n「④ 비용을 확인하는 서류」\n   · 「손익계산서·재무제표」\n   · 「비용 관련 영수증·세금계산서」\n\n ※ 서류가 없거나 신빙성이 없으면\n   「증명자료가 없는 경우」로 보아,\n   「동급 차량의 1일 평균 영업수익」에서\n   운행경비를 뺀 금액으로 산정한다.</span>\n\n<h4>Ⅲ. 1일 운행경비의 세부항목</h4>\n\n<h4>1. 차감하는 항목 — 「변동비」</h4>\n<span class=\"tb\">차를 굴려야 비로소 나가는 돈이다.\n\n ① 「연료비(유류비)」        ← 가장 큰 항목\n ② 「윤활유비(엔진오일 등)」\n ③ 「타이어비」 (주행거리에 따른 마모분)\n ④ 「정비비·수리비」 (주행에 따른 소모성 정비)\n ⑤ 「운전기사 인건비」\n    (고용한 운전기사가 있고, 휴차기간 중\n     실제로 지급을 면한 경우에 한한다)\n ⑥ 「고속도로 통행료」\n ⑦ 「주차료·차고비」 (운행에 따라 드는 것)\n ⑧ 「세차비」\n ⑨ 「기타 잡비」 (식대·통신비 중 운행 관련분)</span>\n\n<h4>2. 차감하지 않는 항목 — 「고정비」</h4>\n<span class=\"tb\">차를 세워 두어도 그대로 나가는 돈이므로\n「절약되지 않는다」. 따라서 「빼지 않는다」.\n\n · 「감가상각비」\n · 「보험료」\n · 「자동차세·면허세 등 제세공과금」\n · 「차고지 임차료」(고정계약분)\n · 「지입료·관리비」\n · 「사업장 임차료·관리직 인건비」\n · 「금융비용(할부이자·리스료)」\n\n ※ 이것이 실무에서 가장 자주 다투어진다.\n   보험사가 고정비까지 운행경비에 넣어\n   차감하면 휴차료가 부당하게 줄어든다.\n\n ※ 「본인이 직접 운전하는 개인사업자」의\n   경우, 운전기사 인건비는 애초에 지출이\n   없으므로 차감하지 않는다.\n   (자기의 노무는 「영업수익」에 이미\n    녹아 있다)</span>\n\n<h4>Ⅳ. 계산의 예</h4>\n<span class=\"tb\">［가정］\n  개인 화물운송사업자\n  최근 1년 영업수익        7,200만원\n  실제 운행일수              240일\n  연간 연료비              2,400만원\n  연간 통행료·주차비         480만원\n  연간 타이어·소모품비       240만원\n  (감가상각비 600만, 보험료 200만,\n   자동차세 50만은 「고정비」)\n  수리기간                    20일\n\n［1일 영업수익］\n  72,000,000 ÷ 240일 = 「300,000원」\n\n［1일 운행경비］\n  (24,000,000 + 4,800,000 + 2,400,000)\n   ÷ 240일\n  = 31,200,000 ÷ 240 = 「130,000원」\n\n［1일 휴차료］\n  300,000 − 130,000 = 「170,000원」\n\n［휴차료］\n  170,000 × 20일 = 「3,400,000원」\n\n  ※ 고정비(감가상각비·보험료·자동차세)를\n    운행경비에 넣었다면 1일 휴차료가\n    170,000 → 134,000원으로 줄어\n    약 72만원을 덜 받게 된다.</span>\n", "keys": ["휴차료 = (1일 영업수익 − 1일 운행경비) × 휴차기간", "1일 영업수익 = 총 영업수익 ÷ 실제 운행일수", "휴차기간 — 수리 가능 시 수리소요기간(30일 한도), 전손 시 10일", "증명자료 — 사업자등록증·부가세 과세표준증명원·소득금액증명원·매출장부·세금계산서·운행일지·금융거래내역", "운행경비(변동비) — 연료비·윤활유비·타이어비·정비비·운전기사 인건비·통행료·주차료·세차비", "감가상각비·보험료·자동차세 등 고정비는 차감하지 않음", "본인이 운전하는 개인사업자는 인건비를 차감하지 않음"], "law": ["자동차보험 표준약관 대물배상 지급기준(휴차료)", "민법 제393조(손해배상의 범위)"]}}, {"no": 5, "body": "자기차량손해(차량 단독사고 보장 특별약관 포함)에서 보상범위와 보상\n한도에 대하여 설명하고, 보상하지 않는 손해에 대해 열거한 후 주정차 중\n타이어에 생긴 손해에서 보상하는 경우를 서술하시오.(15점)", "sub": [15], "points": 15, "a": {"plan": "자기차량손해는 「다른 자동차와의 충돌이 있어야 보통약관, 없으면 특약」이라는 갈림길이 핵심이다. 보상한도는 보험가액·자기부담금·전손 시 대체비용의 셋으로 정리하고, 마지막에 타이어 면책의 네 가지 예외를 짚는다.", "ans": "\n<h4>Ⅰ. 보상범위</h4>\n\n<h4>1. 자기차량손해의 성격</h4>\n<span class=\"tb\">「자기차량손해」는 피보험자가 피보험자동차를\n소유·사용·관리하는 동안에 생긴\n「피보험자동차 자체의 「직접손해」」를\n보상하는 「재물보험」이다.\n\n · 상대방에 대한 배상책임이 아니라\n   「내 차의 손해」를 메우는 담보이다.\n · 「간접손해(휴차료·대차료·격락손해)」는\n   담보하지 않는다.\n · 「통상의 마모」로 인한 손해는 제외한다.</span>\n\n<h4>2. 보통약관이 보상하는 손해</h4>\n<span class=\"tb\">「① 「다른 자동차와의 충돌 또는 접촉」으로\n   인한 손해」\n   ← 이것이 보통약관의 원칙적인 담보이다.\n   · 「다른 자동차」에는 피보험자동차 외의\n     모든 자동차가 포함되며, 「이륜차·\n     원동기장치자전거·건설기계」도 들어간다.\n\n「② 「화재·폭발·낙뢰」로 인한 손해」\n\n「③ 「날아온 물체 또는 떨어지는 물체」로\n   인한 손해」\n   (낙석, 공사현장의 낙하물, 우박 등)\n\n「④ 「풍력에 의해 다른 물체가 날아오거나\n   떨어져」 생긴 손해」\n\n「⑤ 「홍수·범람·해일 등에 의한 「침수」」\n   · 「창문·선루프를 열어 둔 채」 주차하여\n     생긴 침수는 보상하지 않는다.\n\n「⑥ 「도난」으로 인한 손해」\n   · 「경찰관서에 신고한 후 「30일이 지나도」\n     발견되지 아니한 때」에 전손으로 보아\n     보험금을 지급한다.\n   · 다만 「부분품·부속품·부속기계장치만의」\n     도난은 보상하지 않는다.</span>\n\n<h4>3. 「차량단독사고 보장 특별약관」</h4>\n<span class=\"tb\">보통약관은 「다른 자동차와의 충돌·접촉」이\n없는 사고를 담보하지 않는다.\n그 빈틈을 메우는 것이 이 특약이다.\n\n「① 「차량단독사고」」\n   다른 자동차와 부딪히지 않고 혼자\n   일으킨 사고\n   · 「전복·추락·도로 이탈」\n   · 「전신주·가로수·가드레일·건물·연석」\n     등 「자동차가 아닌 물체」와의 충돌\n   · 운전자의 조작 실수로 인한 자기 파손\n\n「② 「가해자 불명 사고」」\n   · 주차 중 누군가 긁고 갔는데\n     「가해자를 알 수 없는」 경우\n   · 뺑소니 사고\n\n 왜 특약으로 뺐는가\n  단독사고와 가해자 불명 사고는\n  「사고 경위를 검증하기 어렵고」\n  도덕적 위험이 크기 때문이다.\n  → 가입 여부를 계약자가 선택하게 하고\n    보험료를 따로 받는다.\n\n ※ 이 특약에 가입하지 않으면\n   「내가 혼자 낸 사고」는 자기차량손해에서\n   한 푼도 받지 못한다.</span>\n\n<h4>Ⅱ. 보상한도</h4>\n<span class=\"tb\">「① 원칙 — 「보험가액」을 한도로 한다」\n   · 「분손」 (수리비 < 보험가액)\n       → 「실제 수리비」를 지급\n   · 「전손」 (수리비 ≥ 보험가액,\n              또는 수리 불가능)\n       → 「보험가액」을 한도로 지급하고\n         「잔존물 가액」을 공제하거나\n         잔존물을 인수한다.\n\n「② 「자기부담금」」\n   「손해액의 20%」를 원칙으로 하되,\n   계약자가 정한 「최저 자기부담금\n   (통상 20만원)과 최고 자기부담금\n   (통상 50만원)」의 범위에서 공제한다.\n   (물적사고 할증기준금액과 연동)\n\n「③ 「전손 시의 대체비용」」\n   전손으로 보험금을 지급하는 경우,\n   피보험자가 새 차를 사는 데 드는\n   「취득세·등록세 등」을 「보험가액과\n   별도로」 지급한다.\n   (보험가액의 일정 비율을 한도로)\n\n「④ 「부분품 등의 수리비 한도」」\n   부분품을 「교환」한 경우 그 교환비용은\n   수리비에 포함하되, 「중고부품으로\n   수리 가능한 경우」에는 그 기준을 따른다.\n\n「⑤ 「보험가액과 보험가입금액」」\n   자기차량손해의 보험가입금액은\n   「보험개발원이 정한 차량기준가액」에\n   따르며, 보험가액이 보험가입금액보다\n   크면 「일부보험」이 되어 비례보상한다.</span>\n\n<h4>Ⅲ. 보상하지 않는 손해</h4>\n<span class=\"tb\">「① 「보험계약자·피보험자(법인은 그 이사\n   또는 업무집행기관)의 「고의」」로 인한 손해\n\n ② 「전쟁·혁명·내란·사변·폭동·소요·\n   노동쟁의」로 인한 손해\n\n ③ 「지진·분화」로 인한 손해\n   (태풍·홍수·해일에 의한 침수는 담보)\n\n ④ 「핵연료물질」의 방사성·폭발성에 의한 손해\n\n ⑤ 「흠·마멸·부식·녹」, 그 밖에\n   「자연소모」로 인한 손해\n\n ⑥ 「부분품·부속품·부속기계장치만의 「도난」」\n   으로 생긴 손해\n\n ⑦ 「사기 또는 횡령」으로 인한 손해\n   (도난과 달리 「점유를 스스로 넘긴」\n    경우이므로 제외된다)\n\n ⑧ 「국가·공공단체의 공권력 행사」에 의한\n   압류·징발·몰수·파괴\n   (다만 「소방 또는 피난에 필요한 조치」로\n    생긴 손해는 보상한다)\n\n ⑨ 「무면허운전·음주운전·마약약물운전」\n   중에 생긴 손해\n\n ⑩ 「시험용·경기용 또는 경기를 위한\n   연습용」으로 사용하던 중 생긴 손해\n\n ⑪ 「영리를 목적으로 요금이나 대가를 받고\n   반복적으로 사용」하던 중 생긴 손해\n   (유상운송)\n\n ⑫ 「자동차 취급업자」가 업무상 수탁받은\n   피보험자동차에 생긴 손해\n   (정비·주차·세차·판매업자 등\n    → 그들의 「자동차취급업자 종합보험」의\n      영역이다)\n\n ⑬ 「타이어나 튜브에만 생긴 손해」\n   (아래 Ⅳ. 참조)\n\n ⑭ 「기계장치의 결함·고장」으로 인한 손해\n   (사고와 관계없는 자연고장)」</span>\n\n<h4>Ⅳ. 주정차 중 타이어에 생긴 손해 — 보상하는 경우</h4>\n\n<h4>1. 원칙 — 면책</h4>\n<span class=\"tb\">「피보험자동차에 장착되어 있는 「타이어나\n 튜브에만」 생긴 손해는 보상하지 않습니다.」\n\n 왜 면책하는가\n  · 타이어는 「소모품」이고 마모와 사고의\n    구별이 어렵다.\n  · 주차 중 펑크는 「자연적인 공기 빠짐·\n    노후·이물질 관통」과 「제3자의 행위」를\n    가리기가 사실상 불가능하다.\n  · 소액·다발성 청구로 보험제도의 운영이\n    어려워진다.\n\n ※ 「타이어에만」 생긴 손해가 면책이다.\n   차체가 함께 손상되었다면 타이어까지\n   함께 보상한다.</span>\n\n<h4>2. 보상하는 경우 — 네 가지 예외</h4>\n<span class=\"tb\">「① 「다른 자동차와의 충돌·접촉」으로\n   타이어가 손상된 경우」\n   주차 중 다른 차가 들이받아 타이어가\n   찢어진 경우 등\n\n「② 「화재 또는 산사태」로 인한 경우」\n   불에 타거나 토사에 깔려 손상된 경우\n\n「③ 「피보험자동차 「전체」가 도난당한」 경우」\n   차를 통째로 도둑맞았다면 타이어도\n   함께 보상한다.\n   (타이어만 떼어 간 경우는 ⑥의\n    부분품 도난으로 면책)\n\n「④ 「가해자가 확정된」 사고로 인한 경우」\n   주정차 중이라도 「누가 그랬는지가\n   밝혀진」 경우, 곧 CCTV·목격자·자백 등으로\n   제3자의 「고의 또는 과실」에 의한\n   가해행위임이 확인된 때에는 보상한다.\n   (예: 누군가 흉기로 타이어를 찢은 것이\n    영상으로 확인된 경우)\n\n  → 요컨대 「타이어 손상이 「외부의 사고」에\n    기인한 것임이 밝혀지면」 보상하고,\n    「원인을 알 수 없는 단순한 펑크」는\n    보상하지 않는다.\n    「가해자가 확정되었는가」가 실무의\n    갈림길이다.</span>\n", "keys": ["보통약관은 다른 자동차와의 충돌·접촉이 원칙, 화재·폭발·낙뢰·낙하물·침수·도난 포함", "차량단독사고 보장 특별약관 — 단독사고와 가해자 불명 사고", "보상한도는 보험가액, 자기부담금 손해액의 20%(20만~50만원)", "전손 시 취득세·등록세 등 대체비용 별도 지급", "면책 — 고의·전쟁·지진분화·자연소모·부분품만의 도난·사기횡령·무면허음주·유상운송·자동차취급업자", "타이어만의 손해는 원칙 면책", "예외 — 다른 자동차와의 충돌·접촉, 화재·산사태, 차량 전체 도난, 가해자가 확정된 사고"], "law": ["자동차보험 표준약관 자기차량손해(보상하는 손해·보상하지 않는 손해·지급보험금의 계산)", "차량단독사고 보장 특별약관", "상법 제659조·제678조"]}}, {"no": 6, "body": "표준작업시간의 구성에 대하여 설명하고, 공임률의 정의와 공임 총원가의\n구성요소에 대하여 약술하시오.(10점)", "sub": [10], "points": 10, "a": {"plan": "표준작업시간은 「주작업 + 부대작업 + 여유」의 세 겹이고, 공임률은 「총원가 ÷ 유효작업시간」이라는 나눗셈 한 줄이다. 총원가는 인건비·경비·일반관리비·적정이윤의 네 덩어리로 갈라 적는다.", "ans": "\n<h4>Ⅰ. 표준작업시간의 구성</h4>\n\n<h4>1. 뜻</h4>\n<span class=\"tb\">「표준작업시간」이란\n「보통의 숙련도를 가진 정비기술자」가\n「정상적인 설비·공구·작업조건」 아래에서\n「일정한 정비작업」을 수행하는 데\n「통상 걸리는 시간」을 말한다.\n\n · 수리비 견적의 「공임」은\n     「표준작업시간 × 공임률」\n   로 산출된다.\n · 그러므로 표준작업시간은 수리비 산정의\n   「양(量)」에 해당하고, 공임률은\n   「단가(價)」에 해당한다.\n · 자동차제작사·정비업계·보험업계가\n   「작업연구(시간연구·동작연구)」를 통하여\n   정하고, 「정비시간(작업지수)」 자료로\n   공표한다.</span>\n\n<h4>2. 구성 — 세 겹</h4>\n<span class=\"tb\">「① 「주작업시간」 (정미작업시간, Net Time)」\n  작업의 목적을 「직접」 달성하는 데\n  걸리는 시간\n\n  · 부품의 「탈거·부착」\n  · 부품의 「교환」\n  · 판금·수정·용접\n  · 도장(연마 → 퍼티 → 프라이머 → 상도)\n  · 조정·측정\n\n「② 「부대작업시간」 (준비·정리 작업시간)」\n  주작업에 「반드시 따라붙는」 작업\n\n  · 공구·장비·부품의 준비와 정리\n  · 차량의 「입출고 이동」, 리프트 승강\n  · 「보호커버 씌우기」, 양생·마스킹\n  · 세차·세척, 작업 전후의 점검\n  · 작업지시서 작성, 사진 촬영\n\n「③ 「여유시간」 (Allowance)」\n  사람이 하는 일이므로 반드시 생기는 시간\n\n  가. 「작업 여유」\n      공구 교체, 기계 조정, 재료 대기\n  나. 「직장(관리) 여유」\n      작업지시 수령, 자재 청구, 보고,\n      조회·정리정돈\n  다. 「생리 여유」\n      용변, 물 마시기, 땀 닦기\n  라. 「피로 여유」\n      중량물 취급·부자연스러운 자세에서\n      오는 피로를 풀기 위한 휴식</span>\n\n<h4>3. 산식</h4>\n<span class=\"tb\">「표준작업시간\n  = (주작업시간 + 부대작업시간)\n    × (1 + 「여유율」)」\n\n  또는\n\n「표준작업시간\n  = 정미작업시간 ÷ (1 − 여유율)」\n\n  · 여유율은 작업의 성질에 따라\n    통상 「15~25%」 수준으로 정한다.\n  · 「도장작업」은 건조 대기시간이 있어\n    별도의 기준을 둔다.</span>\n\n<h4>Ⅱ. 공임률</h4>\n\n<h4>1. 정의</h4>\n<span class=\"tb\">「공임률(시간당 공임, Labour Rate)」이란\n정비사업자가 「정비작업 1시간」에 대하여\n청구하는 금액을 말한다.\n\n              「공임 총원가」\n 공임률 = ──────────────────────\n           「연간 총 유효작업시간」\n\n · 「유효작업시간」이란 실제로 매출을 일으킬\n   수 있는 작업시간을 말하며,\n     연간 총 근로시간 × 「가동률」\n   로 산출한다.\n   (휴가·교육·대기·비작업시간을 뺀 시간)\n\n · 자동차관리법 제58조의4에 따라\n   정비사업자는 「시간당 공임과 표준정비시간」을\n   「공개(게시)」하여야 하고,\n   국토교통부는 「적정 정비요금」을 조사·\n   공표한다.</span>\n\n<h4>2. 공임 총원가의 구성요소</h4>\n<span class=\"tb\">「① 「인건비」」\n  · 정비기술자의 「기본급·수당·상여금」\n  · 「퇴직급여충당금」\n  · 「4대보험 사업주 부담금」\n  · 「복리후생비」 (식대·피복비·건강검진)\n  · 보조인력의 인건비\n\n「② 「경비」」\n  · 「감가상각비」\n      정비공장 건물, 리프트·얼라인먼트·\n      도장부스·스캐너 등 정비기기,\n      특수공구\n  · 「임차료」 (토지·건물)\n  · 「수도광열비·전력비·연료비」\n  · 「소모품비」\n      연마재·세척제·마스킹테이프·걸레·\n      장갑 등 「직접재료로 잡지 않는 부자재」\n  · 「수선유지비」 (설비의 보수)\n  · 「보험료」 (화재보험, 자동차취급업자\n      종합보험, 산재보험)\n  · 「제세공과금」 (재산세, 환경부담금 등)\n  · 「폐기물 처리비」 (폐유·폐타이어·\n      도장 폐기물)\n  · 「교육훈련비」 (신차·전기차 정비교육)\n  · 「검사·인증비」\n\n「③ 「일반관리비」」\n  · 관리·사무직 인건비\n  · 사무용품비·통신비·광고선전비\n  · 대손상각비\n  · 통상
