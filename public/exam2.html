 = 130이 되어 틀린다.\n<b>손상차손환입으로 장부금액이 손상되지 않았을 경우를 넘을 수 없다</b>는 것이\nK-IFRS 제1036호의 핵심 제약이다.</p>\n\n<h3>(2) 원가모형과 재평가모형의 20×4년 말 자본총액 차이 (5점)</h3>\n\n<h4>Ⅰ. 원가모형을 계속 적용한 경우</h4>\n<span class=\"tb\">20×2년 말 장부금액                       400\n잔존내용연수 4년  →  연 감가상각비      100\n\n20×3년 감가상각                        - 100  →  300\n  손상검사  회수가능액 Max[500-50=450, 400] = 450 > 300\n            →  손상 없음 (환입할 손상도 남아 있지 않다)\n\n20×4년 감가상각                        - 100  →  200\n\n20×4년 말 처분   현금 600 - 장부금액 200\n                                        =  처분이익 400</span>\n<span class=\"tb\">자본에 미친 누적 영향 (20×1 ~ 20×4)\n\n  감가상각비   -(100 + 80 + 100 + 100)  = -380\n  손상차손                              = -100\n  손상차손환입                          = + 80\n  처분이익                              = +400\n  ──────────────────────────────────────────\n  합계                                  =    0</span>\n\n<h4>Ⅱ. 20×3년부터 재평가모형을 적용한 경우</h4>\n<span class=\"tb\">20×3년\n  감가상각   400 ÷ 4년 = 100           →  장부금액 300\n  재평가     공정가치 500\n             재평가잉여금(기타포괄손익)  +200\n             →  장부금액 500\n\n20×4년\n  감가상각   500 ÷ 3년 ≒ 166.7         →  장부금액 333.3\n  처분       현금 600 - 333.3          =  처분이익 266.7\n\n  ※ 처분 전에 20×4년 말 공정가치 600으로 재평가한 뒤 처분하여도\n    (재평가잉여금 +266.7, 처분손익 0) 결과는 같다.</span>\n<span class=\"tb\">자본에 미친 누적 영향 (20×1 ~ 20×4)\n\n  감가상각비   -(100 + 80 + 100 + 166.7) = -446.7\n  손상차손                                = -100\n  손상차손환입                            = + 80\n  재평가잉여금(기타포괄손익)              = +200\n  처분이익                                = +266.7\n  ────────────────────────────────────────────\n  합계                                    =     0</span>\n\n<h4>Ⅲ. 답 — 차이는 ￦0이다</h4>\n<span class=\"tb\">원가모형   자본 누적 영향  0\n재평가모형 자본 누적 영향  0\n──────────────────────────\n자본총액의 차이            0</span>\n\n<h4>Ⅳ. 왜 반드시 0이 되는가</h4>\n<p>계산을 하지 않고도 알 수 있다.</p>\n<span class=\"tb\">건물을 「600에 사서 600에 팔았다」.\n\n  자산이 들어오고 나가는 전 과정을 통틀어\n  기업의 순자산에 남는 몫은 0이다.\n\n  · 원가모형이든 재평가모형이든\n    「자본에 들어오는 총액」은 같다.\n  · 다를 수 있는 것은 「어느 해에」, 「어느 계정으로」\n    자본에 반영되는가일 뿐이다.</span>\n<span class=\"tb\">재평가모형이 바꾸는 것\n\n  · 이익잉여금은 「감가상각비가 커진 만큼」 줄어들고\n  · 재평가잉여금(기타포괄손익누계액)은 「그만큼」 늘어난다\n  → 자본 안에서 자리만 옮길 뿐 「총액」은 그대로이다\n\n  처분 시 재평가잉여금을 이익잉여금으로 대체하더라도\n  역시 자본 안의 이동이므로 총액은 변하지 않는다.</span>\n<p>따라서 <b>자산을 처분하여 한 사이클이 끝난 시점</b>에서는\n<b>두 모형의 자본총액이 반드시 일치</b>한다.</p>\n<p>다만 <b>보유 중인 기간</b>에는 자본총액이 달라진다.\n재평가모형은 <b>공정가치의 증가분을 자본에 얹어 놓기</b> 때문이다.\n이 문제가 <b>처분 시점</b>을 잡아 물은 이유가 여기에 있다.</p>\n", "keys": ["회수가능액 Max(순공정가치, 사용가치)", "20×1년 손상차손 100", "손상 후 잔존내용연수로 재계산", "20×2년 감가상각 80", "환입한도", "손상되지 않았을 경우의 장부금액 400", "손상차손환입 80", "재평가잉여금 기타포괄손익", "600에 사서 600에 팔았다", "자본총액 차이 0", "자본 내 계정 간 이동"], "law": ["K-IFRS 제1016호 유형자산", "K-IFRS 제1036호 자산손상"]}}, {"no": 5, "body": "(주)한국은 20×1년 7월 1일 고객과 다음의 계약을 체결하였으며, 계약 체결\n즉시 전액 현금으로 수취하였다.\n- 제품 A 1대 인도, 제품 B 1대 인도, 유지보수서비스(2년) 제공\n- 총 계약금액 ￦14,400\n각 수행의무의 개별판매가격은 다음과 같다.\n수행의무 개별판매가격\n제품 A ￦8,000\n제품 B ￦3,000\n유지보수서비스(2년) ￦4,000\n제품 A와 제품 B는 계약일에 고객에게 인도되었으며, 유지보수서비스는\n2년 동안 균등하게 제공된다고 할 때, (주)한국이 인식할 20×1년도 유지보수\n서비스 수익은? (5점)", "sub": [5], "points": 5, "a": {"plan": "개별판매가격 비율로 거래가격을 나눈 뒤, 기간에 걸쳐 이행하는 수행의무만 경과기간만큼 잘라 낸다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">20×1. 7. 1.  계약 체결, 총 계약금액 ￦14,400 전액 현금 수취\n\n수행의무            개별판매가격\n  제품 A               ￦8,000     계약일에 인도\n  제품 B               ￦3,000     계약일에 인도\n  유지보수서비스(2년)  ￦4,000     2년 동안 균등 제공\n  ────────────────────────────\n  합계                ￦15,000</span>\n\n<h4>Ⅰ. 1단계 — 수행의무의 식별</h4>\n<p>제품 A, 제품 B, 유지보수서비스는 각각\n<b>구별되는(distinct) 재화나 용역</b>이므로\n<b>세 개의 수행의무</b>로 식별한다.</p>\n\n<h4>Ⅱ. 2단계 — 거래가격의 배분</h4>\n<p>K-IFRS 제1115호는\n<b>“거래가격을 <u>개별 판매가격에 비례하여</u> 각 수행의무에 배분한다”</b>고 정한다.</p>\n<span class=\"tb\">개별판매가격 합계        15,000\n거래가격                 14,400\n                         ─────────\n할인율                   14,400 ÷ 15,000 = 0.96  (4% 할인)\n\n제품 A            8,000 × 0.96  =  7,680\n제품 B            3,000 × 0.96  =  2,880\n유지보수서비스    4,000 × 0.96  =  3,840\n──────────────────────────────────────\n합계                             14,400</span>\n<p>거래가격 14,400이 개별판매가격 합계 15,000보다 작으므로\n<b>600의 할인</b>이 있는 셈인데,\n이 할인은 <b>세 수행의무에 비례하여 나누어진다</b>.</p>\n\n<h4>Ⅲ. 3단계 — 수익의 인식 시점</h4>\n<span class=\"tb\">제품 A · 제품 B\n  「한 시점에」 이행하는 수행의무\n  통제가 이전되는 계약일(20×1. 7. 1.)에 전액 수익 인식\n    7,680 + 2,880 = 10,560\n\n유지보수서비스\n  「기간에 걸쳐」 이행하는 수행의무\n  고객이 기업의 수행에서 생기는 효익을 「동시에 얻고 소비」한다\n  2년 동안 「균등하게」 제공되므로 시간의 경과에 따라 인식한다</span>\n\n<h4>Ⅳ. 20×1년도 유지보수서비스 수익</h4>\n<span class=\"tb\">배분된 거래가격                    3,840\n\n경과기간\n  20×1. 7. 1. ~ 20×1. 12. 31.  =  6개월\n  총 제공기간                   = 24개월\n\n3,840 × (6개월 ÷ 24개월)\n= 3,840 × 1/4\n= 960</span>\n\n<h4>답 : ￦960</h4>\n\n<h4>Ⅴ. 참고 — 계약 전체의 회계처리</h4>\n<span class=\"tb\">20×1. 7. 1.  계약 체결 및 현금 수취\n\n  (차) 현금            14,400\n      (대) 매출(제품 A)          7,680\n          매출(제품 B)          2,880\n          계약부채              3,840\n\n20×1. 12. 31.  6개월분 용역 제공\n\n  (차) 계약부채           960\n      (대) 용역매출                960\n\n20×1년 말 계약부채 잔액  3,840 - 960 = 2,880\n  (20×2년 1,920 + 20×3년 960으로 각각 수익 인식)</span>\n\n<h4>Ⅵ. 흔한 실수</h4>\n<span class=\"tb\">① 배분을 하지 않고 개별판매가격 4,000을 그대로 쓰는 것\n   → 4,000 × 6/24 = 1,000 (오답)\n   거래가격이 개별판매가격 합계보다 작으므로 반드시 배분한다\n\n② 경과기간을 1년으로 잡는 것\n   → 7월 1일 계약이므로 20×1년은 「6개월」이다\n\n③ 대금을 전액 미리 받았다고 하여 전액을 수익으로 잡는 것\n   → 현금의 수취와 수익의 인식은 다르다.\n     아직 이행하지 않은 부분은 「계약부채」이다</span>\n", "keys": ["K-IFRS 제1115호", "수행의무의 식별", "개별 판매가격에 비례하여 배분", "14,400 ÷ 15,000 = 0.96", "3,840", "한 시점에 이행", "기간에 걸쳐 이행", "6개월 ÷ 24개월", "960", "계약부채"], "law": ["K-IFRS 제1115호 고객과의 계약에서 생기는 수익"]}}, {"no": 6, "body": "다음은 (주)한국의 20×1년과 20×2년 재무상태표의 일부이다.\n구분 20×1년 말 20×2년 말\n현금및현금성자산 ￦70,000 ￦30,000\n매출채권 ￦30,000 ￦70,000\n재고자산 ￦100,000 ￦200,000\n비유동자산 ￦200,000 ￦100,000\n유동부채 ￦50,000 ￦200,000\n비유동부채 ￦200,000 ￦50,000\n자본금 ￦100,000 ￦100,000\n··· ··· ···\n(주)한국의 20×2년도의 총자산회전율과 재고자산회전율은 각각 2회와 4회일\n경우 당기순이익은? (5점)", "sub": [5], "points": 5, "a": {"plan": "회전율 두 개로 매출액과 매출원가를 뽑아 매출총이익을 만든다. 평균잔액을 쓰는 것을 잊지 않는다.", "ans": "\n<h4>0. 자료의 정리</h4>\n<span class=\"tb\">구분                  20×1년 말     20×2년 말\n\n현금및현금성자산       ￦70,000      ￦30,000\n매출채권               ￦30,000      ￦70,000\n재고자산              ￦100,000     ￦200,000\n비유동자산            ￦200,000     ￦100,000\n──────────────────────────────────────────────\n총자산                ￦400,000     ￦400,000\n\n유동부채               ￦50,000     ￦200,000\n비유동부채            ￦200,000      ￦50,000\n──────────────────────────────────────────────\n총부채                ￦250,000     ￦250,000\n\n자본금                ￦100,000     ￦100,000</span>\n\n<h4>Ⅰ. 1단계 — 총자산회전율로 매출액을 구한다</h4>\n<span class=\"tb\">                    매출액\n총자산회전율 = ───────────────  = 2회\n                  평균총자산\n\n평균총자산 = (400,000 + 400,000) ÷ 2 = 400,000\n\n매출액 = 2 × 400,000 = 800,000</span>\n\n<h4>Ⅱ. 2단계 — 재고자산회전율로 매출원가를 구한다</h4>\n<span class=\"tb\">                      매출원가\n재고자산회전율 = ─────────────────  = 4회\n                    평균재고자산\n\n평균재고자산 = (100,000 + 200,000) ÷ 2 = 150,000\n\n매출원가 = 4 × 150,000 = 600,000</span>\n<p><b>재고자산회전율의 분자는 매출원가</b>이다.\n매출액을 쓰면 안 된다.\n재고자산이 <b>원가</b>로 기록되어 있으므로\n<b>분자와 분모의 측정기준을 맞춘 것</b>이다.</p>\n\n<h4>Ⅲ. 3단계 — 매출총이익</h4>\n<span class=\"tb\">매출액                 800,000\n매출원가             - 600,000\n──────────────────────────────\n매출총이익             200,000</span>\n\n<h4>답 : ￦200,000</h4>\n<p>문제가 준 자료로 확인할 수 있는 손익은\n<b>매출총이익까지</b>이다.\n판매비와관리비·금융원가·법인세 등에 관한 자료가 없으므로\n<b>그 밖의 손익이 없다는 전제</b>에서 당기순이익은 200,000이 된다.</p>\n\n<h4>Ⅳ. 재무상태표와의 정합성 — 함께 짚어 둘 것</h4>\n<span class=\"tb\">20×1년 말 자본  400,000 - 250,000 = 150,000\n20×2년 말 자본  400,000 - 250,000 = 150,000\n                                    ─────────\n자본의 변동                              0</span>\n<p>당기순이익이 200,000인데 <b>자본총액이 그대로</b>라면,\n그해에 <b>배당이나 자기주식 취득 등 자본거래로 200,000이 유출</b>되었다는 뜻이다.\n재무상태표에 <b>‘···’</b>로 생략된 항목들이 있으므로\n그 안에서 조정된 것으로 보면 된다.</p>\n\n<h4>Ⅴ. 참고 — 이 재무상태표가 보여 주는 것</h4>\n<span class=\"tb\">유동비율\n  20×1년  (70,000 + 30,000 + 100,000) ÷ 50,000  = 400%\n  20×2년  (30,000 + 70,000 + 200,000) ÷ 200,000 = 150%\n\n당좌비율\n  20×1년  (70,000 + 30,000) ÷  1,503     96,528\n\n  20×1  93,659 × 10% = 9,365.9  →  9,366\n  20×2  95,025 × 10% = 9,502.5  →  9,503</span>\n\n<h3>(1) 20×2년 말 사채의 순장부금액 (5점)</h3>\n<span class=\"tb\">조기상환 「전」 사채의 장부금액                96,528\n\n액면금액의 50%를 상환하였으므로\n남은 사채(액면 50,000)의 장부금액\n\n  96,528 × 50%                              =  48,264</span>\n\n<h4>답 (1) : ￦48,264</h4>\n<p><b>“순장부금액”</b>은 <b>사채 액면금액에서 사채할인발행차금을 뺀 금액</b>을 말한다.</p>\n<span class=\"tb\">확인\n  사채(액면)          50,000\n  사채할인발행차금   -1,736   (= 50,000 - 48,264)\n  ────────────────────────\n  순장부금액          48,264</span>\n\n<h3>(2) 20×2년도 당기손익 (5점)</h3>\n\n<h4>Ⅰ. 이자비용</h4>\n<span class=\"tb\">상환은 「20×2년 말」에 이루어졌으므로\n20×2년 한 해 동안은 사채 전액이 존재하였다.\n\n이자비용  95,025 × 10%                       =   9,503  (비용)</span>\n\n<h4>Ⅱ. 사채상환손익</h4>\n<span class=\"tb\">지급한 현금                                    52,000\n그중 현금이자 부분\n  100,000 × 8% × 50%                        =   4,000\n──────────────────────────────────────────────────\n순수한 상환대가                                48,000\n\n상환한 사채의 장부금액\n  96,528 × 50%                              =  48,264\n\n사채상환손익  48,264 - 48,000               =     264  (이익)</span>\n<p><b>지급액 52,000에서 현금이자 4,000을 떼어 내는 것</b>이\n이 문제의 핵심이다.\n이자는 사채의 상환대가가 아니라 <b>그해의 이자비용</b>이기 때문이다.</p>\n<p>상환대가(48,000)가 장부금액(48,264)보다 <b>작으므로 이익</b>이다.\n싸게 갚았으니 이익이라는 뜻이다.</p>\n\n<h4>Ⅲ. 20×2년 당기손익</h4>\n<span class=\"tb\">이자비용                                    - 9,503\n사채상환이익                                +   264\n──────────────────────────────────────────────\n당기손익                                    - 9,239\n\n  →  「손실 ￦9,239」</span>\n\n<h4>답 (2) : 손실 ￦9,239</h4>\n\n<h4>Ⅳ. 20×2년 말 회계처리</h4>\n<span class=\"tb\">① 이자비용의 인식\n   (차) 이자비용            9,503\n       (대) 현금                   8,000\n           사채할인발행차금        1,503\n\n② 조기상환\n   (차) 사채(액면)         50,000\n       (대) 현금                  48,000\n           사채할인발행차금        1,736\n           사채상환이익              264</span>\n\n<h4>Ⅴ. 흔한 실수</h4>\n<span class=\"tb\">① 8%의 현가계수로 발행금액을 계산한다\n   → 8,000 × 3.3121 + 100,000 × 0.7350 = 100,000\n     (액면발행이 되어 버린다. 유효이자율로 할인해야 한다)\n\n② 52,000 전액을 상환대가로 본다\n   → 48,264 - 52,000 = 상환손실 3,736 (오답)\n\n③ 상환한 뒤라 하여 20×2년 이자비용을 절반만 잡는다\n   → 상환은 「기말」에 이루어졌으므로 한 해 치 전액이다</span>\n", "keys": ["유효이자율 10%로 할인", "8,000 × 3.1699", "100,000 × 0.6830", "발행금액 93,659", "할인발행", "20×1년 말 95,025", "20×2년 말 96,528", "50% 48,264", "순장부금액", "현금이자 4,000 분리", "순수 상환대가 48,000", "사채상환이익 264", "이자비용 9,503", "손실 9,239"], "law": ["K-IFRS 제1109호 금융상품", "K-IFRS 제1032호 금융상품 표시"]}}, {"no": 8, "body": "(주)한국은 20×1년 1월 1일에 주당 액면금액 ￦500인 주식 10,000주를 주당\n￦5,000에 발행하여 설립되었다. 20×1년도 중에 다음과 같은 거래가 있었다.\n- 2월 14일에 주식발행초과금 ￦1,000,000을 자본금으로 전입하였다.\n- 4월 14일에 자기주식 100주를 주당 ￦4,000에 취득하였다.\n- 5월 8일에 자기주식 50주를 주당 ￦5,500에 처분하였다.\n- 10월 31일에 자기주식 25주를 소각하였다.\n- 12월 31일에 재평가를 통하여 부동산의 장부금액이 ￦100,000 증가하였다.\n- 20×1년의 당기순이익은 ￦300,000이다.\n위의 거래로 인해 발생하는 (주)한국의 20×1년 기초대비 기말의 자본 증감액은?\n(증감을 (+)/(-)로 표시하시오.) (5점)", "sub": [5], "points": 5, "a": {"plan": "다섯 거래를 ‘자본총액이 움직이는가’ 하나로만 거른다. 자본 내 대체는 0이고, 자기주식과 손익·재평가만 남는다.", "ans": "\n<h4>0. 기초 자본</h4>\n<span class=\"tb\">20×1. 1. 1. 설립\n  10,000주 × 발행가 ￦5,000  =  ￦50,000,000\n\n  자본금        10,000주 × 액면 500  =   5,000,000\n  주식발행초과금                      =  45,000,000\n  ────────────────────────────────────────────\n  기초 자본총액                       =  50,000,000</span>\n\n<h4>Ⅰ. 거래별 자본총액에 미치는 영향</h4>\n\n<h4>① 2월 14일 — 주식발행초과금 ￦1,000,000을 자본금으로 전입</h4>\n<span class=\"tb\">(차) 주식발행초과금  1,000,000\n    (대) 자본금              1,000,000\n\n자본금은 늘고 주식발행초과금은 준다.\n「자본 안에서 자리만 옮긴 것」이다.\n\n자본총액에 미치는 영향                        ￦0</span>\n\n<h4>② 4월 14일 — 자기주식 100주를 주당 ￦4,000에 취득</h4>\n<span class=\"tb\">(차) 자기주식        400,000\n    (대) 현금                  400,000\n\n자기주식은 「자본의 차감항목」이다.\n\n자본총액에 미치는 영향                  △400,000</span>\n\n<h4>③ 5월 8일 — 자기주식 50주를 주당 ￦5,500에 처분</h4>\n<span class=\"tb\">처분금액   50주 × 5,500 = 275,000\n장부금액   50주 × 4,000 = 200,000\n자기주식처분이익             75,000  (자본잉여금)\n\n(차) 현금            275,000\n    (대) 자기주식              200,000\n        자기주식처분이익        75,000\n\n자본총액에 미치는 영향                 +275,000</span>\n<p><b>자기주식처분이익 75,000은 당기손익이 아니라 자본잉여금</b>이다.\n자기주식 거래는 <b>회사와 주주 사이의 자본거래</b>이므로\n손익을 발생시키지 않는다.\n자본총액에는 <b>들어온 현금 275,000</b>만큼 영향을 준다.</p>\n\n<h4>④ 10월 31일 — 자기주식 25주 소각</h4>\n<span class=\"tb\">소각한 자기주식의 장부금액  25주 × 4,000 = 100,000\n소각한 주식의 액면금액      25주 ×   500 =  12,500\n감자차손                                  =  87,500\n\n(차) 자본금            12,500\n    감자차손           87,500\n    (대) 자기주식             100,000\n\n자본금이 줄고 자기주식(차감항목)도 줄어든다.\n「자본 안에서 자리만 옮긴 것」이다.\n\n자본총액에 미치는 영향                        ￦0</span>\n\n<h4>⑤ 12월 31일 — 재평가로 부동산 장부금액 ￦100,000 증가</h4>\n<span class=\"tb\">(차) 부동산(유형자산)  100,000\n    (대) 재평가잉여금          100,000   (기타포괄손익)\n\n기타포괄손익도 「자본」이다.\n\n자본총액에 미치는 영향                 +100,000</span>\n\n<h4>⑥ 당기순이익 ￦300,000</h4>\n<span class=\"tb\">이익잉여금의 증가\n\n자본총액에 미치는 영향                 +300,000</span>\n\n<h4>Ⅱ. 자본 증감액의 합계</h4>\n<span class=\"tb\">① 주식발행초과금의 자본금 전입              ￦0\n② 자기주식 취득                       △400,000\n③ 자기주식 처분                       +275,000\n④ 자기주식 소각                             ￦0\n⑤ 재평가잉여금                        +100,000\n⑥ 당기순이익                          +300,000\n──────────────────────────────────────────────\n자본 증감액                            +275,000</span>\n\n<h4>답 : (+) ￦275,000</h4>\n\n<h4>Ⅲ. 검증 — 기말 자본을 직접 쌓아 보면</h4>\n<span class=\"tb\">자본금\n  5,000,000 + 1,000,000(전입) - 12,500(소각)   =  5,987,500\n\n주식발행초과금\n  45,000,000 - 1,000,000(전입)                 = 44,000,000\n\n자기주식처분이익                                =     75,000\n감자차손                                        △    87,500\n\n자기주식\n  △400,000 + 200,000(처분) + 100,000(소각)     △    100,000\n  (100주 - 50주 - 25주 = 25주 × 4,000)\n\n재평가잉여금                                    =    100,000\n이익잉여금(당기순이익)                          =    300,000\n──────────────────────────────────────────────────────\n기말 자본총액                                   = 50,275,000\n\n기초 자본총액                                   = 50,000,000\n──────────────────────────────────────────────────────\n증감액                                          = +  275,000  ○</span>\n\n<h4>Ⅳ. 한 줄로 기억하기</h4>\n<span class=\"tb\">자본총액을 움직이는 것\n  · 회사 「밖」과 돈이 오간 거래  (증자, 자기주식 취득·처분, 배당)\n  · 손익 (당기손익, 기타포괄손익)\n\n자본총액을 움직이지 않는 것\n  · 자본 「안」에서 계정끼리 옮기는 거래\n    (무상증자, 주식배당, 자본전입, 이익준비금 적립, 자기주식 소각)</span>\n", "keys": ["주식발행초과금 자본금 전입은 자본총액 불변", "자기주식은 자본의 차감항목", "△400,000", "자기주식처분이익은 자본잉여금", "+275,000", "자기주식 소각은 자본총액 불변", "감자차손", "재평가잉여금 기타포괄손익 +100,000", "당기순이익 +300,000", "자본 증감액 +275,000"], "law": ["K-IFRS 제1032호 금융상품 표시", "K-IFRS 제1001호 재무제표 표시", "상법 제341조·제343조"]}}, {"no": 9, "body": "(주)한국은 20×1년 초에 (주)대한이 발행한 아래와 같은 조건의 사채를 공정\n가치인 ￦95,196에 취득하였다. ㈜한국은 동 사채를 원리금의 수취와 매도할\n목적으로 취득하여 기타포괄손익-공정가치 측정 금융자산으로 분류하였다.\n- 액면금액: ￦100,000 - 표시이자율 및 지급일: 10% 매년 말 후급\n- 만기: 3년 .- 시장이자율: 12%\n동 사채의 20×1년 말과 20×2년 말의 공정가치는 각각 ￦94,000과\n￦101,000이며, 20×2년 말에 해당 사채를 공정가치로 전부 매각하였다.\n(1) 위 거래로 인해 (주)한국의 20×1년 포괄손익계산서에 당기손익으로 인식될\n금액은? (이익 또는 손실 여부를 표기하고 금액을 제시하시오.) (5점)\n(2) 위 거래로 인해 (주)한국의 20×2년 포괄손익계산서에 당기손익으로 인식될\n금액은? 단, (주)한국은 금융자산의 제거시점에 기인식한 기타포괄손익\n누계액을 당기손익으로 재분류조정한다. (이익 또는 손실 여부를 표기\n하고 금액을 제시하시오.) (5점)", "sub": [5, 5], "points": 10, "a": {"plan": "FVOCI 채무상품은 당기손익에 이자수익만 태우고 평가손익은 기타포괄손익에 쌓는다. 처분할 때 그 누계액을 당기손익으로 끌어내리는 것이 핵심이다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">20×1년 초  (주)대한 사채를 공정가치 ￦95,196에 취득\n           기타포괄손익-공정가치 측정 금융자산(FVOCI)으로 분류\n\n  액면금액      ￦100,000\n  표시이자율    10%  (매년 말 후급 → 연 ￦10,000)\n  만기          3년\n  시장이자율    12%\n\n공정가치   20×1년 말 ￦94,000 / 20×2년 말 ￦101,000\n           20×2년 말에 공정가치로 전부 매각</span>\n\n<h4>Ⅰ. FVOCI(채무상품)의 회계처리 구조</h4>\n<span class=\"tb\">① 이자수익\n   「상각후원가」에 유효이자율을 곱하여 「당기손익」으로 인식한다\n   → 상각후원가측정(AC) 금융자산과 「똑같이」 계산한다\n\n② 공정가치 평가손익\n   상각후원가와 공정가치의 차이를 「기타포괄손익」으로 인식한다\n\n③ 처분 시\n   기타포괄손익누계액을 「당기손익으로 재분류조정」한다\n   (지분상품과 달리 채무상품은 재분류조정을 한다)</span>\n<p>곧 <b>“이자수익은 상각후원가처럼, 재무상태표는 공정가치로,\n차액은 기타포괄손익에 담아 두었다가 팔 때 쏟아 낸다”</b>는 구조이다.</p>\n\n<h4>Ⅱ. 유효이자율법 상각표 (시장이자율 12%)</h4>\n<span class=\"tb\">연도   기초상각후원가   이자수익(12%)   현금이자   상각액   기말상각후원가\n\n20×1      95,196          11,424       10,000    1,424      96,620\n20×2      96,620          11,594       10,000    1,594      98,214\n\n  20×1  95,196 × 12% = 11,423.5  →  11,424\n  20×2  96,620 × 12% = 11,594.4  →  11,594</span>\n\n<h3>(1) 20×1년 포괄손익계산서에 당기손익으로 인식될 금액 (5점)</h3>\n<span class=\"tb\">이자수익                                  11,424  (이익)\n\n공정가치 평가\n  상각후원가                              96,620\n  공정가치                                94,000\n  ────────────────────────────────────────────\n  평가손실                                 2,620\n  →  「기타포괄손익」으로 인식한다\n     당기손익이 아니다</span>\n\n<h4>답 (1) : 이익 ￦11,424</h4>\n<span class=\"tb\">20×1년 회계처리\n\n① 취득\n   (차) FVOCI금융자산   95,196\n       (대) 현금               95,196\n\n② 이자수익\n   (차) 현금            10,000\n       FVOCI금융자산     1,424\n       (대) 이자수익            11,424\n\n③ 공정가치 평가\n   (차) 금융자산평가손실(OCI)  2,620\n       (대) FVOCI금융자산            2,620\n\n   20×1년 말 장부금액 = 94,000 (공정가치)\n   기타포괄손익누계액 = △2,620</span>\n\n<h3>(2) 20×2년 포괄손익계산서에 당기손익으로 인식될 금액 (5점)</h3>\n\n<h4>Ⅰ. 이자수익</h4>\n<span class=\"tb\">이자수익  96,620 × 12%                    =  11,594  (이익)</span>\n<p>이자수익은 <b>공정가치(94,000)가 아니라 상각후원가(96,620)</b>를 기준으로 계산한다.\n공정가치 평가는 <b>기타포괄손익에서만</b> 일어나고\n<b>이자수익 계산에는 영향을 주지 않는다</b>.</p>\n\n<h4>Ⅱ. 처분</h4>\n<span class=\"tb\">20×2년 말 상각후원가                        98,214\n20×2년 말 공정가치(= 매각금액)             101,000\n──────────────────────────────────────────────\n누적 평가이익(기타포괄손익누계액)            2,786\n\n  20×2년 중 기타포괄손익 변동\n    2,786 - (△2,620)  =  +5,406\n\n처분손익\n  매각금액 101,000 - 장부금액(공정가치) 101,000  =  0\n\n재분류조정\n  기타포괄손익누계액 2,786을 「당기손익으로 재분류」\n  →  금융자산처분이익  2,786  (이익)</span>\n\n<h4>Ⅲ. 20×2년 당기손익</h4>\n<span class=\"tb\">이자수익                                  + 11,594\n금융자산처분이익(재분류조정)               +  2,786\n──────────────────────────────────────────────\n당기손익                                  + 14,380\n\n  →  「이익 ￦14,380」</span>\n\n<h4>답 (2) : 이익 ￦14,380</h4>\n<span class=\"tb\">20×2년 회계처리\n\n① 이자수익\n   (차) 현금            10,000\n       FVOCI금융자산     1,594\n       (대) 이자수익            11,594\n\n② 처분 직전 공정가치 평가\n   (차) FVOCI금융자산    2,786\n       (대) 금융자산평가이익(OCI)  2,786\n   (누계액이 △2,620에서 +2,786으로 바뀌므로 당기 변동은 5,406)\n\n③ 처분 및 재분류조정\n   (차) 현금           101,000\n       (대) FVOCI금융자산       101,000\n\n   (차) 금융자산평가이익(OCI)  2,786\n       (대) 금융자산처분이익        2,786</span>\n\n<h4>Ⅳ. 왜 이런 결과가 나오는가 — 검산</h4>\n<span class=\"tb\">FVOCI 채무상품을 만기 전에 처분하면\n「전 기간의 당기손익 합계」는 상각후원가측정(AC)으로 분류했을 때와 「같다」.\n\n  AC로 분류했다면\n    20×1 이자수익                   11,424\n    20×2 이자수익                   11,594\n    20×2 처분이익  101,000 - 98,214 = 2,786\n    ──────────────────────────────────────\n    합계                            25,804\n\n  FVOCI로 분류한 경우\n    20×1 당기손익                   11,424\n    20×2 당기손익                   14,380\n    ──────────────────────────────────────\n    합계                            25,804   ○</span>\n<p><b>재분류조정이 있기 때문에</b> 두 분류의 <b>누적 당기손익이 일치</b>한다.\nFVOCI로 분류하면 <b>어느 해에 얼마가 잡히는가</b>만 달라질 뿐이다.</p>\n\n<h4>Ⅴ. 지분상품과의 차이 — 반드시 구분할 것</h4>\n<span class=\"tb\">                        채무상품 FVOCI      지분상품 FVOCI(선택)\n\n이자·배당               이자수익 → 당기손익  배당금수익 → 당기손익\n공정가치 평가손익        기타포괄손익         기타포괄손익\n처분 시 재분류조정        「한다」             「하지 않는다」\n                                            (이익잉여금으로 대체 가능)\n손상(기대신용손실)        「적용한다」          적용하지 않는다</span>\n", "keys": ["FVOCI 채무상품", "이자수익은 상각후원가 기준", "95,196 × 12% = 11,424", "96,620", "평가손익은 기타포괄손익", "당기손익 아니다", "11,594", "98,214", "누계액 2,786", "재분류조정", "금융자산처분이익 2,786", "14,380", "AC와 누적 당기손익 일치", "지분상품은 재분류조정 하지 않는다"], "law": ["K-IFRS 제1109호 금융상품", "K-IFRS 제1001호 재무제표 표시"]}}, {"no": 10, "body": "다음은 (주)한국의 영업활동과 부분 재무상태표의 일부이다. 주어진 자료\n를 이용하여 다음의 물음에 답하시오.\n부분 재무상태표\n구분 20×1년 초 20×1년 말\n매출채권 ￦10,000 ￦20,000\n손실충당금 ￦(2,000) ￦(3,000)\n재고자산 ￦60,000 ￦50,000\n매입채무 ￦10,000 ￦5,000\n미지급비용 ￦14,000 ￦12,000\n(주)한국이 20×1년도에 ￦70,000의 당기순이익과 ￦10,000의 감가상각비를\n보고했을 경우 (주)한국의 영업활동으로 인한 현금흐름은? (증감을 (+)/(-)로\n표시하시오.) (5점)", "sub": [5], "points": 5, "a": {"plan": "간접법은 당기순이익에서 출발해 비현금비용을 더하고 영업 관련 자산·부채의 증감을 반대로 붙인다. 손실충당금을 빠뜨리지 않는다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">구분          20×1년 초    20×1년 말      증감\n\n매출채권       ￦10,000     ￦20,000     +10,000  (증가)\n손실충당금     ￦(2,000)    ￦(3,000)     -1,000  (증가)\n재고자산       ￦60,000     ￦50,000     -10,000  (감소)\n매입채무       ￦10,000      ￦5,000      -5,000  (감소)\n미지급비용     ￦14,000     ￦12,000      -2,000  (감소)\n\n당기순이익     ￦70,000\n감가상각비     ￦10,000</span>\n\n<h4>Ⅰ. 간접법의 구조</h4>\n<span class=\"tb\">당기순이익\n\n (+) 현금의 유출이 없는 비용   감가상각비, 무형자산상각비,\n                              손상차손, 대손상각비 등\n (-) 현금의 유입이 없는 수익   지분법이익, 사채상환이익 등\n\n (±) 영업활동과 관련된 자산·부채의 증감\n       자산이 늘면  (-)      돈이 자산으로 잠겼다\n       자산이 줄면  (+)      자산이 현금으로 풀렸다\n       부채가 늘면  (+)      아직 갚지 않았다\n       부채가 줄면  (-)      갚아 버렸다\n\n (±) 투자·재무활동에서 생긴 손익의 제거\n       유형자산처분손익, 사채상환손익 등\n\n= 영업활동으로 인한 현금흐름</span>\n\n<h4>Ⅱ. 계산</h4>\n<span class=\"tb\">당기순이익                                    70,000\n\n감가상각비 (현금유출 없는 비용)               +10,000\n\n매출채권의 증가        10,000 → 20,000        -10,000\n손실충당금의 증가       2,000 →  3,000        + 1,000\n재고자산의 감소        60,000 → 50,000        +10,000\n매입채무의 감소        10,000 →  5,000        - 5,000\n미지급비용의 감소      14,000 → 12,000        - 2,000\n──────────────────────────────────────────────────\n영업활동으로 인한 현금흐름                    74,000</span>\n\n<h4>답 : (+) ￦74,000</h4>\n\n<h4>Ⅲ. 손실충당금은 왜 (+)인가</h4>\n<p>가장 실수가 잦은 항목이다.</p>\n<span class=\"tb\">손실충당금이 2,000에서 3,000으로 「1,000 늘었다」는 것은\n그해에 「대손상각비 1,000」을 비용으로 잡았다는 뜻이다.\n\n대손상각비는 「현금이 나가지 않는 비용」이므로\n당기순이익에 다시 더해 주어야 한다.\n\n  →  +1,000</span>\n<p>다르게 보면, <b>매출채권을 순액으로 보는 방법</b>도 같은 답을 준다.</p>\n<span class=\"tb\">매출채권 순액\n  기초  10,000 - 2,000 =  8,000\n  기말  20,000 - 3,000 = 17,000\n  증가                    9,000   →  -9,000\n\n  총액으로 나누어 보면\n    매출채권 증가  -10,000\n    손실충당금 증가 + 1,000\n    ─────────────────────\n                   - 9,000   ○  같다</span>\n\n<h4>Ⅳ. 각 항목의 뜻을 풀어 보면</h4>\n<span class=\"tb\">매출채권 증가 10,000\n  매출은 잡았으나 아직 돈을 받지 못하였다  →  현금이 그만큼 적다\n\n재고자산 감소 10,000\n  전기에 사 둔 재고를 팔았다\n  → 당기 매입 없이 매출원가가 잡혔으므로 현금이 그만큼 남았다\n\n매입채무 감소 5,000\n  외상값을 갚았다  →  현금이 나갔다\n\n미지급비용 감소 2,000\n  밀린 비용을 치렀다  →  현금이 나갔다</span>\n\n<h4>Ⅴ. 참고 — 직접법으로 검산할 수는 없다</h4>\n<p>매출액·매출원가 등의 자료가 없으므로\n이 문제는 <b>간접법으로만</b> 풀 수 있다.\n간접법은 <b>손익계산서의 세부 항목을 몰라도\n당기순이익과 재무상태표의 증감만으로</b> 영업현금흐름을 구할 수 있다는 것이 장점이다.</p>\n<p>K-IFRS는 <b>직접법을 권장</b>하지만,\n<b>실무에서는 간접법이 압도적으로 많이 쓰인다</b>.</p>\n", "keys": ["간접법", "당기순이익 70,000", "감가상각비 +10,000", "매출채권 증가 -10,000", "손실충당금 증가 +1,000", "대손상각비는 비현금비용", "재고자산 감소 +10,000", "매입채무 감소 -5,000", "미지급비용 감소 -2,000", "74,000"], "law": ["K-IFRS 제1007호 현금흐름표"]}}, {"no": 11, "body": "(주)한국은 실제원가계산을 적용하고 있으며, 20×1년 기초 및 기말의 재고\n자산금액은 다음과 같다. 20×1년의 기초(기본)원가는 ￦420,000이고, 가공\n(전환)원가의 50%가 제조간접원가이며, 직접재료매입액은 ￦66,000이다.\n(주)한국의 20×1년 매출원가는? (5점)\n구분 기초 기말\n직접재료 ￦44,000 ￦20,000\n재 공 품 ￦47,000 ￦30,000\n제 품 ￦20,000 ￦58,000", "sub": [5], "points": 5, "a": {"plan": "직접재료원가를 먼저 뽑고 기본원가에서 직접노무원가를 떼어 낸다. 가공원가의 절반이 제조간접원가라는 말은 곧 노무와 간접이 같다는 뜻이다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">기초(기본)원가                    ￦420,000\n가공(전환)원가의 50%가 제조간접원가\n직접재료매입액                     ￦66,000\n\n구분        기초        기말\n직접재료   ￦44,000    ￦20,000\n재공품     ￦47,000    ￦30,000\n제품       ￦20,000    ￦58,000</span>\n<span class=\"tb\">용어의 확인\n\n  기본원가(기초원가, prime cost)   = 직접재료원가 + 직접노무원가\n  가공원가(전환원가, conversion)   = 직접노무원가 + 제조간접원가\n\n  → 「직접노무원가」가 두 곳에 겹쳐 들어간다.</span>\n\n<h4>Ⅰ. 1단계 — 직접재료원가</h4>\n<span class=\"tb\">기초 직접재료                       44,000\n직접재료매입액                    + 66,000\n기말 직접재료                     - 20,000\n──────────────────────────────────────────\n직접재료원가(사용액)                90,000</span>\n\n<h4>Ⅱ. 2단계 — 직접노무원가</h4>\n<span class=\"tb\">기본원가 = 직접재료원가 + 직접노무원가\n\n420,000 = 90,000 + 직접노무원가\n직접노무원가 = 330,000</span>\n\n<h4>Ⅲ. 3단계 — 제조간접원가와 가공원가</h4>\n<span class=\"tb\">「가공(전환)원가의 50%가 제조간접원가」이므로\n가공원가의 나머지 50%가 직접노무원가이다.\n\n  →  직접노무원가 = 제조간접원가\n\n제조간접원가 = 330,000\n\n가공원가 = 330,000 + 330,000 = 660,000</span>\n\n<h4>Ⅳ. 4단계 — 당기총제조원가</h4>\n<span class=\"tb\">직접재료원가                        90,000\n직접노무원가                      330,000\n제조간접원가                      330,000\n──────────────────────────────────────────\n당기총제조원가                    750,000\n\n(= 직접재료원가 90,000 + 가공원가 660,000)</span>\n\n<h4>Ⅴ. 5단계 — 당기제품제조원가</h4>\n<span class=\"tb\">기초재공품                          47,000\n당기총제조원가                   + 750,000\n기말재공품                        - 30,000\n──────────────────────────────────────────\n당기제품제조원가                   767,000</span>\n\n<h4>Ⅵ. 6단계 — 매출원가</h4>\n<span class=\"tb\">기초제품                            20,000\n당기제품제조원가                 + 767,000\n기말제품                          - 58,000\n──────────────────────────────────────────\n매출원가                           729,000</span>\n\n<h4>답 : ￦729,000</h4>\n\n<h4>Ⅶ. 원가의 흐름을 한눈에</h4>\n<span class=\"tb\">   직접재료          재공품            제품\n ┌──────────┐   ┌──────────┐   ┌──────────┐\n │기초 44,000│   │기초 47,000│   │기초 20,000│\n │매입 66,000│──▶│DM   90,000│──▶│제조원가   │──▶ 매출원가\n │           │   │DL  330,000│   │   767,000 │      729,000\n │기말 20,000│   │OH  330,000│   │기말 58,000│\n └──────────┘   │기말 30,000│   └──────────┘\n                 └──────────┘\n\n  세 개의 상자를 「기초 + 들어온 것 - 기말 = 나간 것」으로\n  차례로 통과시키면 된다.</span>\n\n<h4>Ⅷ. 흔한 실수</h4>\n<span class=\"tb\">① 「직접재료매입액」을 그대로 직접재료원가로 쓴다\n   → 기초·기말 재고를 조정해야 「사용액」이 나온다\n\n② 「가공원가의 50%가 제조간접원가」를\n   「기본원가의 50%」로 잘못 읽는다\n\n③ 직접노무원가를 두 번 더한다\n   당기총제조원가 = 기본원가 + 가공원가 (×)\n                  = 420,000 + 660,000 = 1,080,000  (오답)\n   → 직접노무원가 330,000이 이중으로 들어간다\n   당기총제조원가 = 기본원가 + 제조간접원가 (○)\n                  = 420,000 + 330,000 = 750,000</span>\n", "keys": ["기본원가 = DM + DL", "가공원가 = DL + OH", "직접재료원가 90,000", "직접노무원가 330,000", "가공원가의 50%가 제조간접원가", "DL = OH", "제조간접원가 330,000", "당기총제조원가 750,000", "당기제품제조원가 767,000", "매출원가 729,000", "직접노무원가 이중계상 주의"], "law": []}}, {"no": 12, "body": "(주)한국은 종합원가계산을 사용하며 평균법을 적용한다. 제품은 제1공정\n을 거쳐 제2공정에서 최종 완성되며, 제2공정의 20×1년 7월의 완성품\n환산량 단위당 원가는 다음과 같다. 제2공정에서 직접재료는 가공(전환)\n원가 완성도 60% 시점에서 투입되며, 가공(전환)원가는 제2공정 전체를\n통해 균등하게 발생한다. 7월 말 제2공정의 재공품은 2,000개이며, 가공(전환)\n원가의 완성도는 50%이다. 제2공정의 기말재공품원가는? (5점)\n구분 완성품환산량 단위당 원가\n직접재료원가 ￦200\n전공정(제1공정)원가 ￦600\n가공(전환)원가 ￦250", "sub": [5], "points": 5, "a": {"plan": "완성도 50%가 재료 투입시점 60%에 못 미친다. 재료는 0개, 전공정은 100%, 가공은 50%로 환산량을 세면 끝난다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">제2공정, 종합원가계산, 평균법\n\n완성품환산량 단위당 원가\n  직접재료원가          ￦200\n  전공정(제1공정)원가   ￦600\n  가공(전환)원가        ￦250\n\n제2공정의 직접재료는 「가공원가 완성도 60% 시점」에서 투입\n가공원가는 제2공정 전체를 통해 균등하게 발생\n\n7월 말 제2공정 재공품  2,000개, 가공원가 완성도 50%</span>\n\n<h4>Ⅰ. 원가요소별 완성도의 판정</h4>\n\n<h4>1. 전공정원가 — 100%</h4>\n<span class=\"tb\">전공정원가는 제1공정에서 완성되어 제2공정에 「넘어오는 순간」\n전액이 투입된 것으로 본다.\n\n제2공정에 있는 이상 진척도와 관계없이 언제나 100%이다.\n\n완성품환산량  2,000개 × 100%  =  2,000개</span>\n\n<h4>2. 직접재료원가 — 0%</h4>\n<span class=\"tb\">직접재료는 「가공원가 완성도 60% 시점」에서 「한꺼번에」 투입된다.\n\n기말재공품의 가공원가 완성도  =  50%\n\n  50% < 60%\n  →  아직 재료가 투입되지 않았다\n\n완성품환산량  2,000개 × 0%   =      0개</span>\n<p><b>이 문제의 핵심</b>이다.\n<b>특정 시점 투입 재료</b>는 그 시점을 <b>지났는가 지나지 않았는가</b>로만 갈린다.\n50%는 60%에 <b>10%포인트가 모자라므로 전혀 투입되지 않았다</b>.\n<b>비례로 나누어 넣으면 안 된다.</b></p>\n\n<h4>3. 가공원가 — 50%</h4>\n<span class=\"tb\">가공원가는 공정 전체에 걸쳐 「균등하게」 발생하므로\n진척도가 곧 완성도이다.\n\n완성품환산량  2,000개 × 50%  =  1,000개</span>\n\n<h4>Ⅱ. 기말재공품원가의 계산</h4>\n<span class=\"tb\">원가요소       완성품환산량        단위당 원가        금액\n\n전공정원가    2,000개 × 100% = 2,000개   ×  ￦600  = 1,200,000\n직접재료원가  2,000개 ×   0% =     0개   ×  ￦200  =         0\n가공원가      2,000개 ×  50% = 1,000개   ×  ￦250  =   250,000\n────────────────────────────────────────────────────────────\n기말재공품원가                                       1,450,000</span>\n\n<h4>답 : ￦1,450,000</h4>\n\n<h4>Ⅲ. 만약 완성도가 70%였다면</h4>\n<span class=\"tb\">직접재료는 60% 시점을 「지났으므로」 전액 투입되었다.\n\n전공정원가   2,000 × 100% × 600  = 1,200,000\n직접재료원가 2,000 × 100% × 200  =   400,000   ← 100%가 된다\n가공원가     2,000 ×  70% × 250  =   350,000\n────────────────────────────────────────────\n                                    1,950,000\n\n  → 완성도가 20%포인트 오르는 것만으로\n    재료원가 400,000이 통째로 더 들어온다.</span>\n\n<h4>Ⅳ. 재료 투입시점별 완성도 정리</h4>\n<span class=\"tb\">공정 「초」에 전량 투입        →  언제나 100%\n공정 「전체」에 균등 투입      →  진척도와 같다\n「특정 시점」에 투입           →  그 시점을 지났으면 100%,\n                                 지나지 않았으면 0%\n공정 「말」에 투입             →  완성품만 100%, 재공품은 0%\n전공정원가                     →  언제나 100%</span>\n\n<h4>Ⅴ. 평균법이라는 조건은 여기서 왜 쓰이지 않는가</h4>\n<p><b>기말재공품원가</b>만을 묻고 있고\n<b>완성품환산량 단위당 원가가 이미 주어졌기</b> 때문이다.</p>\n<span class=\"tb\">평균법과 선입선출법은\n  「단위당 원가를 어떻게 구하는가」에서 갈린다.\n\n  평균법     (기초재공품원가 + 당기투입원가) ÷ 총완성품환산량\n  선입선출법  당기투입원가 ÷ 당기완성품환산량\n\n단위당 원가가 주어진 뒤에는\n기말재공품원가의 계산방법이 두 방법에서 같다.</span>\n", "keys": ["전공정원가는 언제나 100%", "특정 시점 투입", "50% < 60%", "직접재료 0%", "가공원가 50%", "환산량 2,000 / 0 / 1,000", "1,200,000", "250,000", "1,450,000", "비례배분하지 않는다"], "law": []}}, {"no": 13, "body": "(주)한국은 20×1년 1월 1일에 설립되었고, 20×1년과 20×2년의 제품 생산량\n및 판매량은 다음과 같으며, 원가흐름은 선입선출법을 적용한다. 20×1년\n전부원가계산에 의한 영업이익은 ￦34,000이며, 20×2년에 발생한 고정제조\n간접원가는 ￦133,000일 경우 다음의 물음에 답하시오. 단, 두 기간의 단위당\n판매가격, 단위당 변동제조원가 및 단위당 변동판매관리비는 동일하며, 재공품\n재고는 없다.\n구분 20×1년 20×2년\n생산량 3,000단위 3,800단위\n판매량 2,600단위 4,000단위\n변동원가계산 영업이익 ￦26,000 ￦50,000\n(1) 20×2년 기말제품에 포함된 고정제조간접원가는? (5점)\n(2) 20×2년 전부원가계산에 의한 영업이익은? (5점)", "sub": [5, 5], "points": 10, "a": {"plan": "두 방법의 이익 차이는 재고에 묻힌 고정제조간접원가의 차이뿐이다. 20×1년 차이로 단위당 고정비를 역산하는 것이 출발점이다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">구분                  20×1년        20×2년\n\n생산량               3,000단위     3,800단위\n판매량               2,600단위     4,000단위\n변동원가계산 영업이익  ￦26,000      ￦50,000\n\n20×1년 전부원가계산 영업이익  ￦34,000\n20×2년 고정제조간접원가       ￦133,000\n\n원가흐름은 선입선출법, 재공품 재고는 없다\n단위당 판매가격·변동제조원가·변동판매관리비는 두 기간 동일</span>\n\n<h4>Ⅰ. 재고수량의 흐름</h4>\n<span class=\"tb\">20×1년  기초 0 + 생산 3,000 - 판매 2,600  =  기말   400단위\n20×2년  기초 400 + 생산 3,800 - 판매 4,000  =  기말   200단위</span>\n\n<h4>Ⅱ. 두 방법의 이익 차이가 생기는 이유</h4>\n<span class=\"tb\">전부원가계산   고정제조간접원가를 「제품원가」에 넣는다\n               → 팔리지 않고 재고에 남으면 비용이 되지 않고 재고에 잠긴다\n\n변동원가계산   고정제조간접원가를 「기간비용」으로 전액 처리한다\n               → 팔리든 안 팔리든 그해에 다 비용이 된다\n\n전부원가계산 영업이익 - 변동원가계산 영업이익\n  = 기말재고에 포함된 고정제조간접원가\n  - 기초재고에 포함된 고정제조간접원가</span>\n\n<h4>Ⅲ. 20×1년 자료로 단위당 고정제조간접원가를 구한다</h4>\n<span class=\"tb\">20×1년 전부원가계산 영업이익            34,000\n20×1년 변동원가계산 영업이익          - 26,000\n────────────────────────────────────────────\n차이                                    8,000\n\n20×1년은 설립 첫해이므로 기초재고가 없다.\n따라서 이 차이는 「기말재고 400단위에 포함된 고정제조간접원가」이다.\n\n20×1년 단위당 고정제조간접원가\n  8,000 ÷ 400단위                    =  ￦20\n\n(참고) 20×1년 총 고정제조간접원가\n  3,000단위 × 20                     =  ￦60,000</span>\n\n<h4>Ⅳ. 20×2년 단위당 고정제조간접원가</h4>\n<span class=\"tb\">20×2년 고정제조간접원가              133,000\n20×2년 생산량                        3,800단위\n────────────────────────────────────────────\n단위당 고정제조간접원가  133,000 ÷ 3,800  =  ￦35</span>\n<p><b>고정제조간접원가 총액이 늘었을 뿐 아니라\n생산량으로 나눈 단위당 금액도 20에서 35로 올랐다.</b>\n문제가 <b>“변동제조원가는 동일”</b>이라고만 하고\n고정제조간접원가는 따로 준 이유이다.</p>\n\n<h3>(1) 20×2년 기말제품에 포함된 고정제조간접원가 (5점)</h3>\n<span class=\"tb\">원가흐름은 「선입선출법」이다.\n\n  20×2년 판매 4,000단위\n    = 기초재고 400단위(20×1년 생산분)\n    + 당기 생산분 3,600단위\n\n  20×2년 기말재고 200단위\n    = 당기(20×2년) 생산분\n\n따라서 기말재고에는 「20×2년의 단위당 고정제조간접원가」가 실린다.\n\n  200단위 × ￦35  =  ￦7,000</span>\n\n<h4>답 (1) : ￦7,000</h4>\n\n<h3>(2) 20×2년 전부원가계산에 의한 영업이익 (5점)</h3>\n<span class=\"tb\">전부원가계산 영업이익\n  = 변동원가계산 영업이익\n  + 기말재고에 포함된 고정제조간접원가\n  - 기초재고에 포함된 고정제조간접원가\n\n변동원가계산 영업이익                     50,000\n기말재고 고정제조간접원가  200 × 35    +   7,000\n기초재고 고정제조간접원가  400 × 20    -   8,000\n────────────────────────────────────────────\n전부원가계산 영업이익                    49,000</span>\n\n<h4>답 (2) : ￦49,000</h4>\n\n<h4>Ⅳ. 왜 전부원가계산 이익이 더 작아졌는가</h4>\n<span class=\"tb\">20×2년  생산 3,800 < 판매 4,000\n\n  → 재고가 400단위에서 200단위로 줄었다\n  → 지난해 재고에 잠겨 있던 고정제조간접원가 8,000이\n    올해 매출원가로 「풀려 나왔고」,\n    올해 잠긴 것은 7,000뿐이다\n  → 그 차이 1,000만큼 전부원가계산의 이익이 더 작다\n\n일반적으로\n  생산량 > 판매량 (재고 증가)  →  전부원가계산 이익이 「크다」\n  생산량 < 판매량 (재고 감소)  →  전부원가계산 이익이 「작다」\n  생산량 = 판매량              →  두 방법의 이익이 「같다」</span>\n\n<h4>Ⅴ. 검산 — 두 해를 합쳐 보면</h4>\n<span class=\"tb\">                     20×1년    20×2년     합계\n\n전부원가계산 이익     34,000    49,000    83,000\n변동원가계산 이익     26,000    50,000    76,000\n                     ─────────────────────────\n차이                   8,000    △1,000     7,000\n\n  = 20×2년 말 재고에 남아 있는 고정제조간접원가 7,000  ○\n\n  재고가 모두 팔려 없어지면 두 방법의 누적이익은 일치한다.\n  전부원가계산이 이익을 「만들어 내는 것」이 아니라\n  「어느 해로 옮기는 것」일 뿐이다.</span>\n\n<h4>Ⅵ. 실무·이론상의 시사</h4>\n<p>전부원가계산에서는 <b>생산량을 늘리기만 해도 이익이 커진다</b>.\n고정제조간접원가가 재고에 잠기기 때문이다.\n이를 <b>과잉생산 유인</b>이라 하며,\n<b>변동원가계산이 내부 성과평가에 쓰이는 이유</b>가 여기에 있다.</p>\n<p>다만 <b>외부보고용 재무제표</b>는\nK-IFRS 제1002호에 따라 <b>전부원가계산</b>으로 작성하여야 한다.</p>\n", "keys": ["전부원가계산", "변동원가계산", "이익 차이 = 기말재고 FOH - 기초재고 FOH", "20×1년 차이 8,000", "400단위", "단위당 20", "133,000 ÷ 3,800 = 35", "선입선출법", "기말 200단위", "7,000", "50,000 + 7,000 - 8,000", "49,000", "생산량 < 판매량이면 전부원가 이익이 작다", "과잉생산 유인"], "law": ["K-IFRS 제1002호 재고자산"]}}, {"no": 14, "body": "범용기계장치를 이용하여 제품 A를 생산·판매하는 ㈜한국의 당기 예산자료는\n다음과 같다. (주)한국은 신규 거래처로부터 제품 A 3,000단위를 판매할 수\n있는 특별주문을 받았으며, 단위당 변동제조원가와 단위당 변동판매관리비는\n변화가 없다. 특별주문 수락 시 기존제품의 정규시장 판매를 일부 포기해야 한다.\n다음의 물음에 답하시오. 단, 특별주문은 전량 수락하든지 기각해야 한다.\n구분 제품 A\n단위당 판매가격 ￦2,500\n단위당 변동제조원가 ￦1,200\n단위당 변동판매관리비 ￦400\n연간 정규시장 판매수량 8,000단위\n연간 최대생산량 10,000단위\n(1) (주)한국이 특별주문을 수락할 경우 기회비용은? (5점)\n(2) (주)한국이 특별주문을 수락할 경우 제시할 수 있는 단위당 최소판매\n가격은? (5점)", "sub": [5, 5], "points": 10, "a": {"plan": "여유조업도 2,000단위를 먼저 세고 모자라는 1,000단위만큼만 정규판매를 포기시킨다. 기회비용은 그 1,000단위의 공헌이익이다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">단위당 판매가격            ￦2,500\n단위당 변동제조원가        ￦1,200\n단위당 변동판매관리비        ￦400\n연간 정규시장 판매수량     8,000단위\n연간 최대생산량           10,000단위\n\n특별주문  3,000단위\n  · 단위당 변동제조원가와 변동판매관리비는 변화가 없다\n  · 전량 수락하든지 기각하여야 한다</span>\n\n<h4>Ⅰ. 단위당 공헌이익</h4>\n<span class=\"tb\">단위당 판매가격                     2,500\n단위당 변동제조원가              -  1,200\n단위당 변동판매관리비            -    400\n────────────────────────────────────────\n단위당 공헌이익                     900</span>\n\n<h4>Ⅱ. 여유조업도의 확인</h4>\n<span class=\"tb\">연간 최대생산량                  10,000단위\n연간 정규시장 판매수량         -  8,000단위\n────────────────────────────────────────\n여유조업도                       2,000단위\n\n특별주문                         3,000단위\n여유조업도로 충당               - 2,000단위\n────────────────────────────────────────\n정규판매를 포기하여야 할 수량    1,000단위</span>\n<p>특별주문 3,000단위를 <b>전량 수락</b>하여야 하므로,\n<b>모자라는 1,000단위만큼 정규시장 판매를 줄여야</b> 한다.</p>\n\n<h3>(1) 특별주문을 수락할 경우의 기회비용 (5점)</h3>\n<span class=\"tb\">기회비용\n  = 특별주문을 수락함으로써 「포기하게 되는」\n    정규시장 판매분의 공헌이익\n\n  1,000단위 × 단위당 공헌이익 900  =  ￦900,000</span>\n\n<h4>답 (1) : ￦900,000</h4>\n<p><b>포기하는 것은 ‘매출액’이 아니라 ‘공헌이익’</b>이다.\n정규판매를 줄이면 그만큼의 <b>변동원가도 함께 절약</b>되기 때문이다.</p>\n<span class=\"tb\">흔한 오답\n  1,000단위 × 판매가격 2,500 = 2,500,000  (×)\n  → 변동원가 1,600을 빼지 않았다</span>\n<p><b>고정원가</b>는 특별주문을 받든 안 받든 그대로이므로\n기회비용에 들어가지 않는다.</p>\n\n<h3>(2) 제시할 수 있는 단위당 최소판매가격 (5점)</h3>\n\n<h4>Ⅰ. 최소판매가격의 조건</h4>\n<span class=\"tb\">특별주문으로 얻는 증분수익 ≥ 특별주문으로 생기는 증분원가\n\n증분원가 = 특별주문 자체의 변동원가 + 기회비용</span>\n\n<h4>Ⅱ. 계산</h4>\n<span class=\"tb\">특별주문의 변동원가\n  3,000단위 × (변동제조원가 1,200 + 변동판매관리비 400)\n  = 3,000 × 1,600                        = 4,800,000\n\n기회비용                                 =   900,000\n──────────────────────────────────────────────────\n총 증분원가                              = 5,700,000\n\n단위당 최소판매가격\n  5,700,000 ÷ 3,000단위                  =    ￦1,900</span>\n\n<h4>답 (2) : ￦1,900</h4>\n\n<h4>Ⅲ. 단위당으로 바로 세워도 같다</h4>\n<span class=\"tb\">단위당 최소판매가격\n  = 단위당 변동원가 + 단위당 기회비용\n\n  단위당 변동원가    1,200 + 400              = 1,600\n  단위당 기회비용    900,000 ÷ 3,000단위      =   300\n  ─────────────────────────────────────────────────\n                                                1,900</span>\n<p>기회비용을 <b>포기하는 1,000단위가 아니라\n주문 전체인 3,000단위로 나눈다</b>는 점을 놓치지 않아야 한다.\n가격은 <b>주문 3,000단위 전부에</b> 매기는 것이기 때문이다.</p>\n\n<h4>Ⅳ. 검증 — 1,900에 팔면 이익이 그대로인가</h4>\n<span class=\"tb\">특별주문을 수락한 경우\n\n  특별주문 공헌이익  3,000 × (1,900 - 1,600)  =    900,000\n  정규판매 공헌이익  7,000 × 900              =  6,300,000\n  ─────────────────────────────────────────────────────\n  합계                                          7,200,000\n\n특별주문을 기각한 경우\n\n  정규판매 공헌이익  8,000 × 900              =  7,200,000\n\n  →  같다.  1,900이 「손해도 이익도 아닌 경계선」이다.  ○</span>\n\n<h4>Ⅴ. 만약 여유조업도가 충분했다면</h4>\n<span class=\"tb\">최대생산량이 11,000단위 이상이었다면\n정규판매를 포기할 필요가 없으므로 기회비용이 0이다.\n\n  단위당 최소판매가격 = 1,600</span>\n<p><b>여유조업도가 있으면 변동원가만 넘기면 되고,\n없으면 포기하는 공헌이익까지 받아야 한다.</b>\n특별주문 의사결정의 전부가 이 한 문장에 담겨 있다.</p>\n\n<h4>Ⅵ. 계산 밖에서 함께 살필 것</h4>\n<span class=\"tb\">· 기존 거래처가 알게 되어 「정규가격의 인하 압력」이 생기지 않는가\n· 특별주문이 「일회성」인가, 반복될 것인가\n· 정규시장 고객을 잃어 「장기 수익성」이 나빠지지 않는가\n· 특별주문에만 드는 추가 고정원가(설비, 금형 등)는 없는가\n· 「독점규제 및 공정거래에 관한 법률」상 부당한 차별취급에 해당하지 않는가</span>\n", "keys": ["단위당 공헌이익 900", "여유조업도 2,000단위", "포기수량 1,000단위", "기회비용 900,000", "공헌이익 기준", "고정원가는 무관", "증분원가 4,800,000", "5,700,000 ÷ 3,000", "최소판매가격 1,900", "단위당 변동원가 1,600 + 단위당 기회비용 300", "여유조업도가 충분하면 1,600"], "law": []}}, {"no": 15, "body": "(주)한국은 A사업부와 B사업부가 있다. B사업부는 제품 Y(단위당 판매\n가격: ￦200, 단위당 변동원가: ￦120, 단위당 고정원가: ￦30)와 부품 M을\n생산·판매한다. A사업부는 제품 X를 생산하는데 필요한 부품 M을\n외부업체로부터 단위당 ￦95에 구입할 수 있다. A사업부는 부품 M\n600단위를 B사업부로부터 대체받는 것을 고려하고 있다. B사업부가\n부품 M 600단위를 생산 및 대체하기 위해서는 단위당 변동제조원가\n￦40과 단위당 운송비 ￦10이 발생하며, 기존시장에서 제품 Y의 판매량을\n300단위만큼 감소시켜야 한다. B사업부가 대체거래를 수락할 수 있는\n부품 M의 단위당 최소사내대체가격은? (5점)", "sub": [5], "points": 5, "a": {"plan": "최소대체가격은 ‘증분원가 + 기회비용’ 하나다. 기존 판매 300단위 감소분의 공헌이익을 대체수량 600단위로 나누어 얹는다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">B사업부 — 제품 Y\n  단위당 판매가격    ￦200\n  단위당 변동원가    ￦120\n  단위당 고정원가     ￦30\n\nB사업부 — 부품 M을 A사업부에 600단위 대체하는 경우\n  단위당 변동제조원가  ￦40\n  단위당 운송비        ￦10\n  기존 제품 Y의 판매량을 「300단위」 감소시켜야 한다\n\nA사업부  부품 M을 외부에서 단위당 ￦95에 구입할 수 있다</span>\n\n<h4>Ⅰ. 사내대체가격 결정의 기본 틀</h4>\n<span class=\"tb\">공급사업부의 「최소대체가격」\n  = 단위당 증분원가(변동원가) + 단위당 기회비용\n\n수요사업부의 「최대대체가격」\n  = Min[ 외부구입가격 , 대체품을 사용하여 얻는 순실현가치 ]\n\n  최소대체가격 ≤ 대체가격 ≤ 최대대체가격\n  인 구간이 있어야 대체거래가 성립한다.</span>\n<p><b>고정원가는 대체 여부와 관계없이 발생</b>하므로\n최소대체가격에 넣지 않는다.\n문제가 준 <b>제품 Y의 단위당 고정원가 ￦30</b>은 <b>함정</b>이다.</p>\n\n<h4>Ⅱ. 1단계 — 단위당 증분원가</h4>\n<span class=\"tb\">단위당 변동제조원가                     40\n단위당 운송비                        +  10\n────────────────────────────────────────\n단위당 증분원가                         50</span>\n<p><b>운송비도 대체를 하기 때문에 새로 드는 원가</b>이므로 포함한다.</p>\n\n<h4>Ⅲ. 2단계 — 기회비용</h4>\n<span class=\"tb\">제품 Y의 단위당 공헌이익\n  판매가격 200 - 변동원가 120          =  80\n\n포기하는 제품 Y                      300단위\n\n기회비용 총액  300단위 × 80           =  24,000\n\n단위당 기회비용\n  24,000 ÷ 600단위(대체수량)          =  40</span>\n<p><b>기회비용을 ‘포기하는 300단위’가 아니라\n‘대체하는 600단위’로 나눈다.</b>\n대체가격은 <b>600단위 전부에 매기는 값</b>이기 때문이다.</p>\n\n<h4>Ⅳ. 3단계 — 최소사내대체가격</h4>\n<span class=\"tb\">단위당 증분원가                         50\n단위당 기회비용                      +  40\n────────────────────────────────────────\n단위당 최소사내대체가격                 90</span>\n\n<h4>답 : ￦90</h4>\n\n<h4>Ⅴ. 대체거래는 성립하는가</h4>\n<span class=\"tb\">B사업부의 최소대체가격                  ￦90\nA사업부의 최대대체가격(외부구입가)      ￦95\n\n  90 ≤ 대체가격 ≤ 95\n\n  → 「￦90 ~ ￦95」 구간에서 대체가격이 정해지면\n    두 사업부 모두 이득을 본다.\n  → 회사 전체로도 유리하다.</span>\n<span class=\"tb\">회사 전체의 이득 (단위당 5, 총 3,000원)\n\n  외부에서 사는 경우   600단위 × 95      =  57,000 유출\n  사내에서 만드는 경우\n    증분원가          600단위 × 50      =  30,000\n    기회비용          300단위 × 80      =  24,000\n    ────────────────────────────────────────────\n                                           54,000\n\n  차이                                       3,000  절약</span>\n\n<h4>Ⅵ. 만약 여유조업도가 있었다면</h4>\n<span class=\"tb\">제품 Y의 판매를 줄이지 않아도 되었다면 기회비용이 0이므로\n\n  최소대체가격 = 50\n\n  → 50 ~ 95의 훨씬 넓은 구간에서 대체가 성립한다.</span>\n<p><b>여유조업도의 유무가 최소대체가격을 결정한다</b>는 점은\n앞의 특별주문 문제와 완전히 같은 원리이다.</p>\n\n<h4>Ⅶ. 함정 정리</h4>\n<span class=\"tb\">① 제품 Y의 단위당 고정원가 30을 더한다\n   → 고정원가는 대체 여부와 무관하게 발생한다.  넣지 않는다.\n\n② 부품 M의 운송비 10을 빠뜨린다\n   → 대체 때문에 새로 드는 원가이므로 포함한다.\n\n③ 기회비용을 300단위로 나눈다\n   → 24,000 ÷ 300 = 80이 되어 최소대체가격이 130이 된다.\n     그러면 외부구입가 95보다 높아져\n     「대체가 성립하지 않는다」는 잘못된 결론에 이른다.\n\n④ 제품 Y의 판매가격 200을 기회비용으로 본다\n   → 포기하는 것은 매출이 아니라 「 예상운송비 : US$ 15,000", "sub": [15, 5, 5, 5], "points": 15}, {"no": 3, "body": "항공유 2,000톤을 호주로 수출하면서 보험금액을 US$ 2,000,000(CIF 송장\n가격 US$ 1,000/톤 X 2,000톤 X 100%)으로 하여 적하보험에 가입하였다.\n운송선박의 A, B 2개의 탱크에 각 1,000톤을 싣고 호주 근해를 항해 중\n선박의 좌초 사고로 A 탱크에 해수가 유입되었다. B 탱크에는 하역 시 선원의\n밸브 오작동으로 인해 타 화물이 유입되는 오염 사고가 있었다.\n최종도착지에서 조사한 결과 다음과 같이 손해가 확인되었다.\n◯ 좌초 시 해수 유입으로 인한 손상 내역\n- 시험결과 항공유로 부적합 판단 폐기 처리\n- 폐기처리비용 US$ 200,000 발생\n- 보관비용 US$ 50,000 발생\n◯ 선원의 밸브 오작동으로 인한 오염 손상 내역\n- 정제 후 사용 가능하며 50% 감가 판매\n◯ 각 탱크 입고량\n- 수출항 육상 탱크 : 2,000 톤\n- 운송선박 적재량 : A탱크 1,000 톤 / B탱크 1,000 톤\n- 도착항 육상탱크 : A탱크 1,000 톤 / B탱크 980 톤,\n20톤 부족손(Shortage) 발생\n(※ 해수, 타 화물 유입량 제외)\n아래의 보험조건으로 적하보험에 가입된 경우, 보험자가 지급해야 할\n보험금을 산정하시오. (10점)\n(1) ICC(B), Pipe Line Clause (B), including the risks of shortage in excess\nof 0.5% (5점)\n(2) Bulk Oil Clauses with Marine Extension Clause in excess of 0.5% of all\nclaims other than TL/CTL (5점)", "sub": [10, 5, 5], "points": 10}, {"no": 4, "body": "화공품 1,000 bags을 유럽으로 수출하면서 보험금액 US$ 1,100,000 (CIF\n송장가격 US$ 1,000/bag X 1,000 bags X 110%)로 적하보험에 가입하였다.\n운송 중 화물에 손상이 발생하였으며 최종 도착지에서 확인된 조사 내용은\n다음과 같다.\n◯ 800 bags : 정상 도착\n◯ 100 bags : 인도양 항해 중 악천후(Heavy weather) 시 통풍 차단으로 인한\n습기(Sweat) 손해, 감가율 10%로 합의됨\n◯ 50 bags : 부선에 적재하여 내륙 운하로 항해 중 강물의 유입으로 인한\n수침 손해, 감가율 10%로 합의됨\n◯ 30 bags : 하역 작업 중 빗물로 인한 수침 손해, 감가율 10%로 합의됨\n◯ 10 bags : 하역 작업 중 추락으로 전손\n◯ 10 bags : 미 도착 (non-delivery)\n위 상황에서 ICC(B)와 ICC(C)로 적하보험 가입 시 각 조건별로 담보 여부를\n설명하고 보험자가 지급해야 할 보험금을 산정하시오. (10점)", "sub": [10], "points": 10}, {"no": 5, "body": "다음의 경우에 대하여 선박건조보험 증권 하에서의 보험자가 지급해야 할 보험금을\n산정하시오. (10점)\n[보험 가입 내용]\n◯ 보험 조건 : Institute Clauses for Builders’ Risks (Cl.351) (1.6.88)\n.with deductible of US$ 350,000\n◯ 보험 가입금액 : US$ 10,000,000 (so valued)\n◯ 보험 기간 : 2025년 6월 16일 00:00 ~ 2026년 6월 15일 24:00\n(Keel Laying to Delivery)\n[보험 사고 내용]\n보험기간 중 선박 A호의 선박 인도 전에 부산 소재 조선소에서 포항까지\n왕복 시운전을 하던 중 선박 A호의 100% 과실로 투묘 중이던(anchoring)\n유조선 B호와 충돌하였다.\n본 충돌사고로 인하여 상대선은 침몰하여 전손되었고(인명 피해는 없고,\n상대선 선가 US$ 4,000,000 임), 본선은 충돌로 인한 충격으로 복원력이\n일시 상실되면서 인근한 가두리 양식장을 망가뜨려 US$ 5,000,000의 배상\n책임을 지게 되었다. 이후, 본선은 결국 좌초되어 구조비 US$ 2,000,000을\n들여 구조된 후 수리되었다. (본선 수리비 : US$ 3,000,000)\n또한, 충돌사고로 인한 방어법률비용으로 US$ 2,000,000이 별도로 지출되었다.", "sub": [10], "points": 10}, {"no": 6, "body": "선박이 부두에 접안하던 중 파도의 영향 및 도선사의 부주의로 부두와\n접촉하여 선체에 손상을 입었다. 손상의 형태나 정도가 감항성에 영향을\n줄 수 있는 상태인 것으로 확인되어 항차를 중단하고 선박을 수리항으로\n회항하여 손상 수리를 시행하였으며, 이번 기회를 이용하여 선주 수리를\n같이 시행하였다.\n당해 선박은 불가동손실 보험(Loss of Hire Insurance)에 아래와 같은\n조건으로 가입되어 있고 수리 기간이 아래와 같은 경우 질문에 답하시오.\n(10점)\n◯ 보험가입금액 : US$ 3,600,000\n◯ 적용약관 : Loss of Charter Hire – Excluding War\n(ABS 1/10/83)\n◯ Daily hire agreed : US$ 20,000/day\n◯ Excess period : 10 days\n◯ 수리항 회항 : 2 days\n◯ 실제 수리 기간 : 15 days\n◯ 손상 수리만 따로 시행할 경우 필요한 수리 기간 : 15 days\n◯ 선주 수리만 따로 시행할 경우 필요한 수리 기간 : 12 days\n(1) 손상 수리와 같이 시행된 선주 수리 작업이 감항성 유지를 위해서 당장\n필요한 수리가 아닌 경우 불가동손실 보험자가 지급해야 할 보험금을 산정\n하시오. (5점)\n(2) 손상 수리와 같이 시행된 선주 수리 작업이 감항성 유지를 위해서 당장\n필요한 수리인 경우 불가동손실 보험자가 지급해야 할 보험금을 산정하시오.\n(5점)", "sub": [10, 5, 5], "points": 10}, {"no": 7, "body": "「Institute War and Strike Clauses Hulls – Time 1/10/83」 제5조\n종료(Termination) 조항에서 해지통보의 유무와 관계없이 자동 종료되는\n사항에 대해 설명하시오. (5점)", "sub": [5], "points": 5}, {"no": 8, "body": "「Institute Time Clauses - Hulls (1/10/83)」 제9조 자매선 조항(Sistership\nClause)의 제정 취지와 내용에 관하여 약술하시오. (5점)", "sub": [5], "points": 5}, {"no": 9, "body": "런던해상보험자협회(ILU) 가입 보험사들과 로이즈해상보험자들은 1937년\n12월에 「War Risks Waterborne Agreement」를 맺었는 바, 「Institute\nWar Clauses (Cargo) 1982」에서 Waterborne Agreement와 관련된\n내용을 약술하시오. (5점)", "sub": [5], "points": 5}, {"no": 10, "body": "항공운송인의 국제운송화물에 대한 손해배상책임과 관련하여 현행 우리\n상법상 책임 한도액과 현행 몬트리올 협약(Montreal Conventions)상 kg당\n책임 한도액이 각각 얼마인지 및 kg당 책임제한을 적용하지 못하는 경우에\n대해서 약술하시오. (5점)", "sub": [5], "points": 5}, {"no": 11, "body": "해난 구조비용(Salvage Remuneration)의 공동해손 인정과 관련하여\n「York-Antwerp Rules 1994」의 Rule VI조와 「York-Antwerp Rules\n2016」의 Rule VI조 하에서 공동해손으로 인정 가능한 구조비용의\n차이점을 약술하시오. (5점)", "sub": [5], "points": 5}, {"no": 12, "body": "현재 국내에서 사용되고 있는 적하보험약 Ⅰ(PAR)을 가입\n하고 <표1>의 사고가 발생하였다. 이 경우 피보험자가 보상을 받기 위해 가입해야 할\n확장담보(Special Extentions)를 기재하고, 주요 내용을 약술하시오. (10점)\n<표1. 사고내용>\n계약자(피보험자)는 현재 운영중인 공장동에 소규모의 신규 증축공사를 진행하던 중이었다.\n그러나 작업자의 부주의로 용접 불꽃이 판넬에 옮겨 붙으며 대형화재가 발생하였고 공사\n중이던 건물, 시설을 포함하여 공장동 대부분이 소실되었다.\n불길이 인접한 완제품 창고로 번지는 것을 막기 위해 급히 방화벽을 구축하고 자재들을\n안전한 곳으로 긴급하게 이동시켰다.\n화재가 진압된 후 무너진 건물 잔해를 치우고 주변 오염물질을 세척하는 작업을 진행\n하였으며, 일부 기계는 정밀점검 및 수리를 위해 인근 협력업체 작업장으로 일시 이동\n시켰으나, 협력업체 작업장에서 기계 하차 중 전도되어 물적손해가 발생하였다. 피보험자는\n해당 기계의 신속한 복구를 위해 독일 제조사로부터 부품을 긴급 조달하여 수리하였다.\n또한 건물을 원상태로 복구하려 하였으나 최근 개정되어 강화된 소방법규의 적용이\n필요하고, 복구기간이 길어지는 것을 피하기 위해 전 직원이 야간근무 및 휴일에도\n집중 투입되어 공장을 복구하였다.", "sub": [10], "points": 10}]}, {"round": 49, "subject": "자동차보험의 이론과 실무(대물배상 및 차량손해)", "track": "차량", "src": "49회_2차 자동차보험의 이론과 실무 (대물배상 및 차량손해).pdf", "chars": 884, "digits": 28, "pts_ok": true, "q": [{"no": 1, "body": "보험회사의 대위권에 대하여 설명하고, 자차의 일방과실 사고로 자기\n차량과 피해차량에 대하여 전손보험금을 지급한 경우 잔존물대위에\n대한 법률 규정과 보험회사가 피보험자의 권리를 취득하지 않는 약관\n규정에 대하여 서술하시오.(20점)", "sub": [20], "points": 20}, {"no": 2, "body": "부가가치세(VAT)의 정의 및 인정기준에 대해 약술하고, 아래의 여객운송\n수단별 부가가치세 적용을 판단하시오.(15점)\n예) 시내버스 : (면세) / 고속철도 : (과세)\n① 특수자동차(장의차량) : ( ) ② 농어촌버스 : ( )\n③ 마을버스 : ( ) ④ 전세버스 : ( )\n⑤ 시외버스(고속형) : ( ) ⑥ 법인택시 : ( )", "sub": [15], "points": 15}, {"no": 3, "body": "과실비율 인정기준의 적용에서 “구체적인 과실비율 확정방법(수정요소\n적용)”을 설명하고, 아래 사고유형의 기본과실과 수정요소에 대해\n서술하시오.(15점)\n(과실도표 차 11-2) 신호있는 교차로 동일방향 총 4차선도로에서\nA차량이 직진좌회전차로 2차선에서 직진할 때\nB차량이 직진차로 3차선에서 좌회전하는 사고가 발생하였다.", "sub": [15], "points": 15}, {"no": 4, "body": "개인사업용차량의 휴차료 산정 시 증명자료가 있는 경우 휴차료 산정 방식을\n설명하고, 영업수익 계산 시 징구하여야 할 증명자료와 1일 운행경비 계산에\n필요한 세부항목에 대하여 나열하시오.(15점)", "sub": [15], "points": 15}, {"no": 5, "body": "자기차량손해(차량 단독사고 보장 특별약관 포함)에서 보상범위와 보상\n한도에 대하여 설명하고, 보상하지 않는 손해에 대해 열거한 후 주정차 중\n타이어에 생긴 손해에서 보상하는 경우를 서술하시오.(15점)", "sub": [15], "points": 15}, {"no": 6, "body": "표준작업시간의 구성에 대하여 설명하고, 공임률의 정의와 공임 총원가의\n구성요소에 대하여 약술하시오.(10점)", "sub": [10], "points": 10}, {"no": 7, "body": "보험계약자 등의 의무 중 계약 전 알릴 의무를 설명하고, 이를 위반한 경우의\n효과 및 보험계약을 해지할 (function () {

const KEY = 'sonsa2.draft';
function drafts() {
  try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; }
}
function saveDraft(id, text) {
  const d = drafts();
  if (text.trim()) d[id] = text; else delete d[id];
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
}

const state = { track: '신체', round: 0, subject: '' };

function rounds(track) {

}
function subjects(track, round) {
  return EXAM2.filter(r => r.track === track && r.round === round).map(r => r.subject);

  b.innerHTML = esc(text) + (locked ? '<span class="lk">🔒</span>' : '');
  b.onclick = fn;
  return b;
}

    chip(short(s), s === state.subject, () => { state.subject = s; draw(); })));
}

function paperOf(round, subject) {
  return EXAM2.find(r => r.round === round && r.subject === subject);
}

/* 과목명이 길어 칩에는 줄여 쓴다 */
function short(s) {
  return s.replace('의 이론과 실무', '')
          .replace('자동차보험(대인배상 및 자기신체손해)', '자동차(대인)')
          .replace('자동차보험(대물배상 및 차량손해)', '자동차(대물)')
          .replace('책임·근로자재해보상보험', '책임·근재')
          .replace('책임·화재·기술보험 등', '책임·화재·기술')
          .replace('자동차구조 및 정비이론과 실무', '자동차구조');
}

/* ── 본문에서 표처럼 보이는 줄을 따로 감싼다 ── */
function bodyHTML(t) {
  return esc(t).split('\n').map(ln => {
    const s = ln.trim();
    if (s.includes('|') && s.split('|').length >= 3) return '<span class="tb">' + ln + '</span>';
    return ln;
  }).join('\n');
}

/* ── 타이머 ── */
let tick = null, left = 0;
function fmt(s) {
  const m = Math.floor(Math.abs(s) / 60), x = Math.abs(s) % 60;
  return (s < 0 ? '-' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0');
}
function startTimer(el) {
  if (tick) clearInterval(tick);
  tick = setInterval(() => { left--; el.textContent = fmt(left); }, 1000);
}

function draw() {
  drawPicks();
  const p = paper(), m = $('#main');
  m.textContent = '';
  if (!p) return;

  const head = document.createElement('div');
  head.className = 'paper';
  const sum = (p.q || []).reduce((a, q) => a + (q.points || 0), 0);
  head.innerHTML = '<h2>' + esc(p.subject) + '</h2>' +
    '<span class="meta">제' + p.round + '회 · ' + (p.q || []).length + '문항 · ' + sum + '점</span>';
  if (!p.locked) {
    const tm = document.createElement('div');
    tm.className = 'timer';
    tm.innerHTML = '<span>남은 시간</span><b id="clk">90:00</b>';
    const b1 = document.createElement('button');
    b1.className = 'tbtn'; b1.textContent = '시작';
    const b2 = document.createElement('button');
    b2.className = 'tbtn'; b2.textContent = '멈춤';
    b1.onclick = () => { left = 90 * 60; $('#clk').textContent = fmt(left); startTimer($('#clk')); };
    b2.onclick = () => { if (tick) clearInterval(tick); tick = null; };
    tm.append(b1, b2);
    head.appendChild(tm);
  }
  m.appendChild(head);

  if (p.locked) {
    const d = document.createElement('div');
    d.className = 'locked';
    d.innerHTML = '<b>이용권이 있어야 열립니다</b>제' + FREE_ROUND2 +
      '회는 결제 없이 볼 수 있습니다. 나머지 회차는 ' +
      '<a href="./index.html#pay">이용권 안내</a>를 참고하세요.';
    m.appendChild(d);
    return;
  }

  (p.q || []).forEach(q => m.appendChild(qCard(p, q)));
}

function qCard(p, q) {
  const id = p.round + '|' + p.subject + '|' + q.no;
  const el = document.createElement('article');
  el.className = 'q';

  const h = document.createElement('div');
  h.className = 'qh';
  h.innerHTML = '<span class="qno">' + q.no + '</span>' +
    '<span class="pts">' + (q.points || 0) + '점</span><span class="qsp"></span>';
  el.appendChild(h);

  const b = document.createElement('div');
  b.className = 'body';
  b.innerHTML = bodyHTML(q.body || '');
  el.appendChild(b);

  const ta = document.createElement('textarea');
  ta.placeholder = '여기에 답안을 적어 보세요. 적은 내용은 이 기기에만 남습니다.';
  ta.value = drafts()[id] || '';
  el.appendChild(ta);

  const tools = document.createElement('div');
  tools.className = 'tools';
  const bm = document.createElement('button');
  bm.className = 'btn pri';
  bm.textContent = q.a ? '모범답안 보기' : '모범답안 준비 중';
  bm.disabled = !q.a;
  const bc = document.createElement('button');
  bc.className = 'btn';
  bc.textContent = '지우기';
  const cnt = document.createElement('span');
  cnt.className = 'cnt';
  tools.append(bm, bc, cnt);
  el.appendChild(tools);

  const model = document.createElement('div');
  model.className = q.a ? 'model' : 'none';
  if (q.a) {
    let html = '<div class="mtag">모범답안</div>';
    if (q.a.plan) html += '<div class="plan">' + esc(q.a.plan) + '</div>';
    html += '<div class="ans">' + (q.a.ans || '') + '</div>';
    if (q.a.law && q.a.law.length)
      html += '<div class="laws">근거 · ' + q.a.law.map(esc).join(' / ') + '</div>';
    if (q.a.keys && q.a.keys.length)
      html += '<div class="keys">' + q.a.keys.map(
        k => '<span class="key" data-k="' + esc(k) + '">' + esc(k) + '</span>').join('') + '</div>';
    model.innerHTML = html;
  } else {
    model.textContent = '이 문항의 모범답안은 아직 쓰는 중입니다. 배점과 물음의 구성을 보고 뼈대부터 잡아 두세요.';
  }
  el.appendChild(model);

  function refresh() {
    const t = ta.value;
    const n = t.replace(/\s/g, '').length;
    cnt.textContent = n + '자 · 원고지 약 ' + Math.ceil(n / 200) + '장';
    if (q.a && q.a.keys) model.querySelectorAll('.key').forEach(
      k => k.classList.toggle('hit', t.includes(k.dataset.k)));
  }
  ta.oninput = () => { saveDraft(id, ta.value); refresh(); };
  bm.onclick = () => {
    model.classList.toggle('open');
    bm.textContent = model.classList.contains('open') ? '모범답안 닫기' : '모범답안 보기';
    refresh();
  };
  bc.onclick = () => { ta.value = ''; saveDraft(id, ''); refresh(); };
  refresh();
  return el;
}

/* ── 이용권이 있으면 전체 회차를 받아 온다 ──
   배포본에는 무료 회차만 박혀 있어 소스를 열어도 나머지가 나오지 않는다.
   로그인·결제는 1차 화면(index.html)에서 하고 토큰을 함께 쓴다. */
const API = '/api';
let EXAM2ALL = EXAM2;
function auth() {
  try { return JSON.parse(localStorage.getItem('sonsa:auth') || 'null'); } catch (e) { return null; }
}
async function loadFull() {
  const a = auth();
  if (!a || !a.token || location.protocol === 'file:') return;
  try {
    const r = await fetch(API + '/content', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: a.token, doc: 'exam2' }),
    }).then(x => x.json());
    if (r.ok && Array.isArray(r.data) && r.data.length) {
      EXAM2ALL = r.data;
      EXAM2.length = 0;
      r.data.forEach(x => EXAM2.push(x));
      draw();
    }
  } catch (e) { /* 네트워크 실패 — 내장된 무료 회차로 이어 간다 */ }
}

/* ── 시작 ── */
(function () {
  const u = new URLSearchParams(location.search);
  state.track = TRACKS.includes(u.get('t')) ? u.get('t') : '신체';
  const rs = rounds(state.track);
  state.round = rs.includes(+u.get('r')) ? +u.get('r') : rs[0];
  const ss = subjects(state.track, state.round);
  state.subject = ss.includes(u.get('s')) ? u.get('s') : ss[0];
  draw();
  loadFull();
})();
</script>
</body>
