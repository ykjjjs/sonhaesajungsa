 = 130이 되어 틀린다.\n<b>손상차손환입으로 장부금액이 손상되지 않았을 경우를 넘을 수 없다</b>는 것이\nK-IFRS 제1036호의 핵심 제약이다.</p>\n\n<h3>(2) 원가모형과 재평가모형의 20×4년 말 자본총액 차이 (5점)</h3>\n\n<h4>Ⅰ. 원가모형을 계속 적용한 경우</h4>\n<span class=\"tb\">20×2년 말 장부금액                       400\n잔존내용연수 4년  →  연 감가상각비      100\n\n20×3년 감가상각                        - 100  →  300\n  손상검사  회수가능액 Max[500-50=450, 400] = 450 > 300\n            →  손상 없음 (환입할 손상도 남아 있지 않다)\n\n20×4년 감가상각                        - 100  →  200\n\n20×4년 말 처분   현금 600 - 장부금액 200\n                                        =  처분이익 400</span>\n<span class=\"tb\">자본에 미친 누적 영향 (20×1 ~ 20×4)\n\n  감가상각비   -(100 + 80 + 100 + 100)  = -380\n  손상차손                              = -100\n  손상차손환입                          = + 80\n  처분이익                              = +400\n  ──────────────────────────────────────────\n  합계                                  =    0</span>\n\n<h4>Ⅱ. 20×3년부터 재평가모형을 적용한 경우</h4>\n<span class=\"tb\">20×3년\n  감가상각   400 ÷ 4년 = 100           →  장부금액 300\n  재평가     공정가치 500\n             재평가잉여금(기타포괄손익)  +200\n             →  장부금액 500\n\n20×4년\n  감가상각   500 ÷ 3년 ≒ 166.7         →  장부금액 333.3\n  처분       현금 600 - 333.3          =  처분이익 266.7\n\n  ※ 처분 전에 20×4년 말 공정가치 600으로 재평가한 뒤 처분하여도\n    (재평가잉여금 +266.7, 처분손익 0) 결과는 같다.</span>\n<span class=\"tb\">자본에 미친 누적 영향 (20×1 ~ 20×4)\n\n  감가상각비   -(100 + 80 + 100 + 166.7) = -446.7\n  손상차손                                = -100\n  손상차손환입                            = + 80\n  재평가잉여금(기타포괄손익)              = +200\n  처분이익                                = +266.7\n  ────────────────────────────────────────────\n  합계                                    =     0</span>\n\n<h4>Ⅲ. 답 — 차이는 ￦0이다</h4>\n<span class=\"tb\">원가모형   자본 누적 영향  0\n재평가모형 자본 누적 영향  0\n──────────────────────────\n자본총액의 차이            0</span>\n\n<h4>Ⅳ. 왜 반드시 0이 되는가</h4>\n<p>계산을 하지 않고도 알 수 있다.</p>\n<span class=\"tb\">건물을 「600에 사서 600에 팔았다」.\n\n  자산이 들어오고 나가는 전 과정을 통틀어\n  기업의 순자산에 남는 몫은 0이다.\n\n  · 원가모형이든 재평가모형이든\n    「자본에 들어오는 총액」은 같다.\n  · 다를 수 있는 것은 「어느 해에」, 「어느 계정으로」\n    자본에 반영되는가일 뿐이다.</span>\n<span class=\"tb\">재평가모형이 바꾸는 것\n\n  · 이익잉여금은 「감가상각비가 커진 만큼」 줄어들고\n  · 재평가잉여금(기타포괄손익누계액)은 「그만큼」 늘어난다\n  → 자본 안에서 자리만 옮길 뿐 「총액」은 그대로이다\n\n  처분 시 재평가잉여금을 이익잉여금으로 대체하더라도\n  역시 자본 안의 이동이므로 총액은 변하지 않는다.</span>\n<p>따라서 <b>자산을 처분하여 한 사이클이 끝난 시점</b>에서는\n<b>두 모형의 자본총액이 반드시 일치</b>한다.</p>\n<p>다만 <b>보유 중인 기간</b>에는 자본총액이 달라진다.\n재평가모형은 <b>공정가치의 증가분을 자본에 얹어 놓기</b> 때문이다.\n이 문제가 <b>처분 시점</b>을 잡아 물은 이유가 여기에 있다.</p>\n", "keys": ["회수가능액 Max(순공정가치, 사용가치)", "20×1년 손상차손 100", "손상 후 잔존내용연수로 재계산", "20×2년 감가상각 80", "환입한도", "손상되지 않았을 경우의 장부금액 400", "손상차손환입 80", "재평가잉여금 기타포괄손익", "600에 사서 600에 팔았다", "자본총액 차이 0", "자본 내 계정 간 이동"], "law": ["K-IFRS 제1016호 유형자산", "K-IFRS 제1036호 자산손상"]}}, {"no": 5, "body": "(주)한국은 20×1년 7월 1일 고객과 다음의 계약을 체결하였으며, 계약 체결\n즉시 전액 현금으로 수취하였다.\n- 제품 A 1대 인도, 제품 B 1대 인도, 유지보수서비스(2년) 제공\n- 총 계약금액 ￦14,400\n각 수행의무의 개별판매가격은 다음과 같다.\n수행의무 개별판매가격\n제품 A ￦8,000\n제품 B ￦3,000\n유지보수서비스(2년) ￦4,000\n제품 A와 제품 B는 계약일에 고객에게 인도되었으며, 유지보수서비스는\n2년 동안 균등하게 제공된다고 할 때, (주)한국이 인식할 20×1년도 유지보수\n서비스 수익은? (5점)", "sub": [5], "points": 5, "a": {"plan": "개별판매가격 비율로 거래가격을 나눈 뒤, 기간에 걸쳐 이행하는 수행의무만 경과기간만큼 잘라 낸다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">20×1. 7. 1.  계약 체결, 총 계약금액 ￦14,400 전액 현금 수취\n\n수행의무            개별판매가격\n  제품 A               ￦8,000     계약일에 인도\n  제품 B               ￦3,000     계약일에 인도\n  유지보수서비스(2년)  ￦4,000     2년 동안 균등 제공\n  ────────────────────────────\n  합계                ￦15,000</span>\n\n<h4>Ⅰ. 1단계 — 수행의무의 식별</h4>\n<p>제품 A, 제품 B, 유지보수서비스는 각각\n<b>구별되는(distinct) 재화나 용역</b>이므로\n<b>세 개의 수행의무</b>로 식별한다.</p>\n\n<h4>Ⅱ. 2단계 — 거래가격의 배분</h4>\n<p>K-IFRS 제1115호는\n<b>“거래가격을 <u>개별 판매가격에 비례하여</u> 각 수행의무에 배분한다”</b>고 정한다.</p>\n<span class=\"tb\">개별판매가격 합계        15,000\n거래가격                 14,400\n                         ─────────\n할인율                   14,400 ÷ 15,000 = 0.96  (4% 할인)\n\n제품 A            8,000 × 0.96  =  7,680\n제품 B            3,000 × 0.96  =  2,880\n유지보수서비스    4,000 × 0.96  =  3,840\n──────────────────────────────────────\n합계                             14,400</span>\n<p>거래가격 14,400이 개별판매가격 합계 15,000보다 작으므로\n<b>600의 할인</b>이 있는 셈인데,\n이 할인은 <b>세 수행의무에 비례하여 나누어진다</b>.</p>\n\n<h4>Ⅲ. 3단계 — 수익의 인식 시점</h4>\n<span class=\"tb\">제품 A · 제품 B\n  「한 시점에」 이행하는 수행의무\n  통제가 이전되는 계약일(20×1. 7. 1.)에 전액 수익 인식\n    7,680 + 2,880 = 10,560\n\n유지보수서비스\n  「기간에 걸쳐」 이행하는 수행의무\n  고객이 기업의 수행에서 생기는 효익을 「동시에 얻고 소비」한다\n  2년 동안 「균등하게」 제공되므로 시간의 경과에 따라 인식한다</span>\n\n<h4>Ⅳ. 20×1년도 유지보수서비스 수익</h4>\n<span class=\"tb\">배분된 거래가격                    3,840\n\n경과기간\n  20×1. 7. 1. ~ 20×1. 12. 31.  =  6개월\n  총 제공기간                   = 24개월\n\n3,840 × (6개월 ÷ 24개월)\n= 3,840 × 1/4\n= 960</span>\n\n<h4>답 : ￦960</h4>\n\n<h4>Ⅴ. 참고 — 계약 전체의 회계처리</h4>\n<span class=\"tb\">20×1. 7. 1.  계약 체결 및 현금 수취\n\n  (차) 현금            14,400\n      (대) 매출(제품 A)          7,680\n          매출(제품 B)          2,880\n          계약부채              3,840\n\n20×1. 12. 31.  6개월분 용역 제공\n\n  (차) 계약부채           960\n      (대) 용역매출                960\n\n20×1년 말 계약부채 잔액  3,840 - 960 = 2,880\n  (20×2년 1,920 + 20×3년 960으로 각각 수익 인식)</span>\n\n<h4>Ⅵ. 흔한 실수</h4>\n<span class=\"tb\">① 배분을 하지 않고 개별판매가격 4,000을 그대로 쓰는 것\n   → 4,000 × 6/24 = 1,000 (오답)\n   거래가격이 개별판매가격 합계보다 작으므로 반드시 배분한다\n\n② 경과기간을 1년으로 잡는 것\n   → 7월 1일 계약이므로 20×1년은 「6개월」이다\n\n③ 대금을 전액 미리 받았다고 하여 전액을 수익으로 잡는 것\n   → 현금의 수취와 수익의 인식은 다르다.\n     아직 이행하지 않은 부분은 「계약부채」이다</span>\n", "keys": ["K-IFRS 제1115호", "수행의무의 식별", "개별 판매가격에 비례하여 배분", "14,400 ÷ 15,000 = 0.96", "3,840", "한 시점에 이행", "기간에 걸쳐 이행", "6개월 ÷ 24개월", "960", "계약부채"], "law": ["K-IFRS 제1115호 고객과의 계약에서 생기는 수익"]}}, {"no": 6, "body": "다음은 (주)한국의 20×1년과 20×2년 재무상태표의 일부이다.\n구분 20×1년 말 20×2년 말\n현금및현금성자산 ￦70,000 ￦30,000\n매출채권 ￦30,000 ￦70,000\n재고자산 ￦100,000 ￦200,000\n비유동자산 ￦200,000 ￦100,000\n유동부채 ￦50,000 ￦200,000\n비유동부채 ￦200,000 ￦50,000\n자본금 ￦100,000 ￦100,000\n··· ··· ···\n(주)한국의 20×2년도의 총자산회전율과 재고자산회전율은 각각 2회와 4회일\n경우 당기순이익은? (5점)", "sub": [5], "points": 5, "a": {"plan": "회전율 두 개로 매출액과 매출원가를 뽑아 매출총이익을 만든다. 평균잔액을 쓰는 것을 잊지 않는다.", "ans": "\n<h4>0. 자료의 정리</h4>\n<span class=\"tb\">구분                  20×1년 말     20×2년 말\n\n현금및현금성자산       ￦70,000      ￦30,000\n매출채권               ￦30,000      ￦70,000\n재고자산              ￦100,000     ￦200,000\n비유동자산            ￦200,000     ￦100,000\n──────────────────────────────────────────────\n총자산                ￦400,000     ￦400,000\n\n유동부채               ￦50,000     ￦200,000\n비유동부채            ￦200,000      ￦50,000\n──────────────────────────────────────────────\n총부채                ￦250,000     ￦250,000\n\n자본금                ￦100,000     ￦100,000</span>\n\n<h4>Ⅰ. 1단계 — 총자산회전율로 매출액을 구한다</h4>\n<span class=\"tb\">                    매출액\n총자산회전율 = ───────────────  = 2회\n                  평균총자산\n\n평균총자산 = (400,000 + 400,000) ÷ 2 = 400,000\n\n매출액 = 2 × 400,000 = 800,000</span>\n\n<h4>Ⅱ. 2단계 — 재고자산회전율로 매출원가를 구한다</h4>\n<span class=\"tb\">                      매출원가\n재고자산회전율 = ─────────────────  = 4회\n                    평균재고자산\n\n평균재고자산 = (100,000 + 200,000) ÷ 2 = 150,000\n\n매출원가 = 4 × 150,000 = 600,000</span>\n<p><b>재고자산회전율의 분자는 매출원가</b>이다.\n매출액을 쓰면 안 된다.\n재고자산이 <b>원가</b>로 기록되어 있으므로\n<b>분자와 분모의 측정기준을 맞춘 것</b>이다.</p>\n\n<h4>Ⅲ. 3단계 — 매출총이익</h4>\n<span class=\"tb\">매출액                 800,000\n매출원가             - 600,000\n──────────────────────────────\n매출총이익             200,000</span>\n\n<h4>답 : ￦200,000</h4>\n<p>문제가 준 자료로 확인할 수 있는 손익은\n<b>매출총이익까지</b>이다.\n판매비와관리비·금융원가·법인세 등에 관한 자료가 없으므로\n<b>그 밖의 손익이 없다는 전제</b>에서 당기순이익은 200,000이 된다.</p>\n\n<h4>Ⅳ. 재무상태표와의 정합성 — 함께 짚어 둘 것</h4>\n<span class=\"tb\">20×1년 말 자본  400,000 - 250,000 = 150,000\n20×2년 말 자본  400,000 - 250,000 = 150,000\n                                    ─────────\n자본의 변동                              0</span>\n<p>당기순이익이 200,000인데 <b>자본총액이 그대로</b>라면,\n그해에 <b>배당이나 자기주식 취득 등 자본거래로 200,000이 유출</b>되었다는 뜻이다.\n재무상태표에 <b>‘···’</b>로 생략된 항목들이 있으므로\n그 안에서 조정된 것으로 보면 된다.</p>\n\n<h4>Ⅴ. 참고 — 이 재무상태표가 보여 주는 것</h4>\n<span class=\"tb\">유동비율\n  20×1년  (70,000 + 30,000 + 100,000) ÷ 50,000  = 400%\n  20×2년  (30,000 + 70,000 + 200,000) ÷ 200,000 = 150%\n\n당좌비율\n  20×1년  (70,000 + 30,000) ÷  1,503     96,528\n\n  20×1  93,659 × 10% = 9,365.9  →  9,366\n  20×2  95,025 × 10% = 9,502.5  →  9,503</span>\n\n<h3>(1) 20×2년 말 사채의 순장부금액 (5점)</h3>\n<span class=\"tb\">조기상환 「전」 사채의 장부금액                96,528\n\n액면금액의 50%를 상환하였으므로\n남은 사채(액면 50,000)의 장부금액\n\n  96,528 × 50%                              =  48,264</span>\n\n<h4>답 (1) : ￦48,264</h4>\n<p><b>“순장부금액”</b>은 <b>사채 액면금액에서 사채할인발행차금을 뺀 금액</b>을 말한다.</p>\n<span class=\"tb\">확인\n  사채(액면)          50,000\n  사채할인발행차금   -1,736   (= 50,000 - 48,264)\n  ────────────────────────\n  순장부금액          48,264</span>\n\n<h3>(2) 20×2년도 당기손익 (5점)</h3>\n\n<h4>Ⅰ. 이자비용</h4>\n<span class=\"tb\">상환은 「20×2년 말」에 이루어졌으므로\n20×2년 한 해 동안은 사채 전액이 존재하였다.\n\n이자비용  95,025 × 10%                       =   9,503  (비용)</span>\n\n<h4>Ⅱ. 사채상환손익</h4>\n<span class=\"tb\">지급한 현금                                    52,000\n그중 현금이자 부분\n  100,000 × 8% × 50%                        =   4,000\n──────────────────────────────────────────────────\n순수한 상환대가                                48,000\n\n상환한 사채의 장부금액\n  96,528 × 50%                              =  48,264\n\n사채상환손익  48,264 - 48,000               =     264  (이익)</span>\n<p><b>지급액 52,000에서 현금이자 4,000을 떼어 내는 것</b>이\n이 문제의 핵심이다.\n이자는 사채의 상환대가가 아니라 <b>그해의 이자비용</b>이기 때문이다.</p>\n<p>상환대가(48,000)가 장부금액(48,264)보다 <b>작으므로 이익</b>이다.\n싸게 갚았으니 이익이라는 뜻이다.</p>\n\n<h4>Ⅲ. 20×2년 당기손익</h4>\n<span class=\"tb\">이자비용                                    - 9,503\n사채상환이익                                +   264\n──────────────────────────────────────────────\n당기손익                                    - 9,239\n\n  →  「손실 ￦9,239」</span>\n\n<h4>답 (2) : 손실 ￦9,239</h4>\n\n<h4>Ⅳ. 20×2년 말 회계처리</h4>\n<span class=\"tb\">① 이자비용의 인식\n   (차) 이자비용            9,503\n       (대) 현금                   8,000\n           사채할인발행차금        1,503\n\n② 조기상환\n   (차) 사채(액면)         50,000\n       (대) 현금                  48,000\n           사채할인발행차금        1,736\n           사채상환이익              264</span>\n\n<h4>Ⅴ. 흔한 실수</h4>\n<span class=\"tb\">① 8%의 현가계수로 발행금액을 계산한다\n   → 8,000 × 3.3121 + 100,000 × 0.7350 = 100,000\n     (액면발행이 되어 버린다. 유효이자율로 할인해야 한다)\n\n② 52,000 전액을 상환대가로 본다\n   → 48,264 - 52,000 = 상환손실 3,736 (오답)\n\n③ 상환한 뒤라 하여 20×2년 이자비용을 절반만 잡는다\n   → 상환은 「기말」에 이루어졌으므로 한 해 치 전액이다</span>\n", "keys": ["유효이자율 10%로 할인", "8,000 × 3.1699", "100,000 × 0.6830", "발행금액 93,659", "할인발행", "20×1년 말 95,025", "20×2년 말 96,528", "50% 48,264", "순장부금액", "현금이자 4,000 분리", "순수 상환대가 48,000", "사채상환이익 264", "이자비용 9,503", "손실 9,239"], "law": ["K-IFRS 제1109호 금융상품", "K-IFRS 제1032호 금융상품 표시"]}}, {"no": 8, "body": "(주)한국은 20×1년 1월 1일에 주당 액면금액 ￦500인 주식 10,000주를 주당\n￦5,000에 발행하여 설립되었다. 20×1년도 중에 다음과 같은 거래가 있었다.\n- 2월 14일에 주식발행초과금 ￦1,000,000을 자본금으로 전입하였다.\n- 4월 14일에 자기주식 100주를 주당 ￦4,000에 취득하였다.\n- 5월 8일에 자기주식 50주를 주당 ￦5,500에 처분하였다.\n- 10월 31일에 자기주식 25주를 소각하였다.\n- 12월 31일에 재평가를 통하여 부동산의 장부금액이 ￦100,000 증가하였다.\n- 20×1년의 당기순이익은 ￦300,000이다.\n위의 거래로 인해 발생하는 (주)한국의 20×1년 기초대비 기말의 자본 증감액은?\n(증감을 (+)/(-)로 표시하시오.) (5점)", "sub": [5], "points": 5, "a": {"plan": "다섯 거래를 ‘자본총액이 움직이는가’ 하나로만 거른다. 자본 내 대체는 0이고, 자기주식과 손익·재평가만 남는다.", "ans": "\n<h4>0. 기초 자본</h4>\n<span class=\"tb\">20×1. 1. 1. 설립\n  10,000주 × 발행가 ￦5,000  =  ￦50,000,000\n\n  자본금        10,000주 × 액면 500  =   5,000,000\n  주식발행초과금                      =  45,000,000\n  ────────────────────────────────────────────\n  기초 자본총액                       =  50,000,000</span>\n\n<h4>Ⅰ. 거래별 자본총액에 미치는 영향</h4>\n\n<h4>① 2월 14일 — 주식발행초과금 ￦1,000,000을 자본금으로 전입</h4>\n<span class=\"tb\">(차) 주식발행초과금  1,000,000\n    (대) 자본금              1,000,000\n\n자본금은 늘고 주식발행초과금은 준다.\n「자본 안에서 자리만 옮긴 것」이다.\n\n자본총액에 미치는 영향                        ￦0</span>\n\n<h4>② 4월 14일 — 자기주식 100주를 주당 ￦4,000에 취득</h4>\n<span class=\"tb\">(차) 자기주식        400,000\n    (대) 현금                  400,000\n\n자기주식은 「자본의 차감항목」이다.\n\n자본총액에 미치는 영향                  △400,000</span>\n\n<h4>③ 5월 8일 — 자기주식 50주를 주당 ￦5,500에 처분</h4>\n<span class=\"tb\">처분금액   50주 × 5,500 = 275,000\n장부금액   50주 × 4,000 = 200,000\n자기주식처분이익             75,000  (자본잉여금)\n\n(차) 현금            275,000\n    (대) 자기주식              200,000\n        자기주식처분이익        75,000\n\n자본총액에 미치는 영향                 +275,000</span>\n<p><b>자기주식처분이익 75,000은 당기손익이 아니라 자본잉여금</b>이다.\n자기주식 거래는 <b>회사와 주주 사이의 자본거래</b>이므로\n손익을 발생시키지 않는다.\n자본총액에는 <b>들어온 현금 275,000</b>만큼 영향을 준다.</p>\n\n<h4>④ 10월 31일 — 자기주식 25주 소각</h4>\n<span class=\"tb\">소각한 자기주식의 장부금액  25주 × 4,000 = 100,000\n소각한 주식의 액면금액      25주 ×   500 =  12,500\n감자차손                                  =  87,500\n\n(차) 자본금            12,500\n    감자차손           87,500\n    (대) 자기주식             100,000\n\n자본금이 줄고 자기주식(차감항목)도 줄어든다.\n「자본 안에서 자리만 옮긴 것」이다.\n\n자본총액에 미치는 영향                        ￦0</span>\n\n<h4>⑤ 12월 31일 — 재평가로 부동산 장부금액 ￦100,000 증가</h4>\n<span class=\"tb\">(차) 부동산(유형자산)  100,000\n    (대) 재평가잉여금          100,000   (기타포괄손익)\n\n기타포괄손익도 「자본」이다.\n\n자본총액에 미치는 영향                 +100,000</span>\n\n<h4>⑥ 당기순이익 ￦300,000</h4>\n<span class=\"tb\">이익잉여금의 증가\n\n자본총액에 미치는 영향                 +300,000</span>\n\n<h4>Ⅱ. 자본 증감액의 합계</h4>\n<span class=\"tb\">① 주식발행초과금의 자본금 전입              ￦0\n② 자기주식 취득                       △400,000\n③ 자기주식 처분                       +275,000\n④ 자기주식 소각                             ￦0\n⑤ 재평가잉여금                        +100,000\n⑥ 당기순이익                          +300,000\n──────────────────────────────────────────────\n자본 증감액                            +275,000</span>\n\n<h4>답 : (+) ￦275,000</h4>\n\n<h4>Ⅲ. 검증 — 기말 자본을 직접 쌓아 보면</h4>\n<span class=\"tb\">자본금\n  5,000,000 + 1,000,000(전입) - 12,500(소각)   =  5,987,500\n\n주식발행초과금\n  45,000,000 - 1,000,000(전입)                 = 44,000,000\n\n자기주식처분이익                                =     75,000\n감자차손                                        △    87,500\n\n자기주식\n  △400,000 + 200,000(처분) + 100,000(소각)     △    100,000\n  (100주 - 50주 - 25주 = 25주 × 4,000)\n\n재평가잉여금                                    =    100,000\n이익잉여금(당기순이익)                          =    300,000\n──────────────────────────────────────────────────────\n기말 자본총액                                   = 50,275,000\n\n기초 자본총액                                   = 50,000,000\n──────────────────────────────────────────────────────\n증감액                                          = +  275,000  ○</span>\n\n<h4>Ⅳ. 한 줄로 기억하기</h4>\n<span class=\"tb\">자본총액을 움직이는 것\n  · 회사 「밖」과 돈이 오간 거래  (증자, 자기주식 취득·처분, 배당)\n  · 손익 (당기손익, 기타포괄손익)\n\n자본총액을 움직이지 않는 것\n  · 자본 「안」에서 계정끼리 옮기는 거래\n    (무상증자, 주식배당, 자본전입, 이익준비금 적립, 자기주식 소각)</span>\n", "keys": ["주식발행초과금 자본금 전입은 자본총액 불변", "자기주식은 자본의 차감항목", "△400,000", "자기주식처분이익은 자본잉여금", "+275,000", "자기주식 소각은 자본총액 불변", "감자차손", "재평가잉여금 기타포괄손익 +100,000", "당기순이익 +300,000", "자본 증감액 +275,000"], "law": ["K-IFRS 제1032호 금융상품 표시", "K-IFRS 제1001호 재무제표 표시", "상법 제341조·제343조"]}}, {"no": 9, "body": "(주)한국은 20×1년 초에 (주)대한이 발행한 아래와 같은 조건의 사채를 공정\n가치인 ￦95,196에 취득하였다. ㈜한국은 동 사채를 원리금의 수취와 매도할\n목적으로 취득하여 기타포괄손익-공정가치 측정 금융자산으로 분류하였다.\n- 액면금액: ￦100,000 - 표시이자율 및 지급일: 10% 매년 말 후급\n- 만기: 3년 .- 시장이자율: 12%\n동 사채의 20×1년 말과 20×2년 말의 공정가치는 각각 ￦94,000과\n￦101,000이며, 20×2년 말에 해당 사채를 공정가치로 전부 매각하였다.\n(1) 위 거래로 인해 (주)한국의 20×1년 포괄손익계산서에 당기손익으로 인식될\n금액은? (이익 또는 손실 여부를 표기하고 금액을 제시하시오.) (5점)\n(2) 위 거래로 인해 (주)한국의 20×2년 포괄손익계산서에 당기손익으로 인식될\n금액은? 단, (주)한국은 금융자산의 제거시점에 기인식한 기타포괄손익\n누계액을 당기손익으로 재분류조정한다. (이익 또는 손실 여부를 표기\n하고 금액을 제시하시오.) (5점)", "sub": [5, 5], "points": 10, "a": {"plan": "FVOCI 채무상품은 당기손익에 이자수익만 태우고 평가손익은 기타포괄손익에 쌓는다. 처분할 때 그 누계액을 당기손익으로 끌어내리는 것이 핵심이다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">20×1년 초  (주)대한 사채를 공정가치 ￦95,196에 취득\n           기타포괄손익-공정가치 측정 금융자산(FVOCI)으로 분류\n\n  액면금액      ￦100,000\n  표시이자율    10%  (매년 말 후급 → 연 ￦10,000)\n  만기          3년\n  시장이자율    12%\n\n공정가치   20×1년 말 ￦94,000 / 20×2년 말 ￦101,000\n           20×2년 말에 공정가치로 전부 매각</span>\n\n<h4>Ⅰ. FVOCI(채무상품)의 회계처리 구조</h4>\n<span class=\"tb\">① 이자수익\n   「상각후원가」에 유효이자율을 곱하여 「당기손익」으로 인식한다\n   → 상각후원가측정(AC) 금융자산과 「똑같이」 계산한다\n\n② 공정가치 평가손익\n   상각후원가와 공정가치의 차이를 「기타포괄손익」으로 인식한다\n\n③ 처분 시\n   기타포괄손익누계액을 「당기손익으로 재분류조정」한다\n   (지분상품과 달리 채무상품은 재분류조정을 한다)</span>\n<p>곧 <b>“이자수익은 상각후원가처럼, 재무상태표는 공정가치로,\n차액은 기타포괄손익에 담아 두었다가 팔 때 쏟아 낸다”</b>는 구조이다.</p>\n\n<h4>Ⅱ. 유효이자율법 상각표 (시장이자율 12%)</h4>\n<span class=\"tb\">연도   기초상각후원가   이자수익(12%)   현금이자   상각액   기말상각후원가\n\n20×1      95,196          11,424       10,000    1,424      96,620\n20×2      96,620          11,594       10,000    1,594      98,214\n\n  20×1  95,196 × 12% = 11,423.5  →  11,424\n  20×2  96,620 × 12% = 11,594.4  →  11,594</span>\n\n<h3>(1) 20×1년 포괄손익계산서에 당기손익으로 인식될 금액 (5점)</h3>\n<span class=\"tb\">이자수익                                  11,424  (이익)\n\n공정가치 평가\n  상각후원가                              96,620\n  공정가치                                94,000\n  ────────────────────────────────────────────\n  평가손실                                 2,620\n  →  「기타포괄손익」으로 인식한다\n     당기손익이 아니다</span>\n\n<h4>답 (1) : 이익 ￦11,424</h4>\n<span class=\"tb\">20×1년 회계처리\n\n① 취득\n   (차) FVOCI금융자산   95,196\n       (대) 현금               95,196\n\n② 이자수익\n   (차) 현금            10,000\n       FVOCI금융자산     1,424\n       (대) 이자수익            11,424\n\n③ 공정가치 평가\n   (차) 금융자산평가손실(OCI)  2,620\n       (대) FVOCI금융자산            2,620\n\n   20×1년 말 장부금액 = 94,000 (공정가치)\n   기타포괄손익누계액 = △2,620</span>\n\n<h3>(2) 20×2년 포괄손익계산서에 당기손익으로 인식될 금액 (5점)</h3>\n\n<h4>Ⅰ. 이자수익</h4>\n<span class=\"tb\">이자수익  96,620 × 12%                    =  11,594  (이익)</span>\n<p>이자수익은 <b>공정가치(94,000)가 아니라 상각후원가(96,620)</b>를 기준으로 계산한다.\n공정가치 평가는 <b>기타포괄손익에서만</b> 일어나고\n<b>이자수익 계산에는 영향을 주지 않는다</b>.</p>\n\n<h4>Ⅱ. 처분</h4>\n<span class=\"tb\">20×2년 말 상각후원가                        98,214\n20×2년 말 공정가치(= 매각금액)             101,000\n──────────────────────────────────────────────\n누적 평가이익(기타포괄손익누계액)            2,786\n\n  20×2년 중 기타포괄손익 변동\n    2,786 - (△2,620)  =  +5,406\n\n처분손익\n  매각금액 101,000 - 장부금액(공정가치) 101,000  =  0\n\n재분류조정\n  기타포괄손익누계액 2,786을 「당기손익으로 재분류」\n  →  금융자산처분이익  2,786  (이익)</span>\n\n<h4>Ⅲ. 20×2년 당기손익</h4>\n<span class=\"tb\">이자수익                                  + 11,594\n금융자산처분이익(재분류조정)               +  2,786\n──────────────────────────────────────────────\n당기손익                                  + 14,380\n\n  →  「이익 ￦14,380」</span>\n\n<h4>답 (2) : 이익 ￦14,380</h4>\n<span class=\"tb\">20×2년 회계처리\n\n① 이자수익\n   (차) 현금            10,000\n       FVOCI금융자산     1,594\n       (대) 이자수익            11,594\n\n② 처분 직전 공정가치 평가\n   (차) FVOCI금융자산    2,786\n       (대) 금융자산평가이익(OCI)  2,786\n   (누계액이 △2,620에서 +2,786으로 바뀌므로 당기 변동은 5,406)\n\n③ 처분 및 재분류조정\n   (차) 현금           101,000\n       (대) FVOCI금융자산       101,000\n\n   (차) 금융자산평가이익(OCI)  2,786\n       (대) 금융자산처분이익        2,786</span>\n\n<h4>Ⅳ. 왜 이런 결과가 나오는가 — 검산</h4>\n<span class=\"tb\">FVOCI 채무상품을 만기 전에 처분하면\n「전 기간의 당기손익 합계」는 상각후원가측정(AC)으로 분류했을 때와 「같다」.\n\n  AC로 분류했다면\n    20×1 이자수익                   11,424\n    20×2 이자수익                   11,594\n    20×2 처분이익  101,000 - 98,214 = 2,786\n    ──────────────────────────────────────\n    합계                            25,804\n\n  FVOCI로 분류한 경우\n    20×1 당기손익                   11,424\n    20×2 당기손익                   14,380\n    ──────────────────────────────────────\n    합계                            25,804   ○</span>\n<p><b>재분류조정이 있기 때문에</b> 두 분류의 <b>누적 당기손익이 일치</b>한다.\nFVOCI로 분류하면 <b>어느 해에 얼마가 잡히는가</b>만 달라질 뿐이다.</p>\n\n<h4>Ⅴ. 지분상품과의 차이 — 반드시 구분할 것</h4>\n<span class=\"tb\">                        채무상품 FVOCI      지분상품 FVOCI(선택)\n\n이자·배당               이자수익 → 당기손익  배당금수익 → 당기손익\n공정가치 평가손익        기타포괄손익         기타포괄손익\n처분 시 재분류조정        「한다」             「하지 않는다」\n                                            (이익잉여금으로 대체 가능)\n손상(기대신용손실)        「적용한다」          적용하지 않는다</span>\n", "keys": ["FVOCI 채무상품", "이자수익은 상각후원가 기준", "95,196 × 12% = 11,424", "96,620", "평가손익은 기타포괄손익", "당기손익 아니다", "11,594", "98,214", "누계액 2,786", "재분류조정", "금융자산처분이익 2,786", "14,380", "AC와 누적 당기손익 일치", "지분상품은 재분류조정 하지 않는다"], "law": ["K-IFRS 제1109호 금융상품", "K-IFRS 제1001호 재무제표 표시"]}}, {"no": 10, "body": "다음은 (주)한국의 영업활동과 부분 재무상태표의 일부이다. 주어진 자료\n를 이용하여 다음의 물음에 답하시오.\n부분 재무상태표\n구분 20×1년 초 20×1년 말\n매출채권 ￦10,000 ￦20,000\n손실충당금 ￦(2,000) ￦(3,000)\n재고자산 ￦60,000 ￦50,000\n매입채무 ￦10,000 ￦5,000\n미지급비용 ￦14,000 ￦12,000\n(주)한국이 20×1년도에 ￦70,000의 당기순이익과 ￦10,000의 감가상각비를\n보고했을 경우 (주)한국의 영업활동으로 인한 현금흐름은? (증감을 (+)/(-)로\n표시하시오.) (5점)", "sub": [5], "points": 5, "a": {"plan": "간접법은 당기순이익에서 출발해 비현금비용을 더하고 영업 관련 자산·부채의 증감을 반대로 붙인다. 손실충당금을 빠뜨리지 않는다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">구분          20×1년 초    20×1년 말      증감\n\n매출채권       ￦10,000     ￦20,000     +10,000  (증가)\n손실충당금     ￦(2,000)    ￦(3,000)     -1,000  (증가)\n재고자산       ￦60,000     ￦50,000     -10,000  (감소)\n매입채무       ￦10,000      ￦5,000      -5,000  (감소)\n미지급비용     ￦14,000     ￦12,000      -2,000  (감소)\n\n당기순이익     ￦70,000\n감가상각비     ￦10,000</span>\n\n<h4>Ⅰ. 간접법의 구조</h4>\n<span class=\"tb\">당기순이익\n\n (+) 현금의 유출이 없는 비용   감가상각비, 무형자산상각비,\n                              손상차손, 대손상각비 등\n (-) 현금의 유입이 없는 수익   지분법이익, 사채상환이익 등\n\n (±) 영업활동과 관련된 자산·부채의 증감\n       자산이 늘면  (-)      돈이 자산으로 잠겼다\n       자산이 줄면  (+)      자산이 현금으로 풀렸다\n       부채가 늘면  (+)      아직 갚지 않았다\n       부채가 줄면  (-)      갚아 버렸다\n\n (±) 투자·재무활동에서 생긴 손익의 제거\n       유형자산처분손익, 사채상환손익 등\n\n= 영업활동으로 인한 현금흐름</span>\n\n<h4>Ⅱ. 계산</h4>\n<span class=\"tb\">당기순이익                                    70,000\n\n감가상각비 (현금유출 없는 비용)               +10,000\n\n매출채권의 증가        10,000 → 20,000        -10,000\n손실충당금의 증가       2,000 →  3,000        + 1,000\n재고자산의 감소        60,000 → 50,000        +10,000\n매입채무의 감소        10,000 →  5,000        - 5,000\n미지급비용의 감소      14,000 → 12,000        - 2,000\n──────────────────────────────────────────────────\n영업활동으로 인한 현금흐름                    74,000</span>\n\n<h4>답 : (+) ￦74,000</h4>\n\n<h4>Ⅲ. 손실충당금은 왜 (+)인가</h4>\n<p>가장 실수가 잦은 항목이다.</p>\n<span class=\"tb\">손실충당금이 2,000에서 3,000으로 「1,000 늘었다」는 것은\n그해에 「대손상각비 1,000」을 비용으로 잡았다는 뜻이다.\n\n대손상각비는 「현금이 나가지 않는 비용」이므로\n당기순이익에 다시 더해 주어야 한다.\n\n  →  +1,000</span>\n<p>다르게 보면, <b>매출채권을 순액으로 보는 방법</b>도 같은 답을 준다.</p>\n<span class=\"tb\">매출채권 순액\n  기초  10,000 - 2,000 =  8,000\n  기말  20,000 - 3,000 = 17,000\n  증가                    9,000   →  -9,000\n\n  총액으로 나누어 보면\n    매출채권 증가  -10,000\n    손실충당금 증가 + 1,000\n    ─────────────────────\n                   - 9,000   ○  같다</span>\n\n<h4>Ⅳ. 각 항목의 뜻을 풀어 보면</h4>\n<span class=\"tb\">매출채권 증가 10,000\n  매출은 잡았으나 아직 돈을 받지 못하였다  →  현금이 그만큼 적다\n\n재고자산 감소 10,000\n  전기에 사 둔 재고를 팔았다\n  → 당기 매입 없이 매출원가가 잡혔으므로 현금이 그만큼 남았다\n\n매입채무 감소 5,000\n  외상값을 갚았다  →  현금이 나갔다\n\n미지급비용 감소 2,000\n  밀린 비용을 치렀다  →  현금이 나갔다</span>\n\n<h4>Ⅴ. 참고 — 직접법으로 검산할 수는 없다</h4>\n<p>매출액·매출원가 등의 자료가 없으므로\n이 문제는 <b>간접법으로만</b> 풀 수 있다.\n간접법은 <b>손익계산서의 세부 항목을 몰라도\n당기순이익과 재무상태표의 증감만으로</b> 영업현금흐름을 구할 수 있다는 것이 장점이다.</p>\n<p>K-IFRS는 <b>직접법을 권장</b>하지만,\n<b>실무에서는 간접법이 압도적으로 많이 쓰인다</b>.</p>\n", "keys": ["간접법", "당기순이익 70,000", "감가상각비 +10,000", "매출채권 증가 -10,000", "손실충당금 증가 +1,000", "대손상각비는 비현금비용", "재고자산 감소 +10,000", "매입채무 감소 -5,000", "미지급비용 감소 -2,000", "74,000"], "law": ["K-IFRS 제1007호 현금흐름표"]}}, {"no": 11, "body": "(주)한국은 실제원가계산을 적용하고 있으며, 20×1년 기초 및 기말의 재고\n자산금액은 다음과 같다. 20×1년의 기초(기본)원가는 ￦420,000이고, 가공\n(전환)원가의 50%가 제조간접원가이며, 직접재료매입액은 ￦66,000이다.\n(주)한국의 20×1년 매출원가는? (5점)\n구분 기초 기말\n직접재료 ￦44,000 ￦20,000\n재 공 품 ￦47,000 ￦30,000\n제 품 ￦20,000 ￦58,000", "sub": [5], "points": 5, "a": {"plan": "직접재료원가를 먼저 뽑고 기본원가에서 직접노무원가를 떼어 낸다. 가공원가의 절반이 제조간접원가라는 말은 곧 노무와 간접이 같다는 뜻이다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">기초(기본)원가                    ￦420,000\n가공(전환)원가의 50%가 제조간접원가\n직접재료매입액                     ￦66,000\n\n구분        기초        기말\n직접재료   ￦44,000    ￦20,000\n재공품     ￦47,000    ￦30,000\n제품       ￦20,000    ￦58,000</span>\n<span class=\"tb\">용어의 확인\n\n  기본원가(기초원가, prime cost)   = 직접재료원가 + 직접노무원가\n  가공원가(전환원가, conversion)   = 직접노무원가 + 제조간접원가\n\n  → 「직접노무원가」가 두 곳에 겹쳐 들어간다.</span>\n\n<h4>Ⅰ. 1단계 — 직접재료원가</h4>\n<span class=\"tb\">기초 직접재료                       44,000\n직접재료매입액                    + 66,000\n기말 직접재료                     - 20,000\n──────────────────────────────────────────\n직접재료원가(사용액)                90,000</span>\n\n<h4>Ⅱ. 2단계 — 직접노무원가</h4>\n<span class=\"tb\">기본원가 = 직접재료원가 + 직접노무원가\n\n420,000 = 90,000 + 직접노무원가\n직접노무원가 = 330,000</span>\n\n<h4>Ⅲ. 3단계 — 제조간접원가와 가공원가</h4>\n<span class=\"tb\">「가공(전환)원가의 50%가 제조간접원가」이므로\n가공원가의 나머지 50%가 직접노무원가이다.\n\n  →  직접노무원가 = 제조간접원가\n\n제조간접원가 = 330,000\n\n가공원가 = 330,000 + 330,000 = 660,000</span>\n\n<h4>Ⅳ. 4단계 — 당기총제조원가</h4>\n<span class=\"tb\">직접재료원가                        90,000\n직접노무원가                      330,000\n제조간접원가                      330,000\n──────────────────────────────────────────\n당기총제조원가                    750,000\n\n(= 직접재료원가 90,000 + 가공원가 660,000)</span>\n\n<h4>Ⅴ. 5단계 — 당기제품제조원가</h4>\n<span class=\"tb\">기초재공품                          47,000\n당기총제조원가                   + 750,000\n기말재공품                        - 30,000\n──────────────────────────────────────────\n당기제품제조원가                   767,000</span>\n\n<h4>Ⅵ. 6단계 — 매출원가</h4>\n<span class=\"tb\">기초제품                            20,000\n당기제품제조원가                 + 767,000\n기말제품                          - 58,000\n──────────────────────────────────────────\n매출원가                           729,000</span>\n\n<h4>답 : ￦729,000</h4>\n\n<h4>Ⅶ. 원가의 흐름을 한눈에</h4>\n<span class=\"tb\">   직접재료          재공품            제품\n ┌──────────┐   ┌──────────┐   ┌──────────┐\n │기초 44,000│   │기초 47,000│   │기초 20,000│\n │매입 66,000│──▶│DM   90,000│──▶│제조원가   │──▶ 매출원가\n │           │   │DL  330,000│   │   767,000 │      729,000\n │기말 20,000│   │OH  330,000│   │기말 58,000│\n └──────────┘   │기말 30,000│   └──────────┘\n                 └──────────┘\n\n  세 개의 상자를 「기초 + 들어온 것 - 기말 = 나간 것」으로\n  차례로 통과시키면 된다.</span>\n\n<h4>Ⅷ. 흔한 실수</h4>\n<span class=\"tb\">① 「직접재료매입액」을 그대로 직접재료원가로 쓴다\n   → 기초·기말 재고를 조정해야 「사용액」이 나온다\n\n② 「가공원가의 50%가 제조간접원가」를\n   「기본원가의 50%」로 잘못 읽는다\n\n③ 직접노무원가를 두 번 더한다\n   당기총제조원가 = 기본원가 + 가공원가 (×)\n                  = 420,000 + 660,000 = 1,080,000  (오답)\n   → 직접노무원가 330,000이 이중으로 들어간다\n   당기총제조원가 = 기본원가 + 제조간접원가 (○)\n                  = 420,000 + 330,000 = 750,000</span>\n", "keys": ["기본원가 = DM + DL", "가공원가 = DL + OH", "직접재료원가 90,000", "직접노무원가 330,000", "가공원가의 50%가 제조간접원가", "DL = OH", "제조간접원가 330,000", "당기총제조원가 750,000", "당기제품제조원가 767,000", "매출원가 729,000", "직접노무원가 이중계상 주의"], "law": []}}, {"no": 12, "body": "(주)한국은 종합원가계산을 사용하며 평균법을 적용한다. 제품은 제1공정\n을 거쳐 제2공정에서 최종 완성되며, 제2공정의 20×1년 7월의 완성품\n환산량 단위당 원가는 다음과 같다. 제2공정에서 직접재료는 가공(전환)\n원가 완성도 60% 시점에서 투입되며, 가공(전환)원가는 제2공정 전체를\n통해 균등하게 발생한다. 7월 말 제2공정의 재공품은 2,000개이며, 가공(전환)\n원가의 완성도는 50%이다. 제2공정의 기말재공품원가는? (5점)\n구분 완성품환산량 단위당 원가\n직접재료원가 ￦200\n전공정(제1공정)원가 ￦600\n가공(전환)원가 ￦250", "sub": [5], "points": 5, "a": {"plan": "완성도 50%가 재료 투입시점 60%에 못 미친다. 재료는 0개, 전공정은 100%, 가공은 50%로 환산량을 세면 끝난다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">제2공정, 종합원가계산, 평균법\n\n완성품환산량 단위당 원가\n  직접재료원가          ￦200\n  전공정(제1공정)원가   ￦600\n  가공(전환)원가        ￦250\n\n제2공정의 직접재료는 「가공원가 완성도 60% 시점」에서 투입\n가공원가는 제2공정 전체를 통해 균등하게 발생\n\n7월 말 제2공정 재공품  2,000개, 가공원가 완성도 50%</span>\n\n<h4>Ⅰ. 원가요소별 완성도의 판정</h4>\n\n<h4>1. 전공정원가 — 100%</h4>\n<span class=\"tb\">전공정원가는 제1공정에서 완성되어 제2공정에 「넘어오는 순간」\n전액이 투입된 것으로 본다.\n\n제2공정에 있는 이상 진척도와 관계없이 언제나 100%이다.\n\n완성품환산량  2,000개 × 100%  =  2,000개</span>\n\n<h4>2. 직접재료원가 — 0%</h4>\n<span class=\"tb\">직접재료는 「가공원가 완성도 60% 시점」에서 「한꺼번에」 투입된다.\n\n기말재공품의 가공원가 완성도  =  50%\n\n  50% < 60%\n  →  아직 재료가 투입되지 않았다\n\n완성품환산량  2,000개 × 0%   =      0개</span>\n<p><b>이 문제의 핵심</b>이다.\n<b>특정 시점 투입 재료</b>는 그 시점을 <b>지났는가 지나지 않았는가</b>로만 갈린다.\n50%는 60%에 <b>10%포인트가 모자라므로 전혀 투입되지 않았다</b>.\n<b>비례로 나누어 넣으면 안 된다.</b></p>\n\n<h4>3. 가공원가 — 50%</h4>\n<span class=\"tb\">가공원가는 공정 전체에 걸쳐 「균등하게」 발생하므로\n진척도가 곧 완성도이다.\n\n완성품환산량  2,000개 × 50%  =  1,000개</span>\n\n<h4>Ⅱ. 기말재공품원가의 계산</h4>\n<span class=\"tb\">원가요소       완성품환산량        단위당 원가        금액\n\n전공정원가    2,000개 × 100% = 2,000개   ×  ￦600  = 1,200,000\n직접재료원가  2,000개 ×   0% =     0개   ×  ￦200  =         0\n가공원가      2,000개 ×  50% = 1,000개   ×  ￦250  =   250,000\n────────────────────────────────────────────────────────────\n기말재공품원가                                       1,450,000</span>\n\n<h4>답 : ￦1,450,000</h4>\n\n<h4>Ⅲ. 만약 완성도가 70%였다면</h4>\n<span class=\"tb\">직접재료는 60% 시점을 「지났으므로」 전액 투입되었다.\n\n전공정원가   2,000 × 100% × 600  = 1,200,000\n직접재료원가 2,000 × 100% × 200  =   400,000   ← 100%가 된다\n가공원가     2,000 ×  70% × 250  =   350,000\n────────────────────────────────────────────\n                                    1,950,000\n\n  → 완성도가 20%포인트 오르는 것만으로\n    재료원가 400,000이 통째로 더 들어온다.</span>\n\n<h4>Ⅳ. 재료 투입시점별 완성도 정리</h4>\n<span class=\"tb\">공정 「초」에 전량 투입        →  언제나 100%\n공정 「전체」에 균등 투입      →  진척도와 같다\n「특정 시점」에 투입           →  그 시점을 지났으면 100%,\n                                 지나지 않았으면 0%\n공정 「말」에 투입             →  완성품만 100%, 재공품은 0%\n전공정원가                     →  언제나 100%</span>\n\n<h4>Ⅴ. 평균법이라는 조건은 여기서 왜 쓰이지 않는가</h4>\n<p><b>기말재공품원가</b>만을 묻고 있고\n<b>완성품환산량 단위당 원가가 이미 주어졌기</b> 때문이다.</p>\n<span class=\"tb\">평균법과 선입선출법은\n  「단위당 원가를 어떻게 구하는가」에서 갈린다.\n\n  평균법     (기초재공품원가 + 당기투입원가) ÷ 총완성품환산량\n  선입선출법  당기투입원가 ÷ 당기완성품환산량\n\n단위당 원가가 주어진 뒤에는\n기말재공품원가의 계산방법이 두 방법에서 같다.</span>\n", "keys": ["전공정원가는 언제나 100%", "특정 시점 투입", "50% < 60%", "직접재료 0%", "가공원가 50%", "환산량 2,000 / 0 / 1,000", "1,200,000", "250,000", "1,450,000", "비례배분하지 않는다"], "law": []}}, {"no": 13, "body": "(주)한국은 20×1년 1월 1일에 설립되었고, 20×1년과 20×2년의 제품 생산량\n및 판매량은 다음과 같으며, 원가흐름은 선입선출법을 적용한다. 20×1년\n전부원가계산에 의한 영업이익은 ￦34,000이며, 20×2년에 발생한 고정제조\n간접원가는 ￦133,000일 경우 다음의 물음에 답하시오. 단, 두 기간의 단위당\n판매가격, 단위당 변동제조원가 및 단위당 변동판매관리비는 동일하며, 재공품\n재고는 없다.\n구분 20×1년 20×2년\n생산량 3,000단위 3,800단위\n판매량 2,600단위 4,000단위\n변동원가계산 영업이익 ￦26,000 ￦50,000\n(1) 20×2년 기말제품에 포함된 고정제조간접원가는? (5점)\n(2) 20×2년 전부원가계산에 의한 영업이익은? (5점)", "sub": [5, 5], "points": 10, "a": {"plan": "두 방법의 이익 차이는 재고에 묻힌 고정제조간접원가의 차이뿐이다. 20×1년 차이로 단위당 고정비를 역산하는 것이 출발점이다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">구분                  20×1년        20×2년\n\n생산량               3,000단위     3,800단위\n판매량               2,600단위     4,000단위\n변동원가계산 영업이익  ￦26,000      ￦50,000\n\n20×1년 전부원가계산 영업이익  ￦34,000\n20×2년 고정제조간접원가       ￦133,000\n\n원가흐름은 선입선출법, 재공품 재고는 없다\n단위당 판매가격·변동제조원가·변동판매관리비는 두 기간 동일</span>\n\n<h4>Ⅰ. 재고수량의 흐름</h4>\n<span class=\"tb\">20×1년  기초 0 + 생산 3,000 - 판매 2,600  =  기말   400단위\n20×2년  기초 400 + 생산 3,800 - 판매 4,000  =  기말   200단위</span>\n\n<h4>Ⅱ. 두 방법의 이익 차이가 생기는 이유</h4>\n<span class=\"tb\">전부원가계산   고정제조간접원가를 「제품원가」에 넣는다\n               → 팔리지 않고 재고에 남으면 비용이 되지 않고 재고에 잠긴다\n\n변동원가계산   고정제조간접원가를 「기간비용」으로 전액 처리한다\n               → 팔리든 안 팔리든 그해에 다 비용이 된다\n\n전부원가계산 영업이익 - 변동원가계산 영업이익\n  = 기말재고에 포함된 고정제조간접원가\n  - 기초재고에 포함된 고정제조간접원가</span>\n\n<h4>Ⅲ. 20×1년 자료로 단위당 고정제조간접원가를 구한다</h4>\n<span class=\"tb\">20×1년 전부원가계산 영업이익            34,000\n20×1년 변동원가계산 영업이익          - 26,000\n────────────────────────────────────────────\n차이                                    8,000\n\n20×1년은 설립 첫해이므로 기초재고가 없다.\n따라서 이 차이는 「기말재고 400단위에 포함된 고정제조간접원가」이다.\n\n20×1년 단위당 고정제조간접원가\n  8,000 ÷ 400단위                    =  ￦20\n\n(참고) 20×1년 총 고정제조간접원가\n  3,000단위 × 20                     =  ￦60,000</span>\n\n<h4>Ⅳ. 20×2년 단위당 고정제조간접원가</h4>\n<span class=\"tb\">20×2년 고정제조간접원가              133,000\n20×2년 생산량                        3,800단위\n────────────────────────────────────────────\n단위당 고정제조간접원가  133,000 ÷ 3,800  =  ￦35</span>\n<p><b>고정제조간접원가 총액이 늘었을 뿐 아니라\n생산량으로 나눈 단위당 금액도 20에서 35로 올랐다.</b>\n문제가 <b>“변동제조원가는 동일”</b>이라고만 하고\n고정제조간접원가는 따로 준 이유이다.</p>\n\n<h3>(1) 20×2년 기말제품에 포함된 고정제조간접원가 (5점)</h3>\n<span class=\"tb\">원가흐름은 「선입선출법」이다.\n\n  20×2년 판매 4,000단위\n    = 기초재고 400단위(20×1년 생산분)\n    + 당기 생산분 3,600단위\n\n  20×2년 기말재고 200단위\n    = 당기(20×2년) 생산분\n\n따라서 기말재고에는 「20×2년의 단위당 고정제조간접원가」가 실린다.\n\n  200단위 × ￦35  =  ￦7,000</span>\n\n<h4>답 (1) : ￦7,000</h4>\n\n<h3>(2) 20×2년 전부원가계산에 의한 영업이익 (5점)</h3>\n<span class=\"tb\">전부원가계산 영업이익\n  = 변동원가계산 영업이익\n  + 기말재고에 포함된 고정제조간접원가\n  - 기초재고에 포함된 고정제조간접원가\n\n변동원가계산 영업이익                     50,000\n기말재고 고정제조간접원가  200 × 35    +   7,000\n기초재고 고정제조간접원가  400 × 20    -   8,000\n────────────────────────────────────────────\n전부원가계산 영업이익                    49,000</span>\n\n<h4>답 (2) : ￦49,000</h4>\n\n<h4>Ⅳ. 왜 전부원가계산 이익이 더 작아졌는가</h4>\n<span class=\"tb\">20×2년  생산 3,800 < 판매 4,000\n\n  → 재고가 400단위에서 200단위로 줄었다\n  → 지난해 재고에 잠겨 있던 고정제조간접원가 8,000이\n    올해 매출원가로 「풀려 나왔고」,\n    올해 잠긴 것은 7,000뿐이다\n  → 그 차이 1,000만큼 전부원가계산의 이익이 더 작다\n\n일반적으로\n  생산량 > 판매량 (재고 증가)  →  전부원가계산 이익이 「크다」\n  생산량 < 판매량 (재고 감소)  →  전부원가계산 이익이 「작다」\n  생산량 = 판매량              →  두 방법의 이익이 「같다」</span>\n\n<h4>Ⅴ. 검산 — 두 해를 합쳐 보면</h4>\n<span class=\"tb\">                     20×1년    20×2년     합계\n\n전부원가계산 이익     34,000    49,000    83,000\n변동원가계산 이익     26,000    50,000    76,000\n                     ─────────────────────────\n차이                   8,000    △1,000     7,000\n\n  = 20×2년 말 재고에 남아 있는 고정제조간접원가 7,000  ○\n\n  재고가 모두 팔려 없어지면 두 방법의 누적이익은 일치한다.\n  전부원가계산이 이익을 「만들어 내는 것」이 아니라\n  「어느 해로 옮기는 것」일 뿐이다.</span>\n\n<h4>Ⅵ. 실무·이론상의 시사</h4>\n<p>전부원가계산에서는 <b>생산량을 늘리기만 해도 이익이 커진다</b>.\n고정제조간접원가가 재고에 잠기기 때문이다.\n이를 <b>과잉생산 유인</b>이라 하며,\n<b>변동원가계산이 내부 성과평가에 쓰이는 이유</b>가 여기에 있다.</p>\n<p>다만 <b>외부보고용 재무제표</b>는\nK-IFRS 제1002호에 따라 <b>전부원가계산</b>으로 작성하여야 한다.</p>\n", "keys": ["전부원가계산", "변동원가계산", "이익 차이 = 기말재고 FOH - 기초재고 FOH", "20×1년 차이 8,000", "400단위", "단위당 20", "133,000 ÷ 3,800 = 35", "선입선출법", "기말 200단위", "7,000", "50,000 + 7,000 - 8,000", "49,000", "생산량 < 판매량이면 전부원가 이익이 작다", "과잉생산 유인"], "law": ["K-IFRS 제1002호 재고자산"]}}, {"no": 14, "body": "범용기계장치를 이용하여 제품 A를 생산·판매하는 ㈜한국의 당기 예산자료는\n다음과 같다. (주)한국은 신규 거래처로부터 제품 A 3,000단위를 판매할 수\n있는 특별주문을 받았으며, 단위당 변동제조원가와 단위당 변동판매관리비는\n변화가 없다. 특별주문 수락 시 기존제품의 정규시장 판매를 일부 포기해야 한다.\n다음의 물음에 답하시오. 단, 특별주문은 전량 수락하든지 기각해야 한다.\n구분 제품 A\n단위당 판매가격 ￦2,500\n단위당 변동제조원가 ￦1,200\n단위당 변동판매관리비 ￦400\n연간 정규시장 판매수량 8,000단위\n연간 최대생산량 10,000단위\n(1) (주)한국이 특별주문을 수락할 경우 기회비용은? (5점)\n(2) (주)한국이 특별주문을 수락할 경우 제시할 수 있는 단위당 최소판매\n가격은? (5점)", "sub": [5, 5], "points": 10, "a": {"plan": "여유조업도 2,000단위를 먼저 세고 모자라는 1,000단위만큼만 정규판매를 포기시킨다. 기회비용은 그 1,000단위의 공헌이익이다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">단위당 판매가격            ￦2,500\n단위당 변동제조원가        ￦1,200\n단위당 변동판매관리비        ￦400\n연간 정규시장 판매수량     8,000단위\n연간 최대생산량           10,000단위\n\n특별주문  3,000단위\n  · 단위당 변동제조원가와 변동판매관리비는 변화가 없다\n  · 전량 수락하든지 기각하여야 한다</span>\n\n<h4>Ⅰ. 단위당 공헌이익</h4>\n<span class=\"tb\">단위당 판매가격                     2,500\n단위당 변동제조원가              -  1,200\n단위당 변동판매관리비            -    400\n────────────────────────────────────────\n단위당 공헌이익                     900</span>\n\n<h4>Ⅱ. 여유조업도의 확인</h4>\n<span class=\"tb\">연간 최대생산량                  10,000단위\n연간 정규시장 판매수량         -  8,000단위\n────────────────────────────────────────\n여유조업도                       2,000단위\n\n특별주문                         3,000단위\n여유조업도로 충당               - 2,000단위\n────────────────────────────────────────\n정규판매를 포기하여야 할 수량    1,000단위</span>\n<p>특별주문 3,000단위를 <b>전량 수락</b>하여야 하므로,\n<b>모자라는 1,000단위만큼 정규시장 판매를 줄여야</b> 한다.</p>\n\n<h3>(1) 특별주문을 수락할 경우의 기회비용 (5점)</h3>\n<span class=\"tb\">기회비용\n  = 특별주문을 수락함으로써 「포기하게 되는」\n    정규시장 판매분의 공헌이익\n\n  1,000단위 × 단위당 공헌이익 900  =  ￦900,000</span>\n\n<h4>답 (1) : ￦900,000</h4>\n<p><b>포기하는 것은 ‘매출액’이 아니라 ‘공헌이익’</b>이다.\n정규판매를 줄이면 그만큼의 <b>변동원가도 함께 절약</b>되기 때문이다.</p>\n<span class=\"tb\">흔한 오답\n  1,000단위 × 판매가격 2,500 = 2,500,000  (×)\n  → 변동원가 1,600을 빼지 않았다</span>\n<p><b>고정원가</b>는 특별주문을 받든 안 받든 그대로이므로\n기회비용에 들어가지 않는다.</p>\n\n<h3>(2) 제시할 수 있는 단위당 최소판매가격 (5점)</h3>\n\n<h4>Ⅰ. 최소판매가격의 조건</h4>\n<span class=\"tb\">특별주문으로 얻는 증분수익 ≥ 특별주문으로 생기는 증분원가\n\n증분원가 = 특별주문 자체의 변동원가 + 기회비용</span>\n\n<h4>Ⅱ. 계산</h4>\n<span class=\"tb\">특별주문의 변동원가\n  3,000단위 × (변동제조원가 1,200 + 변동판매관리비 400)\n  = 3,000 × 1,600                        = 4,800,000\n\n기회비용                                 =   900,000\n──────────────────────────────────────────────────\n총 증분원가                              = 5,700,000\n\n단위당 최소판매가격\n  5,700,000 ÷ 3,000단위                  =    ￦1,900</span>\n\n<h4>답 (2) : ￦1,900</h4>\n\n<h4>Ⅲ. 단위당으로 바로 세워도 같다</h4>\n<span class=\"tb\">단위당 최소판매가격\n  = 단위당 변동원가 + 단위당 기회비용\n\n  단위당 변동원가    1,200 + 400              = 1,600\n  단위당 기회비용    900,000 ÷ 3,000단위      =   300\n  ─────────────────────────────────────────────────\n                                                1,900</span>\n<p>기회비용을 <b>포기하는 1,000단위가 아니라\n주문 전체인 3,000단위로 나눈다</b>는 점을 놓치지 않아야 한다.\n가격은 <b>주문 3,000단위 전부에</b> 매기는 것이기 때문이다.</p>\n\n<h4>Ⅳ. 검증 — 1,900에 팔면 이익이 그대로인가</h4>\n<span class=\"tb\">특별주문을 수락한 경우\n\n  특별주문 공헌이익  3,000 × (1,900 - 1,600)  =    900,000\n  정규판매 공헌이익  7,000 × 900              =  6,300,000\n  ─────────────────────────────────────────────────────\n  합계                                          7,200,000\n\n특별주문을 기각한 경우\n\n  정규판매 공헌이익  8,000 × 900              =  7,200,000\n\n  →  같다.  1,900이 「손해도 이익도 아닌 경계선」이다.  ○</span>\n\n<h4>Ⅴ. 만약 여유조업도가 충분했다면</h4>\n<span class=\"tb\">최대생산량이 11,000단위 이상이었다면\n정규판매를 포기할 필요가 없으므로 기회비용이 0이다.\n\n  단위당 최소판매가격 = 1,600</span>\n<p><b>여유조업도가 있으면 변동원가만 넘기면 되고,\n없으면 포기하는 공헌이익까지 받아야 한다.</b>\n특별주문 의사결정의 전부가 이 한 문장에 담겨 있다.</p>\n\n<h4>Ⅵ. 계산 밖에서 함께 살필 것</h4>\n<span class=\"tb\">· 기존 거래처가 알게 되어 「정규가격의 인하 압력」이 생기지 않는가\n· 특별주문이 「일회성」인가, 반복될 것인가\n· 정규시장 고객을 잃어 「장기 수익성」이 나빠지지 않는가\n· 특별주문에만 드는 추가 고정원가(설비, 금형 등)는 없는가\n· 「독점규제 및 공정거래에 관한 법률」상 부당한 차별취급에 해당하지 않는가</span>\n", "keys": ["단위당 공헌이익 900", "여유조업도 2,000단위", "포기수량 1,000단위", "기회비용 900,000", "공헌이익 기준", "고정원가는 무관", "증분원가 4,800,000", "5,700,000 ÷ 3,000", "최소판매가격 1,900", "단위당 변동원가 1,600 + 단위당 기회비용 300", "여유조업도가 충분하면 1,600"], "law": []}}, {"no": 15, "body": "(주)한국은 A사업부와 B사업부가 있다. B사업부는 제품 Y(단위당 판매\n가격: ￦200, 단위당 변동원가: ￦120, 단위당 고정원가: ￦30)와 부품 M을\n생산·판매한다. A사업부는 제품 X를 생산하는데 필요한 부품 M을\n외부업체로부터 단위당 ￦95에 구입할 수 있다. A사업부는 부품 M\n600단위를 B사업부로부터 대체받는 것을 고려하고 있다. B사업부가\n부품 M 600단위를 생산 및 대체하기 위해서는 단위당 변동제조원가\n￦40과 단위당 운송비 ￦10이 발생하며, 기존시장에서 제품 Y의 판매량을\n300단위만큼 감소시켜야 한다. B사업부가 대체거래를 수락할 수 있는\n부품 M의 단위당 최소사내대체가격은? (5점)", "sub": [5], "points": 5, "a": {"plan": "최소대체가격은 ‘증분원가 + 기회비용’ 하나다. 기존 판매 300단위 감소분의 공헌이익을 대체수량 600단위로 나누어 얹는다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">B사업부 — 제품 Y\n  단위당 판매가격    ￦200\n  단위당 변동원가    ￦120\n  단위당 고정원가     ￦30\n\nB사업부 — 부품 M을 A사업부에 600단위 대체하는 경우\n  단위당 변동제조원가  ￦40\n  단위당 운송비        ￦10\n  기존 제품 Y의 판매량을 「300단위」 감소시켜야 한다\n\nA사업부  부품 M을 외부에서 단위당 ￦95에 구입할 수 있다</span>\n\n<h4>Ⅰ. 사내대체가격 결정의 기본 틀</h4>\n<span class=\"tb\">공급사업부의 「최소대체가격」\n  = 단위당 증분원가(변동원가) + 단위당 기회비용\n\n수요사업부의 「최대대체가격」\n  = Min[ 외부구입가격 , 대체품을 사용하여 얻는 순실현가치 ]\n\n  최소대체가격 ≤ 대체가격 ≤ 최대대체가격\n  인 구간이 있어야 대체거래가 성립한다.</span>\n<p><b>고정원가는 대체 여부와 관계없이 발생</b>하므로\n최소대체가격에 넣지 않는다.\n문제가 준 <b>제품 Y의 단위당 고정원가 ￦30</b>은 <b>함정</b>이다.</p>\n\n<h4>Ⅱ. 1단계 — 단위당 증분원가</h4>\n<span class=\"tb\">단위당 변동제조원가                     40\n단위당 운송비                        +  10\n────────────────────────────────────────\n단위당 증분원가                         50</span>\n<p><b>운송비도 대체를 하기 때문에 새로 드는 원가</b>이므로 포함한다.</p>\n\n<h4>Ⅲ. 2단계 — 기회비용</h4>\n<span class=\"tb\">제품 Y의 단위당 공헌이익\n  판매가격 200 - 변동원가 120          =  80\n\n포기하는 제품 Y                      300단위\n\n기회비용 총액  300단위 × 80           =  24,000\n\n단위당 기회비용\n  24,000 ÷ 600단위(대체수량)          =  40</span>\n<p><b>기회비용을 ‘포기하는 300단위’가 아니라\n‘대체하는 600단위’로 나눈다.</b>\n대체가격은 <b>600단위 전부에 매기는 값</b>이기 때문이다.</p>\n\n<h4>Ⅳ. 3단계 — 최소사내대체가격</h4>\n<span class=\"tb\">단위당 증분원가                         50\n단위당 기회비용                      +  40\n────────────────────────────────────────\n단위당 최소사내대체가격                 90</span>\n\n<h4>답 : ￦90</h4>\n\n<h4>Ⅴ. 대체거래는 성립하는가</h4>\n<span class=\"tb\">B사업부의 최소대체가격                  ￦90\nA사업부의 최대대체가격(외부구입가)      ￦95\n\n  90 ≤ 대체가격 ≤ 95\n\n  → 「￦90 ~ ￦95」 구간에서 대체가격이 정해지면\n    두 사업부 모두 이득을 본다.\n  → 회사 전체로도 유리하다.</span>\n<span class=\"tb\">회사 전체의 이득 (단위당 5, 총 3,000원)\n\n  외부에서 사는 경우   600단위 × 95      =  57,000 유출\n  사내에서 만드는 경우\n    증분원가          600단위 × 50      =  30,000\n    기회비용          300단위 × 80      =  24,000\n    ────────────────────────────────────────────\n                                           54,000\n\n  차이                                       3,000  절약</span>\n\n<h4>Ⅵ. 만약 여유조업도가 있었다면</h4>\n<span class=\"tb\">제품 Y의 판매를 줄이지 않아도 되었다면 기회비용이 0이므로\n\n  최소대체가격 = 50\n\n  → 50 ~ 95의 훨씬 넓은 구간에서 대체가 성립한다.</span>\n<p><b>여유조업도의 유무가 최소대체가격을 결정한다</b>는 점은\n앞의 특별주문 문제와 완전히 같은 원리이다.</p>\n\n<h4>Ⅶ. 함정 정리</h4>\n<span class=\"tb\">① 제품 Y의 단위당 고정원가 30을 더한다\n   → 고정원가는 대체 여부와 무관하게 발생한다.  넣지 않는다.\n\n② 부품 M의 운송비 10을 빠뜨린다\n   → 대체 때문에 새로 드는 원가이므로 포함한다.\n\n③ 기회비용을 300단위로 나눈다\n   → 24,000 ÷ 300 = 80이 되어 최소대체가격이 130이 된다.\n     그러면 외부구입가 95보다 높아져\n     「대체가 성립하지 않는다」는 잘못된 결론에 이른다.\n\n④ 제품 Y의 판매가격 200을 기회비용으로 본다\n   → 포기하는 것은 매출이 아니라 「공헌이익」이다.</span>\n", "keys": ["최소대체가격 = 증분원가 + 기회비용", "고정원가는 제외", "변동제조원가 40 + 운송비 10 = 50", "제품 Y 공헌이익 80", "300단위 × 80 = 24,000", "600단위로 나눈다", "단위당 기회비용 40", "최소대체가격 90", "외부구입가 95", "대체거래 성립", "회사 전체 3,000 절약"], "law": []}}]}, {"round": 49, "subject": "해상보험의 이론과 실무", "track": "재물", "src": "49회_2차 해상보험.pdf", "chars": 5211, "digits": 470, "pts_ok": true, "q": [{"no": 1, "body": "선박 A와 선박 B가 공선으로 운항 중 짙은 안개로 인해 충돌하는 사고가\n발생하였다. 양 선박의 과실비율은 80% : 20% (선박 A가 불리)로 합의되었으며,\n양 선박의 손해액과 발생된 법률비용은 아래와 같다.\n손 해 내 역 선박 A 선박 B\n손해액\n선체손상 US$ 250,000 US$ 1,200,000\n불가동손실 100,000 800,000\n해상오염 150,000\nUS$ 500,000 US$ 2,000,000\n법률비용\n일반비용 US$ 20,000 US$ 20,000\n공격비용 10,000 10,000\n방어비용 20,000 20,000\nUS$ 50,000 US$ 50,000\n선박 A의 선박보험 가입 조건은 다음과 같으며, 법률비용에 대해서는 발생\n금액의 80%를 상호 인정하는 것으로 합의되었다.\n◯ 협정보험 가액 : US$ 1,000,000\n◯ 보험금액 : US$ 1,000,000\n◯ 보험조건 : Institute Time Clauses – Hulls (1/10/83) with\nClause 12 Deductible of US$ 30,000\n선박 A의 선박보험자가 지급해야 할 보험금을 산정하시오. (15점)", "sub": [15], "points": 15, "a": {"plan": "손해 항목을 담보·부담보로 먼저 가른다. 자기 선박의 불가동손실과 오염은 빠지고 상대선의 불가동손실은 들어온다. 3/4을 붙인 뒤 공제액을 한 번 뺀다.", "ans": "\n<h4>0. 자료의 정리</h4>\n<span class=\"tb\">과실비율   선박 A 80%  :  선박 B 20%\n\n손해내역                선박 A          선박 B\n  선체손상          US$   250,000    US$ 1,200,000\n  불가동손실              100,000          800,000\n  해상오염                150,000                -\n  ──────────────────────────────────────────────\n                    US$   500,000    US$ 2,000,000\n\n법률비용\n  일반비용          US$    20,000    US$    20,000\n  공격비용                 10,000           10,000\n  방어비용                 20,000           20,000\n  ──────────────────────────────────────────────\n                    US$    50,000    US$    50,000\n  → 발생금액의 80%를 상호 인정하기로 합의\n\n선박 A의 보험\n  협정보험가액  US$ 1,000,000\n  보험금액      US$ 1,000,000\n  보험조건      ITC-Hulls (1/10/83), Clause 12 공제액 US$ 30,000</span>\n\n<h4>Ⅰ. 담보 여부의 판정</h4>\n\n<h4>1. 자기 선박(A)의 손해</h4>\n<span class=\"tb\">선체손상 250,000\n  Clause 6(위험)에 따른 「분손(particular average)」          담보 ○\n\n불가동손실 100,000\n  선박보험은 「선박 자체의 물적 손해」를 담보한다.\n  운항수익의 상실은 담보하지 않으며\n  별도의 「불가동손실보험(Loss of Hire)」에서 담보한다.    담보 ×\n\n해상오염 150,000\n  Clause 8.4.5는 「오염(pollution) 또는 오탁(contamination)」을\n  충돌배상책임에서 제외한다.\n  선체보험 본체에서도 담보하지 않으며 「P&I」의 영역이다.   담보 ×</span>\n\n<h4>2. 상대선(B)에 대한 충돌배상책임 — Clause 8 (3/4ths Collision Liability)</h4>\n<p>ITC-Hulls Clause 8.1은 보험자가\n<b>다음의 손해에 대한 배상금의 3/4</b>을 보상한다고 정한다.</p>\n<span class=\"tb\">8.1.1  다른 선박 또는 「다른 선박에 실린 재물」의 멸실·손상\n8.1.2  다른 선박 또는 그에 실린 재물의\n       「지연(delay) 또는 사용의 상실(loss of use)」\n8.1.3  다른 선박 또는 그에 실린 재물의\n       공동해손·구조·계약구조</span>\n<span class=\"tb\">따라서 상대선 B의 손해는\n\n  선체손상    1,200,000   →  8.1.1  담보 ○\n  불가동손실    800,000   →  8.1.2  담보 ○\n  ──────────────────────────────────────────\n              2,000,000        전액 담보 대상</span>\n<p><b>여기가 이 문제의 핵심이다.</b></p>\n<span class=\"tb\">「불가동손실」은\n  자기 선박의 것    →  선박보험이 담보하지 않는다\n  상대선의 것        →  8.1.2에 따라 「3/4 RDC로 담보한다」\n\n  같은 이름의 손해인데 누구의 것이냐에 따라 정반대가 된다.</span>\n\n<h4>3. 법률비용 — Clause 8.3</h4>\n<p><b>“보험자는 또한 피보험자가 <u>책임을 다투거나 책임을 제한하기 위한 절차를 밟는 데</u>\n지출하였거나 지출을 강요당할 수 있는 법률비용의 <u>3/4</u>을,\n보험자의 사전 서면동의를 얻은 경우에 지급한다.”</b></p>\n<span class=\"tb\">인정되는 법률비용  50,000 × 80%  =  40,000</span>\n\n<h4>Ⅱ. 충돌배상책임액의 산정 — 교차책임주의</h4>\n<p>ITC-Hulls Clause 8.1 단서는\n<b>쌍방과실 충돌의 경우 보험자의 보상액을\n<u>교차책임(cross-liabilities)의 원칙</u>에 따라 계산</b>하도록 정한다.</p>\n<span class=\"tb\">A가 B에게 지는 배상책임\n  B의 손해 2,000,000 × A의 과실 80%      =  1,600,000\n\nB가 A에게 지는 배상책임\n  A의 손해   500,000 × B의 과실 20%      =    100,000\n\n  (단일책임주의로 정산하면 A가 B에게 1,500,000을 지급하나,\n   보험자의 보상액은 「교차책임」 기준으로 계산한다.\n   교차책임 방식이 피보험자에게 유리하다.)</span>\n\n<h4>Ⅲ. 지급보험금의 산정</h4>\n<span class=\"tb\">① 자기 선박의 선체손상 (분손)                     250,000\n\n② 충돌배상책임 (Clause 8, 3/4ths RDC)\n     1,600,000 × 3/4                              1,200,000\n\n③ 법률비용 (Clause 8.3, 3/4)\n     (50,000 × 80%) × 3/4                            30,000\n   ────────────────────────────────────────────────────────\n   소계                                            1,480,000\n\n④ 공제액 (Clause 12)                              - 30,000\n   ────────────────────────────────────────────────────────\n   지급보험금                                  US$ 1,450,000</span>\n\n<h4>공제액을 한 번만 빼는 이유</h4>\n<p>Clause 12.1은 <b>“1사고 또는 1사건에서 생긴 모든 청구\n(Clause 8, 11, 13에 따른 청구를 포함한다)의 <u>합계액</u>이\n공제액을 초과하지 아니하면 보상하지 아니하며,\n초과하는 경우에는 그 공제액을 공제한다”</b>고 정한다.</p>\n<p>곧 <b>선체손상·충돌배상책임·법률비용을 모두 합친 뒤 한 번만</b> 공제한다.\n항목마다 30,000씩 빼면 틀린다.</p>\n<p>다만 Clause 12.2에 따라 <b>전손·추정전손·손해방지비용·구조비 청구</b>에는\n공제액을 적용하지 않는다.</p>\n\n<h4>Ⅳ. 한도의 확인</h4>\n<span class=\"tb\">Clause 8.2\n  「1회의 충돌에 관한 보험자의 Clause 8상의 책임은\n   선박 협정보험가액의 3/4을 초과하지 아니한다」\n\n  1,000,000 × 3/4  =  750,000\n\n  그런데 위에서 계산한 충돌배상책임 보상액은 1,200,000이다.</span>\n<p><b>여기서 한 번 더 걸린다.</b>\nClause 8.2의 한도를 적용하면 충돌배상책임 보상액은\n<b>750,000으로 제한</b>된다.</p>\n<span class=\"tb\">한도를 적용한 경우\n\n① 선체손상                                        250,000\n② 충돌배상책임  Min[1,200,000 , 750,000]           750,000\n③ 법률비용                                          30,000\n   ────────────────────────────────────────────────────────\n   소계                                            1,030,000\n④ 공제액                                          - 30,000\n   ────────────────────────────────────────────────────────\n   지급보험금                                  US$ 1,000,000</span>\n<p>Clause 8.2의 한도를 적용하면 <b>US$ 1,000,000</b>,\n적용하지 않으면 <b>US$ 1,450,000</b>이다.</p>\n<p><b>약관 문언에 충실하면 한도를 적용하여야 한다.</b>\n협정보험가액 1,000,000짜리 선박이\n2,000,000의 손해를 낸 상대선에 배상하는 사안이므로\n<b>3/4 한도(750,000)에 걸리도록 설계된 문제</b>로 읽는 것이 옳다.</p>\n<p>답안에는 <b>Clause 8.2의 한도를 반드시 언급</b>하고\n<b>US$ 1,000,000</b>을 결론으로 제시하되,\n한도 적용 전 금액(1,450,000)도 함께 보여 주는 것이 안전하다.</p>\n\n<h4>Ⅴ. 담보되지 않는 손해는 어디로 가는가</h4>\n<span class=\"tb\">자기 선박의 불가동손실 100,000\n  →  Loss of Hire 보험 (별도 가입 시)\n\n자기 선박의 해상오염 150,000\n  →  P&I 보험 (선주상호보험조합)\n\n충돌배상책임 중 1/4 (400,000)\n  →  P&I 보험 (RDC의 나머지 1/4을 담보한다)\n\nClause 8.2의 한도를 넘는 부분\n  →  P&I 보험 (Excess Collision Liability)\n\n방어법률비용의 1/4\n  →  P&I 보험</span>\n<p>선박보험(H&M)과 P&I는 <b>서로 빈틈을 메우도록 짜여 있다</b>.\n이 문제는 그 경계선을 묻고 있다.</p>\n", "keys": ["ITC-Hulls 1/10/83", "자기 선박 불가동손실 부담보", "Loss of Hire", "해상오염 Clause 8.4.5 제외", "P&I", "Clause 8.1.2 상대선의 loss of use 담보", "교차책임주의", "cross-liabilities", "2,000,000 × 80% = 1,600,000", "3/4 = 1,200,000", "법률비용 3/4 = 30,000", "Clause 12 공제액 1사고 1회", "Clause 8.2 보험가액의 3/4 한도", "750,000", "1,000,000", "1,450,000"], "law": ["Institute Time Clauses – Hulls (1/10/83) Cl.6·8·11·12", "MIA 1906"]}}, {"no": 2, "body": "선박이 화물을 적재하고 선적항을 출항하여 항해 중 화재가 발생하였으나\n구조업체의 도움을 받아 화재를 진압하고 피난항에 입항하였다. 선박에 손상이\n심각하여 더 이상 항해가 가능하지 않았으며, 수리를 위해서는 상당히 장기간이\n소요될 것으로 예상되어 선주는 피난항에서 운송을 포기하였다(적법한 항차\n포기로 간주). 운임은 전액 선불된 상황이었으며 선하증권 이면약관상 공동\n해손은 「York-Antwerp Rules 1994」에 따라 정산하도록 규정되어 있었다.\n화물에 대한 아래 정보를 고려하여 질문에 답하시오. (15점)\nA, B, C 화물의 CIF Value는 모두 아래와 같이 동일하다\nEX WORK 가격 US$ 80,000\n선적관련 비용 5,000\nFOB 가격 US$ 85,000\n해상 운임 14,950\n적하보험료 50\nUS$ 100,000\n(1) A 화물은 당해 화재 사고의 화재 진압 과정에서 소방수에 손상을 입었으며,\n피난항에서 최종 목적지로 계반운송되었다. 하기 정보를 바탕으로 공동\n해손 손해가 있을 경우 그 인정금액 및 당해 화물의 공동해손 분담가액을\n산정하시오. (5점)\n◯ 소방수로 인한 손상에 대한 합의된 감가율 : 50%\n◯ 피난항에서 최종목적항까지의 운송비 : US$ 15,000\n(2) B 화물은 당해 화재 사고에서 손상을 입지 않았으며, 피난항에서 송하인에게\n회송되었다. 하기 정보를 바탕으로 공동해손 손해가 있을 경우 그 인정금액\n및 당해 화물의 공동해손 분담가액을 산정하시오. (5점)\n◯ 손상없음\n◯ 피난항에서 송화주에게 회송시 운송비 : US$ 10,000\n(3) C 화물은 당해 화재 사고의 화재 진압 과정에서 소방수에 손상을 입었으며,\n피난항에서 매각되었다. 하기 정보를 바탕으로 공동해손 손해가 있을 경우\n그 인정금액 및 당해 화물의 공동해손 분담가액을 산정하시오. (5점)\n◯ 피난항에서 매각된 가격 : US$ 40,000\n◯ 피난항에서 최종목적항까지의 예상운송비 : US$ 15,000", "sub": [15, 5, 5, 5], "points": 15, "a": {"plan": "항해가 피난항에서 끝났으므로 분담가액은 피난항 기준이다. 소방수 손해는 Rule Ⅲ으로 인정하고, 매각된 화물은 Rule ⅩⅥ 2문단으로 정상가액과 매각대금의 차액을 잡는다.", "ans": "\n<h4>0. 사안의 구조</h4>\n<span class=\"tb\">항해 중 화재 → 구조업체의 도움으로 진화 → 피난항 입항\n선박 손상이 심각하여 항해 불가, 수리에 장기간 소요\n선주가 피난항에서 「적법하게 항차를 포기」\n운임은 「전액 선불」\n정산기준 : York-Antwerp Rules 1994\n\n화물 A · B · C의 CIF 가액 (모두 동일)\n  EX WORK 가격       US$  80,000\n  선적관련 비용             5,000\n  ─────────────────────────────\n  FOB 가격           US$  85,000\n  해상 운임               14,950\n  적하보험료                  50\n  ─────────────────────────────\n  CIF 가액           US$ 100,000</span>\n\n<h4>Ⅰ. 적용할 규정</h4>\n\n<h4>1. 소방수 손해 — Rule Ⅲ (선상 화재의 소화)</h4>\n<p><b>“선박에서 화재를 진압하는 과정에서\n<u>물이나 그 밖의 방법</u>으로(불타는 선박을 좌초시키거나 침수시켜 생긴 손해를 포함한다)\n선박과 화물 또는 그 어느 하나에 생긴 손해는 <u>공동해손으로 인정한다</u>.\n다만 <u>연기</u>로 인한 손해나 <u>화재의 열</u>로 인한 손해는 보상하지 아니한다.”</b></p>\n<span class=\"tb\">소방수(消防水) 손해   →  공동해손 손해  ○\n연기 손해 · 열 손해   →  공동해손 아님  ×  (단독해손)</span>\n\n<h4>2. 인정금액 — Rule ⅩⅥ</h4>\n<p><b>“희생된 화물의 멸실·손상에 대하여 공동해손으로 인정할 금액은\n<u>양륙 시의 가액</u>을 기초로 산정한 손해액으로 하고,\n그 가액은 수하인에게 발행된 상업송장(없으면 선적가액)으로 확정한다.\n양륙 시의 가액에는 <u>보험료와 운임</u>을 포함한다.\n다만 그 운임이 화물 이외의 이익의 위험에 속하는 경우에는 그러하지 아니하다.\n<u>손상된 화물이 매각되고 손해액에 관하여 달리 합의가 없는 경우</u>에는,\n공동해손으로 인정할 손해액은\n<u>매각 순수익과 위 첫째 문단에 따라 계산한 정상가액의 차액</u>으로 한다.”</b></p>\n\n<h4>3. 분담가액 — Rule ⅩⅦ</h4>\n<p><b>“공동해손의 분담은 <u>항해가 종료된 때</u>의 재산의\n<u>실제 순가액(actual net values)</u>을 기초로 한다.\n… 화물의 가액에는 보험료와 운임을 포함한다.\n다만 그 운임이 화물 이외의 이익의 위험에 속하는 경우에는 그러하지 아니하다.”</b></p>\n<span class=\"tb\">이 사안에서 「항해의 종료」는 「피난항」이다.\n선주가 피난항에서 적법하게 항차를 포기하였기 때문이다.\n\n  → 분담가액은 「피난항에서의 순가액」을 기준으로 한다.\n  → 피난항 이후에 든 비용(계반운송비·회송비)은 차감한다.</span>\n\n<h4>4. 운임 — 전액 선불</h4>\n<span class=\"tb\">운임이 「선불(prepaid)」이면\n  · 운송인은 항해를 끝내지 못하여도 이를 반환하지 아니한다\n  · 곧 운임의 위험은 「화주」가 지고 있다\n  · 따라서 운임은 화물 가액에 포함되고\n    운임 자체가 별도의 공동해손 분담이익이 되지 아니한다\n\n  (반대로 도착불운임(freight at risk)이었다면\n   미수취 운임이 운송인의 분담이익이 되었을 것이다)</span>\n\n<h3>(1) A 화물 — 소방수 손상(감가율 50%), 최종목적항으로 계반운송 (5점)</h3>\n\n<h4>Ⅰ. 공동해손 인정금액</h4>\n<span class=\"tb\">소방수 손해는 Rule Ⅲ에 따라 공동해손으로 인정한다.\n\n  CIF 가액 100,000 × 합의 감가율 50%   =  US$ 50,000</span>\n\n<h4>Ⅱ. 분담가액</h4>\n<span class=\"tb\">계반운송을 하여 최종목적항에 도착하였으므로\n화주가 실제로 손에 쥔 순가액은\n\n  손상 후 가액   100,000 × (1 - 50%)     =   50,000\n  계반운송비                              -  15,000\n  ──────────────────────────────────────────────\n  실제 순가액                                35,000\n\n여기에 공동해손으로 「보상받을 금액」을 더한다.\n(희생된 재산도 희생되지 않았을 때와 같은 지위에서 분담하여야 한다)\n\n  실제 순가액                                35,000\n  공동해손 인정금액                        + 50,000\n  ──────────────────────────────────────────────\n  분담가액                              US$ 85,000</span>\n<p><b>답 : 인정금액 US$ 50,000 · 분담가액 US$ 85,000</b></p>\n\n<h3>(2) B 화물 — 손상 없음, 피난항에서 송하인에게 회송 (5점)</h3>\n\n<h4>Ⅰ. 공동해손 인정금액</h4>\n<span class=\"tb\">손상이 없으므로 희생된 것이 없다.\n\n  공동해손 인정금액                      US$      0</span>\n\n<h4>Ⅱ. 분담가액</h4>\n<span class=\"tb\">항해가 피난항에서 종료되었으므로\n피난항에서의 순가액이 기준이 된다.\n\n  CIF 가액                                 100,000\n  송하인에게 회송하는 데 든 비용           - 10,000\n  ──────────────────────────────────────────────\n  분담가액                              US$ 90,000</span>\n<p><b>답 : 인정금액 US$ 0 · 분담가액 US$ 90,000</b></p>\n<p>손해를 입지 않은 화물도 <b>공동해손의 이익을 받았으므로 분담한다</b>.\n공동해손 분담의무는 <b>손해의 유무가 아니라 보존된 가액</b>에서 나온다.</p>\n\n<h3>(3) C 화물 — 소방수 손상, 피난항에서 매각 (5점)</h3>\n\n<h4>Ⅰ. 공동해손 인정금액 — Rule ⅩⅥ 둘째 문단</h4>\n<p>손상된 화물이 <b>매각</b>되었고 손해액에 관한 별도의 합의가 없으므로,\n<b>정상가액과 매각 순수익의 차액</b>을 인정금액으로 한다.</p>\n<span class=\"tb\">피난항에서의 「정상가액(net sound value)」\n  CIF 가액                                 100,000\n  피난항 → 최종목적항 예상운송비           - 15,000\n  ──────────────────────────────────────────────\n  정상가액                                  85,000\n\n매각 순수익                                  40,000\n\n공동해손 인정금액   85,000 - 40,000     =  US$ 45,000</span>\n<p><b>합의 감가율 50%를 쓰지 않는다</b>는 점이 A 화물과 다르다.\nRule ⅩⅥ 둘째 문단은 <b>매각된 경우</b> 실제 매각대금을 기준으로 하도록 정한다.</p>\n\n<h4>Ⅱ. 분담가액</h4>\n<span class=\"tb\">매각 순수익                                  40,000\n공동해손 인정금액                          + 45,000\n──────────────────────────────────────────────\n분담가액                                US$ 85,000</span>\n<p><b>답 : 인정금액 US$ 45,000 · 분담가액 US$ 85,000</b></p>\n\n<h4>Ⅲ. 세 화물을 나란히 놓으면</h4>\n<span class=\"tb\">           인정금액        분담가액        비고\n\nA 화물     US$ 50,000    US$  85,000    계반운송 15,000 부담\nB 화물     US$      0    US$  90,000    회송비 10,000 부담\nC 화물     US$ 45,000    US$  85,000    피난항 매각\n──────────────────────────────────────────────────\n합계       US$ 95,000    US$ 260,000</span>\n<p>세 화물의 CIF 가액이 모두 같았는데도 분담가액이 갈린다.\n<b>피난항 이후에 각자가 부담한 비용이 다르기 때문</b>이다.</p>\n<p>B 화물이 가장 많이 분담하는 것은\n<b>손해를 입지 않았고 처리비용도 가장 적게 들어\n가장 많은 가액을 건졌기 때문</b>이다.\n<b>공동해손은 “건진 만큼 나눈다”는 원리</b> 위에 서 있다.</p>\n\n<h4>Ⅳ. 함께 짚어 둘 것</h4>\n<ul>\n<li><b>화재 진압을 위한 구조비</b><br>\n문제에서는 구조업체의 도움을 받아 화재를 진압하였다.\n그 구조비는 YAR 1994 Rule Ⅵ에 따라 <b>공동해손으로 인정</b>된다\n(YAR 2016이었다면 Rule Ⅵ(b)의 제한을 검토하여야 한다).</li>\n\n<li><b>피난항 관련 비용</b><br>\n피난항 입항비용, 화물의 양하·보관비용 등은\nRule Ⅹ·Ⅺ에 따라 공동해손으로 인정될 수 있다.\n다만 <b>적법한 항차 포기 이후</b>의 비용은\n공동의 해상사업이 이미 끝났으므로 공동해손이 아니다.</li>\n\n<li><b>연기·열 손해</b><br>\nRule Ⅲ 단서에 따라 <b>공동해손이 아니다</b>.\n같은 화재에서 생긴 손해라도\n<b>불이 직접 태운 것은 단독해손,\n불을 끄려고 뿌린 물이 적신 것은 공동해손</b>이다.</li>\n</ul>\n", "keys": ["YAR 1994", "Rule Ⅲ 소방수 손해", "연기·열 손해는 제외", "Rule ⅩⅥ", "양륙 시의 가액", "매각된 경우 정상가액과 매각 순수익의 차액", "Rule ⅩⅦ 실제 순가액", "항해의 종료는 피난항", "선불운임은 화주의 위험", "A 50,000 / 85,000", "B 0 / 90,000", "C 45,000 / 85,000", "건진 만큼 나눈다"], "law": ["York-Antwerp Rules 1994 Rule Ⅲ·Ⅵ·Ⅹ·Ⅺ·ⅩⅥ·ⅩⅦ", "상법 제865조 이하(공동해손)"]}}, {"no": 3, "body": "항공유 2,000톤을 호주로 수출하면서 보험금액을 US$ 2,000,000(CIF 송장\n가격 US$ 1,000/톤 X 2,000톤 X 100%)으로 하여 적하보험에 가입하였다.\n운송선박의 A, B 2개의 탱크에 각 1,000톤을 싣고 호주 근해를 항해 중\n선박의 좌초 사고로 A 탱크에 해수가 유입되었다. B 탱크에는 하역 시 선원의\n밸브 오작동으로 인해 타 화물이 유입되는 오염 사고가 있었다.\n최종도착지에서 조사한 결과 다음과 같이 손해가 확인되었다.\n◯ 좌초 시 해수 유입으로 인한 손상 내역\n- 시험결과 항공유로 부적합 판단 폐기 처리\n- 폐기처리비용 US$ 200,000 발생\n- 보관비용 US$ 50,000 발생\n◯ 선원의 밸브 오작동으로 인한 오염 손상 내역\n- 정제 후 사용 가능하며 50% 감가 판매\n◯ 각 탱크 입고량\n- 수출항 육상 탱크 : 2,000 톤\n- 운송선박 적재량 : A탱크 1,000 톤 / B탱크 1,000 톤\n- 도착항 육상탱크 : A탱크 1,000 톤 / B탱크 980 톤,\n20톤 부족손(Shortage) 발생\n(※ 해수, 타 화물 유입량 제외)\n아래의 보험조건으로 적하보험에 가입된 경우, 보험자가 지급해야 할\n보험금을 산정하시오. (10점)\n(1) ICC(B), Pipe Line Clause (B), including the risks of shortage in excess\nof 0.5% (5점)\n(2) Bulk Oil Clauses with Marine Extension Clause in excess of 0.5% of all\nclaims other than TL/CTL (5점)", "sub": [10, 5, 5], "points": 10, "a": {"plan": "탱크별로 사고 원인을 갈라 ICC(B)의 열거위험에 대 본다. 선원의 과실은 ICC(B)에서 걸리고 Bulk Oil Clauses에서 살아난다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">항공유 2,000톤, 보험금액 US$ 2,000,000\n  (CIF 송장가격 US$ 1,000/톤 × 2,000톤 × 100%)\n  → 톤당 보험금액 US$ 1,000\n\nA탱크 1,000톤\n  선박 「좌초」로 해수 유입\n  시험 결과 항공유로 부적합 → 폐기 처리\n  폐기처리비용 US$ 200,000 / 보관비용 US$ 50,000\n\nB탱크 1,000톤\n  하역 시 「선원의 밸브 오작동」으로 타 화물 유입 오염\n  정제 후 사용 가능, 50% 감가 판매\n\n부족손(shortage)\n  수출항 육상탱크 2,000톤 → 도착항 육상탱크 A 1,000톤 / B 980톤\n  → 20톤 부족</span>\n\n<h3>(1) ICC(B) + Pipe Line Clause (B) + shortage in excess of 0.5% (5점)</h3>\n\n<h4>Ⅰ. A탱크 — 좌초로 인한 해수 유입</h4>\n<span class=\"tb\">ICC(B) 제1조 담보위험\n\n  1.1.2  선박·부선의 「좌초·교사·침몰·전복」        ← 해당 ○\n  1.2.3  「해수·호수·강물」이 선박·부선·선창·운송용구·\n         컨테이너·리프트밴 또는 보관장소에 유입      ← 해당 ○\n\n  두 갈래 모두에 해당하므로 담보한다.</span>\n<span class=\"tb\">항공유로 부적합하다는 시험 결과가 나왔으므로\n「본래의 성질을 잃어 상품으로서 가치가 없어진 상태」이다.\n\n  → 현실전손(actual total loss)에 해당한다\n     (MIA 1906 s.57 — 「보험목적물이 파괴되거나\n      부보된 종류의 물건으로서 존재하지 아니하게 된 경우」)\n\n  보험금  1,000톤 × US$ 1,000            =  US$ 1,000,000</span>\n\n<h4>폐기처리비용 200,000과 보관비용 50,000은?</h4>\n<span class=\"tb\">ICC 제16조(피보험자 의무 · 손해방지비용)는\n「보상되는 손해를 「방지하거나 최소화」하기 위한 조치」의 비용을 보상한다.\n\n  · 폐기처리비용\n      손해가 이미 확정된 뒤의 「처분비용」이다.\n      손해를 줄이는 조치가 아니므로 손해방지비용이 아니다.   ×\n\n  · 보관비용\n      마찬가지로 손해가 확정된 뒤의 비용이다.               ×\n\n  → 두 비용 모두 약관상 담보하지 아니한다.</span>\n<p>다만 실무에서는 <b>보험자가 전손보험금을 지급하고\n잔존물의 권리를 대위 취득</b>하는 경우,\n그 처분에 드는 비용은 <b>보험자가 부담</b>하게 된다.\n보험자가 잔존물을 인수하지 아니하면 화주가 떠안는다.\n<b>이 위험은 별도의 「폐기비용 담보특약」으로 메우는 것이 실무</b>이다.</p>\n\n<h4>Ⅱ. B탱크 — 선원의 밸브 오작동으로 인한 오염</h4>\n<span class=\"tb\">ICC(B)의 열거위험에 대 본다.\n\n  화재·폭발              ×\n  좌초·침몰·전복          ×\n  육상운송용구의 전복·탈선 ×\n  충돌·접촉              ×\n  피난항에서의 양하        ×\n  지진·화산분화·낙뢰       ×\n  공동해손희생            ×\n  투하·갑판유실           ×\n  해수·호수·강물의 유입    ×  ← 유입된 것은 「타 화물」이지 물이 아니다\n  포장단위의 갑판 추락 전손 ×\n\n  → 어느 담보위험에도 해당하지 않는다.</span>\n<p><b>ICC(B)는 열거위험담보(named perils)</b>이다.\n<b>선원의 과실(negligence of crew)</b>은 열거되어 있지 않다.\n<b>ICC(A)의 전위험담보였다면 담보</b>되었을 손해이다.</p>\n<span class=\"tb\">B탱크 손해                             US$ 0</span>\n\n<h4>Ⅲ. 부족손 20톤</h4>\n<span class=\"tb\">「including the risks of shortage in excess of 0.5%」 특약으로 담보한다.\n\n  면책(공제)수량   2,000톤 × 0.5%     =  10톤\n  부족량                                20톤\n  ──────────────────────────────────────────\n  보상 대상          20 - 10          =  10톤\n\n  보험금  10톤 × US$ 1,000            =  US$ 10,000</span>\n<p><b>“in excess of 0.5%”</b>는 <b>초과분만 보상하는 공제(excess)</b>이다.\n0.5%를 넘으면 전액을 보상하는 <b>면책비율(franchise)</b>과 구별하여야 한다.</p>\n\n<h4>Ⅳ. (1)의 지급보험금</h4>\n<span class=\"tb\">A탱크 전손                            1,000,000\nB탱크 오염                                    0\n부족손                                   10,000\n폐기처리비용·보관비용                          0\n──────────────────────────────────────────────\n지급보험금                        US$ 1,010,000</span>\n\n<h3>(2) Bulk Oil Clauses + Marine Extension Clause, in excess of 0.5% of all claims other than TL/CTL (5점)</h3>\n\n<h4>Ⅰ. Bulk Oil Clauses의 담보범위</h4>\n<p><b>Bulk Oil Clauses</b>는 <b>산적유류(bulk oil) 전용 약관</b>으로,\nICC(B)의 열거위험에 더하여 유류화물 특유의 위험을 담보한다.</p>\n<span class=\"tb\">ICC(B)의 열거위험에 더하여\n\n  · 「선장·사관·선원 또는 도선사의 과실\n     (negligence of Master, Officers, Crew or Pilots)」\n  · 「다른 화물 또는 물질과의 혼합·오염(contamination)」\n  · 선박의 파이프라인·호스로부터의 누출\n  · 적재·양하 작업 중의 손해\n  · 누손(leakage)과 부족손(shortage)</span>\n\n<h4>Marine Extension Clause</h4>\n<p><b>운송기간(담보기간)의 연장</b>에 관한 특약이다.\n피보험자가 통제할 수 없는 사유로 <b>운송이 지연·중단되거나\n항로가 변경되거나 강제양륙·재선적·환적</b>이 이루어져도\n담보가 계속되도록 한다.\n<b>담보위험을 넓히는 것이 아니라 담보기간을 넓히는 것</b>이다.</p>\n\n<h4>Ⅱ. 항목별 판단</h4>\n<span class=\"tb\">A탱크 — 좌초로 인한 해수 유입, 전손\n  담보 ○,  「전손(TL)」이므로 0.5% 공제를 적용하지 않는다\n  보험금  1,000톤 × 1,000                =  1,000,000\n\nB탱크 — 선원의 밸브 오작동으로 인한 오염, 50% 감가\n  「선원의 과실」과 「오염」을 모두 담보한다     담보 ○\n  손해액  1,000톤 × 1,000 × 50%           =    500,000\n  전손이 아니므로 공제 대상\n\n부족손 20톤\n  담보 ○\n  손해액  20톤 × 1,000                    =     20,000\n  전손이 아니므로 공제 대상</span>\n\n<h4>Ⅲ. 공제액의 적용</h4>\n<span class=\"tb\">「in excess of 0.5% of all claims other than TL/CTL」\n\n  → 전손·추정전손 이외의 「모든 클레임」에 대하여\n    0.5%를 공제한다 (1사고당 1회)\n\n공제액   보험금액 2,000,000 × 0.5%        =     10,000</span>\n\n<h4>Ⅳ. (2)의 지급보험금</h4>\n<span class=\"tb\">A탱크 전손 (공제 없음)                 1,000,000\n\n분손 부분\n  B탱크 오염                              500,000\n  부족손                                   20,000\n  ─────────────────────────────────────────────\n  소계                                    520,000\n  공제액                                 - 10,000\n  ─────────────────────────────────────────────\n                                          510,000\n──────────────────────────────────────────────\n지급보험금                        US$ 1,510,000</span>\n\n<h4>Ⅴ. 두 조건을 견주면</h4>\n<span class=\"tb\">                        (1) ICC(B)      (2) Bulk Oil Clauses\n\nA탱크 (좌초·해수유입)    1,000,000        1,000,000\nB탱크 (선원 과실 오염)            0          500,000   ← 갈린다\n부족손                      10,000           20,000\n공제액                       (-10톤)         -10,000\n──────────────────────────────────────────────────\n지급보험금             US$ 1,010,000    US$ 1,510,000\n\n차이 US$ 500,000</span>\n<p>차이는 오로지 <b>“선원의 과실을 담보하는가”</b>에서 나온다.</p>\n<span class=\"tb\">유류·화학품 등 「산적 액체화물」은\n  · 밸브 조작, 배관 연결, 탱크 세척 등\n    「사람의 손」에 달린 작업이 많고\n  · 다른 화물과 섞이면 전량이 못 쓰게 된다\n\n  → ICC(B)의 열거위험만으로는 실질적인 위험이 담보되지 않는다\n  → 그래서 「Bulk Oil Clauses」라는 전용 약관이 따로 만들어졌다</span>\n", "keys": ["ICC(B) 열거위험", "1.1.2 좌초", "1.2.3 해수 유입", "현실전손", "선원의 과실은 ICC(B) 부담보", "폐기처리비용은 손해방지비용 아님", "shortage in excess of 0.5%", "공제 10톤", "1,010,000", "Bulk Oil Clauses", "negligence of Master Officers Crew or Pilots", "contamination", "Marine Extension Clause는 담보기간의 연장", "TL/CTL은 공제 제외", "1,510,000"], "law": ["Institute Cargo Clauses (B) 1/1/82", "Institute Bulk Oil Clauses 1/2/83", "Marine Extension Clause", "MIA 1906 s.57"]}}, {"no": 4, "body": "화공품 1,000 bags을 유럽으로 수출하면서 보험금액 US$ 1,100,000 (CIF\n송장가격 US$ 1,000/bag X 1,000 bags X 110%)로 적하보험에 가입하였다.\n운송 중 화물에 손상이 발생하였으며 최종 도착지에서 확인된 조사 내용은\n다음과 같다.\n◯ 800 bags : 정상 도착\n◯ 100 bags : 인도양 항해 중 악천후(Heavy weather) 시 통풍 차단으로 인한\n습기(Sweat) 손해, 감가율 10%로 합의됨\n◯ 50 bags : 부선에 적재하여 내륙 운하로 항해 중 강물의 유입으로 인한\n수침 손해, 감가율 10%로 합의됨\n◯ 30 bags : 하역 작업 중 빗물로 인한 수침 손해, 감가율 10%로 합의됨\n◯ 10 bags : 하역 작업 중 추락으로 전손\n◯ 10 bags : 미 도착 (non-delivery)\n위 상황에서 ICC(B)와 ICC(C)로 적하보험 가입 시 각 조건별로 담보 여부를\n설명하고 보험자가 지급해야 할 보험금을 산정하시오. (10점)", "sub": [10], "points": 10, "a": {"plan": "다섯 갈래의 손해를 ICC(B)와 ICC(C)의 담보위험표에 하나씩 대 본다. 강물 유입과 포장단위 추락전손만 (B)에서 살아난다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">화공품 1,000 bags\n보험금액 US$ 1,100,000\n  (CIF 송장가격 US$ 1,000/bag × 1,000 bags × 110%)\n  → 1 bag당 보험금액 US$ 1,100\n\n  800 bags  정상 도착\n  100 bags  인도양 항해 중 악천후 시 통풍 차단으로 인한\n            습기(Sweat) 손해, 감가율 10%\n   50 bags  부선에 적재하여 내륙 운하 항해 중\n            강물 유입으로 인한 수침 손해, 감가율 10%\n   30 bags  하역 작업 중 빗물로 인한 수침 손해, 감가율 10%\n   10 bags  하역 작업 중 추락으로 전손\n   10 bags  미도착(non-delivery)</span>\n\n<h4>Ⅰ. ICC(B)와 ICC(C)의 담보위험 대비</h4>\n<span class=\"tb\">                                        ICC(B)   ICC(C)\n\n1.1.1  화재 또는 폭발                      ○        ○\n1.1.2  선박·부선의 좌초·교사·침몰·전복      ○        ○\n1.1.3  육상운송용구의 전복 또는 탈선        ○        ○\n1.1.4  선박·부선·운송용구와\n       물 이외의 외부 물체와의 충돌·접촉    ○        ○\n1.1.5  피난항에서의 화물의 양하             ○        ○\n1.1.6  지진·화산의 분화·낙뢰                ○        ×\n1.2.1  공동해손희생                        ○        ○\n1.2.2  투하 또는 갑판유실                  ○     투하만 ○\n                                                  (갑판유실 ×)\n1.2.3  해수·호수·강물의 선박·부선·선창·\n       운송용구·컨테이너·리프트밴 또는\n       보관장소에의 유입                   ○        ×\n1.3    선박·부선에 적재 또는 양하 중\n       포장단위의 갑판 추락 전손            ○        ×</span>\n<p><b>(B)와 (C)의 차이는 네 가지</b>이다.\n<b>지진 등, 갑판유실, 물의 유입, 포장단위 추락전손</b>.\n이 네 가지가 있느냐 없느냐가 이 문제의 전부이다.</p>\n\n<h4>Ⅱ. 손해별 담보 여부</h4>\n\n<h4>① 100 bags — 악천후 시 통풍 차단으로 인한 습기(Sweat) 손해</h4>\n<span class=\"tb\">ICC(B)  ×      ICC(C)  ×</span>\n<p><b>한증손(sweat damage)</b>은 선창 안의 온도차로\n<b>화물 자체에서 나온 수분이 응결</b>하여 생기는 손해이다.\n<b>‘해수·호수·강물의 유입’이 아니다.</b></p>\n<p>악천후 때문에 통풍구를 닫은 것이 원인이지만\n<b>악천후 자체가 ICC(B)의 담보위험이 아니다</b>.\n<b>ICC(A)의 전위험담보</b>라야 담보된다.</p>\n\n<h4>② 50 bags — 부선으로 내륙 운하 항해 중 강물 유입</h4>\n<span class=\"tb\">ICC(B)  ○      ICC(C)  ×</span>\n<p>ICC(B) 1.2.3은 <b>“해수·호수 또는 <u>강물(river water)</u>이\n선박·<u>부선(craft)</u>·선창·운송용구·컨테이너·리프트밴 또는 보관장소에\n유입”</b>한 경우를 담보한다.</p>\n<p><b>강물</b>이고 <b>부선</b>이므로 문언에 정확히 들어맞는다.\nICC(C)에는 이 조항이 <b>아예 없다</b>.</p>\n\n<h4>③ 30 bags — 하역 작업 중 빗물로 인한 수침</h4>\n<span class=\"tb\">ICC(B)  ×      ICC(C)  ×</span>\n<p><b>빗물(rain water)</b>은 <b>해수·호수·강물의 어느 것도 아니다</b>.\n1.2.3에 열거된 물이 아니므로 담보되지 않는다.</p>\n<p>실무에서 <b>“빗물 손해는 ICC(A)라야 담보된다”</b>고 하는 이유이다.\n<b>RFWD(Rain and/or Fresh Water Damage) 특약</b>으로 따로 담보할 수도 있다.</p>\n\n<h4>④ 10 bags — 하역 작업 중 추락으로 전손</h4>\n<span class=\"tb\">ICC(B)  ○      ICC(C)  ×</span>\n<p>ICC(B) 1.3은 <b>“선박 또는 부선에 <u>적재하거나 양하하는 중</u>\n갑판 밖으로 떨어지거나 낙하한 <u>포장단위(package)의 전손</u>”</b>을 담보한다.</p>\n<span class=\"tb\">요건 세 가지\n  · 「적재 또는 양하」 중일 것            ← 하역 작업 중  ○\n  · 갑판 밖으로 떨어지거나 낙하할 것      ← 추락           ○\n  · 그 포장단위의 「전손」일 것            ← 전손           ○</span>\n<p><b>분손이면 담보되지 않는다.</b> 전손이어야 한다.\nICC(C)에는 이 조항이 없다.</p>\n\n<h4>⑤ 10 bags — 미도착(non-delivery)</h4>\n<span class=\"tb\">ICC(B)  ×      ICC(C)  ×</span>\n<p><b>도난·발하(拔荷)·불착(TPND : Theft, Pilferage and Non-Delivery)</b>은\nICC(B)·ICC(C) 모두 담보하지 않는다.\n원인을 알 수 없이 화물이 도착하지 않은 것은\n<b>어느 열거위험에도 해당하지 않기</b> 때문이다.</p>\n<p><b>ICC(A)</b>라면 담보되고,\nICC(B)·(C)에서는 <b>TPND 특약</b>을 붙여야 한다.</p>\n\n<h4>Ⅲ. 지급보험금</h4>\n\n<h4>1. ICC(B)로 가입한 경우</h4>\n<span class=\"tb\">② 강물 유입 수침\n   50 bags × 1,100 × 10%                =   5,500\n\n④ 하역 중 추락 전손\n   10 bags × 1,100                      =  11,000\n──────────────────────────────────────────────\n지급보험금                          US$   16,500</span>\n\n<h4>2. ICC(C)로 가입한 경우</h4>\n<span class=\"tb\">담보되는 손해가 하나도 없다.\n\n지급보험금                          US$        0</span>\n\n<h4>Ⅳ. 정리</h4>\n<span class=\"tb\">손해                        bags   감가율   ICC(B)    ICC(C)\n\n습기(Sweat)                  100     10%        0         0\n강물 유입 수침                50     10%    5,500         0\n빗물 수침                     30     10%        0         0\n하역 중 추락 전손             10    100%   11,000         0\n미도착                        10    100%        0         0\n────────────────────────────────────────────────────────\n합계                                       16,500         0</span>\n\n<h4>Ⅴ. 이 문제가 가르치는 것</h4>\n<span class=\"tb\">① 물이라고 다 같은 물이 아니다\n   해수·호수·강물  →  ICC(B) 담보\n   빗물·응결수      →  ICC(B) 부담보\n\n② 포장단위 추락은 「전손」이라야 한다\n\n③ ICC(C)는 「선박과 운송용구에 일어난 큰 사고」만 담보한다\n   화물 자체에 생긴 일은 거의 담보하지 않는다\n\n④ 실무에서 화공품·식품처럼 습기에 약한 화물은\n   ICC(B)로는 사실상 보호받지 못한다\n   → ICC(A)로 가입하거나 특약을 붙여야 한다</span>\n", "keys": ["1 bag당 1,100", "ICC(B) 1.2.3 해수·호수·강물", "부선(craft)", "ICC(B) 1.3 포장단위 추락 전손", "sweat damage 부담보", "빗물은 담보위험 아님", "TPND 부담보", "ICC(C)에는 1.1.6·1.2.3·1.3이 없다", "갑판유실", "5,500", "11,000", "ICC(B) 16,500", "ICC(C) 0"], "law": ["Institute Cargo Clauses (B) 1/1/82", "Institute Cargo Clauses (C) 1/1/82"]}}, {"no": 5, "body": "다음의 경우에 대하여 선박건조보험 증권 하에서의 보험자가 지급해야 할 보험금을\n산정하시오. (10점)\n[보험 가입 내용]\n◯ 보험 조건 : Institute Clauses for Builders’ Risks (Cl.351) (1.6.88)\n.with deductible of US$ 350,000\n◯ 보험 가입금액 : US$ 10,000,000 (so valued)\n◯ 보험 기간 : 2025년 6월 16일 00:00 ~ 2026년 6월 15일 24:00\n(Keel Laying to Delivery)\n[보험 사고 내용]\n보험기간 중 선박 A호의 선박 인도 전에 부산 소재 조선소에서 포항까지\n왕복 시운전을 하던 중 선박 A호의 100% 과실로 투묘 중이던(anchoring)\n유조선 B호와 충돌하였다.\n본 충돌사고로 인하여 상대선은 침몰하여 전손되었고(인명 피해는 없고,\n상대선 선가 US$ 4,000,000 임), 본선은 충돌로 인한 충격으로 복원력이\n일시 상실되면서 인근한 가두리 양식장을 망가뜨려 US$ 5,000,000의 배상\n책임을 지게 되었다. 이후, 본선은 결국 좌초되어 구조비 US$ 2,000,000을\n들여 구조된 후 수리되었다. (본선 수리비 : US$ 3,000,000)\n또한, 충돌사고로 인한 방어법률비용으로 US$ 2,000,000이 별도로 지출되었다.", "sub": [10], "points": 10, "a": {"plan": "건조보험은 4/4 충돌배상책임과 P&I를 함께 담보한다. 상대선은 Cl.18, 양식장은 Cl.19로 갈라 넣고 공제액을 한 번만 뺀다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">보험조건   Institute Clauses for Builders' Risks (Cl.351) (1/6/88)\n           with deductible of US$ 350,000\n보험금액   US$ 10,000,000 (so valued)\n보험기간   2025. 6. 16. 00:00 ~ 2026. 6. 15. 24:00\n           (Keel Laying to Delivery)\n\n사고       인도 전, 부산 조선소 ~ 포항 왕복 시운전 중\n           본선 100% 과실로 투묘 중이던 유조선 B호와 충돌\n\n  · 상대선 침몰 전손 (선가 US$ 4,000,000, 인명피해 없음)\n  · 본선의 복원력 일시 상실 → 인근 가두리 양식장 파손\n    배상책임 US$ 5,000,000\n  · 본선 좌초 → 구조비 US$ 2,000,000\n  · 본선 수리비 US$ 3,000,000\n  · 충돌사고 방어법률비용 US$ 2,000,000</span>\n\n<h4>Ⅰ. 담보요건의 확인</h4>\n<span class=\"tb\">보험기간   「Keel Laying to Delivery」\n           사고는 「인도 전」이므로 기간 내 ○\n\n시운전     Institute Clauses for Builders' Risks는\n           「건조지로부터 일정 거리 이내의 시운전(trials)」을 담보한다.\n           부산 ~ 포항 왕복은 그 범위 안이다 ○\n\n위험       Cl.6은 「보험목적물의 멸실·손상에 대한 전위험(all risks)」을\n           담보한다 ○</span>\n\n<h4>Ⅱ. 선박건조보험이 ITC-Hulls와 다른 점 — 이 문제의 열쇠</h4>\n<span class=\"tb\">                        ITC-Hulls          Builders' Risks\n\n충돌배상책임             「3/4」             「4/4」  (Cl.18)\n선박 이외의 물건에\n대한 배상책임             담보하지 않는다     「P&I 담보」 (Cl.19)\n                         (P&I의 영역)\n전위험담보               열거위험            all risks (Cl.6)</span>\n<p>건조 중인 선박은 <b>아직 P&I 조합에 가입되어 있지 않다</b>.\n그래서 건조보험은 <b>충돌배상책임을 4/4로 담보</b>하고\n<b>P&I 담보까지 한 증권 안에 넣어 두었다</b>.</p>\n\n<h4>Ⅲ. 항목별 판단</h4>\n\n<h4>① 본선 수리비 US$ 3,000,000 — Cl.6 (전위험)</h4>\n<span class=\"tb\">건조 중인 선박 자체의 손상이다.\n보험금액 10,000,000 한도 내                      3,000,000</span>\n\n<h4>② 본선 구조비 US$ 2,000,000 — 구조비(salvage charges)</h4>\n<span class=\"tb\">담보위험(좌초)으로부터 보험목적물을 구조하기 위한 비용이다.\n보험자가 부담한다.                               2,000,000</span>\n\n<h4>③ 상대선 B호 전손 US$ 4,000,000 — Cl.18 (Collision Liability, 4/4)</h4>\n<p>Cl.18은 <b>“보험자는 피보험선박이 다른 선박과 충돌한 결과\n피보험자가 다음의 손해에 대하여 법률상 배상책임을 짐으로써\n지급한 금액의 <u>4/4</u>를 보상한다”</b>고 정한다.</p>\n<span class=\"tb\">18.1.1  다른 선박 또는 그에 실린 재물의 멸실·손상   ← 해당 ○\n18.1.2  다른 선박 또는 그에 실린 재물의\n        지연 또는 사용의 상실\n18.1.3  다른 선박 또는 그에 실린 재물의 공동해손·구조\n\n  4,000,000 × 4/4                              = 4,000,000\n\n  한도  Cl.18 상의 책임은 보험가액을 초과하지 아니한다\n        4,000,000 ≤ 10,000,000  ○</span>\n<p>ITC-Hulls였다면 <b>3/4인 3,000,000</b>만 보상되고\n나머지 1,000,000은 P&I의 몫이 되었을 것이다.</p>\n\n<h4>④ 가두리 양식장 파손 US$ 5,000,000 — Cl.19 (Protection & Indemnity)</h4>\n<span class=\"tb\">Cl.18.4는 충돌배상책임에서 다음을 「제외」한다.\n\n  · 장애물·난파선·화물 등의 제거·처분\n  · 「다른 선박 또는 다른 선박에 실린 재물 이외의\n     모든 부동산·동산 또는 물건」          ← 가두리 양식장이 여기에 해당\n  · 피보험선박에 실린 화물이나 그 계약상의 의무\n  · 사망·상해·질병\n  · 오염 또는 오탁\n\n  → 가두리 양식장은 Cl.18에서는 담보되지 않는다.</span>\n<p>그러나 <b>Cl.19 (Protection and Indemnity)</b>가 이를 받는다.</p>\n<p><b>“보험자는 … 피보험선박 이외의 <u>고정되거나 이동하는 물체·재산 그 밖의 물건이나 이익</u>의\n멸실·손상으로서 <u>Cl.18에 의하여 담보되지 아니하는 것</u>에 대하여\n피보험자가 지급한 금액의 4/4를 보상한다.”</b></p>\n<span class=\"tb\">  5,000,000 × 4/4                              = 5,000,000\n\n  한도  Cl.19 상의 책임도 보험가액을 초과하지 아니한다\n        5,000,000 ≤ 10,000,000  ○</span>\n<p><b>충돌은 Cl.18, 충돌 아닌 것은 Cl.19</b>로 갈라 넣는 것이\n이 문제의 가장 큰 갈림길이다.</p>\n\n<h4>⑤ 방어법률비용 US$ 2,000,000 — Cl.18의 법률비용 조항</h4>\n<p><b>“보험자는 또한 피보험자가 <u>책임을 다투거나\n책임을 제한하기 위한 절차를 밟는 데</u> 지출한 법률비용의 <u>4/4</u>를,\n보험자의 사전 서면동의를 얻은 경우에 지급한다.”</b></p>\n<span class=\"tb\">  2,000,000 × 4/4                              = 2,000,000</span>\n\n<h4>Ⅳ. 지급보험금의 산정</h4>\n<span class=\"tb\">① 본선 수리비                                    3,000,000\n③ 상대선 전손 배상 (Cl.18, 4/4)                  4,000,000\n④ 가두리 양식장 배상 (Cl.19, 4/4)                5,000,000\n⑤ 방어법률비용 (4/4)                             2,000,000\n   ────────────────────────────────────────────────────\n   공제액 적용 대상 소계                         14,000,000\n   공제액 (Cl.10)                                - 350,000\n   ────────────────────────────────────────────────────\n                                                13,650,000\n\n② 본선 구조비 (구조비는 공제액 적용 제외)        2,000,000\n   ────────────────────────────────────────────────────\n   지급보험금                              US$ 15,650,000</span>\n\n<h4>공제액에 관하여</h4>\n<span class=\"tb\">Cl.10은 ITC-Hulls Cl.12와 같은 구조이다.\n\n  · 「1사고 또는 1사건에서 생긴 모든 청구(Cl.11·18·19에 따른 청구를 포함)의\n     합계액」이 공제액을 넘는 경우에 그 공제액을 공제한다\n     → 항목마다 빼는 것이 아니라 「한 번만」 뺀다\n\n  · 「전손·추정전손·손해방지비용·구조비」 청구에는 적용하지 않는다\n     → 본선 구조비 2,000,000은 공제 대상에서 뺀다</span>\n\n<h4>Ⅴ. 보험금액 10,000,000을 넘어도 되는가</h4>\n<span class=\"tb\">된다.\n\n  보험금액 10,000,000은 「선박 자체」에 대한 한도이다.\n  Cl.18(충돌배상책임)과 Cl.19(P&I)는\n  「각각 보험가액을 한도로 하는 별개의 담보」이다.\n\n  본선 손해   3,000,000 + 2,000,000 =  5,000,000 ≤ 10,000,000  ○\n  Cl.18       4,000,000                        ≤ 10,000,000  ○\n  Cl.19       5,000,000                        ≤ 10,000,000  ○\n\n  → 세 담보를 합하면 보험금액을 넘을 수 있다.</span>\n\n<h4>Ⅵ. 만약 인도 후의 사고였다면</h4>\n<span class=\"tb\">건조보험은 「인도(Delivery)」로 종료된다.\n\n  → 선주가 가입한 ITC-Hulls(3/4 RDC)와 P&I가 이어받는다\n  → 상대선 전손 4,000,000 중 3/4인 3,000,000만 선박보험에서,\n    나머지 1/4과 가두리 양식장 5,000,000은 P&I에서 담보하게 된다\n\n  건조보험이 「한 증권으로 전부를 덮는」 이유는\n  건조 중인 선박에는 아직 P&I가 붙어 있지 않기 때문이다.</span>\n", "keys": ["Institute Clauses for Builders' Risks 1/6/88", "Keel Laying to Delivery", "시운전(trials) 담보", "Cl.6 전위험", "Cl.18 4/4 충돌배상책임", "Cl.18.4 선박 이외의 물건 제외", "Cl.19 P&I", "가두리 양식장", "방어법률비용 4/4", "구조비는 공제 제외", "Cl.10 공제액 1사고 1회", "350,000", "담보별 별도 한도", "15,650,000"], "law": ["Institute Clauses for Builders' Risks (1/6/88) Cl.6·10·18·19·21"]}}, {"no": 6, "body": "선박이 부두에 접안하던 중 파도의 영향 및 도선사의 부주의로 부두와\n접촉하여 선체에 손상을 입었다. 손상의 형태나 정도가 감항성에 영향을\n줄 수 있는 상태인 것으로 확인되어 항차를 중단하고 선박을 수리항으로\n회항하여 손상 수리를 시행하였으며, 이번 기회를 이용하여 선주 수리를\n같이 시행하였다.\n당해 선박은 불가동손실 보험(Loss of Hire Insurance)에 아래와 같은\n조건으로 가입되어 있고 수리 기간이 아래와 같은 경우 질문에 답하시오.\n(10점)\n◯ 보험가입금액 : US$ 3,600,000\n◯ 적용약관 : Loss of Charter Hire – Excluding War\n(ABS 1/10/83)\n◯ Daily hire agreed : US$ 20,000/day\n◯ Excess period : 10 days\n◯ 수리항 회항 : 2 days\n◯ 실제 수리 기간 : 15 days\n◯ 손상 수리만 따로 시행할 경우 필요한 수리 기간 : 15 days\n◯ 선주 수리만 따로 시행할 경우 필요한 수리 기간 : 12 days\n(1) 손상 수리와 같이 시행된 선주 수리 작업이 감항성 유지를 위해서 당장\n필요한 수리가 아닌 경우 불가동손실 보험자가 지급해야 할 보험금을 산정\n하시오. (5점)\n(2) 손상 수리와 같이 시행된 선주 수리 작업이 감항성 유지를 위해서 당장\n필요한 수리인 경우 불가동손실 보험자가 지급해야 할 보험금을 산정하시오.\n(5점)", "sub": [10, 5, 5], "points": 10, "a": {"plan": "선주 수리가 감항성에 필요한가에 따라 손실시간을 안분하느냐 마느냐가 갈린다. 회항일수는 언제나 손상 수리 몫이다.", "ans": "\n<h4>0. 자료</h4>\n<span class=\"tb\">보험가입금액          US$ 3,600,000\n적용약관              Loss of Charter Hire – Excluding War (ABS 1/10/83)\nDaily hire agreed     US$ 20,000 / day\nExcess period(공제기간)  10 days\n\n수리항 회항                                   2 days\n실제 수리 기간                               15 days\n손상 수리만 따로 시행할 경우 필요한 기간      15 days\n선주 수리만 따로 시행할 경우 필요한 기간      12 days</span>\n<p>사고는 <b>파도의 영향 및 도선사의 부주의</b>로 부두와 접촉한 것이고,\n손상이 <b>감항성에 영향을 줄 수 있는 상태</b>여서 항차를 중단하였다.\n<b>담보위험으로 인한 불가동</b>임이 분명하다.</p>\n\n<h4>Ⅰ. 불가동손실보험의 구조</h4>\n<span class=\"tb\">지급보험금 = (불가동일수 - 공제기간) × 협정 1일당 금액\n             (보험가입금액 한도 내)\n\n불가동일수  담보위험으로 선박이 「수익을 낼 수 없었던」 기간\n            수리항으로의 회항기간, 수리대기기간,\n            수리기간, 시운전기간 등을 포함한다\n\n공제기간    사고마다 적용하는 「대기기간(waiting period)」\n            보험료를 낮추고 소액 사고를 걸러 내는 장치</span>\n<span class=\"tb\">보험가입금액 3,600,000 ÷ 일당 20,000 = 180일\n  → 이 계약이 담보하는 최대 불가동일수는 180일이다</span>\n\n<h4>Ⅱ. 동시수리(concurrent repairs)의 처리</h4>\n<p>손상 수리와 <b>선주 수리(owner's work)</b>를 함께 하는 것은\n<b>선주로서는 합리적인 선택</b>이다.\n따로 두 번 쉬는 것보다 한 번에 끝내는 편이 낫기 때문이다.</p>\n<p>그러나 <b>보험자가 그 시간을 모두 부담할 이유는 없다</b>.\n그래서 약관과 실무는 <b>선주 수리의 성격</b>에 따라 달리 다룬다.</p>\n<span class=\"tb\">① 선주 수리가 「당장 필요하지 않은 수리」인 경우\n     선주 수리가 없었더라도 선박은 손상 수리 때문에\n     그 기간만큼 쉬어야 했다\n     → 손상 수리에 필요한 기간 「전부」를 보험자가 부담한다\n       (선주 수리는 그 시간에 얹혀 간 것에 지나지 않는다)\n\n② 선주 수리가 「감항성 유지를 위해 당장 필요한 수리」인 경우\n     그 수리도 하지 않으면 선박이 운항할 수 없었다\n     → 두 수리가 모두 필요하였으므로 손실시간을\n       「각자 단독으로 수리할 경우 필요한 기간의 비율」로 안분한다</span>\n\n<h3>(1) 선주 수리가 감항성 유지를 위해 당장 필요한 수리가 아닌 경우 (5점)</h3>\n<span class=\"tb\">선주 수리는 선주의 편의를 위한 것에 지나지 않는다.\n선주 수리를 하지 않았더라도 손상 수리에는 15일이 걸렸을 것이다.\n\n  → 수리기간 15일 「전부」가 담보위험으로 인한 불가동이다.\n\n불가동일수\n  수리항 회항                                     2일\n  손상 수리                                      15일\n  ──────────────────────────────────────────────────\n  합계                                           17일\n\n공제기간                                       - 10일\n──────────────────────────────────────────────────\n보상일수                                          7일\n\n지급보험금   7일 × US$ 20,000        =    US$ 140,000\n             (보험가입금액 3,600,000 이내)</span>\n<p><b>답 (1) : US$ 140,000</b></p>\n\n<h3>(2) 선주 수리가 감항성 유지를 위해 당장 필요한 수리인 경우 (5점)</h3>\n<span class=\"tb\">선주 수리도 하지 않으면 선박이 운항할 수 없는 수리이다.\n곧 이번 사고가 없었더라도 선박은 그 수리를 위해\n12일간 쉬어야 했을 상황이었다.\n\n  → 두 수리가 함께 이루어진 「손실시간」을\n    각자 단독 소요기간의 비율로 안분한다.</span>\n<span class=\"tb\">안분\n\n  손상 수리 단독 소요기간                        15일\n  선주 수리 단독 소요기간                        12일\n  ──────────────────────────────────────────────────\n  합계                                           27일\n\n  실제 손실시간(수리기간)                        15일\n\n  손상 수리에 배분되는 기간\n    15일 × 15/27  =  15 × 0.5556  ≒   8.33일\n\n  선주 수리에 배분되는 기간\n    15일 × 12/27  ≒                   6.67일</span>\n<span class=\"tb\">불가동일수\n  수리항 회항                                  2.00일\n    (회항은 오로지 손상 때문이므로 안분하지 않는다)\n  손상 수리 배분분                             8.33일\n  ──────────────────────────────────────────────────\n  합계                                        10.33일\n\n공제기간                                    - 10.00일\n──────────────────────────────────────────────────\n보상일수                                      0.33일\n\n지급보험금   0.33일 × US$ 20,000   ≒   US$ 6,667</span>\n<p><b>답 (2) : 약 US$ 6,667 (0.33일분)</b></p>\n\n<h4>안분방식에 관하여</h4>\n<span class=\"tb\">실무에서는 「공통기간(common time)을 균등하게 나누는」 방식도 쓰인다.\n\n  손상 수리에만 필요한 기간   15 - 12  =  3일\n  두 수리에 공통되는 기간               = 12일\n  공통기간을 균등 분담        12 × 1/2  =  6일\n  ──────────────────────────────────────────\n  손상 수리 몫                          =  9일\n\n  불가동일수  2 + 9 = 11일\n  공제기간          - 10일\n  보상일수             1일\n  지급보험금   1일 × 20,000  =  US$ 20,000</span>\n<p>어느 방식을 취하든 <b>결론은 크게 달라지지 않는다</b>.\n답안에서는 <b>어느 방식으로 안분하였는지 밝히는 것</b>이 중요하다.</p>\n\n<h4>Ⅲ. 두 경우를 견주면</h4>\n<span class=\"tb\">                                (1)          (2)\n\n손상 수리에 배분되는 기간      15.00일      8.33일\n회항                            2.00일      2.00일\n──────────────────────────────────────────────\n불가동일수                     17.00일     10.33일\n공제기간                      -10.00일    -10.00일\n──────────────────────────────────────────────\n보상일수                        7.00일      0.33일\n지급보험금                US$ 140,000   US$ 6,667</span>\n<p><b>선주 수리 한 가지의 성격이 보험금을 스무 배 넘게 갈라 놓는다.</b></p>\n<span class=\"tb\">실무의 교훈\n\n  · 선주 수리를 함께 시행할 때에는\n    「그 수리가 감항성 유지에 당장 필요한 것인가」를\n    미리 검증인(surveyor)과 확인해 두어야 한다.\n\n  · 공제기간(10일)이 짧지 않으므로\n    안분의 결과가 공제기간에 못 미치면\n    보험금이 아예 나오지 않을 수도 있다.\n\n  · 「손상 수리만 따로 하면 며칠이 걸리는가」를\n    수리 착수 전에 문서로 확정해 두어야 분쟁을 막을 수 있다.</span>\n", "keys": ["불가동손실보험", "Loss of Hire", "지급보험금 = (불가동일수 - 공제기간) × 일당", "회항기간 포함", "동시수리", "선주 수리가 필요하지 않은 경우 전부 보상", "감항성에 필요한 경우 안분", "15일 전부", "17일 - 10일 = 7일", "140,000", "15 × 15/27 = 8.33일", "10.33일", "0.33일", "6,667", "공통기간 균등 분담 대안 20,000", "180일 한도"], "law": ["Loss of Charter Hire – Excluding War (ABS 1/10/83)"]}}, {"no": 7, "body": "「Institute War and Strike Clauses Hulls – Time 1/10/83」 제5조\n종료(Termination) 조항에서 해지통보의 유무와 관계없이 자동 종료되는\n사항에 대해 설명하시오. (5점)", "sub": [5], "points": 5, "a": {"plan": "세 가지를 정확히 세는 문제다. 핵무기 폭발, 5대국 간 전쟁, 선박의 징발.", "ans": "\n<h4>0. 조항의 구조</h4>\n<p>「Institute War and Strikes Clauses Hulls – Time (1/10/83)」\n제5조(Termination)는 두 갈래로 되어 있다.</p>\n<span class=\"tb\">5.1  「해지통보에 의한」 종료\n     보험자 또는 피보험자는 「7일 전 통보」로 해지할 수 있다.\n     (통보가 발신되거나 도달한 날 자정부터 7일이 지나면 효력이 생긴다)\n     다만 해지통보의 기간이 끝나기 전에\n     새로운 보험료율·조건·담보에 관하여 합의하면\n     보험자는 이 보험을 부활시키기로 한다.\n\n5.2  「해지통보의 유무와 관계없이 자동으로」 종료\n     ← 이 문제가 묻는 것</span>\n\n<h3>자동 종료 사유 세 가지</h3>\n\n<h4>① 핵무기의 적대적 폭발 (5.2.1)</h4>\n<p><b>“제4.1.5조에서 말하는 <u>전쟁용 핵무기의 적대적 폭발</u>이 일어난 때.\n그 폭발이 <u>어디에서 언제 일어나든</u>,\n그리고 <u>피보험선박이 그에 관련되어 있든 아니든</u> 관계없다.”</b></p>\n<span class=\"tb\">요건이 대단히 넓다.\n\n  · 장소   전 세계 어디든\n  · 시기   언제든\n  · 관련성 피보험선박과 아무 관계가 없어도 된다\n\n핵무기가 실제로 사용되는 상황에서는\n전쟁위험을 산정하는 것 자체가 불가능해지므로\n보험자를 즉시 위험에서 빼내는 장치이다.</span>\n<p><b>‘적대적(hostile)’ 폭발</b>이어야 하므로\n<b>핵실험이나 사고에 의한 폭발</b>은 해당하지 않는다.</p>\n\n<h4>② 5대국 간의 전쟁 발발 (5.2.2)</h4>\n<p><b>“다음 나라들 가운데 어느 나라 사이에\n<u>전쟁이 발발한 때</u>(선전포고가 있든 없든 관계없다).\n<u>영국, 미국, 프랑스, 소비에트사회주의공화국연방, 중화인민공화국</u>”</b></p>\n<span class=\"tb\">United Kingdom          영국\nUnited States of America 미국\nFrance                  프랑스\nthe Union of Soviet\n  Socialist Republics   구 소련  (현재는 러시아로 읽는다)\nthe People's Republic\n  of China              중국\n\n  → 유엔 안전보장이사회 「상임이사국 5개국」이다.\n    핵보유국이자 세계대전으로 번질 수 있는 나라들이므로\n    그들 사이의 전쟁은 곧 세계적 규모의 전쟁을 뜻한다.</span>\n<p><b>“선전포고의 유무를 묻지 않는다”</b>는 점이 중요하다.\n현대의 전쟁은 선전포고 없이 시작되기 때문이다.</p>\n<p>이들 <b>5대국 가운데 두 나라 사이</b>여야 하므로,\n5대국 중 한 나라와 다른 나라 사이의 전쟁은 해당하지 않는다.</p>\n\n<h4>③ 선박의 징발 (5.2.3)</h4>\n<p><b>“선박이 <u>소유권의 징발(requisition for title)</u>\n또는 <u>사용의 징발(requisition for use)</u>을 당한 때”</b></p>\n<span class=\"tb\">징발이 있으면\n  · 선박은 국가의 지배 아래 들어가고\n  · 피보험자는 선박에 대한 지배를 잃으며\n  · 위험의 성질이 완전히 달라진다\n\n  → 보험자가 인수한 위험과 다른 위험이 되므로\n    보험을 자동으로 끊는다.</span>\n<span class=\"tb\">「소유권의 징발」  국가가 소유권 자체를 가져가는 것\n「사용의 징발」    소유권은 남기고 사용권만 가져가는 것\n\n  → 둘 다 자동 종료 사유이다.</span>\n<p>다만 <b>단순한 나포(capture)·억류(detainment)</b>는\n징발이 아니라 <b>담보위험</b>이므로 종료사유가 아니다.\n<b>국가의 적법한 징발</b>과 구별하여야 한다.</p>\n\n<h4>정리</h4>\n<span class=\"tb\">해지통보에 의한 종료   7일 전 통보  (5.1)\n\n자동 종료 (5.2)\n  ① 전쟁용 핵무기의 적대적 폭발\n     — 장소·시기·본선의 관련 여부를 묻지 않는다\n  ② 영국·미국·프랑스·소련(러시아)·중국 사이의 전쟁 발발\n     — 선전포고의 유무를 묻지 않는다\n  ③ 선박의 징발 — 소유권 징발이든 사용 징발이든</span>\n<p>세 가지 모두 <b>보험자가 감당할 수 없는 규모의 위험</b>이거나\n<b>인수한 위험의 성질 자체가 달라진 경우</b>이다.\n전쟁보험이 <b>“평시의 전쟁위험”만을 담보한다</b>는 것을\n이 조항이 보여 준다.</p>\n", "keys": ["Institute War and Strikes Clauses Hulls-Time 1/10/83", "제5조 Termination", "7일 전 해지통보", "자동 종료", "핵무기의 적대적 폭발", "장소·시기 불문", "본선 관련 여부 불문", "영국·미국·프랑스·소련·중국", "선전포고 유무 불문", "징발", "requisition for title", "requisition for use", "나포·억류는 담보위험"], "law": ["Institute War and Strikes Clauses Hulls – Time (1/10/83) Cl.4·5"]}}, {"no": 8, "body": "「Institute Time Clauses - Hulls (1/10/83)」 제9조 자매선 조항(Sistership\nClause)의 제정 취지와 내용에 관하여 약술하시오. (5점)", "sub": [5], "points": 5, "a": {"plan": "혼동의 법리 때문에 생기는 빈틈을 메우는 조항이다.
