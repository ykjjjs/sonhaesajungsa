「직접비의 일정 비율」로 계상한다.\n\n「④ 「적정이윤」」\n  · 투하자본에 대한 정상적인 보수\n  · 통상 「총원가의 일정 비율」로 계상한다.</span>\n\n<h4>3. 정리</h4>\n<span class=\"tb\">「공임 = 「표준작업시간」 × 「공임률」」\n\n              인건비 + 경비\n              + 일반관리비 + 적정이윤\n 공임률 = ─────────────────────────────\n              연간 유효작업시간\n\n · 「표준작업시간」은 「얼마나 오래 걸리는가」\n · 「공임률」은 「그 한 시간이 얼마인가」\n\n 손해사정에서는 이 둘을 각각 따져야 한다.\n  ① 청구된 작업시간이 표준정비시간에\n     맞는가 (과다 청구 여부)\n  ② 적용된 공임률이 그 정비공장의\n     「공개된 시간당 공임」과 맞는가</span>\n", "keys": ["표준작업시간 = (주작업시간 + 부대작업시간) × (1 + 여유율)", "여유시간 — 작업여유·직장(관리)여유·생리여유·피로여유", "공임률 = 공임 총원가 ÷ 연간 유효작업시간", "유효작업시간 = 총 근로시간 × 가동률", "총원가 = 인건비 + 경비 + 일반관리비 + 적정이윤", "경비 — 감가상각비·임차료·수도광열비·소모품비·보험료·폐기물처리비·교육훈련비", "자동차관리법상 시간당 공임과 표준정비시간의 공개 의무"], "law": ["자동차관리법 제58조의3·제58조의4(정비요금의 공개)", "자동차보험 표준약관 대물배상 지급기준(수리비)"]}}, {"no": 7, "body": "보험계약자 등의 의무 중 계약 전 알릴 의무를 설명하고, 이를 위반한 경우의\n효과 및 보험계약을 해지할 수 없는 경우에 대하여 약술하시오.(10점)", "sub": [10], "points": 10, "a": {"plan": "고지의무는 「무엇을·언제·어떻게」와 「어기면 어떻게 되는가」, 그리고 「그래도 해지 못 하는 일곱 가지」의 세 토막이다. 마지막 토막에 배점이 걸려 있으므로 빠짐없이 적는다.", "ans": "\n<h4>Ⅰ. 계약 전 알릴 의무 (고지의무)</h4>\n\n<h4>1. 뜻과 근거</h4>\n<span class=\"tb\">상법 제651조\n 「보험계약 당시에 보험계약자 또는\n  피보험자가 「고의 또는 중대한 과실」로\n  「중요한 사항」을 고지하지 아니하거나\n  부실의 고지를 한 때에는 보험자는\n  그 사실을 안 날로부터 「1월 내」에,\n  계약을 체결한 날로부터 「3년 내」에 한하여\n  계약을 해지할 수 있다.」\n\n자동차보험 표준약관\n 「계약자 또는 피보험자는 「청약할 때」\n  「청약서에서 질문한 사항」에 대하여\n  알고 있는 사실을 반드시 「사실대로」\n  알려야 합니다.」\n\n 왜 두는가\n  보험은 「위험의 크기」에 맞추어 보험료를\n  정한다. 그런데 그 위험은 계약자 쪽에만\n  드러나 있다.\n  → 보험자가 「인수 여부와 보험료」를\n    올바르게 정할 수 있도록,\n    계약자에게 알릴 의무를 지운다.\n    (「정보의 비대칭」을 메우는 장치)</span>\n\n<h4>2. 내용</h4>\n<span class=\"tb\">「① 의무자」\n  「보험계약자」와 「피보험자」\n  (대리인이 계약을 맺은 때에는 대리인도\n   포함한다)\n\n「② 시기」\n  「보험계약을 「청약할 때」」\n  (계약이 성립할 때까지)\n\n「③ 대상 — 「중요한 사항」」\n  「보험자가 그 사실을 알았더라면 계약을\n   맺지 않았거나 적어도 같은 조건으로는\n   맺지 않았을 것으로 객관적으로 인정되는\n   사항」\n\n  자동차보험에서는 「청약서에 질문한 사항」이\n  중요한 사항으로 「추정」된다(상법 제651조의2).\n\n  · 피보험자동차의 「차명·연식·차종·용도·\n    등록번호·배기량·부속기계장치」\n  · 「기명피보험자」와 그 관계\n  · 「운전자의 범위와 연령」 한정특약\n  · 「소유·사용·관리 형태」\n    (자가용인가, 「유상운송」인가)\n  · 「다른 자동차보험계약」의 유무\n  · 개인용/업무용/영업용의 구분\n\n「④ 방법」\n  「구두 또는 서면」으로 할 수 있으나,\n  실무상 「청약서의 질문표에 기재」하는\n  방법으로 한다.\n  질문표에 없는 사항은 원칙적으로\n  고지의무의 대상이 아니다\n  (「수동적 응답의무」).</span>\n\n<h4>3. 계약 후 알릴 의무와의 구별</h4>\n<span class=\"tb\">「계약 전 알릴 의무」  청약 시 — 상법 제651조\n「계약 후 알릴 의무」  계약 후 — 상법 제652조\n  · 「위험의 현저한 변경·증가」\n    (용도 변경, 구조 변경, 유상운송 개시,\n     운전자 범위의 변경)\n  · 「지체 없이」 통지하여야 한다.\n\n  두 의무는 시기와 요건이 다르므로\n  섞어 쓰지 않도록 한다.</span>\n\n<h4>Ⅱ. 위반의 효과</h4>\n\n<h4>1. 요건</h4>\n<span class=\"tb\">「① 「고의 또는 「중대한 과실」」이 있을 것\n   → 「경과실」에 의한 불고지·부실고지는\n     해지사유가 되지 않는다.\n\n ② 「중요한 사항」에 관한 것일 것\n\n ③ 「불고지」 또는 「부실고지」가 있을 것\n\n ④ 「인과관계는 요건이 아니다」\n   (해지 자체는 인과관계와 무관하게 가능.\n    다만 보험금 지급에는 아래와 같이\n    인과관계가 영향을 미친다)</span>\n\n<h4>2. 효과</h4>\n<span class=\"tb\">「① 「계약의 해지」」\n  · 보험자는 「그 사실을 안 날부터 1개월」,\n    「계약을 체결한 날부터 3년」 이내에\n    계약을 해지할 수 있다.\n  · 해지는 「장래에 대하여」 효력이 있으나,\n    아래 ②의 특칙이 있다.\n\n「② 「보험금의 부지급·반환청구」」\n  상법 제655조\n  · 계약을 해지한 때에는 「해지 「전」에 생긴\n    보험사고」에 대하여도 보험금을 지급하지\n    아니하며, 이미 지급한 보험금의 반환을\n    청구할 수 있다.\n  · 「다만, 고지의무 위반사실이 「보험사고의\n    발생에 영향을 미치지 아니하였음이\n    증명된 때」에는 보험금을 지급한다.」\n    (제655조 단서 — 「인과관계 없으면 지급」)\n\n  자동차보험 표준약관도 같은 취지로\n  「알릴 의무 위반사실이 보험금 지급사유의\n   발생에 영향을 미쳤음을 「회사가 증명하지\n   못한 경우」에는 보험금을 지급합니다」\n  라고 정한다.\n\n「③ 「보험료의 추가 납입에 의한 계약 유지」」\n  자동차보험의 실무적 특칙이다.\n  · 사실대로 알렸더라면 산출되었을\n    「정당한 보험료」와의 차액을 추징하고\n    계약을 「유지」할 수 있다.\n  · 계약자가 추가보험료를 내지 않으면\n    계약을 해지하거나, 보험금을\n    「납입한 보험료 ÷ 정당한 보험료」의\n    비율로 「삭감」하여 지급한다.」</span>\n\n<h4>Ⅲ. 계약을 해지할 수 없는 경우</h4>\n<span class=\"tb\">「① 보험자가 계약 당시에 그 사실을 「알았거나\n   「중대한 과실」로 알지 못한 경우」\n   (상법 제651조 단서)\n   → 스스로 살피지 않은 보험자를\n     보호할 이유가 없다.\n\n ② 「계약자 또는 피보험자에게 「고의 또는\n   중대한 과실」이 없는 경우」\n   → 「경과실」로 잘못 알린 때에는\n     해지할 수 없다.\n\n ③ 「보험자가 그 사실을 안 날부터\n   「1개월」이 지난 경우」\n   → 제척기간. 알고도 미루면 권리를 잃는다.\n\n ④ 「보험계약을 체결한 날부터 「3년」이\n   지난 경우」\n   → 법률관계의 조속한 확정\n\n ⑤ 「보험자가 「해지권을 포기」한 경우」\n   · 위반사실을 알고도 보험료를 계속\n     받아 온 경우\n   · 위반사실을 알고도 계약의 유지를\n     승인한 경우\n\n ⑥ 「보험을 모집한 자(설계사·대리점)가\n   ㉠ 계약자 또는 피보험자에게 「알릴 기회를\n      주지 아니하였거나」\n   ㉡ 「사실대로 알리는 것을 방해」하였거나\n   ㉢ 「부실고지를 권유」한 경우」\n   → 다만 그러한 사정이 없었다면 계약자가\n     「사실대로 알렸을 것」으로 인정되는\n     경우에 한한다.\n     (보험업법 제97조, 표준약관)\n\n ⑦ 「보험자가 「알릴 의무를 위반한 사실을\n   기초로 계약을 다시 인수한」 경우」\n\n ⑧ 자동차보험 특유\n   「계약자가 「추가보험료를 납입」하여\n    계약을 유지하기로 한 경우」」</span>\n\n<h4>Ⅳ. 정리</h4>\n<span class=\"tb\">  위반 요건   고의·중과실 + 중요한 사항\n  ────────────────────────────────────────\n  효    과   ① 계약 해지\n             ② 해지 전 사고도 부지급·반환\n                (인과관계 없으면 지급)\n             ③ 추가보험료 납입으로 유지 가능\n  ────────────────────────────────────────\n  해지 제한   ① 보험자가 알았거나 중과실로 몰랐음\n             ② 계약자에게 고의·중과실 없음\n             ③ 안 날부터 1개월 경과\n             ④ 체결일부터 3년 경과\n             ⑤ 해지권의 포기\n             ⑥ 모집자의 방해·부실고지 권유\n             ⑦ 추가보험료 납입에 의한 유지</span>\n", "keys": ["상법 제651조 — 청약 시 중요한 사항을 사실대로", "청약서 질문사항은 중요한 사항으로 추정(제651조의2)", "고의 또는 중대한 과실이 있어야 위반", "해지권은 안 날부터 1개월, 체결일부터 3년", "해지 시 해지 전 사고도 부지급·반환, 인과관계 없으면 지급(제655조 단서)", "자동차보험은 추가보험료 납입으로 계약 유지 가능", "해지 제한 — 보험자 악의·중과실, 계약자 경과실, 기간 경과, 해지권 포기, 모집자의 방해·권유"], "law": ["상법 제651조·제651조의2·제652조·제655조", "자동차보험 표준약관(계약 전 알릴 의무·계약의 해지)", "보험업법 제97조"]}}]}, {"round": 49, "subject": "자동차구조 및 정비이론과 실무", "track": "차량", "src": "49회 2차 자동차 구조 및 정비이론과 실무.pdf", "chars": 700, "digits": 21, "pts_ok": true, "q": [{"no": 1, "body": "커먼레일 디젤엔진(CRDI; Common Rail Direct Injection)에서 연료 공급\n시스템의 구성요소와 역할을 약술하시오.(10점)", "sub": [10], "points": 10, "a": {"plan": "「저압계통 → 고압계통 → 제어계통」의 세 토막으로 나누어 연료가 흘러가는 순서대로 적으면 빠뜨림이 없다. 커먼레일의 핵심은 「압력 생성과 분사 시기를 분리」한 점이므로 그 취지를 앞에 세운다.", "ans": "\n<h4>0. 커먼레일 방식의 특징</h4>\n<span class=\"tb\">CRDI  Common Rail Direct Injection\n       「축압식 직접분사 디젤엔진」\n\n 종래의 열형·분배형 분사펌프는\n 「압력을 만드는 일」과 「분사하는 일」을\n 하나의 펌프가 함께 하였다.\n  → 분사압력이 「엔진 회전수에 끌려다녀」\n    저속에서 압력이 낮았다.\n\n 커먼레일은 이 둘을 「떼어 놓았다」.\n  · 「고압펌프」가 압력을 만들어\n    「커먼레일(공동 축압실)」에 저장하고\n  · 「인젝터」가 ECU의 신호에 따라\n    「원하는 때에, 원하는 양만큼」 분사한다.\n\n  → 「분사압력·분사시기·분사량·분사횟수」를\n    엔진 회전수와 무관하게 자유로이\n    제어할 수 있게 되었다.\n    (1,600~2,500 bar, 1사이클 최대 5~7회\n     다단분사)</span>\n\n<h4>Ⅰ. 저압(연료공급) 계통</h4>\n<span class=\"tb\">「① 연료탱크」\n   연료를 저장한다.\n\n「② 저압펌프 (Low Pressure Pump,\n   Feed Pump)」\n   · 연료를 빨아올려 고압펌프까지 보낸다.\n   · 「전기식(탱크 내장형)」 또는\n     「기계식(고압펌프 일체형)」\n   · 토출압력 약 「3~6 bar」\n   · 고압펌프에 연료가 모자라면\n     「캐비테이션」으로 펌프가 손상되므로\n     반드시 일정 압력을 유지하여야 한다.\n\n「③ 연료여과기 (Fuel Filter)」\n   · 「이물질 여과」 — 인젝터의 노즐 구멍은\n     ㎛ 단위이므로 미세 이물질도 치명적이다.\n   · 「수분분리기(Water Separator)」\n     — 물은 고압펌프와 인젝터를 녹슬게 하고\n       윤활을 방해한다. 아래에 모아 배출한다.\n   · 「수분감지센서」 — 경고등 점등\n   · 「연료가열기(Fuel Heater)」\n     — 겨울철 왁스(파라핀) 석출로 인한\n       필터 막힘을 막는다.\n\n「④ 저압 연료라인·리턴라인」\n   인젝터와 고압펌프에서 넘친 연료를\n   탱크로 되돌린다.</span>\n\n<h4>Ⅱ. 고압 계통</h4>\n<span class=\"tb\">「⑤ 고압펌프 (High Pressure Pump)」\n   · 엔진의 「캠축·크랭크축에 의하여 구동」\n   · 저압의 연료를 「1,600~2,500 bar」의\n     초고압으로 압축하여 커먼레일에 보낸다.\n   · 통상 「3기통 레이디얼 플런저식」\n\n「⑥ 연료압력조절밸브\n   (IMV, Inlet Metering Valve /\n    FPR, Fuel Pressure Regulator)」\n   · 「고압펌프의 「입구」에서」 흡입되는\n     연료량을 조절하여 토출압력을 제어한다.\n   · 필요한 만큼만 압축하므로 「구동손실이\n     적다」. (출구에서 넘겨 버리는 방식보다\n     효율이 좋다)\n\n「⑦ 커먼레일 (Common Rail, 축압기)」\n   · 고압연료를 「저장」하고 각 인젝터에\n     「같은 압력」으로 나누어 준다.\n   · 「맥동(압력 파동)을 감쇠」시켜\n     기통별 분사량 편차를 줄인다.\n   · 용적이 크면 맥동은 줄지만 압력 응답이\n     느려지므로 적절히 설계한다.\n\n「⑧ 레일압력센서 (RPS, Rail Pressure\n   Sensor)」\n   · 커먼레일의 실제 압력을 ECU에 알린다.\n   · ECU는 이 값과 목표압력을 견주어\n     IMV를 「폐회로(closed-loop)」 제어한다.\n\n「⑨ 압력제한밸브 (PLV, Pressure Limiting\n   Valve) / 레일압력조절밸브(RPCV)」\n   · 압력이 규정을 넘으면 「기계적으로 열려」\n     연료를 리턴라인으로 보내 레일을\n     보호한다. (안전밸브)\n\n「⑩ 고압파이프」\n   · 커먼레일과 각 인젝터를 잇는다.\n   · 「길이를 같게」 하여 기통별 압력차를\n     없앤다. 재사용을 금하는 경우가 많다.\n\n「⑪ 인젝터 (Injector)」\n   · ECU의 통전 신호로 노즐을 열어\n     연소실에 「직접」 분사한다.\n   · 「솔레노이드식」 — 전자석으로 제어밸브\n     구동. 응답 약 0.4~0.5ms\n   · 「피에조식(Piezo)」 — 압전소자의\n     신축을 이용. 응답 「0.1ms 이하」로\n     빨라 다단분사에 유리하고 소음이 적다.\n   · 「다단분사」\n       「파일럿(예비)분사」 — 착화지연을\n         줄여 「디젤 노크·소음」을 낮춘다.\n       「주분사(Main)」 — 출력을 낸다.\n       「사후분사(After/Post)」 — 매연(PM)을\n         태우고 「DPF 재생」을 위한 배기온도를\n         높인다.\n   · 「인젝터 보정값(IQA·C2i·C3i 코드)」\n     — 개체차를 보정하기 위해 교환 시\n       ECU에 반드시 입력하여야 한다.</span>\n\n<h4>Ⅲ. 제어 계통</h4>\n<span class=\"tb\">「⑫ ECU (엔진제어유닛)」\n   각 센서의 신호를 받아 「목표 레일압력·\n   분사시기·분사량·분사횟수」를 정하고\n   IMV와 인젝터를 구동한다.\n\n「⑬ 입력 센서」\n   · 「크랭크각 센서(CKP)」  기준 위치·회전수\n   · 「캠각 센서(CMP)」      기통 판별\n   · 「가속페달 위치센서(APS)」 운전자 요구\n   · 「공기유량센서(AFS)·흡기압센서(MAP)」\n   · 「부스트압센서·흡기온센서」\n   · 「냉각수온센서(WTS)」\n   · 「레일압력센서(RPS)」\n   · 「연료온도센서」</span>\n\n<h4>Ⅳ. 정비상의 요점</h4>\n<span class=\"tb\">· 「연료여과기의 수분 배출」과 정기 교환이\n  고압계통 고장의 대부분을 예방한다.\n· 「인젝터 리턴량(백리크) 점검」으로\n  불량 인젝터를 가려낸다.\n· 고압계통 작업 전에는 「압력이 완전히\n  빠진 것을 확인」하여야 한다.\n  (2,000 bar의 연료 분류는 피부를 뚫는다)\n· 인젝터·고압펌프 교환 후에는\n  「보정값 입력」과 「학습(초기화)」이\n  반드시 필요하다.</span>\n", "keys": ["압력 생성과 분사 제어의 분리가 커먼레일의 본질", "저압계통 — 연료탱크·저압펌프·연료여과기(수분분리기·연료가열기)·리턴라인", "고압계통 — 고압펌프·IMV·커먼레일·레일압력센서·압력제한밸브·고압파이프·인젝터", "IMV는 펌프 입구에서 흡입량을 조절해 구동손실을 줄임", "인젝터 솔레노이드식과 피에조식의 응답 차이", "다단분사 — 파일럿(소음 저감)·주분사·사후분사(DPF 재생)", "인젝터 보정값(IQA) 입력 필수"], "law": ["커먼레일 디젤엔진 연료분사장치 일반이론", "제작사 정비지침서(연료계통)"]}}, {"no": 2, "body": "유성 기어식 동력분기형 하이브리드 시스템(Hybrid System)의 구성요소와\n단계별 동력분배 원리를 서술하시오.(15점)", "sub": [15], "points": 15, "a": {"plan": "유성기어의 세 요소에 엔진·MG1·MG2를 각각 붙여 놓는 것이 출발점이다. 그다음 「EV → 분기주행 → 전부하 → 회생제동 → 충전 → 후진」의 순서로 어느 요소가 어디로 힘을 보내는지 따라간다.", "ans": "\n<h4>0. 동력분기형이란</h4>\n<span class=\"tb\">하이브리드는 결합방식에 따라\n 「직렬형(Series)」   엔진 → 발전 → 모터 구동\n 「병렬형(Parallel)」 엔진과 모터가 함께 구동\n 「동력분기형(Power Split, 직·병렬 복합형)」\n\n 동력분기형은 「유성기어장치」로 엔진의\n 동력을 「기계적 경로」와 「전기적 경로」로\n 「나누어(split)」 전달한다.\n\n · 「기계적 경로」  엔진 → 링기어 → 구동륜\n · 「전기적 경로」  엔진 → 선기어 → MG1 발전\n                   → 인버터 → MG2 → 구동륜\n\n 두 경로의 비율을 「MG1의 회전수」로\n 조절하면 엔진 회전수를 무단으로 바꿀 수\n 있다. → 「e-CVT(전자식 무단변속)」\n (도요타 THS, 현대 TMED-Ⅱ 계열 등)</span>\n\n<h4>Ⅰ. 구성요소</h4>\n<span class=\"tb\">「① 엔진 (내연기관)」\n   · 「앳킨슨(밀러) 사이클」의 고효율 엔진을\n     쓰는 것이 보통이다.\n   · 유성기어의 「캐리어(Carrier)」에 연결\n\n「② MG1 (Motor Generator 1)」\n   · 유성기어의 「선기어(Sun Gear)」에 연결\n   · 주된 역할은 「발전기」\n   · 「엔진 시동(스타터)」\n   · 「엔진 회전수 제어」 — MG1의 회전수를\n     바꾸면 엔진 회전수가 정해진다.\n     (e-CVT의 핵심)\n\n「③ MG2 (Motor Generator 2)」\n   · 유성기어의 「링기어(Ring Gear)」에 연결\n   · 주된 역할은 「구동모터」\n   · 감속 시에는 「발전기」가 되어\n     「회생제동」을 한다.\n\n「④ 유성기어장치 (Power Split Device)」\n   · 「선기어 — MG1」\n   · 「캐리어(피니언 기어의 축) — 엔진」\n   · 「링기어 — MG2 + 출력」\n   · 링기어의 출력이 「감속기 → 차동장치\n     → 구동륜」으로 간다.\n\n「⑤ 고전압 배터리」\n   · 리튬이온 또는 니켈수소\n   · SOC를 「40~70%」 부근에서 관리한다.\n\n「⑥ 인버터·컨버터(PCU)」\n   · 배터리 직류 ↔ MG1·MG2 교류\n   · 승압컨버터로 전압을 높여 모터 효율을\n     올린다.\n\n「⑦ HCU (하이브리드 제어유닛)」\n   · 운전자의 요구 토크, SOC, 차속, 엔진\n     효율을 종합하여 「엔진·MG1·MG2의\n     분담」을 정한다.」</span>\n\n<h4>Ⅱ. 유성기어의 회전수 관계</h4>\n<span class=\"tb\">선기어 잇수 Zs, 링기어 잇수 Zr일 때\n\n 「(Zs + Zr) × Nc = Zs × Ns + Zr × Nr」\n\n  Nc  캐리어(엔진) 회전수\n  Ns  선기어(MG1) 회전수\n  Nr  링기어(MG2·출력) 회전수\n\n → 엔진 회전수는 「MG1과 링기어 회전수의\n   가중평균」이다.\n → 차속(Nr)이 정해져 있어도 「MG1의\n   회전수를 바꾸면 엔진 회전수를 자유로이」\n   정할 수 있다. 이것이 무단변속의 원리이다.\n\n［토크의 배분 — Zs : Zr = 30 : 78인 경우］\n  엔진 토크가 캐리어에 들어오면\n   · 링기어 쪽으로  78/108 ≒ 「72%」\n   · 선기어 쪽으로  30/108 ≒ 「28%」\n  로 나뉜다.\n  → 엔진 동력의 약 「72%는 기계적으로\n    바로」 바퀴로 가고, 약 「28%는 MG1이\n    전기로 바꾸어」 MG2를 거쳐 바퀴로 간다.</span>\n\n<h4>Ⅲ. 단계별 동력분배 원리</h4>\n\n<h4>1. 출발·저속 — 「EV 모드」</h4>\n<span class=\"tb\">  엔진   「정지」\n  MG1    무부하 (역회전하며 공회전)\n  MG2    「배터리 전력으로 단독 구동」\n\n · 엔진은 저속·저부하에서 효율이 나쁘므로\n   아예 끄고 모터만으로 달린다.\n · 캐리어(엔진)가 멈춰 있으므로 링기어가\n   정회전하면 선기어는 「역회전」한다.\n   MG1은 이때 힘을 내지 않고 끌려 돈다.\n · 조용하고 배기가스가 없다.</span>\n\n<h4>2. 정속 주행 — 「동력분기 모드」  ← 핵심</h4>\n<span class=\"tb\">  엔진   「시동·구동」 (캐리어 입력)\n  MG1    「발전」 (선기어에서 반력을 받아)\n  MG2    「구동」 (발전된 전기로 보조)\n\n ① MG1이 「반력 토크」를 받쳐 주어야\n    캐리어(엔진)의 토크가 링기어로\n    전달된다. MG1이 헛돌면 힘이 전달되지\n    않는다.\n ② 그 반력을 받는 과정에서 MG1은\n    「발전기」가 되어 전기를 만든다.\n ③ 그 전기는 인버터를 거쳐 「곧바로 MG2」로\n    가서 구동에 보태진다.\n    (배터리를 거치지 않는 「직결 경로」이므로\n     손실이 적다)\n\n → 엔진 동력이 「기계 72% + 전기 28%」로\n   나뉘어 모두 바퀴로 간다.\n → HCU는 엔진을 「최적 연비선(BSFC가 가장\n   좋은 운전점)」에 올려놓고, 남거나 모자라는\n   힘을 MG1·MG2로 메운다.</span>\n\n<h4>3. 급가속·등판 — 「전부하 모드」</h4>\n<span class=\"tb\">  엔진   「최대 출력」\n  MG1    발전\n  MG2    「배터리 전력 + MG1 발전전력」으로\n         최대 토크\n\n · 엔진 출력만으로 부족하므로 배터리의\n   전력을 「추가로 꺼내」 MG2를 돌린다.\n · 「엔진 + 모터」의 토크가 합산되어\n   같은 배기량의 엔진차보다 가속이 좋다.\n · SOC가 떨어지므로 오래 지속할 수 없다.</span>\n\n<h4>4. 감속·제동 — 「회생제동 모드」</h4>\n<span class=\"tb\">  엔진   「연료차단(퓨얼컷)」 또는 정지\n  MG1    무부하\n  MG2    「발전기」로 전환\n\n · 바퀴가 MG2를 돌려 「운동에너지를\n   전기에너지로」 바꾸어 배터리를 충전한다.\n · 마찰 브레이크로 열이 되어 버려질 에너지를\n   되찾는 것이므로 연비 향상의 가장 큰\n   몫을 차지한다.\n · 「협조제어(Regenerative Braking\n   Cooperative Control)」로 회생제동력과\n   유압제동력을 합쳐 운전자가 느끼는\n   감속도를 일정하게 유지한다.</span>\n\n<h4>5. 정차 — 「아이들 스톱 / 충전 모드」</h4>\n<span class=\"tb\">  · SOC가 충분하면 「엔진 정지」\n    (공회전 연료소비 0)\n  · SOC가 낮거나 난방·에어컨이 필요하면\n    「엔진을 돌려 MG1으로 발전」한다.\n    이때 링기어(출력)는 멈춰 있고\n    엔진 동력이 「전부 선기어 → MG1」로\n    흘러 배터리를 충전한다.\n    → 「정차 중 충전(직렬형 동작)」</span>\n\n<h4>6. 후진 — 「MG2 역회전」</h4>\n<span class=\"tb\">  · 「후진 전용 기어가 없다」.\n  · 엔진을 끈 채 「MG2를 거꾸로 돌려」\n    후진한다.\n  · SOC가 매우 낮으면 엔진을 돌려\n    MG1으로 발전하면서 MG2를 역회전시킨다.\n    (엔진은 후진 구동에 직접 관여하지 않는다)</span>\n\n<h4>Ⅳ. 정리</h4>\n<span class=\"tb\">  단  계        엔진      MG1        MG2\n──────────────────────────────────────────────\n 출발·저속     정지     무부하      「구동」\n 정속(분기)   「구동」  「발전」      구동(보조)\n 급가속       최대출력   발전      「최대구동」\n              (배터리 방전으로 보강)\n 감속·제동     정지·컷   무부하    「발전(회생)」\n 정차 충전    「구동」  「발전」      정지\n 후진          정지    (필요시 발전) 「역회전 구동」\n\n · 「MG1은 반력을 받쳐 주며 발전하고,\n   MG2는 바퀴를 돌린다」가 한 줄 요약이다.\n · 「유성기어 + MG1의 회전수 제어」가\n   변속기 없이 무단변속을 만들어 낸다.</span>\n", "keys": ["선기어=MG1, 캐리어=엔진, 링기어=MG2+출력", "(Zs+Zr)Nc = Zs·Ns + Zr·Nr — 엔진 회전수는 가중평균", "토크 분배 링기어 약 72% / 선기어 약 28%", "MG1이 반력을 받쳐야 엔진 토크가 전달되고 그 과정에서 발전", "EV모드 → 동력분기 → 전부하(배터리 방전) → 회생제동 → 정차충전 → 후진(MG2 역회전)", "후진 전용 기어가 없음", "MG1 회전수 제어 = e-CVT 무단변속"], "law": ["유성기어식 동력분기형 하이브리드(THS·TMED-Ⅱ) 일반이론"]}}, {"no": 3, "body": "자동차 전장 시스템에 적용되는 IPS(Intelligent Power Switch)의 기능과\n효과에 대하여 약술하시오.(10점)", "sub": [10], "points": 10, "a": {"plan": "「릴레이 + 퓨즈를 반도체 하나로 대체하고 거기에 보호와 진단을 얹었다」가 정의의 전부다. 기능을 스위칭·보호·진단의 셋으로 묶고, 효과는 소형화·경량화·신뢰성·정비성의 넷으로 정리한다.", "ans": "\n<h4>Ⅰ. IPS란</h4>\n<span class=\"tb\">IPS  Intelligent Power Switch\n     (Intelligent Power Semiconductor,\n      스마트 파워 스위치)\n\n 종래의 전장 회로\n  「퓨즈」 (과전류 차단)\n   + 「릴레이」 (기계적 접점 스위칭)\n   + 굵은 「배선」\n\n IPS\n  「전력용 MOSFET」에\n  「과전류·과열·단락 보호회로」와\n  「진단·통신회로」를 「하나의 반도체 칩」에\n  집적한 「지능형 전력 스위칭 소자」\n\n → 퓨즈와 릴레이가 하던 일을\n   반도체 하나가 「더 똑똑하게」 한다.\n → 스마트 정션박스(IPM, Intelligent Power\n   Module)의 핵심 부품이며, 램프·모터·\n   열선 등 대부분의 부하 제어에 쓰인다.</span>\n\n<h4>Ⅱ. 기능</h4>\n\n<h4>1. 전력 스위칭</h4>\n<span class=\"tb\">· ECU(BCM 등)의 「저전류 신호」로\n  「대전류 부하」를 켜고 끈다.\n· 기계적 접점이 없는 「무접점 스위칭」\n· 「PWM 제어」가 가능하여\n  - 램프의 「조광(디밍)」\n  - 「소프트 스타트」로 돌입전류 억제\n  - 모터의 속도 제어\n  를 할 수 있다.</span>\n\n<h4>2. 보호 기능</h4>\n<span class=\"tb\">「① 과전류 보호 (Over-current)」\n   규정 이상의 전류가 흐르면 스스로 차단.\n   퓨즈와 달리 「끊어지지 않고」 원인이\n   없어지면 「자동 복귀」한다.\n\n「② 단락 보호 (Short circuit)」\n   부하 단락 시 즉시 차단하여 하네스 발화를\n   막는다.\n\n「③ 과열 보호 (Thermal shutdown)」\n   칩 온도가 규정을 넘으면 차단하고,\n   식으면 다시 켠다.\n\n「④ 과전압·역전압 보호」\n   로드덤프, 배터리 역결선으로부터\n   회로를 지킨다.\n\n「⑤ ESD·서지 보호」」</span>\n\n<h4>3. 진단 기능</h4>\n<span class=\"tb\">「① 부하 개방 감지 (Open load detection)」\n   램프가 끊어지거나 커넥터가 빠지면\n   「미세 전류를 흘려」 단선을 알아낸다.\n   → 계기판에 「전구 단선 경고」를 띄운다.\n\n「② 고장 상태 피드백」\n   과전류·과열·단선·단락의 종류를 구분하여\n   「진단 신호(Status Pin) 또는 통신」으로\n   ECU에 알린다.\n   → 「고장코드(DTC)」로 기록되어\n     스캐너로 확인할 수 있다.\n\n「③ 전류 검출 (Current Sense)」\n   흐르는 전류의 크기를 비례 출력하여\n   부하 상태를 감시하고 「암전류 관리」에\n   쓴다.」</span>\n\n<h4>Ⅲ. 효과</h4>\n<span class=\"tb\">「① 소형·경량화」\n   퓨즈·릴레이·릴레이 소켓이 사라져\n   정션박스의 크기와 무게가 크게 줄고,\n   배선(와이어링 하네스)도 가늘고 짧아진다.\n   → 차량 경량화와 연비·전비 향상\n\n「② 원가 절감」\n   부품 수와 조립 공수가 준다.\n\n「③ 신뢰성·내구성 향상」\n   기계적 접점이 없으므로\n   「아크·접점 소착·채터링·접촉저항 증가」가\n   생기지 않는다.\n   수명이 릴레이보다 훨씬 길다.\n\n「④ 무소음·무진동」\n   릴레이의 「딸깍」 소리가 없다.\n\n「⑤ 안전성 향상」\n   과전류를 「즉시」 차단하므로 하네스\n   발화 위험이 줄고, 퓨즈처럼 「끊어진 채\n   방치」되지 않는다.\n\n「⑥ 정비성 향상」\n   · 「퓨즈를 교환할 필요가 없다」.\n     원인을 없애면 자동 복귀한다.\n   · 「어느 회로가 왜 고장인지」를\n     고장코드로 알려 주므로 진단이 빠르다.\n\n「⑦ 제어의 자유도 확대」\n   PWM 조광, 단계별 점등, 암전류 차단,\n   슬립 모드 관리 등 「소프트웨어로」\n   기능을 넣을 수 있다.\n   CAN·LIN 네트워크와의 연계가 쉽다.」</span>\n\n<h4>Ⅳ. 정비 시 유의점</h4>\n<span class=\"tb\">「① 규격 외 부하를 달지 말 것」\n   · 전구를 「LED로 임의 교체」하면\n     소비전류가 작아져 IPS가 「단선으로\n     오판」하여 경고등을 켜거나 회로를\n     차단한다.\n   · 반대로 용량을 넘는 등화·오디오를\n     달면 「과전류로 차단」된다.\n\n「② 반복 차단은 원인을 찾아야 한다」\n   자동 복귀하므로 「깜빡거리는 증상」으로\n   나타난다. 퓨즈처럼 눈으로 끊긴 것을\n   확인할 수 없다.\n   → 반드시 「스캐너로 고장코드」를 읽는다.\n\n「③ 개별 교환이 어렵다」\n   IPS는 정션박스 기판에 집적되어 있어\n   「모듈(스마트 정션박스) 통째로 교환」하는\n   경우가 많다. 손해액이 커질 수 있다.\n\n「④ 임의 배선(직결) 금지」\n   IPS를 우회하여 전원을 직접 따면\n   보호기능이 무력화되어 화재로 이어진다.」</span>\n", "keys": ["퓨즈 + 릴레이를 대체하는 보호·진단 내장 반도체 스위치", "스위칭 — 무접점, PWM 조광·소프트스타트", "보호 — 과전류·단락·과열·과전압, 자동 복귀", "진단 — 부하 개방 감지, 고장 피드백, 전류 검출", "효과 — 소형경량·원가절감·신뢰성·무소음·안전성·정비성·제어 자유도", "LED 임의 교체 시 단선 오진단", "정션박스 통째 교환이 많아 손해액 증가"], "law": ["자동차 전장 시스템 일반이론", "스마트 정션박스(IPM) 정비지침"]}}, {"no": 4, "body": "자동차 차체의 전착도막(Electric-coating)이 손상되는 원인과 복원수리방법에\n대하여 약술하시오.(10점)", "sub": [10], "points": 10, "a": {"plan": "전착도막이 「구멍 속까지 입혀지는 방청의 뿌리」임을 먼저 세우면, 손상 원인(판금·연마·용접열·절단)과 복원(방청 프라이머 + 왁스)이 자연히 따라 나온다. 「보수도장으로는 완전히 재현할 수 없다」는 한계를 반드시 짚는다.", "ans": "\n<h4>0. 전착도막이란</h4>\n<span class=\"tb\">「전착도장(Electro-deposition Coating,\n ED Coat)」\n\n 차체를 도료 수용액에 「통째로 담그고」\n 차체와 전극 사이에 직류를 걸어,\n 전기영동으로 도료 입자를 차체 표면에\n 「고르게 석출」시키는 「하도(下塗)」 도장이다.\n\n 도장 공정의 자리\n  전처리(탈지 → 인산아연 피막)\n   → 「전착도장 (하도)」   ← 방청의 뿌리\n   → 실러·언더코팅\n   → 중도 (프라이머 서페이서)\n   → 상도 (베이스코트 + 클리어코트)\n\n 특징\n  · 「막두께가 균일」하다 (20㎛ 안팎)\n  · 「구멍 속, 박스 섹션 안쪽, 겹침부」까지\n    도료가 돌아 들어간다(투과성·회전성).\n  · 「소지(철판)와의 밀착력」이 매우 높다.\n  · 「180℃ 안팎에서 소부(燒付)」하여\n    치밀한 도막이 된다.\n\n  → 차체 방청성능의 「거의 전부」가\n    이 층에서 나온다.\n    상도는 색과 광택을 낼 뿐이다.</span>\n\n<h4>Ⅰ. 전착도막이 손상되는 원인</h4>\n\n<h4>1. 사고 자체에 의한 손상</h4>\n<span class=\"tb\">「① 충격에 의한 도막 파괴」\n   판넬이 변형될 때 도막이 「깨지거나\n   벗겨진다」. 눈에 보이지 않는\n   「미세균열(microcrack)」도 생긴다.\n\n「② 석재 충격(Chipping)」\n   튀는 돌에 맞아 도막이 떨어져 나간다.\n   (하부·휠하우스·로커패널)\n\n「③ 부식(녹)」\n   염화칼슘(제설제)·해풍·습기로 도막이\n   들뜨고 그 아래에서 녹이 번진다.」</span>\n\n<h4>2. 수리작업 중의 손상  ← 실무에서 가장 많다</h4>\n<span class=\"tb\">「④ 판금·수정 작업」\n   · 해머·돌리로 두드리면 도막이\n     「탄성한계를 넘어 깨진다」.\n   · 「스터드 용접(덴트 풀러)」의 용접점마다\n     도막이 소실된다.\n   · 「인출(引出) 작업」으로 늘어나면서\n     갈라진다.\n\n「⑤ 연마(샌딩) 작업」\n   · 퍼티 작업 전 소지를 내려고 갈아내면\n     「전착도막까지 함께 제거」된다.\n   · 「단차 제거(Feather Edge)」 작업에서\n     의도치 않게 넓은 면적이 깎인다.\n   · 이것이 「가장 흔한 원인」이다.\n\n「⑥ 용접 열」\n   · 스폿용접·CO2용접의 열로 「용접부와\n     그 주변 수십 mm」의 도막이 타서\n     소실된다.\n   · 도막이 탄 자리는 「탄화물」이 남아\n     밀착을 방해한다.\n   · 특히 「겹침부 안쪽」은 손이 닿지 않아\n     방청 복원이 어렵다.\n\n「⑦ 절단·드릴링」\n   · 패널 교환 시 「절단면」과 스폿 제거를\n     위한 「드릴 구멍」의 단면은 소지가\n     그대로 드러난다.\n   · 절단면은 「모세관 현상」으로 물이 스며\n     부식이 가장 빨리 시작되는 곳이다.\n\n「⑧ 열간(가열) 교정」\n   · 산소·아세틸렌 토치로 가열하면\n     도막이 타고 강판의 「방청 아연도금층」\n     까지 손상된다.\n\n「⑨ 화학적 손상」\n   · 배터리액(황산), 브레이크액, 강산성\n     세척제, 유기용제에 의한 도막의 팽윤·\n     박리」</span>\n\n<h4>3. 제조·관리상의 원인</h4>\n<span class=\"tb\">「⑩ 전처리 불량」\n   탈지가 덜 되었거나 인산아연 피막이\n   고르지 못하면 밀착이 나빠 뒷날 박리된다.\n\n「⑪ 도장 조건 불량」\n   전압·통전시간·소부온도의 부족」</span>\n\n<h4>Ⅱ. 복원수리방법</h4>\n\n<h4>1. 원칙</h4>\n<span class=\"tb\">「전착도막은 「공장의 침적·전기영동 설비」가\n 있어야 만들 수 있으므로 보수도장으로는\n 「완전히 재현할 수 없다」.」\n\n → 따라서 복원의 목표는\n   「전착도막에 준하는 방청성능을\n    다른 수단으로 확보하는 것」이다.\n → 「소지가 드러난 곳을 절대로 그냥 두지\n   않는다」가 철칙이다.</span>\n\n<h4>2. 순서</h4>\n<span class=\"tb\">「① 손상 범위의 확인」\n   · 도막 두께 측정기로 도막이 남은 곳과\n     소지가 드러난 곳을 가린다.\n   · 들뜬 도막은 「끝까지 긁어내어」\n     건전한 부분만 남긴다.\n\n「② 녹·이물질 제거」\n   · 「샌드페이퍼·와이어브러시·블라스팅」\n   · 녹이 깊으면 「인산계 녹 변환제」를\n     쓰거나 판을 교환한다.\n\n「③ 단차 제거 (Feather Edge)」\n   · 기존 도막과 소지 사이의 경계를\n     완만하게 갈아 「단차를 없앤다」.\n   · 단차가 남으면 도장 후 경계선이 비친다.\n\n「④ 탈지 (Degreasing)」\n   · 「실리콘 리무버·왁스 앤드 그리스\n     리무버」로 유분·손기름·연마분진을\n     완전히 제거한다.\n   · 이 공정을 빠뜨리면 뒤의 모든 도막이\n     들뜬다.\n\n「⑤ 방청 프라이머 도포  ← 가장 중요」\n   소지가 드러난 부분에 「반드시」 도포한다.\n   · 「에칭 프라이머(워시 프라이머)」\n     — 인산이 소지를 가볍게 부식시켜\n       화학적 밀착을 얻는다. 얇게 1회.\n   · 「2액형 에폭시 프라이머」\n     — 방청성이 가장 좋아 전착도막의\n       대체층으로 권장된다.\n   · 「징크(아연) 리치 프라이머」\n     — 아연의 희생양극 작용으로 방청\n\n「⑥ 용접부의 처리」\n   · 용접 「전」에 접합면에\n     「용접용 방청도료(Weld-through\n      Primer, 아연계)」를 도포한다.\n     → 용접 후에는 겹침부 안쪽에 손이\n       닿지 않으므로 미리 발라야 한다.\n   · 용접 「후」에는 노출된 용접비드와\n     주변을 연마하고 방청 프라이머를\n     도포한다.\n   · 「절단면·드릴 구멍」의 단면에도\n     빠짐없이 도포한다.\n\n「⑦ 퍼티 → 중도(프라이머 서페이서)」\n   · 퍼티는 「방청 프라이머 위에」 올린다.\n     (소지에 직접 올리면 습기를 빨아들여\n      부풀어 오른다)\n   · 중도로 미세한 요철을 메우고\n     연마하여 면을 만든다.\n\n「⑧ 상도 (베이스코트 → 클리어코트)」\n   · 색상 조색 후 도장, 강제건조\n\n「⑨ 실러(Sealer) 복원」\n   · 패널 접합부의 실링을 「원래 모양대로」\n     복원한다. 실링이 없으면 그 틈으로\n     물이 들어간다.\n\n「⑩ 방청왁스(Cavity Wax) 주입」\n   · 필러·사이드실·크로스멤버 등\n     「박스 섹션 내부」에 노즐을 넣어\n     방청왁스를 분사한다.\n   · 내부 전착도막이 용접열로 손상된 곳을\n     보완하는 「유일한 수단」이다.\n\n「⑪ 언더코팅」\n   · 하부·휠하우스에 「PVC계 언더코팅」을\n     도포하여 석재 충격과 습기를 막는다.」</span>\n\n<h4>Ⅲ. 손해사정상의 유의점</h4>\n<span class=\"tb\">· 「방청 프라이머·용접용 방청도료·\n  방청왁스·실러」의 재료비와 공임은\n  「정당한 복원비용」이므로 인정하여야 한다.\n· 반대로 「손상되지 않은 부위」까지\n  전면 도장하는 것은 과잉수리이다.\n· 「절단·용접을 수반하는 패널 교환」에서는\n  방청처리 여부를 반드시 확인한다.\n  방청을 생략하면 2~3년 뒤 그 자리에서\n  녹이 올라와 「재수리 분쟁」이 된다.\n· 신차의 「방청 보증(통상 5~7년)」은\n  사고수리 부위에 대하여는 배제되는\n  경우가 많으므로, 복원 품질이 곧\n  차량가치와 직결된다.</span>\n", "keys": ["전착도장은 침적·전기영동 방식의 하도, 방청성능의 뿌리", "손상 원인 — 충격·석재충격·부식, 판금수정·연마·용접열·절단드릴링·열간교정, 화학적 손상", "연마 작업이 실무에서 가장 흔한 원인", "보수도장으로는 완전 재현 불가 → 방청 프라이머로 대체", "순서 — 범위확인·녹제거·단차제거·탈지·방청프라이머·중도·상도", "용접 전 Weld-through Primer, 용접 후 노출부 방청", "실러 복원 + 박스섹션 방청왁스 주입 + 언더코팅"], "law": ["자동차 보수도장 일반이론", "제작사 차체수리 지침서(방청처리)"]}}, {"no": 5, "body": "에어백(Air Bag)의 시스템 구성을 설명하고, SRS(Supplemental Restraint\nSystem)에어백, 디파워드 에어백(Depowered Air Bag), 스마트 에어백\n(Smart Air Bag), 어드밴스드 에어백(Advanced Air Bag)의 특징에 대하여\n서술하시오.(20점)", "sub": [20], "points": 20, "a": {"plan": "구성은 「센서 → 제어(ACU) → 전개(인플레이터)」의 세 덩어리로 세우고, 세대별 특징은 「전개력을 낮추었나(디파워드) → 상황을 나누어 조절하나(스마트) → 사람까지 재는가(어드밴스드)」의 진화 순서로 꿰면 외우기 쉽다.", "ans": "\n<h4>Ⅰ. 에어백 시스템의 구성</h4>\n\n<h4>1. 센서부 — 「사고를 알아채는 부분」</h4>\n<span class=\"tb\">「① 충돌감지센서 (Impact / Crash Sensor)」\n   · 「프런트 임팩트 센서(FIS)」\n     라디에이터 서포트 좌우에 설치.\n     정면충돌의 감속도를 가장 먼저 감지\n   · 「사이드 임팩트 센서(SIS) /\n     새틀라이트 센서」\n     B필러·도어 내부. 측면충돌 감지\n   · 「압력식 측면센서(PAS)」\n     도어 내부의 공기압 변화로 감지.\n     응답이 빨라 최근에 널리 쓰인다.\n\n「② 안전센서 (Safing Sensor)」\n   · ACU 안에 별도로 들어 있는 센서\n   · 주센서가 오작동하여도 「안전센서가\n     함께 켜져야만」 전개된다.\n   · 「2중 확인」으로 오전개를 막는다.\n\n「③ 가속도(G) 센서·요레이트 센서」\n   · 충돌의 세기와 방향, 전복(Rollover) 판정\n\n「④ 승객감지센서」\n   · 「PPD (Passenger Presence\n      Detection)」 — 조수석 승객 유무\n   · 「OPDS」 (Occupant Position Detection\n      System) — 적외선 센서로 착좌자세 감지\n   · 「PODS / OCS」 (Occupant Classification\n      System) — 시트 하부의 「하중센서」나\n      매트식 압력센서로 「체중·체격」을 판정\n\n「⑤ 안전벨트 버클 스위치」\n   · 벨트 착용 여부\n\n「⑥ 시트 트랙 위치 센서」\n   · 시트가 앞으로 당겨져 있는지(근접 착좌)」</span>\n\n<h4>2. 제어부 — ACU (Air bag Control Unit)</h4>\n<span class=\"tb\">「① 충돌 판정 알고리즘」\n   감속도 파형을 분석하여 「전개할 것인지,\n   어느 에어백을, 몇 단으로, 언제」 터뜨릴지\n   결정한다.\n   · 판정에서 전개까지 약 「10~30ms」\n   · 전개 완료까지 약 「50ms」\n     (눈 깜빡임의 1/5)\n\n「② 예비전원 (Back-up Capacitor)」\n   충돌로 배터리 케이블이 끊어져도\n   「콘덴서에 저장된 전기」로 전개할 수\n   있다. (수 초간 유지)\n\n「③ 자기진단과 경고등 제어」\n   시동 시 전구 점검 후 소등.\n   고장이 있으면 점등을 유지하고\n   「고장코드(DTC)」를 기록한다.\n\n「④ 사고기록장치 (EDR, Event Data\n   Recorder)」\n   충돌 전후의 속도·가속도·벨트 착용·\n   스로틀·브레이크 등을 기록한다.\n   → 「손해사정과 사고재현의 핵심 자료」\n\n「⑤ 통신」\n   CAN으로 다른 제어기와 연계\n   (충돌 시 연료차단, 도어 언록, 비상등)」</span>\n\n<h4>3. 전개부 — 「실제로 부풀리는 부분」</h4>\n<span class=\"tb\">「① 인플레이터 (Inflater, 가스발생기)」\n   · 「점화장치(Squib / Igniter)」\n     ACU의 전류로 점화제를 발화\n   · 「가스발생제」\n     - 「화약식」 — 아지화나트륨(NaN3),\n       최근에는 질산암모늄·질산구아니딘계\n     - 「압축가스식」 — 아르곤·헬륨 봉입\n     - 「하이브리드식」 — 화약 + 압축가스\n   · 「필터」로 고온 가스를 냉각·여과\n\n「② 에어백 쿠션 (Bag)」\n   · 나일론 66 원단, 실리콘 코팅\n   · 「벤트홀(Vent Hole)」로 가스를 빼내며\n     충격을 흡수한다(에너지 감쇠).\n\n「③ 모듈 커버」\n   · 「지정 파단선(Tear Line)」을 따라\n     정해진 모양으로 찢어진다.\n\n「④ 좌석안전띠 프리텐셔너 (BPT)」\n   · 에어백보다 「먼저」 작동하여 벨트를\n     되감아 승객을 시트에 붙잡아 둔다.\n   · 「로드리미터(EFD)」가 일정 하중을\n     넘으면 벨트를 풀어 흉부 상해를 줄인다.\n\n「⑤ 클록 스프링 (Clock Spring)」\n   · 조향휠이 회전하여도 운전석 에어백에\n     전기가 이어지도록 하는 「감김식\n     플랫케이블」\n   · 교환·조립 시 「중립 위치」를 반드시\n     맞추어야 한다.\n\n「⑥ 에어백 경고등」」</span>\n\n<h4>Ⅱ. 세대별 에어백의 특징</h4>\n\n<h4>1. SRS 에어백 — 1세대</h4>\n<span class=\"tb\">SRS  Supplemental Restraint System\n     「보조 구속장치」\n\n「① 이름 그대로 「보조」이다」\n   주된 구속장치는 「안전벨트」이고,\n   에어백은 벨트를 맨 승객을 「보조」할 뿐이다.\n   → 벨트를 매지 않으면 오히려 위험하다.\n\n「② 「단일 단계(Single Stage)」 전개」\n   충돌 강도·벨트 착용 여부·승객 체격을\n   가리지 않고 「언제나 최대 압력」으로\n   터진다.\n\n「③ 전개 속도가 매우 빠르다」\n   약 「200~300km/h」로 부풀어 오른다.\n\n「④ 문제점」\n   · 「어린이·저신장 여성·노약자」가\n     에어백 전개 자체로 「목뼈 골절·안면\n     골절·실명」 등의 상해를 입는 사례가\n     보고되었다.\n   · 「Out-of-Position(핸들에 바짝 붙어\n     앉은 자세)」에서 특히 위험하다.\n   · 조수석에 「후향식 어린이 카시트」를\n     놓으면 치명적이다.\n\n  → 이 문제를 풀어 나가는 과정이\n    아래 2·3·4세대의 발전사이다.</span>\n\n<h4>2. 디파워드 에어백 — 2세대</h4>\n<span class=\"tb\">Depowered Air Bag  「저출력형 에어백」\n\n「① 「전개 압력(폭발력)을 낮춘」 에어백」\n   기존 대비 「20~30%」 낮춘다.\n   (미국 NHTSA가 1997년 허용)\n\n「② 목적」\n   「에어백 전개 그 자체로 인한 상해」를\n   줄이는 데 있다.\n   특히 어린이·소형 체구 승객·노약자\n\n「③ 한계」\n   · 여전히 「단일 단계」이다.\n   · 「승객을 감지하지 못한다」.\n     타고 있든 없든, 벨트를 맸든 안 맸든\n     같은 힘으로 터진다.\n   · 압력을 낮춘 만큼 「고속·고에너지\n     충돌에서의 보호성능이 다소 떨어진다」.\n     → 벨트 착용이 더욱 중요해졌다.\n\n  → 「일률적으로 힘만 줄인」 과도기적\n    해법이다.</span>\n\n<h4>3. 스마트 에어백 — 3세대</h4>\n<span class=\"tb\">Smart Air Bag  「지능형 에어백」\n\n「① 「상황에 따라 전개량을 조절」한다」\n   판단 요소\n    · 「충돌의 강도」 (감속도 파형)\n    · 「안전벨트 착용 여부」\n    · 「조수석 승객의 유무」\n    · 「시트의 전후 위치」\n\n「② 「다단(Dual-stage) 인플레이터」」\n   화약을 두 덩이로 나누어,\n    · 저속충돌·벨트 착용 → 「1단만」 점화\n    · 고속충돌·벨트 미착용 → 「1단 + 2단」\n      점화 (시차를 두거나 동시에)\n   → 필요한 만큼만 터뜨린다.\n\n「③ 「승객 유무 감지(PPD)」」\n   조수석에 아무도 없으면 「전개하지 않는다」.\n   → 불필요한 수리비(에어백 모듈 1세트는\n     매우 비싸다)를 줄이는 효과도 있다.\n\n「④ 「PASSENGER AIR BAG OFF」 표시등」\n   조수석 에어백이 비활성화되었음을\n   승객에게 알린다.\n\n「⑤ 한계」\n   승객의 「체중·체격」까지 정밀하게\n   재지는 못하는 경우가 많다.」</span>\n\n<h4>4. 어드밴스드 에어백 — 4세대</h4>\n<span class=\"tb\">Advanced Air Bag  「진화형 에어백」\n\n「① 미국 FMVSS 208의 요구를 충족하는\n   가장 진화된 에어백이다.」\n   (우리나라도 안전기준에 반영)\n\n「② 「사람을 잰다」  ← 결정적 차이」\n   「승객분류시스템(OCS, Occupant\n    Classification System)」으로\n   · 시트 하부의 「하중센서(Weight Sensor)」\n     또는 시트 매트의 「압력분포센서(PODS)」\n   · 승객을 「성인 남성 / 성인 여성 /\n     소아 / 어린이 카시트 / 빈 좌석」으로\n     「분류」한다.\n\n「③ 종합 판정」\n   충돌 강도 + 「체중·체격」 + 「착좌 자세」\n   + 시트 위치 + 벨트 착용 + 「OOP 여부」\n   를 모두 반영하여\n   「전개 여부와 전개량」을 정한다.\n\n「④ 「정밀한 전개량 제어」」\n   · 「2~3단 인플레이터」\n   · 「액티브 벤트(Active Vent)」 —\n     쿠션의 배출구를 열고 닫아 내압을 조절\n   · 「테더(Tether) 제어」 — 쿠션의 돌출\n     깊이를 조절\n\n「⑤ 「어린이 보호」」\n   · 조수석에 「어린이용 카시트(CRS)」가\n     감지되면 「자동으로 전개를 금지」한다.\n   · 소아로 분류되면 「저출력」으로만 전개\n\n「⑥ 「Out-of-Position 대응」」\n   승객이 에어백에 너무 가까이 있으면\n   전개를 억제하거나 늦춘다.」</span>\n\n<h4>Ⅲ. 정리 — 표로 보는 진화</h4>\n<span class=\"tb\">              전개    승객    전개량   대상\n              단수    감지    조절     판정\n──────────────────────────────────────────────\n SRS(1세대)   1단      ×      ×        ×\n              최대압력으로 항상 전개\n\n 디파워드     1단      ×      ×        ×\n (2세대)      「압력을 20~30% 낮춤」\n\n 스마트       「2단」  「○」   「○」     △\n (3세대)      충돌강도·벨트·승객 유무·\n              시트 위치로 조절\n\n 어드밴스드   「2~3단」「○」   「○」   「○」\n (4세대)      「체중·체격·착좌자세」까지\n              분류하여 정밀 제어\n              카시트 감지 시 전개 금지\n\n［손해사정상의 요점］\n · 「전개된 에어백은 재사용할 수 없다」.\n   모듈·인플레이터·클록스프링·프리텐셔너를\n   모두 교환하여야 하므로 수리비가 크다.\n · 「전개되지 않았다」는 이유만으로 결함이라\n   할 수 없다. 「전개 임계값(전개조건)」에\n   미치지 못한 충돌이었을 수 있다.\n   → 「EDR 기록」과 충돌 형태를 확인한다.\n · 「승객 미감지로 조수석 에어백이 전개되지\n   않은 것」은 정상 작동이다.\n · 폐차·해체 시 「미전개 에어백」은\n   폭발물이므로 규정에 따라 처리한다.</span>\n", "keys": ["구성 — 센서부(충돌·안전·승객감지) / 제어부 ACU(판정·예비전원·자기진단·EDR) / 전개부(인플레이터·쿠션·커버·프리텐셔너·클록스프링)", "안전센서(Safing)의 2중 확인으로 오전개 방지", "SRS 1세대 — 보조 구속장치, 단일 단계 최대압력", "디파워드 2세대 — 전개압력 20~30% 저감, 승객 감지 없음", "스마트 3세대 — 다단 인플레이터, 승객 유무·벨트·충돌강도로 조절", "어드밴스드 4세대 — OCS로 체중·체격·자세 분류, 카시트 감지 시 전개 금지", "전개 후 모듈·클록스프링·프리텐셔너 전부 교환", "EDR 기록이 손해사정의 핵심 자료"], "law": ["자동차 및 자동차부품의 성능과 기준에 관한 규칙(좌석안전띠·에어백)", "미국 FMVSS 208(Advanced Air Bag)"]}}, {"no": 6, "body": "전기자동차의 난방시스템을 구성하고 있는 PTC히터(Positive Temperature\nCoefficient thermistor)와 히트 펌프 시스템(Heat Pump System)에 대하여\n서술하시오.(20점)", "sub": [20], "points": 20, "a": {"plan": "「엔진 폐열이 없어 난방을 전기로 만들어야 한다」는 문제의식에서 출발한다. PTC는 「효율 1, 즉시 발열」, 히트펌프는 「효율 2~3, 저온에 약함」으로 대비시키고, 마지막에 둘을 함께 쓰는 이유로 닫는다.", "ans": "\n<h4>0. 전기자동차 난방의 근본 문제</h4>\n<span class=\"tb\">내연기관차\n  엔진에 넣은 연료 에너지의 「약 60~70%」가\n  열로 버려진다. 난방은 그 「버릴 열」을\n  주워다 쓰는 것이므로 「공짜」였다.\n\n전기자동차\n  모터·인버터의 효율이 「90% 이상」이어서\n  「버릴 열이 거의 없다」.\n  → 난방에 쓸 열을 「전기로 새로 만들어야」\n    한다.\n  → 그 전기는 「달리는 데 쓸 전기」에서\n    나온다.\n\n  겨울철 주행거리 감소\n   난방을 켜면 「30~40%」까지 줄어든다.\n   (히터 3~6kW는 시속 60km 정속주행에\n    필요한 전력과 맞먹는다)\n\n  → 「어떻게 하면 적은 전기로 따뜻하게\n    할 것인가」가 전기차 열관리의 핵심 과제이며,\n    그 두 해답이 「PTC 히터」와\n    「히트 펌프」이다.</span>\n\n<h4>Ⅰ. PTC 히터</h4>\n\n<h4>1. 원리</h4>\n<span class=\"tb\">PTC  Positive Temperature Coefficient\n     「정(正)의 온도계수 서미스터」\n\n 「온도가 올라가면 저항이 「커지는」\n  반도체 세라믹(티탄산바륨 BaTiO3계)」\n 소자를 발열체로 쓴다.\n\n (일반 금속과 달리 특정 온도\n  「퀴리점(Curie Point)」을 넘으면\n  저항이 「급격히」 치솟는다)\n\n［자기제어(Self-regulating) 작용］\n  전류가 흐른다\n    → 저항열로 온도가 오른다\n    → 「저항이 커진다」\n    → 「전류가 줄어든다」\n    → 발열이 억제된다\n    → 온도가 일정하게 유지된다\n\n  → 「스스로 온도를 조절」하므로\n    「과열될 수 없다」.\n    별도의 온도퓨즈나 과열방지 회로가\n    없어도 안전하다.\n    이것이 PTC를 차량 난방에 쓰는\n    가장 큰 이유이다.</span>\n\n<h4>2. 종류</h4>\n<span class=\"tb\">「① 공기가열식 PTC (Air PTC)」\n   · 공조장치(HVAC) 안, 「에바포레이터\n     뒤쪽」에 방열핀과 함께 설치\n   · 지나가는 공기를 「직접」 데운다.\n   · 응답이 가장 빠르다.\n\n「② 냉각수가열식 PTC (Coolant PTC,\n   고전압 히터)」\n   · 냉각수를 데워 「히터코어」로 순환시킨다.\n   · 실내 난방뿐 아니라\n     「배터리 승온(저온 시 충·방전 성능\n      확보)」에도 쓸 수 있다.\n   · 열용량이 커서 온도가 안정적이다.\n\n · 전압에 따라 「고전압 PTC(고전압 배터리\n   직접 구동)」와 「저전압 PTC(12V)」로\n   나뉘며, 전기차는 대부분 고전압식이다.</span>\n\n<h4>3. 장점과 단점</h4>\n<span class=\"tb\">［장점］\n · 「즉시 발열」 — 켜자마자 따뜻한 바람이\n   나온다. 시동 직후·극저온에서 유리하다.\n · 「구조가 간단」하고 부품 수가 적다.\n · 「값이 싸다」.\n · 「과열되지 않아 안전」하다.\n · 「외기온에 관계없이」 일정한 성능을 낸다.\n · 정비가 쉽다.\n\n［단점］\n · 「효율이 낮다」  ← 결정적\n   전기에너지를 열로 「1 : 1」로 바꿀 뿐이다.\n   즉 「성능계수(COP) ≒ 1」\n   전기 1kW를 넣으면 열 1kW가 나온다.\n   그 이상은 물리적으로 불가능하다.\n · 「소비전력이 크다」 (통상 3~7kW)\n · 따라서 「주행거리가 크게 준다」.</span>\n\n<h4>Ⅱ. 히트 펌프 시스템</h4>\n\n<h4>1. 원리 — 「만드는 것이 아니라 옮기는 것」</h4>\n<span class=\"tb\">「히트 펌프」는 열을 「만들어 내지」 않는다.\n「바깥에 있는 열을 퍼서 안으로 옮긴다」.\n\n 에어컨(냉방)의 냉동사이클\n   「압축 → 응축(방열) → 팽창 → 증발(흡열)」\n   · 실내 열교환기 = 「증발기」 (흡열, 시원)\n   · 실외 열교환기 = 「응축기」 (방열, 더움)\n\n 히트 펌프(난방)는 이 사이클을 「뒤집는다」\n   · 실내 열교환기 = 「응축기」 (방열, 따뜻)\n   · 실외 열교환기 = 「증발기」 (흡열)\n\n  → 「사방밸브(4-way valve)」 또는\n    「냉매 유로 전환밸브」로 냉매의 흐름을\n    바꾸어 두 열교환기의 역할을 맞바꾼다.\n\n［왜 효율이 1을 넘는가］\n  압축기를 돌리는 데 전기 1kW를 쓰지만,\n  「바깥에서 공짜로 1~2kW의 열을 퍼 온다」.\n  → 실내에 나오는 열은 2~3kW\n  → 「COP = 2~3」\n  (열역학 제2법칙에 어긋나지 않는다.\n   에너지를 만든 것이 아니라 「낮은 온도에서\n   높은 온도로 옮긴」 것이기 때문이다)</span>\n\n<h4>2. 구성</h4>\n<span class=\"tb\">「① 전동식 압축기 (Electric Compressor)」\n   고전압으로 구동. 엔진 벨트가 없으므로\n   차가 서 있어도 돌릴 수 있다.\n\n「② 실내 응축기 (Internal Condenser)」\n   난방 시 냉매의 열을 실내 공기로 내보낸다.\n\n「③ 실외 열교환기 (Outdoor Heat Exchanger)」\n   난방 시 「증발기」가 되어 바깥 공기의\n   열을 흡수한다.\n\n「④ 팽창밸브 (EXV, 전자식 팽창밸브)」\n   냉·난방 유로마다 하나씩, 2~3개\n\n「⑤ 유로 전환밸브 (3-way / 4-way Valve,\n   솔레노이드 밸브)」\n   냉방·난방·제습·제상 모드를 전환한다.\n\n「⑥ 어큐뮬레이터 (Accumulator)」\n   액상 냉매가 압축기로 들어가는 것을 막는다.\n\n「⑦ 칠러 (Chiller)  ← 전기차의 특징」\n   「모터·인버터·OBC·배터리」의 냉각수와\n   냉매를 열교환시킨다.\n   → 전장부품이 내는 「폐열을 회수」하여\n     난방에 보탠다. 전기차에서 유일하게\n     남은 폐열을 알뜰히 쓰는 장치이다.\n\n「⑧ 냉각수 밸브·전동 워터펌프」\n   여러 냉각수 회로(배터리·전장·실내)를\n   상황에 맞게 연결하거나 끊는다.\n\n「⑨ 실외온도·냉매압력·온도 센서」」</span>\n\n<h4>3. 장점과 단점</h4>\n<span class=\"tb\">［장점］\n · 「COP 2~3」 — PTC의 「2~3배 효율」\n · 같은 난방을 하면서 전력 소비가 「1/2~1/3」\n · 「겨울철 주행거리 감소를 크게 줄인다」\n   (히트펌프 장착 차량은 미장착 대비\n    동절기 주행거리가 10~20% 더 길다)\n · 「전장 폐열을 회수」하여 쓴다.\n · 여름에는 「그대로 에어컨」이 된다.\n   (부품을 공유하므로 낭비가 없다)\n\n［단점·한계］\n · 「외기온이 낮을수록 성능이 떨어진다」\n   바깥에 퍼 올 열 자체가 적어지기 때문이다.\n   통상 「−10℃ 이하」에서 효율이 급락한다.\n · 「착상(着霜) 문제」\n   실외 열교환기가 0℃ 아래로 내려가면\n   공기 중의 수분이 서리로 얼어붙어\n   열교환을 막는다.\n   → 주기적으로 「제상(Defrost) 운전」을\n     하여야 하고, 그동안 「난방이 끊긴다」.\n · 「초기 난방이 느리다」\n   사이클이 안정되기까지 시간이 걸린다.\n · 「구조가 복잡」하다.\n   밸브·열교환기·센서가 많아 「원가가 높고」\n   「고장 진단과 정비가 어렵다」.\n · 냉매 누설 시 냉방·난방이 「동시에」\n   불가능해진다.</span>\n\n<h4>Ⅲ. 두 방식의 비교와 병용</h4>\n<span class=\"tb\">              PTC 히터        히트 펌프\n──────────────────────────────────────────────\n 원리        「전기 → 열」    「열을 옮김」\n                              (냉동사이클 역전)\n 효율(COP)   「≒ 1」          「2~3」\n 초기 난방   「즉시」          느리다\n 저온 성능   「일정」          「급락」(−10℃ 이하)\n 소비전력    「크다」(3~7kW)   「작다」\n 구조        간단              「복잡」\n 원가        「싸다」          비싸다\n 정비성      쉽다              「어렵다」\n 폐열 이용    ×               「○ (칠러)」\n\n［실제 차량은 「둘을 함께」 쓴다］\n  ① 「시동 직후·극저온(−10℃ 이하)」\n     → 「PTC 히터」로 빠르게 승온\n       (히트펌프가 힘을 못 쓰는 구간)\n  ② 「정상 주행·외기온이 어느 정도 있을 때」\n     → 「히트 펌프」로 효율적으로 난방\n  ③ 「제상 운전 중」\n     → PTC가 잠시 난방을 이어받는다.\n  ④ 「난방 부하가 클 때」\n     → 히트펌프 + PTC 보조\n\n  → 「효율은 히트펌프에, 즉응성과\n    저온 신뢰성은 PTC에」 맡기는\n    역할 분담이다.</span>\n\n<h4>Ⅳ. 정비·손해사정상의 유의점</h4>\n<span class=\"tb\">· 두 장치 모두 「고전압(약 300~800V)」\n  부품이다. 작업 전 반드시\n  「안전 플러그(서비스 인터록) 분리 →\n   5~10분 대기 → 절연장갑 착용 →\n   전압 강하 확인」의 순서를 지킨다.\n· 「오렌지색 고전압 케이블」은 임의로\n  절단·손상시키지 않는다.\n· 히트펌프 차량의 냉매는 「R-1234yf」인\n  경우가 많고 충전량이 정밀하게 관리된다.\n  회수·충전 장비가 다르므로 주의한다.\n· 침수차의 경우 히트펌프 모듈과 PTC는\n  고전압 절연저항을 반드시 측정한다.\n· 히트펌프 모듈은 「어셈블리 단위 교환」이\n  많아 수리비가 크다. 손해액 산정 시\n  구성부품 단위 교환이 가능한지를\n  먼저 확인한다.</span>\n", "keys": ["전기차는 엔진 폐열이 없어 난방 전력이 주행거리를 30~40% 깎음", "PTC는 온도가 오르면 저항이 커져 자기제어, 과열 없음", "공기가열식 PTC와 냉각수가열식 PTC(배터리 승온 겸용)", "PTC는 COP ≒ 1, 즉시 발열, 소비전력 3~7kW", "히트펌프는 냉동사이클을 역전시켜 외기·전장 폐열을 옮김, COP 2~3", "구성 — 전동압축기·실내응축기·실외열교환기·EXV·유로전환밸브·어큐뮬레이터·칠러", "저온에서 성능 급락과 착상·제상 문제", "극저온·초기에는 PTC, 정상 주행에서는 히트펌프로 병용"], "law": ["전기자동차 공조·열관리 시스템 일반이론", "고전압 안전작업 절차(제작사 정비지침)"]}}, {"no": 7, "body": "전기자동차의 고전압 시스템 관리 및 제어를 수행하는 MCU(Motor Control\nUnit)와 OBC(On-Board Charger)의 역할 및 기능에 대하여 서술하시오.(15점)", "sub": [15], "points": 15, "a": {"plan": "「MCU는 달리게 하는 인버터, OBC는 채우는 충전기」로 한 줄에 가른 뒤, 각각의 역할을 변환·제어·보호의 세 줄기로 편다. 마지막에 완속과 급속의 경로 차이로 OBC의 자리를 못박는다.", "ans": "\n<h4>0. 전기자동차 고전압 시스템의 얼개</h4>\n<span class=\"tb\">  외부 충전기(AC)  →  「OBC」  ┐\n  외부 충전기(DC 급속) ─────────┤\n                                ├→ 「고전압 배터리」\n                                │   (BMS·PRA)\n                                ├→ 「MCU(인버터)」\n                                │      → 구동모터\n                                ├→ 「LDC」 → 12V 보조배터리\n                                └→ 전동압축기·PTC 히터\n\n · 「MCU」는 배터리의 전기를 「써서 달리게」\n   하는 장치\n · 「OBC」는 바깥의 전기를 「받아서 채우는」\n   장치\n\n  → 하나는 「출력 쪽」, 하나는 「입력 쪽」의\n    전력변환장치이다.</span>\n\n<h4>Ⅰ. MCU (Motor Control Unit)</h4>\n\n<h4>1. 뜻</h4>\n<span class=\"tb\">MCU  Motor Control Unit\n     = 「인버터(Inverter)」\n\n 고전압 배터리의 「직류(DC)」를\n 구동모터가 쓸 수 있는 「3상 교류(AC)」로\n 바꾸고, 그 「주파수와 전압(진폭)」을 제어하여\n 모터의 「회전수와 토크」를 다스리는 장치이다.\n\n 구성\n  · 「전력모듈」 — IGBT 또는 「SiC MOSFET」\n    (SiC는 손실이 적어 전비가 좋아진다)\n  · 「DC 링크 커패시터」 — 전압 안정화\n  · 「게이트 드라이버」\n  · 「제어보드(마이컴)」\n  · 「전류센서·온도센서」\n  · 「수랭식 냉각채널」</span>\n\n<h4>2. 역할과 기능</h4>\n<span class=\"tb\">「① 직류 → 교류 변환 (구동, Inverting)」\n   · 배터리의 DC를 「PWM(펄스폭변조)」으로\n     잘라 유사 정현파의 3상 AC를 만든다.\n   · 「주파수」를 바꾸면 「회전수」가,\n     「전압(듀티)」을 바꾸면 「토크」가\n     달라진다.\n\n「② 모터 토크·속도 제어」\n   · 「VCU(차량제어유닛)」가 가속페달 신호를\n     보고 「요구 토크」를 MCU에 지령한다.\n   · MCU는 「벡터제어(FOC, Field Oriented\n     Control)」로 자속과 토크 성분을\n     분리 제어하여 지령대로 토크를 낸다.\n   · 고속에서는 「약계자 제어(Field\n     Weakening)」로 회전수를 더 올린다.\n\n「③ 교류 → 직류 변환 (회생, Converting)」\n   · 감속 시 모터가 「발전기」가 되어\n     3상 교류를 만든다.\n   · MCU가 이를 「정류」하여 배터리를\n     충전한다.  → 「회생제동」\n   · 브레이크 협조제어로 회생량과\n     유압제동량을 배분한다.\n\n「④ 모터 위치·속도 검출」\n   · 「레졸버(Resolver)」의 신호를 처리하여\n     회전자의 「절대 위치」를 안다.\n   · 위치를 알아야 3상 전류를 정확한\n     시점에 흘릴 수 있다.\n     (레졸버 옵셋 보정이 어긋나면 출력\n      저하·과열·진동이 생긴다)\n\n「⑤ 보호 및 페일세이프」\n   · 「과전류·과전압·저전압·과온」 보호\n   · 이상 시 「3상 단락 제어(ASC)」 또는\n     「게이트 차단」으로 안전 상태로 간다.\n   · 고장코드를 기록하고 「림프홈 모드」로\n     출력을 제한한다.\n\n「⑥ 능동방전 (Active Discharge)」\n   · 시동 오프·충돌 시 DC 링크 커패시터에\n     남은 「고전압을 수 초 안에 방전」시킨다.\n   · 정비 안전의 핵심 기능이다.\n\n「⑦ 냉각 관리」\n   · 수랭 냉각수의 온도를 감시하고\n     과열 시 출력을 낮춘다.」</span>\n\n<h4>Ⅱ. OBC (On-Board Charger)</h4>\n\n<h4>1. 뜻</h4>\n<span class=\"tb\">OBC  On-Board Charger\n     「차량 탑재형 (완속)충전기」\n\n 외부의 「교류(AC) 전원」을 받아\n 「직류(DC)」로 바꾸고, 배터리가 요구하는\n 전압·전류로 조절하여 「고전압 배터리를\n 충전」하는 장치이다.\n\n · 용량은 통상 「7.2kW / 11kW」\n   (단상 220V 또는 삼상 380V)\n · 「완속충전의 속도는 OBC의 용량이\n   결정한다」. 벽면 충전기가 아무리 커도\n   OBC가 7kW면 7kW로 들어간다.</span>\n\n<h4>2. 역할과 기능</h4>\n<span class=\"tb\">「① 교류 → 직류 변환 (정류 + DC-DC)」\n   · 「정류부」 AC를 DC로 정류\n   · 「PFC부」 역률 개선\n   · 「DC-DC 컨버터부」 배터리 전압에 맞춤\n\n「② 역률 개선 (PFC, Power Factor\n   Correction)」\n   · 전류 파형을 전압 파형에 맞추어\n     「역률을 1에 가깝게」 한다.\n   · 「고조파(Harmonics)」를 억제하여\n     전력계통에 주는 부담을 줄인다.\n   · 법규(IEC 61000)상 요구사항이다.\n\n「③ 절연 (Galvanic Isolation)」\n   · 「고주파 변압기」로 계통 전원과\n     차량 고전압 회로를 「전기적으로 분리」\n     한다.\n   · 감전과 지락사고를 막는 안전 기능이다.\n\n「④ 충전 제어 — BMS와의 협조」\n   · 「BMS」가 알려 주는 배터리의\n     「전압·전류·온도·SOC」에 따라\n     충전전류를 정한다.\n   · 「정전류(CC) → 정전압(CV)」 프로파일\n   · 저온에서는 전류를 줄이거나\n     「배터리 승온」을 먼저 요청한다.\n   · 만충 부근에서 전류를 줄여 「과충전」을\n     막는다.\n\n「⑤ 충전기(EVSE)와의 통신」\n   · 「제어파일럿(CP)」 신호(PWM)로\n     충전기가 공급할 수 있는\n     「최대 전류」를 읽는다.\n   · 「근접검출(PP)」로 케이블의 정격과\n     커넥터 체결을 확인한다.\n   · 이에 맞추어 실제 입력전류를 제한한다.\n\n「⑥ 안전·보호」\n   · 「커넥터 잠금(Locking Actuator)」 제어\n   · 「누전(지락) 감지」, 절연저항 감시\n   · 과전압·과전류·과열 보호\n   · 이상 시 즉시 충전 중단\n\n「⑦ 최근의 확장 기능」\n   · 「ICCU (Integrated Charging Control\n     Unit)」 — OBC와 「LDC」를 하나로\n     통합한 모듈\n   · 「양방향 충전(V2L / V2G / V2H)」\n     — 배터리의 직류를 「교류로 되돌려」\n       외부 기기에 전원을 공급한다.\n       (캠핑용 220V 콘센트, 계통 역송전)\n   · 「3상 충전」, 「800V 시스템 대응」」</span>\n\n<h4>Ⅲ. 완속충전과 급속충전 — OBC의 자리</h4>\n<span class=\"tb\">「완속충전 (AC 충전)」\n  외부 충전기 「AC」\n    → 「인렛(AC 핀)」\n    → 「OBC」 (AC → DC 변환)  ← 여기를 거친다\n    → 「PRA(파워 릴레이 어셈블리)」\n    → 고전압 배터리\n\n  · 속도는 「OBC 용량」이 좌우한다 (7~11kW)\n  · 완충에 4~10시간\n  · 배터리에 부담이 적어 수명에 유리하다.\n\n「급속충전 (DC 충전)」\n  외부 충전기 안에서 「이미 DC로 변환」\n    → 「인렛(DC 핀)」\n    → 「PRA」\n    → 고전압 배터리\n                  「OBC를 거치지 않는다」\n\n  · 50~350kW, 80%까지 18~40분\n  · 충전 제어는 「BMS ↔ 충전기」가\n    「PLC 통신(CCS)」으로 직접 한다.\n  · 발열이 커 배터리 열관리가 함께 돈다.\n\n  → 「OBC가 고장 나면 완속충전만 안 되고\n    급속충전은 된다」. 이 점이 고장 진단의\n    갈림길이다.</span>\n\n<h4>Ⅳ. 정리와 정비상의 유의점</h4>\n<span class=\"tb\">              「MCU」            「OBC」\n──────────────────────────────────────────────\n 위치        배터리 → 모터     외부전원 → 배터리\n 변환        「DC → AC」        「AC → DC」\n             (회생 시 AC → DC)\n 핵심 기능   토크·속도 제어     충전전류 제어\n             회생제동           역률개선·절연\n 협조 대상   VCU, 모터,        BMS, EVSE(충전기)\n             브레이크 제어기\n 고장 증상   출력 저하·주행     「완속충전 불가」\n             불가·경고등        (급속은 가능)\n\n［공통 유의사항］\n · 모두 「고전압 부품」이다.\n   「안전 플러그 분리 → 대기 → 절연장갑\n    → 전압 확인」의 순서를 반드시 지킨다.\n · 「오렌지색 고전압 케이블」과 커넥터는\n   손상 여부를 반드시 점검한다.\n · 「수랭식」이므로 냉각수 부족·누수가\n   출력 제한과 고장의 흔한 원인이다.\n · 침수·충돌 차량은 「절연저항 측정」이\n   필수이다.\n · 두 장치 모두 「어셈블리 교환」이 원칙이어서\n   수리비가 크다. 손해액 산정 시\n   「실제 고장 부위」와 교환 단위를\n   확인하여야 한다.</span>\n", "keys": ["MCU는 인버터 — DC를 3상 AC로 변환, PWM·벡터제어로 토크·속도 제어", "회생제동 시 AC를 DC로 정류하여 충전", "레졸버로 회전자 절대위치 검출, 옵셋 보정 중요", "보호·페일세이프·능동방전(DC링크 커패시터)", "OBC는 완속충전용 AC→DC 변환기, 통상 7.2~11kW", "PFC 역률개선, 고주파 변압기 절연, BMS와 CC/CV 제어", "CP/PP 신호로 EVSE 최대전류 인식", "급속충전은 OBC를 거치지 않음 → OBC 고장 시 완속만 불가"], "law": ["전기자동차 고전압 전력변환장치 일반이론", "전기자동차 충전 통신 규격(IEC 61851, CCS)", "고전압 안전작업 절차(제작사 정비지침)"]}}]}, {"round": 48, "subject": "의학이론", "track": "신체", "q": [{"no": 1, "points": 10}, {"no": 2, "points": 10}, {"no": 3, "points": 10}, {"no": 4, "points": 10}, {"no": 5, "points": 10}, {"no": 6, "points": 10}, {"no": 7, "points": 10}, {"no": 8, "points": 10}, {"no": 9, "points": 10}, {"no": 10, "points": 10}], "locked": true}, {"round": 48, "subject": "책임·근로자재해보상보험의 이론과 실무", "track": "신체", "q": [{"no": 1, "points": 25}, {"no": 2, "points": 20}, {"no": 3, "points": 15}, {"no": 4, "points": 10}, {"no": 5, "points": 10}, {"no": 6, "points": 10}, {"no": 7, "points": 10}], "locked": true}, {"round": 48, "subject": "제3보험의 이론과 실무", "track": "신체", "q": [{"no": 1, "points": 30}, {"no": 2, "points": 15}, {"no": 3, "points": 15}, {"no": 4, "points": 10}, {"no": 5, "points": 10}, {"no": 6, "points": 20}], "locked": true}, {"round": 48, "subject": "자동차보험의 이론과 실무(대인배상 및 자기신체손해)", "track": "신체", "q": [{"no": 1, "points": 30}, {"no": 2, "points": 20}, {"no": 3, "points": 15}, {"no": 4, "points": 15}, {"no": 5, "points": 10}, {"no": 6, "points": 10}], "locked": true}, {"round": 48, "subject": "회계원리", "track": "재물", "q": [{"no": 1, "points": 10}, {"no": 2, "points": 5}, {"no": 3, "points": 5}, {"no": 4, "points": 10}, {"no": 5, "points": 5}, {"no": 6, "points": 10}, {"no": 7, "points": 10}, {"no": 8, "points": 5}, {"no": 9, "points": 5}, {"no": 10, "points": 5}, {"no": 11, "points": 5}, {"no": 12, "points": 10}, {"no": 13, "points": 5}, {"no": 14, "po const FREE_ROUND2 = 49;
const TRACKS = ['신체', '재물', '차량'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 밤낮 ── */
(function () {
  const k = 'sonsa2.theme';
  const set = v => { document.documentElement.dataset.theme = v; try { localStorage.setItem(k, v); } catch (e) {} };
  let v = null;
  try { v = localStorage.getItem(k); } catch (e) {}
  if (v) document.documentElement.dataset.theme = v;
  $('#themeBtn').onclick = () => set(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
})();

/* ── 답안 보관 ── */
const KEY = 'sonsa2.draft';
function drafts() {
  try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; }
}
function saveDraft(id, text) {
  const d = drafts();
  if (text.trim()) d[id] = text; else delete d[id];
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
}

/* ── 현재 고른 것 ── */
const state = { track: '신체', round: 0, subject: '' };

function rounds(track) {
  return [...new Set(EXAM2.filter(r => r.track === track).map(r => r.round))]
    .sort((a, b) => b - a);
}
function subjects(track, round) {
  return EXAM2.filter(r => r.track === track && r.round === round).map(r => r.subject);
}
function paper() {
  return EXAM2.find(r => r.track === state.track && r.round === state.round &&
                         r.subject === state.subject);
}

function chip(text, on, fn, locked) {
  const b = document.createElement('button');
  b.className = 'chip' + (on ? ' on' : '') + (locked ? ' lock' : '');
  b.innerHTML = esc(text) + (locked ? '<span class="lk">🔒</span>' : '');
  b.onclick = fn;
  return b;
}

function drawPicks() {
  const tr = $('#trackRow'), rr = $('#roundRow'), sr = $('#subjRow');
  tr.textContent = rr.textContent = sr.textContent = '';
  TRACKS.forEach(t => tr.appendChild(chip(t, t === state.track, () => {
    state.track = t;
    state.round = rounds(t)[0];
    state.subject = subjects(t, state.round)[0];
    draw();
  })));
  rounds(state.track).forEach(n => rr.appendChild(
    chip('제' + n + '회', n === state.round, () => {
      state.round = n;
      const ss = subjects(state.track, n);
      if (!ss.includes(state.subject)) state.subject = ss[0];
      draw();
    }, n !== FREE_ROUND2 && (paperOf(n, state.subject) || {}).locked)));
  subjects(state.track, state.round).forEach(s => sr.appendChild(
    chip(short(s), s === state.subject, () => { state.subject = s; draw(); })));
}

function paperOf(round, subject) {
  return EXAM2.find(r => r.round === round && r.subject === subject);
}

/* 과목명이 길어 칩에는 줄여 쓴다 */
function short(s) {
  return s.replace('의 이론과 실무', '')
          .replace('자동차보험(대인배상 및 자기신체손해)', '자동차(대인)')
          .replace('자동차보험(대물배상 및 차량손해)', '자동차(대물)')
          .replace('책임·근로자재해보상보험', '책임·근재')
          .replace('책임·화재·기술보험 등', '책임·화재·기술')
          .replace('자동차구조 및 정비이론과 실무', '자동차구조');
}

/* ── 본문에서 표처럼 보이는 줄을 따로 감싼다 ── */
function bodyHTML(t) {
  return esc(t).split('\n').map(ln => {
    const s = ln.trim();
    if (s.includes('|') && s.split('|').length >= 3) return '<span class="tb">' + ln + '</span>';
    return ln;
  }).join('\n');
}

/* ── 타이머 ── */
let tick = null, left = 0;
function fmt(s) {
  const m = Math.floor(Math.abs(s) / 60), x = Math.abs(s) % 60;
  return (s < 0 ? '-' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0');
}
function startTimer(el) {
  if (tick) clearInterval(tick);
  tick = setInterval(() => { left--; el.textContent = fmt(left); }, 1000);
}

function draw() {
  drawPicks();
  const p = paper(), m = $('#main');
  m.textContent = '';
  if (!p) return;

  const head = document.createElement('div');
  head.className = 'paper';
  const sum = (p.q || []).reduce((a, q) => a + (q.points || 0), 0);
  head.innerHTML = '<h2>' + esc(p.subject) + '</h2>' +
    '<span class="meta">제' + p.round + '회 · ' + (p.q || []).length + '문항 · ' + sum + '점</span>';
  if (!p.locked) {
    const tm = document.createElement('div');
    tm.className = 'timer';
    tm.innerHTML = '<span>남은 시간</span><b id="clk">90:00</b>';
    const b1 = document.createElement('button');
    b1.className = 'tbtn'; b1.textContent = '시작';
    const b2 = document.createElement('button');
    b2.className = 'tbtn'; b2.textContent = '멈춤';
    b1.onclick = () => { left = 90 * 60; $('#clk').textContent = fmt(left); startTimer($('#clk')); };
    b2.onclick = () => { if (tick) clearInterval(tick); tick = null; };
    tm.append(b1, b2);
    head.appendChild(tm);
  }
  m.appendChild(head);

  if (p.locked) {
    const d = document.createElement('div');
    d.className = 'locked';
    d.innerHTML = '<b>이용권이 있어야 열립니다</b>제' + FREE_ROUND2 +
      '회는 결제 없이 볼 수 있습니다. 나머지 회차는 ' +
      '<a href="./index.html#pay">이용권 안내</a>를 참고하세요.';
    m.appendChild(d);
    return;
  }

  (p.q || []).forEach(q => m.appendChild(qCard(p, q)));
}

function qCard(p, q) {
  const id = p.round + '|' + p.subject + '|' + q.no;
  const el = document.createElement('article');
  el.className = 'q';

  const h = document.createElement('div');
  h.className = 'qh';
  h.innerHTML = '<span class="qno">' + q.no + '</span>' +
    '<span class="pts">' + (q.points || 0) + '점</span><span class="qsp"></span>';
  el.appendChild(h);

  const b = document.createElement('div');
  b.className = 'body';
  b.innerHTML = bodyHTML(q.body || '');
  el.appendChild(b);

  const ta = document.createElement('textarea');
  ta.placeholder = '여기에 답안을 적어 보세요. 적은 내용은 이 기기에만 남습니다.';
  ta.value = drafts()[id] || '';
  el.appendChild(ta);

  const tools = document.createElement('div');
  tools.className = 'tools';
  const bm = document.createElement('button');
  bm.className = 'btn pri';
  bm.textContent = q.a ? '모범답안 보기' : '모범답안 준비 중';
  bm.disabled = !q.a;
  const bc = document.createElement('button');
  bc.className = 'btn';
  bc.textContent = '지우기';
  const cnt = document.createElement('span');
  cnt.className = 'cnt';
  tools.append(bm, bc, cnt);
  el.appendChild(tools);

  const model = document.createElement('div');
  model.className = q.a ? 'model' : 'none';
  if (q.a) {
    let html = '<div class="mtag">모범답안</div>';
    if (q.a.plan) html += '<div class="plan">' + esc(q.a.plan) + '</div>';
    html += '<div class="ans">' + (q.a.ans || '') + '</div>';
    if (q.a.law && q.a.law.length)
      html += '<div class="laws">근거 · ' + q.a.law.map(esc).join(' / ') + '</div>';
    if (q.a.keys && q.a.keys.length)
      html += '<div class="keys">' + q.a.keys.map(
        k => '<span class="key" data-k="' + esc(k) + '">' + esc(k) + '</span>').join('') + '</div>';
    model.innerHTML = html;
  } else {
    model.textContent = '이 문항의 모범답안은 아직 쓰는 중입니다. 배점과 물음의 구성을 보고 뼈대부터 잡아 두세요.';
  }
  el.appendChild(model);

  function refresh() {
    const t = ta.value;
    const n = t.replace(/\s/g, '').length;
    cnt.textContent = n + '자 · 원고지 약 ' + Math.ceil(n / 200) + '장';
    if (q.a && q.a.keys) model.querySelectorAll('.key').forEach(
      k => k.classList.toggle('hit', t.includes(k.dataset.k)));
  }
  ta.oninput = () => { saveDraft(id, ta.value); refresh(); };
  bm.onclick = () => {
    model.classList.toggle('open');
    bm.textContent = model.classList.contains('open') ? '모범답안 닫기' : '모범답안 보기';
    refresh();
  };
  bc.onclick = () => { ta.value = ''; saveDraft(id, ''); refresh(); };
  refresh();
  return el;
}

/* ── 이용권이 있으면 전체 회차를 받아 온다 ──
   배포본에는 무료 회차만 박혀 있어 소스를 열어도 나머지가 나오지 않는다.
   로그인·결제는 1차 화면(index.html)에서 하고 토큰을 함께 쓴다. */
const API = '/api';
let EXAM2ALL = EXAM2;
function auth() {
  try { return JSON.parse(localStorage.getItem('sonsa:auth') || 'null'); } catch (e) { return null; }
}
async function loadFull() {
  const a = auth();
  if (!a || !a.token || location.protocol === 'file:') return;
  try {
    const r = await fetch(API + '/content', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: a.token, doc: 'exam2' }),
    }).then(x => x.json());
    if (r.ok && Array.isArray(r.data) && r.data.length) {
      EXAM2ALL = r.data;
      EXAM2.length = 0;
      r.data.forEach(x => EXAM2.push(x));
      draw();
    }
  } catch (e) { /* 네트워크 실패 — 내장된 무료 회차로 이어 간다 */ }
}

/* ── 시작 ── */
(function () {
  const u = new URLSearchParams(location.search);
  state.track = TRACKS.includes(u.get('t')) ? u.get('t') : '신체';
  const rs = rounds(state.track);
  state.round = rs.includes(+u.get('r')) ? +u.get('r') : rs[0];
  const ss = subjects(state.track, state.round);
  state.subject = ss.includes(u.get('s')) ? u.get('s') : ss[0];
  draw();
  loadFull();
})();
</script>
