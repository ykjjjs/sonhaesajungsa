<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>손해사정사 2차 기출</title>
<meta name="theme-color" content="#0A0A0C">
<meta name="description" content="손해사정사 2차 기출 — 신체 · 재물 · 차량 3종별 9과목, 답안 작성과 모범답안">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#0A0A0C; --surf:#141417; --surf2:#101013;
  --edge:#232328; --lift:#2E2E35;
  --tx:#F5F5F7; --tx2:#D6DBE3; --tx3:#9AA3B0; --tx4:#646C7A; --tx5:#3A404B;
  --sap:#1552D6; --sap2:#3E9BFF; --sap3:#8FD0FF;
  --grad:linear-gradient(135deg,#06153F 0%,#0A2A6E 26%,#1552D6 62%,#3E9BFF 100%);
  --glass:linear-gradient(160deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 42%,rgba(255,255,255,0) 100%);
  --ok:#4CC38A; --warn:#C9903A; --bad:#E0574F; --violet:#9B8CFF; --teal:#4BC0C8;
  --r:14px; --rp:999px;
  --f:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'SF Pro Display','Apple SD Gothic Neo',system-ui,sans-serif;
  --m:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.28,.11,.32,1);
}
:root[data-theme="light"]{
  --bg:#F2F3F6; --surf:#FFFFFF; --surf2:#FAFAFB;
  --edge:#E1E4EA; --lift:#C7CCD6;
  --tx:#0A0A0C; --tx2:#2C313A; --tx3:#5B636F; --tx4:#858C99; --tx5:#AEB4BF;
  --glass:linear-gradient(160deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.35) 42%,rgba(255,255,255,0) 100%);
  --ok:#1D7D46; --warn:#9A6A18; --bad:#C8332C; --violet:#5B4BD6; --teal:#0E7D86;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx2);font-family:var(--f);font-size:16.5px;
  line-height:1.72;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sap2);outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}

/* ── 머리 ── */
header{border-bottom:1px solid var(--edge);background:var(--surf2)}
.htop{display:flex;align-items:flex-end;gap:14px;padding:26px 0 18px;flex-wrap:wrap}
.kick{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--sap2);
  text-transform:uppercase;margin-bottom:4px}
h1{font-size:clamp(21px,3.4vw,28px);font-weight:800;letter-spacing:-.03em;color:var(--tx);line-height:1.25}
.hsp{flex:1}
.tlink{color:var(--tx3);font-size:13.5px;font-weight:700;text-decoration:none;
  padding:8px 12px;border:1px solid var(--edge);border-radius:10px;background:var(--surf);
  white-space:nowrap;transition:border-color .18s var(--ease),color .18s var(--ease)}
.tlink:hover{border-color:var(--lift);color:var(--tx)}
.themeBtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--edge);
  background:var(--surf);display:grid;place-items:center;cursor:pointer}
.themeBtn svg{width:17px;height:17px;fill:none;stroke:var(--tx3);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
:root:not([data-theme="light"]) .themeBtn .sun{display:none}
:root[data-theme="light"] .themeBtn .moon{display:none}

/* ── 고르는 줄 ── */
.picks{display:flex;flex-direction:column;gap:9px;padding:0 0 20px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.row>.lab{font-size:11.5px;font-weight:800;color:var(--tx4);letter-spacing:.08em;
  min-width:38px}
.chip{border:1px solid var(--edge);background:var(--surf);color:var(--tx3);
  font-size:13px;font-weight:700;padding:6px 12px;border-radius:var(--rp);cursor:pointer;
  transition:all .16s var(--ease);white-space:nowrap}
.chip:hover{border-color:var(--lift);color:var(--tx2)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;
  box-shadow:0 2px 12px -4px rgba(21,82,214,.7)}
.chip.lock{opacity:.5}
.chip .lk{font-size:10px;margin-left:4px}

/* ── 과목지 ── */
.paper{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.paper h2{font-size:19px;font-weight:800;color:var(--tx);letter-spacing:-.02em}
.paper .meta{font-size:12.5px;color:var(--tx4);font-weight:600}
.timer{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--m);
  font-size:13px;color:var(--tx3)}
.timer b{color:var(--tx);font-size:15px;font-variant-numeric:tabular-nums}
.tbtn{border:1px solid var(--edge);background:var(--surf);color:var(--tx3);border-radius:8px;
  padding:4px 9px;font-size:12px;font-weight:700;cursor:pointer}
.tbtn:hover{color:var(--tx)}

/* ── 문항 ── */
.q{background:var(--surf);border:1px solid var(--edge);border-radius:var(--r);
  padding:18px 18px 14px;margin:12px 0;position:relative;overflow:hidden}
.q::before{content:'';position:absolute;inset:0 0 auto;height:1px;background:var(--glass)}
.qh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.qno{width:26px;height:26px;border-radius:8px;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.pts{font-size:11.5px;font-weight:800;color:var(--sap3);border:1px solid rgba(62,155,255,.32);
  border-radius:var(--rp);padding:2px 9px;background:rgba(62,155,255,.08)}
.qsp{flex:1}
.body{white-space:pre-wrap;color:var(--tx2);font-size:16px;line-height:1.78;
  word-break:keep-all;overflow-wrap:anywhere}
.body .tb{display:block;font-family:var(--m);font-size:13.5px;background:var(--surf2);
  border:1px solid var(--edge);border-radius:10px;padding:10px 12px;margin:8px 0;
  white-space:pre;overflow-x:auto;color:var(--tx3)}

/* ── 답안 ── */
.tools{display:flex;gap:7px;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--edge);background:var(--surf2);color:var(--tx3);
  border-radius:10px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;
  transition:all .16s var(--ease)}
.btn:hover{border-color:var(--lift);color:var(--tx)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.cnt{font-size:12px;color:var(--tx4);font-family:var(--m);margin-left:auto}
textarea{width:100%;min-height:150px;margin-top:10px;background:var(--surf2);
  border:1px solid var(--edge);border-radius:12px;padding:12px 14px;color:var(--tx2);
  font-size:15px;line-height:1.75;resize:vertical;outline:none;
  transition:border-color .18s var(--ease)}
textarea:focus{border-color:var(--sap2);box-shadow:0 0 0 3px rgba(62,155,255,.13)}
textarea::placeholder{color:var(--tx5)}

/* ── 모범답안 ── */
.model{margin-top:12px;border-top:1px dashed var(--edge);padding-top:12px;display:none}
.model.open{display:block}
.mtag{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--tx4);
  text-transform:uppercase;margin-bottom:8px}
.model .plan{background:rgba(155,140,255,.08);border-left:2px solid var(--violet);
  border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:12px;font-size:14.5px;color:var(--tx2)}
.model .ans{font-size:15.5px;color:var(--tx2)}
.model .ans p{margin:0 0 9px}
.model .ans ul,.model .ans ol{margin:0 0 9px 20px}
.model .ans li{margin:2px 0}
.model .ans b{color:var(--tx)}
.model .ans h4{font-size:15px;color:var(--tx);margin:12px 0 5px;font-weight:800}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.key{font-size:12px;font-weight:700;color:var(--teal);border:1px solid rgba(75,192,200,.3);
  background:rgba(75,192,200,.08);border-radius:var(--rp);padding:3px 10px}
.key.hit{background:var(--ok);border-color:transparent;color:#04150C}
.laws{margin-top:8px;font-size:12.5px;color:var(--tx4);font-family:var(--m)}
.none{margin-top:12px;border-top:1px dashed var(--edge);padding-top:11px;
  font-size:13.5px;color:var(--tx4)}

/* ── 잠김 ── */
.locked{background:var(--surf2);border:1px dashed var(--lift);border-radius:var(--r);
  padding:28px 20px;text-align:center;color:var(--tx4);font-size:14.5px;margin:14px 0}
.locked b{display:block;color:var(--tx2);font-size:16px;font-weight:800;margin-bottom:6px}
.locked a{color:var(--sap2);font-weight:700;text-decoration:none}

.foot{padding:34px 0 20px;font-size:12.5px;color:var(--tx5);line-height:1.8;
  border-top:1px solid var(--edge);margin-top:34px}
@media(max-width:640px){
  body{font-size:16px}
  .q{padding:15px 14px 12px}
  .row>.lab{min-width:auto;width:100%}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="htop">
      <div>
        <div class="kick">SONHAE · 2nd ROUND</div>
        <h1>손해사정사 2차 기출</h1>
      </div>
      <div class="hsp"></div>
      <a class="tlink" href="./index.html">1차 기출</a>
      <a class="tlink" href="./book.html">전자교재</a>
      <button class="themeBtn" id="themeBtn" type="button" aria-label="밤낮 모드 전환" title="밤낮 모드 전환">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="picks">
      <div class="row"><span class="lab">종별</span><span id="trackRow"></span></div>
      <div class="row"><span class="lab">회차</span><span id="roundRow"></span></div>
      <div class="row"><span class="lab">과목</span><span id="subjRow"></span></div>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer class="wrap foot">
  손해사정사 제2차 시험문제는 보험개발원이 공개한 원본을 옮긴 것이다.
  모범답안은 이 서비스가 직접 작성한 것으로, 시행처의 공식 정답이 아니다.
  2차는 논술형이어서 공식 정답이 공개되지 않는다.
</footer>

<script>
const EXAM2 = [{"round": 49, "subject": "의학이론", "track": "신체", "src": "49회_2차 의학이론.pdf", "chars": 1556, "digits": 75, "pts_ok": true, "q": [{"no": 1, "body": "3일 전 교통사고로 양측 대퇴골 골절로 입원한 60세 남자 환자가 갑자기\n호흡곤란을 보이며 의식 저하 및 흉부 점상 출혈이 발생하였다. 가장 의심되는\n질환을 기술하고, 이 질환의 초기 치료를 한 가지 기술하시오.(10점)\n(1) 질환명(5점)\n(2) 이 질환의 초기 치료(5점)", "sub": [10, 5, 5], "points": 10, "a": {"plan": "질환명을 먼저 단정하고, 초기 치료는 ‘호흡 보조’를 첫머리에 둔다. 배점이 5점씩 나뉘어 있으므로 (1)과 (2)를 나누어 적는다.", "ans": "\n<h4>(1) 질환명 (5점)</h4>\n<p><b>지방색전증후군(Fat Embolism Syndrome)</b>이다.</p>\n<p>장관골 골절 후 <b>24~72시간</b> 사이에 나타나고, <b>호흡곤란·의식 저하·점상 출혈</b>의 세 징후가 함께 오는 것이 전형이다.\n양측 대퇴골 골절은 골수강에서 지방구가 정맥으로 들어갈 통로가 넓어 발생 위험이 가장 큰 손상이다.\n점상 출혈은 상흉부·액와부·결막에 잘 나타나며 다른 원인으로는 설명하기 어려운 소견이어서 진단의 결정적 단서가 된다.</p>\n\n<h4>(2) 초기 치료 (5점)</h4>\n<p><b>산소 공급을 통한 호흡 보조</b>가 첫 조치이다. 마스크로 고농도 산소를 주고, 저산소증이 교정되지 않으면\n기관내삽관과 기계환기(필요시 호기말양압, PEEP)로 넘어간다.</p>\n<p>그 밖에 수액 공급과 순환 유지, 골절부의 <b>조기 고정</b>으로 지방구의 추가 유입을 막는 처치를 함께 한다.\n지방색전증후군에는 원인을 없애는 약이 없으므로 치료의 축은 <b>보존적 지지요법</b>이라는 점을 밝혀 두면 좋다.</p>\n", "keys": ["지방색전증후군", "점상 출혈", "산소", "기계환기", "조기 고정"]}}, {"no": 2, "body": "높은 곳에서 뛰어 착지하는 과정에서 무릎이 안쪽으로 꺾이며 ‘뚝’ 하는\n소리가 난 후 심한 통증과 무릎의 불안정감을 호소하는 환자가 내원하였다.\n다음 물음에 답하시오.(10점)\n(1) 손상되었을 가능성이 가장 높은 구조물을 기술하시오.(4점)\n(2) 이 손상을 진단하기 위한 대표적인 신체검사 1가지의 명칭과 검사 방법을\n기술하시오.(6점)", "sub": [10, 4, 6], "points": 10, "a": {"plan": "손상 구조물 하나를 단정하고, 검사는 이름과 방법을 모두 적어야 6점이 채워진다.", "ans": "\n<h4>(1) 손상 구조물 (4점)</h4>\n<p><b>전방십자인대(ACL, anterior cruciate ligament)</b>이다.</p>\n<p>점프 착지처럼 발이 바닥에 고정된 상태에서 무릎이 안쪽으로 꺾이는 <b>외반·외회전</b> 힘이 걸리면 전방십자인대가 끊어진다.\n파열 순간의 <b>‘뚝’ 하는 파열음(popping sound)</b>, 곧 이어지는 <b>관절혈종</b>, 그리고 <b>무릎이 빠지는 느낌(giving way)</b>이 전형적인 세 소견이다.</p>\n\n<h4>(2) 대표적 신체검사 (6점)</h4>\n<p><b>라크만 검사(Lachman test)</b>이다.</p>\n<p>환자를 눕히고 무릎을 <b>20~30도</b> 굽힌 상태에서 한 손으로 대퇴 원위부를 고정하고 다른 손으로 경골 근위부를 잡아\n<b>앞쪽으로 당긴다</b>. 반대쪽에 비해 경골의 전방 전위가 크고 <b>단단한 종말점(firm end point)</b>이 느껴지지 않으면 양성이다.</p>\n<p>같은 목적의 검사로 전방전위 검사(anterior drawer test, 굴곡 90도)와 축이동 검사(pivot shift test)가 있으나,\n급성기에도 통증과 근육 방어의 영향을 덜 받아 <b>민감도가 가장 높은 것은 라크만 검사</b>이다.</p>\n", "keys": ["전방십자인대", "라크만", "Lachman", "관절혈종", "종말점"]}}, {"no": 3, "body": "소아 골절 중 가장 흔한 골절 중 하나인 상완골 과상부 골절(supracondylar\nfracture of the humerus)에 대한 설명이다. 다음 물음에 답하시오.(10점)\n(1) X-선 촬영에서 뼈의 전위가 없는 경우 시행할 수 있는 치료를 1가지\n기술하시오.(5점)\n(2) 이 골절에서 혈관 손상으로 인해 발생할 수 있는 대표적인 후기 합병증을\n1가지 기술하시오.(5점)", "sub": [10, 5, 5], "points": 10, "a": {"plan": "치료와 합병증을 각각 ‘한 가지’만 물었다. 고른 것 하나를 정확히 쓰고 이유를 덧붙인다.", "ans": "\n<h4>(1) 전위가 없는 경우의 치료 (5점)</h4>\n<p><b>장상지 석고 고정(long arm cast)</b>이다.</p>\n<p>주관절을 <b>90도 정도로 굽히고</b> 전완을 중립 또는 회내위에 두어 3~4주간 고정한 뒤 방사선 추시로 전위 여부를 확인한다.\n전위가 없는 1형(Gartland type I)은 도수정복이나 수술 없이 고정만으로 치유된다.</p>\n\n<h4>(2) 혈관 손상으로 인한 대표적 후기 합병증 (5점)</h4>\n<p><b>볼크만 허혈성 구축(Volkmann's ischemic contracture)</b>이다.</p>\n<p>상완동맥의 손상이나 압박으로 전완 굴곡근 구획의 혈류가 끊기면 구획증후군이 생기고,\n근육이 괴사한 뒤 섬유화되면서 손목과 손가락이 굽은 채 굳는 영구 변형이 남는다.</p>\n<p>내반주(cubitus varus)는 골절의 부정유합에서 오는 변형이므로 <b>혈관 손상의 합병증과는 구별</b>하여야 한다.</p>\n", "keys": ["장상지 석고", "볼크만", "Volkmann", "구획증후군", "상완동맥"]}}, {"no": 4, "body": "낙상 후 어깨를 바닥에 부딪힌 환자에서 견봉쇄골관절 탈구가 의심된다. 견봉\n쇄골관절의 안정성을 평가하기 위해 손상 여부를 확인해야 하는 주요 인대를\n2가지 기술하시오.(10점)", "sub": [10], "points": 10, "a": {"plan": "인대 두 가지를 묻는다. 이름만 나열하지 말고 각 인대가 어느 방향의 안정성을 맡는지 한 줄씩 덧붙이면 배점이 채워진다.", "ans": "\n<p>견봉쇄골관절의 안정성은 <b>수평 방향</b>과 <b>수직 방향</b>을 각각 다른 인대가 맡는다. 두 인대를 모두 확인하여야 한다.</p>\n<h4>① 견봉쇄골인대(acromioclavicular ligament)</h4>\n<p>관절을 직접 감싸는 인대로 <b>수평 방향(전후) 안정성</b>을 담당한다. 경도의 탈구에서 먼저 파열된다.</p>\n<h4>② 오구쇄골인대(coracoclavicular ligament)</h4>\n<p>오구돌기와 쇄골을 잇는 인대로 <b>원추인대(conoid)</b>와 <b>능형인대(trapezoid)</b>로 이루어지며\n<b>수직 방향 안정성</b>을 담당한다. 이 인대까지 끊어지면 쇄골 원위부가 위로 솟아오르는 변형이 나타난다.</p>\n<p>따라서 두 인대의 손상 여부에 따라 탈구의 정도(Rockwood 분류)가 갈리고 수술 여부의 판단도 달라진다.</p>\n", "keys": ["견봉쇄골인대", "오구쇄골인대", "원추인대", "능형인대"]}}, {"no": 5, "body": "드퀘르뱅 병에서 침범되는 대표적인 건 2가지를 기술하고(4점), 특징적인\n임상 증상 1가지와(3점) 진단에 이용되는 가장 대표적인 신체검사의\n명칭을(3점) 기술하시오.(10점)", "sub": [4, 3, 3, 10], "points": 10, "a": {"plan": "건 2가지(4점) · 증상 1가지(3점) · 검사명(3점)으로 배점이 쪼개져 있다. 세 덩어리를 눈에 보이게 나누어 쓴다.", "ans": "\n<h4>① 침범되는 건 2가지 (4점)</h4>\n<p>손목 <b>제1신전구획</b>을 지나는 <b>장무지외전건(abductor pollicis longus, APL)</b>과\n<b>단무지신전건(extensor pollicis brevis, EPB)</b>이다. 이 두 건과 이를 싸는 건초에 협착성 건초염이 생긴 것이 드퀘르뱅 병이다.</p>\n\n<h4>② 특징적인 임상 증상 (3점)</h4>\n<p><b>손목 요골측(요골 경상돌기 부위)의 통증과 압통</b>이다. 엄지를 펴거나 벌릴 때, 물건을 쥐거나 비틀 때 심해지고\n통증이 엄지와 전완으로 뻗친다.</p>\n\n<h4>③ 대표적인 신체검사 (3점)</h4>\n<p><b>핀켈스타인 검사(Finkelstein test)</b>이다. 엄지를 손바닥 안으로 접어 주먹을 쥐게 한 뒤\n손목을 <b>척측으로 꺾을 때</b> 요골 경상돌기 부위에 통증이 유발되면 양성이다.</p>\n", "keys": ["장무지외전건", "단무지신전건", "요골 경상돌기", "핀켈스타인", "Finkelstein"]}}, {"no": 6, "body": "60세 폐경 후 여성이 골다공증이 의심되어 골밀도 검사를 시행하였다. 골다공증\n진단에 가장 널리 사용되는 골밀도 검사의 명칭과(5점) 골다공증으로 진단할 수\n있는 골밀도 검사 결과의 기준을(5점) 각각 기술하시오.(10점)", "sub": [5, 5, 10], "points": 10, "a": {"plan": "검사 명칭(5점)과 진단 기준(5점)을 나눈다. 기준은 T-값과 측정 부위를 함께 적어야 한다.", "ans": "\n<h4>① 골밀도 검사의 명칭 (5점)</h4>\n<p><b>이중에너지 X선 흡수계측법(DXA, dual-energy X-ray absorptiometry)</b>이다.</p>\n<p>에너지가 다른 두 종류의 X선이 조직을 지나며 감쇠되는 정도의 차이로 골밀도를 계산한다.\n방사선 노출이 적고 재현성이 높아 진단과 치료 경과 관찰의 표준으로 쓰인다.</p>\n\n<h4>② 골다공증으로 진단하는 기준 (5점)</h4>\n<p>폐경 후 여성에서는 <b>T-값(T-score)이 −2.5 이하</b>일 때 골다공증으로 진단한다.</p>\n<p>T-값은 젊은 성인의 최대 골량과 견주어 표준편차로 나타낸 값이며, 측정 부위는\n<b>요추(L1-L4)·대퇴골 경부·대퇴골 전체</b>이고 <b>그중 가장 낮은 값</b>으로 판정한다.\n−1.0 이상은 정상, −1.0에서 −2.5 사이는 골감소증이다.\n다만 골밀도와 무관하게 <b>대퇴골 또는 척추의 골다공증성 골절</b>이 있으면 골다공증으로 진단한다.</p>\n", "keys": ["DXA", "이중에너지", "T-값", "-2.5", "요추", "대퇴골 경부"]}}, {"no": 7, "body": "간세포암종 감시검사는 고위험군에서 종양을 조기 발견하여 근치적 치료 기회를\n확보하고 사망률을 낮추는 것을 목적으로 한다. 다음을 답하시오.(10점)\n(1) 간세포암종 감시검사의 대상 환자군 3가지를 기술하시오.(3점)\n(2) 간세포암종 감시검사에 사용하는 검사 방법과 권장 감시 간격을 기술하시오.(7점)", "sub": [10, 3, 7], "points": 10, "a": {"plan": "(1)은 3점이라 대상군 3가지를 정확히 나열하는 것으로 끝내고, (2)는 7점이므로 검사 방법과 간격을 모두 적는다.", "ans": "\n<h4>(1) 감시검사 대상 환자군 3가지 (3점)</h4>\n<ul>\n<li><b>만성 B형간염 바이러스 감염자</b></li>\n<li><b>만성 C형간염 바이러스 감염자</b></li>\n<li><b>원인을 불문한 간경변증 환자</b></li>\n</ul>\n<p>세 집단은 간세포암종 발생률이 뚜렷하게 높아 감시의 이득이 비용을 넘어서는 <b>고위험군</b>으로 분류된다.</p>\n\n<h4>(2) 검사 방법과 권장 간격 (7점)</h4>\n<p>검사 방법은 <b>간 초음파검사</b>이며, <b>혈청 알파태아단백(AFP)</b> 측정을 함께 한다.\n초음파는 방사선 노출과 조영제가 없고 비용이 낮아 반복하기에 적합하지만 작은 종양이나 거친 간에서는 민감도가 떨어지므로\n혈청표지자를 더해 놓치는 병변을 줄인다.</p>\n<p>권장 간격은 <b>6개월</b>이다. 간세포암종의 배가시간을 고려할 때 6개월 간격이면 근치적 치료가 가능한 크기에서\n발견할 수 있고, 간격을 3개월로 줄여도 사망률 감소의 이득은 뚜렷하지 않다.</p>\n<p>초음파에서 결절이 보이거나 알파태아단백이 오르면 <b>역동적 조영증강 CT 또는 MRI</b>로 진단 검사를 이어 간다.</p>\n", "keys": ["B형간염", "C형간염", "간경변", "초음파", "알파태아단백", "6개월"]}}, {"no": 8, "body": "심부전 환자의 기능적 상태를 평가할 때 뉴욕심장학회(New York Heart\nAssociation, NYHA) 기능분류를 이용한다. 다음을 답하시오.(10점)\n(1) NYHA 기능분류의 정의를 기술하시오.(2점)\n(2) NYHA 기능분류의 등급과 기준을 기술하시오.(8점)", "sub": [10, 2, 8], "points": 10, "a": {"plan": "(2)에 8점이 걸려 있다. 네 등급을 하나도 빠뜨리지 말고 기준까지 함께 적는다.", "ans": "\n<h4>(1) NYHA 기능분류의 정의 (2점)</h4>\n<p>심부전 환자가 <b>신체활동을 할 때 느끼는 증상의 정도</b>에 따라 기능적 상태를 <b>Ⅰ~Ⅳ의 네 등급</b>으로 나눈 분류이다.\n객관적 검사치가 아니라 <b>환자의 자각 증상과 활동 제한</b>을 기준으로 하며, 치료 방침의 결정과 예후 판정에 쓰인다.</p>\n\n<h4>(2) 등급과 기준 (8점)</h4>\n<ul>\n<li><b>Ⅰ도</b> — 신체활동에 제한이 없다. 일상적인 활동으로는 피로·심계항진·호흡곤란이 생기지 않는다.</li>\n<li><b>Ⅱ도</b> — 신체활동이 <b>가볍게</b> 제한된다. 안정 시에는 편안하나 <b>일상적인 활동</b>에서 피로·심계항진·호흡곤란이 생긴다.</li>\n<li><b>Ⅲ도</b> — 신체활동이 <b>뚜렷하게</b> 제한된다. 안정 시에는 편안하나 <b>일상보다 가벼운 활동</b>에서도 증상이 생긴다.</li>\n<li><b>Ⅳ도</b> — 어떤 신체활동도 증상 없이 하지 못한다. <b>안정 시에도</b> 증상이 있고 활동하면 심해진다.</li>\n</ul>\n<p>등급이 올라갈수록 예후가 나쁘고, 손해사정에서는 노동능력상실률과 개호 필요성을 판단하는 자료로 쓰인다.</p>\n", "keys": ["NYHA", "자각 증상", "일상적인 활동", "안정 시"]}}, {"no": 9, "body": "임신성 당뇨병은 임신 전에 당뇨병이 없던 여성에서 임신 중기 이후에 당뇨병이\n처음 진단되는 경우를 말한다. 다음을 답하시오.(10점)\n(1) 고위험 임산부에서 임신성 당뇨병 선별검사의 시행 시기를 기술하시오.(2점)\n(2) 2단계 접근법에 따른 임신성 당뇨병의 진단 기준을 기술하시오.(8점)", "sub": [10, 2, 8], "points": 10, "a": {"plan": "(2)가 8점이다. 2단계 접근법이라는 이름대로 1단계와 2단계를 나누고 수치를 정확히 적는다.", "ans": "\n<h4>(1) 고위험 임산부의 선별검사 시행 시기 (2점)</h4>\n<p>비만·과거 임신성 당뇨병 병력·당뇨병 가족력 등 위험이 큰 임산부는\n<b>첫 산전 진찰 때(임신 초기)</b> 선별검사를 시행한다. 그 결과가 정상이면 <b>임신 24~28주</b>에 다시 검사한다.</p>\n\n<h4>(2) 2단계 접근법에 따른 진단 기준 (8점)</h4>\n<p><b>1단계 — 선별검사.</b> 공복과 무관하게 <b>50g 경구당부하검사</b>를 시행하고 <b>1시간</b> 뒤 혈당을 잰다.\n<b>140mg/dL 이상</b>이면 2단계로 넘어간다.</p>\n<p><b>2단계 — 진단검사.</b> 8시간 이상 금식 후 <b>100g 경구당부하검사</b>를 시행하고 공복·1시간·2시간·3시간 혈당을 잰다.\n아래 기준 가운데 <b>2개 이상</b>을 충족하면 임신성 당뇨병으로 진단한다(Carpenter-Coustan 기준).</p>\n<ul>\n<li>공복 <b>95</b>mg/dL 이상</li>\n<li>1시간 <b>180</b>mg/dL 이상</li>\n<li>2시간 <b>155</b>mg/dL 이상</li>\n<li>3시간 <b>140</b>mg/dL 이상</li>\n</ul>\n<p>한 번의 75g 경구당부하검사로 끝내는 1단계 접근법과 달리, 2단계 접근법은 선별과 진단을 나누어\n불필요한 진단검사를 줄이는 것이 특징이다.</p>\n", "keys": ["50g", "140", "100g", "95", "180", "155", "140", "2개 이상"]}}, {"no": 10, "body": "최근 국제 연구에 따르면 조절할 수 있는 위험인자를 관리함으로써 치매\n발생을 예방하거나 지연시킬 수 있다. 개인 또는 사회가 치매 발생 위험을\n낮추기 위해 실천할 수 있는 보호 행동을 절주, 금연, 혈당 관리, 규칙적인\n운동 이외 추가로 10가지 기술하시오.(10점)", "sub": [10], "points": 10, "a": {"plan": "‘10가지’를 요구했으므로 번호를 붙여 10개를 채우는 것이 곧 배점이다. 문제에서 제외한 절주·금연·혈당·운동은 다시 쓰지 않는다.", "ans": "\n<p>치매 위험인자 가운데 <b>조절 가능한 것</b>을 관리하면 발생을 늦추거나 막을 수 있다.\n문제에서 제외한 절주·금연·혈당 관리·규칙적인 운동 외에 다음 열 가지를 들 수 있다.</p>\n<ul>\n<li>① <b>난청의 교정</b> — 청력 검사를 받고 필요하면 보청기를 쓴다.</li>\n<li>② <b>시력 저하의 교정</b> — 백내장 수술 등 치료 가능한 시력 장애를 방치하지 않는다.</li>\n<li>③ <b>고혈압 관리</b> — 중년기부터 수축기 혈압을 130mmHg 이하로 유지한다.</li>\n<li>④ <b>고LDL콜레스테롤 관리</b> — 이상지질혈증을 치료한다.</li>\n<li>⑤ <b>비만 관리</b> — 적정 체중을 유지한다.</li>\n<li>⑥ <b>우울증의 조기 발견과 치료</b></li>\n<li>⑦ <b>두부 외상의 예방</b> — 안전벨트·헬멧 착용, 낙상 예방.</li>\n<li>⑧ <b>사회적 고립의 해소</b> — 사회활동과 사람 사이의 교류를 이어 간다.</li>\n<li>⑨ <b>교육 기회의 확대</b> — 청소년기 교육 수준을 높이고 성인기에도 인지 활동을 지속한다.</li>\n<li>⑩ <b>대기오염 노출의 감소</b> — 미세먼지 등 유해 대기 노출을 줄인다.</li>\n</ul>\n<p>이들 인자는 개인의 노력만으로 되지 않는 것이 섞여 있어, 교육·대기질처럼 <b>사회가 함께 개입해야 하는 항목</b>이라는 점을\n덧붙이면 문제가 말한 ‘개인 또는 사회’라는 표현에 맞는 답이 된다.</p>\n", "keys": ["난청", "시력", "고혈압", "LDL", "비만", "우울", "두부 외상", "사회적 고립", "교육", "대기오염"]}}]}, {"round": 49, "subject": "책임·근로자재해보상보험의 이론과 실무", "track": "신체", "src": "49회_2차 책임·근로자재해보상보험의 이론과 실무.pdf", "chars": 3605, "digits": 381, "pts_ok": true, "q": [{"no": 1, "body": "근로자‘A’는 △△건설회사 베트남 공장에서 현장관리자로 근무하던 중 2026년\n2월 15일 현장에서 작업중인 크레인에 부딪혀 넘어지는 사고로 뇌출혈과\n발목이 골절되는 부상을 당한 후 국내로 이송하여 300일간 요양치료를\n받았으나 후유장해가 발생하였다.\n아래의 <별표> 내용을 참고하여 각 질문에 답하시오. (20점)\n<별표>\n[보험가입사항]\n- 보험회사 : ‘갑’보험회사\n- 피보험자 : △△건설회사\n- 보험종목 : 해외근로자재해보장책임보험\n＊ 재해보상책임 특별약관\n＊ 재해보상확장 추가특별약관\n＊ 간병보상 추가특별약관\n- 보험기간 : 2025.07.01. ~ 2026.07.01.\n- 보상한도액 : 3억원 / 1인당, 5억원 / 1사고당\n[근로자 A의 전제조건]\n- 평균임금 : 100,000원 / 1일\n- 기대여명일 : 100일\n- 손해내역\n＊ 요양치료비 : 36,000,000원\n＊ 간병비용 : 9,000,000원\n＊ 이송비 : 5,000,000원 (호송인 1인비용 1,000,000원 포함)\n\n- 고용노동부 고시 간병급여\n간병등급 1등급(상시간병) 2등급(수시간병)\n간병비용 40,000원 30,000원\n- 후유장해 등급\n＊ 신경계통의 뚜렷한 장해가 남아 수시간호가 필요한 상태 (2급)\n＊ 족관절의 기능을 제대로 쓰지 못하는 상태 (8급)\n- 전제조건에 제시된 숫자는 계산상 편의를 위한 임의 계수임.\n(1)‘갑’보험회사가 보상하는 손해의 보상항목별 지급기준과 지급해야 할\n보험금을 그 산출 과정과 함께 기재하시오. (10점)\n(2) 간병보상 추가특별약관의 간병보상 지급대상 및 지급기준에 대하여 기재\n하시오. (10점)", "sub": [20, 10, 10], "points": 20}, {"no": 2, "body": "2026년 6월 25일‘김○○’이 운영하는 바닥면적 120㎡ 건물 1층에 위치한\n‘△△뼈해장국’음식점 주방에서 화재가 발생하였다. 이 화재사고로 종업원‘A’와\n고객‘C’는 부상을 입었고, 고객‘B’는 병원으로 이송되어 치료 도중에\n사망하였다.\n아래의 <별표> 내용을 참고하여 각 질문에 답하시오. (20점)\n<별표>\n[보험계약사항]\n보험회사 ‘갑’보험회사 ‘을’보험회사\n재난배상책임보험\n영업배상책임보험\n보험종목 종업원 배상책임 부보장\n시설소유관리자 특별약관\n특별약관\n피보험자 김○○ 김○○\n보험기간 2026.01.01. ~ 2027.01.01 2026.01.01. ~ 2027.01.01\n2억원 / 1인당\n보상한도액 의무보상한도액\n5억원 / 1사고당\n자기부담금 - 1,000,000원 / 1사고당\n[피해자별 손해내역]\n- 종업원 A 기초자료\n＊ 부상 손해액 : 40,000,000원 (치료비, 휴업손해 합산 / 부상등급 1급)\n＊ 피해자 과실 및 기왕증 없음.\n- 고객 B 기초자료\n＊ 부상 손해액 : 40,000,000원\n＊ 사망 손해액 : 1억 6,000만원 (부상등급 1급으로 치료 중 사망)\n＊ 특이사항 : 의료자문결과, 사고 전 기저질환으로 기왕증 기여도 50% 확정\n＊ 피해자 과실 없음.\n＊ 부상 및 사망 손해액은 기왕증 기여도 적용 전 손해액임.\n\n- 고객 C 기초자료\n＊ 부상 손해액 : 42,000,000원 (부상등급 3급)\n＊ 피해자 과실 및 기왕증 없음.\n[재난배상책임보험 부상등급별 보험금액 한도]\n부상등급 1급 2급 3급 4급 5급\n보험금액 3,000만원 1,500만원 1,200만원 1,000만원 900만원\n- 전제조건에 제시된 숫자는 계산상 편의를 위한 임의 계수임.\n(1)‘갑’보험회사의 피해자별 보상책임 여부를 설명하고 지급해야 할 보험금을\n그 산출과정과 함께 기재하시오. (10점)\n(2)‘을’보험회사의 피해자별 보상책임 여부를 설명하고 지급해야 할 보험금을\n그 산출과정과 함께 기재하시오. (10점)", "sub": [20, 10, 10], "points": 20}, {"no": 3, "body": "김○○은 △△리조트(주)의 직원으로 스키캠프에 참가한 학생들의 인솔, 관리와\n스키 활동의 기초지도 및 안전관리를 담당하고 있다. 2026년 1월 5일 김○○은\n학생들이 있는 장소로 이동하기 위하여 스키를 타고 내려오다가 사고장소에서\n정설 되지 않은 눈덩이와 부딪치면서 슬로프를 이탈하여 슬로프 가장자리에\n설치된 안전 펜스의 강도와 높이가 충분치 않은 관계로 그 안전펜스를 뚫고\n지나가 급경사지로 추락하는 사고가 발생하여 김○○은 우측 슬관절 탈구,\n후방 십자인대가 파열되는 상해를 입게 되었다.\n아래의 <별표> 내용을 참고하여 각 질문에 답하시오. (15점)\n<별표>\n[보험가입사항]\n- 보험회사 : ‘갑’보험회사\n- 피보험자 : △△리조트(주)\n- 보험종목 : 국내근로자재해보장책임보험 / 사용자배상책임보험 특별약관\n- 보상한도액 : 2억원 / 1인당, 5억원 / 1사고당\n- 자기부담금 : 200,000원 / 1사고당\n[전제조건]\n- 근 로 자 : 김○○\n- 생년월일 : 1980년 3월 5일\n- 사 고 일 : 2026년 1월 5일\n- 직 업 : △△리조트(주) 소속 직원 (정년 만 60세)\n- 월 소 득 : 3,000,000원\n- 도시 보통인부 일용노임(일) : 100,000원\n- 피해자 과실 : 40%\n- 진 단 명 : 우측 슬관절 탈구, 후방십자인대파열\n- 기발생치료비 : 10,000,000원\n- 비급여치료비 : 3,000,000원\n- 향후치료비 : 2,000,000원 (현가계산 후 금액)\n- 치료기간 : 2026.01.05. ~ 2026.07.04. (6개월)\n\n- 노동능력상실률 : 영구장해 20% (맥브라이드 기준)\n- 위자료 : 사망 또는 100% 후유장해 시 1억원 기준으로 산정할 것.\n- 일실퇴직금은 고려하지 아니함.\n- 호프만(H) 계수\n＊ 사고일 ~ 입원기간까지 (6개월) : 5 (H계수)\n＊ 사고일 ~ 정년까지 (170개월) : 155 (H계수)\n＊ 사고일 ~ 가동기간까지 (230개월) : 205 (H계수)\n- 산재보험금 지급내역\n요양급여 휴업급여 장해급여\n10,000,000원 15,000,000원 40,000,000원\n- 전제조건에 제시된 숫자는 계산상 편의를 위한 임의 계수임.\n(1) 사용자의 근로자에 대한‘안전배려의무’의 개념과 위반 시 효과에 대하여\n약술하시오. (5점)\n(2)‘갑’보험회사가 근로자‘김○○’에게 지급해야 할 보험금을 그 산출과정과\n함께 기재하시오. (10점)", "sub": [15, 5, 10], "points": 15}, {"no": 4, "body": "배상책임보험에서 제3자의 불법행위로 인한 손해배상금을 산정할 때 공평한\n손해분담을 위해 다음과 같은 책임제한을 하고 있다. (10점)\n(1) 대법원 판례에 의거하여 과실상계, 손익상계 및 기왕증 공제를 모두 적용하여야\n하는 경우에 그 각각의 의의와 적용 순서를 약술하시오. (7점)\n(2) 아래의 전제조건에서 피해자‘A’가 최종적으로 청구할 수 있는 손해배상금을\n산출하시오. (3점)\n[전제조건]\n- 피해자‘A’의 총 손해액 : 1억원\n- 기왕증 기여도 : 20%\n- 피해자‘A’의 과실비율 : 30%\n- 피해자가 수령한 타 보험금(손익상계 대상) : 2,000만원", "sub": [10, 7, 3], "points": 10}, {"no": 5, "body": "법률상 손해배상금 산정 시 적용되는‘중간이자 공제’에 대하여 약술하시오. (10점)", "sub": [10], "points": 10}, {"no": 6, "body": "근로기준법 및 동법 시행령에서 정한‘통상임금’의 개념과 판단기준 및\n통상임금에 포함되는 임금과 제외되는 임금의 적용범위를 약술하시오. (10점)", "sub": [10], "points": 10}, {"no": 7, "body": "영문영업배상책임보험(Commercial General Liability Policy)에서 보상하는\n추가 지급조항(Supplementary Payments)의 비용손해에 대하여 약술하시오. (10점)", "sub": [10], "points": 10}, {"no": 8, "body": "가족일상생활중배상책임 특별약관에서 규정하고 있는 보상하지 아니하는 손해를\n5개 이상 약술하시오. (5점)", "sub": [5], "points": 5}]}, {"round": 49, "subject": "제3보험의 이론과 실무", "track": "신체", "src": "49회_2차 제3보험.pdf", "chars": 3565, "digits": 365, "pts_ok": true, "q": [{"no": 1, "body": "「실손의료보험 표준약관」제19조(계약의 무효) 조항에 대하여 기술하시오. (10점)", "sub": [10], "points": 10}, {"no": 2, "body": "아래 조건을 참고하여, 질문에 답하시오. (15점)\n< 계약 사항 >\n보험종목 피보험자 보험기간 담보내용 가입금액\n이소망 2025.03.10. 뇌졸중(I60~I66) 진단비 2,000만원\n종합장기보험\n(58세, 女) ~2035.03.10. 뇌혈관질환(I60~I69) 진단비 1,000만원\n※ 계약 전 알릴 위무 위반사항은 없음.\n※ 진단비는 각 1회에 한하여 지급하며, 1년 이내 진단시 가입금액의 50%를 지급함.\n< 손해사정 내용 >\n피보험자는 2026년 2월 중순부터 두통, 안면 마비 등의 증상이 발생하여 한국병원\n신경과에 입원하여 2026.02.20. 시행한 Brain MRI 검사에서‘Acute cerebral infarction in\nleft MCA(middle cerebral artery)’로 2026.02.23. 최종 판독 보고됨.\n이에 주치의는 2026.03.17. 진단서를 발행함.\n(1) 손해사정 내용에 대한 보험회사의 보상책임과 지급보험금을 산정하시오. (10점)\n(2) 상기 사례와 달리, 피보험자가 뇌졸중(추정)으로 사망한 경우에도 진단 확정으로 인정\n하여 진단비를 지급할 수 있는 경우를 기술하시오. (5점)", "sub": [15, 10, 5], "points": 15}, {"no": 3, "body": "아래 조건을 참고하여, 2차 후유장해 진단에 대한 장해지급률을 산정하고 지급보험금을\n계산하시오. (20점)\n< 계약 사항 >\n계약자\n보험계약 보험기간 담보내용 가입금액\n피보험자\n2005.08.20. 상해후유장해(3~100%) 1억원\n장기상해 장보고\n~2025.08.20. 교통상해후유장해(50~100%) 1억원\n※ 보험계약은 유효한 것으로 가정하며, 계약 전·후 알릴 위무 위반사항은 없음.\n※ 질병·상해보험 표준약관을 사용하며, 정상 유지 계약임.\n< 사고 및 치료내용 >\n▪ 피보험자는 2024.07.15. 21시경 자택 계단에서 미끄러져 넘어지는 사고를 당한\n후 척추 골절, 경추 신경 손상(경추척수증) 등으로 수술 및 입원 치료함.\n▪ 사고 이후 재활치료 받아오던 중 치료의 효과를 기대할 수 없고 그 증상이\n고정된 2025.08.04. 1차 후유장해(①,②) 진단 받음.\n▪ 2025.08.11. 보험회사는 1차 후유장해 보험금을 지급함.\n▪ 같은 상해사고로 2026.07.10. 2차 후유장해 진단 받음.\n▪ 2차 후유장해(③, ④, ⑤)는 경추척수증으로 인한 관절 기능장해임.\n< 1차 후유장해 진단내용 >\n① 척추에 뚜렷한 기형을 남긴 때 (사고관여도 100% ) : 30%\n② 경추척수증으로 인한 일상생활 기본동작제한 장해지급률 : 23%\n< 2차 후유장해 진단내용 >\n③ 좌측 손의 제3수지, 제4수지 및 제5수지에 뚜렷한 장해를 남긴 때 : 15%\n④ 우측 손의 5개 손가락 모두에 뚜렷한 장해를 남긴 때 : 30%\n⑤ 우측 팔꿈치관절과 손목관절에 심한 장해를 남긴 때 : 40%", "sub": [20], "points": 20}, {"no": 4, "body": "아래 조건을 참고하여 보험회사의 보상책임과 지급보험금을 산정하시오. (20점)\n(단, 관련 법률 규정을 기술하고, 다툼이 있는 경우 판례에 의함)\n< 계약 내용 >\n계약자 지정\n보험종목 보험기간 보장내용\n피보험자 보험수익자\n질병사망 1억원\n2023.06.04.\n종합보험 A C 상해사망 1억원\n~2043.06.04.\n교통상해사망 1억원\n< 확인 사항 >\n▪ 보험계약 체결 이후 사망 시 보험수익자의 변경이나 재지정 사실은 없음.\n▪ 보험계약 체결상의 하자 및 계약 취소 ․ 무효 사유는 없음.\n< 경과 내용 >\n▪ 2023.06.04. : A는 자신을 피보험자로 보험계약 체결하고 C를 보험수익자로 지정함.\n▪ 2024.05.31. : 피보험자 A와 배우자 B는 협의 이혼함.\n▪ 2025.05.30. : 자택내에서 발생한 A의 중대한 과실로 인한 상해사고로 A와 C는\n중상을 입고 한국병원으로 이송됨.\n▪ 2025.05.31. : 상기 사고로 자녀 C 사망함.\n▪ 2025.06.05. : 상기 사고로 피보험자 A 사망함.\n▪ 2026.03.02. : 보험회사에 보험금 청구함.\n< 가족 관계 >\n▪ A의 자녀는 B와 사이에 출생한 C만 있음.\n▪ 자녀 C는 성인이며, 미혼임.\n▪ 피보험자 A의 부친 D, 모친 E는 생존하여 있음.\n▪ A, B, C, D, E 모두 법적 결격사유 없음.", "sub": [20], "points": 20}, {"no": 5, "body": "아래의 질문에 답하시오. (20점)\n< 확인 내용 >\n▪ 2023.03.02. 상해보험 가입함. (보험계약자 및 피보험자 : 홍길동)\n▪ 홍길동은 2026.03.03. 상해사고가 발생하여 보험금을 청구함.\n▪ 보험계약 체결시 중요한 약관 내용인‘계약 후 알릴의무와 알릴 의무 위반의 효과’에\n대해 명시 ․ 설명을 하지 않았음이 확인됨.\n▪ 보험회사는 보험금 청구건을 조사하는 과정에서 홍길동이 이륜자동차 운전이\n위험하다는 것을 알고 있었지만, 업무상 필요로 2025.03.01. 이륜자동차를\n구매하여 계속적 ․ 반복적으로 운행했다는 사실을 확인함.\n▪ 계약 후 알릴 의무 관련하여 홍길동에게 중대한 과실이 있었음이 확인됨.\n< 보험회사 처리 내용 >\n2026.03.30. 보험회사는 보험계약자 및 피보험자인 홍길동이 보험계약 체결 후 이륜\n자동차를 구매하여 계속적 ․ 반복적으로 운행했음에도 불구하고 보험회사에 이를\n알리지 않았으므로 약관 규정(계약 후 알릴 의무 위반의 효과) 및 상법 제652조\n(위험변경증가의 통지와 계약해지)에 따라 보험계약을 해지함.\n< 홍길동 주장 내용 >\n보험회사는 약관의 규제에 관한 법률에서 규정하고 있는 명시 ․ 설명 의무를 위반\n하였으므로 해당 약관을 보험계약의 내용으로 주장할 수 없음.\n따라서, 보험회사의 보험계약 해지는 부당함.\n(1) 약관 조항(계약 후 알릴의무와 알릴 의무 위반의 효과)과 상법 제652조(위험변경증가의\n통지와 계약해지)의 차이점을 3가지 이상 기술하시오. (10점)\n(2) 보험회사의 보험계약 해지 처리 적정성을 판단하고, 이에 대한 근거를 기술하시오. (10점)", "sub": [20, 10, 10], "points": 20}, {"no": 6, "body": "홍길동은 4세대 실손의료보험(계약1)을 5세대 실손의료보험(계약2)으로 전환했고,\n아래의 ①~② 통원의료비에 대한 A보험회사의 지급보험금을 산정하시오. (15점)\n(단, ①~②통원의료비를 급여, 비급여 순서대로 기술할 것)\n< 계약 사항 >\n[ 계약1 ]\n보험회사\n보험종류 기본형 특별약관\n(계약일자)\n상해비급여\n상해급여형\n기본형 질병비급여\nA 질병급여형\n실손의료보험 단, 통원1회당 20만원 한도\n(2025.03.04.) 단, 통원1회당\n(4세대) 3대비급여\n20만원 한도\n약관상 한도\n[ 계약2 ]\n특별약관2\n보험회사 보험종류 특별약관1\n기본형 (비중증\n(계약일자) (공제유형) (중증 비급여)\n비급여)\n상해급여형\n기본형 약관상 한도 약관상 한도\nA 질병급여형\n실손의료보험 단, 통원1회당 단, 통원1회당\n(2026.07.01.) 단, 통원1회당\n(5세대) 20만원 한도 20만원 한도\n20만원 한도\n< 통원의료비 내역 >\n급여\n통원일자 의료기관 병명 비급여\n(일부)본인부담금 공단부담금\n척추협착증 10만원 (증식치료\n①2026.05.04. K의원 8만원 12만원\n(M48) 1회 5만원 포함)\n척추협착증 10만원 (증식치료\n②2026.07.03. K의원 8만원 12만원\n(M48) 1회 5만원 포함)\n※ 과거 병(의)원 치료 내역 없음.\n※ 증식치료는 근골격계이학요법치료에 해당함.", "sub": [15], "points": 15}]}, {"round": 49, "subject": "자동차보험의 이론과 실무(대인배상 및 자기신체손해)", "track": "신체", "src": "49회 2차 자동차대인.pdf", "chars": 1951, "digits": 137, "pts_ok": true, "q": [{"no": 1, "body": "다음과 같은 사례를 기초로 하여 각 물음에 답하시오. (30점)\n<사고 발생 경위>\n2026. 6. 5. 10시경 갑(甲)의 아들인 A(만18세)가 아버지 차를 몰래 가지고 나오라는\n고교동급생인 친구 B의 적극적인 요구에 못 이겨 아버지 바지 주머니에 있던 차\nKey를 몰래 가지고 나왔다. 그 후 무면허 운전자인 B가 A와 무단운전 사실을 인지\n하고 있는 다른 친구 C를 동승시키고 고속도로를 운전 중 과속으로 가드레일을\n충격하였고, 옆 차로에서 운행하던 D 차량의 후면을 충격하였다. 이 사고로 A, B가\n부상을 입고 C, D는 현장에서 사망하였다.\n<보험계약 사항>\n갑은 기명피보험자로서 한국보험회사에 개인용자동차보험을 ⌜가족운전자 한정운전\n특약⌟,⌜26세 이상 한정운전 특약⌟으로 아래와 같이 가입함.\n- 보험기간 : 2025.07.31.~2026.07.31.\n- 대인배상 ⅠˑⅡ(무한) / 대물배상 5,000만원.\n- 자기신체사고 사망 5,000만원 / 부상 3,000만원 / 후유장애 5,000만원.\n<자기신체사고 상해 및 장애구분 급별 보험가입금액표>\n- 자기신체사고 : 부상 2급 1,600만원/ 3급 1,500만원/ 4급 1,400만원/ 5급 1,000만원.\n- 자기신체사고 후유장애 10급 900만원/ 11급 700만원/ 12급 500만원.\n<손해발생 사항>\n- A의 부상 : 좌측 위팔뼈목 골절(부상 4급)과 좌측 상완신경총 상부 몸통 완전\n손상으로 수술미시행(부상 5급)으로 총치료비 2,000만원이 발생함.\n- A의 후유장애 : 좌측 주관절 관절의 기능에 뚜렷한 장애로 10급으로 최종 평가.\n- B의 부상 : 좌측 골반 비구 분쇄골절로 수술(부상 1급), 우측 골반 비구골절로 총\n치료비 3,000만원이 발생함.\n- B의 후유장애 : 좌측 고관절 관절기능에 뚜렷한 장애로 10급으로 최종 평가.\n- C의 사망 : 실제손해액 6억원(동승감액비율 적용전 금액) ※동승자 감액비율은 50%.\n- D의 사망 : 실제손해액 5억원(D는 무과실)\n\n(1) 갑, A, B의 C, D에 대한 법률상 손해배상책임에 대하여 설명하시오. (10점)\n(2) 한국보험회사의 A, B, C, D에 대한 담보별 보상책임과 지급보험금을 산출하시오. (10점)\n(3) 이 사건 사고와 관련한 B의 무면허운전 사고부담금 및 한국보험회사의 구상권에\n대하여 설명하시오. (10점)", "sub": [30, 10, 10, 10], "points": 30}, {"no": 2, "body": "다음과 같은 사례를 기초로 하여 각 물음에 답하시오. (20점)\n<사고 발생 경위>\nA는 재활용품 수거트럭을 이용하여 아파트 내 재활용품 수거업무를 수행하는\n사업자이다. B는 A와 재활용품 수거 및 판매업무를 수행하는 공동사업자로서\n사고 당일 재활용품 수거작업을 책임지고 있었다. 2026. 5.", "sub": [20], "points": 20}, {"no": 3, "body": "B는 자신이 담당하는\n구역에 있는 재활용품을 수거하기 위하여 트럭에 장착되어 있는 집게장치를 이용\n하여 재활용 포대를 들어 올리던 중 집게장치의 노후화로 집게장치의 일부분이\n파손되어 떨어지는 바람에 그 충격으로 작업을 보조하던 C가 사망하였고, 이\n과정에서 현장작업을 책임지고 있는 B도 파편에 맞아 얼굴 부위에 중상을 입었다.\n<보험계약 사항>\n재활용품 수거트럭은 A와 B의 공동사업목적에 이용되는 차량이며, 등록증상의 소유자는\nA로 되어 있다. A는 보험회사와 위 트럭을 피보험자동차로 하여 대인배상ⅠˑⅡ에 가입\n하고 있다.\n(1) 이 사건 사고가 자동차손해배상보장법상 자동차의 운행에 해당하는지 여부에\n대하여 설명하시오. (10점)\n(2) 국의 20×1년 포괄손익계산서에 당기손익으로 인식될\n금액은? (이익 또는 손실 여부를 표기하고 금액을 제시하시오.) (5점)\n(2) 위 거래로 인해 (주)한국의 20×2년 포괄손익계산서에 당기손익으로 인식될\n금액은? 단, (주)한국은 금융자산의 제거시점에 기인식한 기타포괄손익\n누계액을 당기손익으로 재분류조정한다. (이익 또는 손실 여부를 표기\n하고 금액을 제시하시오.) (5점)", "sub": [5, 5], "points": 10}, {"no": 10, "body": "다음은 (주)한국의 영업활동과 부분 재무상태표의 일부이다. 주어진 자료\n를 이용하여 다음의 물음에 답하시오.\n부분 재무상태표\n구분 20×1년 초 20×1년 말\n매출채권 ￦10,000 ￦20,000\n손실충당금 ￦(2,000) ￦(3,000)\n재고자산 ￦60,000 ￦50,000\n매입채무 ￦10,000 ￦5,000\n미지급비용 ￦14,000 ￦12,000\n(주)한국이 20×1년도에 ￦70,000의 당기순이익과 ￦10,000의 감가상각비를\n보고했을 경우 (주)한국의 영업활동으로 인한 현금흐름은? (증감을 (+)/(-)로\n표시하시오.) (5점)", "sub": [5], "points": 5}, {"no": 11, "body": "(주)한국은 실제원가계산을 적용하고 있으며, 20×1년 기초 및 기말의 재고\n자산금액은 다음과 같다. 20×1년의 기초(기본)원가는 ￦420,000이고, 가공\n(전환)원가의 50%가 제조간접원가이며, 직접재료매입액은 ￦66,000이다.\n(주)한국의 20×1년 매출원가는? (5점)\n구분 기초 기말\n직접재료 ￦44,000 ￦20,000\n재 공 품 ￦47,000 ￦30,000\n제 품 ￦20,000 ￦58,000", "sub": [5], "points": 5}, {"no": 12, "body": "(주)한국은 종합원가계산을 사용하며 평균법을 적용한다. 제품은 제1공정\n을 거쳐 제2공정에서 최종 완성되며, 제2공정의 20×1년 7월의 완성품\n환산량 단위당 원가는 다음과 같다. 제2공정에서 직접재료는 가공(전환)\n원가 완성도 60% 시점에서 투입되며, 가공(전환)원가는 제2공정 전체를\n통해 균등하게 발생한다. 7월 말 제2공정의 재공품은 2,000개이며, 가공(전환)\n원가의 완성도는 50%이다. 제2공정의 기말재공품원가는? (5점)\n구분 완성품환산량 단위당 원가\n직접재료원가 ￦200\n전공정(제1공정)원가 ￦600\n가공(전환)원가 ￦250", "sub": [5], "points": 5}, {"no": 13, "body": "(주)한국은 20×1년 1월 1일에 설립되었고, 20×1년과 20×2년의 제품 생산량\n및 판매량은 다음과 같으며, 원가흐름은 선입선출법을 적용한다. 20×1년\n전부원가계산에 의한 영업이익은 ￦34,000이며, 20×2년에 발생한 고정제조\n간접원가는 ￦133,000일 경우 다음의 물음에 답하시오. 단, 두 기간의 단위당\n판매가격, 단위당 변동제조원가 및 단위당 변동판매관리비는 동일하며, 재공품\n재고는 없다.\n구분 20×1년 20×2년\n생산량 3,000단위 3,800단위\n판매량 2,600단위 4,000단위\n변동원가계산 영업이익 ￦26,000 ￦50,000\n(1) 20×2년 기말제품에 포함된 고정제조간접원가는? (5점)\n(2) 20×2년 전부원가계산에 의한 영업이익은? (5점)", "sub": [5, 5], "points": 10}, {"no": 14, "body": "범용기계장치를 이용하여 제품 A를 생산·판매하는 ㈜한국의 당기 예산자료는\n다음과 같다. (주)한국은 신규 거래처로부터 제품 A 3,000단위를 판매할 수\n있는 특별주문을 받았으며, 단위당 변동제조원가와 단위당 변동판매관리비는\n변화가 없다. 특별주문 수락 시 기존제품의 정규시장 판매를 일부 포기해야 한다.\n다음의 물음에 답하시오. 단, 특별주문은 전량 수락하든지 기각해야 한다.\n구분 제품 A\n단위당 판매가격 ￦2,500\n단위당 변동제조원가 ￦1,200\n단위당 변동판매관리비 ￦40 n(2) B 화물은 당해 화재 사고에서 손상을 입지 않았으며, 피난항에서 송하인에게\n회송되었다. 하기 정보를 바탕으로 공동해손 손해가 있을 경우 그 인정금액\n및 당해 화물의 공동해손 분담가액을 산정하시오. (5점)\n◯ 손상없음\n◯ 피난항에서 송화주에게 회송시 운송비 : US$ 10,000\n(3) C 화물은 당해 화재 사고의 화재 진압 과정에서 소방수에 손상을 입었으며,\n피난항에서 매각되었다. 하기 정보를 바탕으로 공동해손 손해가 있을 경우\n그 인정금액 및 당해 화물의 공동해손 분담가액을 산정하시오. (5점)\n◯ 피난항에서 매각된 가격 : US$ 40,000\n◯ 피난항에서 최종목적항까지의 예상운송비 : US$ 15,000", "sub": [15, 5, 5, 5], "points": 15}, {"no": 3, "body": "항공유 2,000톤을 호주로 수출하면서 보험금액을 US$ 2,000,000(CIF 송장\n가격 US$ 1,000/톤 X 2,000톤 X 100%)으로 하여 적하보험에 가입하였다.\n운송선박의 A, B 2개의 탱크에 각 1,000톤을 싣고 호주 근해를 항해 중\n선박의 좌초 사고로 A 탱크에 해수가 유입되었다. B 탱크에는 하역 시 선원의\n밸브 오작동으로 인해 타 화물이 유입되는 오염 사고가 있었다.\n최종도착지에서 조사한 결과 다음과 같이 손해가 확인되었다.\n◯ 좌초 시 해수 유입으로 인한 손상 내역\n- 시험결과 항공유로 부적합 판단 폐기 처리\n- 폐기처리비용 US$ 200,000 발생\n- 보관비용 US$ 50,000 발생\n◯ 선원의 밸브 오작동으로 인한 오염 손상 내역\n- 정제 후 사용 가능하며 50% 감가 판매\n◯ 각 탱크 입고량\n- 수출항 육상 탱크 : 2,000 톤\n- 운송선박 적재량 : A탱크 1,000 톤 / B탱크 1,000 톤\n- 도착항 육상탱크 : A탱크 1,000 톤 / B탱크 980 톤,\n20톤 부족손(Shortage) 발생\n(※ 해수, 타 화물 유입량 제외)\n아래의 보험조건으로 적하보험에 가입된 경우, 보험자가 지급해야 할\n보험금을 산정하시오. (10점)\n(1) ICC(B), Pipe Line Clause (B), including the risks of shortage in excess\nof 0.5% (5점)\n(2) Bulk Oil Clauses with Marine Extension Clause in excess of 0.5% of all\nclaims other than TL/CTL (5점)", "sub": [10, 5, 5], "points": 10}, {"no": 4, "body": "화공품 1,000 bags을 유럽으로 수출하면서 보험금액 US$ 1,100,000 (CIF\n송장가격 US$ 1,000/bag X 1,000 bags X 110%)로 적하보험에 가입하였다.\n운송 중 화물에 손상이 발생하였으며 최종 도착지에서 확인된 조사 내용은\n다음과 같다.\n◯ 800 bags : 정상 도착\n◯ 100 bags : 인도양 항해 중 악천후(Heavy weather) 시 통풍 차단으로 인한\n습기(Sweat) 손해, 감가율 10%로 합의됨\n◯ 50 bags : 부선에 적재하여 내륙 운하로 항해 중 강물의 유입으로 인한\n수침 손해, 감가율 10%로 합의됨\n◯ 30 bags : 하역 작업 중 빗물로 인한 수침 손해, 감가율 10%로 합의됨\n◯ 10 bags : 하역 작업 중 추락으로 전손\n◯ 10 bags : 미 도착 (non-delivery)\n위 상황에서 ICC(B)와 ICC(C)로 적하보험 가입 시 각 조건별로 담보 여부를\n설명하고 보험자가 지급해야 할 보험금을 산정하시오. (10점)", "sub": [10], "points": 10}, {"no": 5, "body": "다음의 경우에 대하여 선박건조보험 증권 하에서의 보험자가 지급해야 할 보험금을\n산정하시오. (10점)\n[보험 가입 내용]\n◯ 보험 조건 : Institute Clauses for Builders’ Risks (Cl.351) (1.6.88)\n.with deductible of US$ 350,000\n◯ 보험 가입금액 : US$ 10,000,000 (so valued)\n◯ 보험 기간 : 2025년 6월 16일 00:00 ~ 2026년 6월 15일 24:00\n(Keel Laying to Delivery)\n[보험 사고 내용]\n보험기간 중 선박 A호의 선박 인도 전에 부산 소재 조선소에서 포항까지\n왕복 시운전을 하던 중 선박 A호의 100% 과실로 투묘 중이던(anchoring)\n유조선 B호와 충돌하였다.\n본 충돌사고로 인하여 상대선은 침몰하여 전손되었고(인명 피해는 없고,\n상대선 선가 US$ 4,000,000 임), 본선은 충돌로 인한 충격으로 복원력이\n일시 상실되면서 인근한 가두리 양식장을 망가뜨려 US$ 5,000,000의 배상\n책임을 지게 되었다. 이후, 본선은 결국 좌초되어 구조비 US$ 2,000,000을\n들여 구조된 후 수리되었다. (본선 수리비 : US$ 3,000,000)\n또한, 충돌사고로 인한 방어법률비용으로 US$ 2,000,000이 별도로 지출되었다.", "sub": [10], "points": 10}, {"no": 6, "body": "선박이 부두에 접안하던 중 파도의 영향 및 도선사의 부주의로 부두와\n접촉하여 선체에 손상을 입었다. 손상의 형태나 정도가 감항성에 영향을\n줄 수 있는 상태인 것으로 확인되어 항차를 중단하고 선박을 수리항으로\n회항하여 손상 수리를 시행하였으며, 이번 기회를 이용하여 선주 수리를\n같이 시행하였다.\n당해 선박은 불가동손실 보험(Loss of Hire Insurance)에 아래와 같은\n조건으로 가입되어 있고 수리 기간이 아래와 같은 경우 질문에 답하시오.\n(10점)\n◯ 보험가입금액 : US$ 3,600,000\n◯ 적용약관 : Loss of Charter Hire – Excluding War\n(ABS 1/10/83)\n◯ Daily hire agreed : US$ 20,000/day\n◯ Excess period : 10 days\n◯ 수리항 회항 : 2 days\n◯ 실제 수리 기간 : 15 days\n◯ 손상 수리만 따로 시행할 경우 필요한 수리 기간 : 15 days\n◯ 선주 수리만 따로 시행할 경우 필요한 수리 기간 : 12 days\n(1) 손상 수리와 같이 시행된 선주 수리 작업이 감항성 유지를 위해서 당장\n필요한 수리가 아닌 경우 불가동손실 보험자가 지급해야 할 보험금을 산정\n하시오. (5점)\n(2) 손상 수리와 같이 시행된 선주 수리 작업이 감항성 유지를 위해서 당장\n필요한 수리인 경우 불가동손실 보험자가 지급해야 할 보험금을 산정하시오.\n(5점)", "sub": [10, 5, 5], "points": 10}, {"no": 7, "body": "「Institute War and Strike Clauses Hulls – Time 1/10/83」 제5조\n종료(Termination) 조항에서 해지통보의 유무와 관계없이 자동 종료되는\n사항에 대해 설명하시오. (5점)", "sub": [5], "points": 5}, {"no": 8, "body": "「Institute Time Clauses - Hulls (1/10/83)」 제9조 자매선 조항(Sistership\nClause)의 제정 취지와 내용에 관하여 약술하시오. (5점)", "sub": [5], "points": 5}, {"no": 9, "body": "런던해상보험자협회(ILU) 가입 보험사들과 로이즈해상보험자들은 1937년\n12월에 「War Risks Waterborne Agreement」를 맺었는 바, 「Institute\nWar Clauses (Cargo) 1982」에서 Waterborne Agreement와 관련된\n내용을 약술하시오. (5점)", "sub": [5], "points": 5}, {"no": 10, "body": "항공운송인의 국제운송화물에 대한 손해배상책임과 관련하여 현행 우리\n상법상 책임 한도액과 현행 몬트리올 협약(Montreal Conventions)상 k 과태료를 부과받았다.\n또한, 피해고객 1,000명이 단체로 손해배상청구소송을 제기하여 5억원의 판결금과\n1억원의 변호사비용을 지출했다.\n상기 사고에 대비하기 위해 A사는 개인정보보호배상책임보험을 가입하고 있다.\n이 경우 A사가 입은 손해 중 ① 보통약관에서 보상하는 손해를 설명하고, ② 보통\n약관에서 보상하지 않는 손해를 보상받기 위한 특별약관을 기재하고, 해당 특약의\n보상하는 손해와 보상하지 않는 손해를 약술하시오. (10점)", "sub": [10], "points": 10}, {"no": 7, "body": "보험계약자(피보험자)가 재산종합보험(Package Insurance) Section Ⅰ(PAR)을 가입\n하고 <표1>의 사고가 발생하였다. 이 경우 피보험자가 보상을 받기 위해 가입해야 할\n확장담보(Special Extentions)를 기재하고, 주요 내용을 약술하시오. (10점)\n<표1. 사고내용>\n계약자(피보험자)는 현재 운영중인 공장동에 소규모의 신규 증축공사를 진행하던 중이었다.\n그러나 작업자의 부주의로 용접 불꽃이 판넬에 옮겨 붙으며 대형화재가 발생하였고 공사\n중이던 건물, 시설을 포함하여 공장동 대부분이 소실되었다.\n불길이 인접한 완제품 창고로 번지는 것을 막기 위해 급히 방화벽을 구축하고 자재들을\n안전한 곳으로 긴급하게 이동시켰다.\n화재가 진압된 후 무너진 건물 잔해를 치우고 주변 오염물질을 세척하는 작업을 진행\n하였으며, 일부 기계는 정밀점검 및 수리를 위해 인근 협력업체 작업장으로 일시 이동\n시켰으나, 협력업체 작업장에서 기계 하차 중 전도되어 물적손해가 발생하였다. 피보험자는\n해당 기계의 신속한 복구를 위해 독일 제조사로부터 부품을 긴급 조달하여 수리하였다.\n또한 건물을 원상태로 복구하려 하였으나 최근 개정되어 강화된 소방법규의 적용이\n필요하고, 복구기간이 길어지는 것을 피하기 위해 전 직원이 야간근무 및 휴일에도\n집중 투입되어 공장을 복구하였다.", "sub": [10], "points": 10}]}, {"round": 49, "subject": "자동차보험의 이론과 실무(대물배상 및 차량손해)", "track": "차량", "src": "49회_2차 자동차보험의 이론과 실무 (대물배상 및 차량손해).pdf", "chars": 884, "digits": 28, "pts_ok": true, "q": [{"no": 1, "body": "보험회사의 대위권에 대하여 설명하고, 자차의 일방과실 사고로 자기\n차량과 피해차량에 대하여 전손보험금을 지급한 경우 잔존물대위에\n대한 법률 규정과 보험회사가 피보험자의 권리를 취득하지 않는 약관\n규정에 대하여 서술하시오.(20점)", "sub": [20], "points": 20}, {"no": 2, "body": "부가가치세(VAT)의 정의 및 인정기준에 대해 약술하고, 아래의 여객운송\n수단별 부가가치세 적용을 판단하시오.(15점)\n예) 시내버스 : (면세) / 고속철도 : (과세)\n① 특수자동차(장의차량) : ( ) ② 농어촌버스 : ( )\n③ 마을버스 : ( ) ④ 전세버스 : ( )\n⑤ 시외버스(고속형) : ( ) ⑥ 법인택시 : ( )", "sub": [15], "points": 15}, {"no": 3, "body": "과실비율 인정기준의 적용에서 “구체적인 과실비율 확정방법(수정요소\n적용)”을 설명하고, 아래 사고유형의 기본과실과 수정요소에 대해\n서술하시오.(15점)\n(과실도표 차 11-2) 신호있는 교차로 동일방향 총 4차선도로에서\nA차량이 직진좌회전차로 2차선에서 직진할 때\nB차량이 직진차로 3차선에서 좌회전하는 사고가 발생하였다.", "sub": [15], "points": 15}, {"no": 4, "body": "개인사업용차량의 휴차료 산정 시 증명자료가 있는 경우 휴차료 산정 방식을\n설명하고, 영업수익 계산 시 징구하여야 할 증명자료와 1일 운행경비 계산에\n필요한 세부항목에 대하여 나열하시오.(15점)", "sub": [15], "points": 15}, {"no": 5, "body": "자기차량손해(차량 단독사고 보장 특별약관 포함)에서 보상범위와 보상\n한도에 대하여 설명하고, 보상하지 않는 손해에 대해 열거한 후 주정차 중\n타이어에 생긴 손해에서 보상하는 경우를 서술하시오.(15점)", "sub": [15], "points": 15}, {"no": 6, "body": "표준작업시간의 구성에 대하여 설명하고, 공임률의 정의와 공임 총원가의\n구성요소에 대하여 약술하시오.(10점)", "sub": [10], "points": 10}, {"no": 7, "body": "보험계약자 등의 의무 중 계약 전 알릴 의무를 설명하고, 이를 위반한 경우의\n효과 및 보험계약을 해지할 수 없는 경우에 대하여 약술하시오.(10점)", "sub": [10], "points": 10}]}, {"round": 49, "subject": "자동차구조 및 정비이론과 실무", "track": "차량", "src": "49회 2차 자동차 구조 및 정비이론과 실무.pdf", "chars": 700, "digits": 21, "pts_ok": true, "q": [{"no": 1, "body": "커먼레일 디젤엔진(CRDI; Common Rail Direct Injection)에서 연료 공급\n시스템의 구성요소와 역할을 약술하시오.(10점)", "sub": [10], "points": 10}, {"no": 2, "body": "유성 기어식 동력분기형 하이브리드 시스템(Hybrid System)의 구성요소와\n단계별 동력분배 원리를 서술하시오.(15점)", "sub": [15], "points": 15}, {"no": 3, "body": "자동차 전장 시스템에 적용되는 IPS(Intelligent Power Switch)의 기능과\n효과에 대하여 약술하시오.(10점)", "sub": [10], "points": 10}, {"no": 4, "body": "자동차 차체의 전착도막(Electric-coating)이 손상되는 원인과 복원수리방법에\n대하여 약술하시오.(10점)", "sub": [10], "points": 10}, {"no": 5, "body": "에어백(Air Bag)의 시스템 구성을 설명하고, SRS(Supplemental Restraint\nSystem)에어백, 디파워드 에어백(Depowered Air Bag), 스마트 에어백\n(Smart Air Bag), 어드밴스드 에어백(Advanced Air Bag)의 특징에 대하여\n서술하시오.(20점)", "sub": [20], "points": 20}, {"no": 6, "body": "전기자동차의 난방시스템을 구성하고 있는 PTC히터(Positive Temperature\nCoefficient thermistor)와 히트 펌프 시스템(Heat Pump System)에 대하여\n서술하시오.(20점)", "sub": [20], "points": 20}, {"no": 7, "body": "전기자동차의 고전압 시스템 관리 및 제어를 수행하는 MCU(Motor Control\nUnit)와 OBC(On-Board Charger)의 역할 및 기능에 대하여 서술하시오.(15점)", "sub": [15], "points": 15}]}, {"round": 48, "subject": "의학이론", "track": "신체", "q": [{"no": 1, "points": 10}, {"no": 2, "points": 10}, {"no": 3, "points": 10}, {"no": 4, "points": 10}, {"no": 5, "points": 10}, {"no": 6, "points": 10}, {"no": 7, "points": 10}, {"no": 8, "points": 10}, {"no": 9, "points": 10}, {"no": 10, "points": 10}], "locked": true}, {"round": 48, "subject": "책임·근로자재해보상보험의 이론과 실무", "track": "신체", "q": [{"no": 1, "points": 25 /* ── 밤낮 ── */
(function () {
  const k = 'sonsa2.theme';
  const set = v => { document.documentElement.dataset.theme = v; try { localStorage.setItem(k, v); } catch (e) {} };
  let v = null;
  try { v = localStorage.getItem(k); } catch (e) {}
  if (v) document.documentElement.dataset.theme = v;
  $('#themeBtn').onclick = () => set(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
})();

/* ── 답안 보관 ── */
const KEY = 'sonsa2.draft';
function drafts() {
  try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; }
}
function saveDraft(id, text) {
  const d = drafts();
  if (text.trim()) d[id] = text; else delete d[id];
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
}

/* ── 현재 고른 것 ── */
const state = { track: '신체', round: 0, subject: '' };

function rounds(track) {
  return [...new Set(EXAM2.filter(r => r.track === track).map(r => r.round))]
    .sort((a, b) => b - a);
}
function subjects(track, round) {
  return EXAM2.filter(r => r.track === track && r.round === round).map(r => r.subject);
}
function paper() {
  return EXAM2.find(r => r.track === state.track && r.round === state.round &&
                         r.subject === state.subject);
}

function chip(text, on, fn, locked) {
  const b = document.createElement('button');
  b.className = 'chip' + (on ? ' on' : '') + (locked ? ' lock' : '');
  b.innerHTML = esc(text) + (locked ? '<span class="lk">🔒</span>' : '');
  b.onclick = fn;
  return b;
}

function drawPicks() {
  const tr = $('#trackRow'), rr = $('#roundRow'), sr = $('#subjRow');
  tr.textContent = rr.textContent = sr.textContent = '';
  TRACKS.forEach(t => tr.appendChild(chip(t, t === state.track, () => {
    state.track = t;
    state.round = rounds(t)[0];
    state.subject = subjects(t, state.round)[0];
    draw();
  })));
  rounds(state.track).forEach(n => rr.appendChild(
    chip('제' + n + '회', n === state.round, () => {
      state.round = n;
      const ss = subjects(state.track, n);
      if (!ss.includes(state.subject)) state.subject = ss[0];
      draw();
    }, n !== FREE_ROUND2 && (paperOf(n, state.subject) || {}).locked)));
  subjects(state.track, state.round).forEach(s => sr.appendChild(
    chip(short(s), s === state.subject, () => { state.subject = s; draw(); })));
}

function paperOf(round, subject) {
  return EXAM2.find(r => r.round === round && r.subject === subject);
}

/* 과목명이 길어 칩에는 줄여 쓴다 */
function short(s) {
  return s.replace('의 이론과 실무', '')
          .replace('자동차보험(대인배상 및 자기신체손해)', '자동차(대인)')
          .replace('자동차보험(대물배상 및 차량손해)', '자동차(대물)')
          .replace('책임·근로자재해보상보험', '책임·근재')
          .replace('책임·화재·기술보험 등', '책임·화재·기술')
          .replace('자동차구조 및 정비이론과 실무', '자동차구조');
}

/* ── 본문에서 표처럼 보이는 줄을 따로 감싼다 ── */
function bodyHTML(t) {
  return esc(t).split('\n').map(ln => {
    const s = ln.trim();
    if (s.includes('|') && s.split('|').length >= 3) return '<span class="tb">' + ln + '</span>';
    return ln;
  }).join('\n');
}

/* ── 타이머 ── */
let tick = null, left = 0;
function fmt(s) {
  const m = Math.floor(Math.abs(s) / 60), x = Math.abs(s) % 60;
  return (s < 0 ? '-' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0');
}
function startTimer(el) {
  if (tick) clearInterval(tick);
  tick = setInterval(() => { left--; el.textContent = fmt(left); }, 1000);
}

function draw() {
  drawPicks();
  const p = paper(), m = $('#main');
  m.textContent = '';
  if (!p) return;

  const head = document.createElement('div');
  head.className = 'paper';
  const sum = (p.q || []).reduce((a, q) => a + (q.points || 0), 0);
  head.innerHTML = '<h2>' + esc(p.subject) + '</h2>' +
    '<span class="meta">제' + p.round + '회 · ' + (p.q || []).length + '문항 · ' + sum + '점</span>';
  if (!p.locked) {
    const tm = document.createElement('div');
    tm.className = 'timer';
    tm.innerHTML = '<span>남은 시간</span><b id="clk">90:00</b>';
    const b1 = document.createElement('button');
    b1.className = 'tbtn'; b1.textContent = '시작';
    const b2 = document.createElement('button');
    b2.className = 'tbtn'; b2.textContent = '멈춤';
    b1.onclick = () => { left = 90 * 60; $('#clk').textContent = fmt(left); startTimer($('#clk')); };
    b2.onclick = () => { if (tick) clearInterval(tick); tick = null; };
    tm.append(b1, b2);
    head.appendChild(tm);
  }
  m.appendChild(head);

  if (p.locked) {
    const d = document.createElement('div');
    d.className = 'locked';
    d.innerHTML = '<b>이용권이 있어야 열립니다</b>제' + FREE_ROUND2 +
      '회는 결제 없이 볼 수 있습니다. 나머지 회차는 ' +
      '<a href="./index.html#pay">이용권 안내</a>를 참고하세요.';
    m.appendChild(d);
    return;
  }

  (p.q || []).forEach(q => m.appendChild(qCard(p, q)));
}

  bm.onclick = () => {
    model.classList.toggle('open');
    bm.textContent = model.classList.contains('open') ? '모범답안 닫기' : '모범답안 보기';
    refresh();
  };
  bc.onclick = () => { ta.value = ''; saveDraft(id, ''); refresh(); };
  refresh();
  return el;
}

/* ── 이용권이 있으면 전체 회차를 받아 온다 ──
   배포본에는 무료 회차만 박혀 있어 소스를 열어도 나머지가 나오지 않는다.
   로그인·결제는 1차 화면(index.html)에서 하고 토큰을 함께 쓴다. */
const API = '/api';
let EXAM2ALL = EXAM2;
function auth() {
  try { return JSON.parse(localStorage.getItem('sonsa:auth') || 'null'); } catch (e) { return null; }
}
async function loadFull() {
  const a = auth();
  if (!a || !a.token || location.protocol === 'file:') return;
  try {
    const r = await fetch(API + '/content', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: a.token, doc: 'exam2' }),
    }).then(x => x.json());
    if (r.ok && Array.isArray(r.data) && r.data.length) {
      EXAM2ALL = r.data;
      EXAM2.length = 0;
      r.data.forEach(x => EXAM2.push(x));
      draw();
    }
  } catch (e) { /* 네트워크 실패 — 내장된 무료 회차로 이어 간다 */ }
}

/* ── 시작 ── */
(function () {
  const u = new URLSearchParams(location.search);
  state.track = TRACKS.includes(u.get('t')) ? u.get('t') : '신체';
  const rs = rounds(state.track);
  state.round = rs.includes(+u.get('r')) ? +u.get('r') : rs[0];
  const ss = subjects(state.track, state.round);
  state.subject = ss.includes(u.get('s')) ? u.get('s') : ss[0];
  draw();
  loadFull();
})();
</script>
