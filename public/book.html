<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>손해사정사 1차 · 전자교재</title>
<meta name="theme-color" content="#0A0A0C">
<meta name="description" content="손해사정사 1차 전자교재 — 보험업법 · 보험계약법 · 손해사정이론">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* ══════════════════════════════════════════════════════════════
   손해사정사 1차 전자교재 · S2S 디자인 언어 + 애플식 읽기 경험
   메탈블랙(무대) · 은빛크리스탈(글자) · 블루사파이어(강조 한 곳)
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#0A0A0C; --surf:#141417; --surf2:#101013;
  --edge:#232328; --lift:#2E2E35;
  --tx:#F5F5F7; --tx2:#D6DBE3; --tx3:#9AA3B0; --tx4:#646C7A; --tx5:#3A404B;
  --sap:#1552D6; --sap2:#3E9BFF; --sap3:#8FD0FF;
  --grad:linear-gradient(135deg,#06153F 0%,#0A2A6E 26%,#1552D6 62%,#3E9BFF 100%);
  --crystal:linear-gradient(180deg,#FFFFFF 0%,#C4CCD8 62%,#7F8794 100%);
  --glass:linear-gradient(160deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 42%,rgba(255,255,255,0) 100%);
  --ok:#4CC38A; --warn:#C9903A; --bad:#E0574F; --violet:#9B8CFF; --teal:#4BC0C8;
  --r:14px; --rp:999px;
  --f:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'SF Pro Display','Apple SD Gothic Neo',system-ui,sans-serif;
  --m:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.28,.11,.32,1);
  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:72px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx2);font-family:var(--f);font-size:17px;
  line-height:1.7;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sap2);outline-offset:2px}
img,svg{max-width:100%}
mark{background:rgba(62,155,255,.28);color:var(--tx);border-radius:3px;padding:0 2px}

/* ── 애플 효과 ── */
#scrollbar{position:fixed;top:0;left:0;height:2px;width:0;z-index:100;background:var(--grad);
  border-radius:0 2px 2px 0;transition:width .12s linear}
.reveal{opacity:0;transform:translateY(14px);
  transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ── 상단 바 ── */
.gnb{position:sticky;top:0;z-index:60;background:rgba(10,10,12,.82);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--edge)}
.gnb-in{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:10px;
  padding:0 clamp(14px,3vw,28px);height:54px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14.5px;cursor:pointer;
  white-space:nowrap;letter-spacing:-.02em;color:var(--tx);background:none;border:0}
.logo .mark{width:24px;height:24px;border-radius:7px;background:var(--grad);flex:none;
  display:grid;place-items:center;font-size:11px;color:#fff;font-weight:800;
  box-shadow:0 0 0 1px rgba(62,155,255,.3)}
.lnk{border:none;background:none;color:var(--tx4);font-size:13.5px;font-weight:600;cursor:pointer;
  padding:7px 11px;border-radius:9px;text-decoration:none;white-space:nowrap;
  transition:color .18s var(--ease),background .18s var(--ease)}
.lnk:hover{color:var(--tx2);background:rgba(127,135,148,.12)}
.lnk.on{color:var(--tx)}
.gsp{flex:1}
.gsearch{position:relative;width:min(230px,32vw)}
.gsearch input{width:100%;height:34px;border:1px solid var(--edge);border-radius:10px;
  background:var(--surf);padding:0 12px 0 32px;font-size:13px;color:var(--tx2);outline:none;
  transition:border-color .18s var(--ease)}
.gsearch input:focus{border-color:var(--sap2);box-shadow:0 0 0 3px rgba(62,155,255,.15)}
.gsearch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;
  font-size:12px;pointer-events:none;color:var(--tx4)}
.pill{position:relative}
.pill select{appearance:none;border:1px solid var(--edge);background:var(--surf);border-radius:10px;
  height:34px;padding:0 30px 0 12px;font-size:13px;font-weight:700;color:var(--tx2);cursor:pointer;outline:none}
.pill::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;pointer-events:none;
  border-right:1.5px solid var(--tx4);border-bottom:1.5px solid var(--tx4);transform:translateY(-70%) rotate(45deg)}

.page{max-width:1060px;margin:0 auto;padding:0 clamp(14px,3vw,28px) 120px}

/* ── 히어로 ── */
.hero{padding:clamp(56px,9vh,92px) 0 clamp(34px,5vh,52px);text-align:center;position:relative}
.hero::before{content:"";position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);
  width:min(760px,120%);height:360px;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(21,82,214,.28) 0%,rgba(10,42,110,.13) 42%,transparent 72%);
  animation:breathe 11s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.09)}}
.hero .eyebrow{font-family:var(--m);font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--sap2);text-transform:uppercase}
.hero h1{font-size:clamp(36px,7vw,74px);line-height:1.06;letter-spacing:-.045em;margin:14px 0 16px;font-weight:800;
  background:var(--crystal);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{font-size:clamp(16px,2.2vw,19px);color:var(--tx3);max-width:60ch;margin:0 auto;line-height:1.6;word-break:keep-all}
.hero .stats{margin-top:var(--sp-6);display:flex;gap:clamp(22px,4vw,42px);justify-content:center;flex-wrap:wrap}
.hero .stats b{display:block;font-family:var(--m);font-size:23px;color:var(--tx);font-weight:700;letter-spacing:-.02em}
.hero .stats span{font-size:11px;letter-spacing:.06em;color:var(--tx4)}

/* ── 장 카드 ── */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:16px;margin-top:var(--sp-5)}
.chcard{position:relative;background:var(--surf);border:1px solid var(--edge);border-radius:20px;
  padding:24px 24px 20px;cursor:pointer;overflow:hidden;text-align:left;width:100%;color:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease)}
.chcard::before{content:"";position:absolute;inset:0;background:var(--glass);pointer-events:none}
.chcard:hover:not(.soon){transform:translateY(-4px);border-color:rgba(62,155,255,.45);
  box-shadow:0 0 0 1px rgba(62,155,255,.35),0 8px 40px -8px rgba(21,82,214,.55)}
.chcard .no{font-family:var(--m);font-size:11px;font-weight:700;color:var(--tx5);letter-spacing:.1em}
.chcard h3{margin:7px 0 8px;font-size:20px;letter-spacing:-.025em;line-height:1.3;color:var(--tx);word-break:keep-all}
.chcard p{margin:0;color:var(--tx4);font-size:13.5px;line-height:1.6;min-height:42px;word-break:keep-all}
.chcard .meta{display:flex;align-items:center;gap:11px;margin-top:16px;font-size:12px;color:var(--tx5)}
.chcard .go{margin-left:auto;color:var(--sap2);font-weight:700;font-size:13px}
.gbtn{display:inline-flex;align-items:center;gap:7px;padding:13px 24px;border-radius:99px;
  background:var(--grad);color:#fff;font-size:14.5px;font-weight:700;text-decoration:none;
  box-shadow:0 10px 30px -14px rgba(21,82,214,.95);transition:transform .2s var(--ease)}
.gbtn:hover{transform:translateY(-1px);color:#fff}
.chcard.soon{opacity:.5;cursor:default}
.chcard.lock{opacity:.62}
.secrow.lock .tt{color:var(--tx4)}
.secrow.lock .dot{border-style:dashed;font-size:12px}
.freeband{max-width:760px;margin:0 auto 26px;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.65;color:var(--tx3);background:var(--surf2);border:1px dashed var(--lift);text-align:center;word-break:keep-all}
.freeband b{color:var(--tx)} .freeband a{color:var(--sap2);font-weight:700;text-decoration:none;white-space:nowrap}
.lockbox a.gbtn{display:inline-block;margin-top:6px}
.ring{width:34px;height:34px;flex:none}
.ring circle{fill:none;stroke-width:3.2}
.ring .tr{stroke:var(--edge)}
.ring .pr{stroke:var(--sap2);stroke-linecap:round;transition:stroke-dashoffset .7s var(--ease)}
.ring text{font-family:var(--m);font-size:9.5px;font-weight:700;fill:var(--tx4)}

/* ── 장 페이지 ── */
.chhead{padding:clamp(44px,7vh,70px) 0 6px}
.crumb{font-size:13px;color:var(--tx5);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--sap2);cursor:pointer}
.crumb a:hover{text-decoration:underline}
.chhead h1{font-size:clamp(28px,5vw,46px);letter-spacing:-.035em;margin:12px 0 10px;line-height:1.14;
  background:var(--crystal);-webkit-background-clip:text;background-clip:text;color:transparent}
.chhead p{color:var(--tx3);font-size:16.5px;max-width:64ch;margin:0;word-break:keep-all}
.seclist{margin-top:var(--sp-6);border-top:1px solid var(--edge)}
.secrow{display:flex;align-items:center;gap:15px;padding:19px 6px;border-bottom:1px solid var(--edge);
  cursor:pointer;transition:background .18s var(--ease);width:100%;text-align:left;
  background:none;border-left:0;border-right:0;border-top:0;color:inherit}
.secrow:hover{background:rgba(127,135,148,.07)}
.secrow .dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--edge);display:grid;
  place-items:center;font-size:12px;color:#fff;flex:none;
  transition:background .25s var(--ease),border-color .25s var(--ease)}
.secrow.done .dot{background:var(--ok);border-color:transparent}
.secrow .tt{font-size:16.5px;font-weight:700;letter-spacing:-.018em;color:var(--tx);word-break:keep-all}
.secrow .ds{font-size:13px;color:var(--tx5);margin-top:2px}
.secrow .arr{margin-left:auto;color:var(--tx5);font-size:18px}

/* ── 리더 ── */
.readhead{padding:clamp(40px,6vh,62px) 0 6px;border-bottom:1px solid var(--edge);margin-bottom:var(--sp-6)}
.readhead .kicker{font-family:var(--m);font-size:11.5px;font-weight:700;color:var(--sap2);letter-spacing:.1em}
.readhead h1{font-size:clamp(28px,5vw,46px);letter-spacing:-.04em;line-height:1.13;margin:12px 0 12px;
  background:var(--crystal);-webkit-background-clip:text;background-clip:text;color:transparent}
.readhead .lead{font-size:18px;color:var(--tx3);line-height:1.62;max-width:66ch;margin:0 0 20px;word-break:keep-all}
.readhead .rmeta{display:flex;gap:16px;color:var(--tx5);font-size:12.5px;padding-bottom:18px;flex-wrap:wrap}

.doc{max-width:68ch;margin:0 auto}
.doc h2{font-size:24px;letter-spacing:-.028em;margin:var(--sp-8) 0 14px;line-height:1.28;color:var(--tx)}
.doc h2 .hno{font-family:var(--m);color:var(--tx5);font-weight:700;margin-right:9px;font-size:17px}
.doc h3{font-size:18.5px;letter-spacing:-.02em;margin:var(--sp-6) 0 8px;color:var(--tx)}
.doc p{margin:14px 0;color:var(--tx2);font-size:16.5px;word-break:keep-all}
.doc ul,.doc ol{margin:12px 0;padding-left:22px;color:var(--tx2);font-size:16px}
.doc li{margin:7px 0;word-break:keep-all}
.doc b{color:var(--tx);font-weight:700}
.kw{background:linear-gradient(transparent 62%,rgba(62,155,255,.28) 62%);font-weight:700;padding:0 1px;color:var(--tx)}
.tm{font-style:normal;font-weight:700;color:var(--sap2);cursor:pointer;
  border-bottom:1.5px dashed rgba(62,155,255,.45);
  transition:background .16s var(--ease),border-color .16s var(--ease)}
.tm:hover{background:rgba(21,82,214,.12);border-bottom-style:solid}

.doc table{width:100%;border-collapse:separate;border-spacing:0;margin:20px 0;font-size:14.5px;
  border:1px solid var(--edge);border-radius:14px;overflow:hidden}
.doc th{background:var(--surf2);font-weight:700;text-align:left;padding:11px 13px;
  border-bottom:1px solid var(--edge);font-size:12.5px;color:var(--tx4);letter-spacing:.03em}
.doc td{padding:11px 13px;border-bottom:1px solid var(--edge);vertical-align:top;line-height:1.62;color:var(--tx2)}
.doc tr:last-child td{border-bottom:none}

/* ── 조문 인용 ── */
.law{margin:20px 0;padding:16px 18px;border-left:3px solid var(--sap2);background:var(--surf2);
  border-radius:0 12px 12px 0;font-size:15.5px;line-height:1.75;color:var(--tx2)}
.law .no{display:block;font-family:var(--m);font-size:11.5px;font-weight:700;color:var(--sap2);
  letter-spacing:.06em;margin-bottom:6px}
.law p{margin:6px 0;font-size:15.5px}

/* ── 학습 박스 ── */
.bx{position:relative;border-radius:16px;padding:19px 21px;margin:22px 0;cursor:pointer;
  border:1px solid var(--edge);background:var(--surf);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease)}
.bx:hover{transform:translateY(-2px);border-color:var(--lift);
  box-shadow:0 2px 8px rgba(0,0,0,.4),0 16px 44px -20px rgba(0,0,0,.8)}
.bx h5{margin:0 0 8px;font-family:var(--m);font-size:11.5px;font-weight:800;letter-spacing:.08em;
  display:flex;align-items:center;gap:8px}
.bx h5 .bdg{font-size:10px;padding:2.5px 8px;border-radius:99px;color:#fff;letter-spacing:.04em;font-weight:700}
.bx .bx-s{font-size:15.5px;line-height:1.72;color:var(--tx2)}
.bx .bx-s ul,.bx .bx-s ol{margin:6px 0;padding-left:19px}
.bx .bx-s li{margin:5px 0}
.bx .bx-s table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
.bx .bx-s th,.bx .bx-s td{border-bottom:1px solid var(--edge);padding:7px 8px;text-align:left;vertical-align:top}
.bx .more{position:absolute;top:17px;right:18px;font-size:12px;color:var(--tx5);font-weight:700}
.bx .more:after{content:" ›"}
.bx:hover .more{color:var(--sap2)}
.bx .bx-d{display:none}
.bx.c{border-color:rgba(62,155,255,.28)}  .bx.c h5{color:var(--sap2)}  .bx.c .bdg{background:var(--sap)}
.bx.e{border-color:rgba(75,192,200,.28)}  .bx.e h5{color:var(--teal)}  .bx.e .bdg{background:var(--teal)}
.bx.t{border-color:rgba(224,87,79,.30)}   .bx.t h5{color:var(--bad)}   .bx.t .bdg{background:var(--bad)}
.bx.i{border-color:rgba(201,144,58,.28)}  .bx.i h5{color:var(--warn)}  .bx.i .bdg{background:var(--warn)}
.bx.d{border-color:rgba(155,140,255,.28)} .bx.d h5{color:var(--violet)}.bx.d .bdg{background:var(--violet)}
.mn{display:inline-block;background:var(--tx);color:var(--bg);font-weight:800;border-radius:8px;
  padding:2px 10px;font-size:13px;letter-spacing:.04em}

/* ── 암기 카드 ── */
.exqwrap{margin:var(--sp-8) 0 8px}
.exqwrap h2{font-size:23px;margin-bottom:4px;letter-spacing:-.025em;color:var(--tx)}
.exqwrap .hint{color:var(--tx5);font-size:13px;margin:0 0 14px}
.exq{list-style:none;display:grid;gap:8px}
.exq a{display:flex;gap:12px;align-items:flex-start;text-decoration:none;padding:12px 14px;
  border:1px solid var(--edge);border-radius:12px;background:var(--surf2);transition:.18s var(--ease)}
.exq a:hover{border-color:var(--sap2);transform:translateY(-1px)}
.exq .rn{flex:0 0 auto;font-family:var(--m);font-size:11.5px;font-weight:800;color:var(--sap2);
  padding-top:2px;letter-spacing:.02em;white-space:nowrap}
.exq .qt{font-size:14.5px;color:var(--tx2);line-height:1.6}
@media(max-width:560px){.exq a{flex-direction:column;gap:5px}}
.fcwrap{margin:var(--sp-8) 0 8px}
.fcwrap h2{font-size:23px;margin-bottom:4px;letter-spacing:-.025em;color:var(--tx)}
.fcwrap .hint{color:var(--tx5);font-size:13px;margin:0 0 16px}
.fcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:13px}
.fc{perspective:1000px;height:158px;cursor:pointer;border:0;background:none;padding:0}
.fc-in{position:relative;width:100%;height:100%;transition:transform .58s var(--ease);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:16px 18px;font-size:14.5px;line-height:1.55;border:1px solid var(--edge);word-break:keep-all;overflow:auto}
.fc-f{background:var(--surf2);color:var(--tx);font-weight:700}
.fc-f .q{font-family:var(--m);font-size:10px;display:block;color:var(--tx5);font-weight:700;letter-spacing:.1em;margin-bottom:8px}
.fc-b{background:var(--surf);color:var(--tx2);transform:rotateY(180deg);font-weight:500}
.fc-b b{color:var(--sap2)}

/* ── 리더 하단 ── */
.rnav{position:sticky;bottom:16px;margin-top:var(--sp-8);display:flex;gap:9px;align-items:center;
  background:rgba(10,10,12,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border:1px solid var(--edge);border-radius:var(--rp);padding:8px 10px;max-width:68ch;
  margin-left:auto;margin-right:auto;box-shadow:0 12px 40px -16px rgba(0,0,0,.9)}
.rnav button{border:none;background:none;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--sap2);
  padding:9px 15px;border-radius:var(--rp);transition:background .18s var(--ease);white-space:nowrap;min-height:40px}
.rnav button:hover:not(:disabled){background:rgba(21,82,214,.14)}
.rnav button:disabled{color:var(--tx5);cursor:default}
.rnav .read,.rnav .read:hover:not(:disabled){color:#fff;background:var(--grad);
  box-shadow:0 0 0 1px rgba(62,155,255,.3)}
.rnav .read.ok,.rnav .read.ok:hover:not(:disabled){background:var(--ok);color:#fff;box-shadow:none}
.rnav .mid{flex:1;text-align:center;font-family:var(--m);font-size:11.5px;color:var(--tx5);font-weight:600}

/* ── 용어사전 · 검색 ── */
.glhead{padding:clamp(44px,7vh,70px) 0 18px}
.glhead h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.035em;margin:8px 0;
  background:var(--crystal);-webkit-background-clip:text;background-clip:text;color:transparent}
.glhead p{color:var(--tx3);margin:0;font-size:16.5px;word-break:keep-all}
.glgroup{margin-top:var(--sp-5)}
.glgroup h4{font-family:var(--m);font-size:12px;color:var(--sap2);letter-spacing:.1em;margin:0 0 8px;font-weight:800}
.glrow{border-top:1px solid var(--edge);padding:15px 4px}
.glrow b{display:block;font-size:16px;color:var(--tx);letter-spacing:-.015em}
.glrow span{display:block;font-size:14.5px;color:var(--tx3);margin-top:3px;word-break:keep-all}
.glrow .src{font-family:var(--m);font-size:11px;color:var(--tx5);margin-top:5px}
.glrow.hit{cursor:pointer;transition:background .16s var(--ease)}
.glrow.hit:hover{background:rgba(127,135,148,.07)}
.empty{text-align:center;padding:var(--sp-8) var(--sp-4);color:var(--tx4)}
.empty h2{font-size:19px;font-weight:800;letter-spacing:-.025em;color:var(--tx2);margin-bottom:8px}

<script>
const FREE = {"BOOK": {"보험업법": {"desc": "조문 하나하나를 근거로 짚어 갑니다.", "chapters": [{"title": "총칙", "blurb": "법의 목적과 정의 조항 — 이후 조문이 사용하는 용어의 기준", "sections": [{"title": "보험업법의 목적과 규율 대상", "desc": "제1조 목적과 제2조 정의의 구조", "minutes": 13, "src": "보험업법 제1조·제2조", "lead": "보험업법은 보험업의 진입·조직·판매·자산운용·감독을 규율하는 공법이다. 제1장 총칙은 이 법의 목적(제1조)과 20개 호의 정의(제2조)로 구성된다. 정의 조항은 제45회·제47회·제49회 1차 시험에 직접 출제되었고, 뒤에 나오는 자산운용 한도와 자회사 규제가 모두 이 조항의 용어를 그대로 사용한다.", "html": "\n<h2><span class=\"hno\">01</span>법의 목적</h2>\n<p>보험업법 제1조는 이 법의 목적을 두 가지로 정한다. 첫째는 보험업을 경영하는 자의 <b>건전한 경영</b>을 도모하는 것이고, 둘째는 보험계약자·피보험자, 그 밖의 이해관계인의 <b>권익을 보호</b>하는 것이다. 이 두 가지를 통하여 보험업의 건전한 육성과 국민경제의 균형 있는 발전에 기여함을 최종 목표로 한다.</p>\n<p>따라서 보험업법의 개별 조문은 <span class=\"kw\">건전성 규제</span>와 <span class=\"kw\">소비자 보호</span> 중 어느 하나에 속한다. 허가, 자본금, 자산운용 한도, 재무제표 제출, 검사와 제재는 전자에 속하고, 모집 규제, 설명의무, 기초서류 신고, 손해사정 절차는 후자에 속한다.</p>\n\n<div class=\"bx c\"><h5><span class=\"bdg\">개념</span>두 규제 목적의 관계</h5>\n  <div class=\"bx-s\"><ul>\n    <li><b>건전성 규제</b> — 허가, 자본금·기금, 자산운용 한도, 재무건전성, 검사·제재</li>\n    <li><b>소비자 보호</b> — 모집 규제, 설명의무, 기초서류 신고, 손해사정 절차</li>\n  </ul></div>\n  <div class=\"bx-d\"><p>두 목적은 충돌하는 경우가 있다. 건전성을 강화하면 상품 공급이 제한되고, 보험금 지급을 확대하면 보험회사의 재무구조가 약화된다. 보험업법이 정한 자본금 300억원, 자회사 소유 기준 15퍼센트, 자산운용 비율 한도는 두 목적의 균형점을 입법자가 수치로 정한 결과이다.</p>\n  <p>시험에서는 이 균형이 <b>원칙과 예외</b>의 형식으로 출제된다. 겸영 금지(제10조)는 원칙이고, 그 단서의 세 가지 예외가 실제 출제 지점이다.</p></div></div>\n\n<h2><span class=\"hno\">02</span>규율 대상 — 보험업과 보험회사</h2>\n<p><i class=\"tm\">보험업</i>이란 보험상품의 취급과 관련하여 발생하는 보험의 인수, 보험료 수수 및 보험금 지급 등을 <b>영업으로</b> 하는 것을 말한다(제2조 제2호). 요건은 세 가지이다. ① 보험상품을 취급할 것, ② 인수·보험료 수수·보험금 지급의 행위를 할 것, ③ 이를 <b>영업으로</b> 할 것이다. 일회적으로 위험을 인수하는 행위는 영업성이 없으므로 보험업에 해당하지 않는다.</p>\n<p>보험업을 경영할 수 있는 회사의 형태는 세 가지로 한정된다. <b>주식회사</b>, <i class=\"tm\">상호회사</i>, <b>외국보험회사국내지점</b>이다. 상호회사는 보험계약자가 곧 사원이 되는 회사이므로 주식회사와 조직 원리가 다르고, 설립·정관·기관·계산에 관하여 제34조 이하에 별도의 규정을 둔다.</p>\n\n<div class=\"bx t\"><h5><span class=\"bdg\">함정</span>상호회사의 사원은 피용자가 아니다</h5>\n  <div class=\"bx-s\">상호회사의 <b>사원</b>은 회사에 고용된 직원이 아니라 회사의 구성원인 보험계약자를 말한다. 사원은 보험료를 납입할 의무를 부담할 뿐이고 회사 채권자에 대하여 직접 책임을 지지 않는다. “상호회사의 사원은 회사의 채권자에 대하여 직접적인 의무를 부담하지 아니한다”는 지문은 옳다.</div></div>\n\n<h2><span class=\"hno\">03</span>정의 조항의 구조</h2>\n<p>제2조는 제1호부터 제20호까지 20개의 정의를 둔다. 호의 순서대로 암기하는 방법은 효율이 낮다. 규율 대상에 따라 다음 네 묶음으로 나누어 정리한다.</p>\n<table><thead><tr><th>묶음</th><th>해당 호</th><th>주요 용어</th></tr></thead><tbody>\n<tr><td>상품과 업</td><td>제1호~제5호</td><td>보험상품, 보험업, 생명보험업, 손해보험업, 제3보험업</td></tr>\n<tr><td>사업자</td><td>제6호~제8호</td><td>보험회사, 상호회사, 외국보험회사</td></tr>\n<tr><td>모집조직</td><td>제9호~제12호</td><td>보험설계사, 보험대리점, 보험중개사, 모집</td></tr>\n<tr><td>규제의 계량 기준</td><td>제13호~제20호</td><td>신용공여, 총자산, 자기자본, 동일차주, 대주주, 자회사, 전문·일반보험계약자</td></tr>\n</tbody></table>\n<p>네 번째 묶음이 특히 중요하다. 자산운용 한도를 정한 제106조는 ‘동일차주’, ‘총자산’, ‘자기자본’이라는 정의 조항의 용어를 그대로 사용한다. 용어의 범위를 모르면 한도 수치를 암기하여도 문제를 풀 수 없다.</p>\n\n<div class=\"bx t\"><h5><span class=\"bdg\">함정</span>보험회사는 허가를 받은 자에 한한다</h5>\n  <div class=\"bx-s\">제2조 제6호의 <b>보험회사</b>는 “제4조에 따른 허가를 받아 보험업을 경영하는 자”를 말한다. 허가 없이 보험업을 하는 자는 보험회사가 아니며, 제3조·제200조 위반으로 처벌 대상이 될 뿐이다. “무허가 영업자도 보험업법상 보험회사에 해당한다”는 지문은 틀렸다.</div>\n  <div class=\"bx-d\"><p>제3조는 누구든지 보험회사가 아닌 자와 보험계약을 체결하거나 그 계약의 체결을 중개·대리하지 못하도록 하되, 대통령령으로 정하는 경우를 예외로 한다. 국내에 지점을 두지 아니한 외국보험회사와 체결하는 생명보험계약, 수출적하보험계약, 수입적하보험계약, 항공보험계약, 여행보험계약, 선박보험계약, 장기상해보험계약, 재보험계약이 이에 해당한다.</p></div></div>\n\n<div class=\"bx i\"><h5><span class=\"bdg\">참고</span>보험업법과 인접 법률의 구별</h5>\n  <div class=\"bx-s\"><ul>\n    <li><b>상법 제4편(보험)</b> — 보험자와 보험계약자 사이의 <b>사법 관계</b>를 규율한다. 계약의 성립, 고지의무, 보험금청구권이 그 대상이다.</li>\n    <li><b>보험업법</b> — 국가와 보험회사 사이의 <b>공법 관계</b>를 규율한다. 진입 규제와 감독이 그 대상이다.</li>\n    <li><b>금융소비자보호법</b> — 2021년 시행. 설명의무, 적합성 원칙, 부당권유 금지 등 판매 규제의 상당 부분이 보험업법에서 이 법으로 이관되었다.</li>\n  </ul></div>\n  <div class=\"bx-d\"><p>같은 사실관계라도 근거 법률에 따라 효과가 달라진다. 설명의무 위반의 경우 상법 제638조의3 제2항에 따르면 보험계약자는 계약이 성립한 날부터 <b>3개월</b> 이내에 계약을 취소할 수 있고, 금융소비자보호법에 따르면 위법계약해지권, 과징금, 손해배상에서의 입증책임 전환이 문제된다. 지문의 근거 법률을 먼저 확인하여야 한다.</p></div></div>\n\n<h2><span class=\"hno\">04</span>진입과 감독의 개관</h2>\n<p>보험업을 경영하려는 자는 <b>보험종목별로</b> 금융위원회의 <i class=\"tm\">허가</i>를 받아야 한다(제4조 제1항). 인가가 아니라 허가이며, 허가의 단위는 회사가 아니라 종목이다. 자동차보험 허가를 받은 회사가 화재보험을 취급하려면 그 종목에 관하여 다시 허가를 받아야 한다.</p>\n<p>허가를 받은 보험회사는 금융위원회와 금융감독원의 감독을 받는다. 재무제표 제출, 검사, 제재, 허가의 취소에 관한 규정은 제6장에 있다. 법 전체의 순서는 <b>총칙 → 허가 → 회사 → 모집 → 자산운용 → 계산·감독 → 손해사정</b>이며, 이는 보험회사의 설립부터 보험금 지급까지의 순서와 일치한다.</p>\n\n<div class=\"bx e\"><h5><span class=\"bdg\">기출</span>총칙에서 출제된 문항</h5>\n  <div class=\"bx-s\"><ul>\n    <li><b>제49회 보험업법 1번</b> — 용어의 정의 중 옳지 않은 것. 자회사의 지분 기준을 100분의 15에서 100분의 10으로 바꾸어 출제하였다.</li>\n    <li><b>제47회 보험업법 2번</b> — 용어의 정의 종합.</li>\n    <li><b>제48회 보험업법 1번</b> — 보험회사가 아닌 자와 보험계약을 체결할 수 있는 경우(제3조 단서).</li>\n  </ul></div>\n  <div class=\"bx-d\"><p>세 문항 모두 조문의 <b>숫자와 열거 항목</b>을 변형하여 오답을 구성하였다. 정의 조항은 문장 전체를 암기하기보다 각 호의 숫자(15퍼센트, 10퍼센트), 열거된 자의 범위, 괄호 안의 제외 규정을 확인하는 방식으로 정리한다.</p></div></div>\n\n<div class=\"law\"><span class=\"no\">보험업법 제1조 (목적)</span>\n<p>이 법은 보험업을 경영하는 자의 건전한 경영을 도모하고 보험계약자, 피보험자, 그 밖의 이해관계인의 권익을 보호함으로써 보험업의 건전한 육성과 국민경제의 균형 있는 발전에 기여함을 목적으로 한다.</p></div>\n\n<p>제1조는 두 개의 수단과 두 개의 목표로 구성된다. 수단은 <b>보험업을 경영하는 자의 건전한 경영</b>과 <b>보험계약자 등의 권익 보호</b>이고, 목표는 <b>보험업의 건전한 육성</b>과 <b>국민경제의 균형 있는 발전</b>이다. 앞의 수단은 보험회사를, 뒤의 수단은 계약자를 대상으로 한다. 목적 조항 자체를 묻는 문항은 많지 않으나 개별 조문의 취지를 묻는 문항은 매년 출제되므로, 이 구조를 판단의 기준으로 삼는다.</p>\n\n<h2><span class=\"hno\">04</span>제2조 정의 — 20개 호의 구성</h2>\n<p>제2조는 제1호부터 제20호까지 정의를 늘어놓는다. 순서대로 외우면 반드시 흐트러진다. 대신 아래 표처럼 <b>네 묶음</b>으로 잘라 두면 지문에서 어느 호를 건드리는지 즉시 보인다.</p>\n\n<table><thead><tr><th>묶음</th><th>호</th><th>핵심 낱말</th></tr></thead><tbody>\n<tr><td><b>무엇을</b> — 상품과 업</td><td>제1호~제5호</td><td>보험상품 · 보험업 · 생명보험업 · 손해보험업 · 제3보험업</td></tr>\n<tr><td><b>누가</b> — 사업자</td><td>제6호~제8호</td><td>보험회사 · 상호회사 · 외국보험회사</td></tr>\n<tr><td><b>누가 파는가</b> — 모집조직</td><td>제9호~제12호</td><td>보험설계사 · 보험대리점 · 보험중개사 · 모집</td></tr>\n<tr><td><b>얼마나</b> — 규제 계량어</td><td>제13호~제20호</td><td>신용공여 · 총자산 · 자기자본 · 동일차주 · 대주주 · 자회사 · 전문/일반보험계약자</td></tr>\n</tbody></table>\n\n<p>네 번째 묶음이 특히 중요하다. 제4장 자산운용의 한도 조문(제106조)은 이 호들의 낱말을 그대로 가져다 쓴다. “동일차주”가 무엇인지 모르면 12%라는 숫자를 외워도 문제를 못 푼다. 정의 조항은 나중에 쓸 <b>계량 단위</b>를 미리 만들어 두는 장치다.</p>\n\n<div class=\"bx t\"><h5><span class=\"bdg\">함정</span>‘보험회사’와 ‘보험업을 경영하는 자’</h5>\n  <div class=\"bx-s\">제2조 제6호의 <b>보험회사</b>는 “제4조에 따른 허가를 받아 보험업을 경영하는 자”다. 즉 <b>허가를 받은</b> 자만 보험회사다. 무허가로 보험업을 하는 자는 보험회사가 아니라 제3조·제200조 위반의 처벌 대상일 뿐이다. 지문이 “무허가 영업자도 보험업법상 보험회사에 해당한다”라고 하면 틀린 문장이다.</div>\n  <div class=\"bx-d\"><p>이 구분은 실무에서도 그대로 적용된다. 유사수신·유사보험 사업자를 단속할 때 감독당국은 그를 보험회사로 취급해 감독하는 것이 아니라, 애초에 <b>보험업을 할 자격이 없는 자</b>로 보고 형사 절차로 넘긴다. 감독의 대상과 처벌의 대상이 서로 다른 절차에 놓인다는 점에 유의한다.</p>\n  <p>또 하나. 제3조는 “누구든지 보험회사가 아닌 자와 보험계약을 체결하거나 중개 또는 대리하지 못한다”고 정하되, 대통령령으로 정하는 경우를 예외로 둔다. 국내에 지점 없는 외국보험회사와의 계약 중 생명보험·수출적하·수입적하·항공·여행·선박·장기상해·재보험 등이 그 예외다.</p></div></div>\n\n<div class=\"bx i\"><h5><span class=\"bdg\">참고</span>보험업법과 이웃 법률의 경계</h5>\n  <div class=\"bx-s\"><ul>\n    <li><b>상법 제4편</b> — 보험회사와 계약자 사이의 <b>사법(私法)</b> 관계. 계약이 언제 성립하고 누가 무엇을 청구하는가.</li>\n    <li><b>보험업법</b> — 국가와 보험회사 사이의 <b>공법(公法)</b> 관계. 누가 영업해도 되고 어떻게 감독하는가.</li>\n    <li><b>금융소비자보호법</b> — 2021년 시행. 설명의무·적합성·부당권유 금지 등 <b>판매 규제</b>가 보험업법에서 이 법으로 상당 부분 옮겨 갔다.</li>\n  </ul></div>\n  <div class=\"bx-d\"><p>같은 사실관계라도 어느 법으로 묻느냐에 따라 답이 달라진다. 설명의무 위반의 경우 상법 제638조의3에 따르면 계약이 성립한 날부터 3개월 이내에 취소할 수 있고, 금융소비자보호법에 따르면 위법계약해지권, 과징금, 손해배상에서의 입증책임 전환이 문제된다. 지문의 <b>근거 법률</b>을 먼저 확인하여야 한다.</p></div></div>\n", "cards": [["보험업법 제1조가 정한 두 가지 규제 목적은?", "<b>건전성 규제</b>와 <b>소비자 보호</b>"], ["보험업 정의의 세 요건은?", "보험상품 취급 · 인수·보험료 수수·보험금 지급 · <b>영업으로</b> 할 것"], ["보험업을 경영할 수 있는 회사 형태는?", "주식회사 · <b>상호회사</b> · 외국보험회사국내지점"], ["보험업 진입은 허가인가 인가인가?", "<b>허가</b>이며, 보험종목별로 금융위원회의 허가를 받는다(제4조 제1항)"], ["보험업법상 자회사의 지분 기준은?", "의결권 있는 발행주식 총수의 <b>100분의 15 초과</b>(제2조 제18호)"], ["보험업법 제1조가 말하는 최종 목표 두 가지는?", "보험업의 건전한 <b>육성</b>과 <b>국민경제</b>의 균형 있는 발전"], ["제2조 정의 조항을 네 묶음으로 나누면?", "상품·업 / 사업자 / 모집조직 / <b>규제 계량어</b>(신용공여·총자산·자기자본·동일차주·대주주·자회사)"], ["보험업법상 ‘보험회사’의 정의에 반드시 들어가는 요건은?", "제4조에 따른 <b>허가를 받아</b> 보험업을 경영할 것"], ["설명의무 위반의 효과를 상법으로 물으면?", "계약이 성립한 날부터 <b>3개월</b> 이내 계약 취소(상법 제638조의3 제2항)"]], "exq": [[47, "보험업법", 2, "보험업법상 용어의 정의에 관한 설명으로 옳지 않은 것은 ?"], [48, "보험업법", 1, "보험업법상 보험회사가 아닌 자와 보험계약을 체결할 수 있는 경우를 모두 고른 것은? 가. 외국보험회사와 생명보험계약, 수출적하"], [48, "보험업법", 36, "보험업법상 손해보험계약의 제3자 보호에 관한 설명으로 옳지 않은 것은?"], [49, "보험업법", 1, "보험업법상 용어의 정의에 관한 설명으로 옳지 않은 것은?"], [49, "보험업법", 19, "보험업법상 보험계약의 체결 또는 모집에 대한 금지행위에 관한 설명으로 옳지 않은 것은?"]]}, {"title": "보험상품과 보험종목", "desc": "생명보험·손해보험·제3보험의 구분과 허가 단위", "minutes": 11, "src": "보험업법 제2조 제1호·제4조", "lead": "보험상품의 3분류는 정의 조항에 있으나 그 효과는 허가·겸영·자본금 규제 전반에 미친다. 제45회 14번, 제46회 1번, 제47회 8번이 모두 이 구분을 전제로 출제되었다. 상품의 분류(무엇을 보장하는가)와 종목의 분류(어떤 단위로 허가하는가)를 구별하는 것이 이 절의 요점이다.", "html": "\n<h2><span class=\"hno\">01</span>보험상품의 3분류</h2>\n<p>제2조 제1호는 보험상품을 생명보험상품·손해보험상품·제3보험상품으로 구분한다. 세 목의 문장 구조는 동일하고 보장의 대상만 달라진다.</p>\n<table>\n  <tr><th>구분</th><th>보장 대상</th><th>정의(제2조 제1호)</th><th>보상 방식</th></tr>\n  <tr><td>생명보험상품</td><td>사람</td><td>사람의 <b>생존 또는 사망</b>에 관하여 약정한 급여를 지급</td><td>정액</td></tr>\n  <tr><td>손해보험상품</td><td>재물·책임</td><td>우연한 사건으로 발생하는 <b>손해</b>에 관하여 급여를 지급<br>(질병·상해·간병은 제외)</td><td>실손</td></tr>\n  <tr><td>제3보험상품</td><td>사람</td><td>사람의 <b>질병·상해 또는 이에 따른 간병</b>에 관하여 급여를 지급</td><td>정액·실손 병용</td></tr>\n</table>\n<p><i class=\"tm\">제3보험</i>은 보장 대상이 사람이라는 점에서 생명보험과 같고, 실제 발생한 치료비를 보상한다는 점에서 손해보험과 같다. 손해보험상품의 정의에 “다목에 따른 질병·상해 및 간병은 제외한다”는 괄호가 있으므로 제3보험은 손해보험에서 분리된 영역이다. 이 성질 때문에 생명보험회사와 손해보험회사가 모두 제3보험업을 겸영할 수 있다.</p>\n\n<div class=\"bx i\"><h5><span class=\"bdg\">참고</span>보험상품에서 제외되는 것</h5>\n  <div class=\"bx-s\">국민건강보험법에 따른 건강보험, 고용보험법에 따른 고용보험 등 <b>대통령령으로 정하는 것</b>은 보험상품에서 제외된다. 사회보험은 가입이 강제되고 급여의 내용이 법으로 정해져 있어, 사적 자치를 전제로 하는 보험업법의 규율 대상이 아니기 때문이다.</div>\n  <div class=\"bx-d\"><p>손해사정이론에서 민영보험과 사회보험을 비교하는 문항이 반복 출제된다. 그 비교의 법적 근거가 이 제외 규정이다. 두 과목을 함께 정리하면 중복 학습을 피할 수 있다.</p></div></div>\n\n<h2><span class=\"hno\">02</span>보험종목 — 허가의 단위</h2>\n<p>보험상품이 보장 내용에 따른 분류라면 <b>보험종목</b>은 허가를 부여하는 단위에 따른 분류이다. 제4조 제1항이 이를 열거한다.</p>\n<ul>\n  <li><b>생명보험업</b> — 생명보험, 연금보험(퇴직보험 포함), 그 밖에 대통령령으로 정하는 보험종목</li>\n  <li><b>손해보험업</b> — 화재보험, 해상보험(항공·운송보험 포함), 자동차보험, 보증보험, <b>재보험</b>, 그 밖에 대통령령으로 정하는 보험종목</li>\n  <li><b>제3보험업</b> — 상해보험, 질병보험, 간병보험, 그 밖에 대통령령으로 정하는 보험종목</li>\n</ul>\n\n<div class=\"bx t\"><h5><span class=\"bdg\">함정</span>재보험은 손해보험업의 보험종목이다</h5>\n  <div class=\"bx-s\">재보험은 별개의 보험업이 아니라 <b>손해보험업의 보험종목</b> 중 하나로 열거되어 있다(제4조 제1항 제2호). “손해보험업의 보험종목에는 재보험이 포함된다”는 지문은 옳다.</div>\n  <div class=\"bx-d\"><p>다만 겸영 규정(제10조)에서 재보험은 예외의 통로로도 쓰인다. 생명보험회사도 <b>생명보험의 재보험</b>과 <b>제3보험의 재보험</b>은 겸영할 수 있다. 종목으로서의 재보험과 겸영 예외로서의 재보험을 구별한다.</p></div></div>\n\n<h2><span class=\"hno\">03</span>허가의 의제</h2>\n<p>제4조는 세 곳에서 “허가를 받은 것으로 본다”고 규정한다. 방향을 혼동하지 않도록 다음과 같이 정리한다.</p>\n<div class=\"bx c\"><h5><span class=\"bdg\">개념</span>허가 의제 세 가지</h5>\n  <div class=\"bx-s\"><ul>\n    <li><b>제4조 제2항</b> — 보험종목별 허가를 받은 자는 <b>그 종목의 재보험</b>에 관하여 허가를 받은 것으로 본다. 다만 소액단기전문보험회사는 제외한다.</li>\n    <li><b>제4조 제3항</b> — 생명보험업 또는 손해보험업의 <b>보험종목 전부</b>에 관하여 허가를 받은 자는 <b>제3보험업</b>의 허가를 받은 것으로 본다.</li>\n    <li><b>제4조 제4항</b> — 보험종목 전부에 관하여 허가를 받은 자는 그 후 <b>신설되는 보험종목</b>에 관하여 허가를 받은 것으로 본다.</li>\n  </ul></div>\n  <div class=\"bx-d\"><p>세 항이 연속되어 있어 지문에서 항을 바꾸어 출제하기 쉽다. ‘종목별 → 그 종목의 재보험’, ‘전부 → 제3보험업’, ‘전부 → 신설 종목’으로 대응 관계를 고정한다. 제2항 단서의 <b>소액단기전문보험회사 제외</b>를 삭제하고 출제하는 유형이 반복된다.</p></div></div>\n\n<div class=\"bx e\"><h5><span class=\"bdg\">기출</span>보험종목에서 출제된 문항</h5>\n  <div class=\"bx-s\"><ul>\n    <li><b>제45회 보험업법 14번</b> — 연금보험·퇴직보험·보증보험·재보험·상해보험·간병보험 중 손해보험업의 보험종목에 해당하는 개수를 묻는 문항이다. 보증보험과 재보험 2개가 답이다.</li>\n    <li><b>제46회 보험업법 1번</b> — 제3보험의 보험종목에 부가되는 보험으로서 질병사망을 특약 형식으로 담보하는 경우의 요건을 묻는다.</li>\n    <li><b>제46회 손해사정이론 20번</b> — 소액단기전문보험회사가 취급할 수 있는 보험종목의 개수를 묻는다.</li>\n  </ul></div>\n  <div class=\"bx-d\"><p>개수를 묻는 유형은 열거 항목을 모두 판정하여야 하므로 부분 암기로는 정답에 이르지 못한다. 생명보험업·손해보험업·제3보험업의 종목을 표로 만들어 각 항목이 어느 칸에 속하는지 반복 확인한다.</p></div></div>\n\n<div class=\"law\"><span class=\"no\">보험업법 제2조 제1호 (보험상품)</span>\n<p>“보험상품”이란 위험보장을 목적으로 우연한 사건 발생에 관하여 금전 및 그 밖의 급여를 지급할 것을 약정하고 대가를 수수하는 계약(「국민건강보험법」에 따른 건강보험, 「고용보험법」에 따른 고용보험 등 <b>보험계약자의 보호 필요성 및 금융거래 관행 등을 고려하여 대통령령으로 정하는 것은 제외</b>한다)으로서 다음 각 목의 것을 말한다.</p>\n<p>가. <b>생명보험상품</b> — 위험보장을 목적으로 사람의 생존 또는 사망에 관하여 약정한 금전 및 그 밖의 급여를 지급할 것을 약속하고 대가를 수수하는 계약</p>\n<p>나. <b>손해보험상품</b> — 위험보장을 목적으로 우연한 사건(다목에 따른 질병·상해 및 간병은 제외한다)으로 발생하는 손해에 관하여 금전 및 그 밖의 급여를 지급할 것을 약속하고 대가를 수수하는 계약</p>\n<p>다. <b>제3보험상품</b> — 위험보장을 목적으로 사람의 질병·상해 또는 이에 따른 간병에 관하여 금전 및 그 밖의 급여를 지급할 것을 약속하고 대가를 수수하는 계약</p></div>\n\n<p>세 목을 나란히 놓으면 문장 구조가 같다. “위험보장을 목적으로 / <b>무엇에 관하여</b> / 금전 및 그 밖의 급여를 지급할 것을 약속하고 대가를 수수하는 계약.” 달라지는 부분은 보장의 대상뿐이며, 각각 <b>생존·사망</b>, <b>우연한 사건으로 발생하는 손해</b>, <b>질병·상해·간병</b>이다. 손해보험상품의 정의에 “다목에 따른 질병·상해 및 간병은 제외한다”는 괄호가 있으므로, 제3보험은 손해보험에서 분리된 영역이다.</p>\n\n<h2><span class=\"hno\">04</span>보험종목의 전체 목록</h2>\n<p>제4조 제1항은 허가 단위인 보험종목을 열거한다. 이 목록은 그대로 시험 지문이 된다.</p>\n\n<table><thead><tr><th>보험업</th><th>보험종목</th></tr></thead><tbody>\n<tr><td><b>생명보험</b></td><td>생명보험 · 연금보험(퇴직보험 포함) · 그 밖에 대통령령으로 정하는 보험종목</td></tr>\n<tr><td><b>손해보험</b></td><td>화재보험 · 해상보험(항공·운송보험 포함) · 자동차보험 · 보증보험 · 재보험 · 그 밖에 대통령령으로 정하는 보험종목(책임·기술·권리·도난·유리·동물·원자력·비용·날씨보험)</td></tr>\n<tr><td><b>제3보험</b></td><td>상해보험 · 질병보험 · 간병보험 · 그 밖에 대통령령으로 정하는 보험종목</td></tr>\n</tbody></table>\n\n<div class=\"bx t\"><h5><span class=\"bdg\">함정</span>법에 직접 적힌 종목과 대통령령으로 넘긴 종목</h5>\n  <div class=\"bx-s\">손해보험에서 <b>법률 본문에 직접 이름이 적힌 종목은 다섯 개</b>다 — 화재 · 해상(항공·운송 포함) · 자동차 · 보증 · 재보험. 책임보험·기술보험·권리보험 등은 “그 밖에 대통령령으로 정하는 보험종목”에 들어 있다. “보험업법 제4조 제1항이 열거한 손해보험 종목이 아닌 것은?” 유형에서 이 경계를 건드린다.</div>\n  <div class=\"bx-d\"><p>생명보험 쪽은 더 단출하다 — <b>생명보험</b>과 <b>연금보험(퇴직보험 포함)</b> 둘뿐이다. ‘연금보험’ 뒤의 괄호에 퇴직보험이 들어 있다는 점을 놓치면, “퇴직보험은 별도의 보험종목이다”라는 틀린 지문에 걸린다.</p>\n  <p>제3보험은 <b>상해·질병·간병</b> 셋. 이 세 종목을 하나로 묶어 두면 겸영 예외(제10조 제3호)의 ‘제3보험에 부가되는 보험’을 이해할 때에도 도움이 된다.</p></div></div>\n\n<div class=\"bx e\"><h5><span class=\"bdg\">사례</span>어디까지가 보험상품인가</h5>\n  <div class=\"bx-s\"><ul>\n    <li><b>보험상품이다</b> — 실손의료보험, 여행자보험, 반려동물보험(동물보험), 날씨보험(농작물 재해 대비 지수형 상품)</li>\n    <li><b>보험상품이 아니다</b> — 국민건강보험, 고용보험, 산재보험, 국민연금 등 <b>사회보험</b>. 법이 정의 괄호에서 직접 빼 두었다.</li>\n    <li><b>다투어지는 영역</b> — 상조 서비스, 각종 멤버십의 ‘보장’ 서비스. 우연성·대가성·급여지급 약정이라는 세 요소가 다 갖춰지면 무허가 보험업이 될 수 있다.</li>\n  </ul></div>\n  <div class=\"bx-d\"><p>세 번째 줄이 실무의 회색지대다. 금융당국은 (1) 우연한 사고를 요건으로 급여를 주는가 (2) 대가(회비·이용료)를 받는가 (3) 다수로부터 모아 위험을 분산하는가를 본다. 셋이 다 충족되면 이름이 무엇이든 보험업으로 본다. 명칭이 아니라 <b>실질</b>로 판단한다는 원칙이다.</p></div></div>\n", "cards": [["보험상품 정의의 요건은?", "위험보장 목적 + <b>우연한 사건</b> + 급여 지급 약정 + 대가 수수"], ["제3보험이 생·손보 양쪽에서 취급되는 이유는?", "보장 대상은 <b>사람</b>(생명보험과 동일), 보상은 <b>실손</b>(손해보험과 동일)"], ["재보험은 어느 보험업의 종목인가?", "<b>손해보험업</b>의 보험종목(제4조 제1항 제2호)"], ["보험종목 전부 허가 시 의제되는 허가는?", "<b>제3보험업</b>의 허가(제4조 제3항)"], ["보험상품에서 제외되는 것은?", "국민건강보험·고용보험 등 <b>대통령령으로 정하는 것</b>"], ["손해보험상품의 정의에서 괄호로 빠지는 것은?", "다목의 <b>질병·상해 및 간병</b> — 그 영역이 제3보험이다"], ["보험업법 제4조 제1항이 직접 열거한 손해보험 종목 다섯은?", "화재 · 해상(항공·운송 포함) · 자동차 · <b>보증</b> · <b>재보험</b>"], ["법조문상 생명보험의 보험종목 둘은?", "생명보험 · <b>연금보험(퇴직보험 포함)</b>"], ["국민건강보험이 보험상품이 아닌 이유는?", "제2조 제1호 정의 <b>괄호</b>에서 대통령령으로 제외했기 때문"]], "exq": [[45, "손해사정이론", 8, "아래에서 설명하는 보험을 통칭하는 명칭은? - 전통적 손해보험에서 보상하지 않는 리스크를 담 보하는 보험으로 특정한 사건 즉,"], [45, "보험업법", 14, "보험업법상 손해보험업의 보험종목에 해당하는 것은 모두 몇 개인가? 가. 연금보험 나. 퇴직보험 다. 보증보험 라. 재보험 마."], [46, "손해사정이론", 20, "아래에서 보험업법상 소액단기전문보험회사가 취급할 수 있는 보험종목은 모두 몇 개인가? ⓐ 상해보험 ⓑ 질병보험 ⓒ 연금보험 ⓓ"], [47, "보험업법", 8, "보험업법상 보험업 겸영의 제한에 관한 설명으로 옳지 않은 것은? (소액단기전문보험회사는 제외함)"]]}, {"title": "전문보험계약자와 일반보험계약자", "desc": "모집 규제가 적용되는 범위의 구분", "minutes": 8, "src": "보험업법 제2조 제19호·제20호", "lead": "보험업법은 보험계약자를 전문보험계약자와 일반보험계약자로 구분하고 모집 규제를 일반보험계약자에게 집중한다. 구분의 기준은 제2조 제19호·제20호에 있고, 전문보험계약자가 일반보험계약자로 전환되는 요건이 제45회 1번과 제47회 4번에 출제되었다.", "html": "\n<h2><span class=\"hno\">01</span>구분의 기준</h2>\n<p><i class=\"tm\">전문보험계약자</i>란 보험계약에 관한 전문성, 자산규모 등에 비추어 보험계약의 내용을 이해하고 이행할 능력이 있는 자를 말한다(제2조 제19호). <i class=\"tm\">일반보험계약자</i>는 전문보험계약자가 아닌 보험계약자를 말한다(제2조 제20호). 일반보험계약자는 이와 같이 소극적으로 정의된다.</p>\n\n<div class=\"bx c\"><h5><span class=\"bdg\">개념</span>전문보험계약자의 범위(제2조 제19호)</h5>\n  <div class=\"bx-s\"><ul>\n    <li>가. <b>국가</b></li>\n    <li>나. <b>한국은행</b></li>\n    <li>다. 대통령령으로 정하는 <b>금융기관</b></li>\n    <li>라. <b>주권상장법인</b></li>\n    <li>마. 그 밖에 대통령령으로 정하는 자</li>\n  </ul></div>\n  <div class=\"bx-d\"><p>가목부터 마목까지의 구분 자체가 출제 대상이다. 국가와 한국은행은 법률에 직접 규정되어 있고, 지방자치단체는 법률에 없으며 대통령령에 위임되어 있다. 지문은 목록에 없는 자를 추가하거나, 법률에 직접 규정된 자를 “대통령령으로 정하는”으로 바꾸는 방식으로 오답을 구성한다.</p></div></div>\n\n<h2><span class=\"hno\">02</span>구분의 실익</h2>\n<p>설명의무, 적합성 원칙, 통신수단을 이용한 모집의 제한 등 제4장의 모집 규제는 대부분 <b>일반보험계약자</b>를 대상으로 한다. 계약 상대방이 국가나 주권상장법인인 경우에는 정보의 격차가 크지 않으므로 동일한 수준의 보호가 필요하지 않다는 판단에 따른 것이다. 이 구분은 정의 조항에 있으나 실제 효과는 모집 규제에서 발생한다.</p>\n\n<div class=\"bx t\"><h5><span class=\"bdg\">함정</span>계약자 구분과 모집조직 구분의 혼동</h5>\n  <div class=\"bx-s\">전문보험계약자는 보험을 <b>구매하는 쪽</b>의 구분이다. 보험회사·보험대리점·보험중개사와 같은 <b>판매하는 쪽</b>의 구분(제2조 제6호·제10호·제11호)과 혼동하면 지문의 정오가 반대로 판단된다.</div></div>\n\n<h2><span class=\"hno\">03</span>전문에서 일반으로의 전환</h2>\n<p>전문보험계약자 중 <b>대통령령으로 정하는 자</b>가 일반보험계약자와 같은 대우를 받겠다는 의사를 보험회사에 <b>서면으로 통지</b>하는 경우, 보험회사는 <b>정당한 사유가 없으면</b> 이에 동의하여야 한다. 보험회사가 동의한 경우 해당 보험계약자는 일반보험계약자로 본다.</p>\n<p>요건은 ① 대통령령으로 정하는 자일 것, ② 서면 통지, ③ 보험회사의 동의 세 가지이다. 국가·한국은행과 같이 법률에 직접 규정된 자는 전환 대상에서 제외된다. 전환의 방향은 <b>전문 → 일반</b> 한 방향뿐이며, 일반보험계약자가 전문보험계약자로 전환되는 절차는 없다.</p>\n\n<div class=\"bx e\"><h5><span class=\"bdg\">기출</span>전환 규정의 출제 형태</h5>\n  <div class=\"bx-s\"><ul>\n    <li><b>제45회 보험업법 1번</b> — 전문보험계약자 중 보험회사의 동의에 의하여 일반보험계약자로 될 수 <b>없는</b> 자를 고르는 문항이다. 법률에 직접 규정된 자를 찾으면 된다.</li>\n    <li><b>제47회 보험업법 4번</b> — 전환 규정의 괄호를 비워 두고 주체를 묻는 문항이다. “대통령령으로 정하는 자”가 답이다.</li>\n  </ul></div>\n  <div class=\"bx-d\"><p>두 문항 모두 조문의 주체를 정확히 기억하는지를 확인한다. “전문보험계약자”라고만 답하면 오답이 된다. 조문은 전문보험계약자 <b>중 대통령령으로 정하는 자</b>로 범위를 좁히고 있다.</p></div></div>\n\n<div class=\"law\"><span class=\"no\">보험업법 제2조 제19호 (전문보험계약자)</span>\n<p>“전문보험계약자”란 보험계약에 관한 전문성, 자산규모 등에 비추어 보험계약의 내용을 이해하고 이행할 능력이 있는 자로서 다음 각 목의 어느 하나에 해당하는 자를 말한다. 다만, 전문보험계약자 중 대통령령으로 정하는 자가 <b>일반보험계약자와 같은 대우를 받겠다는 의사를 보험회사에 서면으로 통지</b>하는 경우 보험회사는 정당한 사유가 없으면 이에 동의하여야 하며, 보험회사가 동의한 경우에는 해당 보험계약자는 일반보험계약자로 본다.</p>\n<p>가. 국가 &nbsp; 나. 한국은행 &nbsp; 다. 대통령령으로 정하는 금융기관 &nbsp; 라. 주권상장법인 &nbsp; 마. 그 밖에 대통령령으로 정하는 자</p></div>\n\n<p>단서가 조문 전체보다 길다. 그만큼 출제 지점이라는 뜻이다. 순서를 정확히 밟자 — ① 전문보험계약자 중 <b>대통령령으로 정하는 자</b>가 ② <b>서면으로</b> 통지하면 ③ 보험회사는 <b>정당한 사유가 없으면 동의하여야</b> 하고 ④ 동의한 경우에 비로소 일반보험계약자로 <b>본다</b>. 네 단계 중 어느 하나를 바꿔 놓는 것이 함정이다.</p>\n\n<div class=\"bx t\"><h5><span class=\"bdg\">함정</span>세 가지 흔한 뒤틀기</h5>\n  <div class=\"bx-s\"><ul>\n    <li>“<b>모든</b> 전문보험계약자가 전환을 요구할 수 있다” → 틀림. <b>대통령령으로 정하는 자</b>만. 국가·한국은행 등은 전환 대상이 아니다.</li>\n    <li>“구두로 통지해도 된다” → 틀림. <b>서면</b>이다.</li>\n    <li>“통지하면 곧바로 일반보험계약자가 된다” → 틀림. 보험회사의 <b>동의</b>가 있어야 한다. 다만 회사는 정당한 사유 없이 거절하지 못한다.</li>\n  </ul></div>\n  <div class=\"bx-d\"><p>반대 방향의 전환, 즉 일반보험계약자가 전문보험계약자와 같은 대우를 요구하는 제도는 보험업법에 없다. 자본시장법에는 유사한 제도가 있으므로 이를 이용한 지문이 출제된다. 보험업법은 <b>보호를 강화하는 방향의 전환만</b> 인정한다.</p></div></div>\n\n<h2><span class=\"hno\">04</span>구분의 실익 — 규제의 두께가 달라진다</h2>\n<table><thead><tr><th>항목</th><th>일반보험계약자</th><th>전문보험계약자</th></tr></thead><tbody>\n<tr><td>설명의무·적합성 원칙</td><td>적용</td><td>원칙적으로 <b>미적용</b></td></tr>\n<tr><td>보험안내자료 규제</td><td>적용</td><td>완화</td></tr>\n<tr><td>통신판매 시 보호 절차</td><td>적용</td><td>완화</td></tr>\n<tr><td>상법 제663조 불이익변경금지</td><td colspan=\"2\">보험계약자 구분과 <b>무관</b> — 재보험·해상보험 등 기업보험에서만 배제</td></tr>\n</tbody></table>\n\n<p>맨 아랫줄이 중요하다. 상법 제663조의 불이익변경금지는 <b>보험업법의 전문/일반 구분과 다른 축</b>에서 작동한다. 재보험 및 해상보험 기타 이와 유사한 보험에서 배제될 뿐이다. 두 제도를 겹쳐 놓고 “전문보험계약자에게는 제663조가 적용되지 않는다”고 하면 틀린 지문이다.</p>\n\n<div class=\"bx d\"><h5><span class=\"bdg\">심화</span>왜 보호를 나누는가</h5>\n  <div class=\"bx-s\">보호는 공짜가 아니다. 설명·확인·서류 절차는 모두 비용이고, 그 비용은 결국 보험료에 실린다. 스스로 위험을 판단할 수 있는 국가·은행·상장법인에까지 같은 절차를 요구하면 <b>보호의 값만 치르고 보호의 효용은 없다</b>. 그래서 법은 보호가 실제로 필요한 쪽에 자원을 몰아 준다.</div>\n  <div class=\"bx-d\"><p>다만 “전문가라도 실제로는 정보가 부족할 수 있다”는 반론이 있고, 그 반론의 결과물이 바로 <b>전환권</b>이다. 스스로 보호가 필요하다고 판단하는 전문보험계약자는 신청해서 일반보험계약자의 옷을 입을 수 있다. 제도를 이렇게 ‘원칙 + 되돌림 장치’로 읽으면 조문의 단서가 왜 붙었는지 자연스럽게 이해된다.</p></div></div>\n", "cards": [["전문보험계약자로 법률에 직접 규정된 자는?", "국가 · <b>한국은행</b> · 대통령령으로 정하는 금융기관 · 주권상장법인 · 그 밖에 대통령령으로 정하는 자"], ["일반보험계약자의 정의는?", "<b>전문보험계약자가 아닌</b> 보험계약자(제2조 제20호)"], ["전문 → 일반 전환의 요건은?", "대통령령으로 정하는 자일 것 + <b>서면 통지</b> + 보험회사의 <b>동의</b>(정당한 사유 없이 거부 불가)"], ["전환은 양방향으로 가능한가?", "아니다. <b>전문 → 일반</b> 한 방향만 인정된다"], ["전문보험계약자가 일반보험계약자 대우를 받으려면?", "대통령령으로 정하는 자가 <b>서면 통지</b> → 보험회사 <b>동의</b>"], ["보험회사는 그 통지를 거절할 수 있는가?", "<b>정당한 사유가 없으면 동의하여야</b> 한다"], ["일반 → 전문으로의 전환은 보험업법에 있는가?", "<b>없다</b>. 보호를 두껍게 하는 방향의 전환만 있다"], ["상법 제663조가 배제되는 보험은?", "<b>재보험 및 해상보험</b> 기타 이와 유사한 보험 — 전문/일반 구분과는 다른 축"]], "exq": [[45, "보험업법", 1, "보험업법상 전문보험계약자 중 보험회사의 동의에 의하여 일반보험계약자로 될 수 있는 자에 해당하지 않는 것은?"], [47, "보험업법", 4, "보험업법상 다음 보기의 ( ) 에 들어갈 내용으로 옳은 것은 ? 전문보험계약자 중 ( )가(이) 일반보험계약자와 같은 대우를 "], [48, "보험업법", 35, "금융위원회가 공익 또는 건전한 보험거래질서의 확립을 위하여 필요한 경우에 일정한 자를 대상으로 조사를 할 수 있는데, 이에 해"], [49, "보험업법", 18, "보험업법상 설명의무에 관한 설명으로 옳지 않은 것은?"]]}]}, {"title": "보험업의 허가", "blurb": "종목별 허가, 신청 서류, 자본금과 기금, 겸영과 부수업무", "sections": [{"title": "허가의 구조 — 종목별 허가와 예비허가", "desc": "허가의 성질, 단위, 주체, 예비허가", "minutes": 11, "locked": true}, {"title": "허가 신청 — 신청서와 첨부서류", "desc": "기재사항과 첨부서류의 구별", "minutes": 8, "locked": true}, {"title": "자본금과 기금 — 300억원과 그 예외", "desc": "원칙 금액, 종목별 금액, 두 가지 특례", "minutes": 9, "locked": true}, {"title": "겸영과 부수업무", "desc": "겸영 금지의 예외, 겸영업무와 부수업무", "minutes": 10, "locked": true}]}, {"title": "보험회사", "blurb": "주식회사의 자본감소와 조직변경, 상호회사, 외국보험회사국내지점", "sections": [{"title": "주식회사 (1) 자본감소", "desc": "2주 공고, 사전 승인, 1개월 이의", "minutes": 9, "locked": true}, {"title": "주식회사 (2) 조직변경", "desc": "주식회사에서 상호회사로", "minutes": 10, "locked": true}, {"title": "상호회사 (1) 설립", "desc": "정관 기재사항, 창립총회, 기금", "minutes": 9, "locked": true}, {"title": "상호회사 (2) 사원과 기관", "desc": "1인 1의결권, 간접책임, 퇴사와 해산", "minutes": 10, "locked": true}, {"title": "외국보험회사국내지점", "desc": "허가 취소 사유, 보고 의무, 대표자", "minutes": 8, "locked": true}]}, {"title": "모집", "blurb": "모집할 수 있는 자, 보험설계사·대리점·중개사, 모집 규제", "sections": [{"title": "모집할 수 있는 자", "desc": "제83조가 정한 네 부류", "minutes": 8, "locked": true}, {"title": "보험설계사", "desc": "등록, 교차모집, 교육, 제재", "minutes": 10, "lo  "의의와 기능, 비례·비비례, 특약조항", "sections": [{"title": "재보험의 의의와 기능", "desc": "보험자의 보험", "minutes": 7, "locked": true}, {"title": "비례재보험과 비비례재보험", "desc": "무엇을 나누는가", "minutes": 9, "locked": true}, {"title": "재보험 특약조항", "desc": "계약을 굴리는 문구들", "minutes": 8, "locked": true}]}]}}, "TERMS": {"보험상품": {"d": "위험보장을 목적으로 우연한 사건 발생에 관하여 금전 및 그 밖의 급여를 지급할 것을 약정하고 대가를 수수하는 계약.", "more": "생명보험상품·손해보험상품·제3보험상품으로 나뉘며, 국민건강보험·고용보험 등 대통령령으로 정하는 것은 보험상품에서 제외된다.", "src": "보험업법 제2조 제1호"}, "보험업": {"d": "보험상품의 취급과 관련하여 발생하는 보험의 인수, 보험료 수수 및 보험금 지급 등을 영업으로 하는 것.", "more": "생명보험업·손해보험업·제3보험업으로 구분된다. ‘영업으로’라는 말이 붙어 있어 일회적인 위험 인수는 보험업이 아니다.", "src": "보험업법 제2조 제2호"}, "제3보험": {"d": "사람의 질병·상해 또는 이에 따른 간병에 관하여 금전 및 그 밖의 급여를 지급할 것을 약정하는 보험.", "more": "사람에 관한 보험이라는 점에서 생명보험을 닮았고, 실제 손해를 메운다는 점에서 손해보험을 닮았다. 그래서 생·손보 어느 쪽이든 취급할 수 있다.", "src": "보험업법 제2조 제1호 다목"}, "전문보험계약자": {"d": "보험계약에 관한 전문성, 자산규모 등에 비추어 보험계약의 내용을 이해하고 이행할 능력이 있는 자.", "more": "국가, 한국은행, 대통령령으로 정하는 금융기관, 주권상장법인 등이 이에 해당한다. 다만 일부는 보험회사에 서면으로 통지하고 보험회사가 동의하면 일반보험계약자로 대우받을 수 있다.", "src": "보험업법 제2조 제19호"}, "일반보험계약자": {"d": "전문보험계약자가 아닌 보험계약자.", "more": "설명의무·적합성 원칙 등 모집 규제의 보호를 받는 쪽이다. 규제의 두께가 전문보험계약자와 다르다는 점이 실익이다.", "src": "보험업법 제2조 제20호"}, "모집": {"d": "보험계약의 체결을 중개하거나 대리하는 것.", "more": "보험회사가 스스로 보험을 인수하는 행위는 모집이 아니다. 모집을 할 수 있는 자는 법이 한정하고 있다.", "src": "보험업법 제2조 제12호"}, "상호회사": {"d": "보험업을 경영할 목적으로 보험업법에 따라 설립된 회사로서 보험계약자를 사원으로 하는 회사.", "more": "주식회사의 주주에 해당하는 자리에 보험계약자가 앉는다. 그래서 명칭에 ‘상호회사’를 반드시 넣어야 한다(제35조).", "src": "보험업법 제2조 제7호"}, "자회사": {"d": "보험회사가 다른 회사(민법 또는 특별법에 따른 조합을 포함)의 의결권 있는 발행주식(출자지분을 포함) 총수의 100분의 15를 초과하여 소유하는 경우의 그 다른 회사.", "more": "상법상 모자회사 기준(50% 초과)이나 공정거래법상 계열 기준과 다르다. 보험업법은 15% 초과라는 낮은 문턱을 쓴다.", "src": "보험업법 제2조 제18호"}, "외국보험회사": {"d": "대한민국 이외의 국가의 법령에 따라 설립되어 대한민국 이외의 국가에서 보험업을 경영하는 자.", "more": "설립준거법과 영업지가 모두 국외여야 한다. 국내에 지점을 두면 ‘외국보험회사국내지점’으로 별도의 규율을 받는다.", "src": "보험업법 제2조 제8호"}, "허가": {"d": "법령상의 일반적 금지를 특정인에게 풀어 주는 행정행위. 보험업은 보험종목별로 금융위원회의 허가를 받아야 한다.", "more": "보험업법은 ‘허가’와 ‘인가’를 조문마다 구분해 쓴다. 지문에서 둘을 바꿔 놓는 것이 흔한 함정이다.", "src": "보험업법 제4조 제1항"}, "겸영": {"d": "하나의 보험회사가 둘 이상의 보험업을 함께 경영하는 것.", "more": "생명보험업과 손해보험업의 겸영은 원칙적으로 금지된다. 다만 생명보험·제3보험의 재보험, 다른 법령에 따라 겸영할 수 있는 종목, 제3보험에 부가되는 보험은 예외다.", "src": "보험업법 제10조"}, "기금": {"d": "상호회사의 설립 재원. 주식회사의 자본금에 대응한다.", "more": "정관에는 ‘기금의 총액’, ‘기금 갹출자가 가질 권리’, ‘기금과 설립비용의 상각 방법’을 적어야 한다. ‘기금의 납입 방법’은 정관기재사항이 아니다.", "src": "보험업법 제34조"}, "고지의무": {"d": "보험계약 당시 보험계약자 또는 피보험자가 중요한 사항을 사실대로 알려야 할 의무.", "more": "고의 또는 중대한 과실로 위반하면 보험자는 안 날부터 1월, 계약 체결일부터 3년 내에 해지할 수 있다. 인과관계가 없으면 보험금은 지급한다.", "src": "상법 제651조·제655조"}, "불이익변경금지": {"d": "상법 보험편의 규정을 당사자 특약으로 보험계약자·피보험자·보험수익자에게 불이익하게 변경하지 못한다는 원칙.", "more": "재보험 및 해상보험 기타 이와 유사한 보험에는 적용되지 않는다. 기업보험은 당사자의 협상력이 대등하기 때문이다.", "src": "상법 제663조"}, "책임보험": {"d": "피보험자가 보험기간 중의 사고로 제3자에게 배상할 책임을 진 경우 이를 보상하는 보험.", "more": "손해보험성·재산보험성·소극보험성을 가진다. 물건보험성은 없다. 제3자는 보험금액의 한도에서 직접청구권을 가진다.", "src": "상법 제719조·제724조"}, "재보험": {"d": "보험자가 인수한 위험의 전부 또는 일부를 다른 보험자에게 전가하는 계약.", "more": "원보험과 별개의 독립한 손해보험계약이며, 상법상 불이익변경금지의 예외이고 보험업법상 손해보험업의 한 종목이다.", "src": "손해사정이론"}, "기초서류": {"d": "사업방법서, 보험약관, 보험료 및 책임준비금의 산출방법서를 통틀어 이르는 말.", "more": "보험증권은 기초서류가 아니다. 제127조(신고)·제128조(확인)·제128조의3(작성·변경 원칙)·제131조(변경 명령)가 모두 이 세 장을 축으로 돈다.", "src": "보험업법 제5조 제3호"}, "보험대리점": {"d": "보험회사를 위하여 보험계약의 체결을 대리하는 자로서 금융위원회에 등록한 자.", "more": "중개만 하는 보험중개사와 달리 대리권을 가질 수 있다. 은행 등이 등록하면 금융기관보험대리점이 되며 25% 룰·점포당 2명 제한을 받는다.", "src": "보험업법 제2조 제10호·제87조"}, "보험중개사": {"d": "독립적으로 보험계약의 체결을 중개하는 자. 특정 보험회사에 소속되지 않는다.", "more": "영업보증금은 개인 1억원, 법인 3억원 이상이며 금융기관보험중개사는 면제된다. 수수료·보수 등 대가를 계약자에게 알리고 장부에 적어 열람하게 해야 한다.", "src": "보험업법 제2조 제11호·제89조·제89조의2"}, "신용공여": {"d": "대출, 지급보증, 자금 지원적 성격의 유가증권 매입 등 직접·간접으로 신용위험을 수반하는 거래.", "more": "제106조의 자산운용 한도가 모두 이 개념을 단위로 쓴다. 총자산의 1%를 초과하는 것을 거액 신용공여라 하고 그 합계는 총자산의 20%를 넘을 수 없다.", "src": "보험업법 제2조 제13호·제106조"}, "동일차주": {"d": "동일한 개인·법인 및 그와 신용위험을 공유하는 자.", "more": "동일차주에 대한 신용공여와 그가 발행한 채권·주식 소유의 합계액은 일반계정 총자산의 12%를 넘을 수 없다.", "src": "보험업법 제2조 제16호·제106조 제1항 제3호"}}, "SEARCH": [{"s": "보험업법", "c": 0, "i": 0, "title": "보험업법의 목적과 규율 대상", "chap": "총칙", "t": "보험업법의 목적과 규율 대상 보험업법은 보험업의 진입·조직·판매·자산운용·감독을 규율하는 공법이다. 제1장 총칙은 이 법의 목적(제1조)과 20개 호의 정의(제2조)로 구성된다. 정의 조항은 제45회·제47회·제49회 1차 시험에 직접 출제되었고, 뒤에 나오는 자산운용 한도와 자회사 규제가 모두 이 조항의 용어를 그대로 사용한다. 01 법의 목적 보험업법 제1조는 이 법의 목적을 두 가지로 정한다. 첫째는 보험업을 경영하는 자의 건전한 경영 을 도모하는 것이고, 둘째는 보험계약자·피보험자, 그 밖의 이해관계인의 권익을 보호 하는 것이다. 이 두 가지를 통하여 보험업의 건전한 육성과 국민경제의 균형 있는 발전에 기여함을 최종 목표로 한다. 따라서 보험업법의 개별 조문은 건전성 규제 와 소비자 보호 중 어느 하나에 속한다. 허가, 자본금, 자산운용 한도, 재무제표 제출, 검사와 제재는 전자에 속하고, 모집 규제, 설명의무, 기초서류 신고, 손해사정 절차는 후자에 속한다. 개념 두 규제 목적의 관계 건전성 규제 — 허가, 자본금·기금, 자산운용 한도, 재무건전성, 검사·제재 소비자 보호 — 모집 규제, 설명의무, 기초서류 신고, 손해사정 절차 두 목적은 충돌하는 경우가 있다. 건전성을 강화하면 상품 공급이 제한되고, 보험금 지급을 확대하면 보험회사의 재무구조가 약화된다. 보험업법이 정한 자본금 300억원, 자회사 소유 기준 15퍼센트, 자산운용 비율 한도는 두 목적의 균형점을 입법자가 수치로 정한 결과이다. 시험에서는 이 균형이 원칙과 예외 의 형식으로 출제된다. 겸영 금지(제10조)는 원칙이고, 그 단서의 세 가지 예외가 실제 출제 지점이다. 02 규율 대상 — 보험업과 보험회사 보험업 이란 보험상품의 취급과 관련하여 발생하는 보험의 인수, 보험료 수수 및 보험금 지급 등을 영업으로 하는 것을 말한다(제2조 제2호). 요건은 세 가지이다. ① 보험상품을 취급할 것, ② 인수·보험료 수수·보험금 지급의 행위를 할 것, ③ 이를 영업으로 할 것이다. 일회적으로 위험을 인수하는 행위는 영업성이 없으므로 보험업에 해당하지 않는다. 보험업을 경영할 수 있는 회사의 형태는 세 가지로 한정된다. 주식회사 , 상호회사 , 외국보험회사국내지점 이다. 상호회사는 보험계약자가 곧 사원이 되는 회사이므로 주식회사와 조직 원리가 다르고, 설립·정관·기관·계산에 관하여 제34조 이하에 별도의 규정을 둔다. 함정 상호회사의 사원은 피용자가 아니다 상호회사의 사원 은 회사에 고용된 직원이 아니라 회사의 구성원인 보험계약자를 말한다. 사원은 보험료를 납입할 의무를 부담할 뿐이고 회사 채권자에 대하여 직접 책임을 지지 않는다. “상호회사의 사원은 회사의 채권자에 대하여 직접적인 의무를 부담하지 아니한다”는 지문은 옳다. 03 정의 조항의 구조 제2조는 제1호부터 제20호까지 20개의 정의를 둔다. 호의 순서대로 암기하는 방법은 효율이 낮다. 규율 대상에 따라 다음 네 묶음으로 나누어 정리한다. 묶음 해당 호 주요 용어 상품과 업 제1호~제5호 보험상품, 보험업, 생명보험업, 손해보험업, 제3보험업 사업자 제6호~제8호 보험회사, 상호회사, 외국보험회사 모집조직 제9호~제12호 보험설계사, 보험대리점, 보험중개사, 모집 규제의 계량 기준 제13호~제20호 신용공여, 총자산, 자기자본, 동일차주, 대주주, 자회사, 전문·일반보험계약자 네 번째 묶음이 특히 중요하다. 자산운용 한도를 정한 제106조는 ‘동일차주’, ‘총자산’, ‘자기자본’이라는 정의 조항의 용어를 그대로 사용한다. 용어의 범위를 모르면 한도 수치를 암기하여도 문제를 풀 수 없다. 함정 보험회사는 허가를 받은 자에 한한다 제2조 제6호의 보험회사 는 “제4조에 따른 허가를 받아 보험업을 경영하는 자”를 말한다. 허가 없이 보험업을 하는 자는 보험회사가 아니며, 제3조·제200조 위반으로 처벌 대상이 될 뿐이다. “무허가 영업자도 보험업법상 보험회사에 해당한다”는 지문은 틀렸다. 제3조는 누구든지 보험회사가 아닌 자와 보험계약을 체결하거나 그 계약의 체결을 중개·대리하지 못하도록 하되, 대통령령으로 정하는 경우를 예외로 한다. 국내에 지점을 두지 아니한 외국보험회사와 체결하는 생명보험계약, 수출적하보험계약, 수입적하보험계약, 항공보험계약, 여행보험계약, 선박보험계약, 장기상해보험계약, 재보험계약이 이에 해당한다. 참고 보험업법과 인접 법률의 구별 상법 제4편(보험) — 보험자와 보험계약자 사이의 사법 관계 를 규율한다. 계약의 성립, 고지의무, 보험금청구권이 그 대상이다. 보험업법 — 국가와 보험회사 사이의 공법 관계 를 규율한다. 진입 규제와 감독이 그 대상이다. 금융소비자보호법 — 2021년 시행. 설명의무, 적합성 원칙, 부당권유 금지 등 판매 규제의 상당 부분이 보험업법에서 이 법으로 이관되었다. 같은 사실관계라도 근거 법률에 따라 효과가 달라진다. 설명의무 위반의 경우 상법 제638조의3 제2항에 따르면 보험계약자는 계약이 성립한 날부터 3개월 이내에 계약을 취소할 수 있고, 금융소비자보호법에 따르면 위법계약해지권, 과징금, 손해배상에서의 입증책임 전환이 문제된다. 지문의 근거 법률을 먼저 확인하여야 한다. 04 진입과 감독의 개관 보험업을 경영하려는 자는 보험종목별로 금융위원회의 허가 를 받아야 한다(제4조 제1항). 인가가 아니라 허가이며, 허가의 단위는 회사가 아니라 종목이다. 자동차보험 허가를 받은 회사가 화재보험을 취급하려면 그 종목에 관하여 다시 허가를 받아야 한다. 허가를 받은 보험회사는 금융위원회와 금융감독원의 감독을 받는다. 재무제표 제출, 검사, 제재, 허가의 취소에 관한 규정은 제6장에 있다. 법 전체의 순서는 총칙 → 허가 → 회사 → 모집 → 자산운용 → 계산·감독 → 손해사정 이며, 이는 보험회사의 설립부터 보험금 지급까지의 순서와 일치한다. 기출 총칙에서 출제된 문항 제49회 보험업법 1번 — 용어의 정의 중 옳지 않은 것. 자회사의 지분 기준을 100분의 15에서 100분의 10으로 바꾸어 출제하였다. 제47회 보험업법 2번 — 용어의 정의 종합. 제48회 보험업법 1번 — 보험회사가 아닌 자와 보험계약을 체결할 수 있는 경우(제3조 단서). 세 문항 모두 조문의 숫자와 열거 항목 을 변형하여 오답을 구성하였다. 정의 조항은 문장 전체를 암기하기보다 각 호의 숫자(15퍼센트, 10퍼센트), 열거된 자의 범위, 괄호 안의 제외 규정을 확인하는 방식으로 정리한다. 보험업법 제1조 (목적) 이 법은 보험업을 경영하는 자의 건전한 경영을 도모하고 보험계약자, 피보험자, 그 밖의 이해관계인의 권익을 보호함으로써 보험업의 건전한 육성과 국민경제의 균형 있는 발전에 기여함을 목적으로 한다. 제1조는 두 개의 수단과 두 개의 목표로 구성된다. 수단은 보험업을 경영하는 자의 건전한 경영 과 보험계약자 등의 권익 보호 이고, 목표는 보험업의 건전한 육성 과 국민경제의 균형 있는 발전 이다. 앞의 수단은 보험회사를, 뒤의 수단은 계약자를 대상으로 한다. 목적 조항 자체를 묻는 문항은 많지 않으나 개별 조문의 취지를 묻는 문항은 매년 출제되므로, 이 구조를 판단의 기준으로 삼는다. 04 제2조 정의 — 20개 호의 구성 제2조는 제1호부터 제20호까지 정의를 늘어놓는다. 순서대로 외우면 반드시 흐트러진다. 대신 아래 표처럼 네 묶음 으로 잘라 두면 지문에서 어느 호를 건드리는지 즉시 보인다. 묶음 호 핵심 낱말 무엇을 — 상품과 업 제1호~제5호 보험상품 · 보험업 · 생명보험업 · 손해보험업 · 제3보험업 누가 — 사업자 제6호~제8호 보험회사 · 상호회사 · 외국보험회사 누가 파는가 — 모집조직 제9호~제12호 보험설계사 · 보험대리점 · 보험중개사 · 모집 얼마나 — 규제 계량어 제13호~제20호 신용공여 · 총자산 · 자기자본 · 동일차주 · 대주주 · 자회사 · 전문/일반보험계약자 네 번째 묶음이 특히 중요하다. 제4장 자산운용의 한도 조문(제106조)은 이 호들의 낱말을 그대로 가져다 쓴다. “동일차주”가 무엇인지 모르면 12%라는 숫자를 외워도 문제를 못 푼다. 정의 조항은 나중에 쓸 계량 단위 를 미리 만들어 두는 장치다. 함정 ‘보험회사’와 ‘보험업을 경영하는 자’ 제2조 제6호의 보험회사 는 “제4조에 따른 허가를 받아 보험업을 경영하는 자”다. 즉 허가를 받은 자만 보험회사다. 무허가로 보험업을 하는 자는 보험회사가 아니라 제3조·제200조 위반의 처벌 대상일 뿐이다. 지문이 “무허가 영업자도 보험업법상 보험회사에 해당한다”라고 하면 틀린 문장이다. 이 구분은 실무에서도 그대로 적용된다. 유사수신·유사보험 사업자를 단속할 때 감독당국은 그를 보험회사로 취급해 감독하는 것이 아니라, 애초에 보험업을 할 자격이 없는 자 로 보고 형사 절차로 넘긴다. 감독의 대상과 처벌의 대상이 서로 다른 절차에 놓인다는 점에 유의한다. 또 하나. 제3조는 “누구든지 보험회사가 아닌 자와 보험계약을 체결하거나 중개 또는 대리하지 못한다”고 정하되, 대통령령으로 정하는 경우를 예외로 둔다. 국내에 지점 없는 외국보험회사와의 계약 중 생명보험·수출적하·수입적하·항공·여행·선박·장기상해·재보험 등이 그 예외다. 참고 보험업법과 이웃 법률의 경계 상법 제4편 — 보험회사와 계약자 사이의 사법(私法) 관계. 계약이 언제 성립하고 누가 무엇을 청구하는가. 보험업법 — 국가와 보험회사 사이의 공법(公法) 관계. 누가 영업해도 되고 어떻게 감독하는가. 금융소비자보호법 — 2021년 시행. 설명의무·적합성·부당권유 금지 등 판매 규제 가 보험업법에서 이 법으로 상당 부분 옮겨 갔다. 같은 사실관계라도 어느 법으로 묻느냐에 따라 답이 달라진다. 설명의무 위반의 경우 상법 제638조의3에 따르면 계약이 성립한 날부터 3개월 이내에 취소할 수 있고, 금융소비자보호법에 따르면 위법계약해지권, 과징금, 손해배상에서의 입증책임 전환이 문제된다. 지문의 근거 법률 을 먼저 확인하여야 한다. 보험업법 제1조가 정한 두 가지 규제 목적은? 건전성 규제 와 소비자 보호 보험업 정의의 세 요건은? 보험상품 취급 · 인수·보험료 수수·보험금 지급 · 영업으로 할 것 보험업을 경영할 수 있는 회사 형태는? 주식회사 · 상호회사 · 외국보험회사국내지점 보험업 진입은 허가인가 인가인가? 허가 이며, 보험종목별로 금융위원회의 허가를 받는다(제4조 제1항) 보험업법상 자회사의 지분 기준은? 의결권 있는 발행주식 총수의 100분의 15 초과 (제2조 제18호) 보험업법 제1조가 말하는 최종 목표 두 가지는? 보험업의 건전한 육성 과 국민경제 의 균형 있는 발전 제2조 정의 조항을 네 묶음으로 나누면? 상품·업 / 사업자 / 모집조직 / 규제 계량어 (신용공여·총자산·자기자본·동일차주·대주주·자회사) 보험업법상 ‘보험회사’의 정의에 반드시 들어가는 요건은? 제4조에 따른 허가를 받아 보험업을 경영할 것 설명의무 위반의 효과를 상법으로 물으면? 계약이 성립한 날부터 3개월 이내 계약 취소(상법 제638조의3 제2항)"}, {"s": "보험업법", "c": 0, "i": 1, "title": "보험상품과 보험종목", "chap": "총칙", "t": "보험상품과 보험종목 보험상품의 3분류는 정의 조항에 있으나 그 효과는 허가·겸영·자본금 규제 전반에 미친다. 제45회 14번, 제46회 1번, 제47회 8번이 모두 이 구분을 전제로 출제되었다. 상품의 분류(무엇을 보장하는가)와 종목의 분류(어떤 단위로 허가하는가)를 구별하는 것이 이 절의 요점이다. 01 보험상품의 3분류 제2조 제1호는 보험상품을 생명보험상품·손해보험상품·제3보험상품으로 구분한다. 세 목의 문장 구조는 동일하고 보장의 대상만 달라진다. 구분 보장 대상 정의(제2조 제1호) 보상 방식 생명보험상품 사람 사람의 생존 또는 사망 에 관하여 약정한 급여를 지급 정액 손해보험상품 재물·책임 우연한 사건으로 발생하는 손해 에 관하여 급여를 지급 (질병·상해·간병은 제외) 실손 제3보험상품 사람 사람의 질병·상해 또는 이에 따른 간병 에 관하여 급여를 지급 정액·실손 병용 제3보험 은 보장 대상이 사람이라는 점에서 생명보험과 같고, 실제 발생한 치료비를 보상한다는 점에서 손해보험과 같다. 손해보험상품의 정의에 “다목에 따른 질병·상해 및 간병은 제외한다”는 괄호가 있으므로 제3보험은 손해보험에서 분리된 영역이다. 이 성질 때문에 생명보험회사와 손해보험회사가 모두 제3보험업을 겸영할 수 있다. 참고 보험상품에서 제외되는 것 국민건강보험법에 따른 건강보험, 고용보험법에 따른 고용보험 등 대통령령으로 정하는 것 은 보험상품에서 제외된다. 사회보험은 가입이 강제되고 급여의 내용이 법으로 정해져 있어, 사적 자치를 전제로 하는 보험업법의 규율 대상이 아니기 때문이다. 손해사정이론에서 민영보험과 사회보험을 비교하는 문항이 반복 출제된다. 그 비교의 법적 근거가 이 제외 규정이다. 두 과목을 함께 정리하면 중복 학습을 피할 수 있다. 02 보험종목 — 허가의 단위 보험상품이 보장 내용에 따른 분류라면 보험종목 은 허가를 부여하는 단위에 따른 분류이다. 제4조 제1항이 이를 열거한다. 생명보험업 — 생명보험, 연금보험(퇴직보험 포함), 그 밖에 대통령령으로 정하는 보험종목 손해보험업 — 화재보험, 해상보험(항공·운송보험 포함), 자동차보험, 보증보험, 재보험 , 그 밖에 대통령령으로 정하는 보험종목 제3보험업 — 상해보험, 질병보험, 간병보험, 그 밖에 대통령령으로 정하는 보험종목 함정 재보험은 손해보험업의 보험종목이다 재보험은 별개의 보험업이 아니라 손해보험업의 보험종목 중 하나로 열거되어 있다(제4조 제1항 제2호). “손해보험업의 보험종목에는 재보험이 포함된다”는 지문은 옳다. 다만 겸영 규정(제10조)에서 재보험은 예외의 통로로도 쓰인다. 생명보험회사도 생명보험의 재보험 과 제3보험의 재보험 은 겸영할 수 있다. 종목으로서의 재보험과 겸영 예외로서의 재보험을 구별한다. 03 허가의 의제 제4조는 세 곳에서 “허가를 받은 것으로 본다”고 규정한다. 방향을 혼동하지 않도록 다음과 같이 정리한다. 개념 허가 의제 세 가지 제4조 제2항 — 보험종목별 허가를 받은 자는 그 종목의 재보험 에 관하여 허가를 받은 것으로 본다. 다만 소액단기전문보험회사는 제외한다. 제4조 제3항 — 생명보험업 또는 손해보험업의 보험종목 전부 에 관하여 허가를 받은 자는 제3보험업 의 허가를 받은 것으로 본다. 제4조 제4항 — 보험종목 전부에 관하여 허가를 받은 자는 그 후 신설되는 보험종목 에 관하여 허가를 받은 것으로 본다. 세 항이 연속되어 있어 지문에서 항을 바꾸어 출제하기 쉽다. ‘종목별 → 그 종목의 재보험’, ‘전부 → 제3보험업’, ‘전부 → 신설 종목’으로 대응 관계를 고정한다. 제2항 단서의 소액단기전문보험회사 제외 를 삭제하고 출제하는 유형이 반복된다. 기출 보험종목에서 출제된 문항 제45회 보험업법 14번 — 연금보험·퇴직보험·보증보험·재보험·상해보험·간병보험 중 손해보험업의 보험종목에 해당하는 개수를 묻는 문항이다. 보증보험과 재보험 2개가 답이다. 제46회 보험업법 1번 — 제3보험의 보험종목에 부가되는 보험으로서 질병사망을 특약 형식으로 담보하는 경우의 요건을 묻는다. 제46회 손해사정이론 20번 — 소액단기전문보험회사가 취급할 수 있는 보험종목의 개수를 묻는다. 개수를 묻는 유형은 열거 항목을 모두 판정하여야 하므로 부분 암기로는 정답에 이르지 못한다. 생명보험업·손해보험업·제3보험업의 종목을 표로 만들어 각 항목이 어느 칸에 속하는지 반복 확인한다. 보험업법 제2조 제1호 (보험상품) “보험상품”이란 위험보장을 목적으로 우연한 사건 발생에 관하여 금전 및 그 밖의 급여를 지급할 것을 약정하고 대가를 수수하는 계약(「국민건강보험법」에 따른 건강보험, 「고용보험법」에 따른 고용보험 등 보험계약자의 보호 필요성 및 금융거래 관행 등을 고려하여 대통령령으로 정하는 것은 제외 한다)으로서 다음 각 목의 것을 말한다. 가. 생명보험상품 — 위험보장을 목적으로 사람의 생존 또는 사망에 관하여 약정한 금전 및 그 밖의 급여를 지급할 것을 약속하고 대가를 수수하는 계약 나. 손해보험상품 — 위험보장을 목적으로 우연한 사건(다목에 따른 질병·상해 및 간병은 제외한다)으로 발생하는 손해에 관하여 금전 및 그 밖의 급여를 지급할 것을 약속하고 대가를 수수하는 계약 다. 제3보험상품 — 위험보장을 목적으로 사람의 질병·상해 또는 이에 따른 간병에 관하여 금전 및 그 밖의 급여를 지급할 것을 약속하고 대가를 수수하는 계약 세 목을 나란히 놓으면 문장 구조가 같다. “위험보장을 목적으로 / 무엇에 관하여 / 금전 및 그 밖의 급여를 지급할 것을 약속하고 대가를 수수하는 계약.” 달라지는 부분은 보장의 대상뿐이며, 각각 생존·사망 , 우연한 사건으로 발생하는 손해 , 질병·상해·간병 이다. 손해보험상품의 정의에 “다목에 따른 질병·상해 및 간병은 제외한다”는 괄호가 있으므로, 제3보험은 손해보험에서 분리된 영역이다. 04 보험종목의 전체 목록 제4조 제1항은 허가 단위인 보험종목을 열거한다. 이 목록은 그대로 시험 지문이 된다. 보험업 보험종목 생명보험 생명보험 · 연금보험(퇴직보험 포함) · 그 밖에 대통령령으로 정하는 보험종목 손해보험 화재보험 · 해상보험(항공·운송보험 포함) · 자동차보험 · 보증보험 · 재보험 · 그 밖에 대통령령으로 정하는 보험종목(책임·기술·권리·도난·유리·동물·원자력·비용·날씨보험) 제3보험 상해보험 · 질병보험 · 간병보험 · 그 밖에 대통령령으로 정하는 보험종목 함정 법에 직접 적힌 종목과 대통령령으로 넘긴 종목 손해보험에서 법률 본문에 직접 이름이 적힌 종목은 다섯 개 다 — 화재 · 해상(항공·운송 포함) · 자동차 · 보증 · 재보험. 책임보험·기술보험·권리보험 등은 “그 밖에 대통령령으로 정하는 보험종목”에 들어 있다. “보험업법 제4조 제1항이 열거한 손해보험 종목이 아닌 것은?” 유형에서 이 경계를 건드린다. 생명보험 쪽은 더 단출하다 — 생명보험 과 연금보험(퇴직보험 포함) 둘뿐이다. ‘연금보험’ 뒤의 괄호에 퇴직보험이 들어 있다는 점을 놓치면, “퇴직보험은 별도의 보험종목이다”라는 틀린 지문에 걸린다. 제3보험은 상해·질병·간병 셋. 이 세 종목을 하나로 묶어 두면 겸영 예외(제10조 제3호)의 ‘제3보험에 부가되는 보험’을 이해할 때에도 도움이 된다. 사례 어디까지가 보험상품인가 보험상품이다 — 실손의료보험, 여행자보험, 반려동물보험(동물보험), 날씨보험(농작물 재해 대비 지수형 상품) 보험상품이 아니다 — 국민건강보험, 고용보험, 산재보험, 국민연금 등 사회보험 . 법이 정의 괄호에서 직접 빼 두었다. 다투어지는 영역 — 상조 서비스, 각종 멤버십의 ‘보장’ 서비스. 우연성·대가성·급여지급 약정이라는 세 요소가 다 갖춰지면 무허가 보험업이 될 수 있다. 세 번째 줄이 실무의 회색지대다. 금융당국은 (1) 우연한 사고를 요건으로 급여를 주는가 (2) 대가(회비·이용료)를 받는가 (3) 다수로부터 모아 위험을 분산하는가를 본다. 셋이 다 충족되면 이름이 무엇이든 보험업으로 본다. 명칭이 아니라 실질 로 판단한다는 원칙이다. 보험상품 정의의 요건은? 위험보장 목적 + 우연한 사건 + 급여 지급 약정 + 대가 수수 제3보험이 생·손보 양쪽에서 취급되는 이유는? 보장 대상은 사람 (생명보험과 동일), 보상은 실손 (손해보험과 동일) 재보험은 어느 보험업의 종목인가? 손해보험업 의 보험종목(제4조 제1항 제2호) 보험종목 전부 허가 시 의제되는 허가는? 제3보험업 의 허가(제4조 제3항) 보험상품에서 제외되는 것은? 국민건강보험·고용보험 등 대통령령으로 정하는 것 손해보험상품의 정의에서 괄호로 빠지는 것은? 다목의 질병·상해 및 간병 — 그 영역이 제3보험이다 보험업법 제4조 제1항이 직접 열거한 손해보험 종목 다섯은? 화재 · 해상(항공·운송 포함) · 자동차 · 보증 · 재보험 법조문상 생명보험의 보험종목 둘은? 생명보험 · 연금보험(퇴직보험 포함) 국민건강보험이 보험상품이 아닌 이유는? 제2조 제1호 정의 괄호 에서 대통령령으로 제외했기 때문"}, {"s": "보험업법", "c": 0, "i": 2, "title": "전문보험계약자와 일반보험계약자", "chap": "총칙", "t": "전문보험계약자와 일반보험계약자 보험업법은 보험계약자를 전문보험계약자와 일반보험계약자로 구분하고 모집 규제를 일반보험계약자에게 집중한다. 구분의 기준은 제2조 제19호·제20호에 있고, 전문보험계약자가 일반보험계약자로 전환되는 요건이 제45회 1번과 제47회 4번에 출제되었다. 01 구분의 기준 전문보험계약자 란 보험계약에 관한 전문성, 자산규모 등에 비추어 보험계약의 내용을 이해하고 이행할 능력이 있는 자를 말한다(제2조 제19호). 일반보험계약자 는 전문보험계약자가 아닌 보험계약자를 말한다(제2조 제20호). 일반보험계약자는 이와 같이 소극적으로 정의된다. 개념 전문보험계약자의 범위(제2조 제19호) 가. 국가 나. 한국은행 다. 대통령령으로 정하는 금융기관 라. 주권상장법인 마. 그 밖에 대통령령으로 정하는 자 가목부터 마목까지의 구분 자체가 출제 대상이다. 국가와 한국은행은 법률에 직접 규정되어 있고, 지방자치단체는 법률에 없으며 대통령령에 위임되어 있다. 지문은 목록에 없는 자를 추가하거나, 법률에 직접 규정된 자를 “대통령령으로 정하는”으로 바꾸는 방식으로 오답을 구성한다. 02 구분의 실익 설명의무, 적합성 원칙, 통신수단을 이용한 모집의 제한 등 제4장의 모집 규제는 대부분 일반보험계약자 를 대상으로 한다. 계약 상대방이 국가나 주권상장법인인 경우에는 정보의 격차가 크지 않으므로 동일한 수준의 보호가 필요하지 않다는 판단에 따른 것이다. 이 구분은 정의 조항에 있으나 실제 효과는 모집 규제에서 발생한다. 함정 계약자 구분과 모집조직 구분의 혼동 전문보험계약자는 보험을 구매하는 쪽 의 구분이다. 보험회사·보험대리점·보험중개사와 같은 판매하는 쪽 의 구분(제2조 제6호·제10호·제11호)과 혼동하면 지문의 정오가 반대로 판단된다. 03 전문에서 일반으로의 전환 전문보험계약자 중 대통령령으로 정하는 자 가 일반보험계약자와 같은 대우를 받겠다는 의사를 보험회사에 서면으로 통지 하는 경우, 보험회사는 정당한 사유가 없으면 이에 동의하여야 한다. 보험회사가 동의한 경우 해당 보험계약자는 일반보험계약자로 본다. 요건은 ① 대통령령으로 정하는 자일 것, ② 서면 통지, ③ 보험회사의 동의 세 가지이다. 국가·한국은행과 같이 법률에 직접 규정된 자는 전환 대상에서 제외된다. 전환의 방향은 전문 → 일반 한 방향뿐이며, 일반보험계약자가 전문보험계약자로 전환되는 절차는 없다. 기출 전환 규정의 출제 형태 제45회 보험업법 1번 — 전문보험계약자 중 보험회사의 동의에 의하여 일반보험계약자로 될 수 없는 자를 고르는 문항이다. 법률에 직접 규정된 자를 찾으면 된다. 제47회 보험업법 4번 — 전환 규정의 괄호를 비워 두고 주체를 묻는 문항이다. “대통령령으로 정하는 자”가 답이다. 두 문항 모두 조문의 주체를 정확히 기억하는지를 확인한다. “전문보험계약자”라고만 답하면 오답이 된다. 조문은 전문보험계약자 중 대통령령으로 정하는 자 로 범위를 좁히고 있다. 보험업법 제2조 제19호 (전문보험계약자) “전문보험계약자”란 보험계약에 관한 전문성, 자산규모 등에 비추어 보험계약의 내용을 이해하고 이행할 능력이 있는 자로서 다음 각 목의 어느 하나에 해당하는 자를 말한다. 다만, 전문보험계약자 중 대통령령으로 정하는 자가 일반보험계약자와 같은 대우를 받겠다는 의사를 보험회사에 서면으로 통지 하는 경우 보험회사는 정당한 사유가 없으면 이에 동의하여야 하며, 보험회사가 동의한 경우에는 해당 보험계약자는 일반보험계약자로 본다. 가. 국가 나. 한국은행 다. 대통령령으로 정하는 금융기관 라. 주권상장법인 마. 그 밖에 대통령령으로 정하는 자 단서가 조문 전체보다 길다. 그만큼 출제 지점이라는 뜻이다. 순서를 정확히 밟자 — ① 전문보험계약자 중 대통령령으로 정하는 자 가 ② 서면으로 통지하면 ③ 보험회사는 정당한 사유가 없으면 동의하여야 하고 ④ 동의한 경우에 비로소 일반보험계약자로 본다 . 네 단계 중 어느 하나를 바꿔 놓는 것이 함정이다. 함정 세 가지 흔한 뒤틀기 “ 모든 전문보험계약자가 전환을 요구할 수 있다” → 틀림. 대통령령으로 정하는 자 만. 국가·한국은행 등은 전환 대상이 아니다. “구두로 통지해도 된다” → 틀림. 서면 이다. “통지하면 곧바로 일반보험계약자가 된다” → 틀림. 보험회사의 동의 가 있어야 한다. 다만 회사는 정당한 사유 없이 거절하지 못한다. 반대 방향의 전환, 즉 일반보험계약자가 전문보험계약자와 같은 대우를 요구하는 제도는 보험업법에 없다. 자본시장법에는 유사한 제도가 있으므로 이를 이용한 지문이 출제된다. 보험업법은 보호를 강화하는 방향의 전환만 인정한다. 04 구분의 실익 — 규제의 두께가 달라진다 항목 일반보험계약자 전문보험계약자 설명의무·적합성 원칙 적용 원칙적으로 미적용 보험안내자료 규제 적용 완화 통신판매 시 보호 절차 적용 완화 상법 제663조 불이익변경금지 보험계약자 구분과 무관 — 재보험·해상보험 등 기업보험에서만 배제 맨 아랫줄이 중요하다. 상법 제663조의 불이익변경금지는 보험업법의 전문/일반 구분과 다른 축 에서 작동한다. 재보험 및 해상보험 기타 이와 유사한 보험에서 배제될 뿐이다. 두 제도를 겹쳐 놓고 “전문보험계약자에게는 제663조가 적용되지 않는다”고 하면 틀린 지문이다. 심화 왜 보호를 나누는가 보호는 공짜가 아니다. 설명·확인·서류 절차는 모두 비용이고, 그 비용은 결국 보험료에 실린다. 스스로 위험을 판단할 수 있는 국가·은행·상장법인에까지 같은 절차를 요구하면 보호의 값만 치르고 보호의 효용은 없다 . 그래서 법은 보호가 실제로 필요한 쪽에 자원을 몰아 준다. 다만 “전문가라도 실제로는 정보가 부족할 수 있다”는 반론이 있고, 그 반론의 결과물이 바로 전환권 이다. 스스로 보호가 필요하다고 판단하는 전문보험계약자는 신청해서 일반보험계약자의 옷을 입을 수 있다. 제도를 이렇게 ‘원칙 + 되돌림 장치’로 읽으면 조문의 단서가 왜 붙었는지 자연스럽게 이해된다. 전문보험계약자로 법률에 직접 규정된 자는? 국가 · 한국은행 · 대통령령으로 정하는 금융기관 · 주권상장법인 · 그 밖에 대통령령으로 정하는 자 일반보험계약자의 정의는? 전문보험계약자가 아닌 보험계약자(제2조 제20호) 전문 → 일반 전환의 요건은? 대통령령으로 정하는 자일 것 + 서면 통지 + 보험회사의 동의 (정당한 사유 없이 거부 불가) 전환은 양방향으로 가능한가? 아니다. 전문 → 일반 한 방향만 인정된다 전문보험계약자가 일반보험계약자 대우를 받으려면? 대통령령으로 정하는 자가 서면 통지 → 보험회사 동의 보험회사는 그 통지를 거절할 수 있는가? 정당한 사유가 없으면 동의하여야 한다 일반 → 전문으로의 전환은 보험업법에 있는가? 없다 . 보호를 두껍게 하는 방향의 전환만 있다 상법 제663조가 배제되는 보험은? 재보험 및 해상보험 기타 이와 유사한 보험 — 전문/일반 구분과는 다른 축"}]};          // 결제 전 배포본: 무료 장만 본문이 든 교재 (미리보기본은 null)
let FREE_MODE = false;          // 무료 범위로 보고 있는가
const BOOK = null || {};
const TERMS = null || {};
/* 빌드 시점에 태그를 걷어 낸 평문 인덱스 — 한 글자 칠 때마다 정규식을 돌리지 않는다 */
const SEARCH = null || [];
SEARCH.forEach(e => { e.lc = e.t.toLowerCase(); });
/* 용어사전도 같은 방식으로 한 번만 소문자화 — 이름·해설·보충을 모두 검색한다 */
const TLC = Object.keys(TERMS).map(k => ({
  k, lc: (k + ' ' + TERMS[k].d + ' ' + (TERMS[k].more || '')).toLowerCase() }));

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
};

let readSet = new Set(store.get('sonsa:book:read') || []);
let st = { subj: Object.keys(BOOK)[0], view: 'home', ci: 0, si: 0, q: '' };

const chapters = () => BOOK[st.subj].chapters;
function flat(){ const o=[]; chapters().forEach((c,ci)=>c.sections.forEach((s,si)=>o.push({c,s,ci,si}))); return o; }
const rkey = s => st.subj + '|' + s.title;
const isRead = s => readSet.has(rkey(s));
function chProg(c){
  if(!c.sections.length) return 0;
  return Math.round(c.sections.filter(s=>readSet.has(st.subj+'|'+s.title)).length / c.sections.length * 100);
}
function totProg(){
  const f = flat(); if(!f.length) return 0;
  return Math.round(f.filter(x=>isRead(x.s)).length / f.length * 100);
}
const saveRead = () => store.set('sonsa:book:read', [...readSet]);
function go(next){ st = Object.assign({}, st, next); render(); scrollTo({ top:0, behavior:'instant' }); }

/* ── 화면 ── */
function render(){
  $('subjSel').innerHTML = Object.keys(BOOK).map(k=>{
    const has = BOOK[k].chapters.some(c=>c.sections && c.sections.length);
    return `<option value="${esc(k)}"${k===st.subj?' selected':''}>${esc(k)}${has?'':' · 준비중'}</option>`;
  }).join('');
  $('navHome').classList.toggle('on', st.view!=='gloss');
  $('navGloss').classList.toggle('on', st.view==='gloss');
  const v = $('view');
  if (st.view==='home') v.innerHTML = homeHtml();
  else if (st.view==='chap') v.innerHTML = chapHtml();
  else if (st.view==='sect') v.innerHTML = sectHtml();
  else if (st.view==='gloss') v.innerHTML = glossHtml();
  else if (st.view==='search') v.innerHTML = searchHtml(st.q);
  hydrate();
}

function homeHtml(){
  const f = flat(), tot = totProg();
  const cards = chapters().map((c,ci)=>{
    const p = chProg(c), ready = c.sections.length>0, circ = 2*Math.PI*14.5;
    const lock = ready && c.sections.every(x => x.locked);
    return `<button class="chcard reveal${ready?'':' soon'}${lock?' lock':''}"${ready?` data-go='{"view":"chap","ci":${ci}}'`:' disabled'}>
      <div class="no">CHAPTER ${String(ci+1).padStart(2,'0')}</div>
      <h3>${esc(c.title)}</h3><p>${esc(c.blurb||'')}</p>
      <div class="meta">
        <svg class="ring" viewBox="0 0 34 34"><circle class="tr" cx="17" cy="17" r="14.5"/>
          <circle class="pr" cx="17" cy="17" r="14.5" stroke-dasharray="${circ}"
            stroke-dashoffset="${circ*(1-p/100)}" transform="rotate(-90 17 17)"/>
          <text x="17" y="20.5" text-anchor="middle">${p}%</text></svg>
        <span>${ready ? c.sections.length+'개 절' : '집필 중'}</span>
        <span class="go">${lock ? '🔒 이용권' : ready ? '학습하기' : ''}</span>
      </div></button>`;
  }).join('');
  return `<section class="hero">
      <div class="eyebrow">${esc(st.subj)}</div>
      <h1>조문에서 시작하는<br>손해사정사 교재.</h1>
      <p class="sub">${esc(BOOK[st.subj].desc)} 파란 <i class="tm" style="pointer-events:none">용어</i>와 색 박스는 눌러서 자세히 볼 수 있습니다.</p>
      <div class="stats">
        <div><b>${chapters().length}</b><span>장</span></div>
        <div><b>${f.length}</b><span>절</span></div>
        <div><b>${chapters().reduce((a,c)=>a+c.sections.reduce((x,s)=>x+(s.cards||[]).length,0),0)}</b><span>암기 카드</span></div>
        <div><b>${tot}%</b><span>학습 진도</span></div>
      </div>
    </section>
    ${FREE_MODE ? freeBand() : ''}
    <div class="chgrid">${cards}</div>`;
}

function freeBand(){
  return `<div class="freeband">지금은 <b>무료 범위(보험업법 제1장 총칙)</b>만 열려 있습니다.
    자물쇠가 걸린 장·절은 이용권을 켜면 모두 열립니다.
    <a href="./index.html">기출 앱에서 이용권 열기 →</a></div>`;
}

function chapHtml(){
  const c = chapters()[st.ci];
  const rows = c.sections.map((s,si)=>`
    <button class="secrow reveal${isRead(s)?' done':''}${s.locked?' lock':''}" data-go='{"view":"sect","ci":${st.ci},"si":${si}}'>
      <div class="dot">${s.locked?'🔒':isRead(s)?'✓':''}</div>
      <div><div class="tt">${esc(s.title)}</div><div class="ds">${s.minutes||8}분 · ${esc(s.desc||'')}</div></div>
      <div class="arr">›</div>
    </button>`).join('');
  return `<div class="chhead">
      <div class="crumb"><a data-go='{"view":"home"}'>${esc(st.subj)}</a><span>›</span><span>제${st.ci+1}장</span></div>
      <h1>${esc(c.title)}</h1><p>${esc(c.blurb||'')}</p>
    </div><div class="seclist">${rows}</div>`;
}

function sectHtml(){
  const f = flat(); const idx = f.findIndex(x=>x.ci===st.ci && x.si===st.si);
  if (idx < 0) return '<div class="empty"><h2>준비 중인 절입니다</h2></div>';
  const { c, s } = f[idx];
  if (s.locked) return `<div class="readhead">
      <div class="crumb"><a data-go='{"view":"home"}'>${esc(st.subj)}</a><span>›</span>
        <a data-go='{"view":"chap","ci":${st.ci}}'>${esc(c.title)}</a></div>
      <div class="kicker" style="margin-top:14px">${esc(c.title)} · ${st.si+1}절</div>
      <h1>${esc(s.title)}</h1></div>
    <div class="empty lockbox"><h2>🔒 이용권이 있어야 열립니다</h2>
      <p>결제 전에는 보험업법 제1장 「총칙」만 볼 수 있습니다.<br>이용권을 켜면 교재 55절이 모두 열립니다.</p>
      <p><a class="gbtn" href="./index.html">기출 앱에서 이용권 열기 →</a></p></div>
    <div class="rnav">
      <button ${idx===0?'disabled':''} data-nav="${idx-1}">← 이전</button>
      <span class="mid">${idx+1} / ${f.length}</span>
      <button ${idx===f.length-1?'disabled':''} data-nav="${idx+1}">다음 →</button>
    </div>`;
  const cards = (s.cards && s.cards.length) ? `
    <div class="fcwrap"><h2>암기 카드</h2>
      <p class="hint">카드를 누르면 답이 뒤집혀 나옵니다. 소리 내어 답한 뒤 확인하세요.</p>
      <div class="fcgrid">${s.cards.map(cd=>`
        <button class="fc"><div class="fc-in">
          <div class="fc-f"><div><span class="q">QUESTION</span>${esc(cd[0])}</div></div>
          <div class="fc-b"><div>${cd[1]}</div></div>
        </div></button>`).join('')}
      </div></div>` : '';
  const exq = (s.exq && s.exq.length) ? `
    <div class="exqwrap"><h2>이 절에서 출제된 기출</h2>
      <p class="hint">5개년 600문항 가운데 ${s.exq.length}문항이 이 절의 내용에서 나왔습니다. 누르면 기출 앱에서 그 문항이 열립니다.</p>
      <ol class="exq">${s.exq.map(x=>`
        <li><a href="./index.html?r=${x[0]}&s=${encodeURIComponent(x[1])}&n=${x[2]}">
          <span class="rn">제${x[0]}회 ${esc(x[1])} ${x[2]}번</span>
          <span class="qt">${esc(x[3])}</span></a></li>`).join('')}
      </ol></div>` : '';
  return `<div class="readhead">
      <div class="crumb"><a data-go='{"view":"home"}'>${esc(st.subj)}</a><span>›</span>
        <a data-go='{"view":"chap","ci":${st.ci}}'>${esc(c.title)}</a></div>
      <div class="kicker" style="margin-top:14px">${esc(c.title)} · ${st.si+1}절</div>
      <h1>${esc(s.title)}</h1>
      <p class="lead">${esc(s.lead||'')}</p>
      <div class="rmeta"><span>약 ${s.minutes||8}분</span><span>파란 용어·색 박스 = 눌러서 상세</span>
        ${s.src?`<span>근거 ${esc(s.src)}</span>`:''}</div>
    </div>
    <article class="doc">${s.html}${exq}${cards}</article>
    <div class="rnav">
      <button ${idx===0?'disabled':''} data-nav="${idx-1}">← 이전</button>
      <span class="mid">${idx+1} / ${f.length}</span>
      <button class="read${isRead(s)?' ok':''}" id="readBtn">${isRead(s)?'✓ 읽음':'읽음 표시'}</button>
      <button ${idx===f.length-1?'disabled':''} data-nav="${idx+1}">다음 →</button>
    </div>`;
}

function glossHtml(){
  return `<div class="glhead"><h1>용어사전</h1>
    <p>교재에 나오는 ${Object.keys(TERMS).length}개 용어를 조문 근거와 함께 모았습니다.
       위 검색창에 입력하면 본문과 함께 즉시 찾습니다.</p></div>` + $('glossPre').innerHTML;
}

function searchHtml(q){
  q = (q || '').trim();
  if (q.length < 2) return `<div class="empty"><h2>두 글자 이상 입력해 주세요</h2>
    <p>본문 ${SEARCH.length}개 절과 용어 ${Object.keys(TERMS).length}개를 함께 찾습니다.</p></div>`;
  const lq = q.toLowerCase();
  const hits = [];
  for (let i = 0; i < SEARCH.length && hits.length < 60; i++) {
    const e = SEARCH[i];
    const at = e.lc.indexOf(lq);
    if (at < 0) continue;
    hits.push({ e, snip: e.t.slice(Math.max(0, at - 42), at + 88) });
  }
  const terms = TLC.filter(e => e.lc.includes(lq)).slice(0, 30).map(e => e.k);
  if (!hits.length && !terms.length) return `<div class="empty"><h2>“${esc(q)}” 결과가 없습니다</h2>
    <p>다른 낱말로 찾아보세요.</p></div>`;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const mark = t => esc(t).replace(re, m => '<mark>' + m + '</mark>');
  return `<div class="glhead"><h1>“${esc(q)}”</h1>
      <p>본문 ${hits.length}건 · 용어 ${terms.length}건</p></div>
    ${hits.map(h => `<div class="glrow hit" data-go='{"subj":"${esc(h.e.s)}","view":"sect","ci":${h.e.c},"si":${h.e.i}}'>
      <b>${esc(h.e.title)}</b><span>…${mark(h.snip)}…</span>
      <div class="src">${esc(h.e.s)} · ${esc(h.e.chap)}</div></div>`).join('')}
    ${terms.map(k => `<div class="glrow"><b>${mark(k)}</b><span>${mark(TERMS[k].d)}</span>
      ${TERMS[k].src ? `<div class="src">${esc(TERMS[k].src)}</div>` : ''}</div>`).join('')}`;
}

/* ── 시트 ── */
const BXMETA = { c:['개념','개념 정리'], e:['사례','사례로 보기'], t:['함정','시험 함정'],
                 i:['참고','알아 두기'], d:['심화','한 걸음 더'] };
function openSheet(html){
  $('sheet').innerHTML = `<button class="close" id="sheetClose" aria-label="닫기">✕</button>${html}`;
  $('ov').classList.add('on');
}
const closeSheet = () => $('ov').classList.remove('on');

/* ── 이벤트 ── */
document.addEventListener('click', e => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) { const n = JSON.parse(goEl.dataset.go);
    if (n.subj) { st.subj = n.subj; delete n.subj; } go(n); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav) { const f = flat(); const i = Number(nav.dataset.nav);
    if (i>=0 && i<f.length) go({ view:'sect', ci:f[i].ci, si:f[i].si }); return; }
  if (e.target.closest('#readBtn')) {
    const s = flat().find(x=>x.ci===st.ci && x.si===st.si).s;
    const k = rkey(s); readSet.has(k) ? readSet.delete(k) : readSet.add(k);
    saveRead(); render(); return;
  }
  const fc = e.target.closest('.fc'); if (fc) { fc.classList.toggle('flip'); return; }
  const bx = e.target.closest('.bx');
  if (bx) {
    const kind = [...bx.classList].find(c=>BXMETA[c]) || 'c';
    const h5 = bx.querySelector('h5').cloneNode(true);
    const bdg = h5.querySelector('.bdg'); if (bdg) bdg.remove();
    const d = bx.querySelector('.bx-d');
    openSheet(`<div class="kind">${BXMETA[kind][1]}</div><h3>${esc(h5.textContent.trim())}</h3>
      <div class="body">${bx.querySelector('.bx-s').innerHTML}${d ? d.innerHTML : ''}</div>`);
    return;
  }
  const tm = e.target.closest('.tm');
  if (tm && TERMS[tm.textContent.trim()]) {
    const k = tm.textContent.trim(), t = TERMS[k];
    openSheet(`<div class="kind">용어</div><h3>${esc(k)}</h3>
      <div class="body">${esc(t.d)}${t.more?`<p style="margin-top:10px">${esc(t.more)}</p>`:''}
      ${t.src?`<p style="margin-top:12px;font-family:var(--m);font-size:11.5px;color:var(--tx5)">${esc(t.src)}</p>`:''}</div>`);
    return;
  }
  if (e.target.closest('#sheetClose') || e.target.id === 'ov') closeSheet();
  if (e.target.closest('#navHome') || e.target.closest('#logoBtn')) go({ view:'home' });
  if (e.target.closest('#navGloss')) go({ view:'gloss' });
});
$('subjSel').onchange = e => { st.subj = e.target.value; go({ view:'home', ci:0, si:0 }); };

let qT;
$('q').addEventListener('input', e => {
  const v = e.target.value;
  clearTimeout(qT);
  qT = setTimeout(() => {
    if (!v) { if (st.view === 'search') go({ view:'home' }); return; }
    st.q = v;
    if (st.view !== 'search') go({ view:'search' });
    else { $('view').innerHTML = searchHtml(v); hydrate(); }
  }, 110);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key === '/' && !e.target.matches('input,select,textarea')) { e.preventDefault(); $('q').focus(); return; }
  if (st.view !== 'sect' || $('ov').classList.contains('on')) return;
  if (e.target.matches('input, select, textarea')) return;
  const f = flat(); const idx = f.findIndex(x=>x.ci===st.ci && x.si===st.si);
  if (e.key === 'ArrowRight' && idx < f.length-1) go({ view:'sect', ci:f[idx+1].ci, si:f[idx+1].si });
  if (e.key === 'ArrowLeft' && idx > 0) go({ view:'sect', ci:f[idx-1].ci, si:f[idx-1].si });
});

/* ── 애플 효과 ── */
addEventListener('scroll', () => {
  const h = document.documentElement;
  $('scrollbar').style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight || 1) * 100) + '%';
}, { passive: true });

let io = null;
function hydrate(){
  document.querySelectorAll('.bx').forEach(b=>{
    if(!b.querySelector('.more')){ const m=document.createElement('span');
      m.className='more'; m.textContent='자세히'; b.appendChild(m); }
  });
  document.querySelectorAll('.doc h2,.doc h3,.doc p,.doc table,.doc ul,.doc ol,.law,.bx,.exqwrap,.fcwrap,.chcard,.secrow,.glrow')
    .forEach(el=>el.classList.add('reveal'));
  if (io) io.disconnect();
  io = new IntersectionObserver(es=>es.forEach(en=>{
    if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
  }), { threshold:.06 });
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
}

/* ── 밤모드 고정 — 낮모드는 없앴다 ── */
document.documentElement.setAttribute('data-theme', 'dark');

/* ══ 이용권 게이트 ═══════════════════════════════════════════
   배포본에는 본문이 박혀 있지 않다(BOOK=null). 이용권이 있는 계정만
   /api/content 로 받아 온다. 로컬 미리보기본은 BOOK 이 채워져 있어 그대로 열린다. */
function gateScreen(kind, msg){
  const body = {
    anon: ['로그인이 필요합니다',
      '회원가입(로그인)을 하면 교재 「총칙」을 무료로 볼 수 있고, 이용권을 켜면 55절이 모두 열립니다.', '기출 앱에서 가입·로그인 →'],
    unpaid: ['이용권이 필요합니다',
      '보험업법 25절 · 보험계약법 14절 · 손해사정이론 16절, 조문 원문 76블록과 암기 카드 457장이 들어 있습니다. 기출 앱에서 이용권을 켜면 바로 열립니다.', '이용권 열기 →'],
    fail: ['교재를 불러오지 못했습니다', msg || '잠시 후 다시 시도해 주세요.', '기출 앱으로 →'],
  }[kind];
  document.getElementById('view').innerHTML =
    `<section class="hero"><div class="eyebrow">전자교재</div>
      <h1>${body[0]}</h1><p class="sub">${body[1]}</p>
      <div class="stats"><a class="gbtn" href="./index.html">${body[2]}</a></div></section>`;
}

/* 주소로 들어온 요청 — ?sec=과목|장|절 이면 그 절을 바로 열고, ?q=낱말 이면 검색한다 */
function deepLink(){
  const u = new URLSearchParams(location.search);
  const sec = u.get('sec');
  if (sec) {
    const [subj, c, i] = sec.split('|');
    const ch = BOOK[subj] && BOOK[subj].chapters[+c];
    if (ch && ch.sections[+i]) { st.subj = subj; st.ci = +c; st.si = +i; st.view = 'sect'; return; }
  }
  const p = u.get('q');
  if (p) { $('q').value = p; st.q = p; st.view = 'search'; }
}

function openFree(){
  if (!FREE || !FREE.BOOK) { gateScreen('unpaid'); return; }
  FREE_MODE = true;
  Object.assign(BOOK, FREE.BOOK);
  Object.assign(TERMS, FREE.TERMS || {});
  SEARCH.push(...(FREE.SEARCH || []));
  SEARCH.forEach(e => { if (!e.lc) e.lc = e.t.toLowerCase(); });
  TLC.push(...Object.keys(TERMS).map(k => ({
    k, lc: (k + ' ' + TERMS[k].d + ' ' + (TERMS[k].more || '')).toLowerCase() })));
  st.subj = Object.keys(BOOK)[0];
  deepLink();
  render();
}

(async function boot(){
  if (BOOK && Object.keys(BOOK).length) {          // 내장본 — 그대로 연다
    deepLink();
    render(); return;
  }
  let auth = null;
  try { auth = JSON.parse(localStorage.getItem('sonsa:auth') || 'null'); } catch(e){}
  if (!auth || !auth.token) { gateScreen('anon'); return; }
  try {
    // 현재 폴더 기준 — smart-yourtest.com/sonsa/ 아래에서는 /sonsa/api 로 간다
    const BASE = location.pathname.replace(/\/[^/]*$/, '');
    const r = await fetch(BASE + '/api/content', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token: auth.token, doc: 'book' }),
    });
    const d = await r.json().catch(()=>({}));
    if (r.status === 402) { openFree(); return; }
    if (!r.ok || !d.data) { gateScreen('fail', d.error); return; }
    Object.assign(BOOK, d.data.BOOK || {});
    Object.assign(TERMS, d.data.TERMS || {});
    SEARCH.push(...(d.data.SEARCH || []));
    SEARCH.forEach(e => { if (!e.lc) e.lc = e.t.toLowerCase(); });
    TLC.push(...Object.keys(TERMS).map(k => ({
      k, lc: (k + ' ' + TERMS[k].d + ' ' + (TERMS[k].more || '')).toLowerCase() })));
    if (d.data.GLOSS) $('glossPre').innerHTML = d.data.GLOSS;
    st.subj = Object.keys(BOOK)[0];
    deepLink();
    render();
  } catch (e) { gateScreen('fail', e.message); }
})();
</script>
