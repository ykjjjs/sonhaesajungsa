<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>손해사정사 1차 · 기출 문제풀이</title>
<meta name="theme-color" content="#0A0A0C">
<meta name="description" content="손해사정사 1차 5개년 기출 600문항 — 보험업법 · 보험계약법 · 손해사정이론">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* ══════════════════════════════════════════════════════════════
   손해사정사 1차 기출 · S2S 디자인 언어
   메탈블랙(무대) · 은빛크리스탈(글자) · 블루사파이어(강조 한 곳)
   ══════════════════════════════════════════════════════════════ */
:root{
  --void:#000; --bg:#0A0A0C; --surf:#141417; --surf2:#101013;
  --edge:#232328; --lift:#2E2E35;
  --tx:#F5F5F7; --tx2:#D6DBE3; --tx3:#9AA3B0; --tx4:#646C7A; --tx5:#3A404B;
  --sap:#1552D6; --sap2:#3E9BFF; --sap3:#8FD0FF; --sap-deep:#0A2A6E;
  --grad:linear-gradient(135deg,#06153F 0%,#0A2A6E 26%,#1552D6 62%,#3E9BFF 100%);
  --crystal:linear-gradient(180deg,#FFFFFF 0%,#C4CCD8 62%,#7F8794 100%);
  --glass:linear-gradient(160deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 42%,rgba(255,255,255,0) 100%);
  --ok:#4CC38A; --warn:#C9903A; --bad:#E0574F;
  --r:14px; --rp:999px;
  --f:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'SF Pro Display','Apple SD Gothic Neo',system-ui,sans-serif;
  --m:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.28,.11,.32,1);
  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 낮 모드 ──────────────────────────────────────────────
   무대를 뒤집되 재질 논리는 그대로: 종이빛 은판 위에 사파이어 한 곳.
   회색을 새로 만들지 않고 은빛 5단계의 명암만 뒤집는다. */
:root[data-theme="light"]{
  --void:#FFFFFF; --bg:#F2F3F6; --surf:#FFFFFF; --surf2:#FAFAFB;
  --edge:#E1E4EA; --lift:#C7CCD6;
  --tx:#0A0A0C; --tx2:#2C313A; --tx3:#5B636F; --tx4:#858C99; --tx5:#AEB4BF;
  --crystal:linear-gradient(180deg,#1D1D1F 0%,#3C424D 58%,#6B7280 100%);
  --glass:linear-gradient(160deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.35) 42%,rgba(255,255,255,0) 100%);
  --ok:#1D7D46; --warn:#9A6A18; --bad:#C8332C;
}
:root[data-theme="light"] .card{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(16,24,40,.06),0 16px 40px -24px rgba(16,24,40,.28)}
:root[data-theme="light"] .sheet{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 20px 60px -24px rgba(16,24,40,.35)}
:root[data-theme="light"] header{background:var(--surf)}
:root[data-theme="light"] .nav{background:rgba(242,243,246,.86)}
:root[data-theme="light"] .toast{box-shadow:0 12px 40px -16px rgba(16,24,40,.3)}
:root[data-theme="light"] .opt.sel{background:rgba(21,82,214,.07)}
:root[data-theme="light"] .opt.correct{background:rgba(29,125,70,.09)}
:root[data-theme="light"] .opt.wrong{background:rgba(200,51,44,.07)}
:root[data-theme="light"] .opt.correct .n{color:#FFFFFF}
:root[data-theme="light"] .opt.wrong .n{color:#FFFFFF}
:root[data-theme="light"] .verdict.ok .mark{background:rgba(29,125,70,.14)}
:root[data-theme="light"] .verdict.no .mark{background:rgba(200,51,44,.13)}
:root[data-theme="light"] .tag.hist-ok{border-color:rgba(29,125,70,.35)}
:root[data-theme="light"] .tag.hist-no{border-color:rgba(200,51,44,.35)}
:root[data-theme="light"] .tag.ocr{border-color:rgba(154,106,24,.35)}


*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx2);font-family:var(--f);font-size:16px;
  line-height:1.65;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(104px + env(safe-area-inset-bottom))}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sap2);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}

/* ── 머리 ── */
header{border-bottom:1px solid var(--edge);background:var(--surf2);position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:auto 0 -1px 0;height:1px;background:linear-gradient(90deg,rgba(21,82,214,0) 0%,rgba(62,155,255,.5) 50%,rgba(21,82,214,0) 100%)}
.htop{display:flex;align-items:center;gap:var(--sp-4);padding:18px 0;flex-wrap:wrap}
.brand{flex:1;min-width:200px}
.kick{font-family:var(--m);font-size:10.5px;letter-spacing:.14em;color:var(--tx4);text-transform:uppercase}
h1{margin-top:5px;font-size:clamp(20px,3.2vw,27px);font-weight:800;letter-spacing:-.035em;
  line-height:1.12;background:var(--crystal);-webkit-background-clip:text;background-clip:text;color:transparent}
.who{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--tx3);white-space:nowrap}
.who .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.who .dot.local{background:var(--warn)}
.bookLink{font-size:13px;font-weight:700;color:var(--sap2);text-decoration:none;
  padding:8px 13px;border-radius:var(--rp);border:1px solid var(--edge);background:var(--surf);
  white-space:nowrap;transition:border-color .18s var(--ease),background .18s var(--ease)}
.bookLink:hover{border-color:rgba(62,155,255,.45);background:rgba(21,82,214,.10)}
.themeBtn{width:40px;height:40px;padding:0;border-radius:50%;border:1px solid var(--edge);
  background:var(--surf);color:var(--tx3);cursor:pointer;display:grid;place-items:center;flex:none;
  transition:border-color .18s var(--ease),color .18s var(--ease)}
.themeBtn:hover{border-color:var(--lift);color:var(--tx)}
.themeBtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.themeBtn .sun{display:none} :root[data-theme="light"] .themeBtn .sun{display:block}
:root[data-theme="light"] .themeBtn .moon{display:none}

/* ── 지표 ── */
.stats{display:flex;gap:var(--sp-6);padding:0 0 16px;flex-wrap:wrap}
.st b{display:block;font-family:var(--m);font-size:19px;font-weight:700;color:var(--tx);letter-spacing:-.02em;line-height:1.2}
.st span{font-size:10.5px;letter-spacing:.06em;color:var(--tx4)}
.st.acc b{color:var(--tx)}

/* ── 조작줄 ── */
.bar{display:flex;gap:var(--sp-2);padding:0 0 16px;flex-wrap:wrap;align-items:center}
.sel{position:relative}
.sel select{appearance:none;border:1px solid var(--edge);background:var(--surf);border-radius:10px;
  height:36px;padding:0 32px 0 12px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;
  outline:none;transition:border-color .18s var(--ease),color .18s var(--ease)}
.sel select:hover{border-color:var(--lift);color:var(--tx)}
.sel::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;pointer-events:none;
  border-right:1.5px solid var(--tx4);border-bottom:1.5px solid var(--tx4);transform:translateY(-70%) rotate(45deg)}
.sp{flex:1}

/* ── 애플 효과 ── */
#scrollbar{position:fixed;top:0;left:0;height:2px;width:0;z-index:100;background:var(--grad);
  border-radius:0 2px 2px 0;transition:width .12s linear}
.reveal{opacity:0;transform:translateY(12px);
  transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.in{opacity:1;transform:none}
.card{animation:cardRise .44s var(--ease) both}
@keyframes cardRise{from{opacity:0;transform:translateY(14px) scale(.994)}to{opacity:1;transform:none}}
.opt{animation:optIn .42s var(--ease) both}
.opt:nth-child(1){animation-delay:.03s} .opt:nth-child(2){animation-delay:.07s}
.opt:nth-child(3){animation-delay:.11s} .opt:nth-child(4){animation-delay:.15s}
@keyframes optIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.opt:active:not(:disabled){transform:scale(.988)}
.verdict,.expl,.why,.terms,.srcnote{animation:optIn .5s var(--ease) both;animation-delay:.06s}
.st b{transition:color .3s var(--ease)}
@media(prefers-reduced-motion:reduce){
  .card,.opt,.verdict,.expl,.why,.terms,.srcnote{animation:none}
  .reveal{opacity:1;transform:none}
}

/* ── 진도 ── */
.prog{height:2px;background:var(--edge);border-radius:2px;overflow:hidden;margin-bottom:var(--sp-5)}
.prog i{display:block;height:100%;width:0;background:var(--grad);transition:width .38s var(--ease)}

/* ── 문항 카드 ── */
main{padding:var(--sp-5) 0}
.card{position:relative;background:var(--surf);border:1px solid var(--edge);border-radius:22px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 8px rgba(0,0,0,.5),0 20px 60px -20px rgba(0,0,0,.9);
  padding:clamp(20px,3vw,30px);overflow:hidden}
.card::before{content:"";position:absolute;inset:0;background:var(--glass);pointer-events:none;border-radius:inherit}
.qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-family:var(--m);font-size:10.5px;letter-spacing:.07em;color:var(--tx4);
  border:1px solid var(--edge);border-radius:var(--rp);padding:3px 10px}
.tag.hist-ok{color:var(--ok);border-color:rgba(76,195,138,.35)}
.tag.hist-no{color:var(--bad);border-color:rgba(224,87,79,.38)}
.tag.ocr{color:var(--warn);border-color:rgba(201,144,58,.35)}
.qno{font-family:var(--m);font-size:12px;color:var(--tx4);letter-spacing:.04em}
.stem{font-size:clamp(16.5px,1.9vw,18.5px);line-height:1.62;color:var(--tx);letter-spacing:-.015em;
  word-break:keep-all;margin-bottom:var(--sp-5)}

/* ── 보기 ── */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{position:relative;display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;
  padding:14px 16px;border:1px solid var(--edge);border-radius:var(--r);background:var(--surf2);
  color:var(--tx2);font-size:15.5px;line-height:1.58;letter-spacing:-.01em;cursor:pointer;
  min-height:44px;word-break:keep-all;
  transition:border-color .18s var(--ease),background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease)}
.opt:hover:not(:disabled){border-color:var(--lift);color:var(--tx);transform:translateY(-1px)}
.opt .n{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--edge);
  display:grid;place-items:center;font-family:var(--m);font-size:11.5px;color:var(--tx4);margin-top:1px;
  transition:border-color .18s var(--ease),color .18s var(--ease),background .18s var(--ease)}
.opt.sel{border-color:rgba(62,155,255,.55);background:rgba(21,82,214,.10);color:var(--tx)}
.opt.sel .n{background:var(--grad);border-color:transparent;color:#fff}
.opt.correct{border-color:rgba(76,195,138,.55);background:rgba(76,195,138,.09);color:var(--tx)}
.opt.correct .n{background:var(--ok);border-color:transparent;color:#08130D}
.opt.wrong{border-color:rgba(224,87,79,.5);background:rgba(224,87,79,.08)}
.opt.wrong .n{background:var(--bad);border-color:transparent;color:#1A0605}
.opt:disabled{cursor:default}
.opt.dim{opacity:.5}

/* ── 판정 · 해설 ── */
.verdict{display:flex;align-items:center;gap:10px;margin-top:var(--sp-5);padding-top:var(--sp-5);
  border-top:1px solid var(--edge);font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.verdict .mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:800;flex:none}
.verdict.ok .mark{background:rgba(76,195,138,.16)} .verdict.no .mark{background:rgba(224,87,79,.16)}
.verdict .sub{margin-left:auto;font-family:var(--m);font-size:11px;font-weight:400;color:var(--tx4);letter-spacing:.05em}
.expl{margin-top:14px;font-size:14.5px;line-height:1.7;color:var(--tx3);word-break:keep-all}
.expl.empty{color:var(--tx5);font-style:normal}
.why{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.why div{font-size:13.5px;line-height:1.6;color:var(--tx4);padding-left:22px;position:relative;word-break:keep-all}
.why div b{position:absolute;left:0;top:0;font-family:var(--m);font-size:11px;color:var(--tx5)}
.terms{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.term{border:1px solid var(--edge);border-radius:var(--r);padding:9px 12px;max-width:100%;
  background:var(--surf2)}
.term b{display:block;font-size:12.5px;color:var(--tx2);font-weight:700;letter-spacing:-.01em}
.term span{display:block;font-size:12px;color:var(--tx4);line-height:1.55;margin-top:2px;word-break:keep-all}
.srcnote{margin-top:14px;font-family:var(--m);font-size:11px;letter-spacing:.03em;color:var(--tx5)}
.srcnote.warn{color:var(--warn)}

/* ── 빈 화면 ── */
/* ══ 탭 ══ */
.tabs{display:flex;gap:4px;padding:0 0 14px}
.tab{position:relative;border:none;background:none;cursor:pointer;font:inherit;
  font-size:13.5px;font-weight:700;color:var(--tx4);padding:8px 14px;border-radius:10px;
  display:flex;align-items:center;gap:7px;transition:color .2s var(--ease),background .2s var(--ease)}
.tab:hover{color:var(--tx2);background:rgba(127,135,148,.10)}
.tab.on{color:var(--tx);background:rgba(127,135,148,.13)}
.tab .bdg{font-family:var(--m);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;
  background:var(--edge);color:var(--tx3);letter-spacing:.02em}
.tab.on .bdg{background:var(--sap);color:#fff}
.tab .bdg.due{background:var(--bad);color:#fff}

/* ══ 오답 노트 ══ */
.nsec{margin-bottom:var(--sp-6)}
.nsec > h2{font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--tx);margin:0 0 4px;
  display:flex;align-items:baseline;gap:9px}
.nsec > h2 em{font-style:normal;font-family:var(--m);font-size:11px;font-weight:700;color:var(--tx4);letter-spacing:.05em}
.nsec > p.hint{font-size:12.5px;color:var(--tx4);margin:0 0 14px}

.ncards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
.ncard{position:relative;background:var(--surf);border:1px solid var(--edge);border-radius:16px;
  padding:16px 17px;overflow:hidden}
.ncard::before{content:"";position:absolute;inset:0;background:var(--glass);pointer-events:none}
.ncard b{display:block;font-family:var(--m);font-size:26px;font-weight:700;color:var(--tx);letter-spacing:-.03em;line-height:1.1}
.ncard span{display:block;font-size:11px;color:var(--tx4);letter-spacing:.05em;margin-top:5px}
.ncard.hot b{color:var(--bad)}
.ncard.star b{color:var(--warn)}

.duegrid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.duechip{border:1px solid var(--edge);background:var(--surf2);border-radius:12px;padding:9px 13px;
  font-size:12.5px;color:var(--tx3);display:flex;align-items:center;gap:8px}
.duechip b{font-family:var(--m);font-size:14px;color:var(--tx);font-weight:700}
.duechip.d0{border-color:rgba(224,87,79,.42);color:var(--bad)}
.duechip.d0 b{color:var(--bad)}

/* 취약점 막대 */
.wk{display:grid;grid-template-columns:minmax(88px,auto) 1fr auto;gap:10px 12px;align-items:center;
  font-size:13px;margin-bottom:6px}
.wk .nm{color:var(--tx2);font-weight:600;white-space:nowrap}
.wk .tr{height:8px;border-radius:99px;background:var(--edge);overflow:hidden}
.wk .tr i{display:block;height:100%;width:0;border-radius:99px;background:var(--grad);
  transition:width .6s var(--ease)}
.wk .tr i.hot{background:linear-gradient(90deg,#8C2A25 0%,#E0574F 100%)}
.wk .vl{font-family:var(--m);font-size:11.5px;color:var(--tx4);white-space:nowrap}
.wk .vl b{color:var(--tx2);font-weight:700}

/* 필터 칩 */
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.fchip{border:1px solid var(--edge);background:var(--surf);border-radius:99px;padding:7px 13px;
  font:inherit;font-size:12.5px;font-weight:600;color:var(--tx4);cursor:pointer;
  transition:all .2s var(--ease)}
.fchip:hover{border-color:var(--lift);color:var(--tx2)}
.fchip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px -10px rgba(21,82,214,.9)}

/* 오답 목록 */
.grp{margin-bottom:var(--sp-5)}
.grp > h3{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--tx4);
  display:flex;align-items:center;gap:9px;padding:0 2px 8px;border-bottom:1px solid var(--edge);margin:0 0 2px}
.grp > h3 em{font-style:normal;font-family:var(--m);margin-left:auto;color:var(--tx5)}
.nrow{width:100%;text-align:left;border:none;background:none;font:inherit;cursor:pointer;
  display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;
  padding:13px 10px;border-bottom:1px solid var(--edge);border-radius:10px;
  transition:background .18s var(--ease)}
.nrow:hover{background:rgba(127,135,148,.08)}
.nrow .no{font-family:var(--m);font-size:12px;font-weight:700;color:var(--tx4);padding-top:1px;min-width:26px}
.nrow .tt{font-size:14px;color:var(--tx2);line-height:1.5;word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nrow .rt{display:flex;align-items:center;gap:7px;padding-top:1px}
.nrow .sub{grid-column:2/4;display:flex;gap:9px;flex-wrap:wrap;align-items:center;
  font-family:var(--m);font-size:11px;color:var(--tx5);margin-top:5px}
.nrow .sub .pk{color:var(--bad);font-weight:700}
.nrow .sub .an{color:var(--ok);font-weight:700}
.nrow .sub .rep{color:var(--warn);font-weight:700}
.nrow .memo{grid-column:2/4;font-size:12.5px;color:var(--tx3);margin-top:6px;padding:7px 11px;
  border-left:2px solid var(--sap2);background:var(--surf2);border-radius:0 8px 8px 0;
  white-space:pre-wrap;word-break:keep-all;line-height:1.55}
.starBtn{border:none;background:none;cursor:pointer;font-size:15px;line-height:1;padding:3px 4px;
  color:var(--tx5);transition:color .18s var(--ease),transform .18s var(--ease)}
.starBtn:hover{transform:scale(1.18)}
.starBtn.on{color:var(--warn)}

.mini{width:100%;text-align:left;border:none;background:none;font:inherit;cursor:pointer;
  display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
  border-bottom:1px solid var(--edge);transition:background .18s var(--ease)}
.mini:hover{background:rgba(127,135,148,.08)}
.mini .mno{font-family:var(--m);font-size:10.5px;color:var(--tx5);white-space:nowrap;flex:none}
.mini .mtt{font-size:13px;color:var(--tx2);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .mct{font-family:var(--m);font-size:11px;font-weight:700;color:var(--bad);flex:none}

@media(max-width:560px){
  .mini{flex-wrap:wrap;gap:3px 9px;padding:10px}
  .mini .mtt{flex:1 1 100%;white-space:normal;order:3;font-size:12.5px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .nsec > h2{font-size:14.5px}
  .nrow{padding:12px 6px;gap:3px 9px}
}

/* 문항 카드 안의 메모 */
.memobox{margin-top:var(--sp-4);border-top:1px solid var(--edge);padding-top:var(--sp-4)}
.memobox label{display:block;font-family:var(--m);font-size:10.5px;font-weight:700;letter-spacing:.08em;
  color:var(--tx4);margin-bottom:7px}
.memobox textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--edge);
  background:var(--surf2);color:var(--tx2);border-radius:12px;padding:11px 13px;
  font:inherit;font-size:14px;line-height:1.6;outline:none;transition:border-color .2s var(--ease)}
.memobox textarea:focus{border-color:var(--sap2);box-shadow:0 0 0 3px rgba(62,155,255,.14)}
.memobox textarea::placeholder{color:var(--tx5)}
.blinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.blink{font-size:12px;font-weight:600;color:var(--sap2);text-decoration:none;
  border:1px solid rgba(62,155,255,.28);background:rgba(21,82,214,.08);border-radius:99px;padding:6px 12px;
  transition:all .2s var(--ease)}
.blink:hover{border-color:rgba(62,155,255,.5);background:rgba(21,82,214,.15)}

.empty-state{text-align:center;padding:var(--sp-7) var(--sp-4);color:var(--tx4)}
.empty-state h2{font-size:19px;font-weight:800;letter-spacing:-.025em;color:var(--tx2);margin-bottom:8px}
.empty-state p{font-size:14px;max-width:44ch;margin:0 auto}

/* ── 하단 고정 조작 ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(10,10,12,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--edge);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.nav .in{display:flex;align-items:center;gap:9px}
.btn{padding:11px 18px;border-radius:var(--rp);border:1px solid var(--edge);background:var(--surf);
  color:var(--tx2);font-size:13.5px;font-weight:700;letter-spacing:-.01em;cursor:pointer;min-height:44px;
  transition:border-color .18s var(--ease),color .18s var(--ease),background .18s var(--ease)}
.btn:hover:not(:disabled){border-color:var(--lift);color:var(--tx)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;
  box-shadow:0 0 0 1px rgba(62,155,255,.3),0 8px 30px -10px rgba(21,82,214,.6)}
.btn.pri:hover:not(:disabled){color:#fff;border-color:transparent;
  box-shadow:0 0 0 1px rgba(62,155,255,.5),0 10px 34px -10px rgba(21,82,214,.75)}
.btn.pri:disabled{background:var(--surf);box-shadow:none;color:var(--tx5)}
.btn.sm{padding:9px 14px;font-size:12.5px;min-height:40px}
.count{flex:1;text-align:center;font-family:var(--m);font-size:12px;color:var(--tx4);letter-spacing:.05em}

/* ── 오버레이 ── */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:var(--sp-4)}
.ov.on{display:flex}
.sheet{position:relative;width:min(420px,100%);background:var(--surf);border:1px solid var(--edge);
  border-radius:22px;padding:clamp(22px,4vw,32px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 20px 60px -20px rgba(0,0,0,.9);
  animation:rise .38s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sheet h2{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--tx);margin-bottom:7px}
.sheet .sub{font-size:13.5px;color:var(--tx4);margin-bottom:var(--sp-5);word-break:keep-all;line-height:1.6}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11px;letter-spacing:.05em;color:var(--tx4);margin-bottom:5px}
.fld input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--edge);
  background:var(--surf2);outline:none;font-size:15px;
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.fld input:focus{border-color:var(--sap2);box-shadow:0 0 0 3px rgba(62,155,255,.15)}
.err{min-height:18px;font-size:12.5px;color:var(--bad);margin-bottom:10px;word-break:keep-all}
.swap{margin-top:14px;font-size:13px;color:var(--tx4);text-align:center}
.swap a{color:var(--sap2);cursor:pointer;text-decoration:none}
.swap a:hover{text-decoration:underline}
.note{margin-top:14px;font-size:11.5px;color:var(--tx5);line-height:1.55;word-break:keep-all}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:var(--surf);border:1px solid var(--edge);border-radius:var(--rp);padding:9px 18px;
  font-size:13px;font-weight:600;color:var(--tx2);box-shadow:0 12px 40px -12px rgba(0,0,0,.9);
  opacity:0;pointer-events:none;transition:opacity .24s var(--ease),transform .24s var(--ease);z-index:70}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:560px){
  /* 모달은 아래에서 올라오는 풀시트 */
  .ov{align-items:flex-end;padding:0}
  .sheet{width:100%;border-radius:22px 22px 0 0;border-bottom:none;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));animation:sheetUp .42s var(--ease) both}
  @keyframes sheetUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
  .stats{gap:var(--sp-5)}
  .nav .in{gap:7px}
  .btn{padding:11px 14px;font-size:13px}
  .btn.sm{padding:9px 11px}
}

 있었다고 볼 수 있다."], "answer": 2, "explanation": "", "wrongWhy": {}, "terms": []}, {"subject": "보험계약법", "no": 40, "importance": "mid", "q": "보험금청구권 소멸시효의 기산점에 관한 설명으로 옳은 것은? (다툼이 있는 경우 판례에 의함)", "choices": ["피해자가 스스로 자동차를 운전하다가 사망한 사건 에서 보험자가 피보험자에게 이 사고는 보험자 면책 사유에 해당한다고 잘못된 통보를 한 경우, 통보 시점이 보험금청구권 소멸시효의 기산점이다.", "보험사고가 발생하여 그 당시의 장해 상태에 따라 산정한 보험금을 지급받은 후에 당초의 장해 상태가 악화된 경우, 추가로 지급받을 수 있는 보험금청구권의 소멸시효는 당초의 보험사고가 발생한 때부터 진행 한다.", "책임보험에서 보험금청구권의 소멸시효는 피보험자의 제3자에 대한 법률상의 손해배상책임이 변제, 승인, 화해 또는 재판의 방법 등에 의하여 확정됨으로써 그 보험금청구권을 행사할 수 있는 때로부터 진행된다.", "상법은 보험금청구권 소멸시효는 원칙적으로 보험사고가 발생한 때부터 진행한다고 규정하고 있다."], "answer": 2, "explanation": "", "wrongWhy": {}, "terms": []}], "보험업법": [{"subject": "보험업법", "no": 1, "importance": "mid", "q": "보험업법상 용어의 정의에 관한 설명으로 옳지 않은 것은?", "choices": ["외국보험회사란 대한민국 이외의 국가의 법령에 따라 설립되어 대한민국 이외의 국가에서 보험업을 경영하는 자를 말한다.", "자회사란 보험회사가 다른 회사(민법 또는 특별법에 따른 조합을 포함)의 의결권 있는 발행주식(출자지분 을 포함) 총수의 100분의 10을 초과하여 소유하는 경우의 그 다른 회사를 말한다.", "모집이란 보험계약의 체결을 중개하거나 대리하는 것을 말한다.", "상호회사란 보험업을 경영할 목적으로 보험업법에 따라 설립된 회사로서 보험계약자를 사원으로 하는 회사를 말한다."], "answer": 1, "explanation": "정답은 ②이다. 보험업법 제2조 제18호는 자회사를 “보험회사가 다른 회사의 의결권 있는 발행주식 총수의 100분의 15를 초과하여 소유하는 경우의 그 다른 회사”로 정의한다. 지문은 이 비율을 100분의 10으로 적어 놓았으므로 틀렸다. 15%라는 기준선은 보험회사의 자회사 소유·승인 규제(제115조 이하)가 작동하는 출발점이라서, 숫자 하나만 바꿔 오답을 만들기 쉬운 자리다. 상법상 모자회사 기준(50% 초과)이나 공정거래법상 계열 기준과 헷갈리지 않도록, 보험업법의 자회사는 15% 초과라고 따로 외워 두는 편이 안전하다.", "wrongWhy": {"1": "외국보험회사의 정의(제2조 제8호)를 그대로 옮긴 지문이다. 설립준거법과 영업지가 모두 대한민국 밖이어야 한다는 두 요건이 정확히 들어가 있다.", "3": "모집의 정의(제2조 제12호)와 일치한다. 모집은 ‘체결의 중개 또는 대리’이며, 보험회사가 스스로 보험을 인수하는 행위는 모집이 아니다.", "4": "상호회사의 정의(제2조 제7호)와 일치한다. ‘보험업법에 따라 설립’, ‘보험계약자를 사원으로’라는 두 징표가 모두 들어 있다."}, "terms": [{"t": "자회사", "d": "보험회사가 의결권 있는 발행주식 총수의 100분의 15를 초과해 소유하는 회사(법 제2조 제18호)"}, {"t": "모집", "d": "보험계약의 체결을 중개하거나 대리하는 것(법 제2조 제12호)"}], "verify": "법"}, {"subject": "보험업법", "no": 2, "importance": "mid", "q": "보험업법상 보험업의 허가에 관한 설명으로 옳지 않은 것은?", "choices": ["보험종목별로 보험업의 허가를 받은 자(소액단기전문 보험회사는 제외)는 해당 보험종목의 재보험에 대한 허가를 받은 것으로 본다.", "손해보험업의 보험종목에는 재보험이 포함된다.", "보험종목 전부를 허가받은 보험종목 내에서 기존의 보험종목 이외에 보험종목이 신설되는 경우에는 경 제질서의 건전성을 해친 사실이 없으면 이에 대한 허가 를 받은 것으로 의제한다.", "보험업을 경영하려는 자는 각 보험종목별로 금융위원회 의 인가를 받아야 한다."], "answer": 3, "explanation": "정답은 ④이다. 보험업법 제4조 제1항은 “보험업을 경영하려는 자는 … 보험종목별로 금융위원회의 허가를 받아야 한다”고 규정한다. 지문은 이를 ‘인가’라고 적었는데, 보험업 진입 규제는 법문 전체에서 일관되게 ‘허가’다. 허가와 인가는 강학상 성질이 다를 뿐 아니라(허가=금지의 해제, 인가=법률행위의 효력 보충), 보험업법은 조문마다 둘을 구분해 쓰고 있어서 용어를 바꿔치기한 지문은 그 자체로 오답이 된다. 참고로 같은 법에서 ‘인가’가 쓰이는 대표적인 자리는 상호회사의 해산 결의(제138조) 등이다.", "wrongWhy": {"1": "제4조 제2항이 그대로 규정한다. 보험종목별 허가를 받으면 그 종목의 재보험 허가를 받은 것으로 보되, 제9조 제2항 제2호의 소액단기전문보험회사는 제외된다.", "2": "제4조 제1항 제2호는 손해보험업의 보험종목으로 화재·해상(항공·운송 포함)·자동차·보증·재보험을 열거한다. 재보험은 손해보험업의 한 종목이 맞다.", "3": "제4조 제4항의 허가 의제 규정에 해당한다. 보험종목 전부를 허가받은 자는 이후 그 안에서 종목이 신설되어도 새로 허가를 받을 필요가 없다."}, "terms": [{"t": "허가", "d": "법령상 일반적 금지를 특정인에게 해제해 주는 행정행위. 보험업 진입은 허가제다(법 제4조 제1항)"}, {"t": "허가 의제", "d": "별도 허가 절차 없이 허가를 받은 것으로 보아 주는 것(법 제4조 제2항~제4항)"}], "verify": "법"}, {"subject": "보험업법", "no": 3, "importance": "mid", "q": "보험업법상 보험업의 허가를 신청하는 자가 금융당국에 제출하는 신청서에 기재해야 할 사항으로 옳지 않은 것은?", "choices": ["주된 사무소 및 지점의 소재지", "시설, 설비 및 인력에 관한 사항", "대표자 및 임원의 성명·주민등록번호 및 주소", "자본금 또는 기금에 관한 사항"], "answer": 0, "explanation": "정답은 ①이다. 허가신청서의 기재사항은 시행령이 정하는데, 상호·주된 사무소의 소재지·대표자와 임원의 인적사항·자본금 또는 기금·시설과 인력 등이 열거되어 있을 뿐 ‘지점의 소재지’는 들어가지 않는다. 신설 회사가 허가를 신청하는 단계에서 지점망은 아직 확정되지 않는 것이 보통이고, 지점 설치는 허가 이후의 문제라서 신청서 기재사항에서 빠져 있다고 이해하면 외우기 쉽다. 한편 법 제5조는 신청서에 붙일 ‘첨부서류’로 정관, 업무 시작 후 3년간의 사업계획서(추정재무제표 포함), 보험종목별 사업방법서·보험약관·보험료 및 해약환급금 산출방법서 등을 규정한다. 기재사항(시행령)과 첨부서류(법 제5조)를 섞어 낸 문제가 자주 나오므로 두 목록을 구분해 두어야 한다.", "wrongWhy": {"2": "시설·설비 및 인력에 관한 사항은 기재사항에 포함된다. 허가 요건인 인적·물적 요건 심사의 기초 자료가 되기 때문이다.", "3": "대표자 및 임원의 성명·주민등록번호·주소는 기재사항이다. 임원 결격사유(제13조) 심사와 직결된다.", "4": "자본금 또는 기금에 관한 사항은 기재사항이다. 법 제9조의 최저 자본금 요건 충족 여부를 판단하는 항목이다."}, "terms": [{"t": "사업방법서", "d": "보험종목별 인수 기준·모집 방법 등을 적은 기초서류의 하나(법 제5조 제3호)"}], "verify": "령"}, {"subject": "보험업법", "no": 4, "importance": "mid", "q": "보험업법상 보험종목의 일부를 취급하려는 보험회사 (통신판매 및 소액단기전문보험회사는 제외)가 납입해야 하는 보험종목별 최저 자본금 또는 기금의 액수에 관한 사항으로 옳지 않은 것은?", "choices": ["연금보험(퇴직보험을 포함) : 200억 원", "화재보험 : 100억 원", "자동차보험 : 100억 원", "간병보험 : 100억 원"], "answer": 2, "explanation": "정답은 ③이다. 자동차보험의 최저 자본금은 200억 원인데 지문은 100억 원으로 적었다. 법 제9조 제1항은 원칙적으로 300억 원 이상의 자본금 또는 기금을 요구하면서, 보험종목의 일부만 취급하려는 경우에는 50억 원 이상의 범위에서 시행령이 달리 정하도록 위임하고 있다. 그 위임에 따라 종목별 금액이 정해지는데, 사고 빈도가 높고 지급 규모가 큰 종목일수록 금액이 높게 매겨진다는 점을 감으로 잡아 두면 좋다. 자동차보험·연금보험은 200억 원, 화재·상해·질병·간병보험은 100억 원, 해상보험은 150억 원 선이다. 통신판매전문보험회사는 제9조 제2항 제1호에 따라 위 금액의 3분의 2, 소액단기전문보험회사는 10억 원 이상의 범위에서 시행령이 정한 금액이 적용되므로, 문제에서 이 두 유형을 괄호로 제외해 두었다는 점도 함께 읽어야 한다.", "wrongWhy": {"1": "연금보험(퇴직보험 포함)은 200억 원으로, 지문과 일치한다.", "2": "화재보험은 100억 원으로, 지문과 일치한다.", "4": "간병보험은 제3보험의 종목으로 100억 원이며, 지문과 일치한다."}, "terms": [{"t": "소액단기전문보험회사", "d": "취급 종목·보험기간·보험금 규모가 제한된 소규모 전문보험회사. 최저 자본금이 10억 원 이상의 범위에서 따로 정해진다(법 제9조 제2항 제2호)"}], "verify": "령"}, {"subject": "보험업법", "no": 5, "importance": "mid", "q": "보험업법상 보험회사의 업무 범위에 관한 설명으로 옳지 않은 것은?", "choices": ["생명보험업과 제3보험업을 겸영하는 것은 허용되지 않는다.", "생명보험의 재보험은 생명보험회사의 겸영이 허용된다.", "보험회사는 자산유동화에 관한 법률에 따른 유동화 자산의 관리 업무를 겸영할 수 있다.", "손해보험업의 보험종목(재보험과 보증보험 제외) 일부만을 취급하는 보험회사와 제3보험업만을 경영하는 보험회사는 소득세법 제20조의3 제1항 제2호 각 목 외의 부분에 따른 연금저축계좌를 설정하는 계약을 겸영할 수 없다."], "answer": 0, "explanation": "정답은 ①이다. 보험업법 제10조가 금지하는 것은 “생명보험업과 손해보험업”의 겸영이고, 제3보험업은 이 금지의 대상이 아니다. 오히려 제4조 제3항은 생명보험업이나 손해보험업의 보험종목 전부를 허가받은 자는 제3보험업의 허가를 받은 것으로 본다고 정하고 있어, 제3보험은 양쪽 모두에 열려 있는 영역이다. 제3보험(상해·질병·간병)은 사람의 신체에 관한 보험이면서 실손 보상적 성격도 갖는 중간 영역이라, 생·손보 어느 쪽이든 취급할 수 있게 설계되어 있다고 이해하면 된다.", "wrongWhy": {"2": "제10조 제1호는 ‘생명보험의 재보험 및 제3보험의 재보험’을 겸영 금지의 예외로 명시한다.", "3": "보험회사가 겸영할 수 있는 금융업무의 하나로, 자산유동화에 관한 법률에 따른 유동화자산 관리업무가 인정된다.", "4": "연금저축계좌 설정 계약의 겸영은 손해보험업의 보험종목 전부를 취급하는 회사에 열려 있다. 일부만 취급하는 회사나 제3보험업만 경영하는 회사는 이에 해당하지 않으므로 지문은 옳다."}, "terms": [{"t": "겸영", "d": "하나의 보험회사가 둘 이상의 보험업을 함께 경영하는 것. 생명보험업과 손해보험업의 겸영은 원칙적으로 금지된다(법 제10조)"}, {"t": "제3보험", "d": "상해·질병·간병보험. 생명보험과 손해보험의 성격을 함께 갖는다(법 제4조 제1항 제3호)"}], "verify": "법"}, {"subject": "보험업법", "no": 6, "importance": "mid", "q": "보험업법상 보험회사인 주식회사의 자본감소와 조직 변경에 관한 설명으로 옳지 않은 것은?", "choices": ["자본감소를 결의한 경우에는 그 결의를 한 날부터 3주 이내에 결의의 요지와 재무상태표를 공고하여야 한다.", "자본감소를 결의할 때 대통령령으로 정하는 자본감소를 하려면 미리 금융위원회의 승인을 받아야 한다.", "주식회사에서 상호회사로의 조직변경시 기금의 총액은 300억 원 미만으로 하거나 설정하지 않을 수 있다.", "주식회사의 조직변경은 주주총회의 특별결의를 거쳐야 한다."], "answer": 0, "explanation": "정답은 ①이다. 보험업법 제18조 제1항은 “주식회사가 자본감소를 결의한 경우에는 그 결의를 한 날부터 2주 이내에 결의의 요지와 재무상태표를 공고하여야 한다”고 정한다. 지문의 3주는 틀렸다. 보험업법에서 회사 조직에 관한 공고 기간은 2주로 통일되어 있다시피 하다 — 자본감소(제18조), 조직변경(제22조), 합병(제151조)이 모두 2주다. 반면 상호회사 창립총회 소집은 7일(제39조)이라 결이 다르므로, ‘회사 조직 변동 공고 = 2주’와 ‘창립총회 소집 = 7일’을 묶어서 정리해 두면 숫자를 바꿔치기한 지문에 걸리지 않는다.", "wrongWhy": {"2": "제18조 제2항이 그대로 규정한다. 대통령령으로 정하는 자본감소는 미리 금융위원회의 승인을 받아야 한다.", "3": "주식회사가 상호회사로 조직을 변경할 때 기금의 총액은 300억 원 미만으로 하거나 아예 설정하지 않을 수 있다. 조직변경은 신규 설립이 아니어서 설립 시의 기금 요건을 그대로 적용하지 않는다.", "4": "조직변경은 회사의 근본적 변경이므로 주주총회의 특별결의(출석 주주 의결권의 3분의 2 이상 및 발행주식총수의 3분의 1 이상)를 거쳐야 한다."}, "terms": [{"t": "자본감소", "d": "주식회사의 자본금을 줄이는 것. 결의일부터 2주 이내 공고, 대통령령으로 정하는 경우 금융위원회 사전승인(법 제18조)"}], "verify": "법"}, {"subject": "보험업법", "no": 7, "importance": "mid", "q": "보험업법상 주식회사의 조직변경 절차에 관한 설명으로 옳지 않은 것은?", "choices": ["주식회사 조직변경 결의는 출석한 주주의 의결권의 3분의 2 이상의 수와 발행주식 총수의 3분의 1 이상의 수로써 해야 한다.", "회사는 조직변경의 결의가 있은 날로부터 3주 이내에 회사 채권자에 대하여 조직변경에 이의가 있으면 15일 이상의 기간을 정하여 이 기간 내에 이의를 제출하도록 공고하고, 알고 있는 채권자에 대하여는 개별적으로 최고해서 이의를 제출하게 해야 한다.", "주식회사의 이사는 조직변경에 관한 사항을 보험계약자 총회에 보고해야 한다.", "주식회사는 조직변경을 결의할 때 보험계약자 총회를 갈음하는 기관에 관한 사항을 정할 수 있다."], "answer": 1, "explanation": "정답은 ②이다. 보험업법 제22조 제1항은 “주식회사가 조직 변경을 결의한 경우 그 결의를 한 날부터 2주 이내에 결의의 요지와 재무상태표를 공고하고 주주명부에 적힌 질권자에게는 개별적으로 알려야 한다”고 정한다. 지문의 ‘3주 이내’가 우선 틀렸다. 이의제출 기간도 제22조 제2항이 준용하는 상법 제232조에 따라 1개월 이상이어야 하므로, 지문의 ‘15일 이상’ 역시 맞지 않는다. 한 지문 안에 숫자가 둘 들어 있고 둘 다 틀린 형태라, 앞의 숫자만 보고 넘기지 말고 끝까지 읽어야 하는 문제다.", "wrongWhy": {"1": "조직변경 결의는 주주총회 특별결의 요건(출석 주주 의결권의 3분의 2 이상 및 발행주식총수의 3분의 1 이상)에 따른다. 지문과 일치한다.", "3": "주식회사의 이사는 조직변경에 관한 사항을 보험계약자 총회에 보고해야 한다. 조직변경으로 사원이 되는 보험계약자에게 절차를 알리기 위한 규정이다.", "4": "주식회사는 조직변경을 결의할 때 보험계약자 총회를 갈음하는 기관에 관한 사항을 정할 수 있다. 계약자 수가 많아 총회 소집이 현실적으로 어려운 경우를 위한 장치다."}, "terms": [{"t": "조직변경", "d": "주식회사가 법인격의 동일성을 유지한 채 상호회사로 형태를 바꾸는 것(법 제20조 이하)"}, {"t": "보험계약자 총회", "d": "조직변경으로 사원이 될 보험계약자들의 의사결정 기관(법 제25조 이하)"}], "verify": "법"}, {"subject": "보험업법", "no": 8, "importance": "mid", "q": "보험업법상 보험회사에 관한 설명으로 옳지 않은 것은?", "choices": ["보험계약자나 보험금을 취득할 자는 피보험자를 위하여 적립한 금액을 다른 법률에 특별한 규정이 없으면 주식 회사의 자산에서 우선하여 취득한다.", "보험계약자나 보험금을 취득할 자는 피보험자를 위하여 적립한 금액을 주식회사가 보험업법에 따른 금융위원회 의 명령에 따라 예탁한 자산에서 다른 채권자보다 우선 하여 변제를 받을 권리를 가진다.", "보험회사는 그 상호 또는 명칭 중에 주로 경영하는 보험업의 종류를 표시해야 하지만 상호회사는 그 명칭 중에 상호회사라는 글자를 포함할 필요가 없다.", "상호회사의 사원은 회사의 채권자에 대하여 직접적인 의무를 부담하지 아니한다."], "answer": 2, "explanation": "정답은 ③이다. 보험업법 제35조는 “상호회사는 그 명칭 중에 상호회사라는 글자를 포함하여야 한다”고 못 박고 있다. 지문은 포함할 필요가 없다고 했으니 틀렸다. 제8조 제1항이 보험회사 일반에 대해 ‘주로 경영하는 보험업의 종류’를 상호나 명칭에 표시하라고 요구하는 것과는 별개의 의무다. 즉 상호회사는 ①업종 표시(제8조)와 ②‘상호회사’ 표기(제35조)를 모두 지켜야 한다. 상호회사는 사원인 보험계약자가 곧 회사의 구성원이라는 특수한 구조여서, 거래 상대방이 회사 형태를 오해하지 않도록 명칭 자체에 형태를 드러내게 한 것이다.", "wrongWhy": {"1": "제32조 제1항(보험계약자 등의 우선취득권)을 그대로 옮긴 지문이다.", "2": "금융위원회의 명령에 따라 예탁한 자산에 대한 우선변제권을 정한 규정으로, 제32조의 우선취득권과 짝을 이룬다.", "4": "상호회사의 사원은 회사 채권자에 대하여 직접적인 의무를 부담하지 않는다. 사원의 책임은 보험료 납입에 그치는 간접책임이다."}, "terms": [{"t": "우선취득권", "d": "보험계약자 등이 피보험자를 위하여 적립한 금액을 주식회사 자산에서 우선하여 취득할 권리(법 제32조)"}], "verify": "법"}, {"subject": "보험업법", "no": 9, "importance": "mid", "q": "보험업법상 상호회사의 발기인이 정관에 기재해야 할 사항으로 옳지 않은 것은?", "choices": ["사무소의 소재지", "회사의 공고 방법", "기금의 납입 방법", "잉여금의 분배 방법"], "answer": 2, "explanation": "정답은 ③이다. 보험업법 제34조는 상호회사 발기인이 정관에 적어야 할 사항으로 취급 보험종목과 사업 범위, 명칭, 사무소 소재지, 기금의 총액, 기금 갹출자가 가질 권리, 기금과 설립비용의 상각 방법, 잉여금의 분배 방법, 회사의 공고 방법, 성립 후 양수를 약정한 자산이 있으면 그 가격과 양도인의 성명, 존립시기나 해산사유를 정한 경우 그 시기·사유를 열거한다. ‘기금의 총액’은 있지만 ‘기금의 납입 방법’은 없다. 정관에는 회사의 뼈대에 해당하는 정적인 사항을 적고, 납입 절차 같은 집행 방법은 정관 밖에서 정하도록 한 구조라고 보면 된다. 총액·상각 방법·갹출자의 권리처럼 기금과 관련된 항목이 여럿 있어서 그 사이에 ‘납입 방법’을 끼워 넣으면 그럴듯해 보이는 것이 이 문제의 함정이다.", "wrongWhy": {"1": "‘사무소의 소재지’는 제34조의 기재사항이다.", "2": "‘회사의 공고 방법’은 제34조의 기재사항이다.", "4": "‘잉여금의 분배 방법’은 제34조의 기재사항이다. 상호회사는 사원에게 잉여금을 분배하므로 그 기준을 정관에 두게 했다."}, "terms": [{"t": "기금", "d": "상호회사의 설립 재원. 주식회사의 자본금에 대응하며, 갹출자는 정관이 정한 권리를 갖는다(법 제34조)"}], "verify": "법"}, {"subject": "보험업법", "no": 10, "importance": "mid", "q": "보험업법상 상호회사의 창립총회에 관한 설명으로 옳지 않은 것은?", "choices": ["상호회사의 설립등기는 창립총회가 끝난 날부터 2주 이내에 하여야 한다.", "상호회사의 발기인은 상호회사의 기금의 납입이 끝나고, 사원의 수가 예정된 수가 되면, 그날로부터 2주 이내에 창립총회를 소집해야 한다.", "사원은 정관에 특별한 규정이 있는 경우를 제외하고는 1인이 1의결권을 갖는다.", "창립총회는 사원 과반수의 출석과 그 의결권의 4분의 3 이상의 찬성으로 결의한다."], "answer": 1, "explanation": "정답은 ②이다. 보험업법 제39조 제1항은 “상호회사의 발기인은 상호회사의 기금의 납입이 끝나고 사원의 수가 예정된 수가 되면 그 날부터 7일 이내에 창립총회를 소집하여야 한다”고 정한다. 지문의 2주는 틀렸다. 이 문제에는 7일(창립총회 소집)과 2주(설립등기)가 나란히 등장하는데, 앞은 ‘총회를 부르는 기간’이고 뒤는 ‘총회가 끝난 뒤 등기하는 기간’이다. 보험업법의 회사 관련 기간은 대체로 2주인데 창립총회 소집만 7일이라는 점이 예외라서, 이 자리를 2주로 바꾼 지문이 반복해서 나온다.", "wrongWhy": {"1": "상호회사의 설립등기는 창립총회가 끝난 날부터 2주 이내에 해야 한다. 소집 기간(7일)과 등기 기간(2주)을 구분해야 한다.", "3": "상호회사의 사원은 정관에 특별한 규정이 없으면 1인 1의결권을 가진다. 출자액에 비례하는 주식회사와 다른 점이다.", "4": "제39조 제2항이 그대로 규정한다. 창립총회는 사원 과반수의 출석과 그 의결권의 4분의 3 이상의 찬성으로 결의한다."}, "terms": [{"t": "창립총회", "d": "상호회사 설립 과정에서 사원들이 여는 최초의 총회. 기금 납입과 사원 수 충족 후 7일 이내 소집(법 제39조)"}], "verify": "법"}, {"subject": "보험업법", "no": 11, "importance": "mid", "q": "보험업법상 보험설계사 등의 교육에 관한 설명으로 옳지 않은 것은?", "choices": ["보험회사등(보험회사, 보험대리점 및 보험중개사를 말함) 은 소속 보험설계사에게 법 제84조에 따라 최초로 등록한 날을 기준으로 매 2년이 된 날부터 6개월 이내에 시행령에서 정하는 기준에 따라 교육을 해야 한다.", "법인이 아닌 보험대리점 및 보험중개사는 등록한 날을 기준으로 매 2년이 된 날부터 6개월 이내에 시행령에 서 정하는 기준에 따라 교육을 받아야 한다.", "보험회사등은 전년도 불완전판매 건수 및 비율이 금융 위원회가 정하여 고시하는 기준 이상인 소속 보험설계사 에게 불완전판매방지교육을 추가적으로 해야 한다.", "보험협회는 매분기별로 교육 대상을 보험회사등에 알려야 하며, 보험회사등은 보험협회가 교육 대상을 파악하기 위해 필요한 정보를 제공해야 한다."], "answer": 3, "explanation": "", "wrongWhy": {}, "terms": []}, {"subject": "보험업법", "no": 12, "importance": "mid", "q": "보험업법상 자회사 소유에 대한 보고의무에 관한 설명이다. 괄호 안에 순서대로 들어갈 숫자로 옳은 것은? 가. 보험회사는 자회사를 소유하게 된 날부터 ( )일 이내에 그 자회사의 정관과 대통령령으로 정하는 서류를 금융위원회에 제출하여야 한다. 나. 보험회사는 자회사의 사업연도가 끝난 날부터 ( )개월 이내에 자회사의 재무상태표와 대통령령으로 정하는 서류를 금융위원회에 제출하여야 한다.", "choices": ["15, 1", "15, 3", "7, 1", "7     for (const sess of Object.keys(CONTENT[y])) {
      for (const subj of Object.keys(CONTENT[y][sess])) {
        for (const q of CONTENT[y][sess][subj]) {
          BANK.push({ ...q, year: y, sess, subject: subj,
                      id: `${y}-${subj}-${String(q.no).padStart(2, '0')}` });
        }
      }
    }
  }
  YEARS = [...new Set(BANK.map(q => q.year))].sort();
  SUBJECTS = [...new Set(BANK.map(q => q.subject))];
}

/* 문항은 임베드돼 있으면 그대로, 아니면 /api/content 에서 받는다 */
async function loadContent() {
  if (Object.keys(CONTENT).length) { buildBank(); return true; }
  try {
    const r = await fetch(API + '/content', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: S.token, doc: 'exam' }),
    }).then(r => r.json());
    if (r.error) throw new Error(r.error);
    CONTENT = r.data || {};
    buildBank();
    return BANK.length > 0;
  } catch (e) {
    $('stage').innerHTML = `<div class="empty-state"><h2>문항을 불러오지 못했습니다</h2>
      <p>${esc(e.message || '잠시 후 다시 시도해 주세요.')}</p></div>`;
    return false;
  }
}

/* ── 현재 목록 ── */
function list() {
  return BANK.filter(q => {
    if (S.year !== 'all' && q.year !== S.year) return false;
    if (S.subject !== 'all' && q.subject !== S.subject) return false;
    if (S.pin === q.id) return true;   // 방금 채점한 문항 — 정오답을 볼 때까지 자리를 지킨다
    const h = S.seen[q.id];
    if (S.mode === 'wrong') return !!(h && h.last === 'no');
    if (S.mode === 'due')   return isDue(q.id);
    if (S.mode === 'star')  return !!S.star[q.id];
    if (S.mode === 'unseen') return !h;
    return true;
  });
}

/* ══ 오답 노트의 뇌 ══════════════════════════════════════════
   틀린 날부터 하루가 지나면 복습 대상. 그 뒤로는 얼마나 묵혔는지에 따라
   1일차 → 3일차 → 1주 → 2주 이상으로 구간이 올라간다.
   틀린 횟수가 많을수록 앞에 세운다 — 어려운 문항이 먼저 눈에 띄어야 한다. */
const wrongIds = () => BANK.filter(q => (S.seen[q.id] || {}).last === 'no').map(q => q.id);
const wrongCount = () => wrongIds().length;

function elapsed(id) {
  const h = S.seen[id]; if (!h) return null;
  const t = h.noAt || h.at; if (!t) return null;
  return Math.floor((Date.now() - t) / DAY);
}
function isDue(id) {
  const h = S.seen[id];
  if (!h || h.last !== 'no') return false;
  const d = elapsed(id);
  return d === null || d >= 1;       // 시각 기록이 없는 옛 데이터는 바로 대상
}
const BUCKETS = [
  { k: 'd14', min: 14, label: '2주 넘게 방치' },
  { k: 'd7',  min: 7,  label: '1주일 지남' },
  { k: 'd3',  min: 3,  label: '3일 지남' },
  { k: 'd1',  min: 1,  label: '하루 지남' },
  { k: 'd0',  min: 0,  label: '오늘 틀림 · 내일부터' },
];
function bucketOf(id) {
  const d = elapsed(id);
  if (d === null) return BUCKETS[3];
  return BUCKETS.find(b => d >= b.min) || BUCKETS[4];
}
function dueList() {
  return BANK.filter(q => isDue(q.id)).sort((a, b) => {
    const ha = S.seen[a.id], hb = S.seen[b.id];
    return (hb.no || 1) - (ha.no || 1) || (elapsed(b.id) || 0) - (elapsed(a.id) || 0);
  });
}
const dueCount = () => BANK.reduce((n, q) => n + (isDue(q.id) ? 1 : 0), 0);
const starCount = () => Object.keys(S.star).filter(k => S.star[k]).length;

/* 지문에 나오는 전자교재 용어를 길이 순으로 최대 3개까지 골라 준다 */
function bookTerms(q) {
  const hay = q.q + ' ' + q.choices.join(' ');
  return TERMLINK.filter(t => hay.includes(t)).slice(0, 3);
}

/* ── 지표 ── */
function stats() {
  const ids = Object.keys(S.seen);
  const done = ids.length;
  let ok = 0, tot = 0;
  for (const id of ids) { ok += S.seen[id].ok || 0; tot += (S.seen[id].ok || 0) + (S.seen[id].no || 0); }
  $('stDone').textContent = done;
  $('stAcc').textContent = tot ? Math.round(ok / tot * 100) + '%' : '—';
  $('stWrong').textContent = wrongCount();
  $('stTotal').textContent = S.view === 'note' ? dueCount() : list().length;
  $('stTotal').nextElementSibling.textContent = S.view === 'note' ? '오늘 복습' : '이 조건 문항';
}
function syncTabs() {
  const note = S.view === 'note';
  $('tabQuiz').classList.toggle('on', !note);
  $('tabNote').classList.toggle('on', note);
  const d = dueCount(), w = wrongCount();
  const b = $('tabNoteN');
  b.textContent = d ? `${w} · 복습 ${d}` : w;
  b.classList.toggle('due', d > 0 && !note);
}

/* ══ 오답 노트 화면 ══════════════════════════════════════════ */
function weakRows(key) {
  const acc = {};
  for (const q of BANK) {
    const h = S.seen[q.id]; if (!h) continue;
    const k = q[key];
    const a = acc[k] || (acc[k] = { tried: 0, miss: 0, open: 0 });
    a.tried += (h.ok || 0) + (h.no || 0);
    a.miss += (h.no || 0);
    if (h.last === 'no') a.open++;
  }
  return Object.keys(acc).map(k => ({ k, ...acc[k], rate: acc[k].tried ? acc[k].miss / acc[k].tried : 0 }))
    .filter(r => r.tried).sort((a, b) => b.rate - a.rate);
}

function noteHtml() {
  const wrong = wrongIds();
  const due = dueList();
  const stars = starCount();
  const memos = Object.keys(S.note).filter(k => (S.note[k] || '').trim()).length;

  if (!wrong.length && !stars) {
    return `<div class="empty-state">
      <h2>오답 노트가 비어 있습니다</h2>
      <p>틀린 문항이 여기 모입니다. 과목·연도별 취약점, 복습할 때가 된 문항,
         내가 고른 오답까지 함께 기록됩니다. 맞히면 그 자리에서 빠집니다.</p></div>`;
  }

  /* 1 — 오늘 복습 */
  const cnt = {};
  for (const q of due) { const b = bucketOf(q.id); cnt[b.k] = (cnt[b.k] || 0) + 1; }
  const todayWrong = wrong.filter(id => elapsed(id) === 0).length;
  const chips = BUCKETS.filter(b => b.k !== 'd0' && cnt[b.k])
    .map(b => `<div class="duechip ${b.min >= 7 ? 'd0' : ''}"><b>${cnt[b.k]}</b>${esc(b.label)}</div>`).join('')
    + (todayWrong ? `<div class="duechip"><b>${todayWrong}</b>오늘 틀림 · 내일부터</div>` : '');

  const sched = `<section class="nsec">
    <h2>오늘 복습 <em>${due.length}문항</em></h2>
    <p class="hint">틀린 다음 날부터 복습 대상이 됩니다. 오래 묵힐수록, 여러 번 틀렸을수록 앞에 옵니다.</p>
    <div class="ncards">
      <div class="ncard ${due.length ? 'hot' : ''}"><b>${due.length}</b><span>복습할 때가 됨</span></div>
      <div class="ncard"><b>${wrong.length}</b><span>오답 노트 전체</span></div>
      <div class="ncard star"><b>${stars}</b><span>별표</span></div>
      <div class="ncard"><b>${memos}</b><span>메모 남긴 문항</span></div>
    </div>
    <div class="duegrid">${chips || '<div class="duechip">복습할 문항이 아직 없습니다</div>'}</div>
    ${due.length ? '<button class="btn pri" id="startDue" type="button">오늘 복습 시작 →</button>' : ''}
  </section>`;

  /* 2 — 취약점 */
  const bar = rows => rows.map(r => {
    const pct = Math.round(r.rate * 100);
    return `<div class="wk"><span class="nm">${esc(r.k)}</span>
      <span class="tr"><i class="${pct >= 50 ? 'hot' : ''}" style="width:${pct}%"></i></span>
      <span class="vl"><b>${pct}%</b> · 미해결 ${r.open}</span></div>`;
  }).join('');
  const bySubj = weakRows('subject'), byYear = weakRows('year');
  const repeat = BANK.filter(q => (S.seen[q.id] || {}).no >= 2 && S.seen[q.id].last === 'no')
    .sort((a, b) => S.seen[b.id].no - S.seen[a.id].no).slice(0, 8);
  const repHtml = repeat.length ? `<h2 style="margin-top:22px">반복해서 틀리는 문항 <em>${repeat.length}</em></h2>
    <p class="hint">두 번 이상 놓친 문항입니다. 여기부터 잡으면 점수가 가장 크게 움직입니다.</p>
    ${repeat.slice(0, 5).map(q => `<button class="mini" type="button" data-go="${esc(q.id)}">
        <span class="mno">${esc(q.subject)} ${esc(q.year)} ${String(q.no).padStart(2,'0')}</span>
        <span class="mtt">${esc(q.q)}</span>
        <span class="mct">${S.seen[q.id].no}회</span></button>`).join('')}
    ${repeat.length > 5 ? `<button class="fchip" data-nf="rep" type="button"
        style="margin-top:9px">${repeat.length}문항 전체 보기 →</button>` : ''}` : '';

  const weak = `<section class="nsec">
    <h2>취약점</h2>
    <p class="hint">푼 문항 대비 틀린 비율입니다. 막대가 붉어지면 절반 이상 놓치고 있다는 뜻입니다.</p>
    ${bar(bySubj)}
    ${byYear.length > 1 ? '<div style="height:14px"></div>' + bar(byYear) : ''}
    ${repHtml}
  </section>`;

  /* 3 — 오답 목록 */
  const F = S.nfilter;
  let items = BANK.filter(q => {
    const h = S.seen[q.id];
    if (F === 'star') return !!S.star[q.id];
    if (!h || h.last !== 'no') return false;
    if (F === 'due') return isDue(q.id);
    if (F === 'rep') return (h.no || 0) >= 2;
    if (F === 'memo') return !!(S.note[q.id] || '').trim();
    return true;
  });
  const fchip = (k, label, n) =>
    `<button class="fchip${F === k ? ' on' : ''}" data-nf="${k}" type="button">${esc(label)} ${n}</button>`;
  const chipbar = `<div class="fchips">
    ${fchip('all', '전체', wrong.length)}
    ${fchip('due', '복습 대상', due.length)}
    ${fchip('rep', '2회 이상', BANK.filter(q => (S.seen[q.id] || {}).no >= 2 && S.seen[q.id].last === 'no').length)}
    ${fchip('star', '별표', stars)}
    ${fchip('memo', '메모', memos)}
  </div>`;

  const groups = {};
  for (const q of items) (groups[`${q.subject} · ${q.year}`] ||= []).push(q);
  const keys = Object.keys(groups).sort();
  const listHtml = keys.length
    ? keys.map(k => `<div class="grp"><h3>${esc(k)}<em>${groups[k].length}</em></h3>
        ${groups[k].sort((a, b) => a.no - b.no).map(q => rowHtml(q)).join('')}</div>`).join('')
    : `<div class="empty-state"><h2>이 조건에 해당하는 문항이 없습니다</h2>
        <p>위 칩을 눌러 다른 조건으로 보세요.</p></div>`;

  return sched + weak + `<section class="nsec">
    <h2>오답 목록</h2>
    <p class="hint">문항을 누르면 그 문제로 바로 갑니다. 맞히면 노트에서 빠집니다.</p>
    ${chipbar}${listHtml}</section>`;
}

function rowHtml(q, compact) {
  const h = S.seen[q.id] || {};
  const d = elapsed(q.id);
  const memo = (S.note[q.id] || '').trim();
  const pick = h.pick != null ? h.pick + 1 : null;
  const ans = [q.answer, ...(q.altAnswers || [])].map(i => i + 1).join(', ');
  const when = d === null ? '' : d === 0 ? '오늘' : `${d}일 전`;
  return `<button class="nrow" type="button" data-go="${esc(q.id)}">
    <span class="no">${String(q.no).padStart(2, '0')}</span>
    <span class="tt">${esc(q.q)}</span>
    <span class="rt">
      <span class="starBtn${S.star[q.id] ? ' on' : ''}" data-star="${esc(q.id)}"
        role="button" aria-label="별표">${S.star[q.id] ? '★' : '☆'}</span>
    </span>
    <span class="sub">
      ${compact ? `<span>${esc(q.subject)} ${esc(q.year)}</span>` : ''}
      ${pick ? `<span class="pk">✕ 내 답 ${pick}</span>` : ''}
      <span class="an">정답 ${ans}</span>
      ${(h.no || 0) >= 2 ? `<span class="rep">${h.no}회 틀림</span>` : ''}
      ${when ? `<span>${when}</span>` : ''}
      ${isDue(q.id) ? '<span style="color:var(--sap2);font-weight:700">복습 대상</span>' : ''}
    </span>
    ${memo && !compact ? `<span class="memo">${esc(memo)}</span>` : ''}
  </button>`;
}

    stage.innerHTML = `<div class="empty-state"><h2>${EMPTY[0]}</h2><p>${EMPTY[1]}</p></div>`;
    $('navCount').textContent = '0 / 0';
    $('prevBtn').disabled = $('nextBtn').disabled = true;
    stats(); $('progFill').style.width = '0%';
    return;
  }
  if (S.pos >= L.length) S.pos = L.length - 1;
  if (S.pos < 0) S.pos = 0;
  const q = L[S.pos];
  const sel = S.sel[q.id];
  const shown = !!S.revealed[q.id];
  const correct = [q.answer, ...(q.altAnswers || [])];
  const h = S.seen[q.id];

  const el = elapsed(q.id);
  const tags = [
    `<span class="tag">${esc(q.year)} · ${esc(q.subject)}</span>`,
    (h && h.last === 'no' && el !== null)
      ? `<span class="tag hist-no">${el === 0 ? '오늘 틀림' : el + '일 전 틀림'}</span>` : '',
    h ? `<span class="tag hist-${h.last}">이력 정답 ${h.ok || 0} · 오답 ${h.no || 0}</span>` : '',
    q.source === 'ocr-verified' ? '<span class="tag ocr">OCR 복원</span>' : '',
  ].join('');

  const opts = q.choices.map((c, i) => {
    let cls = 'opt';
    if (shown) {
      if (correct.includes(i)) cls += ' correct';
      else if (i === sel) cls += ' wrong';
      else cls += ' dim';
    } else if (i === sel) cls += ' sel';
    return `<button type="button" class="${cls}" data-i="${i}"${shown ? ' disabled' : ''}>
      <span class="n">${i + 1}</span><span>${esc(c)}</span></button>`;
  }).join('');

  let tail = '';
  if (shown) {
    const good = correct.includes(sel);
    const why = q.wrongWhy && Object.keys(q.wrongWhy).length
      ? `<div class="why">${Object.keys(q.wrongWhy).sort()
          .map(k => `<div><b>${esc(k)}</b>${esc(q.wrongWhy[k])}</div>`).join('')}</div>` : '';
    const terms = (q.terms && q.terms.length)
      ? `<div class="terms">${q.terms.map(t =>
          `<div class="term"><b>${esc(t.t)}</b><span>${esc(t.d)}</span></div>`).join('')}</div>` : '';
    const bts = bookTerms(q);
    const bl = bts.length
      ? `<div class="blinks">${bts.map(t =>
          `<a class="blink" href="./book.html?q=${encodeURIComponent(t)}" target="_blank" rel="noopener">📖 ${esc(t)}</a>`
        ).join('')}</div>` : '';
    const note = q.explanation
      ? (q.verify === '령'
          ? '<div class="srcnote warn">근거 조문 중 시행령 부분은 원문 대조가 남아 있습니다</div>'
          : '<div class="srcnote">근거 조문 원문 대조 완료 · 보험업법 [시행 2025. 1. 31.]</div>')
      : '';
    tail = `<div class="verdict ${good ? 'ok' : 'no'}">
        <span class="mark">${good ? '✓' : '✕'}</span>
        <span>${good ? '정답입니다' : '오답입니다'}</span>
        <span class="sub">정답 ${correct.map(i => i + 1).join(', ')}</span>
      </div>
      <div class="expl${q.explanation ? '' : ' empty'}">${
        q.explanation ? esc(q.explanation) : '해설은 준비 중입니다.'}</div>${why}${terms}${note}
      <div class="memobox">
        <label for="memo">내 메모 — 왜 틀렸는지 한 줄로 남겨 두면 다음에 훨씬 빨리 잡힙니다</label>
        <textarea id="memo" data-memo="${esc(q.id)}" placeholder="예) 대주주·자회사만 자기자본 기준. 나머지는 전부 총자산."
        >${esc(S.note[q.id] || '')}</textarea>
        ${bl}
      </div>`;
  }

  stage.innerHTML = `<div class="card">
      <div class="qmeta"><span class="qno">Q${String(q.no).padStart(2,'0')}</span>${tags}
        <span class="starBtn${S.star[q.id] ? ' on' : ''}" data-star="${esc(q.id)}" role="button"
          aria-label="별표" title="별표" style="margin-left:auto">${S.star[q.id] ? '★' : '☆'}</span></div>
      <div class="stem">${esc(q.q)}</div>
      <div class="opts">${opts}</div>${tail}</div>`;

  $('navCount').textContent = `${S.pos + 1} / ${L.length}`;
  $('prevBtn').disabled = S.pos === 0;
  $('nextBtn').disabled = !shown && sel == null;
  $('nextBtn').textContent = shown ? (S.pos === L.length - 1 ? '처음으로 ↺' : '다음 →') : '확인 →';
  $('progFill').style.width = ((S.pos + 1) / L.length * 100) + '%';
  stats();
  hydrate();
}

/* ── 조작 ── */
document.addEventListener('click', e => {
  /* 별표 — 목록에서도 카드에서도 같은 버튼 */
  const st = e.target.closest('[data-star]');
  if (st) {
    e.stopPropagation();
    const id = st.dataset.star;
    if (S.star[id]) delete S.star[id]; else S.star[id] = true;
    S.dirty = true; render(); save(true); return;
  }
  /* 오답 목록 필터 칩 */
  const fc = e.target.closest('[data-nf]');
  if (fc) {
    S.nfilter = fc.dataset.nf; render();
    const secs = document.querySelectorAll('.nsec');
    if (secs.length) secs[secs.length - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  /* 오답 목록에서 문항으로 점프 */
  const row = e.target.closest('[data-go]');
  if (row) { jumpTo(row.dataset.go); return; }
  /* 오늘 복습 시작 */
  if (e.target.closest('#startDue')) {
    S.view = 'quiz'; S.mode = 'due'; S.year = 'all'; S.subject = 'all'; S.pos = 0; S.pin = null;
    $('selMode').value = 'due'; $('selYear').value = 'all'; $('selSubject').value = 'all';
    render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  const opt = e.target.closest('.opt');
  if (opt && !opt.disabled) {
    const L = list(); const q = L[S.pos];
    S.sel[q.id] = Number(opt.dataset.i);      // 확인 전에는 몇 번이든 바꿀 수 있다
    S.dirty = true; render();
  }
});

/* 메모 — 입력할 때마다 상태에 담고, 손을 뗀 뒤 조용히 저장한다 */
let memoT;
document.addEventListener('input', e => {
  const t = e.target.closest('[data-memo]');
  if (!t) return;
  S.note[t.dataset.memo] = t.value;
  S.dirty = true;
  clearTimeout(memoT); memoT = setTimeout(() => save(true), 900);
});

/* 노트에서 고른 문항으로 이동 — 그 문항이 보이도록 필터를 풀어 준다 */
function jumpTo(id) {
  const q = BANK.find(x => x.id === id); if (!q) return;
  S.view = 'quiz'; S.pin = null;
  S.year = 'all'; S.subject = 'all'; S.mode = 'wrong';
  $('selYear').value = 'all'; $('selSubject').value = 'all'; $('selMode').value = 'wrong';
  let i = list().findIndex(x => x.id === id);
  if (i < 0) {                       // 이미 맞혀서 오답 목록에 없으면 전체에서 찾는다
    S.mode = 'all'; $('selMode').value = 'all';
    i = list().findIndex(x => x.id === id);
  }
  S.pos = Math.max(0, i);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('tabQuiz').onclick = () => { S.view = 'quiz'; render(); };
$('tabNote').onclick = () => { S.view = 'note'; S.nfilter = 'all'; render(); window.scrollTo({ top: 0 }); };

$('nextBtn').onclick = () => {
  const L = list(); if (!L.length) return;
  const q = L[S.pos];
  if (!S.revealed[q.id]) {                    // 1단계 — 채점
    const sel = S.sel[q.id]; if (sel == null) return;
    const good = [q.answer, ...(q.altAnswers || [])].includes(sel);
    const h = S.seen[q.id] || { ok: 0, no: 0 };
    h[good ? 'ok' : 'no']++; h.last = good ? 'ok' : 'no';
    h.at = Date.now();
    if (good) { delete h.pick; delete h.noAt; }     // 맞히면 그 자리에서 노트 졸업
    else { h.pick = sel; h.noAt = h.at; }           // 내가 고른 오답을 남긴다
    S.seen[q.id] = h; S.revealed[q.id] = true; S.pin = q.id; S.dirty = true;
    render(); save(true);
    return;
  }
  // 2단계 — 이동. 붙잡아 두었던 문항을 놓아 준다
  S.pin = null;
  const L2 = list();
  if (!L2.length) { render(); toast('이 목록을 모두 정리했습니다'); return; }
  const still = L2.findIndex(x => x.id === q.id);
  if (still >= 0) S.pos = (still + 1) % L2.length;   // 아직 목록에 있으면 다음으로
  else S.pos = Math.min(S.pos, L2.length - 1);       // 노트를 졸업했으면 그 자리가 곧 다음 문항
  render();
};
$('prevBtn').onclick = () => { if (S.pos > 0) { S.pos--; render(); } };

/* 키보드 — 1~4 보기 선택, Enter 확인·다음, ←/→ 이동 */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  if ($('authOv').classList.contains('on')) return;
  if (e.key === 'n' || e.key === 'ㅜ') {           // n — 노트 열고 닫기
    S.view = S.view === 'note' ? 'quiz' : 'note'; render(); e.preventDefault(); return;
  }
  if (S.view === 'note') return;
  const L = list(); if (!L.length) return;
  const q = L[S.pos];
  if (e.key >= '1' && e.key <= '4') {
    if (S.revealed[q.id]) return;
    const i = Number(e.key) - 1;
    if (i < q.choices.length) { S.sel[q.id] = i; S.dirty = true; render(); e.preventDefault(); }
  } else if (e.key === 'Enter' || e.key === ' ') {
    if (!$('nextBtn').disabled) { $('nextBtn').click(); e.preventDefault(); }
  } else if (e.key === 'ArrowLeft') {
    if (S.pos > 0) { S.pos--; render(); }
  } else if (e.key === 'ArrowRight') {
    if (S.revealed[q.id]) { S.pos = (S.pos + 1) % L.length; render(); }
  }
});
$('saveBtn').onclick = () => save(false);

$('selYear').onchange = e => { S.year = e.target.value; S.pin = null; S.pos = 0; render(); };
$('selSubject').onchange = e => { S.subject = e.target.value; S.pin = null; S.pos = 0; render(); };
$('selMode').onchange = e => { S.mode = e.target.value; S.pin = null; S.pos = 0; render(); };
$('resetBtn').onclick = () => {
  if (!confirm('풀이 기록과 오답 노트를 모두 지웁니다. 계속할까요?')) return;
  S.sel = {}; S.seen = {}; S.note = {}; S.star = {}; S.revealed = {}; S.pos = 0; S.dirty = true;
  render(); save(false);
};

/* ── 저장 · 동기화 ── */
let toastT;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1600);
}
function snapshot() { return { sel: S.sel, seen: S.seen, note: S.note, star: S.star, v: 2 }; }
async function save(quiet) {
  const data = snapshot();
  if (S.local || !S.token) {
    store.set('sonsa:state', data);
    if (!quiet) toast('이 기기에 저장됨');
    S.dirty = false; return;
  }
  try {
    const r = await fetch(API + '/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: S.token, state: data }),
    }).then(r => r.json());
    if (r.error) throw new Error(r.error);
    if (!quiet) toast('계정에 저장됨');
    S.dirty = false;
  } catch (e) {
    store.set('sonsa:state', data);
    if (!quiet) toast('서버 저장 실패 — 이 기기에 저장했습니다');
  }
}
function applyState(d) {
  if (!d) return;
  S.sel = d.sel || {}; S.seen = d.seen || {};
  S.note = d.note || {}; S.star = d.star || {};
}
async function load() {
  if (S.local || !S.token) { applyState(store.get('sonsa:state')); return; }
  try {
    const r = await fetch(API + '/load', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: S.token }),
    }).then(r => r.json());
    if (r.state) applyState(r.state);
  } catch (e) { applyState(store.get('sonsa:state')); }
}
window.addEventListener('beforeunload', () => { if (S.dirty) save(true); });
setInterval(() => { if (S.dirty) save(true); }, 30000);

/* ── 인증 ── */
let authMode = 'login';
function who() {
  const b = $('whoBox');
  if (S.local) {
    b.innerHTML = '<span class="dot local"></span>이 기기에만 저장 <button class="btn sm" id="loginBtn" type="button" style="margin-left:8px">로그인</button>';
    $('loginBtn').onclick = () => openAuth();
  } else if (S.email) {
    b.innerHTML = `<span class="dot"></span>${esc(S.email)} <button class="btn sm" id="logoutBtn" type="button" style="margin-left:8px">로그아웃</button>`;
    $('logoutBtn').onclick = () => {
      S.token = S.email = null; store.del('sonsa:auth'); openAuth();
    };
  } else b.innerHTML = '';
}
function openAuth() { $('authOv').classList.add('on'); $('authErr').textContent = ''; }
function closeAuth() { $('authOv').classList.remove('on'); }
function setAuthMode(m) {
  authMode = m;
  $('authTitle').textContent = m === 'login' ? '로그인' : '회원가입';
  $('authGo').textContent = m === 'login' ? '로그인' : '가입하기';
  $('authSwap').innerHTML = m === 'login'
    ? '계정이 없으신가요? <a id="swapLink">회원가입</a>'
    : '이미 계정이 있으신가요? <a id="swapLink">로그인</a>';
  $('swapLink').onclick = () => setAuthMode(m === 'login' ? 'signup' : 'login');
}
$('authGo').onclick = async () => {
  const email = $('authEmail').value.trim().toLowerCase();
  const password = $('authPass').value;
  $('authErr').textContent = '';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('authErr').textContent = '이메일 형식을 확인해 주세요.'; return; }
  if (password.length < 6) { $('authErr').textContent = '비밀번호는 6자 이상이어야 합니다.'; return; }
  $('authGo').disabled = true;
  try {
    const r = await fetch(API + '/' + (authMode === 'login' ? 'login' : 'signup'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    }).then(r => r.json());
    if (r.error) throw new Error(r.error);
    S.token = r.token; S.email = r.email; S.local = false;
    store.set('sonsa:auth', { token: r.token, email: r.email });
    closeAuth(); who();
    if (!BANK.length) { if (!(await loadContent())) return; fillSelects(); }
    await load(); render();
  } catch (e) {
    $('authErr').textContent = e.message || '요청에 실패했습니다. 잠시 후 다시 시도해 주세요.';
  } finally { $('authGo').disabled = false; }
};
$('localLink').onclick = () => {
  S.local = true; store.set('sonsa:local', true);
  closeAuth(); who();
  if (!BANK.length) { loadContent().then(ok => { if (ok) { fillSelects(); applyState(store.get('sonsa:state')); render(); } }); return; }
  applyState(store.get('sonsa:state')); render();
};

/* ── 스크롤 진행 하어라인 ── */
addEventListener('scroll', () => {
  const h = document.documentElement;
  const p = h.scrollTop / (h.scrollHeight - h.clientHeight || 1);
  $('scrollbar').style.width = (p * 100) + '%';
}, { passive: true });

/* ── 리빌 — 화면에 들어올 때 한 번만 올라온다 ── */
let io = null;
function hydrate() {
  document.querySelectorAll('.expl, .why div, .term, .ncard, .grp').forEach(el => el.classList.add('reveal'));
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
  }), { threshold: .06 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
}

/* ── 밤낮 모드 — 저장값 > 시스템 설정 순 ── */
const mq = window.matchMedia('(prefers-color-scheme: light)');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = t === 'light' ? '#F2F3F6' : '#0A0A0C';
}
function initTheme() {
  const saved = store.get('sonsa:theme');
  applyTheme(saved || (mq.matches ? 'light' : 'dark'));
  mq.addEventListener('change', e => {
    if (!store.get('sonsa:theme')) applyTheme(e.matches ? 'light' : 'dark');
  });
}
$('themeBtn').onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  applyTheme(next); store.set('sonsa:theme', next);
};

/* ── 시작 ── */
function fillSelects() {
  $('selYear').innerHTML = '<option value="all">연도 전체</option>' +
    YEARS.map(y => `<option value="${esc(y)}">${esc(y)}년</option>`).join('');
  $('selSubject').innerHTML = '<option value="all">과목 전체</option>' +
    SUBJECTS.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
}
(async function init() {
  initTheme();
  setAuthMode('login');
  const offline = location.protocol === 'file:';
  const auth = store.get('sonsa:auth');
  const localOnly = store.get('sonsa:local');
  if (auth && auth.token && !offline) { S.token = auth.token; S.email = auth.email; }
  else if (localOnly || offline) { S.local = true; }
  who();

  if (!S.token && !S.local) { openAuth(); }
  const ok = await loadContent();
  if (!ok) return;
  fillSelects();
  await load();
  render();
})();
</script>
</body>
</html>
