<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>손해사정사 1차 · 관리자</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0A0C">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* ══════════════════════════════════════════════════════════════
   손해사정사 관리자 · S2S 디자인 언어
   메탈블랙(무대) · 은빛크리스탈(글자) · 블루사파이어(강조 한 곳)
   토큰은 index.html / book.html 과 같은 값을 쓴다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --void:#000; --bg:#0A0A0C; --surf:#141417; --surf2:#101013;
  --edge:#232328; --lift:#2E2E35;
  --tx:#F5F5F7; --tx2:#D6DBE3; --tx3:#9AA3B0; --tx4:#646C7A; --tx5:#3A404B;
  --sap:#1552D6; --sap2:#3E9BFF; --sap3:#8FD0FF; --sap-deep:#0A2A6E;
  --grad:linear-gradient(135deg,#06153F 0%,#0A2A6E 26%,#1552D6 62%,#3E9BFF 100%);
  --crystal:linear-gradient(180deg,#FFFFFF 0%,#C4CCD8 62%,#7F8794 100%);
  --glass:linear-gradient(160deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 42%,rgba(255,255,255,0) 100%);
  --ok:#4CC38A; --warn:#C9903A; --bad:#E0574F;
  --r:14px; --rp:999px;
  --f:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'SF Pro Display','Apple SD Gothic Neo',system-ui,sans-serif;
  --m:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.28,.11,.32,1);
  --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── 낮 모드 ── */
:root[data-theme="light"]{
  --void:#FFFFFF; --bg:#F2F3F6; --surf:#FFFFFF; --surf2:#FAFAFB;
  --edge:#E1E4EA; --lift:#C7CCD6;
  --tx:#0A0A0C; --tx2:#2C313A; --tx3:#5B636F; --tx4:#858C99; --tx5:#AEB4BF;
  --crystal:linear-gradient(180deg,#1D1D1F 0%,#3C424D 58%,#6B7280 100%);
  --glass:linear-gradient(160deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.35) 42%,rgba(255,255,255,0) 100%);
  --ok:#1D7D46; --warn:#9A6A18; --bad:#C8332C;
}
:root[data-theme="light"] .kpi,:root[data-theme="light"] .panel,:root[data-theme="light"] .login{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(16,24,40,.06),0 16px 40px -24px rgba(16,24,40,.28)}
:root[data-theme="light"] header{background:var(--surf)}
:root[data-theme="light"] .toast{box-shadow:0 12px 40px -16px rgba(16,24,40,.3)}
:root[data-theme="light"] tr:hover td{background:rgba(16,24,40,.035)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx2);font-family:var(--f);font-size:16px;
  line-height:1.65;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sap2);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}
.sp{flex:1}

/* ── 애플 효과 ── */
#scrollbar{position:fixed;top:0;left:0;height:2px;width:0;z-index:100;background:var(--grad);
  border-radius:0 2px 2px 0;transition:width .12s linear}
.reveal{opacity:0;transform:translateY(12px);
  transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.in{opacity:1;transform:none}
.rise{animation:rise .44s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.994)}to{opacity:1;transform:none}}
.kpi{animation:rise .5s var(--ease) both}
.kpi:nth-child(1){animation-delay:.02s} .kpi:nth-child(2){animation-delay:.06s}
.kpi:nth-child(3){animation-delay:.10s} .kpi:nth-child(4){animation-delay:.14s}
.kpi:nth-child(5){animation-delay:.18s} .kpi:nth-child(6){animation-delay:.22s}
.kpi b{transition:color .3s var(--ease)}
@media(prefers-reduced-motion:reduce){ .kpi,.rise{animation:none} .reveal{opacity:1;transform:none} }

/* ── 머리 ── */
header{border-bottom:1px solid var(--edge);background:var(--surf2);position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:auto 0 -1px 0;height:1px;
  background:linear-gradient(90deg,rgba(21,82,214,0) 0%,rgba(62,155,255,.5) 50%,rgba(21,82,214,0) 100%)}
.htop{display:flex;align-items:center;gap:var(--sp-4);padding:18px 0;flex-wrap:wrap}
.brand{flex:1;min-width:200px}
.kick{font-family:var(--m);font-size:10.5px;letter-spacing:.14em;color:var(--tx4);text-transform:uppercase}
h1{margin-top:5px;font-size:clamp(20px,3.2vw,27px);font-weight:800;letter-spacing:-.035em;
  line-height:1.12;background:var(--crystal);-webkit-background-clip:text;background-clip:text;color:transparent}
.appLink{font-size:13px;font-weight:700;color:var(--sap2);text-decoration:none;
  padding:8px 13px;border-radius:var(--rp);border:1px solid var(--edge);background:var(--surf);
  white-space:nowrap;transition:border-color .18s var(--ease),background .18s var(--ease)}
.appLink:hover{border-color:rgba(62,155,255,.45);background:rgba(21,82,214,.10)}
.themeBtn{width:40px;height:40px;padding:0;border-radius:50%;border:1px solid var(--edge);
  background:var(--surf);color:var(--tx3);cursor:pointer;display:grid;place-items:center;flex:none;
  transition:border-color .18s var(--ease),color .18s var(--ease)}
.themeBtn:hover{border-color:var(--lift);color:var(--tx)}
.themeBtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.themeBtn .sun{display:none} :root[data-theme="light"] .themeBtn .sun{display:block}
:root[data-theme="light"] .themeBtn .moon{display:none}

/* ── 버튼 ── */
.btn{padding:11px 18px;border-radius:var(--rp);border:1px solid var(--edge);background:var(--surf);
  color:var(--tx3);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;
  transition:border-color .18s var(--ease),color .18s var(--ease),background .18s var(--ease),transform .18s var(--ease)}
.btn:hover:not(:disabled){border-color:var(--lift);color:var(--tx)}
.btn:active:not(:disabled){transform:scale(.985)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;
  box-shadow:0 10px 30px -14px rgba(21,82,214,.95)}
.btn.pri:hover:not(:disabled){color:#fff;border-color:transparent;
  box-shadow:0 14px 36px -14px rgba(21,82,214,1)}
.btn.sm{padding:8px 13px;font-size:12.5px}
.btn.ok,.btn.ok:hover:not(:disabled){color:var(--ok);border-color:rgba(76,195,138,.42)}
.btn.no,.btn.no:hover:not(:disabled){color:var(--bad);border-color:rgba(224,87,79,.42)}

main{padding:var(--sp-6) 0 var(--sp-7)}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:12px;margin-bottom:var(--sp-6)}
.kpi{position:relative;background:var(--surf);border:1px solid var(--edge);border-radius:18px;
  padding:17px 19px;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0;background:var(--glass);pointer-events:none}
.kpi b{display:block;font-family:var(--m);font-size:25px;font-weight:700;color:var(--tx);
  letter-spacing:-.03em;line-height:1.1}
.kpi span{display:block;font-size:11px;color:var(--tx4);letter-spacing:.05em;margin-top:5px}
.kpi.hot b{color:var(--warn)}
.kpi.rev b{font-size:21px}

/* ── 탭 ── */
.tabs{display:flex;gap:4px;margin-bottom:var(--sp-4);flex-wrap:wrap}
.tab{border:none;background:none;font-size:13.5px;font-weight:700;color:var(--tx4);
  padding:9px 15px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:8px;
  transition:color .2s var(--ease),background .2s var(--ease)}
.tab:hover{color:var(--tx2);background:rgba(127,135,148,.11)}
.tab.on{color:var(--tx);background:rgba(127,135,148,.14)}
.tab .bdg{font-family:var(--m);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;
  background:var(--edge);color:var(--tx3)}
.tab.on .bdg{background:var(--sap);color:#fff}
.tab .bdg.hot{background:var(--warn);color:#1A1204}

/* ── 검색 ── */
.tools{display:flex;gap:9px;align-items:center;margin-bottom:var(--sp-4);flex-wrap:wrap}
.srch{position:relative;flex:1;max-width:300px;min-width:180px}
.srch input{width:100%;height:40px;border:1px solid var(--edge);border-radius:11px;
  background:var(--surf);color:var(--tx);padding:0 13px 0 34px;font-size:13.5px;outline:none;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.srch input:focus{border-color:var(--sap2);box-shadow:0 0 0 3px rgba(62,155,255,.15)}
.srch .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;
  width:14px;height:14px;pointer-events:none}
.srch .ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* ── 표 ── */
.panel{position:relative;background:var(--surf);border:1px solid var(--edge);border-radius:20px;overflow:hidden}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--surf2);text-align:left;padding:12px 15px;font-family:var(--m);font-size:10.5px;
  letter-spacing:.07em;color:var(--tx5);font-weight:700;border-bottom:1px solid var(--edge);
  white-space:nowrap;position:sticky;top:0;z-index:2;text-transform:uppercase}
td{padding:13px 15px;border-bottom:1px solid var(--edge);color:var(--tx2);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr{transition:background .18s var(--ease)}
tr:hover td{background:rgba(127,135,148,.06)}
td.mono{font-family:var(--m);font-size:12.5px;color:var(--tx3)}
td.em{font-family:var(--m);color:var(--sap2);font-weight:700}
td.wrap{white-space:normal;word-break:break-all;min-width:240px;max-width:420px;
  color:var(--tx4);font-size:12px;line-height:1.55}
td.acts{text-align:right}
.acts .row{display:inline-flex;gap:6px}

.pill{display:inline-block;font-family:var(--m);font-size:10.5px;font-weight:700;padding:3.5px 10px;
  border-radius:99px;border:1px solid var(--edge);color:var(--tx4);letter-spacing:.03em}
.pill.pending,.pill.amount_mismatch{color:var(--warn);border-color:rgba(201,144,58,.45)}
.pill.paid,.pill.matched,.pill.live{color:var(--ok);border-color:rgba(76,195,138,.42)}
.pill.rejected{color:var(--bad);border-color:rgba(224,87,79,.42)}
.pill.unmatched{color:var(--tx4)}
.pill.duplicate{color:var(--tx5)}

.empty{text-align:center;padding:var(--sp-7) var(--sp-4);color:var(--tx4)}
.empty h2{font-size:18px;font-weight:800;letter-spacing:-.025em;color:var(--tx2);margin-bottom:7px}
.empty p{font-size:13.5px;max-width:42ch;margin:0 auto}

/* ── 로그인 ── */
.login{position:relative;width:min(400px,100%);margin:14vh auto;background:var(--surf);
  border:1px solid var(--edge);border-radius:24px;padding:32px 30px;overflow:hidden}
.login::before{content:"";position:absolute;inset:0;background:var(--glass);pointer-events:none}
.login .kick{margin-bottom:9px}
.login h2{font-size:23px;font-weight:800;letter-spacing:-.035em;color:var(--tx);margin-bottom:7px;
  background:var(--crystal);-webkit-background-clip:text;background-clip:text;color:transparent}
.login p{font-size:13.5px;color:var(--tx4);margin-bottom:var(--sp-5);line-height:1.6}
.fld label{display:block;font-size:11px;letter-spacing:.05em;color:var(--tx4);margin-bottom:6px}
.fld input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--edge);
  background:var(--surf2);color:var(--tx);font-size:15px;outline:none;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.fld input:focus{border-color:var(--sap2);box-shadow:0 0 0 3px rgba(62,155,255,.15)}
.err{min-height:19px;font-size:12.5px;color:var(--bad);margin:10px 0;word-break:keep-all}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);opacity:0;pointer-events:none;background:var(--tx);color:var(--bg);
  font-size:13.5px;font-weight:700;padding:12px 22px;border-radius:var(--rp);
  transition:opacity .3s var(--ease),transform .3s var(--ease);z-index:90;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:600px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  th,td{padding:11px 12px}
  td.acts .row{flex-direction:column}
}
</style>
</head>
<body>

<div id="scrollbar"></div>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const api = (path, body) => fetch('/api' + path, {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(body || {}),
}).then(async r => {
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('서버 오류 ' + r.status));
  return d;
});

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
};

let TOKEN = store.get('sonsa:admin');
let TAB = 'pay', Q = '';
let DATA = { pay: [], cust: [], dep: [] };

let tT;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 1800); }

const p2 = n => String(n).padStart(2, '0');
const fmt = t => { if (!t) return '—'; const d = new Date(t * 1000);
  return `${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const day = t => { if (!t) return '—'; const d = new Date(t * 1000);
  return `${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())}`; };
const won = n => Number(n || 0).toLocaleString('ko-KR') + '원';
const live = u => !!(u && u.paid_until && u.paid_until * 1000 > Date.now());
const STAT = { pending:'대기', paid:'승인', rejected:'거절' };
const DEPST = { matched:'자동승인', unmatched:'미매칭', amount_mismatch:'금액불일치', duplicate:'중복' };

const themeSvg = `<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;

/* ══ 로그인 ══ */
function loginView(msg) {
  $('app').innerHTML = `<div class="wrap"><div class="login rise">
      <div class="kick">SONHAE · ADMIN</div>
      <h2>관리자</h2>
      <p>결제 승인과 입금 내역을 봅니다. 이 페이지는 검색엔진에 노출되지 않습니다.</p>
      <div class="fld"><label for="pw">관리자 비밀번호</label>
        <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호 입력"></div>
      <div class="err">${esc(msg || '')}</div>
      <button class="btn pri" id="go" style="width:100%">들어가기</button>
    </div></div>`;
  const go = async () => {
    $('go').disabled = true;
    try {
      const r = await api('/admin/login', { password: $('pw').value });
      TOKEN = r.adminToken; store.set('sonsa:admin', TOKEN);
      await boot();
    } catch (e) { loginView(e.message); }
  };
  $('go').onclick = go;
  $('pw').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('pw').focus();
}

/* ══ 본 화면 ══ */
function shell() {
  const pend = DATA.pay.filter(r => r.status === 'pending').length;
  const paidNow = DATA.cust.filter(live).length;
  const rev = DATA.pay.filter(r => r.status === 'paid').reduce((a, r) => a + (r.amount || 0), 0);
  const rcpt = DATA.pay.filter(r => r.status === 'paid' && r.receipt_phone).length;
  const auto = DATA.dep.filter(d => d.status === 'matched').length;
  const conv = DATA.cust.length ? Math.round(paidNow / DATA.cust.length * 100) : 0;

  $('app').innerHTML = `
    <header><div class="wrap htop">
      <div class="brand">
        <div class="kick">SONHAE · ADMIN</div>
        <h1>손해사정사 1차 · 관리자</h1>
      </div>
      <a class="appLink" href="./index.html">기출 앱 →</a>
      <button class="btn sm" id="reload" type="button">새로고침</button>
      <button class="btn sm" id="out" type="button">로그아웃</button>
      <button class="themeBtn" id="themeBtn" type="button" aria-label="밤낮 모드 전환" title="밤낮 모드 전환">${themeSvg}</button>
    </div></header>
    <main class="wrap">
      <div class="kpis">
        <div class="kpi${pend ? ' hot' : ''}"><b>${pend}</b><span>승인 대기</span></div>
        <div class="kpi"><b>${paidNow}</b><span>이용권 활성</span></div>
        <div class="kpi"><b>${DATA.cust.length}</b><span>가입자</span></div>
        <div class="kpi"><b>${conv}%</b><span>결제 전환</span></div>
        <div class="kpi rev"><b>${won(rev)}</b><span>누적 매출</span></div>
        <div class="kpi"><b>${auto}</b><span>자동 승인</span></div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab${TAB==='pay'?' on':''}" data-t="pay" type="button" role="tab">결제
          <span class="bdg${pend?' hot':''}">${pend ? pend + ' 대기' : DATA.pay.length}</span></button>
        <button class="tab${TAB==='cust'?' on':''}" data-t="cust" type="button" role="tab">가입자
          <span class="bdg">${DATA.cust.length}</span></button>
        <button class="tab${TAB==='dep'?' on':''}" data-t="dep" type="button" role="tab">자동 입금 감지
          <span class="bdg">${DATA.dep.length}</span></button>
      </div>
      <div class="tools">
        <div class="srch"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
          <input id="q" type="search" placeholder="이메일 · 코드로 찾기" value="${esc(Q)}"></div>
        <div class="sp"></div>
        <button class="btn sm" id="csv" type="button">CSV 내려받기</button>
      </div>
      <div class="panel rise"><div class="scroll" id="tbl"></div></div>
    </main>`;

  $('reload').onclick = () => boot();
  $('out').onclick = () => { TOKEN = null; store.del('sonsa:admin'); loginView(); };
  $('themeBtn').onclick = () => {
    const n = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(n); store.set('sonsa:theme', JSON.stringify(n));
  };
  $('csv').onclick = downloadCsv;
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { TAB = b.dataset.t; shell(); });
  $('q').oninput = e => { Q = e.target.value.trim().toLowerCase(); table(); };
  table();
}

const hit = r => !Q || [r.email, r.code, r.matched_email, r.phone, r.receipt_phone]
  .some(v => String(v || '').toLowerCase().includes(Q));
const rows = () => DATA[TAB].filter(hit);

const actCell = email => `<td class="acts"><span class="row">
  <button class="btn sm ok" data-ap="${esc(email)}" type="button">승인</button>
  <button class="btn sm no" data-rj="${esc(email)}" type="button">해제</button></span></td>`;

function table() {
  const el = $('tbl'); const list = rows();
  const nothing = (h, p) => `<div class="empty"><h2>${h}</h2><p>${p}</p></div>`;

  if (!list.length) {
    el.innerHTML = Q
      ? nothing('“' + esc(Q) + '” 결과가 없습니다', '다른 이메일이나 코드로 찾아보세요.')
      : { pay: nothing('결제 요청이 없습니다', '이용권 화면에서 코드를 발급받으면 여기 나타납니다.'),
          cust: nothing('가입자가 없습니다', '첫 가입이 들어오면 여기 쌓입니다.'),
          dep: nothing('수신된 입금 알림이 없습니다',
            '안드로이드 공기계의 MacroDroid 가 웹훅을 보내면 여기 기록됩니다. HOOK_SECRET 설정을 확인해 주세요.') }[TAB];
    return;
  }

  if (TAB === 'pay') {
    el.innerHTML = `<table><thead><tr>
        <th>이메일</th><th>코드</th><th>금액</th><th>상태</th><th>이용 만료</th>
        <th>현금영수증</th><th>요청</th><th>승인</th><th></th></tr></thead><tbody>
      ${list.map(r => `<tr>
        <td>${esc(r.email)}</td>
        <td class="em">${esc(r.code)}</td>
        <td class="mono">${won(r.amount)}</td>
        <td><span class="pill ${esc(r.status)}">${STAT[r.status] || esc(r.status)}</span></td>
        <td class="mono">${live(r) ? day(r.paid_until) : '—'}</td>
        <td class="mono">${esc(r.receipt_phone || '—')}</td>
        <td class="mono">${fmt(r.requested)}</td>
        <td class="mono">${fmt(r.approved)}</td>
        ${actCell(r.email)}</tr>`).join('')}</tbody></table>`;
  } else if (TAB === 'cust') {
    el.innerHTML = `<table><thead><tr>
        <th>이메일</th><th>휴대폰</th><th>이용권</th><th>만료</th>
        <th>코드</th><th>결제상태</th><th>가입</th><th></th></tr></thead><tbody>
      ${list.map(r => `<tr>
        <td>${esc(r.email)}</td>
        <td class="mono">${esc(r.phone || '—')}</td>
        <td><span class="pill ${live(r) ? 'live' : ''}">${live(r) ? '활성' : '없음'}</span></td>
        <td class="mono">${live(r) ? day(r.paid_until) : '—'}</td>
        <td class="em">${esc(r.code || '—')}</td>
        <td>${r.pay_status
          ? `<span class="pill ${esc(r.pay_status)}">${STAT[r.pay_status] || esc(r.pay_status)}</span>`
          : '<span class="pill">미요청</span>'}</td>
        <td class="mono">${fmt(r.created)}</td>
        ${actCell(r.email)}</tr>`).join('')}</tbody></table>`;
  } else {
    el.innerHTML = `<table><thead><tr>
        <th>시각</th><th>금액</th><th>코드</th><th>결과</th><th>매칭된 계정</th><th>알림 원문</th>
        </tr></thead><tbody>
      ${list.map(d => `<tr>
        <td class="mono">${fmt(d.created)}</td>
        <td class="mono">${d.amount ? won(d.amount) : '—'}</td>
        <td class="em">${esc(d.code || '—')}</td>
        <td><span class="pill ${esc(d.status)}">${DEPST[d.status] || esc(d.status)}</span></td>
        <td>${esc(d.matched_email || '—')}</td>
        <td class="wrap">${esc(d.raw || '—')}</td></tr>`).join('')}</tbody></table>`;
  }

  el.querySelectorAll('[data-ap]').forEach(b => b.onclick = () => act('/admin/approve', b.dataset.ap, b));
  el.querySelectorAll('[data-rj]').forEach(b => b.onclick = () => act('/admin/reject', b.dataset.rj, b));
}

async function act(path, email, btn) {
  const on = path.endsWith('approve');
  if (!confirm(`${email}\n\n${on ? '1년 이용권을 켭니다.' : '이용권을 해제합니다.'} 계속할까요?`)) return;
  btn.disabled = true;
  try {
    await api(path, { adminToken: TOKEN, email });
    toast(on ? '승인했습니다 · 1년 이용권 ON' : '이용권을 해제했습니다');
    await boot();
  } catch (e) { toast(e.message); btn.disabled = false; }
}

/* 현금영수증 발급용으로 표를 그대로 내려받는다 */
function downloadCsv() {
  const list = rows();
  if (!list.length) { toast('내려받을 행이 없습니다'); return; }
  const cols = {
    pay:  [['이메일','email'],['코드','code'],['금액','amount'],['상태','status'],
           ['이용만료','paid_until'],['현금영수증','receipt_phone'],['요청','requested'],['승인','approved']],
    cust: [['이메일','email'],['휴대폰','phone'],['이용권','paid_until'],['코드','code'],
           ['결제상태','pay_status'],['가입','created']],
    dep:  [['시각','created'],['금액','amount'],['코드','code'],['결과','status'],
           ['매칭','matched_email'],['원문','raw']],
  }[TAB];
  const time = new Set(['paid_until','requested','approved','created']);
  const cell = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const body = list.map(r => cols.map(([, k]) =>
    cell(time.has(k) ? (r[k] ? fmt(r[k]) : '') : r[k])).join(','));
  const csv = '﻿' + cols.map(c => cell(c[0])).join(',') + '\n' + body.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `손해사정사_${TAB}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(list.length + '행을 내려받았습니다');
}

async function boot() {
  if (!TOKEN) { loginView(); return; }
  try {
    const [a, b, c] = await Promise.all([
      api('/admin/list', { adminToken: TOKEN }),
      api('/admin/customers', { adminToken: TOKEN }),
      api('/admin/deposits', { adminToken: TOKEN }),
    ]);
    DATA = { pay: a.rows || [], cust: b.rows || [], dep: c.rows || [] };
    shell();
  } catch (e) {
    TOKEN = null; store.del('sonsa:admin');
    loginView(e.message);
  }
}

/* ── 애플 효과 ── */
addEventListener('scroll', () => {
  const h = document.documentElement;
  $('scrollbar').style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight || 1) * 100) + '%';
}, { passive: true });

/* ── 밤낮 모드 — 저장값 > 시스템 설정. 키는 앱과 공유한다 ── */
const mq = matchMedia('(prefers-color-scheme: light)');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = t === 'light' ? '#F2F3F6' : '#0A0A0C';
}
function savedTheme() {
  const raw = store.get('sonsa:theme');
  if (!raw) return null;
  try { return JSON.parse(raw); } catch (e) { return raw; }
}
applyTheme(savedTheme() || (mq.matches ? 'light' : 'dark'));
mq.addEventListener('change', e => { if (!savedTheme()) applyTheme(e.matches ? 'light' : 'dark'); });

/* r 새로고침 · / 검색 */
addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) return;
  if (!TOKEN) return;
  if (e.key === '/') { e.preventDefault(); const q = $('q'); if (q) q.focus(); }
  if (e.key === 'r' || e.key === 'ㄱ') boot();
});

boot();
</script>
